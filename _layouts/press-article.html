---
layout: default
---

<main id="main">

  <section class="blog-post">
    <div class="container" data-aos="fade-up">

      <div class="section-title">
        <h2>{{ page.title }}</h2>
        <p>{{ page.date | date: "%Y-%m-%d" }} · {{ page.source_name }}{% if page.author %} · {{ page.author }}{% endif %}</p>
      </div>

      <div class="post-content">
        {{ content }}
      </div>

      <div class="text-center mt-4 mb-4" style="padding: 20px; background: #f7f7f7; border-radius: 4px;">
        <p style="margin-bottom: 10px; color: #666; font-size: 0.9rem;">
          <i class="bi bi-info-circle me-1"></i>本頁為原始報導之備份存檔，內容版權歸原作者與媒體所有。
        </p>
        {% if page.source_url %}
        <a href="{{ page.source_url }}" target="_blank" rel="noopener noreferrer" class="btn-get-started" style="display:inline-block; padding:10px 30px; background:#E5A300; color:#fff; border-radius:4px; text-decoration:none;">
          <i class="bi bi-box-arrow-up-right me-1"></i>前往原始報導
        </a>
        {% endif %}
      </div>

      <div class="text-center mt-4">
        <a href="{{ '/press/' | relative_url }}" style="color:#E5A300;">&larr; 返回媒體報導列表</a>
      </div>

    </div>
  </section>

</main><!-- End #main -->

---
layout: default
---
{% include press-article-jsonld.html %}

<style>
  .press-archive-note { padding: var(--space-s) var(--space-m); background: var(--c-gold-tint); border: 1px solid var(--c-line); border-radius: var(--r-md); }
  .press-archive-note p { margin-bottom: var(--space-s); color: var(--c-muted); font-size: var(--step--1); }
  .press-back-link { display: inline-block; margin-top: var(--space-m); }
</style>

<main id="main">

  <section class="blog-post">
    <div class="container" data-aos="fade-up">

      <div class="section-title">
        <h1>{{ page.title }}</h1>
        <p>{{ page.date | date: "%Y-%m-%d" }} · {{ page.source_name }}{% if page.author %} · {{ page.author }}{% endif %}</p>
      </div>

      <div class="post-content">
        {{ content }}
      </div>

      <div class="text-center mt-4 mb-4 press-archive-note">
        <p>
          <i class="bi bi-info-circle me-1"></i>本頁為原始報導之備份存檔，內容版權歸原作者與媒體所有。
        </p>
        {% if page.source_url %}
        <a href="{{ page.source_url }}" target="_blank" rel="noopener noreferrer" class="btn btn-color">
          <i class="bi bi-box-arrow-up-right me-1"></i>前往原始報導
        </a>
        {% endif %}
      </div>

      <div class="text-center mt-4">
        <a href="{{ '/press/' | relative_url }}" class="press-back-link">&larr; 返回媒體報導列表</a>
      </div>

    </div>
  </section>

</main><!-- End #main -->

---
layout: default
---
{% include press-article-jsonld.html %}

<style>
  .section-title h1 { font-size: var(--text-2xl); font-weight: 700; letter-spacing: -0.015em; margin-bottom: 20px; padding-bottom: 20px; position: relative; }
  .section-title h1::before { content: ''; position: absolute; display: block; width: 120px; height: 0px; background: #ddd; bottom: 0px; left: calc(50% - 60px); }
  .section-title h1::after { content: ''; position: absolute; display: block; width: 28px; height: 2px; background: #F5C53B; bottom: 0; left: calc(50% - 20px); }
</style>

<main id="main">

  <section class="blog-post">
    <div class="container" data-aos="fade-up">

      <div class="section-title">
        <h1>{{ page.title }}</h1>
        <p>{{ page.date | date: "%Y-%m-%d" }} · {{ page.source_name }}{% if page.author %} · {{ page.author }}{% endif %}</p>
      </div>

      <div class="post-content">
        {{ content }}
      </div>

      <div class="text-center mt-4 mb-4" style="padding: 20px; background: #f7f7f7; border-radius: 4px;">
        <p style="margin-bottom: 10px; color: #666; font-size: 0.9rem;">
          <i class="bi bi-info-circle me-1"></i>本頁為原始報導之備份存檔，內容版權歸原作者與媒體所有。
        </p>
        {% if page.source_url %}
        <a href="{{ page.source_url }}" target="_blank" rel="noopener noreferrer" class="btn btn-color">
          <i class="bi bi-box-arrow-up-right me-1"></i>前往原始報導
        </a>
        {% endif %}
      </div>

      <div class="text-center mt-4">
        <a href="{{ '/press/' | relative_url }}" style="color:#E5A300;">&larr; 返回媒體報導列表</a>
      </div>

    </div>
  </section>

</main><!-- End #main -->

---
layout: default
---

<main id="main">

  <section class="blog-post">
    <div class="container" data-aos="fade-up">

      <div class="article-header">
        <h1>{{ page.title }}</h1>
        <p class="article-meta">{{ page.date | date: "%Y-%m-%d" }} · 作者 / 史旺基</p>
      </div>

      {% if page.cover_image %}
      <div class="article-cover">
        <img src="{{ page.cover_image | relative_url }}" alt="{{ page.title }}">
      </div>
      {% endif %}

      <div class="post-content">
        {{ content }}
      </div>

      {% if page.source_url %}
      <div class="article-source-link">
        <p>本文同步發佈於 LinkedIn</p>
        <a href="{{ page.source_url }}" target="_blank" rel="noopener noreferrer">閱讀原文 &rarr;</a>
      </div>
      {% endif %}

      <div class="article-footer-nav">
        <a href="{{ '/technical/articles/' | relative_url }}">&larr; 返回專欄文章列表</a>
      </div>

    </div>
  </section>

</main><!-- End #main -->

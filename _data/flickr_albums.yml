  - id: "72157605732055890"
    title: "2008-06-21 名家與NSO的對話—東方珍珠Midori"
    url: "https://www.flickr.com/photos/swanky-hsiao/albums/72157605732055890"
    date: "2008-06-21"
    photos: 13
    description: "<a href=\"http://www.ntch.edu.tw/Program/progrom_disp.asp?SortID=5&amp;ID=169033\">名家與NSO的對話—東方珍珠Midori</a>  節目介紹 沒有人會忘記，1982年小宓多里首次在美國登台與指揮大師祖賓‧梅塔及紐約愛樂一起演奏的樣子；也沒有人會相信，一個十一歲小女娃兒在卡內基廳錄製的獨奏唱片，竟能如此輝煌、大氣。宓多里無疑是二十世紀末期令人無法忘懷、永遠的天才！同時難能可貴的是，在其他天才經不起年齡增長的汰練時，宓多里依然持續成長，以不斷自我革新、自我挑戰的銳氣，更上層樓。宓多里的獨立個性，表現在她大膽自信的舞台丰采上。她總能主動的吸引觀眾注意力，並隨著她的演奏進入忘我之境。 NSO 前音樂總監簡文彬在任期內，系統化的擴展樂團曲目，挑戰樂團，也挑戰樂迷。這場從古典海頓、新古典浦羅柯菲夫、到追求象徵主義的印象樂派拉威爾，考驗指揮詮釋功力，NSO與簡文彬，熟稔的默契更能預見能量。細膩追求完美的密多里，奔放瀟灑的台灣指揮才子簡文彬與NSO國家交響樂團，將以當時被譽為「無人可勝任演奏的」－柴科夫斯基小提琴協奏曲，為NSO07/08樂季劃下令人讚嘆的句點。  指揮／簡文彬　WEN-PIN CHIEN, conductor 小提琴／宓多里　GOTO MIDORI, violin  海頓：G大調第九十四號交響曲《驚愕》 浦羅柯菲夫：D大調第一號交響曲《古典》 柴可夫斯基：D大調小提琴協奏曲 拉威爾：《華爾滋》"

  - id: "72157605732055824"
    title: "2008-06-01 Mercedes-Benz世紀古典音樂年系列二-安.蘇菲.慕特與特隆赫姆獨奏家樂團"
    url: "https://www.flickr.com/photos/swanky-hsiao/albums/72157605732055824"
    date: "2008-06-21"
    photos: 6
    description: "<a href=\"http://www.ticket.com.tw/dm.asp?P1=0000008395\">Mercedes-Benz世紀古典音樂年系列二-安.蘇菲.慕特與特隆赫姆獨奏家樂團</a>  主要贊助單位:台灣賓士  安‧蘇菲．慕特與特隆赫姆獨奏家樂團 Anne-Sophie Mutter and Trondheim Soloists  Mercedes-Benz Asia Tour 亞洲巡迴演出  國際樂壇的天之驕女 安．蘇菲．慕特 「自曼紐因以來最傑出的天才」~指揮帝王卡拉揚 安．蘇菲．慕特，十四歲時與卡拉揚首度合作，對音樂的熱情與驚為天人的精琴藝，讓指揮帝王讚不絕口。慕特的成名猶如一頁神話，天生屬於舞台的她，是國際樂壇的天之驕女，更擁有「小提琴女神」的絕美稱號。深受卡拉揚啟發的慕特，特別著重在演奏時與樂團完美無間的配合，散發不可忽視的風采。本次來台即將獻給觀眾韋瓦第的《四季》與多首經典樂曲，慕特以飽滿的琴音表達韋瓦第特殊的音樂語彙；慕特將作曲家的具像描寫聲昇華至抽象境界，巧思與戲劇性都令人期待!  熱情創新 特隆赫姆 特隆赫姆獨奏家樂團以他們在音樂上的高標準、年輕活力與活潑熱情的特色，得到許多樂評的讚賞與並吸引眾人的目光。樂團也以其音樂的多元性聞名，演奏內容例如巴洛克和浪漫時期的曲目、同時也有探戈、爵士、搖滾與現代音樂。  2008春季，慕特將與特隆赫姆獨奏家樂團聯袂來台，獻上睽違多年的協奏曲演出，驚艷台灣樂迷！  [Program] 巴爾托克：嬉遊曲，作品 113 巴哈：E大調小提琴協奏曲，作品 1042 韋瓦第：四季，作品8，「春、夏、秋、冬」 Bartok: Divertimento, Sz.113 Bach: Violin Concerto in E Major, BWV 1042 Vivaldi: Four Seasons, Op.8"


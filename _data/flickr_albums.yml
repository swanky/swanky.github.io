  - id: "72157608235278612"
    title: "2008-10-21 朱學恆\"你想過怎樣的大學生活\"講座@政大"
    url: "https://www.flickr.com/photos/swanky-hsiao/albums/72157608235278612"
    date: "2008-10-21"
    photos: 50
    description: "<a href=\"http://www.flickriver.com/photos/swanky-hsiao/sets/72157608235278612/\" rel=\"nofollow\">flickriver</a>  介紹from<a href=\"http://www.nccu.edu.tw/ann/bulletin.php?bul_key=1223949957&amp;partid=72\" rel=\"nofollow\">政大網站</a>  今年的政大很特別，我們希望透過一門叫做「大學入門」的通識課，來與學生一起重新認識大學，一起學習如何學習，一起開始認識世界，一起善用大學資源；通識教育中心特別邀請到朱學恆先生來為我們談一談，你想過怎樣的大學生活。我們希望透過朱學恆先生的演講，告訴你/妳，大學生如何用偉大的夢想改變世界，用具體的行動改變自己。  活動講者：朱學恆先生（想認識更多的朱學恆，請上朱學恒的阿宅萬事通事務所，網址http://blogs.myoops.org/） 活動時間：10/21（二）晚上19:00（18:30入場） 活動地點：藝文中心視聽館 活動人數：368人 活動對象： 1.選習大學入門課程的學生及他們親愛的老師與熱情的助教； 2.想知道大學生需要什麼，應該作些什麼的學生； 3.關心大學生在想些什麼，在意些什麼的政大導師、助教與親朋好友。  主辦單位：教務處、通識教育中心  活動聯絡人：吳明錡先生；分機：62858； e-mail：ctldsir@nccu.edu.tw  相關連結 <a href=\"http://blogs.myoops.org/\" rel=\"nofollow\">朱學恒的阿宅萬事通事務所</a>"


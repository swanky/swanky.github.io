  - id: "72157594188282396"
    title: "2003-05-25 英雄排戲"
    url: "https://www.flickr.com/photos/swanky-hsiao/albums/72157594188282396"
    date: "2006-07-05"
    photos: 13
    description: "大學時有堂國音學要戲劇表演 我們表演的是新世代精裝武俠大戲<b>英雄</b> 還有一段十分精采的<a href=\"http://video.google.com/videoplay?docid=7845795444139361521\">武打影片</a>  登場人物： 無聊 - swanky 殘障 - bala 豬血 - fansia 長榮航空 - qq 秦王 - hide  台詞： 我，自幼便為孤兒  也沒有名字，人稱&quot;無聊&quot;  人若無聊，便可專心練劍  我花十年  練成一種獨特劍法  秦王緊急召見我  是因為我已辦成一件驚動秦國的大事  ~~  (十年來從未有人上殿近寡人百步，可知為何？)  刺客猖獗  (不錯，刺客一日不除  我難解甲冑  如今你替寡人除此大害  要何封賞？)  為秦殺賊，不求封賞  (大秦治下，必有封賞  長空銀槍  長榮航空的銀槍  曾傷我大秦多少壯士！)  (宣我法令) (大王法令  有破刺客長空者  賞千金，封千戶候  上殿二十步  與王對飲) (據寡人接報，你是我秦國人)  臣，狼孟縣亭長無聊  (區區亭長，轄區不過十里  是我大秦國最小的官吏  有何本事  能破趙國的三大刺客？)  各個擊破  (仔細講來)  大王可知  殘障、豬血為一對情侶？  (寡人知道)  大王可曾聽說  他們三年無話？  (三年無話？為何？)  皆因豬血與長榮航空有一夜之情  使殘障耿耿於懷  (寡人怎麼未曾聽說呀？)  臣想方設法，才獲此密情  所以分化殘障豬血  必先取長榮航空  (嗯  你的做法  寡人猜到一二了)  大王賢明  (對長空，你以何為戰？)  劍！  在狼孟縣，臣掌管緝捕盜賊  六月初五  長榮航空在一家棋館內現身  臣打聽到  他常來此地下棋聽琴  ~~  慢！  (小小亭長，有何貴幹？)  此地歸我轄管  (如何？)  你乃大王通緝的要犯  我當拿你歸案！  ~~  老先生，請再撫一曲  武功琴韻雖不相同  但原理相通  都講求大音希聲之境界  臣和長榮航空面對面站著  有半個時辰  雖然誰也沒動  但決鬥已經在彼此的意念中繼續展開  ~~  (好快的劍！) (寡人自恃對秦國的一草一木瞭如指掌  卻不知狼孟縣內  居然有你這樣的人才) (殘障  豬血) (大王法令：刺客殘障，刺客豬血  素來聯手行刺  有誅殺二人中任何一人者) (賞萬金，封五千戶候  上殿十步  與王對飲) (三年前雙劍聯手攻入宮中  三千鐵甲竟不能擋！) (從此寡人將這大殿清掃一空  使刺客無法藏身！  你的劍竟能快過此二人？)  不能  (那你如何取勝？)  ~~  (求何字？)  劍  (客人是愛劍之人？)  在下只是完成先父的遺願  (幾尺？)  六尺四  (好身手  你不為求字而來  你是誰？)  在下實為秦人  替長榮航空帶來一句話  長榮航空說  他此生縱橫江湖，無牽無掛  唯有一人常留心中  (是誰？)  豬血  長榮航空說，豬血定會為他報仇  若要同在下一戰  明日秦軍大營  ~~  (我知道你看見了！)  (我故意讓你看見的！)  (我心裡根本沒有你！)  (你我都很蠢)  ~~  豬血與臣決戰時  因臣的計謀已然奏效  所以她氣血攻心，方寸大亂  臣贏得絲毫不費力氣  ~~  (想不到殘障豬血  竟如此怪異  也會被情所困) (寡人聽來  此戰你贏在二人不合上？)  是  (之所以不合，二人必是心胸狹小之輩)  是  (你講的故事倒也合情合理  可是寡人看來  你把一個人想簡單了)  誰？  (我  你想不想知  寡人對他們印象如何？  三年前  寡人曾與他們有過一戰) (在寡人看來  這二人光明磊落氣度不凡  絕非小人之輩) (所以，一夜之情是假  反目成仇是假  你所講故事更是假！) (只有一件事是真  長榮航空認識你們其中一人)  誰？  (你  寡人猜測你與長榮航空早就相識  長榮航空敗給你，只有一個理由)  什麼理由？  (故意求敗！  你與長空為行刺寡人  暗自串通  引我秦宮高手在一旁觀看作證) (佈此圈套，並不困難  難在長榮航空竟能將莫大信任  託付給你) (你的劍雖快  未必能勝得了長榮航空  但長榮航空卻自願倒在你的劍下) (如此胸懷，令人嘆服！  所以長榮航空是你的第一位捐助者) (寡人在想，長榮航空心高氣傲  自認天下無敵  他何以認定，他做不到的事情) (唯你能成功？  莫非你專為行刺而十年練劍？  你的劍術中藏有一式) (威力巨大，無人能比？) (得到長榮航空，你已能上殿二十步  為何還尋找殘障、豬血？) (寡人猜想，你所練行刺劍法  一定以十步為距  所以  你還需利用寡人的懸賞令) (尋找第二名捐助者  再進十步！)  ~~  在下只需一人相助  兩位請自行決定  明晨，秦軍大營  (好快的劍) (是) (長榮航空是當今大俠  竟能將性命交與此人！) (所以他能夠刺秦  我們要去) (去，就是死) (死就一起死)  ~~  (我比你晚了一步) (我怕把你傷得太重了) (應該是我去) (我要你活下去) (你死了，我怎麼活？) (你答應我，要好好的活  你說啊？) (好) (如月快要到了，我先走了)  ~~  (出你的劍！) (快動手！) (為刺秦我死而無憾  請動手吧！) (好快的劍！)  ~~  (長榮航空、豬血、殘障  分別以不同方式捐出自己  助你上殿十步來行刺寡人) (此三人能把生命託付給你  人生知己，也莫過於此了) (所以，你才是最危險的刺客！)  大王何以識破？  (寡人面前的燭火  感到了你的殺氣  他們三人，還有你  捨身取義) (寡人自愧不如！)  大王畢竟識破了  (寡人也是剛剛識破  否則怎會容你近我十步  秦人不會刺我  你到底是誰？)  臣實為趙人  臣家人被秦軍所殺  自幼流落在秦  被秦人收養  十年前知道身世  便決心行刺  (為趙而來  寡人明白了  寡人想知道  你練的快劍名稱)  如大王所猜，藏有一式  (哪一式？)  十步一殺！  (十步一殺！好名字  寡人的衛士  均在殿外的百步之遙  而你近寡人已十步) (看來  寡人今日是難逃此劫！) (你的殺氣在亂？)  大王見識過人  可是  大王也把一個人想簡單了  (誰？)  殘障！  ~~  臣要向他們證明，臣的劍不僅快，且精準無誤  只求兩位中當中一位  當眾受我一劍  騙過秦王耳目  (當眾受你一劍，豈是兒戲！  秦王不能殺)  長榮航空、豬血、殘障  三人中  唯有殘障的劍法與臣不相上下  (有我在，便要阻止你刺秦)  (我願助你  明早，秦軍大營見  你幫我一件事  出劍助我)  ~~  (殘障給你寫了哪兩個字？)  天下  (天下！)  殘障說  七國連年混戰，百姓受苦  唯有大王才能停止戰亂  一統天下  殘障希望我  為了天下  放棄刺殺大王  他跟我說： 一個人的痛苦  與天下人比  便不再是痛苦  趙國與秦國的仇恨  放到天下，也不再是仇恨  (沒想到最瞭解寡人的竟是寡人通緝的刺客！) (寡人孤獨一人  忍受多少責難，多少暗算  無人能懂寡人之心) (就連秦國的滿朝文武  也視寡人為暴君) (想不到殘障  與寡人素昧平生  才真正懂得寡人  與寡人心意相通！) (寡人想知道，你手無寸鐵，如何刺我？)  奪劍！  (此劍隨寡人征戰南北  也有十年了  寡人能有殘障大俠這樣的知己) (便是死，也足矣  你就為天下  決定這一劍吧！)  (寡人悟到了！) (殘障的這幅字  根本就不含劍法招式  寫的是劍法的最高境界) (劍法，其第一層境界  講求人劍合一  劍就是人，人就是劍  手中寸草，也是利器) (其第二層境界  講求手中無劍  劍在心中  雖赤手空拳，卻能以劍氣殺敵於百步之外) (而劍法的最高境界  則是手中無劍，心中也無劍  是以大胸懷包容一切) (那便是不殺  便是和平)  大王，這一劍臣必須刺  刺了這一劍  很多人都會死  而大王會活著 死去的人請大王記住  那最高的境界  ~~  (大王，殺不殺？ 大王，殺不殺？ 大王，殺不殺？殺不殺？) (居心叵測，大膽行刺  殺無赦  這是大王制定的秦國大法！) (大王要得天下  一定要令行禁止  給世人一個榜樣！) (大王，殺！ 大王，殺！ 大王，殺！ 大王，殺！) (殺！)"


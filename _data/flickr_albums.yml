  - id: "72157609047529964"
    title: "2008-11-08 來自法國的鋼琴王子—亞歷山大．薩洛鋼琴之夜"
    url: "https://www.flickr.com/photos/swanky-hsiao/albums/72157609047529964"
    date: "2008-11-14"
    photos: 5
    description: "<a href=\"http://swanbear.blogspot.com/2008/11/blog-post.html\">blog post</a>  法國新世代偶像級鋼琴家。畢業於巴黎音樂院，曾贏得慕尼黑和巴塞隆納鋼琴大賽金牌。1997年，為法國國立圖書館演出開幕音樂會，所灌錄的作品榮獲兩項法國唱片大獎。薩洛演出繁忙，足跡遍及全世界。 薩洛的演奏，觸鍵輕盈，技巧完美，洋溢自由自在的詩意，煥發溫暖色彩，贏得樂評家諸多讚賞。華盛頓郵報稱讚他︰「是一位同時有著出色的思想與行動力的鋼琴家」。他曾與國家交響樂團合作「拉威爾左手協奏曲」，此次將以親自排出之拿手曲目，以饜國內愛樂者。   曲目： COUPERIN 庫普蘭： • Les Ombres errantes (25e ordre) 漂泊的幽靈(第25套組曲) • Bruit de guerre (extrait de La Triomphante, 10e ordre)戰爭的噪音(選自第10套組曲《勝利》) • Le Carillon de Cithére (14e ordre) 西特爾島的鐘聲(第14套組曲) • Le Tic-Toc-Choc ou Les Maillotins (18e ordre) 滴答振動,木匠做坊的雜音(第18套組曲) RAVEL 拉威爾： • Miroirs 鏡 CHOPIN 蕭邦： • Nocturne op post en ut dièse mineur (C sharp minor) 夜曲(升C小調) • Fantaisie op 49 幻想曲 作品49 • Fantaisie-Impromptu 幻想即興曲 • Mazurka op 17 n°4 en la mineur (in A minor) 馬厝卡舞曲(A小調)作品17 • Nocturne op 9 n°2 夜曲第二號 作品9 • Ballade n°1 op 23 en sol mineur (in G minor) 敘事曲第一號 作品23 (G小調)"


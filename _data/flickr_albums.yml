  - id: "72157606649733606"
    title: "2008-08-09 我很帥，我拉小提琴－五嶋龍與北市交"
    url: "https://www.flickr.com/photos/swanky-hsiao/albums/72157606649733606"
    date: "2008-08-10"
    photos: 6
    description: "<a href=\"http://www.artsticket.com.tw/CKSCC2005/Product/Product00/ProductsDetailsPage.aspx?ProductId=c4QWP9sLuh8K4/lcIC4uOg\">節目資訊</a>  五嶋龍是國際知名小提琴家五嶋綠(Midori)的親弟弟，1988年出生於紐約，3歲開始學琴，7歲就在日本札幌的太平洋音樂節登台，以一曲帕格尼尼第一號小提琴協奏曲一鳴驚人。 至今，五嶋龍曾與許多國際知名樂團合作演出，包括美國華盛頓國家交響樂團、英國倫敦交響樂團、加拿大溫哥華交響樂團、義大利托斯卡尼尼交響樂團等;琴藝過人的他，更是許多大師如：阿胥肯納吉、羅林•馬捷爾、麥斯基等人點名合作的對象。在家鄉日本，他更是演出邀約不斷，風靡無數樂迷。 兼具東方的謙和與西方的熱情灑脫，雖然目前是哈佛大學的高材生，五嶋龍可不是個書呆子，既忙於演奏事業，還是空手道黑帶高手、吉他好手，也跟同好組室內樂團「玩」音樂，「天才」美名可不是過譽。 在這場音樂會裡，五嶋龍將帶來當初一曲成名的話題曲目《帕格尼尼第一號小提琴協奏曲》。此外，德國柏林喜歌劇院首席指揮王進還為您帶來羅西尼的《塞爾維亞的理髮師序曲》，以及《羅馬之泉》、《羅馬節慶》等動聽的美麗樂曲。   演出者： 小提琴／五嶋龍 (Ryu Goto, violin) 指揮／王進 (Wang Jin, conductor) 臺北市立交響樂團 （Taipei Symphony Orchestra）  曲目： 羅西尼：歌劇《塞爾維亞理髮師》序曲 G. Rossini：“Barbiere di Siviglia”Overture 帕格尼尼：D大調第一號小提琴協奏曲，作品6 N. Paganini：Violin Concerto No.1 in D major, Op.6 雷史畢基：羅馬之泉 O. Respighi：Fontane di Roma 雷史畢基：羅馬節日 O. Respighi：Feste romane"


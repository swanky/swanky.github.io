    description: "<a href=\"http://www.marketwest.co.uk/flickr/share_set/72157602718929542/\">全小圖</a>  MD：NikkiBaby (小芝) <a href=\"http://www.wretch.cc/blog/NikkiBaby&amp;category_id=9964921\">照片文</a> | <a href=\"http://www.pixnet.net/NikkiBaby\">相簿</a> | <a href=\"http://www.wretch.cc/blog/NikkiBaby&amp;article_id=6433341\">228捷運蛋糕之旅</a>  PTT貼文： 拍照的主題是MD定的＊陽光。色彩。微笑＊ 想要拍出在陽光照射下的咖啡廳喝飲料與鄰家女孩的感覺 我知道228公園裡面有一個咖啡廳 交通也蠻方便 就決定在228公園拍了  當天天氣不錯 有一點點稍微陰陰的 陽光沒有很強  拍攝過程中 小芝有給我一種很專業的感覺 不管對取景、打光等等都會提供意見。 也會跟我們討論，相當好相處  面對鏡頭的表情很生動 不笑的時候給人可愛的感覺 笑起來就變成憨憨的 (憨是MD自己說的，但我也認同她自己的看法)  整個作品我想應該是算有符合MD的主題吧~ :)"


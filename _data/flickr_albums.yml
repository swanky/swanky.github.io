    url: "https://www.flickr.com/photos/swanky-hsiao/albums/72157623200492865"
    date: "2010-02-01"
    photos: 226
    description: "虎妹寶虤精品有限公司年終尾牙盛典 X 2046斜對面團榮譽團員崔惟楷化名鳥崔生日趴  活動簡介 公告：欲出席寶虤尾牙與小崔生日趴但不知道地點的遊客們，請於pm8:30至公館The wall集合,搭乘遊園巴士前往,或親自電洽小蜜酥詢問,謝謝合作。另外歡迎自行騎腳踏車前往會場。   一年一度萎大的盛事即將來臨！舉國歡慶的精品套裝行程！ 虎妹寶虤精品有限公司尾牙盛典 X 2046斜對面團榮譽團員鳥崔生日趴！ 使上最精采最妖壽最有梗的crossover活動與節目,等您來挑戰！ 現場不但有振奮人心的表演 應有盡有的道具 吃到你便祕的高級烤肉 喝到你仆街的的酒水飲料 更有大型煙火秀 花式溜冰秀 fixed gear轉圈圈秀 露天麻將秀 露天德州噗嗑秀 曼徹濕特足球踢到你腿軟 比手畫腳比到你手軟射飛鏢射到你脫肛 疊疊樂輸的人脫一件 18禁神奇即興小遊戲 舞龍舞獅弄到你好濕 壽星鳥崔個人鹹溼live show........以上活動皆由2046斜對面團專業的尾牙暖場主持人強卓先生負責！ 屆時還有&quot;精心策劃一個月,故作神祕的年度頒獎典禮&quot;和&quot;保時捷我燒給你,頭獎穩潔一瓶抽獎活動&quot;呦！  歡迎各界莖陰共襄盛舉！愛唬妹的朋友一定要來參加呦！"


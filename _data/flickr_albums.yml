  - id: "72157607986698779"
    title: "2008-10-12 魯賓斯坦的榮耀—胡瀞云 ＆ 台北愛樂"
    url: "https://www.flickr.com/photos/swanky-hsiao/albums/72157607986698779"
    date: "2008-10-13"
    photos: 7
    description: "魯賓斯坦的榮耀—胡瀞云 ＆ 台北愛樂 地點:國家音樂廳/ 時間:12  OCT  2008(Sun.) 19:30  魯賓斯坦國際鋼琴大賽得主-胡瀞云 「她擁有布蘭德爾的張力、普萊亞的詩意、巴倫波英的深度以及鋼琴女王阿格麗希的風采」 - 以色列知名樂評家Chanoch Ron  鋼琴家胡瀞云，擁有美國茱莉亞音樂院碩士學位。於今年3月憑著穩健及精湛的演出，擊敗來自全球的200多位鋼琴好手，獲得向來有「音樂界奧林匹克大賽」之稱的「魯賓斯坦國際鋼琴大賽」銀牌獎，同時獲得「最具觀眾人緣獎」。台灣過去在1983年有鋼琴家陳宏寬獲第二名，1992年陳瑞斌則獲第四名。胡瀞云是台灣音樂學子近年來所獲的國際大獎當中最好的一個，堪稱台灣之光。  獲獎後的胡瀞云為世界各國著名樂團爭相邀演的獨奏家，2008年秋季即將展開一系列的世界巡迴音樂會；世界首站選擇家鄉台灣，將與優秀的台北愛樂青年管弦樂團合作演出一舉榮獲魯賓斯坦國際鋼琴大賽決賽得獎曲目的浦羅柯菲夫「C大調第三號鋼琴協奏曲作品26」，讓台灣的聽眾能搶先一飽耳福，並藉由胡瀞云詮釋的得獎曲目感受國際大賽的無限魅力!!指揮鄭立彬更將在本場音樂會中詮釋俄國五人組李姆斯基- 柯薩可夫的名曲「天方夜譚」。青年音樂家激盪出的絢麗火花，將在10月12日閃耀台北國家音樂廳!  演出者： 指揮／鄭立彬 鋼琴／胡瀞云 台北愛樂青年管弦樂團"


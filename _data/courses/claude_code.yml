faq:
  - q: "沒寫過程式也能上嗎？"
    a: "可以。課程不分職稱與前後端，PM／企劃也能用 AI 一條龍做出 MVP；重點是學會判斷與交付，不是背語法。"
  - q: "需要先準備什麼環境？"
    a: "一台筆電、裝好 Claude Code 並登入即可；開課前有環境健診場協助，裝不起來也有網頁版備援。"
  - q: "和坊間 AI 工具教學有何不同？"
    a: "全程手把手實機、每人帶一條真實貫穿專案，9 堂連起來就是一次完整的『需求到上線』交付，並補軟體工程基本功。"
  - q: "企業包班可以客製嗎？"
    a: "可以。可依貴團隊的技術棧與痛點客製演練、納入貴公司的規格驅動流程，並規劃課後內部飛輪。"

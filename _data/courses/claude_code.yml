# Claude Code 企業內訓課程 — 招生資料單一真相
# 由 /education/claude-code/index.html 以 Liquid 讀取生成頁面。
name: "Claude Code 一條龍 AI 交付力"
tagline: "不分職稱、不分前後端，讓每個人都能用 AI 一條龍獨立交付需求"
subtitle: "需求分析 → 設計 → 開發 → QA → 交付，全生命週期一個人扛，AI 當你的團隊"
lead: >
  一套 9 堂、每堂約 1 小時、線上遠距、全程手把手實機的內訓。以《Claude Code 橙皮書》為主線，
  把「規格驅動 × 測試驗證」的開發方式，變成每個人都做得到的肌肉記憶。

format:
  - "9 堂 × 每堂約 60 分鐘"
  - "線上遠距・全程每人實機"
  - "每週一堂・課間有銜接作業"
  - "全個人制・每人一條貫穿專案"

audience:
  - "想 10 倍效率的工程師（不分前後端）"
  - "想自己做出 MVP 的 PM／企劃"
  - "想導入 AI 開發、提升交付力的團隊"

# 三條主軸
pillars:
  - title: "判斷力是你最大的槓桿"
    desc: "Claude Code 解決『怎麼寫』，但『寫什麼』是你的判斷。"
  - title: "工具會變、心法不變"
    desc: "工具只示範、不綁定；練的是可長期複利的心法。"
  - title: "一條龍 E2E 交付"
    desc: "人人能獨立走完需求分析到上線的全流程。"

# 9 堂大綱（招生頁與教學 repo docs/00_課程總覽.md 對齊）
lessons:
  - id: L1
    name: "為什麼是 Claude Code＋10 分鐘上手"
    stage: "心態＋環境"
  - id: L2
    name: "你的第一個專案：對話式編程實戰"
    stage: "第一次 E2E"
  - id: L3
    name: "核心工作流：五個拉開效率的模式"
    stage: "工作法"
  - id: L4
    name: "CLAUDE.md：給專案寫一張地圖"
    stage: "設計（SD）"
  - id: L5
    name: "進階對話技巧：需求分析與規格"
    stage: "需求分析"
  - id: L6
    name: "擴展能力：Skills／Hooks／MCP"
    stage: "開發加速"
  - id: L7
    name: "多 Agent 協作：一人指揮 AI 團隊"
    stage: "規模化開發"
  - id: L8
    name: "規格驅動 × TDD 驗測閉環"
    stage: "QA・驗測"
  - id: L9
    name: "從零構建完整產品＋心智模型"
    stage: "交付・上線"

# 學成（帶得走）
outcomes:
  - "獨立把一個需求從頭交付到上線"
  - "帶走自己的 CLAUDE.md、Skill 與貫穿專案"
  - "一個 before/after 生產力指標（ROI）"
  - "建立可長期複利的 AI 協作心法"


  - ability: "心法"
    indicator: "能說出「判斷力是槓桿」「工具會變心法不變」「驗證比開發重要」"
    lessons: "全程"

# 課後飛輪（一句帶過）
flywheel: "課程設計也包含課後機制：學員產出的 Skill／CLAUDE.md 收進團隊共享庫，搭配常駐 Q&A、定期 office hours 與種子成員（champions）——讓一次性課程變成持續能力。"


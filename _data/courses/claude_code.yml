# FAQ（資訊性，不涉招生）
faq:
  - q: "沒寫過程式也能上嗎？"
    a: "可以。課程主張「不分職稱、不分前後端」——PM／企劃也能用對話式編程完成自己的專案。需要的只是願意動手：每堂都有實機演練，跟著做就能跟上。"
  - q: "需要先準備什麼環境？"
    a: "開課前會有一場線上「環境健診」，由講師與助教協助安裝與登入；真的裝不起來也有 claude.ai/code 網頁版備援，當天一樣能上手。"
  - q: "和坊間的 AI 工具教學差在哪？"
    a: "多數教學停在「工具怎麼用」。這門課教的是「一條龍交付」：需求分析、規格、測試、上線的完整流程，搭配每堂一則軟體工程心法——工具會變，心法不變。"
  - q: "課程可以依團隊情境調整嗎？"
    a: "可以。貫穿專案鼓勵學員帶自己的真實需求進來；課綱深度與案例也能依團隊的技術棧與產業脈絡調整。"


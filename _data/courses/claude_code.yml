capabilities:
  - ability: "需求分析"
    indicator: "能用採訪／Example Mapping 把需求寫成可驗證的 SPEC"
    lessons: "L5"
  - ability: "系統設計（SA／SD）"
    indicator: "能用 Plan 模式討論架構、用 CLAUDE.md 固化設計約束"
    lessons: "L3、L4"
  - ability: "開發"
    indicator: "能用對話式編程做出能跑的功能、用 Skill 自動化重複流程"
    lessons: "L2、L6"
  - ability: "規模化"
    indicator: "能用 worktree／subagent 並行推進、用 review 把關"
    lessons: "L7"
  - ability: "QA"
    indicator: "能對一個需求寫測試、用 gate 收斂（紅綠重構）"

name: "Agentic Engineering 企業培訓"
tagline: "把 AI 寫得快，變成團隊交付得對"
subtitle: "需求拆解、規格、驗證、協作到交付——方法跨工具，Claude Code 作主要示範環境。"
status: "企業試辦方案"
formats:
  - name: "導入工作坊"
    duration: "2–3 小時"
    audience: "主管、PM、工程團隊"
    outcome: "建立共同語言、看懂 Agentic Engineering 工作流，盤點適合團隊的導入情境。"
  - name: "E2E 實作課"
    duration: "半天"
    audience: "想先走過一次完整流程的團隊"
    outcome: "從需求、規格到測試與交付，完成一個縮短但可驗證的實作。"
  - name: "完整培訓"
    duration: "9 堂・每週一堂"
    audience: "要建立共同工作法的跨職能團隊"
    outcome: "以貫穿專案累積規格、測試、Agent 規則與上線成果。"
principles:
  - title: "方法跨工具"
    icon: "bi bi-shuffle"
    text: "需求、規格、驗證與交付不屬於任何一家工具。Claude Code 是主要示範，Codex 等 coding agent 會補充概念對照。"
  - title: "驗證比生成更重要"
    icon: "bi bi-patch-check"
    text: "AI 可以很快生出答案，但團隊需要的是驗收條件、測試與 review，知道什麼時候真的做完。"
  - title: "每堂都有產出"
    icon: "bi bi-box-arrow-up-right"
    text: "不是坐著看 demo。學員會在自己的練習專案上動手，帶走可繼續使用的工程資產。"
lessons:
  - id: "01"
    name: "Agentic Engineering 心智模型"
    stage: "認知與環境"
    practice: "完成環境健診，定義貫穿專案與成功條件"
    takeaway: "可執行的題目與驗收方向"
  - id: "02"
    name: "從對話到能跑的第一版"
    stage: "第一次 E2E"
    practice: "以 coding agent 做出可執行 v0"
    takeaway: "一個能跑、可繼續演進的 v0"
  - id: "03"
    name: "Plan、執行與 Review 迴圈"
    stage: "核心工作流"
    practice: "用計畫、差異檢查與 Git 收斂一次變更"
    takeaway: "可重複的開發迴圈"
  - id: "04"
    name: "讓 Agent 讀懂專案"
    stage: "設計約束"
    practice: "建立 AGENTS.md／CLAUDE.md 等專案規則"
    takeaway: "一份精簡、可維護的 Agent 專案地圖"
  - id: "05"
    name: "需求訪談與可驗證規格"
    stage: "需求分析"
    practice: "用訪談與 Example Mapping 寫出規格"
    takeaway: "一份含驗收條件的 SPEC"
  - id: "06"
    name: "擴充與自動化重複工作"
    stage: "能力擴充"
    practice: "比較 Skills、Hooks、MCP 與其他工具的對應機制"
    takeaway: "一個可重用的自動化流程"
  - id: "07"
    name: "多 Agent 協作與隔離"
    stage: "並行協作"
    practice: "用 worktree／subagent 分工並交叉 review"
    takeaway: "可控的並行開發經驗"
  - id: "08"
    name: "測試與驗證迴圈"
    stage: "QA"
    practice: "先定測試，再讓 Agent 實作到通過 gate"
    takeaway: "一個需求的測試與驗證證據"
  - id: "09"
    name: "Capstone：從規格到上線"
    stage: "交付"
    practice: "完成部署並比較 before／after 指標"
    takeaway: "上線成果與一組可解釋的效益數據"
outcomes:
  - title: "一次完整交付"
    icon: "bi bi-diagram-3"
    text: "從需求到上線走完一遍，不只看過工具示範。"
  - title: "團隊共同工作法"
    icon: "bi bi-people"
    text: "規格、驗證與 review 有共同語言，不再各自摸索。"
  - title: "可重用工程資產"
    icon: "bi bi-folder-check"
    text: "帶走專案規則、SPEC、測試與自動化流程。"
  - title: "可量測的導入證據"
    icon: "bi bi-graph-up"
    text: "用自己的 before／after 指標討論效益，而不是只談感覺。"
faq:
  - q: "一定要使用 Claude Code 嗎？"
    a: "不一定。課程核心是跨工具的 Agentic Engineering 方法，Claude Code 是主要示範環境；可補充 Codex 等 coding agent 的概念對照。"
  - q: "非工程師能參加嗎？"
    a: "可以，但實作深度會依團隊組成調整。主管與 PM 可從導入工作坊開始；完整九堂仍需要願意動手完成專案。"
  - q: "可以使用公司的內部程式碼嗎？"
    a: "課程預設使用公開或練習專案，不要求提供公司機密、客戶資料、密碼或金鑰。若企業要使用內部情境，必須先完成自身的資安與權限審查。"
  - q: "試辦方案和正式課程差在哪裡？"
    a: "課綱與教材已完成，2026 年 10 月也完成一場企業內部 AI 入門分享；但完整課程仍在累積正式企業授課實績，因此對外誠實標示為試辦方案。洽談時會先確認對象、目標與適合的時數。"
stats:
  - number: "9 堂"
    label: "完整交付路線"
  - number: "36 份"
    label: "教學素材"
  - number: "19+ 篇"
    label: "公開 Agentic 專欄"
  - number: "3 種"
    label: "導入時數"
# 應用情境模組（2026-10 由獨立的 AI × Crypto 合作課併入，見 ADR 0005；舊網址轉址到 #ai-research）
applications:
  - id: "ai-research"
    eyebrow: "Application Module"
    name: "AI 研究流程應用模組"
    title: "AI 研究流程應用模組：以加密市場研究為例"
    lead: "不是用 AI 產出一篇看起來很完整的報告，而是建立研究、交叉查證與風險檢查流程。AI 整理資訊，人負責決定什麼可信；流程不從價格開始，也不把模型輸出當結論。"
    steps:
      - title: "先定義研究問題"
        text: "專案解決什麼問題，研究對象是產品、協議、代幣還是風險事件。"
      - title: "蒐集第一手來源"
        text: "官方文件、治理提案、鏈上資料與可信報導分層，不把社群轉述當原始證據。"
      - title: "讓 AI 結構化，不替你下結論"
        text: "整理產品、團隊、收益來源、代幣用途與待查證清單，標出引用與不確定性。"
      - title: "交叉檢查與人工收斂"
        text: "找反方、找同類、找風險事件，再由人決定哪些資訊足以支撐判斷。"
    usable_title: "可以使用"
    usable:
      - "官方網站、文件與白皮書"
      - "公開治理提案與鏈上資料"
      - "可信媒體與研究報告"
      - "課前提議、確認過資料量與難度的公開專案"
    not_used_title: "不會使用"
    not_used:
      - "學員持倉與交易紀錄"
      - "錢包地址、帳號或 API 金鑰"
      - "未公開投資研究與個資"
      - "需要登入私人社群才能取得的內容"
    risk: "本模組為技術與研究方法教育，不構成投資、財務、法律或稅務建議。加密資產價格波動劇烈，風險極高；不提供明牌、不保證收益，也不代替個人投資判斷。"
    cohost_text: "也接受社群、場地或教育平台合作主辦 60–90 分鐘的研究方法講座，帶走研究框架與風險檢查表；不直接收個人名單。"
    cohost_href: "/contact/?service=ai_crypto_research&from=agentic_engineering_page"
    cohost_label: "洽談合作主辦講座"

name: "Web3 企業培訓"
tagline: "讓團隊知道什麼值得做，風險又藏在哪裡"
paths:
  - id: "A"
    name: "主管決策與趨勢判斷"
    duration: "2–12 小時"
    audience: "高階主管、策略、創新與產品負責人"
    problem: "熱門名詞很多，但團隊缺少判斷商業價值與風險的共同框架。"
    outcome: "能區分適合企業投入的場景、只是敘事的題目，以及導入前要追問的問題。"
    modules: "M01・M09・M11・M13"
  - id: "B"
    name: "RWA／穩定幣／風險與合規"
    duration: "4–16 小時"
    audience: "金融、會計、法務、合規、資安與主管"
    problem: "看得到市場機會，卻說不清楚保管、清算、法遵、智能合約與對手方風險。"
    outcome: "建立 RWA 與穩定幣風險地圖，知道哪些問題需要技術、法務與財務共同回答。"
    modules: "M01・M02・M07・M09・M11"
  - id: "C"
    name: "產品與技術團隊鏈上實務"
    duration: "8–24 小時"
    audience: "產品經理、工程師、技術主管與數位轉型團隊"
    problem: "會談區塊鏈概念，但不熟悉錢包、交易、智能合約、DeFi 與鏈上資料的實際限制。"
    outcome: "能讀懂鏈上系統的核心元件、操作流程與常見風險，和合作夥伴有效討論。"
    modules: "M01・M06・M07・M08・M09・M10・M11"
formats:
  - name: "專題工作坊"
    duration: "2–3 小時"
    modules: "1 個主題"
    text: "適合主管 briefing、共識建立或單一議題快速導入。"
  - name: "精選路徑"
    duration: "8–24 小時"
    modules: "4–8 個模組"
    text: "依團隊角色與產業情境組合，是多數企業較容易落地的做法。"
  - name: "完整培訓"
    duration: "26–39 小時"
    modules: "13 個模組"
    text: "用於跨部門建立完整 Web3 知識體系，不建議在目標不清楚時直接選。"
modules:
  - id: "M01"
    name: "Web3 演進與區塊鏈基礎"
    keywords: "Web1／2／3、六層架構、代幣分類"
    audience: "全員"
  - id: "M02"
    name: "加密貨幣錢包與交易所實務"
    keywords: "錢包、私鑰安全、CEX／DEX"
    audience: "財務／合規"
  - id: "M03"
    name: "元宇宙概論與產業案例"
    keywords: "虛擬體驗、AR／VR、品牌案例"
    audience: "行銷／創新"
  - id: "M04"
    name: "NFT 技術架構與品牌案例"
    keywords: "ERC-721、數位資產、品牌策略"
    audience: "品牌／產品"
  - id: "M05"
    name: "迷因文化與鏈上代幣經濟"
    keywords: "社群、代幣發行、風險"
    audience: "風控／社群"
  - id: "M06"
    name: "比特幣運作原理與白皮書"
    keywords: "UTXO、挖礦、共識機制"
    audience: "技術／主管"
  - id: "M07"
    name: "密碼學與數位安全基礎"
    keywords: "雜湊、數位簽章、金鑰"
    audience: "資安／技術"
  - id: "M08"
    name: "以太坊與智能合約"
    keywords: "EVM、DApp、Gas"
    audience: "技術／產品"
  - id: "M09"
    name: "DeFi 與穩定幣基礎"
    keywords: "AMM、借貸、穩定幣"
    audience: "金融／策略"
  - id: "M10"
    name: "DeFi 協議與風險實務"
    keywords: "MakerDAO、Aave、Uniswap"
    audience: "金融／技術"
  - id: "M11"
    name: "RWA 現實世界資產代幣化"
    keywords: "發行、保管、清算、合規"
    audience: "金融／法務"
  - id: "M12"
    name: "GameFi 與代幣激勵案例"
    keywords: "P2E、遊戲經濟、失敗案例"
    audience: "產品／遊戲"
  - id: "M13"
    name: "Web3 願景與企業判斷"
    keywords: "Read Write Own、網路效應、採用條件"
    audience: "主管／策略"
faq:
  - q: "一定要一次上完 13 個模組嗎？"
    a: "不用。13 模組是組合能力庫，多數企業會先依角色與問題選一條路徑，再決定深度。"
  - q: "需要程式設計背景嗎？"
    a: "不一定。主管路徑不要求寫程式；產品與技術路徑才會加入較多系統與操作細節。"
  - q: "可以使用公司內部案例嗎？"
    a: "可在不提供機密資料的前提下討論公開或匿名化情境。課程不要求密碼、金鑰、客戶資料或未公開商業資訊。"
  - q: "課程會教投資或推薦標的嗎？"
    a: "不會。課程聚焦技術、商業結構、研究方法與風險判斷，不提供明牌或收益保證。"

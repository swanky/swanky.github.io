      personality: "好色任性 / 精於算計 / 慷慨好客 / 徇私狠辣 / 重情善變"
    appearance: "體態厚實、面容保養良好，眉眼銳利而帶著富家主人的自信；在家穿質料華貴的深青長袍，辦公時加黑色官帽、玉帶與暗紅內襟，腰間佩精緻荷包與扇墜，以顯示財勢和官身。（推斷）"

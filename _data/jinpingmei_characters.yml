    motivation: "不斷以財富、官勢與人情擴張家業和地位，同時即刻滿足色慾、享樂與報復心；對李瓶兒及官哥兒又顯出維護家庭與挽留親情的迫切。"
    character_arc: "由清河富商藉賄賂與權門交結升為掌刑名的千戶，財勢、家業與私慾同步膨脹；在官哥兒與李瓶兒相繼死亡後仍未能節制，最終三十三歲血崩而死，末後經普靜薦拔轉生。"
    relationships:
      - name: "吳月娘"
        description: "正妻與內宅主母；他向她交代家務，也曾行房求子並在妻妾爭執後加以安撫。"
      - name: "李瓶兒"
        description: "寵妾；他設計取得其財物後迎娶，為她與官哥兒延醫祈福，並在她死後大辦喪儀、長久追念。"
      - name: "潘金蓮"
        description: "由通姦與合謀毒殺武植而納入家中的妾；兩人長期縱慾，也因偏寵、財物與妒意反覆爭吵。"

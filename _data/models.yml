# SWANKY MODELS｜虛擬模特兒經紀（/photography/models/；2026-09-24 立）——子站單一真相源。
#
# 規則：
# - 旗下人物皆為 AI 生成的虛擬人物，不是真人；模板會替每張圖的 alt 補「（AI 生成，非真人照片）」並掛徽章。
# - 介紹文字一律沿用作品資料既有文案（JSON 的 description／disclosure、yml 的 lead／note／quote），
#   不另創背景設定，也不編身高、三圍等經紀卡規格——資料裡沒有的欄位就不出現。
# - 作品全是自主企劃的概念作品，不得寫成商業委託實績；不寫價格，不寫服務承諾。
# - 新人物＝加一個 talent＋建 photography/models/talent/<slug>/index.html（只有 front matter＋include）；
#   新作品＝在該 talent 的 books 加一行（data＝_data 檔名；kind＝json（移交包 photos[]）或 yml（寫真館 chapters[].shots[]））。
# - 圖片一律用 {book, kind, n} 參照既有作品資料，由 _includes/models/photo.html 解析（Flickr 預覽與大圖直連）。
# - 名冊照（digital: true）是 2026-09-25 以角色母版為身份參考、在同一場攝影棚設定下各生成一張的站姿四分之三身像，
#   本地檔 /assets/img/photography/models/digitals/<slug>.webp，由 _includes/models/digital.html 輸出；spread 是首頁跨頁用的橫幅（既有書圖）。

brand:
  name: SWANKY MODELS
  tagline: 虛擬模特兒經紀
  claim: 旗下模特兒皆為 AI 生成的虛擬人物，並非真人。
  creator: 史旺基 Swanky 企劃、視覺統籌、選片與審定。

home:
  eyebrow: VIRTUAL MODEL AGENCY · TAIPEI · 2026
  lead: 這裡的人物不是真人，是史旺基企劃、視覺統籌、選片與審定的虛擬角色。攝影多年累積的眼光，換一種媒材繼續用：人物怎麼站、光從哪裡來、她和場景的關係是什麼。
  disclosure: 以下角色與作品全部由 AI 生成，並非真人照片，也不是實拍紀錄；每一輯的作品頁都寫明製作方式與虛構場景。
  # 以下引文出自專欄〈AI 不是我的替身，而是我跨出邊界的方法〉，逐字沿用。
  statement_quote: 虛擬經紀公司首先應該是一個角色創作與管理的工作室，而不是無限生圖的資料夾。
  statement_quote_lines: [虛擬經紀公司首先應該是, 一個角色創作與管理的工作室，, 而不是無限生圖的資料夾。]
  statement_body: 如果一個角色能有自己的視覺語言、作品與故事，攝影師是否也能成為她的共同創作者、導演與經紀人？這當然還不能證明一間虛擬經紀公司已經成立，更不能證明商業模式可行。但至少可以先拿出作品，而不是只說「未來可以做到」。
  # 宣言跨頁的暗房照片（規則：全站最暗的橫幅之一，亮度 57；劇場布幕裡展開的海，對應「工作室」的意象）
  manifesto: { book: swanky_ji_open_worlds, kind: json, n: 28 }
  article:
    label: 為什麼攝影師要開一間虛擬角色經紀公司
    url: /technical/ai-photography-virtual-agency/

# 合作原則：逐字取自同一篇專欄，站主的第一人稱保留。
principles:
  eyebrow: HOW WE WORK
  title: 兩種合作，各有各的紅線。
  title_lines: [兩種合作，, 各有各的紅線。]
  items:
    - title: 虛構角色
      text: 包括原創人物，以及李瓶兒這類文學角色的改編。她可以有完整的外觀、性格與故事，但必須被清楚介紹為虛構人物，改編也要交代來源。
    - title: 真人的授權數位分身
      text: 她與一位真實的人相連，因此作品怎麼製作、在哪裡公開、是否用於商業合作，都不能只由我單方面決定。目前只是合作原則，不是已上線的服務。
    - title: 先小、再確認
      text: 先說清楚素材用途，再做少量試作；先確認角色與作品，再另外確認公開及商業使用。圖像完成，不等於取得發布許可。

inquiry:
  eyebrow: INQUIRY
  title: 想一起試一件還沒有人做過的事？
  title_lines: [想一起試一件, 還沒有人做過的事？]
  status: SWANKY MODELS 目前處於作品與概念階段，尚無商業委託案例；這一頁不是價目表，而是一個開始討論的入口。
  topics:
    - title: 讓旗下虛擬人物出現在你的企劃裡
      text: 展覽、出版、內容合作或共同創作。先說用途與情境，我們再一起看哪一位、哪一種做法合適。
    - title: 討論真人授權數位分身的做法
      text: 依上面的合作原則進行：先談素材用途與範圍、做少量試作、由本人確認作品，再另外確認公開與商業使用。
    - title: 真人模特兒合作提案
      text: 不在這個子站處理。真人拍攝請走攝影作品區的「模特兒合作」，那裡寫了合作方式與界線。
      url: /photography/#model-collaboration
      cta: 前往模特兒合作
  note: 初次來信不需提供身分證、住址等敏感資料；提案不代表一定合作，會依主題與雙方適合度回覆。


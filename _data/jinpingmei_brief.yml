  c95:
    b: "平安兒偷當鋪金飾洩憤被抓，巡檢吳典恩刑逼構陷月娘；春梅託守備施壓化解"
    s: "權力交易"
  c96:
    b: "春梅回舊宅探月娘，見李瓶兒床賤賣、金蓮床隨人去；張勝巧遇落魄經濟，帶回守備府"
    s: "崩解餘波"
  c97:
    b: "陳經濟假扮春梅表弟寄居守備府，暗中復合；春梅替他娶妻葛翠屏，仍私通不斷"
    s: "崩解餘波"
  c98:
    b: "陳經濟聯手告發仇家楊光彥奪店；巧遇韓道國之女韓愛姐，私通瞞妻"
    s: "權力交易"
  c99:
    b: "陳經濟與春梅密謀害張勝，反被張勝先殺；守備下令打死張勝劉二，雪娥畏罪自縊"
    s: "主線轉折"
  c100:
    b: "周守備戰死、春梅縱慾病亡；普靜和尚超渡眾魂，揭穿孝哥是西門慶轉世並渡他出家"
    s: "崩解餘波"
chongzhen:
  c1:
    b: "西門慶結拜十兄弟，武松打虎揚名，嫂嫂潘金蓮已動了心"
    s: "內宅群像"
  c53:
    b: "陳經濟潘金蓮花園偷歡遭驚散，吳月娘求子如願懷胎"
    s: "內宅群像"
  c54:
    b: "應伯爵酒宴戲弄韓金釧兒反被推倒，陳經濟夜探潘金蓮險遭撞見"
    s: "內宅群像"
  c55:
    b: "西門慶拜蔡太師為乾爹，苗員外送歌童，李桂姐官司化解"
    s: "權力交易"
  c56:
    b: "西門慶接濟常峙節買房，其妻轉怒為喜；應伯爵力薦水秀才"
    s: "權力交易"
  c57:
    b: "老和尚募款修永福寺獲捐五百兩；潘金蓮迴廊巧遇陳經濟偷歡"
    s: "儀式場景"

timeline:
  - year: "2006"
    title: 從網路走進攝影
    description: 第一次正式人像外拍，開始更有系統地整理作品，並透過 Flickr 與更多人分享。
  - year: "2007"
    title: 作品走出個人相簿
    description: 開始參加攝影競賽，也透過 Flickr 與早期網路社群被更多人看見。
  - year: 08—09
    title: 人物與網路文化
    description: 長期人物合作、每月桌布計畫、攝影分享，以及跨部落格與社群的影像傳播。
  - year: "2010"
    title: 開始形成自己的系列
    description: Momo「走在」、更多城市人物實驗、自費作品書與第一次 GEISAI 攝影展。
  - year: "2011"
    title: 系列走進展覽與媒體
    description: For Your Safety 從網路被看見，接著進入 GEISAI #3、搖咖啡展覽與媒體報導。
  - year: 12—21
    title: 媒體、出版與延伸
    description: TIME、PX3、IPA、五本攝影相關出版、電視節目與更自主的合作。


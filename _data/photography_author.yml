model_collaboration:
  eyebrow: 07 · MODEL COLLABORATION
  title: 想一起完成下一組作品嗎？
  intro: 目前開放少量合作模特兒提案。無論你已有拍攝經驗，或第一次想認真留下作品，只要願意一起討論主題、服裝與場景，都歡迎先來信介紹自己。
  points:
    - title: 一起完成，不是單向配合
      description: 拍攝前會先對齊想法、參考畫面與彼此期待，讓模特兒也能參與作品形成。
    - title: 新手也可以提出合作
      description: 不以拍攝經驗作唯一標準，更重視個人特質、溝通意願，以及你對主題是否真的有興趣。
    - title: 界線與使用方式先說清楚
      description: 時間、地點、費用或互惠、照片交付、公開使用與可接受範圍，都會在拍攝前確認。
  note: 未滿 18 歲須取得法定代理人同意；初次來信不需提供身分證、住址等敏感資料。提案不代表一定合作，會依主題與雙方適合度回覆。


# 金瓶梅每回白話導讀（AI 整理＋人工抽驗；顯示於回前摺疊區，原文本體一字未動）
# 結構：common＝兩版本共用（以詞話本原文生成）；wanli / chongzhen＝該版本專屬（卷首與結構差異回）
# 產生：2026-08-08 批次生成，合併腳本 merge_guide.py；資料勘誤請改本檔
common:
  c1:
    intro: "武松力氣過人，經景陽岡時徒手打死一隻吃人的老虎，因此被知縣提拔為都頭，負責緝捕盜賊。哥哥武大又矮又醜，靠賣炊餅過日子，娶了美貌的潘金蓮。金蓮原是富戶家婢女，曾被主人收房，事情鬧開後才被隨意嫁給武大，心裡一直嫌棄丈夫矮小沒出息。武松搬來同住後，金蓮對他起了心思，趁下雪天灌酒挑逗，卻被當場斥退。她惱羞成怒，反倒向武大誣賴武松出言調戲她，武松察覺真相後便搬出去住，兄弟感情因此生了裂痕。"
    highlights:
      - "武松景陽岡徒手打虎，一戰成名"
      - "潘金蓮身世坎坷，嫌棄武大矮醜"
      - "金蓮向武松示愛遭拒，種下心結"
    cast:
      - name: "武松"
        note: "打虎英雄，新任都頭，本回搬入又搬出兄長家"
      - name: "武大"
        note: "武松兄長，賣炊餅為生，性格懦弱怕事"
      - name: "潘金蓮"
        note: "武大之妻，嫌夫矮醜，向小叔示愛遭拒"
      - name: "迎兒"
        note: "武大與前妻之女，年幼在家幫忙雜事"
  c2:
    intro: "武松奉知縣之命遠赴東京送禮，行前特別叮囑武大早點收攤關門，也暗示金蓮要守好婦道。金蓮聽了覺得受辱，跟武大大吵一場。武松離開後，某天金蓮在門前收簾子，不小心用叉竿打到路過的西門慶——當地有錢又好色的浪蕩子，兩人因此對上了眼。西門慶心裡惦記，跑去金蓮家隔壁開茶館的王婆那裡打聽，才知她是賣炊餅武大的老婆。他此後常去王婆的茶館坐著，出手大方，王婆見錢眼開，猜中他的心事，開始盤算怎麼撮合兩人。"
    highlights:
      - "武松遠行赴東京，家中埋下變故種子"
      - "叉竿意外，金蓮與西門慶一見鍾情"
      - "王婆見錢眼開，暗中盤算如何牽線"
    cast:
      - name: "西門慶"
        note: "本地富商浪蕩子，簾下望見金蓮便起色心"
      - name: "潘金蓮"
        note: "武大之妻，失手打中西門慶結下露水緣"
      - name: "王婆"
        note: "隔壁茶館老闆娘，貪財應允替西門慶牽線"
      - name: "武松"
        note: "本回奉命遠赴東京，行前叮囑兄嫂看家"
      - name: "武大"
        note: "聽從弟弟叮囑早歸關門，卻惹金蓮不滿"
  c3:
    intro: "西門慶迷戀金蓮，求王婆幫忙牽線成事。王婆說出所謂的挨光五要件，又設計一套十步驟的計謀：先讓金蓮到她家幫忙縫製送終衣物，再藉機安排西門慶巧遇金蓮，接著用請酒答謝當藉口，一步步拉近兩人距離。金蓮起初只是單純幫忙做衣服，卻在王婆刻意安排下，與西門慶同桌喝酒閒聊，兩人言語間眉來眼去，漸漸生出情意。王婆見時機成熟，便藉口出門買酒，留下兩人獨處一室，一場好戲眼看就要上演。"
    highlights:
      - "王婆傳授挨光五要件與十步驟計謀"
      - "金蓮被一步步安排，與西門慶獨處"
      - "兩人眉目傳情，曖昧氣氛升到頂點"
    cast:
      - name: "王婆"
        note: "一手策劃十步驟計謀，撮合西門慶與金蓮"
      - name: "西門慶"
        note: "出錢配合王婆計謀，藉機接近金蓮"
      - name: "潘金蓮"
        note: "受邀幫王婆縫衣，漸漸被安排與西門慶獨處"
      - name: "武大"
        note: "本回僅被提及，曾叮囑金蓮帶錢回禮王婆"
  c4:
    intro: "王婆藉口出門買酒，把西門慶和金蓮留在房裡獨處，兩人終於發生了關係。王婆隨後假意撞見，逼兩人當場承諾往後要長久來往，還互換信物作證，趁機向西門慶要了不少謝禮。此後金蓮天天藉故到王婆家和西門慶私會，鄰居間漸漸傳出風聲，只有武大一個人還不知情。另一頭，靠賣水果賺點小錢的少年鄆哥想找西門慶討賞，聽人指點跑去王婆的茶館找人，卻被王婆一頓毒打趕出來，氣得發誓要讓這件事鬧開。"
    highlights:
      - "西門慶與金蓮在王婆房裡首次私通"
      - "王婆逼兩人立誓，還互換信物為證"
      - "鄆哥遭王婆毒打，憤而想要揭發"
    cast:
      - name: "西門慶"
        note: "與金蓮正式私通，靠王婆牽線持續往來"
      - name: "潘金蓮"
        note: "與西門慶私通得手，天天到王婆家私會"
      - name: "王婆"
        note: "撮合兩人得手，逼誓換信物，兩頭牟利"
      - name: "鄆哥"
        note: "賣水果的少年，找西門慶討賞被王婆毒打"
  c5:
    intro: "鄆哥被王婆打了一肚子氣，跑去找武大，故意用話激他，才說出金蓮和西門慶在王婆家私通的事。武大又驚又氣，和鄆哥商量好抓姦計策：鄆哥先進茶館纏住王婆，武大再趁機衝進房裡。計策雖然成功，西門慶卻從床下跳出，一腳踢倒武大，傷得吐血後逃走。武大臥病在床，金蓮不理不睬，武大自知性命難保，警告金蓮等武松回來絕不會善罷甘休。金蓮聽了心慌，和王婆商議後決定用毒藥害死武大，親手把毒藥灌進丈夫口中，武大就這樣痛苦地死去。"
    highlights:
      - "武大捉姦不成，反遭西門慶踢傷"
      - "武大臨終警告：武松歸來不會善罷"
      - "金蓮聽命下毒，親手害死武大"
    cast:
      - name: "鄆哥"
        note: "設計幫武大捉姦，激他問出實情"
      - name: "武大"
        note: "捉姦當場被踢傷，臥病後遭妻子毒死"
      - name: "西門慶"
        note: "捉姦現場踢傷武大逃走，後同意毒殺"
      - name: "潘金蓮"
        note: "聽從王婆之計，親手下毒害死丈夫"
      - name: "王婆"
        note: "獻計用毒藥除掉武大，助兩人長久私通"
  c6:
    intro: "武大死後，金蓮和王婆在鄰居前假意哭喪，入殮時卻被驗屍的何九看出中毒跡象。西門慶趕緊用銀子買通何九，何九便含糊帶過，武大很快被火化，證據就此消失。喪事辦完後，金蓮完全不守寡，仍天天和西門慶在家中幽會廝混。過了兩個月的端午節，西門慶前來探望，王婆支開金蓮的母親讓兩人單獨相處，飲酒彈唱、恩愛纏綿。王婆出門買酒時遇上大雨淋濕全身，回來後三人繼續喝酒取樂，西門慶當晚才離去。"
    highlights:
      - "何九驗出中毒，被西門慶收買噤聲"
      - "武大火化證據滅盡，金蓮不守寡"
      - "端午幽會，王婆買酒途中淋大雨"
    cast:
      - name: "西門慶"
        note: "買通何九掩蓋毒殺，端午與金蓮幽會"
      - name: "潘金蓮"
        note: "武大死後不守寡，天天與西門慶廝混"
      - name: "王婆"
        note: "打理喪事、繼續牽線，買酒途中淋了大雨"
      - name: "何九"
        note: "入殮驗屍人，驗出中毒卻被收買噤聲"
  c7:
    intro: "媒婆薛嫂向西門慶介紹南門外的富孀孟玉樓。西門慶先備禮拜訪她的姑媽楊姑娘打通關係，再親自登門相看，兩人一見都中意，當場議定婚期。玉樓的舅舅張四想搶她的財產，屢次勸她另嫁別家，都被玉樓頂回去。搬嫁妝那天，張四當眾要開箱檢查，楊姑娘出面替姪媳婦撐腰，兩人當街互罵幾乎打起來，眾人勸開，趁亂西門家的人已把箱籠搬空。六月初二，孟玉樓正式嫁入西門家，排行第三，稱三娘。"
    highlights:
      - "楊姑娘與張四當街互罵，幾乎打起來"
      - "孟玉樓句句頂回舅舅的阻婚說詞"
      - "西門慶先塞銀打通關係，再登門相看"
    cast:
      - name: "西門慶"
        note: "本回托媒說親，迎娶孟玉樓為第三房妻子"
      - name: "孟玉樓"
        note: "南門外富商遺孀，本回改嫁西門慶為三娘"
      - name: "薛嫂"
        note: "媒婆，本回牽線西門慶與孟玉樓的婚事"
      - name: "楊姑娘"
        note: "楊家兄弟的姑媽，本回力挺姪媳婦孟玉樓改嫁"
      - name: "張四"
        note: "孟玉樓亡夫的舅舅，本回想阻婚圖財產未成"
  c8:
    intro: "孟玉樓嫁進門後，西門慶把潘金蓮晾了近一個月，婦人望穿秋水，拿丫頭出氣。小廝玳安路過被逼問出實情，金蓮又哭又寫情詞託他帶話，直到西門慶生日當天，靠王婆硬把喝醉的他拉回來，兩人才和好。此時武松出差回程，先寄信說中秋前後到家，王婆截信通報二人。兩人怕武松拆散他們，商議先辦完武大的百日法事燒靈牌，再儘快把金蓮娶進門。法事當天，金蓮仍與西門慶廝混，聲音被隔牆和尚聽個一清二楚，眾僧唸經時洋相百出。"
    highlights:
      - "潘金蓮拿紅繡鞋卜卦，猜西門慶會不會來"
      - "武松回程先寄家書，被王婆截信搶先通風"
      - "燒靈法事上和尚隔牆偷聽，洋相百出"
    cast:
      - name: "潘金蓮"
        note: "武大郎遺孀，本回望夫心切，合謀速嫁進西門家"
      - name: "西門慶"
        note: "本回冷落金蓮多日，後合謀趕娶她過門"
      - name: "王婆"
        note: "金蓮鄰居兼牽線人，本回截信通風報信"
      - name: "玳安"
        note: "西門慶小廝，本回被金蓮逼問出娶親內情"
      - name: "武松"
        note: "武大郎的弟弟，本回出差回程先寄家書"
  c9:
    intro: "潘金蓮正式嫁進西門家，排行第五，其他妻妾多有不滿，只有大娘子吳月娘起初還挺喜歡她。同時武松出差回來，才知哥哥已死、嫂嫂改嫁，鄰居都推說是病死、改嫁外地客商。武松起疑，查訪出西門慶與嫂子通姦、王婆從中牽線，哥哥死得不明不白。武松告到縣衙，知縣被西門慶買通，藉口證據不足駁回。武松盛怒去找西門慶，西門慶跳窗逃走，武松卻認錯人，把通風報信的差役李外傳當場打死，最後被官差拿住。"
    highlights:
      - "潘金蓮過門即遭其他妻妾嫉妒排擠"
      - "武松深夜疑見武大鬼魂託夢，欲言又止"
      - "武松誤殺報信差役李外傳，惹上官司"
    cast:
      - name: "潘金蓮"
        note: "本回正式嫁入西門家，排行第五"
      - name: "吳月娘"
        note: "西門慶大娘子，本回起初對金蓮友善"
      - name: "武松"
        note: "武大弟弟，本回歸來查出兄嫂命案真相"
      - name: "鄆哥"
        note: "賣梨少年，本回向武松說出真相"
      - name: "西門慶"
        note: "本回買通知縣脫罪，跳窗逃過追打"
      - name: "李外傳"
        note: "縣衙差役，本回通風報信卻被武松誤殺"
  c10:
    intro: "西門慶跳窗躲過武松追殺後，砸重金買通知縣，武松被屈打成招，險遭死罪。案子呈報東平府，清廉的府尹陳文昭同情武松為兄報仇，想從輕發落；但西門慶靠關係打通朝中大官，武松最終改判杖刑充軍孟州，逃過一死。西門慶除去心頭大患，在芙蓉亭大排筵席與眾妻妾同歡，席間引出隔壁花子虛家妻子李瓶兒的來歷。當晚他向潘金蓮提起花家漂亮丫頭，金蓮大方讓步，次日西門慶便收用了自己房裡的丫頭春梅。"
    highlights:
      - "東平府清廉府尹陳文昭同情武松，仍受人情牽制"
      - "武松從死罪改判充軍孟州，逃過一死"
      - "西門慶芙蓉亭大宴妻妾，順勢引出李瓶兒身世"
    cast:
      - name: "西門慶"
        note: "本回買通官府脫罪，並收用丫頭春梅"
      - name: "武松"
        note: "本回屈打成招，改判充軍孟州逃過死刑"
      - name: "陳文昭"
        note: "東平府清廉府尹，本回同情武松卻受牽制"
      - name: "潘金蓮"
        note: "本回默許西門慶收用丫頭春梅"
      - name: "春梅"
        note: "金蓮房裡丫頭，本回被西門慶收用"
      - name: "李瓶兒"
        note: "隔壁花子虛之妻，本回首次登場交代身世"
  c11:
    intro: "潘金蓮仗著西門慶寵愛，動不動找孫雪娥的碴。丫頭春梅和雪娥在廚房拌嘴，添油加醋傳到金蓮耳裡，金蓮懷恨在心。隔天西門慶催著要點心，雪娥罵了催餐的丫頭，被西門慶聽見狠狠踢打一頓；金蓮又哭訴自己被冤枉成毒害親夫的壞女人，逼西門慶再教訓雪娥，還討了珠子當補償。另一頭，西門慶結拜兄弟輪流做東吃酒，這次在花子虛家聚會，席間他看上唱曲的李桂姐，當夜送她回家，隔天砸錢正式梳籠她，一連慶祝三天。"
    highlights:
      - "潘金蓮藉題找孫雪娥的碴，逼西門慶動手打人"
      - "西門慶正式梳籠李桂姐，一連慶祝三天"
      - "李桂姐正是李嬌兒的姪女，牽出妻妾角力"
    cast:
      - name: "潘金蓮"
        note: "本回挑起與孫雪娥的爭執"
      - name: "孫雪娥"
        note: "西門慶四房，本回遭金蓮尋隙、被踢打"
      - name: "春梅"
        note: "金蓮房裡丫頭，本回與雪娥拌嘴引風波"
      - name: "西門慶"
        note: "本回打雪娥出氣，又梳籠李桂姐"
      - name: "李桂姐"
        note: "勾欄唱曲女子，本回被西門慶梳籠"
      - name: "李嬌兒"
        note: "西門慶二房，本回因姪女被梳籠而出資幫辦"
  c12:
    intro: "西門慶迷戀李桂姐，一連半個月不回家，潘金蓮耐不住寂寞，和看管花園的小廝琴童偷情。事情被丫頭看見，一路傳到西門慶耳裡，他重打琴童一頓趕出家門，又逼金蓮跪著問罪；金蓮死不承認，靠春梅幫腔才躲過一劫。院裡的李桂姐又逼西門慶剪一撮金蓮頭髮證明絕情，西門慶哄騙金蓮剪髮送去，金蓮心裡難受，臥病在床。吳月娘找來劉婆子和她瞎眼丈夫劉理星，兩人靠算命作法騙錢，替金蓮下符討西門慶的歡心。"
    highlights:
      - "潘金蓮與小廝琴童偷情被抓，琴童遭毒打逐出"
      - "李桂姐逼西門慶剪金蓮一撮頭髮證明絕情"
      - "劉理星靠算命作法，向金蓮騙錢下符"
    cast:
      - name: "潘金蓮"
        note: "本回與小廝琴童偷情被抓，靠春梅幫腔躲過重罰"
      - name: "琴童"
        note: "花園小廝，本回與金蓮私通被逐出家門"
      - name: "西門慶"
        note: "本回迷戀李桂姐不歸，後查出金蓮私情"
      - name: "李桂姐"
        note: "勾欄女子，本回逼西門慶剪金蓮頭髮"
      - name: "春梅"
        note: "金蓮丫頭，本回幫金蓮圓謊躲過追究"
      - name: "劉理星"
        note: "瞎眼術士，本回向金蓮騙錢下符"
  c13:
    intro: "西門慶應花子虛之邀到他家喝酒，花子虛剛好不在，讓西門慶第一次跟他妻子李瓶兒正面相見，兩人都動了心。重陽節當天，花子虛在家宴客賞菊，李瓶兒趁機使丫鬟傳話，要西門慶假裝喝醉先離席，深夜丫鬟迎春在牆頭示意安全，西門慶便翻牆過去跟李瓶兒相會，當晚兩人就發生了關係，卻被迎春從窗紙破洞看得一清二楚。隔天潘金蓮發現牆頭有異狀，逼問之下拆穿西門慶的姦情，索性開條件換自己日後幫忙把風掩護。"
    highlights:
      - "西門慶李瓶兒隔牆一見鍾情"
      - "重陽夜翻牆密會，丫鬟窺見全程"
      - "潘金蓮識破姦情，開條件換來把風"
    cast:
      - name: "西門慶"
        note: "本地富商，本回勾搭上鄰居李瓶兒"
      - name: "李瓶兒"
        note: "花子虛之妻，本回主動勾引西門慶"
      - name: "花子虛"
        note: "李瓶兒丈夫，成日在外飲酒作樂"
      - name: "潘金蓮"
        note: "西門慶第五房妾，逼問後識破姦情"
      - name: "迎春"
        note: "李瓶兒丫鬟，本回窗外偷看主子私通"
  c14:
    intro: "花子虛的堂兄弟為了已故親戚留下的家產，把他告上公堂拖去問罪，李瓶兒嚇壞了，趕緊把家裡收藏的大批金銀財寶偷偷搬到西門慶家託他收著，還靠關係打通官府，把花子虛救出來，順勢用她的錢買下隔壁那棟房子。花子虛出獄後發現錢財所剩無幾，跟李瓶兒大吵一場，搬到新家沒多久就氣出病來，捨不得花錢好好醫治，沒幾天就病死了，年僅二十四歲。李瓶兒守喪期間，仍抽空到潘金蓮生日宴上，跟西門慶家的女眷們相處融洽。"
    highlights:
      - "花家爆發家產官司，花子虛被抓"
      - "李瓶兒搶先脫產，財寶交西門慶收著"
      - "花子虛氣病身亡，年僅二十四歲"
    cast:
      - name: "西門慶"
        note: "本地富商，本回代李瓶兒收藏財物"
      - name: "李瓶兒"
        note: "花子虛之妻，本回連夜求救脫產"
      - name: "花子虛"
        note: "李瓶兒丈夫，本回被告下獄又氣死"
      - name: "花大"
        note: "花子虛堂兄，本回告他爭奪家產"
      - name: "吳月娘"
        note: "西門慶正妻，本回提醒他小心行事"
  c15:
    intro: "元宵節這天正好是李瓶兒生日，她邀西門慶的正妻吳月娘和幾位妾室，到她獅子街的新家賞燈吃酒。眾女眷登樓看熱鬧燈市，樓下圍觀的路人卻在議論她們的身分，連潘金蓮以前的往事都被翻出來說嘴。另一頭，西門慶原本只想跟應伯爵、謝希大隨便逛逛燈市，卻被另外兩個朋友硬拉去妓院找相熟的歌妓李桂姐，中間有老鴇打趣湊趣、歌妓表演踢球等熱鬧場面。西門慶惦記著晚上要跟李瓶兒相聚，趁亂偷偷從妓院溜走。"
    highlights:
      - "全家女眷登樓賞燈，路人議論八卦"
      - "西門慶被友人拉去妓院踢球看戲"
      - "西門慶趁夜溜走赴李瓶兒之約"
    cast:
      - name: "西門慶"
        note: "本地富商，本回燈節赴約又逛妓院"
      - name: "李瓶兒"
        note: "西門慶情婦，本回在新居辦燈節宴"
      - name: "吳月娘"
        note: "西門慶正妻，本回率眾女眷賞燈"
      - name: "潘金蓮"
        note: "西門慶妾室，本回賞燈引來路人議論"
      - name: "李桂姐"
        note: "青樓歌妓，本回被友人拉著西門慶來訪"
      - name: "應伯爵"
        note: "西門慶的食客朋友，本回硬拉他逛妓院"
  c16:
    intro: "西門慶從妓院脫身，直奔李瓶兒家過夜。李瓶兒搬出家藏香料珍寶，要他拿去變賣湊錢蓋新花園，一心盼著早點嫁過去。西門慶回家跟正妻吳月娘商量婚事，月娘提出孝服未滿、他曾與花子虛相交、又牽扯花家財產糾紛等顧慮，勸他別急；潘金蓮也獻計，讓他先拖著，等房子裝修好再說。李瓶兒雖然失望，仍答應等到端午節後才辦喜事，並燒了亡夫的靈位除喪。西門慶在應伯爵生日宴上說出婚事，眾人紛紛道賀敬酒。"
    highlights:
      - "李瓶兒獻財寶助蓋花園，急著嫁"
      - "吳月娘提三點顧慮，婚事被延後"
      - "西門慶當眾宣布婚訊，眾人道賀"
    cast:
      - name: "西門慶"
        note: "本地富商，本回答應迎娶李瓶兒"
      - name: "李瓶兒"
        note: "西門慶情婦，本回獻財寶催促婚事"
      - name: "吳月娘"
        note: "西門慶正妻，本回提出反對延緩婚事"
      - name: "潘金蓮"
        note: "西門慶妾室，本回獻計拖延婚事"
      - name: "應伯爵"
        note: "西門慶的食客朋友，本回設宴慶賀婚訊"
  c17:
    intro: "西門慶正和李瓶兒商量下個月的婚事，家裡卻出事：女婿陳經濟的父親因朝廷官員被彈劾受牽連，連夜帶著妻子西門大姐和家產跑來投靠躲避。西門慶怕被扯進去，嚇得閉門停工，把娶李瓶兒的事全忘了，好些天不理她。李瓶兒左等右等等不到人，鬱悶害怕之下急出病來，找大夫蔣竹山看病吃藥才好轉。蔣竹山看上了她，趁機說西門慶的壞話，李瓶兒又怕又氣，索性招他入門改嫁。"
    highlights:
      - "朝廷政爭牽連，西門慶嚇得閉門"
      - "李瓶兒盼婚不成，急出病來"
      - "蔣竹山趁機挑唆，李瓶兒改嫁"
    cast:
      - name: "西門慶"
        note: "本地富商，本回受政爭牽連嚇得閉門"
      - name: "李瓶兒"
        note: "西門慶情婦，本回久等不到人急出病"
      - name: "陳經濟"
        note: "西門慶女婿，本回攜家產投靠躲避"
      - name: "陳洪"
        note: "陳經濟之父，牽連官員被彈劾風波"
      - name: "蔣竹山"
        note: "看病大夫，本回趁機娶了李瓶兒"
  c18:
    intro: "西門慶派去京城打點的僕人來保，靠層層送禮讓官員改掉花名冊上他的名字，總算躲過這場政治風波，日子漸漸恢復正常，花園工程也重新動工。沒想到街上遇見李瓶兒的老僕馮媽媽，才知她已改嫁蔣竹山，還出錢幫他開了藥鋪。西門慶又氣又恨，酒後回家見誰都不順眼，當眾踢打潘金蓮，鬧得全家不安，吳月娘一句話還牽連刺傷了曾改嫁的孟玉樓。西門慶把女婿陳經濟安排去花園監工，因此常進出內宅，和潘金蓮打牌閒聊漸漸熟稔起來。"
    highlights:
      - "買通官員改花名冊，西門慶脫險"
      - "驚聞李瓶兒改嫁，西門慶遷怒家人"
      - "陳經濟入內宅，與潘金蓮漸生情意"
    cast:
      - name: "西門慶"
        note: "本地富商，本回買通官員脫險又遷怒家人"
      - name: "陳經濟"
        note: "西門慶女婿，本回監工時與潘金蓮漸熟"
      - name: "潘金蓮"
        note: "西門慶妾室，本回無端被踢又惹是非"
      - name: "吳月娘"
        note: "西門慶正妻，本回怒罵金蓮波及玉樓"
      - name: "馮媽媽"
        note: "李瓶兒老僕，本回洩露她改嫁的消息"
      - name: "來保"
        note: "西門慶家僕，本回上京買通官員解危"
  c19:
    intro: "西門慶買通兩個地痞，誣賴李瓶兒招贅的丈夫蔣竹山欠債，鬧上公堂打了他一頓，逼李瓶兒拿三十兩銀子才擺平，蔣竹山因此被趕出家門。李瓶兒隨後主動示好，兩人談妥婚事，八月二十日抬轎迎娶進門。西門慶因記恨她曾改嫁蔣竹山，新婚三夜不進房，李瓶兒傷心懸梁自盡，被潘金蓮和春梅救下。隔天西門慶逼她脫衣跪地鞭打逼問，她哭訴當年被鬼祟纏身，萬般無奈才招贅蔣竹山，又極力恭維西門慶勝過蔣竹山千萬倍，這才哄得他回心轉意。"
    highlights:
      - "西門慶買凶構陷蔣竹山，官府屈打成招"
      - "李瓶兒懸梁自盡未遂，全書罕見的激烈場面"
      - "西門慶鞭打逼供，李瓶兒嬈言脫身收場"
    cast:
      - name: "西門慶"
        note: "故事主角，本回買凶害蔣竹山，迎娶李瓶兒為六房"
      - name: "李瓶兒"
        note: "富孀，本回改嫁西門慶為六房，新婚遭冷落險自盡"
      - name: "蔣竹山"
        note: "醫生，入贅李瓶兒家，本回遭西門慶買凶構陷被逐"
      - name: "潘金蓮"
        note: "五房，本回聽西門慶自誇報復蔣竹山之計"
      - name: "魯華、張勝"
        note: "受西門慶收買的地痞，本回設局打傷蔣竹山"
  c20:
    intro: "西門慶與李瓶兒和好，李瓶兒拿出私房珠寶要打造首飾，被潘金蓮撞見也跟著討要一份。孟玉樓好言勸吳月娘與西門慶消氣，月娘卻堅持不肯回頭，寧可守寡也不看丈夫臉色。西門慶擺酒請親友喫會親酒，眾人逼著李瓶兒出來拜見，席間一曲歌詞恰似暗諷月娘，惹得她更不痛快。入冬後，西門慶帶應伯爵等人到李桂姐的妓院，撞見她背著自己接了別的客人，當場大發雷霆，砸了滿屋家具，鬧了一場才憤而回家。"
    highlights:
      - "李桂姐偷接客人被撞破，西門慶大鬧妓院"
      - "吳月娘拒絕和好，孟玉樓好言勸說無效"
      - "潘金蓮撞見金飾，硬要打一副同款首飾"
    cast:
      - name: "西門慶"
        note: "故事主角，本回正式迎娶李瓶兒，又大鬧妓院"
      - name: "李瓶兒"
        note: "新過門的六房，本回正式拜見眾人、獻金飾"
      - name: "潘金蓮"
        note: "五房，本回撞見李瓶兒金飾，跟著討打一副"
      - name: "吳月娘"
        note: "正室，本回仍與西門慶鬧僵，拒絕和好"
      - name: "陳經濟"
        note: "西門慶女婿，本回開始掌管解當鋪鑰匙"
      - name: "李桂姐"
        note: "妓院紅牌，本回被撞見偷接別的客人挨砸店"
  c21:
    intro: "西門慶大鬧妓院回家的深夜，撞見吳月娘正在院子裡燒香禱告，祈求他早日回心轉意，盼六房妻妾中有人能生下一子。西門慶聽了大受感動，向月娘道歉，兩人終於重歸和好，恩愛一夜。隔天眾妻妾湊錢辦了一場賞雪家宴，同賀夫妻言歸於好，月娘還親自掃雪煮茶請大家喝。同時應伯爵、謝希大又來替李桂姐一家說和，勸西門慶不計前嫌重回妓院。當晚正好是孟玉樓生日，眾人擲骰行酒令慶生，最後月娘吩咐讓玉樓陪西門慶過夜。"
    highlights:
      - "吳月娘夜半禱天感動西門慶，兩人重歸和好"
      - "眾妻妾湊錢辦家宴，齊賀夫妻言歸於好"
      - "應伯爵穿針引線，勸西門慶重返妓院修好"
    cast:
      - name: "吳月娘"
        note: "正室，本回夜半禱天感動西門慶，重歸和好"
      - name: "西門慶"
        note: "故事主角，本回與月娘和好，又重返李桂姐妓院"
      - name: "應伯爵"
        note: "西門慶的食客好友，本回替李桂姐一家說和"
      - name: "潘金蓮"
        note: "五房，本回湊錢辦家宴，愛耍嘴逗趣"
      - name: "孟玉樓"
        note: "三房，本回生日，眾人設宴慶賀"
  c22:
    intro: "西門慶看上家僕來旺兒新娶的妻子宋惠蓮，趁孟玉樓生日宴會注意到她，先送布料暗示心意，又設計派來旺兒去杭州辦貨支開丈夫。西門慶接著在花園假山洞裡勾引惠蓮得手，兩人開始私通，事後大方給她銀錢首飾。潘金蓮察覺有異，當場撞見兩人剛完事，逼問出實情，警告不許再犯。另一頭，教丫鬟們彈唱的樂師李銘喝醉後對春梅毛手毛腳，被春梅當面痛罵，嚇得抱著衣服逃走，西門慶得知後便把李銘趕出家門，不許再上門。"
    highlights:
      - "西門慶設局遣走來旺，勾引宋惠蓮得手"
      - "潘金蓮當場撞見私通，逼問西門慶查證"
      - "春梅嚴詞痛罵樂師李銘，樹立丫鬟威風"
    cast:
      - name: "西門慶"
        note: "故事主角，本回設局勾引家僕之妻宋惠蓮得手"
      - name: "宋惠蓮"
        note: "家僕來旺兒之妻，本回被西門慶看上勾引"
      - name: "潘金蓮"
        note: "五房，本回撞見西門慶與惠蓮私通現場"
      - name: "春梅"
        note: "潘金蓮的貼身丫鬟，本回痛罵調戲她的樂師"
      - name: "李銘"
        note: "教丫鬟們彈唱的樂師，本回酒後調戲春梅遭逐"
      - name: "來旺兒"
        note: "宋惠蓮之夫，本回被派往杭州辦貨半年"
  c23:
    intro: "新年裡，孟玉樓、潘金蓮、李瓶兒下棋賭酒菜，李瓶兒輸了，叫宋惠蓮燒豬頭下酒，惠蓮只用一根柴就燒得香噴軟爛，眾人讚不絕口。吳月娘見大家愛賭氣，提議姊妹輪流做東擺酒。西門慶趁眾人喫酒，讓惠蓮藉故送茶溜進房裡私會。當晚惠蓮想留下過夜，潘金蓮不讓兩人用自己的房間，卻讓丫鬟把鋪蓋送去花園密室，自己悄悄跑去偷聽，聽見惠蓮打探她的底細，氣得拔下髮簪鎖住園門留下暗記。惠蓮發現後心裡發慌，隔天被金蓮不點名訓了一頓。"
    highlights:
      - "惠蓮一根柴燒爛豬頭，手藝驚豔眾人"
      - "惠蓮夜會西門慶，密語被潘金蓮偷聽到"
      - "金蓮拔簪鎖門留暗記，不動聲色警告"
    cast:
      - name: "潘金蓮"
        note: "五房，本回設局讓惠蓮燒豬頭，竊聽藏春塢"
      - name: "宋惠蓮"
        note: "家僕之妻，本回燒豬頭展現手藝，又私會西門慶"
      - name: "西門慶"
        note: "故事主角，本回續與惠蓮私會，密語被金蓮聽見"
      - name: "吳月娘"
        note: "正室，本回提議姊妹輪流做東擺酒"
      - name: "孟玉樓"
        note: "三房，本回見證豬頭賭局，出面主持排場"
  c24:
    intro: "元宵夜，西門慶家中擺酒賞燈，宋惠蓮因是僕人媳婦只能坐在廊下嗑瓜子，卻對小廝呼來喝去。席間西門慶叫潘金蓮敬酒給女婿陳經濟，兩人趁機眉來眼去，被在旁偷看的惠蓮瞧在眼裡。西門慶外出赴宴後，金蓮、玉樓、李瓶兒帶著惠蓮等人上街走百病看燈，惠蓮沿路向陳經濟賣俏，還讓人瞧見自己穿金蓮的鞋。次日家中來客，惠蓮和廚房幫工惠祥互推奉茶責任，害客人喫了冷茶，西門慶怪罪下來，兩人互揭底細大吵一場，最後由吳月娘出面勸開。"
    highlights:
      - "陳經濟與潘金蓮席間曖昧，被惠蓮看在眼裡"
      - "走百病夜遊賣俏，惠蓮公開向陳經濟示好"
      - "惠祥與惠蓮為奉茶互揭瘡疤，當面對罵"
    cast:
      - name: "宋惠蓮"
        note: "家僕之妻，本回元宵出遊向陳經濟賣俏，又對罵"
      - name: "陳經濟"
        note: "西門慶女婿，本回元夜與潘金蓮曖昧調情"
      - name: "潘金蓮"
        note: "五房，本回與陳經濟眉目傳情，被惠蓮看見"
      - name: "惠祥"
        note: "廚房幫工來保之妻，本回為奉茶與惠蓮對罵"
      - name: "西門慶"
        note: "故事主角，本回設宴賞燈，因奉茶延誤責罰下人"
      - name: "吳月娘"
        note: "正室，本回出面調停惠祥與惠蓮的爭執"
  c25:
    intro: "清明將至，西門慶外出踏青，妻妾在花園盪鞦韆玩鬧，陳經濟趁機調戲金蓮與瓶兒。出差杭州的家僕來旺兒返家，孫雪娥悄悄告訴他：妻子宋惠蓮這幾個月和西門慶勾搭成奸，丫頭玉簫牽線。來旺兒酒醉怒罵主子，揚言要殺西門慶與潘金蓮，還扯出金蓮當年毒殺武大的舊事。同僚報信給金蓮，金蓮向西門慶告狀，也揭發雪娥與來旺兒的私情。西門慶打了雪娥，卻私下安撫惠蓮，還想讓來旺兒帶本錢出外做買賣，被金蓮勸阻。"
    highlights:
      - "鞦韆戲中陳經濟調戲金蓮與瓶兒，埋下後續禍根"
      - "雪娥洩密，掀開宋惠蓮與西門慶私通的蓋子"
      - "來旺醉罵翻出金蓮毒殺武大的舊帳，殺機浮現"
    cast:
      - name: "西門慶"
        note: "家主，得知家僕醉罵謀害之言後動了殺機"
      - name: "潘金蓮"
        note: "五娘，聽聞來旺醉罵後順勢挑動西門慶除去他"
      - name: "宋惠蓮"
        note: "來旺兒之妻，與西門慶私通身分本回曝光"
      - name: "來旺兒"
        note: "西門慶家僕，出差歸來得知妻子外遇，醉罵主子"
      - name: "孫雪娥"
        note: "西門慶妾室，洩露來旺妻外遇秘密，事後遭疑與他有私"
      - name: "孟玉樓"
        note: "三娘，與金蓮商議如何應付來旺醉罵一事"
  c26:
    intro: "西門慶原想讓來旺兒留在家開酒店，當晚卻鬧起抓賊風波：來旺兒醒後衝出查看，反被小廝絆倒圍住，誣賴他持刀殺主子，箱裡銀兩也換成了鉛錫。西門慶送他進提刑所問罪，買通官吏嚴刑逼供，虧得一位正直書辦周旋，才改判打一頓後遞解徐州為民。宋惠蓮起初被瞞著仍與西門慶私會，直到聽小廝說漏嘴才知丈夫早被打發走，悲憤上吊，被鄰居救回一次。後來又和孫雪娥當眾互罵互打，當晚終於自縊身亡，父親宋仁趕到刑場想阻止屍體火化。"
    highlights:
      - "來旺兒遭栽贓行凶偷銀，屈打後遞解徐州"
      - "潘金蓮暗中挑動孫雪娥與宋惠蓮互鬥，加劇悲劇"
      - "宋惠蓮兩度自縊，終究殉夫身亡"
    cast:
      - name: "西門慶"
        note: "家主，設計除去來旺兒，又哄騙宋惠蓮繼續私會"
      - name: "來旺兒"
        note: "西門慶家僕，遭誣行凶偷銀，屈打後遞解徐州"
      - name: "宋惠蓮"
        note: "來旺兒之妻，與西門慶私通，得知丈夫遭流放後自縊"
      - name: "潘金蓮"
        note: "五娘，妒忌西門慶寵愛宋惠蓮，暗中挑動孫雪娥與她互鬥"
      - name: "孫雪娥"
        note: "西門慶妾室，與宋惠蓮當眾互罵互毆"
      - name: "宋仁"
        note: "宋惠蓮之父，賣棺材為業，本回趕來阻止女兒屍體火化"
  c27:
    intro: "宋仁趕到刑場阻止女兒屍體火化，反被西門慶告到官府，責打後沒多久病死了。時序進入盛暑，西門慶在花園翡翠軒賞花消暑，潘金蓮、李瓶兒陪著嬉鬧。金蓮假意離開去叫孟玉樓，卻躲在窗外偷聽——西門慶正與李瓶兒親熱，瓶兒趁勢說出自己已懷孕臨月，求他溫柔些。金蓮聽在耳裡卻不動聲色。稍後幾人在園中飲酒唱曲，玉樓與瓶兒先離開，金蓮則留下陪西門慶到葡萄架下嬉戲，玩得越發放縱，一度弄得金蓮虛脫昏厥。"
    highlights:
      - "李瓶兒向西門慶坦承已懷孕臨月，為後續生子鋪路"
      - "潘金蓮偷聽李瓶兒床事，暗中吃味卻不動聲色"
      - "葡萄架下嬉戲過火，金蓮一度昏厥"
    cast:
      - name: "西門慶"
        note: "家主，與李瓶兒親熱，又在葡萄架下與金蓮嬉戲過火"
      - name: "潘金蓮"
        note: "五娘，偷聽瓶兒懷孕消息，隨後在葡萄架下嬉戲過火昏厥"
      - name: "李瓶兒"
        note: "六娘，本回向西門慶透露已懷孕臨月"
      - name: "孟玉樓"
        note: "三娘，陪同金蓮、瓶兒在花園飲酒唱曲"
      - name: "春梅"
        note: "金蓮貼身丫鬟，本回陪侍葡萄架嬉戲，也被西門慶調笑"
  c28:
    intro: "潘金蓮發現一隻睡鞋不見了，逼丫鬟秋菊、春梅到處翻找，卻在西門慶書房裡找到一隻相似的鞋，一比對是已故宋惠蓮的舊鞋，被西門慶當紀念收著，金蓮又氣又惱。另一方面，陳經濟從小鐵棍兒手裡換到金蓮真正遺失的鞋，原是前幾天在葡萄架邊掉的，他拿鞋找金蓮打情罵俏，換走她的貼身汗巾兒。金蓮得知鞋是小鐵棍兒拾走的，告到西門慶那裡，西門慶不問清楚就把孩子往死裡打。當晚金蓮又拿惠蓮的舊鞋質問西門慶，要他表明心意。"
    highlights:
      - "金蓮發現西門慶私藏亡妾宋惠蓮遺鞋為念，醋意大發"
      - "陳經濟藉還鞋向金蓮換得貼身汗巾，二人情愫暗生"
      - "西門慶為鞋子小事誤會，痛打小鐵棍兒幾乎出人命"
    cast:
      - name: "潘金蓮"
        note: "五娘，因遺鞋一事發現西門慶私藏惠蓮遺物，醋意大發"
      - name: "陳經濟"
        note: "女婿，拾得金蓮遺鞋，藉機向她換得貼身汗巾"
      - name: "西門慶"
        note: "家主，私藏亡故宋惠蓮的鞋為念，被金蓮發現逼問"
      - name: "秋菊"
        note: "金蓮丫鬟，因尋鞋不力反覆遭罵受罰"
      - name: "春梅"
        note: "金蓮貼身丫鬟，協助尋鞋、教訓秋菊"
      - name: "小鐵棍兒"
        note: "家僕來昭之子，拾得金蓮遺鞋換玩具，遭西門慶毒打"
  c29:
    intro: "潘金蓮還在為鞋的事耿耿於懷，找李瓶兒、孟玉樓一起做新鞋，閒聊間得知吳月娘私下抱怨她小題大做、拿孩子出氣。金蓮不是滋味，晚上向西門慶告狀，害來昭一家被攆去看守外面房子。同時，相士吳神仙上門為西門慶批命，說他日後加官，中年後恐有血光之災，接著依次為眾妻妾相面，說中金蓮命帶淫相、剋夫短命，瓶兒會生貴子卻藏凶兆，連丫頭春梅都被說日後有戴珠冠的福氣。午後，西門慶又去金蓮房裡，兩人親熱後一起沐浴嬉戲。"
    highlights:
      - "吳神仙逐一為眾妻妾相面，預言各人命運，為後文伏筆"
      - "金蓮被相出剋夫淫相短命，瓶兒被指會生貴子卻藏凶兆"
      - "丫鬟春梅被相出日後有戴珠冠之貴，眾人皆感意外"
    cast:
      - name: "吳神仙"
        note: "周守備介紹的相士，逐一為西門慶及眾妻妾相面斷命"
      - name: "西門慶"
        note: "家主，請相士看命相，得知未來加官與壽數之憂"
      - name: "潘金蓮"
        note: "五娘，被相士說命帶淫相、剋夫短命，午間與西門慶共浴"
      - name: "李瓶兒"
        note: "六娘，被相士說會生貴子，卻也藏著不祥之兆"
      - name: "春梅"
        note: "金蓮貼身丫鬟，意外被相士說日後有戴珠冠的福分"
      - name: "孟玉樓"
        note: "三娘，陪金蓮做鞋，轉述家中對金蓮的閒話議論"
  c30:
    intro: "西門慶忙著張羅買地擴建墓園。另一頭，進京送生辰賀禮的來保和吳主管順利辦成事，蔡太師收下厚禮十分滿意，一時興起賞西門慶提刑所副千戶官職，吳主管當上驛丞，來保也得校尉差事，三人歡喜領公文回鄉。家裡正值盛暑，眾妻妾陪西門慶在花園賞荷飲酒，李瓶兒忽然肚痛，眾人才發覺她要生了，趕忙請產婆。潘金蓮在旁冷言冷語，滿心不是滋味。最後李瓶兒順利生下男嬰，取名官哥兒，闔家歡喜，應驗了先前吳神仙相面的好命。"
    highlights:
      - "來保進京獻禮，蔡太師隨手賞西門慶提刑所副千戶官職"
      - "李瓶兒產下兒子官哥兒，呼應吳神仙先前的預言"
      - "潘金蓮因妒忌獨自躲開，種下她與瓶兒母子的心結"
    cast:
      - name: "西門慶"
        note: "家主，本回同時迎來添子與加官雙喜"
      - name: "李瓶兒"
        note: "六娘，本回順利生下兒子，取名官哥兒"
      - name: "潘金蓮"
        note: "五娘，因妒忌李瓶兒生子而躲開獨自傷心"
      - name: "來保"
        note: "西門慶家僕，本回赴京獻禮成功，帶回升官的公文"
      - name: "蔡太師"
        note: "當朝太師，收下厚禮後隨手賞官給西門慶"
      - name: "吳月娘"
        note: "大娘，本回在產房裡張羅照應李瓶兒生產"
  c31:
    intro: "西門慶升任提刑千戶，忙著置辦官服官帶，還借了一百兩銀子給求官上任缺錢的舊夥計吳典恩，應伯爵作保省了利錢。縣裡送來一名清秀小廝改名書僮兒，看管書房，和丫鬟玉簫漸生情愫。恰逢兒子官哥兒滿月，親友登門祝賀，席間一把酒壺離奇失蹤，追查之下竟是琴童兒撞見玉簫進書房找書僮兒，順手把酒壺藏起來鬧的烏龍。潘金蓮趁機暗諷李瓶兒生子不吉利，惹西門慶當眾變臉。隔天西門慶又大宴兩位內相與同僚，慶祝加官與添丁之喜。"
    highlights:
      - "玉簫與書僮兒眉來眼去，兩人情愫漸生"
      - "一把酒壺離奇失蹤，鬧出丫鬟互相賴罪的風波"
      - "潘金蓮暗諷李瓶兒生子不吉利，觸怒西門慶"
    cast:
      - name: "西門慶"
        note: "故事主角，本回升官又添丁，大宴賓客"
      - name: "應伯爵"
        note: "西門慶的頭號幫閒，本回替人作保借銀"
      - name: "書僮兒"
        note: "西門慶新收的書房小廝，本回與玉簫暗生情愫"
      - name: "玉簫"
        note: "月娘房裡的丫鬟，本回鬧出酒壺失蹤風波"
      - name: "琴童兒"
        note: "西門慶的小廝，本回偷藏酒壺引發誤會"
      - name: "潘金蓮"
        note: "西門慶五房妾，本回譏諷李瓶兒惹惱主子"
  c32:
    intro: "次日西門慶宴請縣裡官員，薛內相特地看官哥兒、添了賀禮。李桂姐見西門慶做了官，便和鴇母商量，備禮登門拜吳月娘做乾娘、自認乾女兒，好方便日後往來；吳銀兒等人看得不是滋味，向應伯爵告狀，應伯爵一語道破她是想找靠山，還勸吳銀兒也去認李瓶兒做乾娘分一杯羹。前廳宴席上，應伯爵插科打諷，逼著幾個唱的輪番遞酒獻唱。同時，潘金蓮趁李瓶兒不在，抱著官哥兒到後面炫耀，孩子當夜受驚發熱，急得請人醫治。"
    highlights:
      - "李桂姐正式拜吳月娘為乾娘，藉此攀附西門慶家"
      - "應伯爵一語道破李桂姐拜乾娘的真實目的"
      - "潘金蓮抱官哥兒外出炫耀，孩子當夜受驚發熱"
    cast:
      - name: "李桂姐"
        note: "麗春院妓女，本回拜吳月娘為乾娘以求庇護"
      - name: "應伯爵"
        note: "西門慶頭號幫閒，本回看穿李桂姐拜乾娘的心機"
      - name: "吳月娘"
        note: "西門慶正妻，本回被李桂姐拜認做乾娘"
      - name: "吳銀兒"
        note: "麗春院一帶妓女，本回向應伯爵透露李桂姐心思"
      - name: "潘金蓮"
        note: "西門慶五房妾，本回抱官哥兒外出害他受驚生病"
      - name: "李瓶兒"
        note: "西門慶六房妾，本回擔心孩子夜裡發熱驚哭"
  c33:
    intro: "西門慶新開絨線鋪，經應伯爵推薦僱用能言善道的韓道國當夥計。月娘生日期間，李瓶兒送潘姥姥衣物，潘金蓮設宴回請，陳經濟來拿衣服被灌酒，鑰匙又被金蓮扣住，逼他唱了幾首葷味小曲才肯還。眾女眷結伴參觀新買的喬家舊宅，月娘上樓時滑腳摔了一跌，當夜竟小產掉了一個男胎，卻瞞著西門慶未說。另一頭，韓道國在外誇口攀附西門慶，家裡妻子卻和小叔通姦被街坊當場抓獲，鬧得滿街皆知，他聞訊倉皇逃走。"
    highlights:
      - "陳經濟被潘金蓮扣住鑰匙，逼唱葷味小曲方肯罷休"
      - "吳月娘參觀新宅意外摔跌，當夜小產瞞著西門慶"
      - "韓道國之妻與小叔通姦被街坊當場捉獲，鬧得滿城皆知"
    cast:
      - name: "陳經濟"
        note: "西門慶女婿，本回被潘金蓮扣住鑰匙逼著唱曲"
      - name: "潘金蓮"
        note: "西門慶五房妾，本回設局讓陳經濟出醜唱小曲"
      - name: "吳月娘"
        note: "西門慶正妻，本回參觀新宅摔跌，當夜小產"
      - name: "李瓶兒"
        note: "西門慶六房妾，本回送禮潘姥姥，陪金蓮喫酒"
      - name: "韓道國"
        note: "新聘的絨線鋪夥計，本回外面誇口卻家醜曝光"
      - name: "六姐"
        note: "韓道國之妻，本回與小叔通姦被街坊當場捉住"
  c34:
    intro: "韓道國之妻與小叔通姦，被街坊當場捉住送官。韓道國急忙求應伯爵向西門慶求情，西門慶動用官威放回嫂子，還把案子改到自己衙門審理，隔天升堂反倒重打當初檢舉的幾個年輕人，收押候審。這幾家湊錢託應伯爵求情，應伯爵轉頭偷偷塞銀子給書僮兒，託他走李瓶兒的門路說情。書僮兒藉機揩油，買酒菜孝敬李瓶兒，卻漏了平安兒一份，平安兒因此心生怨恨，又撞見西門慶與書僮兒在書房裡的曖昧情形，兩人心結因此更深。"
    highlights:
      - "西門慶動用官威，重罰檢舉韓家醜事的青年"
      - "應伯爵買通書僮兒，走李瓶兒門路替人求情"
      - "平安兒因書僮兒獨吞好處，種下記恨的種子"
    cast:
      - name: "書僮兒"
        note: "西門慶書房寵僮，本回替人牽線走李瓶兒門路撈錢"
      - name: "平安兒"
        note: "看大門的小廝，本回因分不到好處記恨書僮兒"
      - name: "應伯爵"
        note: "西門慶頭號幫閒，本回替韓家和被押青年兩頭牽線"
      - name: "韓道國"
        note: "絨線鋪夥計，本回妻子與小叔通姦一事驚動全家"
      - name: "西門慶"
        note: "故事主角，本回濫用刑名之權整治檢舉的青年"
      - name: "李瓶兒"
        note: "西門慶六房妾，本回代書僮兒向主子說情放人"
  c35:
    intro: "西門慶正式放了先前收押的幾個年輕人，官司了結。書僮兒得知平安兒在背後說他閒話，添油加醋告訴西門慶，說平安兒偷聽窗外、還罵他不知檢點。西門慶正在氣頭上，又逢平安兒擅自放友人白來搶進門，便藉機把平安兒拶指痛打二十棍，連在旁的畫童兒也陪著受刑。潘金蓮、孟玉樓在旁聽見議論紛紛。當晚韓道國送禮謝恩，西門慶只邀應伯爵、謝希大一同吃酒，席間起哄要書僮兒扮成女子模樣，塗脂抹粉唱曲遞酒，眾人喫得盡興，鬧到深夜。"
    highlights:
      - "西門慶藉故重罰平安兒，手段狠過往常"
      - "書僮兒男扮女裝唱曲遞酒，取悅應伯爵等人"
      - "應伯爵察言觀色，暗中拿賁四的把柄要錢"
    cast:
      - name: "平安兒"
        note: "看大門的小廝，本回被西門慶痛打二十棍"
      - name: "書僮兒"
        note: "書房寵僮，本回向西門慶告平安兒的黑狀"
      - name: "西門慶"
        note: "故事主角，本回遷怒重責平安兒又設宴取樂"
      - name: "應伯爵"
        note: "頭號幫閒，本回起哄要書僮兒扮女裝唱曲"
      - name: "潘金蓮"
        note: "西門慶五房妾，本回聽聞責打之事議論不平"
      - name: "韓道國"
        note: "絨線鋪夥計，本回送禮謝恩答謝西門慶開脫"
  c36:
    intro: "西門慶收到東京蔡太師管家翟謙的信，這才想起早先答應替翟謙尋一名女子做妾，卻忙得忘了辦；信中還提到新科狀元蔡一泉（蔡太師義子）將路過清河，託西門慶接待。西門慶教月娘幫忙囬信穩住翟謙，再慢慢託媒人尋人。隨後西門慶派人到新河口迎接蔡狀元與同船的安進士，備厚禮款待，設宴看戲，書僮兒扮旦唱曲，安進士看得入迷。西門慶留兩人住了一夜，臨走又送上豐厚銀緞，賓主盡歡而別。"
    highlights:
      - "翟謙來信提親，揭開蔡狀元即將來訪的伏筆"
      - "西門慶重金款待蔡狀元、安進士，佈局未來人脈"
      - "書僮兒再次扮旦唱曲，引來安進士的曖昧興趣"
    cast:
      - name: "西門慶"
        note: "故事主角，本回結交新科狀元蔡蘊為日後鋪路"
      - name: "翟謙"
        note: "蔡太師管家，本回來信託西門慶尋女子並薦狀元"
      - name: "吳月娘"
        note: "西門慶正妻，本回教丈夫如何囬信穩住翟謙"
      - name: "蔡蘊"
        note: "新科狀元蔡太師義子，本回途經清河受西門慶款待"
      - name: "安忱"
        note: "與蔡蘊同船的新科進士，本回同受邀作客看戲"
      - name: "書僮兒"
        note: "書房寵僮，本回扮女裝唱曲，惹安進士著迷"
  c37:
    intro: "馮媽媽奉西門慶之託，替東京翟管家找續房，相中自家夥計韓道國的女兒愛姐。西門慶登門相看，卻看上愛姐的母親王六兒。愛姐順利許配翟家遠嫁東京，王六兒獨守空閨，西門慶趁機託馮媽媽牽線，兩人很快勾搭成奸，往來漸密。馮媽媽兩頭跑腿張羅，連李瓶兒房裡該辦的事都耽誤了。"
    highlights:
      - "馮媽媽穿針引線做媒，反倒促成西門慶新歡"
      - "西門慶對夥計韓道國的老婆一見動心"
      - "王六兒懂得討好，很快就抓住西門慶的心"
    cast:
      - name: "西門慶"
        note: "本書主角，富商兼官員，本回看上夥計的老婆"
      - name: "馮媽媽"
        note: "媒婆，替翟管家找續房，順勢牽線西門慶偷情"
      - name: "韓道國"
        note: "西門慶的夥計，本回女兒出嫁，渾然不知妻子出軌"
      - name: "王六兒"
        note: "韓道國之妻，本回被西門慶看上，展開婚外情"
      - name: "韓愛姐"
        note: "韓道國之女，十五歲，本回許配翟管家、遠嫁東京"
      - name: "李瓶兒"
        note: "西門慶妾室，本回因馮媽媽疏於照應而抱怨"
  c38:
    intro: "西門慶在王六兒家撞見韓道國的弟弟韓二耍錢輸了鬧酒，還出言恐嚇要揭穿嫂子與人私通。西門慶隔天便動用官府勢力，把韓二抓去衙門重打一頓，藉機立威。韓道國夫婦知情卻選擇睜眼閉眼，繼續倚仗西門慶的財勢過活。另一頭，潘金蓮因西門慶多日不進房，雪夜獨守空房彈琵琶訴怨；西門慶那晚原在李瓶兒房裡飲酒，聽見琵琶聲，兩人特地把金蓮請來下棋喝酒，李瓶兒還主動把當晚讓給了她。"
    highlights:
      - "西門慶濫用官府權勢，教訓撞破姦情的韓二"
      - "潘金蓮雪夜彈琵琶訴怨，經典失寵場面"
      - "李瓶兒察言觀色，主動讓出西門慶當晚"
    cast:
      - name: "西門慶"
        note: "本回濫用官威教訓情敵，夜宿李瓶兒房又移駕潘金蓮房"
      - name: "王六兒"
        note: "西門慶婚外情對象，本回遭小叔騷擾恐嚇"
      - name: "韓二"
        note: "韓道國之弟，好賭滋事，本回撞破姦情反遭毒打"
      - name: "韓道國"
        note: "王六兒之夫，本回明知妻子外遇仍選擇隱忍得利"
      - name: "潘金蓮"
        note: "西門慶五房，本回獨守空閨、雪夜彈琵琶訴怨失寵"
      - name: "李瓶兒"
        note: "西門慶六房，本回留西門慶過夜，又主動讓給潘金蓮"
  c39:
    intro: "西門慶想起去年官哥兒出生時許下的醮願一直沒還，便選在正月初九，親自到玉皇廟辦了一整天盛大的還願法事，順道把官哥兒寄名廟裡，取了個道號叫吳應元。廟裡送回家一堆小道士行頭，家中女眷圍著孩子又笑又鬧。這天恰好是潘金蓮的生日，卻沒人顧得上，她看祭文名單只寫著月娘和李瓶兒母子，自己完全沒被提到，心裡很不是滋味。西門慶當晚在廟裡喝酒到深夜沒回家，晚間月娘等人聽尼姑說因果故事直到四更天。"
    highlights:
      - "官哥兒在玉皇廟寄名，取道號吳應元"
      - "祭文只列月娘李瓶兒，金蓮壽星當天被冷落"
      - "尼姑王姑子深夜說因果寶卷，月娘聽得入迷"
    cast:
      - name: "西門慶"
        note: "主辦玉皇廟醮儀還願，並為兒子官哥兒寄名"
      - name: "吳月娘"
        note: "提醒西門慶還願一事，本回主持夜間聽經"
      - name: "李瓶兒"
        note: "官哥兒之母，本回隨行寄名，孩子被打扮成小道士"
      - name: "潘金蓮"
        note: "本回生日卻被冷落，又因祭文沒列自己而不忿"
      - name: "吳道官"
        note: "玉皇廟住持，本回主持醮儀，替官哥兒取名吳應元"
      - name: "王姑子"
        note: "尼僧，本回深夜替月娘一行說因果寶卷故事"
  c40:
    intro: "當夜月娘向尼姑王姑子透露自己曾經流產，王姑子便獻求子偏方，還提議用頭生兒的胎盤入藥，暗指官哥兒，月娘不肯佔李瓶兒便宜，只請她另尋門路。次日西門慶睡醒，李瓶兒和潘金蓮抱著打扮成小道士的官哥兒逗他開心。晚上潘金蓮心生一計，扮成剛買來的丫鬟，聯手李瓶兒、陳經濟編故事，哄得月娘一度真信西門慶偷買了新人，鬧了場笑話才拆穿，末了西門慶還替眾妻妾裁製新衣。"
    highlights:
      - "王姑子獻胎盤求子偏方，暗指官哥兒，埋下隱患"
      - "潘金蓮扮成新買丫鬟惡搞全家，笑鬧收場"
      - "眾妻妾依寵愛程度分裁新衣，雪娥明顯較差"
    cast:
      - name: "吳月娘"
        note: "本回向王姑子透露曾流產，暗中謀求偏方求子"
      - name: "王姑子"
        note: "尼僧，本回獻求子偏方，暗示用官哥兒胎盤"
      - name: "李瓶兒"
        note: "官哥兒之母，本回抱兒逗西門慶開心討寵"
      - name: "潘金蓮"
        note: "本回扮成剛買的丫鬟，惡搞全家騙倒眾人"
      - name: "孟玉樓"
        note: "本回向西門慶謊報買了新丫鬟，戳破金蓮的惡作劇"
      - name: "西門慶"
        note: "本回被瞞著哄了一場，事後替各房妻妾裁新衣"
  c41:
    intro: "喬家在燈節酒席上款待西門慶眾妻妾，席間喬家新生女兒和官哥兒一同躺在炕上玩鬧，眾女眷一時興起，竟當場替兩個孩子割衫襟定了親。回家後西門慶聽說此事並不高興，嫌喬家只是有錢的白衣人家，配不上自己現在的官身。潘金蓮趁機頂了一句嘴，被西門慶當眾罵了幾句，氣得躲回房裡哭，越想越不甘心，回房拿丫鬟秋菊出氣狠打，話裡話外都是衝著隔壁李瓶兒說的，李瓶兒聽得一清二楚，只能悶聲摀著孩子耳朵暗自流淚。"
    highlights:
      - "喬家酒席上，女眷即興替官哥兒與喬家女兒定親"
      - "西門慶嫌喬家門第不夠格，婚事埋下不安伏筆"
      - "潘金蓮頂撞挨罵，遷怒毒打丫鬟指桑罵槐氣李瓶兒"
    cast:
      - name: "西門慶"
        note: "本回不滿倉促定親，嫌喬家門第配不上官身"
      - name: "吳月娘"
        note: "正室，本回酒席上一時興起替官哥兒定下這門親"
      - name: "李瓶兒"
        note: "官哥兒之母，本回因定親得意，卻遭金蓮指著罵"
      - name: "潘金蓮"
        note: "本回當眾被西門慶罵，遷怒毒打丫鬟出氣"
      - name: "喬大戶娘子"
        note: "喬家女主人，本回與月娘臨時結為親家"
      - name: "秋菊"
        note: "潘金蓮的丫鬟，本回因開門遲了無端遭毒打"
  c42:
    intro: "西門慶為官哥兒和喬家女兒的親事送去正式聘禮，請老馮當媒人，訂下十五日請喬家女眷來賀，順便替李瓶兒過生日、看燈。吳銀兒趁機正式拜李瓶兒做乾娘，惹得李桂姐吃味。當天家裡擺酒請官夫人看戲，西門慶卻帶應伯爵、謝希大到獅子街樓上看燈，還悄悄接了情婦王六兒來作陪，韓道國明知也不阻攔。樓下滿街百姓擠著看西門家放的盛大煙火，散場後西門慶就留下和王六兒過夜，被家僕的孩子小鐵棍兒偷看見，挨了他娘一丈青一頓罵。"
    highlights:
      - "樓上宴飲賞燈，樓下滿街百姓爭看西門家放的盛大煙火"
      - "西門慶攜情婦王六兒公開看燈作陪，韓道國默許"
      - "吳銀兒拜李瓶兒做乾娘，李桂姐明顯吃味"
    cast:
      - name: "西門慶"
        note: "本回一邊辦官哥兒的親事，一邊攜情婦公開看燈"
      - name: "王六兒"
        note: "西門慶情婦，本回被邀到獅子街公開露面作陪"
      - name: "韓道國"
        note: "王六兒之夫，本回明知妻子赴約仍不阻攔"
      - name: "應伯爵"
        note: "西門慶友人，本回陪同賞燈打雙陸、插科打諢"
      - name: "李瓶兒"
        note: "本回生日恰逢燈節，家中設宴為她慶生"
      - name: "吳銀兒"
        note: "青樓歌女，本回正式拜李瓶兒為乾娘"
  c43:
    intro: "西門慶收李智黃四還的銀子，得四錠金鐲給官哥兒把玩，卻丟了一錠。潘金蓮聽見李瓶兒房裡亂著找金子，便跑去向月娘告狀，話裡酸李瓶兒仗著有錢亂花。西門慶回來被金蓮幾句話惹惱，動手要打她，金蓮反倒撒潑頂回去，兩人吵成一團，靠月娘勸開。西門慶隨後出門應酬，家裡則忙著迎接喬家親戚——喬五太太登門，她是當今東宮貴妃的姑姑，月娘率眾妻妾盛裝款待，設宴看戲放煙火，場面十足風光。"
    highlights:
      - "官哥兒玩金鐲丟一錠，掀起妻妾風波"
      - "潘金蓮挨打反撒潑，夫妻交鋒經典場面"
      - "喬五太太登門，貴妃姑姑身份撐足排場"
    cast:
      - name: "西門慶"
        note: "本書主角，本回因丟金動怒打潘金蓮，又外出應酬"
      - name: "潘金蓮"
        note: "西門慶妻妾之一，本回挑李瓶兒是非，挨打後撒潑反擊"
      - name: "李瓶兒"
        note: "西門慶妻妾，官哥兒之母，本回因金鐲遺失而心慌"
      - name: "吳月娘"
        note: "西門慶正室，本回盛裝接待喬五太太並調解夫妻爭執"
      - name: "喬五太太"
        note: "當今東宮貴妃的姑姑，本回初次登門議定兩家親事"
      - name: "官哥兒"
        note: "西門慶與李瓶兒之子，本回把玩金鐲引發丟金風波"
  c44:
    intro: "李桂姐、吳銀兒等唱的想告辭回家，月娘要她們等西門慶回來再定。西門慶帶著酒意回來，讓桂姐吳銀兒過了節再走，留下四人唱曲到深夜。忽然小廝抓到李嬌兒房裡丫頭夏花兒行跡可疑，搜出先前丟失的那錠金子——原來是她在李瓶兒房裡拾到私藏，想偷跑出去。西門慶大怒，命人拶刑拷打逼問，夏花兒招認後被判要賣掉。當夜西門慶改到潘金蓮房裡歇宿，李瓶兒則和吳銀兒下棋聊心事到三更。"
    highlights:
      - "遺失金子謎底揭曉，夏花兒偷藏被拶刑逼供"
      - "西門慶動用拶刑逼供丫頭，場面血腥駭人"
      - "李桂姐私下教夏花兒懂事討好，明哲保身"
    cast:
      - name: "西門慶"
        note: "本書主角，本回醉後查出丟金真相，怒刑丫頭夏花兒"
      - name: "夏花兒"
        note: "李嬌兒房裡丫頭，本回因偷藏金鐲被拶刑逼供"
      - name: "李嬌兒"
        note: "西門慶妻妾之一，本回房裡丫頭偷金鬧出風波"
      - name: "李桂姐"
        note: "李嬌兒姪女、當紅妓女，本回私下教訓夏花兒要懂事"
      - name: "李瓶兒"
        note: "西門慶妻妾，官哥兒生母，本回夜裡向吳銀兒訴心事"
      - name: "吳銀兒"
        note: "唱的，李瓶兒乾女兒，本回陪她下棋聊天到深夜"
  c45:
    intro: "西門慶放假在家，應伯爵替黃四等商人張羅借銀，又撮合買下一座典當來的螺鈿屏風和銅鑼銅鼓。李三黃四來送禮謝恩，順勢再談借銀延息。李桂姐要回家前，特地找西門慶求情，請他別把李嬌兒房裡的丫頭夏花兒賣掉，西門慶答應，卻讓畫童去傳話，沒讓玳安直接回報。月娘原本已吩咐找媒人賣人，聽聞消息繞了個彎才傳到，加上本就對玳安有氣，便當眾痛罵他一頓。傍晚眾妻妾便動身前往吳大妗子家過節飲酒。"
    highlights:
      - "李桂姐親自向西門慶求情，救回丫頭夏花兒"
      - "玳安傳話方式惹怒月娘，當眾遭痛罵"
      - "應伯爵謝希大看穿桂姐另有心事，未說破"
    cast:
      - name: "西門慶"
        note: "本書主角，本回買下古董屏風，也答應桂姐留下丫頭"
      - name: "應伯爵"
        note: "西門慶食客兼結拜兄弟，本回撮合黃四借銀事"
      - name: "李桂姐"
        note: "當紅妓女，本回向西門慶求情救下夏花兒後歸家"
      - name: "吳月娘"
        note: "西門慶正室，本回誤會玳安兩面討好而痛罵他"
      - name: "玳安"
        note: "西門慶貼身小廝，本回因傳話方式不當挨大娘罵"
      - name: "黃四"
        note: "常向西門慶借貸的商人，本回再託應伯爵牽線借銀"
  c46:
    intro: "元宵夜西門慶在家門前擺酒設宴，聽樂工彈唱、放煙火看熱鬧。丫鬟們想跟著湊熱鬧，玉簫和書僮嬉鬧打翻酒瓶挨了罵；後來四個丫鬟獲准去賁四娘子家吃酒作伴。月娘在吳大妗子家吃酒，因下雪要取皮襖，玳安轉託別人去辦，惹得她更生氣，當眾罵了他一頓。次日，月娘、玉樓、李瓶兒送尼姑回去，路上遇賣卦婆子算命，斷言李瓶兒七八月間有血光之災，潘金蓮則不肯讓她卜，自嘲命短。"
    highlights:
      - "元宵夜門前擺酒放煙火，鬧熱市井全景"
      - "卦婆算命斷李瓶兒七八月有血光之災"
      - "玳安與小玉暗通私情，丫鬟間鬥嘴逗趣"
    cast:
      - name: "西門慶"
        note: "本書主角，本回元宵夜在自家門前設宴，聽曲看放煙火"
      - name: "潘金蓮"
        note: "西門慶妻妾之一，本回嫌棄舊皮襖又拒絕算命"
      - name: "李瓶兒"
        note: "官哥兒生母，本回被卦婆斷言七八月有血光之災"
      - name: "吳月娘"
        note: "西門慶正室，本回為皮襖、傳話等事連番發怒"
      - name: "玳安"
        note: "西門慶貼身小廝，本回取皮襖不順，惹月娘再罵"
      - name: "卜卦婆子"
        note: "街頭算命的老婦，本回替月娘、玉樓、李瓶兒算命"
  c47:
    intro: "故事岔開一筆，講揚州富商苗天秀不聽勸阻，硬要遠行投靠表兄謀前程，途中被貪心的家人苗青和兩個船夫合謀殺害，財物被劫，屍首推入河中。隨行小廝安童落水獲救，告狀捉住兩名船夫，主謀苗青原本已運贓貨到清河縣發賣，事跡敗露後躲進西門慶外遇對象王六兒的鄰居家，重金行賄求放一條生路。西門慶看過賄款，非但沒有秉公辦案，最後拿了苗青奉上的鉅款，和夏提刑平分贓銀，暗中放走真兇，只把兩個船夫定成死罪了案。"
    highlights:
      - "揚州苗員外遭家人與船夫合謀謀財害命"
      - "西門慶靠王六兒牽線收賄，枉法放走真兇苗青"
      - "安童死裡逃生告狀，冤案留下翻案伏筆"
    cast:
      - name: "苗天秀"
        note: "揚州富商，本回不聽勸阻遠行，途中遭合謀殺害"
      - name: "苗青"
        note: "苗天秀家人，本回夥同船夫害主謀財，事發後躲藏清河"
      - name: "安童"
        note: "苗天秀隨行小廝，本回死裡逃生並出面告狀追兇"
      - name: "王六兒"
        note: "韓道國之妻，西門慶外遇對象，本回替苗青牽線行賄"
      - name: "西門慶"
        note: "本書主角，本回收下鉅額賄款，枉法放走真兇苗青"
      - name: "夏提刑"
        note: "西門慶同僚官員，本回與他平分贓款、一同枉法"
  c48:
    intro: "苗天秀的小廝安童告到巡按御史曾孝序處，查出屍首確認苗青是主謀後，曾御史一面派人去揚州抓人，一面上奏參劾西門慶與夏提刑受賄枉法。同時家裡清明節上墳祭祖，官哥兒被鑼鼓聲嚇到，回家後發燒哭鬧不肯吃奶。西門慶得知參本已上呈，急忙和夏提刑備厚禮，派人星夜趕往東京找蔡太師管家翟謙求救，靠關係把參本壓下，總算逃過一劫，還順道聽到日後做鹽引生意的好消息。"
    highlights:
      - "曾御史查出真相，具本參劾西門慶受賄枉法"
      - "官哥兒上墳受驚，回家後發燒哭鬧不止"
      - "西門慶靠翟管家壓下參本，躲過一劫"
    cast:
      - name: "曾孝序"
        note: "新任巡按御史，本回查出苗天秀命案真相並參劾西門慶"
      - name: "苗天秀"
        note: "上回遭害的揚州富商，本回屍首被找到並驗明死因"
      - name: "西門慶"
        note: "本書主角，本回被曾御史參劾受賄枉法，急忙送禮化解"
      - name: "夏提刑"
        note: "西門慶同僚官員，本回一同被參，跟著送禮疏通"
      - name: "官哥兒"
        note: "西門慶與李瓶兒之子，本回上墳受驚後發燒哭鬧"
      - name: "翟謙"
        note: "蔡太師的管家，本回替西門慶壓下參本化解危機"
  c49:
    intro: "西門慶為討好巡鹽御史蔡御史，聯合巡按宋御史大擺酒席迎接。宋御史坐一會就先告辭，蔡御史留下過一夜，西門慶找來妓女董嬌兒、韓金釧兒陪他喝酒取樂，還託他日後在揚州提早幫自家商人支鹽。次日在永福寺辦餞行酒席，西門慶遇到一名怪模怪樣的雲遊胡僧，見他相貌奇特便邀回家中款待酒飯，胡僧見他誠心，便贈他幾顆壯陽藥丸與藥膏，仔細交代用法與禁忌。"
    highlights:
      - "蔡御史夜宿西門家，兩名妓女陪伴取樂"
      - "西門慶藉宴請官員談成鹽引生意"
      - "永福寺巧遇胡僧，埋下春藥禍根"
    cast:
      - name: "西門慶"
        note: "一家之主，設宴巴結官員又向胡僧求取壯陽藥"
      - name: "蔡御史"
        note: "新任巡鹽御史，赴宴後留宿西門家並收下請託"
      - name: "宋御史"
        note: "本地巡按御史，赴宴後不久便先行告辭"
      - name: "胡僧"
        note: "雲遊異僧，被請回西門家，贈壯陽藥丸與藥膏"
      - name: "董嬌兒"
        note: "妓院歌女，奉西門慶之命陪蔡御史過夜"
      - name: "韓金釧兒"
        note: "妓院歌女，隨董嬌兒一同陪蔡御史飲宴取樂"
  c50:
    intro: "家裡正幫李嬌兒做生日，薛姑子等尼姑上門講經。西門慶趁機帶著胡僧給的壯陽藥，跑去情婦王六兒（韓道國之妻）家中試藥取樂，卻被小廝琴童躲在窗外偷聽個清楚。另一小廝玳安則跑去蝴蝶巷逛妓院，和相熟的兩個小妓女廝混。西門慶深夜回家，藥效未消，又跑去李瓶兒房裡纏她同房，李瓶兒雖身體不便仍勉強應付。潘金蓮發現自己房裡的房事用品被偷拿走，心裡犯疑生氣。薛姑子則悄悄交給吳月娘一包求子偏方，囑她擇日服用求喜。"
    highlights:
      - "琴童窗外偷聽西門慶與王六兒私通"
      - "玳安夜遊蝴蝶巷，戲弄妓院姐兒"
      - "潘金蓮發現房事用品失蹤，心生猜忌"
    cast:
      - name: "西門慶"
        note: "一家之主，帶著胡僧壯陽藥夜訪王六兒又轉往李瓶兒房"
      - name: "王六兒"
        note: "韓道國之妻，西門慶的地下情婦，本回被用藥試驗"
      - name: "潘金蓮"
        note: "西門慶的五娘，發現房事用品被偷用，心生嫉妒"
      - name: "李瓶兒"
        note: "西門慶的六娘、官哥兒之母，本回身體不適仍被迫同房"
      - name: "琴童"
        note: "西門慶小廝，躲在窗外偷聽主人私通經過"
      - name: "玳安"
        note: "西門慶親隨小廝，本回夜遊妓院嬉鬧"
  c51:
    intro: "潘金蓮為了爭寵，向吳月娘捏造謊話，說李瓶兒在背後說她耍威風、假裝管家。月娘信以為真動了氣，李瓶兒被冤枉得又氣又委屈，飯都吃不下。家裡忙著打點韓道國、崔本、來保出發揚州做鹽貨生意，應伯爵也上門替商人李三、黃四求西門慶借錢。妓女李桂姐因相好的貴公子王三官惹上官府麻煩，怕被抓去問話，倉皇跑來投靠，西門慶答應收留並託人到京城打點說情。當晚眾妻妾聽尼姑演說佛經，西門慶又纏著潘金蓮同房。"
    highlights:
      - "潘金蓮捏造謊言，害李瓶兒被誤會挨罵"
      - "李桂姐因王三官事件逃來投靠西門慶"
      - "眾人聽尼姑演說金剛科儀佛經"
    cast:
      - name: "潘金蓮"
        note: "西門慶的五娘，為爭寵捏造謊言挑起月娘與李瓶兒心結"
      - name: "吳月娘"
        note: "西門慶正室，誤信謊言遷怒李瓶兒"
      - name: "李瓶兒"
        note: "西門慶的六娘，被誣陷耍威風含冤哭泣不敢辯白"
      - name: "李桂姐"
        note: "相熟妓女，因恩客王三官惹禍逃來投靠西門慶"
      - name: "應伯爵"
        note: "西門慶的幫閒好友，替商人李三黃四說項借錢"
      - name: "西門慶"
        note: "一家之主，安撫妻妾風波又替李桂姐找關係說情"
  c52:
    intro: "薛姑子與王姑子講完經要回去，臨走前叮囑吳月娘記得依日子服藥求子。眾妻妾與妓女李桂姐同遊花園，還去看西門慶在書房睡覺。應伯爵來訪，和西門慶商量借錢給商人李三、黃四，又與李桂姐打鬧調笑。官哥兒因剃頭受驚大哭，李瓶兒一番擔心。飯後西門慶趁人不注意，把李桂姐帶到花園山洞偷歡，被應伯爵闖進撞見，笑鬧一場。潘金蓮也藉看蘑菇，引誘女婿陳經濟到另一山洞親熱，卻因官哥兒被貓嚇哭而倉促收場。"
    highlights:
      - "西門慶與李桂姐在花園山洞偷歡，被應伯爵撞見"
      - "潘金蓮藉看蘑菇引誘女婿陳經濟到山洞親熱"
      - "官哥兒剃頭受驚大哭，李瓶兒緊張不已"
    cast:
      - name: "西門慶"
        note: "一家之主，本回分別與李桂姐、潘金蓮牽涉幽會"
      - name: "李桂姐"
        note: "相熟妓女，暫住西門家，與西門慶在山洞偷歡"
      - name: "應伯爵"
        note: "幫閒好友，撞見西門慶與李桂姐幽會並打趣"
      - name: "潘金蓮"
        note: "西門慶的五娘，藉看蘑菇引誘女婿陳經濟到山洞親熱"
      - name: "陳經濟"
        note: "西門慶女婿，被潘金蓮引誘卻因故未能得手"
      - name: "李瓶兒"
        note: "西門慶的六娘、官哥兒之母，本回因孩子剃頭受驚擔心"
  c53:
    intro: "官哥兒被貓嚇過後一直不安穩。吳月娘無意間聽見潘金蓮和孟玉樓私下說她自己沒生養，卻假意疼愛別人的孩子，氣得傷心又不敢發作，下定決心靠尼姑偏方求子。當晚西門慶喝醉誤闖月娘房，月娘怕耽誤明日吃藥求子，把他推去潘金蓮房過夜。次日正是吃藥的日子，月娘瞞著眾人服下求子藥，當晚西門慶果然又來同房。同一天官哥兒忽然抽搭、翻白眼、口吐白沫，全家嚇得團團轉，趕緊占卦、請道士做法謝土，孩子才漸漸安穩下來。"
    highlights:
      - "吳月娘無意間聽見潘金蓮背後說她閒話，氣得落淚"
      - "月娘暗服求子偏方，把握求子良辰"
      - "官哥兒忽然抽搭吐白沫，全家請道士謝土"
    cast:
      - name: "吳月娘"
        note: "西門慶正室，無意間聽見閒話大受傷心決心求子"
      - name: "潘金蓮"
        note: "西門慶的五娘，背後說月娘閒話又與陳經濟眉來眼去"
      - name: "李瓶兒"
        note: "西門慶的六娘、官哥兒之母，本回為孩子驚厥心急如焚"
      - name: "西門慶"
        note: "一家之主，白天應酬，夜裡誤闖月娘房又轉去潘金蓮處"
      - name: "應伯爵"
        note: "幫閒好友，提醒西門慶兌現借錢給李三黃四"
      - name: "陳經濟"
        note: "西門慶女婿，續與潘金蓮眉來眼去，酒醉誤事挨罵"
  c54:
    intro: "應伯爵在家邀白來創、常時節、謝希大、吳典恩聚會，眾人為下棋悔棋鬧了一場，拿扇子手帕作賭注。西門慶帶著妓女韓金釧兒、吳銀兒前來會合，一行人乘船到劉太監花園野宴，吃酒聽曲取笑，應伯爵被灌了好幾碗酒，又偷看韓金釧兒小解逗弄她。正熱鬧時，家裡差人來報李瓶兒突然肚痛，西門慶急忙趕回請任醫官看診。任醫官隔布把脈，診斷是產後氣血兩虛、肝火偏旺，開方煎藥服用後，她熟睡一夜，次日疼痛漸緩。"
    highlights:
      - "應伯爵郊遊聚會，眾人下棋鬥嘴又互相整人"
      - "應伯爵偷看韓金釧兒小解逗弄取樂"
      - "李瓶兒驟然腹痛，任醫官把脈診出病根"
    cast:
      - name: "應伯爵"
        note: "幫閒好友，主辦郊遊聚會又愛捉弄他人"
      - name: "西門慶"
        note: "一家之主，郊遊途中驚聞李瓶兒急病趕忙回家"
      - name: "李瓶兒"
        note: "西門慶的六娘，本回突發腹痛，經任醫官診出病因"
      - name: "韓金釧兒"
        note: "陪西門慶郊遊的妓女，遭應伯爵偷看逗弄"
      - name: "常時節"
        note: "應伯爵友人，與白來創下棋起爭執互控悔棋"
      - name: "任醫官"
        note: "名醫，本回為李瓶兒把脈診治腹痛病因"
  c55:
    intro: "西門慶帶大批壽禮親赴東京，替蔡太師做壽，重金厚禮打通關係，順利拜作乾親，認蔡太師當乾爹。席間巧遇揚州老友苗員外，苗員外設宴款待，還想把身邊兩個歌童送他，西門慶當面婉拒。啟程回家後，苗員外仍守信派人千里送來兩個歌童投靠。同時，家裡潘金蓮趁他不在，寫信勾引女婿陳經濟，兩人在花園私會親熱，還被孟玉樓瞧見。西門慶平安回家，與妻妾重聚，聽兩個新來歌童獻唱，滿心歡喜，潘金蓮也看得心動。"
    highlights:
      - "西門慶重金拜蔡太師為乾爹，攀附權貴巔峰"
      - "苗員外一諾千金，千里送歌童投靠西門家"
      - "潘金蓮勾引女婿陳經濟，私會被孟玉樓撞見"
    cast:
      - name: "西門慶"
        note: "本回男主角，遠赴東京替蔡太師慶壽並拜為乾親"
      - name: "蔡太師"
        note: "當朝太師，本回收西門慶為乾兒子"
      - name: "苗員外"
        note: "揚州財主，西門慶故交，本回贈送兩名歌童"
      - name: "潘金蓮"
        note: "西門慶五娘，本回西門慶不在時勾引女婿"
      - name: "陳經濟"
        note: "西門慶女婿，本回與五娘潘金蓮私會被撞見"
      - name: "孟玉樓"
        note: "西門慶三娘，本回撞見金蓮與經濟私會"
  c56:
    intro: "常時節家窮，被老婆嫌棄沒房子住，只好託應伯爵向西門慶求助。西門慶念舊情，先給十二兩銀子應急，還承諾日後幫他置產，常時節老婆一見銀子立刻消氣，兩人和好如初。另一頭，應伯爵向西門慶推薦老友水秀才來當寫信的先生，講了水秀才才學過人的好話，還唸出他的詩文。西門慶起了興趣，追問水秀才人品，應伯爵才說出他曾在李侍郎家與丫頭小廝有染，被主人趕出來的醜事。西門慶聽了心生疑慮，決定另尋他人。"
    highlights:
      - "應伯爵妙解水秀才藏頭詩，展現插科打諧功力"
      - "水秀才曾與丫頭小廝有染，被主人逐出的醜聞"
      - "西門慶仗義接濟常時節，展現闊綽的一面"
    cast:
      - name: "西門慶"
        note: "本回接濟常時節，並考慮聘請寫信先生"
      - name: "應伯爵"
        note: "西門慶清客，本回替常時節求助又薦水秀才"
      - name: "常時節"
        note: "西門慶結拜兄弟，本回窮困求助獲銀接濟"
      - name: "水秀才"
        note: "應伯爵舊友，才學佳但因與丫頭小廝有染被逐出"
      - name: "常時節妻"
        note: "常時節之妻，本回因窮困抱怨又因銀轉喜"
  c57:
    intro: "一位道長老的西印度僧人上門，說當地永福寺年久失修，向西門慶募款重建。西門慶十分感動，當場認捐五百兩，應伯爵在旁插科打諧，說自己也算「心施」功德主。西門慶告訴吳月娘這事，又提到官哥將來要當文官，潘金蓮聽見氣得罵人。接著王姑子帶著薛姑子上門，薛姑子勸西門慶印造《陀羅經》替官哥祈福，西門慶又出三十兩銀子交辦印經。趁大家談功德時，潘金蓮又和女婿陳經濟在迴廊私會，晚上西門慶設宴款待親友。"
    highlights:
      - "西印度僧人募款重建永福寺，西門慶認捐五百兩"
      - "應伯爵戲稱自己是「心施」功德主，插科打諧"
      - "薛姑子勸印《陀羅經》替官哥祈福，埋下後續伏筆"
    cast:
      - name: "西門慶"
        note: "本回捐錢重修寺廟，並出資印經祈福"
      - name: "道長老"
        note: "西印度僧人，本回向西門慶募款重修永福寺"
      - name: "應伯爵"
        note: "西門慶清客，本回插科打諧稱自己是心施主"
      - name: "薛姑子"
        note: "尼姑，本回勸西門慶出資印《陀羅經》祈福"
      - name: "潘金蓮"
        note: "西門慶五娘，本回聞言發怒又與陳經濟私會"
      - name: "陳經濟"
        note: "西門慶女婿，本回再次與五娘潘金蓮私會"
  c58:
    intro: "這回正是西門慶生日。韓道國的貨船運回大批緞絹貨物，還缺稅銀待補；應伯爵也推薦了新掌柜甘潤來幫忙開店。當天壽宴熱鬧非凡，兩位太監和守備大人都來祝賀，新請的溫秀才也上門，西門慶當場聘他當家裡的寫信先生。席間，愛月兒因被別家叫走而遲到，惹西門慶不悅。宴席之外，潘金蓮妒忌西門慶多陪李瓶兒母子，拿丫頭秋菊踩狗屎弄髒新鞋當藉口，狠狠鞭打秋菊，連生母出面勸阻也被罵走。李瓶兒則捨出一對銀獅子印經替官哥兒祈福。"
    highlights:
      - "潘金蓮妒忌李瓶兒得寵，藉故狠打丫頭秋菊"
      - "溫秀才受聘為西門慶的寫信先生，正式登場"
      - "磨鏡老翁訴苦，金蓮玉樓善心相贈卻遭矇騙"
    cast:
      - name: "西門慶"
        note: "本回生日大宴賓客，聘溫秀才任寫信先生"
      - name: "潘金蓮"
        note: "西門慶五娘，本回妒忌李瓶兒得寵毒打丫頭"
      - name: "秋菊"
        note: "潘金蓮房裡丫頭，本回無辜遭主子狠狠鞭打"
      - name: "李瓶兒"
        note: "西門慶六娘，本回捨銀獅子印經替兒子祈福"
      - name: "溫秀才"
        note: "新聘寫信先生，本回正式入西門家當差"
      - name: "應伯爵"
        note: "西門慶清客，本回推薦新掌柜甘潤入夥"
  c59:
    intro: "西門慶夜訪妓院鄭愛月兒，家裡卻出了大事。潘金蓮早知道官哥兒怕貓，暗中用紅布裹肉餵貓，把貓養成撲抓紅色的習慣。這天官哥兒穿著紅衣在炕上玩，貓兒撲上去抓傷他，嚇得他當場抽搐。李瓶兒和吳月娘都懷疑是潘金蓮的貓害的，潘金蓮卻不肯認。劉婆子用艾灸搶救，病情反而更重，官哥兒連著抽搐多日。西門慶盛怒下把貓活活摔死，但官哥兒仍救不回來，八月廿三日斷氣，只活了一年多。李瓶兒哭得死去活來，眾人辦了喪事將他葬入祖墳。"
    highlights:
      - "潘金蓮暗訓白貓撲紅衣，害官哥兒受驚抽搐"
      - "西門慶盛怒摔死貓兒，官哥兒終究救不回"
      - "官哥兒不滿兩歲夭折，李瓶兒痛哭欲絕"
    cast:
      - name: "西門慶"
        note: "本回盛怒摔死貓兒，兒子官哥兒仍病故"
      - name: "潘金蓮"
        note: "西門慶五娘，本回暗中訓貓撲咬官哥兒"
      - name: "李瓶兒"
        note: "西門慶六娘，本回痛失獨子官哥兒"
      - name: "官哥兒"
        note: "西門慶獨子，本回遭貓驚嚇致病夭折"
      - name: "吳月娘"
        note: "西門慶大娘，本回主持官哥兒治病喪事"
      - name: "劉婆子"
        note: "民間收驚的婆子，本回替官哥兒艾灸卻使病惡化"
  c60:
    intro: "官哥兒死後，潘金蓮見李瓶兒失去兒子，反而暗自稱快，指著丫頭指桑罵槐諷刺她。李瓶兒不敢回嘴，只能暗自流淚，加上思念孩兒，老毛病又發，下身出血不止，身子日漸消瘦。同時，西門慶忙著開張新緞子鋪，選定九月初四開店，親朋好友都來祝賀，場面熱鬧。應伯爵拿唱曲的鄭春（鄭愛月兒的弟弟）開玩笑，說西門慶又多了個小舅子，席間眾人還行酒令取樂。西門慶也總算兌現承諾，拿銀子讓應伯爵幫常時節買下房子。"
    highlights:
      - "潘金蓮指桑罵槐嘲諷李瓶兒喪子，暗鬥不止"
      - "西門慶緞子鋪開張大吉，席間行酒令熱鬧非凡"
      - "西門慶終於兌現承諾，幫常時節買下新房"
    cast:
      - name: "西門慶"
        note: "本回開張緞子鋪，並助常時節買下新房"
      - name: "潘金蓮"
        note: "西門慶五娘，本回冷言嘲諷李瓶兒喪子"
      - name: "李瓶兒"
        note: "西門慶六娘，本回喪子又受氣，舊病加重"
      - name: "應伯爵"
        note: "西門慶清客，本回打趣鄭春又促成買房事"
      - name: "常時節"
        note: "西門慶結拜兄弟，本回終於買到新房子"
  c61:
    intro: "韓道國夫婦擺酒宴請西門慶，順道請來歌女申二姐熱鬧場面，妻子王六兒卻趁機與西門慶私通，恰巧被家裡一名小廝發現。到了重陽節，西門慶又請申二姐來給眾妻妾唱曲解悶，李瓶兒卻在席間因下體大出血當場暈倒，磕傷額頭。西門慶心急如焚，接連請了幾位醫生，其中一位江湖郎中滿口胡話、開的藥方古怪嚇人，被當場趕走；後來找人算命，卦象也顯示李瓶兒今年凶多吉少。"
    highlights:
      - "王六兒趁宴私通西門慶，被小廝發現"
      - "重陽宴上李瓶兒下體大出血、當場暈倒"
      - "江湖郎中滑稽問診亂開藥，被當場趕走"
    cast:
      - name: "西門慶"
        note: "本回一邊為李瓶兒的病憂心，一邊仍在外拈花惹草"
      - name: "李瓶兒"
        note: "西門慶六房妻妾，本回宴席上大出血暈倒，病情急轉直下"
      - name: "王六兒"
        note: "夥計韓道國之妻，本回設宴藉機與西門慶私通"
      - name: "韓道國"
        note: "西門慶生意夥計，本回設宴謝恩，渾然不知妻子出軌"
      - name: "潘金蓮"
        note: "西門慶五房妻妾，本回追問西門慶行蹤，言語犀利"
  c62:
    intro: "李瓶兒病情加重，總覺得已故前夫在夢裡糾纏她、要搶走孩子，嚇得魂不守舍。西門慶請潘道士做法查看，道士說這是前世冤債而非邪祟，夜裡替她祭本命燈占卜生死，燈卻被怪風吹滅大半，暗示大限將至。李瓶兒自知將死，把首飾衣物分別交代給丫鬟、奶媽和老僕，又拉著吳月娘的手叮囑她日後多加提防，別被人算計。當夜四更，丫鬟發現李瓶兒已經斷氣，西門慶聞訊衝來，抱著遺體放聲痛哭，全家哭聲震動。"
    highlights:
      - "潘道士祭本命燈占生死，燈滅大半預告死期"
      - "李瓶兒臨終分家產，囑吳月娘小心防人算計"
      - "李瓶兒四更斷氣，西門慶抱屍痛哭"
    cast:
      - name: "李瓶兒"
        note: "西門慶六房妻妾，本回自知將死，交代後事後半夜身亡"
      - name: "西門慶"
        note: "本回眼看愛妾病危，求道士做法未果，最終痛失愛妾"
      - name: "潘道士"
        note: "門外五嶽觀的道士，本回作法查驗，判定李瓶兒命數已盡"
      - name: "吳月娘"
        note: "西門慶正妻，本回受李瓶兒臨終託付，日後多加防範"
      - name: "王姑子"
        note: "李瓶兒相熟的尼姑，本回獲贈銀兩，託付誦經超渡"
  c63:
    intro: "李瓶兒死後，西門慶請畫師韓先生替她畫遺像，全家你一言我一語挑毛病，畫師一改再改。入殮當天親友紛紛上門祭拜，乾女兒吳銀兒也趕來哭祭，收下李瓶兒臨終留給她的衣飾。牌位該怎麼題寫也一番商議，畢竟李瓶兒只是妾室，用詞得避開和正室吳月娘衝突。晚上請戲班演出，西門慶看戲看到觸動心事的台詞，當場落淚，卻被潘金蓮看在眼裡，在吳月娘面前冷言嘲笑他小題大做。"
    highlights:
      - "畫師為李瓶兒畫遺像，家人挑毛病一改再改"
      - "牌位稱謂引起爭議，避免與正室吳月娘衝突"
      - "西門慶看戲落淚思念亡妻，遭潘金蓮冷言嘲笑"
    cast:
      - name: "西門慶"
        note: "本回請人為李瓶兒畫遺像、辦喪禮，看戲時觸景落淚"
      - name: "韓先生"
        note: "李瓶兒喪禮請來的畫師，本回為她繪製遺像，反覆修改"
      - name: "吳銀兒"
        note: "李瓶兒認的乾女兒、青樓歌女，本回哭祭並收下遺贈衣飾"
      - name: "潘金蓮"
        note: "西門慶五房妻妾，本回嘲笑西門慶看戲落淚、小題大做"
      - name: "應伯爵"
        note: "西門慶的酒肉朋友，本回把關銘旌稱謂，避免僭越正室"
  c64:
    intro: "深夜，小廝玳安和老夥計傅夥計閒聊，提起李瓶兒待人寬厚、其他妻妾卻小氣。第二天，潘金蓮撞見吳月娘的丫鬟玉簫和小廝書僮在花園書房偷情，玉簫跪地求饒，答應日後替她通報吳月娘房裡大小事，還說出吳月娘懷孕其實是靠尼姑偏方求來的。書僮自知瞞不住，連夜偷了自己積蓄又誆騙老夥計二十兩銀子，逃回蘇州老家，西門慶氣得下令四處搜查卻找不到人。同時官員太監陸續前來祭拜李瓶兒，場面依舊風光。"
    highlights:
      - "潘金蓮撞見玉簫與書僮偷情，逼她當眼線"
      - "玉簫洩露吳月娘懷孕靠尼姑偏方求來的秘密"
      - "書僮偷錢潛逃蘇州，僕人私下評價李瓶兒為人"
    cast:
      - name: "潘金蓮"
        note: "本回撞見玉簫偷情，藉機逼她當眼線並挖出秘密"
      - name: "玉簫"
        note: "吳月娘的貼身丫鬟，本回偷情被抓，被迫聽命潘金蓮"
      - name: "書僮"
        note: "西門慶的小廝，本回偷情曝光後盜銀潛逃蘇州老家"
      - name: "玳安"
        note: "西門慶的貼身小廝，本回向老夥計評價李瓶兒為人"
      - name: "傅夥計"
        note: "綢緞鋪的老夥計，本回被書僮誆騙走二十兩銀子"
  c65:
    intro: "李瓶兒的喪事持續進行，各路僧道輪番做法事超渡。朝廷派太監運送奇石經過此地，官府請西門慶出面招待，他只能一邊辦喪事一邊籌備這場排場浩大的宴席。出殯當天全城萬人圍觀，儀仗隆重風光，最終將李瓶兒安葬入土。西門慶捨不得離開靈前守靈，沒過幾天卻在夜裡收用了照顧過孩子的奶媽如意兒，兩人開始暗中往來，讓潘金蓮看在眼裡很不是滋味。"
    highlights:
      - "出殯場面浩大，全城萬人圍觀"
      - "朝廷太監運奇石路過，西門慶奉命辦宴接待"
      - "西門慶安葬愛妾沒幾天，就收用奶媽如意兒"
    cast:
      - name: "西門慶"
        note: "本回為李瓶兒發喪出殯，喪期未過就收用奶媽如意兒"
      - name: "如意兒"
        note: "原是李瓶兒亡子的奶媽，本回被西門慶收用，成為新寵"
      - name: "潘金蓮"
        note: "西門慶五房妻妾，本回冷眼旁觀如意兒得寵，心裡不快"
      - name: "黃主事"
        note: "工部官員，本回代巡按傳話，請西門慶出面宴請欽差太監"
      - name: "吳道官"
        note: "西門慶熟識的道士，本回主持出殯法事、宣讀祭文"
  c66:
    intro: "李瓶兒五七忌日，西門慶請來知名道長黃真人主持盛大法事超渡亡魂，法壇布置講究，儀式從早忙到深夜。做法途中，京城翟管家派人送來奠儀銀兩和一封信，信裡除了致哀，還暗示西門慶和相關官員近期可能因工程有功獲得升遷，並提醒他信看過就好、別讓人知道。法事最後，應伯爵形容彷彿看見李瓶兒頭戴鳳冠、乘白鶴升天，眾人歡喜安慰西門慶，當晚設宴慶祝法事圓滿，賓主喝酒聽曲到深夜。"
    highlights:
      - "黃真人主持盛大法事，超渡李瓶兒亡魂"
      - "翟管家來信暗示官場升遷內幕，叮囑保密"
      - "應伯爵稱看見李瓶兒乘鶴升天，安慰西門慶"
    cast:
      - name: "西門慶"
        note: "本回為李瓶兒辦五七法事，收到京城來信暗示升遷機會"
      - name: "黃真人"
        note: "應邀主持法事的知名道長，本回全程主持超渡儀式"
      - name: "翟謙"
        note: "西門慶在京城靠山的管家，本回寄信致哀並通報官場消息"
      - name: "應伯爵"
        note: "西門慶的酒肉朋友，本回聲稱見李瓶兒乘鶴升天寬慰他"
      - name: "吳道官"
        note: "西門慶熟識的道士，本回協助張羅法壇、接待黃真人"
  c67:
    intro: "西門慶還在為李瓶兒之死傷心，白天窩在書房與應伯爵閒聊，還替商人黃四寫信關說，救出被誣陷入獄的岳父；應伯爵的小妾當晚生子，西門慶大方資助銀兩。午睡時他夢見李瓶兒回來哭訴在陰間受苦，叮囑他小心防人害命、少喝夜酒早點回家，驚醒後傷心落淚。潘金蓮察覺他神色有異，酸言酸語調情一番，卻被應伯爵撞見打斷。當晚西門慶為李瓶兒的六七燒化紙糊庫房，思念之情溢於言表。"
    highlights:
      - "李瓶兒夢中托夢示警，暗示日後危機"
      - "黃四跪求關說救岳父，見官商勾結手腕"
      - "潘金蓮書房調情，暗藏對李瓶兒的醋意"
    cast:
      - name: "西門慶"
        note: "故事主角，本回夢見亡妻李瓶兒示警防人加害"
      - name: "李瓶兒"
        note: "西門慶亡故的六房妻子，本回於夢中現身哭訴示警"
      - name: "潘金蓮"
        note: "五房妻子，本回察覺西門慶哭過藉機挑逗調情"
      - name: "應伯爵"
        note: "西門慶的幫閒好友，本回替黃四說情、自家添丁討賞"
      - name: "黃四"
        note: "商人，本回跪求西門慶寫信救出被誣陷入獄的岳父"

  c68:
    intro: "西門慶送走上門謝恩的黃四，家裡忙著替李瓶兒辦斷七法會，兩個尼姑還為搶法事錢鬧翻臉。潘金蓮暗中花錢求偏方，想搶先懷孕保住地位。應伯爵拉西門慶去妓女鄭愛月兒家喝酒，兩人春宵一度後，鄭愛月兒告訴他一個秘密：舊情人李桂姐傍上了貴族公子王三官，王三官的母親林太太行為不太正經，透過媒婆文嫂兒牽線就能得手，順道還能圖謀王三官年輕貌美的妻子。西門慶聽了心動，隔天派玳安到處尋訪文嫂兒。"
    highlights:
      - "鄭愛月兒獻計，牽出林太太這條線"
      - "潘金蓮暗中求偏方，怕被奶子搶寵"
      - "兩尼姑為法事錢互撕，斂財嘴臉畢露"
    cast:
      - name: "西門慶"
        note: "故事主角，本回赴妓院聽鄭愛月兒獻計算計王三官家"
      - name: "鄭愛月兒"
        note: "妓女，本回私下獻計，牽出王三官母親林太太這條線"
      - name: "潘金蓮"
        note: "五房妻子，本回暗中賄賂尼姑求偏方盤算搶先懷孕"
      - name: "文嫂兒"
        note: "媒婆，本回被西門慶託人尋訪，將牽線新的桃色事件"
      - name: "應伯爵"
        note: "西門慶的幫閒好友，本回作東邀他到妓院喝酒作樂"
      - name: "玳安"
        note: "西門慶的貼身小廝，本回奉命四處尋訪媒婆文嫂兒"

  c69:
    intro: "西門慶託媒婆文嫂兒牽線，趁王三官不在家，深夜潛入王家和他母親林太太私通。林太太求西門慶利用官職，整治帶壞兒子王三官的那幫酒肉朋友。西門慶隔天派人把那幾個混混抓去打了一頓示眾，這幾人反過來跑去王三官家鬧著要錢，逼得林太太又託文嫂兒求西門慶救場。王三官親自上門下跪求饒，卻不知眼前這人正是母親的姦夫，西門慶假裝才知情，再抓那幾人狠狠威嚇一番放了。吳月娘聽完，忍不住諷刺西門慶自己也不乾淨。"
    highlights:
      - "林太太設局私會，官職淪為桃色工具"
      - "王三官跪求母親姦夫救命，全書最諷刺一幕"
      - "應伯爵拆解西門慶的算計手腕"
    cast:
      - name: "西門慶"
        note: "故事主角，本回利用官職私會林太太並操弄眾人"
      - name: "林太太"
        note: "王三官之母，本回被文嫂兒牽線和西門慶私通"
      - name: "王三官"
        note: "林太太之子，本回不知情跪求母親的姦夫救他"
      - name: "文嫂兒"
        note: "媒婆，本回穿針引線促成西門慶與林太太私通"
      - name: "吳月娘"
        note: "西門慶正妻，本回聽聞王三官一事，諷刺西門慶不乾淨"
      - name: "應伯爵"
        note: "西門慶的幫閒好友，本回拆解西門慶的算計手腕"

  c70:
    intro: "朝廷考核公文下來，西門慶如願升任正千戶掌管刑名，同僚夏提刑表面升官管禮儀隊仗，實際被架空，當場臉色大變。西門慶還沒赴王三官家吃謝恩酒，就被急詔上京謝恩，只好星夜趕路。到京城拜會蔡京府管家翟謙，才知夏提刑背地裡託人想保住原職，害翟謙費了好大力氣才保住西門慶的升遷，提醒他做事要謹慎。最後西門慶跟眾官員到權傾一時的朱太尉府前參拜，見識驚人排場，也聽了一曲諷刺奸臣誤國的曲子，暗指北宋將覆滅的命運。"
    highlights:
      - "西門慶升正千戶，夏提刑明升暗降變色"
      - "翟謙示警：夏提刑暗中運作幾乎壞了升遷"
      - "朱太尉排場曲子諷刺，預告北宋覆滅命運"
    cast:
      - name: "西門慶"
        note: "故事主角，本回升任正千戶並赴京謝恩見識官場"
      - name: "夏提刑"
        note: "西門慶同僚，本回明升暗降，還暗中運作想保住原職"
      - name: "翟謙"
        note: "蔡京府管家，本回示警官場暗鬥並代為周旋"
      - name: "朱太尉"
        note: "權傾朝野的太尉，本回眾官排場參拜，曲子諷其誤國"
      - name: "何太監"
        note: "宮中太監，本回介紹侄子何永壽給西門慶認識"

  c71:
    intro: "西門慶隨新同僚何千戶回家作客，何千戶的叔叔何太監大陣仗設宴款待，還出銀子買下夏提刑在京城的房子給侄子住，西門慶居中牽線。夜裡西門慶夢見李瓶兒又出現，說已經找到新住處，兩人溫存一番，她叮囑西門慶少喝夜酒、早點回家，暗示有人想害他。西門慶驚醒後悵然若失，隔天出門竟真的找到夢裡那條巷子和那扇門，問過鄰居才知住的是別家人，令他驚訝不已。之後兩人進宮領了官方任命文書，啟程回山東，途中遇狂風被迫夜宿破廟。"
    highlights:
      - "李瓶兒二度入夢示警，暗示有人加害西門慶"
      - "夢中地址現實真有其巷，詭異巧合添懸念"
      - "歸途遇狂風夜宿破廟，風光過後見荒涼"
    cast:
      - name: "西門慶"
        note: "故事主角，本回二度夢見亡妻李瓶兒示警有人加害"
      - name: "李瓶兒"
        note: "已故六房妻子，本回二度入夢與西門慶相會並示警"
      - name: "何千戶"
        note: "新任同僚太監之侄，本回設宴款待西門慶並買房安家"
      - name: "何太監"
        note: "何千戶的叔叔，本回出面買房待西門慶如自家人"

  c72:
    intro: "西門慶人還沒到家，潘金蓮已經和春梅聯手，為了一根洗衣棒槌把奶子如意兒罵得抬不起頭，暗指她想取代李瓶兒的位置，孟玉樓看不過去才把金蓮勸走。西門慶回到家向月娘細說京城的驚險經過，反被數落做事毛躁。西門慶設宴為何千戶接風，王三官也備盛大酒席回請，還讓王三官當著母親林太太的面跪下磕頭，正式拜西門慶為義父。當晚潘金蓮又拿如意兒的事纏問西門慶。隔天應伯爵替被冷落的樂工李銘求情，西門慶答應讓他回來當差。"
    highlights:
      - "潘金蓮聯手春梅羞辱奶子，暗指她想取代李瓶兒"
      - "王三官當眾跪拜義父，桃色算計荒唐收尾"
      - "應伯爵替樂工李銘求情，人情世故躍然紙上"
    cast:
      - name: "西門慶"
        note: "故事主角，本回被拜為義父，又遭潘金蓮枕邊逼問"
      - name: "潘金蓮"
        note: "五房妻子，本回為棒槌痛罵奶子如意兒又試探西門慶"
      - name: "如意兒"
        note: "李瓶兒房裡留用的奶子，本回被潘金蓮聯手羞辱指罵"
      - name: "王三官"
        note: "林太太之子，本回正式跪拜西門慶為義父"
      - name: "吳月娘"
        note: "西門慶正妻，本回聽聞京城驚險經過，數落西門慶毛躁"
      - name: "應伯爵"
        note: "西門慶的幫閒好友，本回替遭冷落的樂工李銘求情"
  c73:
    intro: "今天是孟玉樓的生日，家裡擺酒慶生、請了尼姑來作法祈福，還安排樂師彈唱助興。席間西門慶特別點了一首關於思念的曲子，聽著聽著想起剛過世的李瓶兒，忍不住掉淚。潘金蓮看在眼裡很不是滋味，酸言酸語頂撞西門慶，兩人當場翻臉，西門慶氣得追出去要踢她。晚上大家聽尼姑講一則和尚犯色戒轉世投胎的故事，氣氛才緩和下來。深夜潘金蓮回房後，還為了一顆水果的事重罰丫頭秋菊。"
    highlights:
      - "西門慶聞《憶吹簫》思念亡妻李瓶兒落淚"
      - "金蓮嘲諷惹惱西門慶，遭他持靴追打"
      - "薛姑子說五戒禪師破色戒轉世蘇東坡的故事"
    cast:
      - name: "潘金蓮"
        note: "西門慶五房妻妾，因醋意與他當眾起爭執"
      - name: "西門慶"
        note: "本回為亡妻李瓶兒動情落淚，又與金蓮起衝突"
      - name: "孟玉樓"
        note: "西門慶三房妻妾，本回是她的生日宴"
      - name: "吳月娘"
        note: "西門慶正妻，出面斥責金蓮在宴上鬧脾氣"
      - name: "薛姑子"
        note: "常出入西門家的尼姑，本回講經說故事、送求子符藥"
      - name: "春梅"
        note: "潘金蓮的貼身丫頭，本回奉命責打另一丫頭秋菊"

  c74:
    intro: "清早潘金蓮軟硬兼施，向西門慶討來已故李瓶兒的皮襖穿；西門慶為此去李瓶兒房裡，向奶媽如意兒討鑰匙，還趁機調情一番。金蓮拿到皮襖後叫如意兒來問話立威，吳月娘知道後則數落西門慶待亡妻東西太不留情。傍晚官員登門，讚嘆西門慶家中一座貴重香爐；青樓女子李桂姐也登門下跪賠罪討好西門慶。夜裡，吳月娘等人聽薛姑子講述黃氏女行善轉世做官的勸世故事。"
    highlights:
      - "金蓮討得亡妻李瓶兒皮襖，還叫如意兒來立威"
      - "李桂姐登門跪求西門慶原諒"
      - "薛姑子講黃氏女轉世投胎做官的故事"
    cast:
      - name: "西門慶"
        note: "本回把亡妻李瓶兒的皮襖送給金蓮，惹惱月娘"
      - name: "潘金蓮"
        note: "西門慶妻妾，本回討得皮襖，又向如意兒立威"
      - name: "如意兒"
        note: "已故李瓶兒的奶媽，如今與西門慶有私情"
      - name: "吳月娘"
        note: "西門慶正妻，本回不滿西門慶偏心金蓮"
      - name: "李桂姐"
        note: "西門慶熟識的青樓女子，本回登門下跪賠罪"

  c75:
    intro: "西門慶當夜去已故李瓶兒房裡與奶媽如意兒過夜，潘金蓮雖不悅仍放他去。次日，潘金蓮房裡的丫頭春梅因請不動彈唱的申二姐，當眾把她大罵一頓、趕出家門，鬧得沸沸揚揚。吳月娘認為金蓮把丫頭寵得沒規矩，話傳到金蓮耳裡，兩人隔天當面大吵，翻出皮襖、大房小房等舊帳互相指責，潘金蓮甚至坐地哭鬧、自打耳光。吳月娘氣得肚痛頭疼，因懷有身孕，西門慶連忙請大夫來把脈診治。"
    highlights:
      - "春梅當眾痛罵申二姐，把人趕出家門"
      - "金蓮與月娘為爭寵大吵一架，撕破臉"
      - "月娘氣出病，牽動胎兒安危"
    cast:
      - name: "春梅"
        note: "潘金蓮的丫頭，本回痛罵申二姐並趕她出門"
      - name: "申二姐"
        note: "受雇彈唱的藝人，本回被春梅羞辱後被趕走"
      - name: "玉簫"
        note: "吳月娘的丫頭，本回向金蓮通報月娘的怨言"
      - name: "潘金蓮"
        note: "西門慶妻妾，本回與月娘為積怨爆發激烈爭吵"
      - name: "吳月娘"
        note: "西門慶正妻，懷孕中與金蓮大吵氣出病來"
      - name: "西門慶"
        note: "本回為安撫懷孕的月娘，急忙請大夫診脈"

  c76:
    intro: "大夫幫吳月娘診脈後開了安胎藥。孟玉樓看不過去，出面勸雙方各退一步，還把潘金蓮拉去向月娘磕頭賠罪，兩人才和好如初。西門慶家中忙著宴請官員為上司送行，也趁機幫大舅子和相熟官員打點關係、換得好處，還幫喬家買了個官銜。晚上西門慶到金蓮房裡，見丫頭春梅還在為前一天被罵的事氣得幾天沒吃飯，好言安撫一番。另一頭，西門慶發現家教老師溫葵軒竟猥褻小廝畫童，還洩漏家中隱私給外人，氣得把他趕出家門。"
    highlights:
      - "玉樓調解成功，金蓮向月娘磕頭認錯"
      - "西門慶發現溫葵軒猥褻小廝、洩漏家中隱私"
      - "溫葵軒當場被逐出西門家"
    cast:
      - name: "孟玉樓"
        note: "西門慶妻妾，本回出面調解月娘與金蓮的爭執"
      - name: "吳月娘"
        note: "西門慶正妻，本回在玉樓勸說下接受金蓮道歉"
      - name: "潘金蓮"
        note: "西門慶妻妾，本回向月娘磕頭賠罪言歸於好"
      - name: "西門慶"
        note: "本回發現溫葵軒惡行，一怒逐出家門"
      - name: "溫葵軒"
        note: "西門家聘的教書先生，本回因猥褻小廝、洩密被逐"
      - name: "畫童兒"
        note: "西門家小廝，本回受溫葵軒侵犯，事情因此曝光"

  c77:
    intro: "西門慶趁著下雪，特地跑去妓院探望鄭愛月兒，兩人一起玩牌、飲酒調情，還聊起王三官與他母親林太太的往來八卦。這段時間，西門慶也趁管家賁四外出不在家，偷偷勾搭賁四的妻子，兩人隔著窗子眉來眼去、約定夜裡幽會，靠著小廝玳安穿針引線，瞞著全家人往來。同時，衙門捎來好消息：吳大舅升官的奏本已經批下來了。西門慶又新收了一名叫來爵的小廝進府當差。"
    highlights:
      - "西門慶雪夜訪鄭愛月兒，飲酒調情玩牌"
      - "西門慶趁賁四外出，勾搭上他妻子"
      - "玳安暗中替西門慶安排幽會"
    cast:
      - name: "西門慶"
        note: "本回雪夜訪鄭愛月兒，又開始勾搭賁四的妻子"
      - name: "鄭愛月兒"
        note: "西門慶熟識的青樓女子，本回雪夜陪他飲酒作樂"
      - name: "賁四嫂"
        note: "管家賁四的妻子，本回被西門慶趁機勾搭上"
      - name: "玳安"
        note: "西門慶的心腹小廝，本回替他和賁四嫂安排幽會"
      - name: "潘金蓮"
        note: "西門慶妻妾，本回接手管家用錢，記帳比別人嚴"

  c78:
    intro: "過年期間，西門慶四處拜年應酬，也備了供品到李瓶兒靈前祭拜。他趁著去王家給林太太拜年的機會，展開一段情慾追逐，兩人有了肉體關係，林太太也答應日後帶媳婦來看燈。潘金蓮生日當天，西門慶忙著到何千戶家喝酒，晚上才回來替她做生日。潘金蓮的母親潘姥姥為了轎子錢被女兒狠狠數落，倒是丫頭春梅私下拿酒菜安慰老人家。元宵節，吳月娘設宴邀請官太太們賞燈，其中何千戶年輕貌美的妻子藍氏一出場就讓西門慶看得意亂神迷。"
    highlights:
      - "西門慶登門拜年，與林太太發生關係"
      - "何千戶妻子藍氏驚艷全場，西門慶看得神迷"
      - "潘姥姥被金蓮數落，春梅反倒體貼安慰她"
    cast:
      - name: "西門慶"
        note: "本回拜年時與林太太發生關係，又對藍氏一見動心"
      - name: "林太太"
        note: "王三官之母，本回西門慶登門拜年時與她私通"
      - name: "吳月娘"
        note: "西門慶正妻，本回主辦元宵夜宴邀請官太太賞燈"
      - name: "藍氏"
        note: "何千戶年輕貌美的妻子，本回赴宴讓西門慶著迷"
      - name: "潘金蓮"
        note: "西門慶妻妾，本回生日當天仍狠狠數落生母"
      - name: "潘姥姥"
        note: "潘金蓮之母，本回為轎子錢被女兒狠狠羞辱"
  c79:
    intro: "元宵過後，西門慶依舊縱情聲色，跑去情婦王六兒家留宿，服藥助興、通宵行房。回家後醉倒不醒，潘金蓮心急又多餵他吃藥，結果西門慶精盡出血，昏厥過去。隔天起，他頭暈、下身腫痛潰爛，接連請了好幾位醫生診治都不見效。算命、問卜、圓夢全是凶兆，西門慶自知命不久，把家業與後事一一叮囑月娘、金蓮和女婿陳經濟。正月二十一日，西門慶終告不治身亡，同一時刻，月娘竟在家中臨盆生下孝哥兒，一死一生，全家又哭又忙。"
    highlights:
      - "西門慶縱慾成疾，多名太醫束手無策"
      - "同日同時一死一生，鄰里傳為奇事"
      - "臨終遺言分配家產，暗藏日後衰敗危機"
    cast:
      - name: "西門慶"
        note: "西門大官人，本回縱慾成疾、臨終託付家業"
      - name: "吳月娘"
        note: "西門慶正室，本回臨盆生子又操持喪事"
      - name: "潘金蓮"
        note: "西門慶五娘，本回誤餵藥導致西門慶病重"
      - name: "王六兒"
        note: "韓道國之妻，西門慶情婦，本回與他最後一次相會"
      - name: "陳經濟"
        note: "西門慶女婿，本回受臨終託付掌管家業"
      - name: "應伯爵"
        note: "西門慶生前好友，本回探病並代為處理批文糾紛"
  c80:
    intro: "西門慶死後不到兩週，應伯爵等一群酒肉朋友湊了幾錢銀子辦祭禮，還寫了一篇暗藏嘲弄的祭文揩油討便宜。潘金蓮趁家中辦法事、眾人看戲分心，終於和女婿陳經濟真正偷情得手，兩人從此難分難捨。李嬌兒被老鴇教唆，趁亂搬走財物又鬧上吊逼宮，月娘忍無可忍，把她連衣物家當一起趕出家門，她隨即重回妓院，改嫁給新崛起的富商張二官做二房。應伯爵見西門慶已死，立刻轉頭巴結張二官，向他吹捧潘金蓮的美貌才藝，埋下日後算計的線索。"
    highlights:
      - "狐群狗友假意祭拜，暗地嘲諷死者"
      - "陳經濟與潘金蓮首次偷情得手"
      - "李嬌兒盜財逐出家門，改嫁富商"
    cast:
      - name: "陳經濟"
        note: "西門慶女婿，本回與潘金蓮首次偷情得手"
      - name: "潘金蓮"
        note: "西門慶五娘，本回主動勾引陳經濟得手"
      - name: "李嬌兒"
        note: "西門慶二娘，本回盜財鬧事，被逐出家門改嫁"
      - name: "吳月娘"
        note: "西門慶正室，本回主持喪事並逐出李嬌兒"
      - name: "應伯爵"
        note: "西門慶生前好友，本回轉投靠新貴張二官"
      - name: "張二官"
        note: "本回新登場的富商，娶李嬌兒為二房並覬覦潘金蓮"
  c81:
    intro: "韓道國與來保帶著西門慶四千兩銀子在外地採購貨物，途中聽聞主子已死，兩人竟都動了歪念。韓道國先偷偷賣掉一批貨、帶著一千兩銀子先行回家，妻子王六兒勸他別把錢還回去，不如帶著全部財物投奔在太師府當差的女兒，兩人便捲款潛逃到京城。來保得知此事，一面私吞剩下的貨款嫁禍韓道國，一面又欺瞞、糊弄失去丈夫倚靠的吳月娘，甚至言語調戲她，最後才被識破逐出家門。"
    highlights:
      - "韓道國夫妻捲款潛逃投靠太師府"
      - "來保侵吞貨款又嫁禍同夥"
      - "夫死家寡，家奴接連欺主背恩"
    cast:
      - name: "韓道國"
        note: "西門慶夥計，本回聽聞主子死訊後攜款潛逃"
      - name: "王六兒"
        note: "韓道國妻，西門慶情婦，本回主張捲款投靠女兒"
      - name: "來保"
        note: "西門慶夥計，本回私吞貨款、嫁禍韓道國後被逐"
      - name: "吳月娘"
        note: "西門慶正室，本回寡居掌家，屢遭夥計欺瞞侵占"
      - name: "陳經濟"
        note: "西門慶女婿，本回經手買賣卻被來保操縱矇騙"
  c82:
    intro: "潘金蓮與陳經濟持續用汗巾、香袋、詩詞暗通款曲，趁夜在花園茶蘼架下幽會，又在存放藥材的樓上偷情，兩次都差點被人撞見。丫鬟春梅意外撞破二人姦情，潘金蓮為了讓她保密，竟安排春梅也和陳經濟同房。潘金蓮生母潘姥姥病故，金蓮回娘家探喪。之後一次約會，陳經濟因和朋友喝酒誤了時間，金蓮還在他袖中發現一支屬於孟玉樓的髮簪，懷疑他另有姦情，氣得在牆上題詩責怪。陳經濟深夜翻牆賠罪解釋，兩人才又和好如初。"
    highlights:
      - "潘金蓮為守密，讓春梅也依附陳經濟"
      - "孟玉樓的髮簪引發誤會，埋下伏筆"
      - "多次幽會險遭撞見，步步驚心"
    cast:
      - name: "潘金蓮"
        note: "西門慶五娘，本回與女婿熱戀偷情並讓春梅加入"
      - name: "陳經濟"
        note: "西門慶女婿，本回與金蓮春梅私通，因髮簪起爭執"
      - name: "春梅"
        note: "潘金蓮貼身丫鬟，本回被安排與陳經濟同房守密"
  c83:
    intro: "潘金蓮與陳經濟和好後幽會更頻繁，丫鬟秋菊幾次撞見蛛絲馬跡，向人告發主子與女婿私通，潘金蓮重罰秋菊，月娘也不信告發之詞。中秋前後，月娘親自到房查看，兩人差點當場被抓，靠春梅掩護才躲過一劫。此後月娘收緊門禁、限制出入，兩人被迫分離一個多月，潘金蓮相思成疾。春梅心疼主子，主動穿針引線，趁夜灌醉秋菊、傳遞情書，把陳經濟接來重聚，三人從此更加放縱，秋菊即使再度目睹，也已無人肯信。"
    highlights:
      - "秋菊屢次撞見告發，卻反遭責打冷落"
      - "春梅穿針引線，深度參與兩人私情"
      - "月娘收緊門禁，兩人被迫分離月餘"
    cast:
      - name: "潘金蓮"
        note: "西門慶五娘，本回與陳經濟情濃，因分離相思成疾"
      - name: "陳經濟"
        note: "西門慶女婿，本回持續與金蓮、春梅私通"
      - name: "春梅"
        note: "潘金蓮丫鬟，本回主動穿針引線傳遞情書"
      - name: "秋菊"
        note: "潘金蓮房中丫鬟，本回兩度撞見姦情卻不被採信"
      - name: "吳月娘"
        note: "西門慶正室，本回收緊門禁，卻始終不信秋菊告發"
  c84:
    intro: "吳月娘為替西門慶還願，由吳大舅陪同前往泰山碧霞宮進香。廟裡道士石伯才勾結地方惡霸殷天錫，慣以誘騙上山燒香的婦女行不軌之事，兩人設計把吳大舅灌醉支開，讓殷天錫闖入房中強行對月娘非禮，幸虧月娘呼救、吳大舅及時破門搭救，兩人倉皇逃下山。途中借宿山洞，一位老僧收留庇護，並要求月娘日後把兒子孝哥兒送來出家。隔日趕路，一行人又誤闖清風山強盜地盤被劫上山，幸得寨中暫住的好漢宋江仗義說情，月娘才脫險返家。"
    highlights:
      - "月娘進香途中險遭色道士夥同惡霸侵犯"
      - "深山古洞老僧收留，並求日後獻子出家"
      - "途經清風山遇劫，宋江仗義相救"
    cast:
      - name: "吳月娘"
        note: "西門慶正室，本回上泰山還願，途中兩度遇險獲救"
      - name: "吳大舅"
        note: "月娘之兄，本回隨行護送，兩次出手相救"
      - name: "石伯才"
        note: "碧霞宮道士，本回夥同惡霸誘騙月娘意圖不軌"
      - name: "殷天錫"
        note: "地方惡霸，本回強行侵犯月娘未遂，事後率眾追殺"
      - name: "普靜"
        note: "山洞隱居僧人，本回收留月娘一行並求日後獻子出家"
      - name: "宋江"
        note: "水滸傳人物，本回在清風山寨仗義救出被擄的月娘"
  c85:
    intro: "吳月娘去泰安州進香期間，潘金蓮和女婿陳經濟繼續偷情，還意外懷孕，兩人找大夫買藥把孩子打掉。月娘回家後，丫頭秋菊想告狀卻被攔下來，直到月娘自己在樓上當場撞見金蓮和經濟在一起，氣得狠狠教訓金蓮，經濟也被妻子大姐罵到抬不起頭，從此被禁止進後院。兩人靠媒人薛嫂偷偷通信維持聯繫。月娘認為金蓮的丫頭春梅也是幫忙牽線的人，一氣之下把春梅便宜賣掉。"
    highlights:
      - "金蓮與女婿偷情懷孕，服藥墮胎"
      - "月娘當場撞見兩人私通，痛罵金蓮"
      - "春梅被疑當牽線人，遭月娘賤賣"
    cast:
      - name: "潘金蓮"
        note: "西門慶五房妾，與女婿私通懷孕墮胎，遭月娘識破斥責"
      - name: "陳經濟"
        note: "西門慶女婿，與五娘私通，本回被逐出後院"
      - name: "吳月娘"
        note: "西門慶正妻，本回進香歸來識破金蓮姦情，賣了春梅"
      - name: "龐春梅"
        note: "金蓮貼身丫頭，被疑是牽線人，本回遭賤價賣出"
      - name: "薛嫂"
        note: "媒人，本回替經濟金蓮暗中傳信，也負責發賣春梅"
  c86:
    intro: "陳經濟又透過薛嫂，偷偷和賣到守備府的春梅見面偷情，被月娘發現後催著趕緊把春梅便宜賣掉。經濟被關在前院不能進後面，和妻子大姐吵架，又在玉樓生日那天喝醉，對帳房夥計撂狠話，還當眾拿月娘的孩子開不該開的玩笑，氣得月娘當場昏倒。孫雪娥趁機提議把經濟狠狠打一頓趕出家門，再叫王婆把金蓮領出去改嫁，開價一百兩銀子。金蓮寄住王婆家等人來娶，卻和王婆兒子搞在一起，經濟也偷偷跑來相會，說要去籌錢娶她。"
    highlights:
      - "春梅被查獲偷情，急忙賤價賣入守備府"
      - "經濟酒醉威脅告官，還亂認月娘的孩子"
      - "金蓮遭賣入王婆家，暗中又勾搭王婆兒子"
    cast:
      - name: "陳經濟"
        note: "西門慶女婿，本回因言語惹禍遭毒打，被趕出家門"
      - name: "龐春梅"
        note: "金蓮丫頭，本回被查出偷情，急忙賣入守備府當妾"
      - name: "潘金蓮"
        note: "西門慶五娘，本回遭月娘賤賣，寄住王婆家待嫁"
      - name: "王婆"
        note: "老媒人，本回負責發賣金蓮，趁機索取高價"
      - name: "吳月娘"
        note: "西門慶正妻，本回主導處置經濟、春梅與金蓮"
      - name: "孫雪娥"
        note: "西門慶的妾，本回獻計要打經濟、賣金蓮"
  c87:
    intro: "王婆一心想從潘金蓮這樁婚事上撈更多錢，好幾家人出價要娶金蓮，包括春梅央求守備府出面，王婆卻嫌價錢不夠，一路拖延。恰巧武松因朝廷大赦提早獲釋回到清河縣，聽說嫂子金蓮還在王婆家等著嫁人，便假意說要娶她回家照顧姪女，開價一百兩，王婆貪財立刻答應。沒想到當晚武松把金蓮和王婆一起關在房裡，逼問當年兩人聯手害死他哥哥武大的實情。金蓮全部招認後，武松當場殘忍殺死金蓮與王婆，取了剩下的銀子逃亡，後來上了梁山。"
    highlights:
      - "武松假意求娶金蓮，開價一百兩"
      - "武松當晚逼問招供，手刃金蓮與王婆"
      - "王婆貪心誤事，同時得罪多方買主"
    cast:
      - name: "武松"
        note: "武大的弟弟，本回假意求娶金蓮，實為報殺兄之仇"
      - name: "潘金蓮"
        note: "西門慶五娘，本回被武松識破舊罪，遭殘忍殺死"
      - name: "王婆"
        note: "老媒人，本回貪財誤事，被武松一併殺死"
      - name: "龐春梅"
        note: "守備府愛妾，本回央求守備出面買金蓮未能如願"
      - name: "張二官"
        note: "新任提刑官，本回一度想買金蓮，後聽聞其惡行放棄"
  c88:
    intro: "武松殺人逃亡後，官府一直緝凶未獲。陳經濟的父親在東京病故，他趕去奔喪，卻哄母親讓自己先押財物回清河。誰知半路得知金蓮已被武松殺死，他燒紙祭拜後，夜裡夢見金蓮託夢求他安葬遺體。春梅也做了同樣的夢，便暗中派人買棺材，將金蓮悄悄葬在守備府家廟永福寺，沒讓守備知道。經濟後來到永福寺辦父親的法事，巧合發現金蓮也葬在此處，偷偷祭拜她。月娘則從薛嫂口中，得知金蓮王婆的死訊，以及春梅厚葬金蓮、如今懷孕得寵的近況。"
    highlights:
      - "武松逃亡，屍首暴露街頭無人敢動"
      - "經濟與春梅各自夢見金蓮託夢求葬"
      - "春梅暗中厚葬金蓮，不讓守備知道"
    cast:
      - name: "陳經濟"
        note: "西門慶女婿，本回父喪奔京又急著搶運財物回鄉"
      - name: "潘金蓮"
        note: "已死於武松刀下，本回化為鬼魂託夢求人安葬"
      - name: "龐春梅"
        note: "守備府愛妾，本回夢見金蓮託夢，暗中厚葬她"
      - name: "吳月娘"
        note: "西門慶正妻，本回從薛嫂處得知金蓮死訊"
      - name: "薛嫂"
        note: "媒人，本回向月娘轉述金蓮之死與春梅近況"
  c89:
    intro: "月娘讓大姐帶祭禮回陳家給公公燒紙，經濟卻餘怒未消，趕走轎子不收留，還動手打她，大姐嚇得躲回娘家不敢再去。清明節，月娘帶著玉樓、小玉、奶媽和孩子到西門慶墳上祭拜，母女姊妹哭得傷心。回程路上，一群人臨時進了永福寺，恰好春梅也帶隨從到同一間寺廟，替葬在寺後的金蓮燒紙掃墓。後來才知道對方是春梅，相認後格外親熱，春梅待她們十分客氣，還送金簪給孩子。玉樓也偷偷去金蓮墳前燒紙。春梅設宴款待後，眾人才分開。"
    highlights:
      - "經濟遷怒大姐，趕走轎子還動手打她"
      - "月娘清明上墳，眾人哭祭西門慶"
      - "永福寺巧遇春梅，兩邊相認重敘舊情"
    cast:
      - name: "吳月娘"
        note: "西門慶正妻，本回清明上墳，又巧遇春梅重逢"
      - name: "陳經濟"
        note: "西門慶女婿，本回遷怒妻子大姐，趕人又動手"
      - name: "西門大姐"
        note: "陳經濟之妻，本回被丈夫趕回娘家、遭毆打"
      - name: "孟玉樓"
        note: "西門慶三娘，本回同去上墳，又偷偷替金蓮燒紙"
      - name: "龐春梅"
        note: "守備府愛妾，本回上墳祭金蓮，巧遇月娘一行人"
  c90:
    intro: "回程路上，縣太爺的兒子李衙內看上孟玉樓，派人打聽身分。孫雪娥在家門口遇到賣首飾的小販，竟是多年前被逐出家門的舊僕人來旺。兩人重逢後很快勾搭在一起，靠僕人夫婦牽線幽會，還商量捲走財物一起逃走。半夜兩人爬牆出城，躲到來旺姨母家，卻被姨母的兒子偷走財物去賭博，事情因此曝光。官府查獲後，來旺和竊賊都判刑充軍，雪娥被責打後交官府發賣。春梅聽說此事，特地買回雪娥，逼她到廚房做粗活，報當年的舊仇。"
    highlights:
      - "李衙內遠遠看上孟玉樓，暗中打聽身分"
      - "孫雪娥與舊僕人來旺私通，密謀捲款私奔"
      - "事情曝光被判刑，春梅買回雪娥報舊仇"
    cast:
      - name: "孟玉樓"
        note: "西門慶三娘，本回被縣太爺兒子李衙內看上"
      - name: "孫雪娥"
        note: "西門慶的妾，本回與舊僕來旺私通、捲款私奔被抓"
      - name: "來旺"
        note: "原是西門慶家舊僕人，本回改名回來勾引雪娥私奔"
      - name: "吳月娘"
        note: "西門慶正妻，本回孩子生病、又氣雪娥私奔丟醜"
      - name: "龐春梅"
        note: "守備府愛妾，本回買回雪娥報舊仇，逼她做粗活"
      - name: "李衙內"
        note: "清河縣知縣之子，本回一見孟玉樓就起了念頭"
  c91:
    intro: "陳經濟以到官府告狀為要挾，逼月娘退回大姐的嫁妝，還多要了一個丫頭元宵兒。另一頭，知縣的兒子李衙內在清明時看上了孟玉樓，託媒人上門求親。月娘作主，玉樓也心動，兩人一拍即合，風光出嫁到衙內家。誰知衙內原有個丫頭玉簪兒，見新人得寵、自己被冷落，處處使性子、口出惡言，甚至在背後罵玉樓，被衙內發現後盛怒之下把她痛打一頓，最後將她賣掉了事。"
    highlights:
      - "陳經濟拿官府恐嚇，逼月娘退嫁妝又多要一個丫頭"
      - "命理師改女方年齡湊合婚配，暗諷媒人說親手法"
      - "玉簪兒失寵鬧脾氣，遭衙內痛打後被賣"
    cast:
      - name: "孟玉樓"
        note: "西門慶第三房遺孀，本回改嫁李衙內"
      - name: "李衙內"
        note: "知縣之子，本回娶玉樓為妻，怒打舊丫頭洩憤"
      - name: "吳月娘"
        note: "西門慶正妻，本回作主讓玉樓改嫁，也被陳經濟逼討財物"
      - name: "陳經濟"
        note: "西門慶女婿，本回向月娘逼討嫁妝與丫頭"
      - name: "玉簪兒"
        note: "李衙內原有的丫頭，因失寵使性子被痛打賣出"
      - name: "陶媽媽"
        note: "官媒人，本回為李衙內促成與玉樓的婚事"
  c92:
    intro: "陳經濟做布行生意賠本，還買了風塵女子馮金寶回家，冷落原配大姐。聽說孟玉樓改嫁到嚴州李通判家，便帶著她舊日的髮簪追去，想拿這當把柄向她要錢，又假意約她半夜私奔。玉樓將計就計，讓衙內設局把他當賊抓了。幸虧當地知府查明真相放了他，李通判卻盛怒之下打了兒子，把兒子和玉樓一起攆回原籍。經濟回家又打罵大姐，大姐上吊自盡，月娘告到縣衙，他花錢買通知縣才躲過重罪。"
    highlights:
      - "陳經濟拿舊簪子當把柄，威脅並試圖拐走玉樓"
      - "玉樓將計就計，讓經濟當場被抓成了賊"
      - "大姐被經濟凌虐後上吊，月娘告官為女兒討公道"
    cast:
      - name: "陳經濟"
        note: "西門慶女婿，本回設局威脅玉樓，事敗被拘又害死大姐"
      - name: "孟玉樓"
        note: "已改嫁李衙內，本回識破經濟圖謀並將他反制"
      - name: "西門大姐"
        note: "陳經濟的妻子，本回遭丈夫凌虐後上吊自盡"
      - name: "吳月娘"
        note: "西門慶正妻，本回為女兒之死告倒女婿"
      - name: "李通判"
        note: "李衙內之父，因兒媳鬧出醜聞而動怒逐子"
      - name: "徐知府"
        note: "嚴州知府，本回查明真相，替經濟平反並斥責李通判"
  c93:
    intro: "打完官司後，陳經濟徹底破產，房子賭光、傢俬賣盡，淪落到街頭乞討、睡冷鋪過夜。好心老鄉紳王杏庵多次看他可憐，給錢給衣服讓他重新做小生意，他卻一次次拿去吃喝賭光。杏庵最後把他送到臨清晏公廟拜任道士為徒，改名陳宗美。他在廟裡靠著手段籠絡師兄，反倒掌了廟裡的權，還瞞著師父胡鬧。閒暇時又跑到酒樓，重新找上改名鄭金寶的舊情人馮金寶，舊情復燃。"
    highlights:
      - "經濟賭窮潦倒，靠乞討與睡冷鋪度日"
      - "王杏庵一再仗義接濟，經濟卻屢次揮霍殆盡"
      - "經濟出家當道士，靠手段籠絡師兄反掌廟中大權"
    cast:
      - name: "陳經濟"
        note: "淪落街頭乞討，後出家當道士，改名陳宗美"
      - name: "王杏庵"
        note: "心善的老鄉紳，本回多次出錢出力救濟經濟"
      - name: "任道士"
        note: "晏公廟主持，收經濟為徒，對他毫無防範"
      - name: "金宗明"
        note: "任道士大徒弟，糾纏經濟卻反被經濟拿住把柄"
      - name: "馮金寶"
        note: "經濟舊情人，本回改名鄭金寶在臨清重逢經濟"
  c94:
    intro: "陳經濟迷戀酒樓歌女鄭金寶，被地頭惡霸劉二逮個正著，痛打一頓，連人帶唱的送到守備府問罪。行刑時，守備夫人春梅認出他就是舊日的陳姐夫，趕緊叫人放人，卻又故意假裝生病，拖著不肯馬上與他相見。任道士得知徒弟惹禍、財物又被偷光，又急又氣，當夜就病死了。另一頭，春梅只因廚房的孫雪娥說錯一句話，就把她狠狠打一頓、賤價賣掉，雪娥輾轉落入灑家店為娼，被守備的親信張勝看上，成了他的相好。"
    highlights:
      - "經濟迷戀歌女被惡霸劉二逮住痛打，送官問罪"
      - "春梅認出受刑的經濟卻故意拖延相見"
      - "春梅為一句閒話重罰孫雪娥，賤賣為娼"
    cast:
      - name: "陳經濟"
        note: "落魄的晏公廟道士，本回因嫖妓被抓，牽出與春梅的舊緣"
      - name: "龐春梅"
        note: "已是守備夫人，本回認出經濟卻按住不表態"
      - name: "孫雪娥"
        note: "西門慶家出身，本回在守備府因惹春梅生氣被重罰賤賣"
      - name: "劉二"
        note: "馬頭上的惡霸，也是張勝的妻弟，本回抓住經濟送官"
      - name: "張勝"
        note: "守備府親隨，本回結識淪為娼妓的雪娥並收她做相好"
      - name: "任道士"
        note: "經濟的師父，本回因徒弟惹禍受驚氣死"
  c95:
    intro: "月娘做主把丫頭小玉配給了玳安，看門的平安兒年紀比玳安大卻沒得到同樣的待遇，心裡不忿，趁機偷走當鋪裡客人寄放的一副金頭面跑去嫖妓，被官差抓住。審案的巡檢吳典恩本是月娘家提拔出來的舊夥計，卻趁機刑逼平安兒亂咬，暗指月娘與玳安有私情，還刁難不讓家裡領回失物。月娘急得沒了主意，靠薛嫂牽線找上春梅，春梅請守備出面壓下巡檢，才把東西討回、把平安兒放出來，一場風波總算平息。"
    highlights:
      - "平安兒偷當鋪金飾洩憤，反被官差逮住"
      - "巡檢吳典恩趁機刑逼，暗指月娘與玳安有私情"
      - "春梅出面請守備施壓，才化解一場官司危機"
    cast:
      - name: "平安兒"
        note: "西門慶家看門小廝，本回偷竊財物洩憤而惹上官司"
      - name: "吳月娘"
        note: "西門慶正妻，本回為找回失物四處求人奔波"
      - name: "吳典恩"
        note: "巡檢，靠西門家提拔卻趁機刁難月娘"
      - name: "薛嫂"
        note: "老牌媒人，本回牽線讓春梅出面替月娘解圍"
      - name: "龐春梅"
        note: "守備夫人，本回應月娘所託向守備求情"
      - name: "玳安"
        note: "月娘家小廝，本回與丫頭小玉配成一對"
  c96:
    intro: "春梅代守備送禮到月娘家，替西門慶做三年忌、給孝哥兒做生日，兩人相見格外親熱，月娘還帶她回舊宅花園走一趟。園子早已破敗，看到李瓶兒的床早被賤賣、潘金蓮的床也隨孟玉樓改嫁陪了出去，春梅心裡很不是滋味。回府後她仍日夜想著陳經濟，守備便派張勝去找人。這時陳經濟正流落街頭，被舊仇楊大郎又打又搶，幸虧一個做工頭的舊識侯林兒收留他到工地做工。沒想到張勝出府採花時恰好認出他，立刻帶他回守備府去。"
    highlights:
      - "春梅重遊舊家花園，瓶兒的床賤賣、金蓮的床隨人去"
      - "春梅思念經濟成疾，守備派人限期找人"
      - "經濟落魄工地做苦力，張勝巧遇後帶他回府"
    cast:
      - name: "龐春梅"
        note: "守備夫人，本回重回舊主家赴宴，仍苦戀陳經濟"
      - name: "吳月娘"
        note: "西門慶正妻，本回設宴款待春梅，重敘舊情"
      - name: "陳經濟"
        note: "本回流落工地打工，被舊識收留又遭惡人欺負"
      - name: "張勝"
        note: "守備府親隨，本回奉命尋人，巧遇經濟並帶回府中"
      - name: "侯林兒"
        note: "經濟舊識的工頭，本回收留落魄的經濟到工地做工"
  c97:
    intro: "陳經濟走投無路後投靠守禦府的春梅，兩人假扮表兄妹瞞過守備周秀，經濟因此在府裡住了下來，暗地跟春梅舊情復燃。周秀出征攻打宋江之前，交代春梅幫經濟找媳婦；春梅便託薛嫂做媒，說定開緞莊葛員外的女兒葛翠屏，風風光光辦了婚事。經濟表面上娶妻成家，背地裡仍與春梅私通不斷，兩段感情同時在同一個屋子裡進行。"
    highlights:
      - "春梅、經濟假扮表兄妹瞞過守備周秀"
      - "端午酒宴後，兩人在花亭重燃舊情"
      - "經濟依春梅安排娶妻，仍與春梅私通不斷"
    cast:
      - name: "陳經濟"
        note: "投靠春梅假扮她表弟，在守備府中安身"
      - name: "龐春梅"
        note: "守備周秀之妻，與經濟舊情復燃，安排他成婚"
      - name: "周守備"
        note: "守備，誤信經濟是春梅表弟，出征前託她找媳婦"
      - name: "薛嫂"
        note: "媒人，替春梅的兄弟經濟說定葛員外之女"
      - name: "葛翠屏"
        note: "開緞鋪葛員外之女，本回嫁給陳經濟為妻"
      - name: "吳月娘"
        note: "西門慶遺孀，送生日禮，意外引出經濟藏身守備府一事"
  c98:
    intro: "周守備平定宋江有功升官，陳經濟也跟著沾光掛名參謀。春梅出資讓經濟到臨清做生意，經濟卻聯手老友陸秉義，靠守備府的關係告發當年騙走他貨物的楊光彥，害對方傾家蕩產，順勢奪下對方的酒樓自己經營。開店期間，經濟巧遇多年前在西門家見過的韓道國一家，如今從東京逃難至此、寄住店裡。經濟一見韓道國女兒韓愛姐就心動，兩人很快勾搭成奸，往後經濟常以查帳為名跑去臨清會她，互贈情詩定情物，瞞著家中新婚妻子。"
    highlights:
      - "經濟聯手陸秉義告發楊光彥，奪店報復"
      - "經濟巧遇韓道國一家，勾搭上女兒韓愛姐"
      - "經濟、愛姐互贈情詩香囊，瞞著新婚妻子"
    cast:
      - name: "陳經濟"
        note: "守備府參謀，臨清開酒店，同時勾搭上韓愛姐"
      - name: "陸秉義"
        note: "經濟舊友，獻計告發楊光彥，當上酒店主管"
      - name: "楊光彥"
        note: "曾騙走經濟貨物的商人，本回遭經濟告發下獄、家產盡失"
      - name: "韓道國"
        note: "西門家舊夥計，蔡京倒台後從東京逃難投靠經濟"
      - name: "王六兒"
        note: "韓道國之妻，暗地接客維生，本回勾上商人何官人"
      - name: "韓愛姐"
        note: "韓道國之女，曾是蔡府管家妾，主動勾引經濟成奸"
  c99:
    intro: "陳經濟過完生日，跑去臨清酒店跟情人韓愛姐廝混，沒發現樓下鬧出風波：地痞劉二酒醉找上王六兒和她的相好客人，一頓打罵，還揚言自己是守備府侍衛張勝的小舅子。經濟因此更恨張勝，打聽到他的把柄，跟春梅密謀等守備回來要他的命，卻被張勝在窗外聽了個清楚。張勝先下手，闖進房裡殺死經濟。周守備回家後大怒，下令把張勝、劉二都打死，孫雪娥也畏罪自縊。韓愛姐聞訊趕到墳前哭倒，堅持留在守備府守寡盡節。"
    highlights:
      - "經濟密謀害張勝，反被張勝聽見，持刀殺死經濟"
      - "張勝、劉二事後皆被周守備下令打死，孫雪娥畏罪自縊"
      - "韓愛姐墳前哭倒，堅持留在守備府守寡盡節"
    cast:
      - name: "陳經濟"
        note: "春梅的情人，冒充她表弟住在守備府，本回被張勝殺死"
      - name: "張勝"
        note: "守備府侍衛，偷聽到經濟想加害他，先下手殺死經濟"
      - name: "龐春梅"
        note: "守備之妻，與經濟私通已久，經濟本回被殺，她傷心欲絕"
      - name: "劉二"
        note: "張勝的小舅子，酒醉鬧事波及經濟酒店，後被打死"
      - name: "周守備"
        note: "山東都統制，回家後下令打死張勝、劉二，隨即領兵出征"
      - name: "韓愛姐"
        note: "經濟的情人，聞他死訊墳前哭倒，堅持留下守寡"
  c100:
    intro: "韓愛姐爹娘早先搬去湖州，戰亂波及清河後，她獨自上路尋親，途中遇叔叔韓二相伴，終於在湖州團圓，但心意已決，出家守節到死。另一邊，周守備戰死沙場，春梅回家後縱慾無度，沒多久貪歡病死，年僅二十九歲。金兵南下，吳月娘一家逃難夜宿永福寺，遇普靜和尚超渡書中枉死眾人，道出各人轉世之處，還揭穿月娘之子孝哥其實是西門慶轉世。月娘徹底醒悟，讓孝哥隨普靜出家，自己平安回家終老，享年七十——全書因果，就此收束。"
    highlights:
      - "普靜和尚超渡枉死眾魂，揭穿孝哥是西門慶轉世"
      - "周守備戰死沙場，春梅縱慾病亡，雙雙謝幕"
      - "韓愛姐千里尋親，終究出家守節而終"
    cast:
      - name: "韓愛姐"
        note: "經濟情人，本回歷盡艱辛尋親湖州，終出家守節而終"
      - name: "龐春梅"
        note: "周守備之妻，本回與家僕周義私通，行房中猝死"
      - name: "周守備"
        note: "山東都統制，本回領兵抗金，戰死沙場，年四十七"
      - name: "普靜和尚"
        note: "岱嶽老僧，本回於永福寺超渡書中枉死眾魂，渡孝哥出家"
      - name: "吳月娘"
        note: "西門慶遺孀，本回逃難途中夢醒省悟，送孝哥出家後終老"
      - name: "孝哥"
        note: "月娘之子，本回被揭穿為西門慶轉世，隨普靜出家去"
wanli:
  c0:
    intro: "這一頁不是故事，而是四百年前出版時的「開場白」，一共四篇：欣欣子序替作者辯護，說這部書寫盡人情世故，是要人看破、不是教人學壞；東吳弄珠客序留下全書最有名的一句話——讀金瓶梅而生憐憫心的是菩薩，生效法心的就是禽獸；廿公跋短短幾行，說此書「曲盡人間醜態」其實藏著慈悲；最後的四貪詞用酒、色、財、氣四首小詞，把整部小說的主題先講給你聽。"
    highlights:
      - "「讀金瓶梅而生憐憫心者，菩薩也」——四種讀者的分類法，先看看自己是哪一種"
      - "四貪詞＝全書綱領：酒色財氣四個字，就是西門慶一家興衰的劇本"
chongzhen:
  c0:
    intro: "崇禎本的卷首比詞話本精簡，只保留一篇東吳弄珠客序。這篇序開頭就承認「金瓶梅，穢書也」，然後話鋒一轉：作者寫這些，是要世人引以為戒，不是教人效法。序裡留下全書最有名的讀者分類——讀了生憐憫心的是菩薩、生畏懼心的是君子、生歡喜心的是小人、生效法心的是禽獸。四百年前的出版者，就已經在教人「怎麼讀」這部爭議之書。"
    highlights:
      - "「蓋為世戒，非為世勸也」——一句話說完這部書的立場"
      - "菩薩、君子、小人、禽獸：四種讀者，你是哪一種？"
  c1:
    intro: "崇禎本的開場跟詞話本不同：不是直接寫武松打虎，而是先寫西門慶找了一群酒肉朋友，在玉皇廟結拜十兄弟。過了幾天，應伯爵跑來報告一件新鮮事——景陽岡出現一隻吃人的老虎，被一個叫武松的壯漢一頓拳腳打死，兩人還跑去看熱鬧。武松因此被知縣任命為都頭，又在街上巧遇失散多年的哥哥武大。武松搬進武大家同住，見到嫂嫂潘金蓮生得妖嬌，潘金蓮也對武松動了心思，兩人叔嫂之間氣氛微妙，為後面的故事埋下伏筆。"
    highlights:
      - "西門慶邀十位酒肉朋友，玉皇廟結拜十兄弟"
      - "武松打死景陽岡吃人虎，當上清河都頭"
      - "武松兄弟團圓，卻讓嫂嫂潘金蓮動了心"
    cast:
      - name: "西門慶"
        note: "本書男主角，清河富商，本回發起十兄弟結拜"
      - name: "應伯爵"
        note: "西門慶頭號食客，本回帶來武松打虎的消息"
      - name: "武松"
        note: "打虎好漢，本回當都頭又與兄長重逢"
      - name: "武大"
        note: "武松兄長，賣炊餅為生，本回接納武松同住"
      - name: "潘金蓮"
        note: "武大之妻，本回初登場，對小叔武松動了心思"
      - name: "吳月娘"
        note: "西門慶正室，本回對結拜計畫半信半疑"

  c53:
    intro: "西門慶到劉太監家赴宴喝酒，家裡陳敬濟趁機溜到花園和潘金蓮偷歡，兩人正待盡興，卻被隔牆傳來的聲響嚇得慌忙散開。西門慶喝醉回家，先到吳月娘房裡，月娘推說身體不適不留他過夜——原來月娘挑了這天當吉日，隔天一早焚香唸經、吞服求子的藥丸，當晚和西門慶同房後果然順利懷上了孩子。另一頭，李瓶兒生產後身體一直不好，也託人請王姑子來，順道在法事疏文裡幫她添上一句祈福的話。"
    highlights:
      - "陳敬濟潘金蓮花園偷歡，被嚇得慌忙散開"
      - "吳月娘虔誠求子，當晚意外懷上孩子"
      - "李瓶兒產後不適，託人在法事裡祈福"
    cast:
      - name: "西門慶"
        note: "本書男主角，清河富商，本回赴宴夜宿潘金蓮房"
      - name: "潘金蓮"
        note: "西門慶五房妾，本回與女婿陳敬濟偷情"
      - name: "陳敬濟"
        note: "西門慶女婿，本回與潘金蓮幽會偷歡"
      - name: "吳月娘"
        note: "西門慶正室，本回焚香服藥求子，如願懷孕"
      - name: "李瓶兒"
        note: "西門慶六房妾，本回產後不適，託人祈福"

  c54:
    intro: "李瓶兒和王姑子約好隔天到庵裡還願誦經，陳敬濟卻藉口看店不肯去，其實想趁機勾搭潘金蓮。西門慶上香後，被應伯爵、常峙節拉去城外一座花園喝酒賞景，席間行酒令、講笑話，應伯爵酒後偷偷逗弄唱曲的韓金釧兒，反被常峙節推倒，惹得眾人大笑。同時，陳敬濟溜進潘金蓮房裡想偷歡，卻被小玉的腳步聲嚇跑，僥倖沒被撞見。西門慶回家見李瓶兒產後氣色不好，便請任醫官隔帳把脈，一面看診一面吹噓醫術，最後只求匾額，不敢收謝禮。"
    highlights:
      - "應伯爵酒宴戲弄韓金釧兒，反被推倒"
      - "陳敬濟夜探潘金蓮，險遭小玉撞見"
      - "任醫官隔帳把脈，只求匾額不收謝禮"
    cast:
      - name: "西門慶"
        note: "本書男主角，清河富商，本回花園宴飲又請醫診病"
      - name: "應伯爵"
        note: "西門慶頭號食客，本回花園設宴戲弄歌女"
      - name: "陳敬濟"
        note: "西門慶女婿，本回夜探潘金蓮房險被撞見"
      - name: "潘金蓮"
        note: "西門慶五房妾，本回與陳敬濟再度偷情未成"
      - name: "李瓶兒"
        note: "西門慶六房妾，本回產後不適，請醫官把脈"
      - name: "任醫官"
        note: "本回出診醫官，替李瓶兒把脈兼自誇醫術"

  c55:
    intro: "任醫官診斷李瓶兒是產後沒調理好，開了清熱止血的藥方。西門慶又應應伯爵所求，接濟商人李三、黃四做生意的本錢，也聽來保回報：靠著東京關係，李桂姐的官司已經化解。西門慶隨即啟程赴東京替蔡太師慶生，重禮孝敬下正式拜為乾兒子，途中巧遇揚州老友苗員外，席間苗員外把兩個歌童許給他。西門慶思家心切先行告辭，苗員外守信，事後仍差人把歌童送到清河縣，同時王六兒也把弟弟王經送來伏侍，西門慶一併收下。"
    highlights:
      - "西門慶拜蔡太師為乾爹，重禮結交權貴"
      - "苗員外守信送歌童，實踐一句承諾"
      - "李桂姐官司靠關係化解，脫離牢獄之災"
    cast:
      - name: "西門慶"
        note: "本書男主角，清河富商，本回赴東京拜蔡太師為乾爹"
      - name: "蔡太師"
        note: "當朝權相，本回收西門慶為乾兒子"
      - name: "苗員外"
        note: "揚州富商，本回依諾送兩歌童給西門慶"
      - name: "李瓶兒"
        note: "西門慶六房妾，本回仍調養產後身體"
      - name: "李桂姐"
        note: "青樓女子，本回官司化解，脫離牢獄之災"
      - name: "應伯爵"
        note: "西門慶頭號食客，本回牽線借錢給商人"

  c56:
    intro: "苗員外送來的兩個歌童，其中春燕沒多久過世，只剩春鴻一人。常峙節想跟西門慶借錢買房子，總碰不到空檔，天天被老婆抱怨沒本事。這天他和應伯爵堵到西門慶，西門慶爽快拿出十二兩碎銀接濟他，說等他找到房子再補足房價。常峙節帶著銀子回家，老婆看到銀子立刻轉怒為喜，兩人和樂買了些衣服用品。同時應伯爵推薦一位懷才不遇的水秀才當代筆先生，把他講得神乎其神，西門慶聽了半信半疑，暫且按下這件事。"
    highlights:
      - "常峙節得西門慶接濟買房，老婆轉怒為喜"
      - "應伯爵大力推薦水秀才當代筆先生"
      - "歌童春燕早逝，只剩春鴻一人伏侍"
    cast:
      - name: "西門慶"
        note: "本書男主角，清河富商，本回拿錢接濟常峙節"
      - name: "應伯爵"
        note: "西門慶頭號食客，本回討錢又推薦人才"
      - name: "常峙節"
        note: "西門慶朋友，本回獲西門慶接濟買房錢"
      - name: "常峙節渾家"
        note: "常峙節之妻，本回一見銀子轉怒為喜"
      - name: "水秀才"
        note: "應伯爵推薦的落第書生，本回尚未登場"

  c57:
    intro: "西門慶告訴吳月娘想請水秀才代筆，又到李瓶兒房裡看孩子，三人笑談孩子將來要當官封贈，潘金蓮在外聽見，氣得大罵李瓶兒得意。這時化緣的老和尚上門，說要重修永福禪寺，遞上疏文，西門慶被說動，當場認捐五百兩。月娘勸他行善之餘也該收心，西門慶笑著搪塞過去。接著王薛姑子上門鼓吹印經積德，西門慶再出三十兩。潘金蓮還在氣頭上，跑到迴廊生悶氣，正巧遇上找西門慶的陳敬濟，兩人偷偷親熱，怒氣全消。"
    highlights:
      - "老和尚募款重修永福禪寺，西門慶認捐五百兩"
      - "潘金蓮聽見官哥封贈笑談，妒火中燒"
      - "潘金蓮怒氣未消，迴廊巧遇陳敬濟偷歡"
    cast:
      - name: "西門慶"
        note: "本書男主角，清河富商，本回捐錢重修佛寺印經"
      - name: "潘金蓮"
        note: "西門慶五房妾，本回妒火中燒後與陳敬濟偷歡"
      - name: "李瓶兒"
        note: "西門慶六房妾，本回逗弄官哥惹怒潘金蓮"
      - name: "道長老"
        note: "西印度來的化緣異僧，本回勸西門慶重修佛寺"
      - name: "薛姑子"
        note: "化緣尼姑，本回遊說西門慶出錢印經書"
      - name: "陳敬濟"
        note: "西門慶女婿，本回與潘金蓮迴廊偷歡"

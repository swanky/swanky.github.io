# AI 視覺製作精選作品集（/technical/ai-visual-production/ 的案例段；2026-10-07 立）
#
# 規則：
# - 只放權利清楚的原創作品。NFT、第三方 IP、改編角色、真人數位分身不進主打案例；
#   金瓶梅影像十部曲的語音與角色參考公開權利在製作紀錄仍標 NOT_VERIFIED，核實前不放。
# - 每案標「自主概念創作／非品牌委託」；不寫客戶、推薦語、成效、生成次數或成功率。
# - 「我的工作」沿用作品資料 disclosure 的既有措辭；「畫面上看得到的設計」只寫成品可觀察的事
#   （製作紀錄在攝影 workspace 的 reference／reviews，依移交規則不上站）。
# - 圖片以 order 參照該書 JSON 的 photos[]，不另存檔、不裁切；lead＝大圖，rows＝細節列（同列等高、原比例）。
# - 史旺姬人物設定把她定位在閱讀、文具、日常服飾、城市生活的青春題材；延伸方向沿這條線寫，
#   選片避開強調腿部與裙長的全身制服照。

hero: { book: swanky_ji_open_worlds, n: 1 }

cases:
  - id: open-worlds
    book: swanky_ji_open_worlds
    label: 案例一
    title: 她把風景打開
    concept: 同一位人物走過海岸、溫室與劇場，換了衣服、換了光，仍然一眼認得出是她。
    goal: 讓一個原創角色離開設定圖，走進三個差異很大的場景，確認她在每個場景都還像同一個人，並保有人物攝影的站姿、動作與光線。
    observe: 臉型、栗棕直髮、齊瀏海與兩條紅髮帶三章都維持；服裝與光線則逐章改變——海岸是藏青披肩、白褶裙配陰天冷光，溫室換成短外套與暖金逆光，劇場是深色洋裝與舞台側光。遠景交代環境，近景讓人認得出臉。
    result: 36 張影像、分三章。完成線上作品頁、可下載的完整寫真集（43 頁）與 Flickr 公開相簿。
    extend: 同一角色跨場景的系列主視覺；用人物帶出空間氣氛的情境影像，例如展演、空間或旅遊主題的提案畫面。
    lead: 35
    rows:
      - [10, 14, 34]
      - [4, 19]
    row_notes:
      - 三個世界的近景：海岸、溫室、劇場。
      - 同一個人，放進不同尺度的空間。

  - id: everyday-light
    book: swanky_ji_everyday_light
    label: 案例二
    title: 把光留給日常
    concept: 把一天裡微小的表情與光線，排成四章可以連續閱讀的日常。
    goal: 從「看向窗外、忽然笑了、在門口多停一秒」這類小時刻出發，用造型、場景、光線與排序，把 36 張圖串成同一個主題。
    observe: 墨藍與米白是底色，一點紅（領巾、髮帶、紅筆）在彩色章節反覆出現，成為認出她的記號；第三章整章拿掉顏色，用窗格斜光的黑白肖像讓表情更清楚；空椅、空窗這類沒有人物的畫面，負責放慢節奏。四章依窗邊、街角、黑白、收尾排序。
    result: 36 張影像、分四章。完成線上作品頁、可下載的完整寫真集（44 頁）與 Flickr 公開相簿。
    extend: 閱讀、文具或日常生活風格的系列內容；用一個顏色記號串起整組社群或出版用圖；黑白肖像可做章節頁或展覽主視覺。
    lead: 6
    rows:
      - [12, 15]
      - [22, 27]
    row_notes:
      - 墨藍與一點紅，從窗邊帶到街角。
      - 黑白章：先看表情，再讓人離開畫面。

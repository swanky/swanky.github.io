# 攝影師圖鑑（/photography/learn/photographers/）資料檔
#
# 來源：攝影 repo research/photography-history/ 的人物、經典合作、寫真集研究檔，
# 依 2026-10-09 素材盤點（session scratchpad photo-zone-inventory.md）收錄所有非 X 級條目。
# 規矩：
# - 只放機構事實（姓名、生卒年或年代、國籍或地區、流派或時期、連結），不寫評述句。
# - 檔案沒記的寫「待考」或「未記」，不憑記憶補；歐美人物的研究檔沒有國籍欄，一律「未記」。
# - era：篩選用的數字。人物＝出生年，經典合作＝開始年，寫真集＝出版年；待考的不填（歸入「年代待考」）。
# - grade：盤點等級 A／B／C，只供日後判斷要不要做深度頁；前端只在 deep_url 存在時顯示「拆解」標記。
# - link：只放盤點表記載、且 2026-10-09 用 curl 檢查可開啟的網址；link_kind 分「官方網站」與「機構頁面」。
# 排除：任航（X，首批不放）；青山裕企 × 長期被攝者（站主確認前不上）；
#       Peter Lindbergh × 英國《Vogue》1990 年 1 月號封面（關鍵事實尚無機構來源）。


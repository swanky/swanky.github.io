# 攝影研究專區（/photography/learn/）的名稱、入口與單元地圖。
# 專區名稱與副標只在這裡改；另外兩頁 front matter 的 title／seo_title／breadcrumbs 也寫了名稱（Jekyll 不能在 front matter 讀資料），
# 改名時一併 grep「看懂寫真」。
# 章節狀態（只有 published／review 會被任何版型讀到；其他狀態沒有渲染路徑，頁面上完全看不到，也不寫「整理中」）：
#   published＝已發表（要有 url）；review＝站主審閱中（要有 url，只在非正式環境顯示）；
#   soon／verify／其他＝內部路線圖，公開頁一律不輸出。沒有可見章的單元整個不渲染；上一章／下一章只在可見章之間找。
#   圖鑑入口：photographers_status／models_status 設 published 才會在正式站首頁列出（沒設＝只在非正式環境顯示預覽連結）。
#   版型判斷統一用 _includes/photography/learn-visible.html。
# 單元 slug 決定章節網址：/photography/learn/<單元 slug>/<章節 slug>/。章節頁版型 _layouts/photo-learn-chapter.html 用 url 對回這裡找上一章／下一章。
# 章節題目只用 2026-10-09 素材盤點中 A／B 級可做的題目（另加兩篇已寫好、待補查證的舊稿）。
# 專區首頁（photography/learn/index.html，2026-10-09 策展改版，review §3.4）讀這些欄位：
#   doors[].picks：入口下直接列的章（章 url 清單，2～4 篇；只渲染看得到的），卡圖用該章的 card。
#   chapters[].card：首頁卡圖，只能用該章的示意圖或站主作品，不用他人作品。
#   chapters[].added／art_notes.notes[].added：加入日期（首頁「最新加入」取日期最新的 3 篇；同一天的，排在本檔後面的算較晚加入）。
#     新增一章時把 added 填當天日期；不要為了排序捏造不同日期。
#   shelves：首頁書架的分架順序（單元 id）；書架只列看得到的章，沒有可見章的單元不出現。

photographers_status: published
models_status: published
launched: true    # 導覽列等全站入口的開關：false 時正式站不顯示「看懂寫真」連結（本機預覽照常顯示）；2026-10-10 上線
name: 看懂寫真
subtitle: 史旺基的攝影學習筆記
url: /photography/learn/
photographers_url: /photography/learn/photographers/   # 2026-10-09 起暫不上線（published: false），首頁不連結
models_url: /photography/learn/models/               # 2026-10-09 圖鑑格式樣本，published: false，首頁不連結

# 三個入口：依讀者身分進門
doors:
  - id: feel
    ask: 我想拍出某種感覺
    who: 喜歡人像與寫真、想拍出某種氛圍的人；也適合用 AI 做影像、想補攝影語彙的人。
    units: [u2, u1]
    picks:
      - /photography/learn/style/jeanloup-sieff/
      - /photography/learn/style/herb-ritts/
      - /photography/learn/style/deborah-turbeville/
  - id: read
    ask: 我想看懂一本寫真集、一場展覽
    who: 逛展覽、收寫真集、寫報告，或想自己做一本寫真集的人。
    units: [u4, u1, u5]
    picks:
      - /photography/learn/photobook/utatane/
      - /photography/learn/photobook/the-americans/
      - /photography/learn/asia/taiwan-beginnings/
  - id: model
    ask: 我是模特兒，或想被拍
    who: 想知道好的合作怎麼發生、拍攝前怎麼和攝影師溝通想要的感覺。
    units: [u3]
    picks:
      - /photography/learn/collaboration/penn-fonssagrives/
      - /photography/learn/collaboration/avedon-dovima/
      - /photography/learn/collaboration/ko-si-chi-fan-chieh-hsi/

# 首頁書架的分架順序（主打的拆解與合作在前，攝影史與研究方法在後）
shelves: [u2, u3, u4, u5, u1, u6]


# 藝術筆記：不限攝影，站主喜歡的藝術家，一次讀一件作品（2026-10-09 起）。
# 專區首頁 #art-notes 區塊用；status 規則同上。作品圖要不要放，每篇都要站主個別確認（Kitty 已確認）。
art_notes:
  title: 藝術筆記
  gain: 一次只讀一件作品：作品資料、局部、構圖與創作背景，事實和我的讀法分開寫。
  notes:
    - title: 奈良美智《Harmless Kitty》：無害，但不必乖巧
      status: published
      url: /photography/learn/art/harmless-kitty/
      added: 2026-10-09
      # 首頁藝術筆記大卡的圖：作品圖每篇都要站主個別確認才放（Kitty 已確認，評論引用小圖）

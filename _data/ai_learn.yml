    subtitle: 同一件事不必每次從頭講：看懂坊間框架、學會四個原則、拆穿網路咒語，再把常做的事寫成可以重複用的模板
    description: 讀過 AI 入門之後的下一步。五幕看懂 Prompt 框架要不要背、官方文件教的四個原則、給小費和罵 AI 有沒有用、行話為什麼重要，最後把常做的事寫成可重複的模板。
    start_here: { title: "Prompting best practices", by: Anthropic, url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", meta: "官方文件・英文", note: "第二幕四個原則多數出自這份：把 AI 當聰明但剛到職的新同事、規則附理由、長文件資料放上面。寫給開發者，先讀開頭「Be clear and direct」和「Add context」兩節就好。" }
    origin: 整理自史旺基 2026 年 10 月的一場企業內部分享，改寫成可以自己讀、自己練的網頁版。
    mosaic: [h1, f1, r1, w1, d1, k1]
    myths:
      - { tag: 框架, chapter: frameworks, said: 要先背熟 RTF、CO-STAR 這些框架，才寫得好 Prompt, truth: 多數縮寫查不到提出者，也沒有研究證明哪個最好。有用的是把需求拆開來想：寫完用六塊積木檢查，缺哪塊補哪塊。 }
      - { tag: 框架, chapter: frameworks, said: 網路上的神 Prompt 照抄，就能做出一樣的成果, truth: 抄得到那一句，抄不到背後的幾百次重抽、挑選和剪接。要放進你自己的需求、資料和驗收標準。 }
      - { tag: 原則, chapter: principles, said: 叫它寫 300 字，它就會剛好寫 300 字, truth: AI 沒辦法在心裡可靠地數字數，直接要求嚴格長度，研究實測達標不到三成。改成「3 段、每段 2 句」這種一眼能驗收的寫法。 }
      - { tag: 原則, chapter: principles, said: AI 會照我說的做，所以不用驗收, truth: 它覺得「看起來做完了」就會停。交辦時先寫好可以打勾的完成條件，讓它交件前自己對一遍，你再抽查。 }
      - { tag: 咒語, chapter: magic-words, said: 給小費、威脅或罵它，AI 會比較認真, truth: 大規模重測都沒有可靠效果，同一句話這題多對、那題多錯。想要短就說要短，想要準就給標準。 }
      - { tag: 咒語, chapter: magic-words, said: 先說「你是世界級專家」，AI 就會比較準, truth: 2025 年底的大規模實測：空泛的專家角色沒有一致的好處。要給的是具體的身分、讀者和用途。 }
      - { tag: 行話, chapter: domain, said: 不懂這個領域沒關係，丟給 AI 就好, truth: 不懂行話，就說不清楚要什麼，也驗不出成品哪裡錯。先請 AI 當老師，教你最該懂的詞，再交辦。 }
      - { tag: 模板, chapter: template, said: 一次講不完，就分幾次慢慢補, truth: 研究發現同一件事分幾次補，頂尖模型的表現平均掉 39%。把要求整理成一段完整的交辦，常做的事寫成模板。 }

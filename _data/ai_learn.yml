# color：章節識別色 key，對應 assets/css/ai-learn.css 的 [data-act]（history/llm/prompt/mcp/skill/agent）

modules:
  - slug: ai-basics
    title: AI 入門：四個關鍵詞
    subtitle: 從七十多年的 AI 故事，搞懂 LLM、Prompt、MCP、Skill 四個關鍵詞，再看它們怎麼組成 Agent
    description: 給非工程背景的 AI 入門自學教材。跟著六幕故事，從 1950 年的圖靈測試一路走到會自己把事做完的 Agent；每幕都有小遊戲、測驗與比喻。
    # 整門課的延伸學習起點（總覽頁）
    start_here: { title: "AI Fluency: Framework & Foundations", by: Anthropic, url: "https://anthropic.skilljar.com/ai-fluency-framework-foundations", meta: "免費線上課・英文・有結業證書", note: "Anthropic 官方給新手的 AI 素養課：生成式 AI 是什麼、能力與限制、怎麼有效交辦、怎麼判斷 AI 的輸出。" }
    origin: 整理自史旺基 2026 年 10 月的一場企業內部 AI 入門分享，改寫成可以自己讀、自己練的網頁版。
    # 教育首頁單元列的六格縮圖（assets/img/ai-learn/<slug>/<代號>-768.webp）
    mosaic: [a1, l1, p1, m1, s1, g1]
    # 八個最常見的誤會（總覽頁翻牌卡）：tag＝名詞膠囊、chapter＝決定顏色
    myths:
      - { tag: LLM, chapter: llm, said: AI 會記得我上次講過的話, truth: 模型本身不記得；是 App 每次把整段對話重送給它。開新對話就從零開始（除非 App 另外開了「記憶」功能）。 }
      - { tag: LLM, chapter: llm, said: AI 什麼都查得到，而且是最新的, truth: 沒接工具時，它只靠訓練時讀的書，停在知識截止日。要最新或內部資料，要靠 RAG 或 MCP 工具。 }
      - { tag: Prompt, chapter: prompt, said: 要背神奇咒語，寫越長越好, truth: 重點是把任務、背景、限制講清楚，不是字數。跟任務無關的話反而會讓它分心。 }
      - { tag: MCP, chapter: mcp, said: MCP 是一個 AI 產品, truth: MCP 是一套像 USB-C 的接法規格，不是 App。你用的是支援 MCP 的 App，例如 Claude Code。 }
      - { tag: MCP, chapter: mcp, said: AI 用的每一個工具都是 MCP, truth: MCP 只是「接外部系統」的那套接法。Claude Code 本身就內建讀檔、改檔、執行指令等工具；要碰行事曆、信箱這類外部系統，常見做法是透過 MCP 接上；也有 App 內建或其他接法。 }
      - { tag: Skill, chapter: skill, said: Skill 就是存起來的長 Prompt；寫了它，AI 就被訓練變聰明了, truth: Skill 比一段 Prompt 多三件事，而且不會改到模型本身：① 用得上才載入全文 ② 可以附範本、資料、小程式 ③ 寫一次大家共用。 }
      - { tag: Agent, chapter: agent, said: 交給 Agent 就不用管了, truth: 它會誤解目標，也會被錯誤資料或假交辦帶偏。重要動作要你確認，結果要你驗收。 }
      - { tag: Agent, chapter: agent, said: 會自動跑的東西都叫 Agent, truth: 照固定步驟跑的叫流程自動化（Workflow），中間用了 LLM 也一樣。Agent 是 LLM 每一步自己決定下一步、用哪個工具。 }

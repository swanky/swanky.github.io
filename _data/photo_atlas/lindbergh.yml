id: lindbergh
status: published
name: Peter Lindbergh
life: 1944–2019
place: 生於波蘭，在德國 Duisburg 長大
theme: 黑白、不修飾，把時尚照拍成真實的人
view: 他的照片多半是黑白的，模特兒常常素著一張臉、頭髮被風吹亂，站在工廠、空地或街頭。看他，學的是怎麼讓一個人「不完美」地好看：不靠修圖，靠現場、光和對方真實的狀態。
bio: |
  <p>Getty 美術館的館藏紀錄寫他是德國攝影師，1944 年生於波蘭；杜塞道夫的 Kunstpalast 美術館說，他在德國 Duisburg 長大，2019 年 9 月過世。<sup><a href="#src-lindbergh">出處：Getty 美術館、Kunstpalast</a></sup></p>
  <p>鹿特丹 Kunsthal 美術館稱他是過去四十年最有影響力的時尚攝影師之一，說他從 1980 年代起的純黑白照片，決定了時尚攝影的方向；館方的說法是，他「為攝影帶進一種新的寫實」，重新定義了美的標準。館方也引了他 2016 年的一句話：今天攝影師的責任，是讓女性、最後是每一個人，擺脫「對青春與完美的恐懼」。<sup><a href="#src-lindbergh">出處：Kunsthal 美術館</a></sup></p>
  <p>他生前花了兩年，從自己的作品裡挑出 140 張照片，做成回顧展《Untold Stories》；漢堡 MK&amp;G 美術館說，這是他第一次親自策展的回顧展。展出的照片多半原本是替《Vogue》《Harper's Bazaar》等月刊拍的委託作品。展覽 2020 年 2 月在杜塞道夫 Kunstpalast 開幕，之後巡迴到漢堡、達姆施塔特和拿坡里。<sup><a href="#src-lindbergh">出處：Kunstpalast、MK&amp;G 美術館</a></sup></p>
works_intro: 他的作品在美術館館藏頁上很少有圖，所以這裡除了 Getty 美術館的館藏頁，也用了三家美術館為他辦展時放在展覽頁上的照片；每一件的連結都通往那一頁。依年代排，可以看到他從工廠、空地、街頭一路拍到一張不修飾的臉。

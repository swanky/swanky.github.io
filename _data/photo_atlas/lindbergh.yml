take:
  - 讓臉保持真實。Schiffer 那張留著雀斑和亂髮；拍前和對方說好，妝淡一點、修圖少一點，表情反而更有力。
  - 場景粗糙一點沒關係。工廠、泥地、街頭都不漂亮，卻讓人和衣服更顯眼；找景時不一定要找「美」的地方，找有質感、有故事的地方。
  - 多人照先讓大家靠近。五位模特兒那張靠得很近、互相搭著；拍團體時，先讓大家聊開、站近一點再按快門，比排好隊形自然。

works_after: |
  <h3 class="atlas-h">我的作品對照</h3>
  <p>我拍的《For Your Safety》系列裡，Colorist 那張也看得到類似的做法：她戴著白色安全帽、穿白色 T 恤，正含著薩克斯風吹奏，兩頰鼓起、眼睛睜得很大；背景是斑駁的水泥牆和一整片綠色植物。不是擺好的表情，是她正在做一件事的時候停下來的那一秒。</p>
  <figure class="pl-own">
    <a class="portfolio-lightbox" data-gallery="atlas-moss-own" data-type="image" href="/assets/img/sec/005_Colorist_1.jpg">
      <img src="/assets/img/photography/responsive-subpages/sec-005_Colorist_1-960.jpg" alt="For Your Safety — Colorist 人像攝影" width="960" height="960" loading="lazy" decoding="async">
    </a>
    <figcaption>史旺基作品，《For Your Safety》系列：Colorist。點圖放大。</figcaption>
  </figure>
take:
  - 年齡和意願，拍之前就要確認。Moss 說自己 15 歲拍 1990 年那組照片時覺得脆弱又害怕、哭了很多；被拍的人說不想，就是不要，對象未成年時，更要有大人把關。這是攝影師的責任，不是模特兒的。
  - 信任會留在照片裡。她形容和 Testino 合作是「我們一起找出那張照片」；拍前多花時間讓對方知道你要什麼、也聽對方想怎麼被拍，比現場不斷下指令有用。
  - 讓模特兒在真的地方動起來。Luchford 讓她在時代廣場的人潮裡舉拳、在旅館地板上躺著看窗外；與其在棚內擺姿勢，不如給一個真實的場景，抓她動起來的那一秒。

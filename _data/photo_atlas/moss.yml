id: moss
status: published
name: Kate Moss
life: 1974 年生
place: 英國倫敦
theme: 一個名字，和一場還在被重新討論的拍攝
view: 她十幾歲就入行，同一張臉在 Corinne Day、Glen Luchford、Juergen Teller、Mario Testino、Chris Levine 面前，從街頭的隨手一拍到全息光影，樣子差很多。她也是少數多年後公開說出拍攝經驗的模特兒。看她，除了看照片，也要看一個被拍的人，事後怎麼說那些照片。
bio: |
  <p>1974 年生。<sup><a href="#src-moss">出處：英國國家肖像館</a></sup>攝影師 Corinne Day 的遺產管理單位寫，Day 第一次發表的作品，就是 1990 年替《The Face》拍 Kate Moss 的專題〈3rd Summer of Love〉。Moss 在 2024 年的訪談裡說，拍那組照片時她 15 歲，還在上學。<sup><a href="#src-moss">出處：Corinne Day 官方網站、The Independent（AOL 轉載）</a></sup>她後來談的就是這次 1990 年《The Face》的拍攝：2022 年的訪談裡，她說那次經驗讓她覺得脆弱又害怕、「哭了很多」，又說 Day 是她最好的朋友、她真的很愛她，但也是一個很難共事的人。<sup><a href="#src-moss">出處：Stylist</a></sup>這一組是她未成年時拍的，本站不放圖，也不描述畫面。</p>
  <p>1993 年，Day 替英國版《Vogue》拍 Moss 的三月號封面與主專題；同年稍晚，又在 Moss 西倫敦的公寓拍了一組內衣專題。Day 的官方網站寫，這組照片刊出後引發媒體風波，當時的報導說它「醜陋又剝削」，還給它貼上「兒童色情」和「heroin chic」（海洛因時尚）的標籤。<sup><a href="#src-moss">出處：Corinne Day 官方網站</a></sup>2022 年，Moss 回應這組照片被批評美化消瘦和毒品時說：「我想我成了很多人問題的代罪羔羊。我從來沒有厭食，我從來沒碰過海洛因。」<sup><a href="#src-moss">出處：PAPER</a></sup></p>
  <p>英國國家肖像館收了 Mario Testino 拍她的作品，館方說兩人從 1990 年代初在巴黎開始合作。Moss 自己這樣形容：「他不會把我困在一種固定的樣子裡，我們一起找出那張照片。」<sup><a href="#src-moss">出處：英國國家肖像館</a></sup></p>
works_intro: 本頁有圖的作品拍於 1994–2013 年。照年代排，七件：五位攝影師的作品，加上一張雜誌封面。有小圖的五件都是她成年後、沒有裸露的作品；1993 年 Day 那件和 Testino 那件只放館藏連結。

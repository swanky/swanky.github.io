take:
  - 從一件東西開始想。V&amp;A 那十組，每一組都從一件館藏出發：鼻煙盒變成龍、刺繡木盒變成祕密花園。拍之前先找一件讓你有感覺的東西，再讓場景、服裝和光往它靠。
  - 把參考資料先給模特兒看。他用分鏡（草圖腳本）和情緒板（參考圖拼貼的靈感板）讓模特兒知道要「住進」什麼樣的世界；你也可以把三五張參考圖先傳給對方，現場就不用從零解釋。
  - 場景不必大，但要完整。衣櫃、包裝箱、白色箱型空間都不大，可是畫面裡每一樣東西都屬於同一個故事；寧可小而完整，不要大而零散。

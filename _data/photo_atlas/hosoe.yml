take:
  - 找一個真的地方，不要急著搭景。稻田、農舍、河邊草地本身就有故事，人放進去就會跟環境對話；外拍前先花時間挑地點，比挑衣服更重要。
  - 給對方一個角色，而不是一個姿勢。土方在《鎌鼬》裡演的是傳說中的妖怪，所以每個動作都有理由；拍之前先跟模特兒說好「你是誰、你在這裡做什麼」。
  - 讓人小一點，讓地方大一點。稻田那張人只佔一小塊，土地的尺度反而讓動作更有力；不是每張人像都要把人拍滿。

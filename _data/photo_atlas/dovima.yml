id: dovima
name: Dovima
life: 1990 年逝世（享年 63 歲）
place: 美國紐約（生於皇后區）
theme: 一個人，四位攝影師的四種樣子
view: 同一位模特兒，在 Irving Penn、Lillian Bassman、Richard Avedon、William Helburn 的鏡頭前，是完全不同的樣子：帽子、暗房裡的影子、馬戲團、高架鐵路下。看她，學的是模特兒怎麼把自己的線條，帶進每一位攝影師的畫面。
bio: |
  <p>本名 Dorothy Virginia Margaret Juba，工作時用「Dovima」這個名字。<sup><a href="#src-dovima">出處：芝加哥藝術博物館</a></sup>大都會藝術博物館的說明寫：她替 Irving Penn 拍過，也幾乎替那個年代的每一位攝影師拍過。<sup><a href="#src-dovima">出處：大都會藝術博物館</a></sup></p>
  <p>1955 年 8 月，Richard Avedon 在巴黎的攝影棚和好幾個外景地替她拍照，刊在《Harper's Bazaar》9 月號一個 14 頁的巴黎時裝專題裡；和大象合照的那張，就拍於巴黎的冬季馬戲團。<sup><a href="#src-dovima">出處：芝加哥藝術博物館</a></sup></p>
  <p class="atlas-note">生年沒有機構來源：《紐約時報》訃聞只寫她 1990 年逝世、享年 63 歲，這裡照實不填。</p>
works_intro: 本頁作品拍於 1949–1955 年。照年代排，一共六件、四位攝影師，都連到美術館的館藏頁，點過去看原作。

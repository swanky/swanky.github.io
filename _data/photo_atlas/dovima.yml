    link_only: true
    title: "Making an Icon: Richard Avedon's Dovima with Elephants - Lisa Volpe"
    channel: MFAH Docent
    length: 43 分 51 秒
    lang: 英語
    note: 只談大象那一張的完整演講。這個頻道沒有寫明是不是美術館的正式頻道，所以這裡只放連結，不嵌入
take:
  - 先讀懂這位攝影師要的線條。同一個人，在 Penn 的帽子特寫、Bassman 的暗房影子、Avedon 的馬戲團裡，是完全不同的樣子；拍攝前先看對方平常的作品，比準備一套萬用姿勢有用。
  - 讓身體去呼應場景裡的形狀。館方說她的曲線呼應大象的輪廓；拍之前先在場景裡找一個形狀（拱門、欄杆、樹枝、布料的皺褶），讓姿勢去對它。
  - 讓模特兒把角色演出來。館方說她面對大象時看起來從容、無懼；拍前把衣服和場景的故事先告訴對方，她的神情就有依據，不必硬擺表情。

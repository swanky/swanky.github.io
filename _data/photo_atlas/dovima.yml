works_after: |
  <p class="atlas-note">大象那張，紐約現代藝術博物館（<a href="https://www.moma.org/collection/works/46095" target="_blank" rel="noopener">館藏頁</a>，1958–59 年就在館內展出過）、大都會藝術博物館（<a href="https://www.metmuseum.org/art/collection/search/262997" target="_blank" rel="noopener">館藏頁</a>）和英國 V&amp;A 博物館（<a href="https://collections.vam.ac.uk/item/O82832/" target="_blank" rel="noopener">館藏頁</a>）也各收了一張印相。同一張照片，不同館、不同年份印出來的版本。</p>
  <h3 class="atlas-h">我的作品對照</h3>
  <p>我拍的 Karen 裡也看得到類似的做法：她戴著白色安全帽、穿白襯衫，身體靠向一根黃色鋼管欄杆，一手托著下巴，欄杆的斜線和她歪過去的身體連成同一個方向，背後是高架橋下的綠地。她不是站在欄杆旁邊，而是讓身體順著欄杆走。</p>
  <figure class="pl-own">
    <a class="portfolio-lightbox" data-gallery="atlas-dovima-own" data-type="image" href="/assets/img/sec/027_Karen_1.jpg">
      <img src="/assets/img/photography/responsive-subpages/sec-027_Karen_1-960.jpg" alt="戴白色安全帽的女孩靠在黃色鋼管欄杆上，一手托腮，身體順著欄杆的斜線歪過去" width="960" height="960" loading="lazy" decoding="async">
    </a>
    <figcaption>史旺基作品，《For Your Safety》系列。點圖放大。</figcaption>
  </figure>
  <p>拿它和 Dovima 比：她讓身體去呼應兩頭大象的輪廓，我這張是呼應一根欄杆；共同點是：<strong>先找到場景裡的線條，再讓姿勢去對它。</strong></p>

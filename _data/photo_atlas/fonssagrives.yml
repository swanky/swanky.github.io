    channel: MEP - Maison Européenne de la Photographie
    channel_url: https://www.youtube.com/@mep-paris
    length: 56 秒
    lang: 片尾字卡為法文
    note: 巴黎歐洲攝影之家官方頻道，2024 年展覽的預告。一分鐘內翻過十幾張不同攝影師拍她的照片，很適合用來感受「同一個人、不同鏡頭」。
take:
  - 把身體當成畫面裡的一條線。她說自己的照片是「靜止的舞蹈」；拍之前先決定這張的主線是直的、斜的還是彎的，再請模特兒用整個身體去做那條線，而不是只動手和臉。
  - 讓模特兒參與造型和構圖。她自己化妝、自己當造型、對打光有意見；拍前把參考圖給對方看，請對方提出一個自己的版本，常常比攝影師一個人想的好。
  - 換一個身體的角度，就是新的一張。Horst 讓兩位模特兒一站一坐、一背一側放在同一格裡；拍同一套衣服時，先拍正面，再請對方轉身、坐下、背對，給後製留選擇。

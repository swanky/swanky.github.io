bio: |
  <p>1911 年生於瑞典哥特堡，從小畫畫、雕塑、跳舞；1931 年在柏林 Mary Wigman 的現代舞學校上課，之後到巴黎繼續跳舞。1933 年在巴黎認識舞蹈老師兼攝影師 Fernand Fonssagrives，1935 年結婚，Fernand 轉做攝影後，她就成了他的模特兒。<sup><a href="#src-fonssagrives">出處：瑞典女性傳記辭典</a></sup></p>
  <p>巴黎歐洲攝影之家（MEP）稱她是史上第一位「超模」：二十年間常登上《Harper's Bazaar》和《Vogue》，約上過 200 個雜誌封面，1949 年 38 歲時上了《Time》封面。她和 Horst、Blumenfeld、Louise Dahl-Wolfe、Avedon 等人都合作過；1950 年和 Irving Penn 在倫敦結婚，1992 年在紐約過世。<sup><a href="#src-fonssagrives">出處：MEP、Irving Penn 基金會</a></sup></p>
  <p>她不只站在鏡頭前。瑞典女性傳記辭典寫：她拍照時自己當造型師、自己化妝，對構圖和打光也有意見，把模特兒工作看成舞蹈和雕塑的延伸，稱自己的照片構圖是「靜止的舞蹈」（still dance）。MEP 也說她大量參與了創作過程。1960 年代她回頭做雕塑和服裝設計，1995 年斯德哥爾摩現代美術館替她辦了回顧展。<sup><a href="#src-fonssagrives">出處：瑞典女性傳記辭典、MEP</a></sup></p>
works_intro: 照年代排，九件、四位攝影師（Horst、Blumenfeld、Fernand Fonssagrives、Penn），加上上面 Frissell 那張，一共五位。有小圖的六件都在美術館館藏頁；另外三件只在巴黎歐洲攝影之家（MEP）2024 年的展覽頁上看得到，MEP 網站不允許轉載，所以只放文字和連結，點過去看。

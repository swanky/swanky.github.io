    credit: "攝影：Horst｜© Victoria and Albert Museum, London"
    look: 黑色小圓帽、粉紅玫瑰和一層網紗，她側著臉湊近一本攤開的素描本，本子上畫的是手。手和臉都在畫面裡，可是被看的是帽子：她把臉擺成帽子的底座。
  - title: Lisa Fonssagrives, Tour Eiffel, Paris
    zh: Blumenfeld 攝，艾菲爾鐵塔上的 Lisa
    year: 1939 年 5 月，法國版《Vogue》
    where: 巴黎歐洲攝影之家（MEP）展覽頁
    url: https://www.mep-fr.org/en/event/lisa-fonssagrives-penn-fashion-icon/
    look: MEP 展覽頁上的這張：她披著白色毛皮披肩，一手抓著鐵塔上的燈具，上半身往外傾，身後是雲和整片巴黎。MEP 提到 Blumenfeld 在鐵塔上拍她，最出名的一張是她穿 Lucien Lelong 洋裝懸在鐵塔邊。這種高度，靠的是模特兒自己敢不敢把重心交出去。
  - title: "Fashion: Shadow Weights"
    zh: Horst 攝，〈影子的重量〉
    year: 1940 年，同年 6 月刊於美國版《Vogue》
    where: 英國 V&A 博物館
    url: https://collections.vam.ac.uk/item/O1293709/

works_after: |
  <p class="atlas-note">Penn 和她的合作怎麼開始、她怎麼參與造型和構圖，放在「Irving Penn 與 Lisa Fonssagrives」那一章裡。</p>
  <h3 class="atlas-h">我的作品對照</h3>
  <p>我拍的〈窗邊的懸浮感〉裡也看得到類似的做法：她坐在窗邊的木椅上，雙腿伸直擱到前面另一張椅子，一隻手往前伸，從頭到腳拉成一條長長的斜線；身後是白色窗簾和窗光，桌上的木頭人偶也擺著一個姿勢。畫面裡的「形狀」是她用身體做出來的，不是場景給的。</p>
  <figure class="pl-own">
    <a class="portfolio-lightbox" data-gallery="atlas-fonssagrives-own" data-type="image" href="/assets/img/photography/selected/15262345956.jpg">
      <img src="/assets/img/photography/responsive-subpages/photography-selected-15262345956-960.jpg" alt="窗邊椅子上的制服人像" width="960" height="960" loading="lazy" decoding="async">
    </a>
    <figcaption>史旺基作品〈窗邊的懸浮感〉，2014。點圖放大。</figcaption>
  </figure>

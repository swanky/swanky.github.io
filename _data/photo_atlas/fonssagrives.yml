    img_w: 450
    img_h: 600
    credit: "攝影：Horst｜© Victoria and Albert Museum, London"
    look: V&amp;A 編目寫畫面裡是 Lisa Fonssagrives 和另一位模特兒 Miss Lane，兩人穿 Saks Fifth Avenue 的洋裝和帽子，一個背對鏡頭站著、一個坐在鐵椅上。兩套衣服、一站一坐、一背一側，放在同一格裡互相襯托。
  - title: Lisa Fonssagrives
    zh: Fernand Fonssagrives 攝
    year: 1940 年代
    where: 巴黎歐洲攝影之家（MEP）展覽頁
    url: https://www.mep-fr.org/en/event/lisa-fonssagrives-penn-fashion-icon/
    look: 拍她的是第一任丈夫，兩人都是舞者出身。MEP 展覽頁上的這張：白背景、長裙，肩上掛著一個帶流蘇的大袋子，她側身回頭看鏡頭，從頭到腳是一條很穩的直線。
  - title: Lisa Fonssagrives Penn, Charles James suit
    zh: Horst 攝，Charles James 套裝與羽毛帽
    year: 1950 年 2 月，美國版《Vogue》
    where: 巴黎歐洲攝影之家（MEP）展覽頁
    url: https://www.mep-fr.org/en/event/lisa-fonssagrives-penn-fashion-icon/
    look: 和 1939 年那頂帽子比：一樣是 Horst、一樣是帽子，十一年後她直視鏡頭，大衣領口立起來把臉框住，胸前一束白花。同一位攝影師，她給了完全不同的眼神。
  - title: Harlequin Dress

id: fonssagrives
status: published
name: Lisa Fonssagrives
life: 1911–1992
place: 瑞典出生，在巴黎和紐約工作
theme: 把拍照當成「靜止的舞蹈」
view: 她先是舞者，後來才當模特兒。同一個人，在 Horst 的面紗和光影裡、Blumenfeld 的艾菲爾鐵塔上、Penn 的白背景前、Frissell 的火車站月台上，樣子都不一樣，可是每一張都是她先用身體做出一個清楚的形狀，衣服才跟著被看見。看她，學的是模特兒怎麼把自己的身體訓練帶進每一張照片。

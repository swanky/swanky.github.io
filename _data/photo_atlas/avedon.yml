take:
  - 先決定背景要「說話」還是「閉嘴」。街頭、賭場、馬戲團讓背景一起說故事；一面白牆則讓姿態和表情自己撐場。拍之前先選一邊，不要兩邊都想要。
  - 讓對方動起來再按快門。Renee、Carmen、Penelope Tree 都是動作中的一瞬間；與其擺好一個姿勢，不如請對方走、跨、轉身，你負責抓那一格。
  - 把「表面」當線索。衣服、髮型、手放在哪裡都是資訊；拍白底人像時，這些就是你唯一能用的語言，拍前要和對方一起決定。

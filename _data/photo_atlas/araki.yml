take:
  - 拍身邊的人，要拍一段時間，不是一張照片。同一個人的婚禮、旅行、發呆、告別連起來，才是故事；想拍家人或伴侶，可以先決定要跟拍多久。
  - 人不在畫面裡的時候，物件和天空也能替人說話。公共電話、路邊的擺飾、一片天空，都是「我在這裡生活過」的證據。
  - 越親近的拍攝，越要先講清楚。拍什麼、照片會用在哪裡、對方能不能說不，都要事先談好、留下文字；KaoRi 的陳述提醒我們，熟不是不簽同意書的理由。

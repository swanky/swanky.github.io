works_after: |
  <h3 class="atlas-h">我的作品對照</h3>
  <p>我拍的〈保護與脆弱〉裡也看得到類似的做法：背景只有一片白色窗簾，她正面看著鏡頭，頭戴白色安全帽，戴著白手套、抱著一大束乾燥花。畫面裡沒有別的東西，安全帽、手套和乾掉的花，就是這張照片全部的線索。</p>
  <figure class="pl-own pl-own--square">
    <a class="portfolio-lightbox" data-gallery="atlas-penn-own" data-type="image" href="/assets/img/sec/001_Zoey_1.jpg"><img src="/assets/img/sec/001_Zoey_1.jpg" width="1024" height="1024" alt="Zoey 戴安全帽手持乾燥花的概念人像" loading="lazy" decoding="async"></a>
    <figcaption>史旺基作品〈保護與脆弱〉，《For Your Safety》系列。點圖放大。</figcaption>
  </figure>

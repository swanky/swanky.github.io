take:
  - 先把背景收到最少。一個牆角、一塊素布就夠了；背景越少，對方怎麼站、手放哪裡就越重要，所以拍前要先想好請對方做什麼動作。
  - 換人不換景。Capote 和 Duchamp 用的是同一種窄牆角，看起來卻完全是兩個人；固定一個簡單的場景、連續拍好幾個人，最能拍出每個人自己的樣子。
  - 東西也能當主角。菸屁股、櫻桃、口紅都被他拍得像人像；拍寫真時，可以留一張只拍對方的隨身物件，讓它替人說話。

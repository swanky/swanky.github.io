id: penn
status: published
name: Irving Penn
life: 1917–2009
place: 美國紐約
theme: 把背景收到最少，讓人和東西自己說話
view: 他拍時尚、拍名人，也拍菸屁股、櫻桃和口紅，用的幾乎是同一套方法：一個牆角或一塊素布，畫面裡只留必要的東西。看他，學的是「拿掉」：背景拿掉之後還站得住的照片，才是真的構圖好。
bio: |
  <p>1917 年生於美國新澤西州 Plainfield。年輕時在費城念設計，老師是《Harper's Bazaar》的藝術總監 Alexey Brodovitch，他也當過老師的助理；1941 到 1942 年，他一路經過美國南方到墨西哥，花了一年專心畫畫。<sup><a href="#src-penn">出處：Penn 基金會、芝加哥藝術博物館</a></sup></p>
  <p>1943 年進《Vogue》，藝術總監 Alexander Liberman 鼓勵他拍第一張彩色照片，是一張靜物，後來成了 10 月 1 日那一期的封面；他把這一期當成自己職業攝影的起點。1950 年他到巴黎拍高級訂製服，攝影棚只用自然光，背景是一塊撿來的舊劇場布幕；同一年秋天，他和模特兒 Lisa Fonssagrives 結婚。<sup><a href="#src-penn">出處：Penn 基金會、芝加哥藝術博物館</a></sup>Nelson-Atkins 美術館說，他替《Vogue》拍的簡潔時尚照，在 1950 年代徹底改變了時尚攝影。<sup><a href="#src-penn">出處：Nelson-Atkins 美術館</a></sup></p>
  <p>1952 年起他也接廣告；1960 年代開始研究鉑鈀印相（一種用鉑和鈀金屬調成藥液、手工塗在紙上的老式印法，黑白層次特別細），後來用這種印法拍香菸、街上撿來的東西。1967 年他做了一座可以帶著走的帳篷攝影棚，先後帶到達荷美（今貝南）、尼泊爾、喀麥隆、新幾內亞和摩洛哥拍人。1986 年起和設計師三宅一生合作。1995 年他把大部分檔案捐給芝加哥藝術博物館；2009 年在紐約家中過世，享年 92 歲。<sup><a href="#src-penn">出處：Penn 基金會、芝加哥藝術博物館</a></sup></p>
works_intro: 九件都來自美術館的館藏頁，依年代排：先看他怎麼用一個牆角拍人，再看時尚照、帶著帳篷攝影棚出門拍的人像，最後是靜物和廣告。Penn 基金會要求他的作品完整呈現，所以這裡的小圖都是整張原作縮小，沒有裁切、也沒有疊字。

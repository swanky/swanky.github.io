id: ko-si-chi
name: Ko Si-chi
zh: 柯錫杰
life: 1929–2020
place: 台灣台南
theme: 把人放進風景，把風景收成色塊
view: 他拍過台灣鄉間的紀實、紐約的時尚雜誌，五十歲才把工作室關掉，到南歐和北非拍出被稱為「心象攝影」的作品。看他，是看一位攝影師怎麼把眼前的風景，拍成自己心裡的樣子；而且他的作品就在國家攝影文化中心，點開就看得到。
bio: |
  <p>1929 年生於台南，畢業於日本東京綜合寫真專門學校。<sup><a href="#src-ko-si-chi">出處：國家文藝獎、國家攝影文化中心</a></sup>回台灣後，1964 年成立台灣第一家專業攝影公司「藝園文化」。1967 年赴美，1971 年在紐約成立工作室，替《Bazaar》《Essence》《House Beautiful》等雜誌擔任特約攝影。<sup><a href="#src-ko-si-chi">出處：國立台灣美術館</a></sup></p>
  <p>1979 年，他結束在美國的事業，到南歐和北非拍風景，完成簡潔、獨特的「心象攝影」系列。<sup><a href="#src-ko-si-chi">出處：國家文藝獎</a></sup>1990 年代和妻子、舞蹈家樊潔兮回台灣定居；2000 年得到吳三連獎，2006 年得到國家文藝獎。<sup><a href="#src-ko-si-chi">出處：國立台灣美術館</a></sup>2020 年 6 月 5 日辭世，享壽九十歲。<sup><a href="#src-ko-si-chi">出處：國家文藝獎</a></sup></p>
works_intro: 十二件都收在國家攝影文化中心，每一頁都有館方請研究者寫的作品說明，中文、很好讀。前兩件是 1960 年代初的黑白作品，接著是 1979 年之後的彩色作品，可以對照他前後的轉變。館方對這些館藏頁標示「僅限公開瀏覽：受著作權法保護，僅限於本平台及受允許之相關平台公開瀏覽」；本站只放縮小的評論引用小圖，附館藏連結，權利人來信即撤。

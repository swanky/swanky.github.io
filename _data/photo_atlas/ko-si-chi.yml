works_after: |
  <h3 class="atlas-h">我的作品對照</h3>
  <p>我拍的這張裡也看得到類似的做法：她戴著白色安全帽、穿綠色上衣和黑色百褶裙，一腳抬起、手拿二胡，站在一整面灰色水泥牆前。人只佔畫面窄窄的一條，牆佔掉大半，反而讓她和那把二胡更清楚。</p>
  <figure class="pl-own">
    <a class="portfolio-lightbox" data-gallery="atlas-ko-si-chi-own" data-type="image" href="/assets/img/sec/020_Si-Xian_1.jpg">
      <img src="/assets/img/photography/responsive-subpages/sec-020_Si-Xian_1-960.jpg" alt="戴白色安全帽的女孩拿著二胡，一腳抬起，站在一整面灰色水泥牆前" width="960" height="960" loading="lazy" decoding="async">
    </a>
    <figcaption>史旺基作品，《For Your Safety》系列。點圖放大。</figcaption>
  </figure>
  <p>拿它和柯錫杰的〈行，突尼西亞〉比，我的牆是水泥灰，他的是一大片藍綠色天空；共同點是：<strong>先留一大塊乾淨的顏色，人小一點，畫面反而更穩。</strong></p>

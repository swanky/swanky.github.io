take:
  - 先做減法，再按快門。〈少女與祖母〉〈葡萄牙的房子〉都先把牆、地、天空收成幾塊顏色；拍環境人像時，先找一塊乾淨的顏色當舞台，再讓人走進去。
  - 人物小一點沒關係。〈行，突尼西亞〉的騎驢女子只是地平線上的一點，孤單的感覺反而更強；不是每張人像都要把人拍滿。
  - 背景可以替人說話。〈席德進〉身後的水墨山石，讓人一看就知道這是一位畫家；拍肖像時，找一樣和對方身分有關的東西放在身後。

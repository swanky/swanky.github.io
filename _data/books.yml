- id: shuihu
  title: 水滸傳
  author: 施耐庵（傳）
  era: 明
  status: published
  language: classical-chinese
  blurb: 一百零八個人被逼上梁山的過程。從高俅發跡寫起，史進、魯智深、林沖、武松一個個被官府擠到沒路走——武松與潘金蓮的故事也在裡面，和《金瓶梅》接得上。
  lineage: 這本書流傳下來不只一種樣子：常見的有一百回本、一百二十回本（多出征田虎、征王慶兩段），還有明末清初金聖嘆刪定的七十回本——故事截到一百零八人排定座次為止，前面加一段楔子。三種本子內容差很多，不是同一份文字的不同印刷。站上收的是金聖嘆七十回本。

- id: honglou
  title: 紅樓夢
  alternate_titles: [石頭記]
  author: 曹雪芹、高鶚（傳統題署）
  era: 清
  status: published
  language: classical-chinese
  blurb: 一個大家族由盛轉衰。人物最多、別名最繁、版本問題也最複雜——所以這裡同時收了兩種底本，可以對照著讀。
  lineage: 這幾部書裡版本問題最複雜的一部。早期只有手抄本流傳，各本都不到百回；因為附有署名脂硯齋的批語，通稱脂本，庚辰本是其中保存較完整的一種。清代乾隆年間，程偉元與高鶚排印出一百二十回本，補齊了後四十回（這四十回出自誰手，至今沒有定論），從此成為通行本。站上兩種底本都收了，可以對照著讀。
  primary_edition: wikisource-120
  editions:

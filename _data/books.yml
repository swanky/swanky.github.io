  lineage: 現存最早的完整刊本出於明代萬曆年間的金陵世德堂，一百回；後來清代又出過多種刪節、加評語的本子。站上收的是通行的一百回本；這份謄本依據哪一種刊本，來源頁沒有標明——這裡不猜，先老實記為待考。

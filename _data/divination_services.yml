# ── 倫理邊界：有些事，我們選擇不做（公開立場即品牌資產）─────────────
# UI 獨立渲染成「有些事，我們選擇不做」區塊，不與工具卡混在同一 grid（advice §5.2）。
- id: eth-cesarean-timing
  title: 剖腹擇日
  category: ethical-boundary
  status: not-recommended
  visibility: public
  note: 涉及醫療倫理與重大決策，應由醫療專業與家庭決定。

- id: eth-disease-divination
  title: 疾病占卜
  category: ethical-boundary
  status: not-recommended
  visibility: public
  note: 健康問題請找醫療專業，不是占卜。

- id: eth-death-disaster
  title: 死亡災厄預測
  category: ethical-boundary
  status: not-recommended
  visibility: public
  note: 容易造成心理傷害，我們不做恐懼生意。

- id: eth-investment-timing
  title: 投資買賣點占卜
  category: ethical-boundary
  status: not-recommended
  visibility: public
  note: 涉及金融責任；工具只談風險體質，不給買賣點。

- id: eth-medium
  title: 通靈亡者
  category: ethical-boundary
  status: not-recommended
  visibility: public
  note: 心理與信任風險過高。

- id: eth-ai-physiognomy
  title: AI 面相判命
  category: ethical-boundary
  status: not-recommended
  visibility: public
  note: 外貌歧視與生物特徵隱私風險。

- id: eth-ritual-service
  title: 祭改補運代辦
  category: ethical-boundary
  status: not-recommended
  visibility: public
  note: 宗教服務與效果宣稱風險，不在能力與誠信範圍。

- id: eth-yin-fengshui
  title: 陰宅風水
  category: ethical-boundary
  status: not-recommended
  visibility: public
  note: 情境高度敏感，不適合自動化與遠端判斷。

- id: eth-unverifiable-reading
  title: 自己無法驗證品質的人工解讀
  category: ethical-boundary
  status: not-recommended
  visibility: public
  note: 我們只提供自己學過、能親自把關品質的人工服務；沒有把握的科目，只做教育內容與可驗證的自動化工具。

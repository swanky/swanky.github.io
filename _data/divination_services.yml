# 自我探索實驗室・服務資料檔（公開呈現用）
#
# 公私分離原則：本檔只放「頁面呈現需要」的欄位；內部評估矩陣（契合度／難度／
# 變現／風險分數）留在私有規劃文件 docs/self-discovery-tools-plan.md §12，不入本檔。
#
# 每筆 shape：
#   id:         kebab-case 唯一鍵
#   title:      顯示名稱
#   subtitle:   一句定位（禁詞見 §13 語氣鐵律：不神準、不斷吉凶、不恐嚇）
#   category:   birth-map | inquiry | ritual | service | ethical-boundary
#   status:     live | coming-soon | manual-service | not-recommended
#   visibility: public | hidden | internal（只有 public 會渲染到公開頁）
#   priority:   P0 | P1 | P2 | backlog（roadmap 呈現用；ethical-boundary 免填）
#   phase:      預計上線 Phase（coming-soon 卡顯示「預計順位」；已上線者標「已上線」）
#   route:      內部連結；live／已建頁才填，未建頁留空字串避免死鏈（advice §5.3）
#   nav_order:  選填整數；有填才進「自我探索」下拉選單＋父層高亮，數字決定順序（header.html 由此單一資料源生成，兩清單不再 drift）
#   nav_label:  下拉選單顯示名（常比 title 短，如 職場塔羅→塔羅）；有 nav_order 時必填
#   icon:       Bootstrap Icons class（用前已 grep vendored CSS 確認 glyph 存在）
#   input_type: birth | question | none | name（工具輸入型態，供未來擴充）
#   use_cases:  應用情境標籤（陣列）
#   cta_label:  卡片行動鈕文字
#   note:       選填說明（ethical-boundary 的公開理由必填）
#   related:    相關工具 id（選填，內鏈用）
#   partner_cta: 選填，奇門合作導流用 {enabled,label,url}；enabled=false 時 fallback 自營 mailto
#
# 狀態維護註記：
#   - qimen 於 Phase 1B 建立 /qimen/ 後補 route。
#   - tarot-daily 於 Phase 1C 建立 /tarot/daily/ 後改 status: live 並補 route。


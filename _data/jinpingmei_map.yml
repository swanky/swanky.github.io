# 金瓶梅百回閱讀地圖（五幕／十段旅程／主線精選）——新手導讀頁與兩版目錄頁共用
# 幕與段是「閱讀框架」，不是原書結構（原書：詞話本分十卷、崇禎本不分卷）。
# 邊界錨點已逐項對照 _data/jinpingmei_guide.yml 核驗：c30 生子加官、c59 官哥兒夭折、
# c62 瓶兒病逝、c79 西門慶暴斃、c87 武松復仇、c100 普靜度化孝哥。人名用字依站上慣例（陳經濟、宋惠蓮）。
acts:
  - id: 1
    symbol: "火"
    range: "第1—10回"
    start: 1
    end: 10
    title: "欲望點火"
    question: "慾望怎麼越過門檻？"
    desc: "從《水滸傳》借來的武松、武大、潘金蓮故事開場，一路演到金蓮進西門府。這十回像一根點著的火柴，燒起後面九十回的宅院、財富與權力。"
  - id: 2
    symbol: "門"
    range: "第11—30回"
    start: 11
    end: 30
    title: "後院成局"
    question: "寵愛怎麼換成地位？"
    desc: "李瓶兒、宋惠蓮、陳經濟接連進場。後院不只是情場，更是資訊站與人事戰場；第三十回李瓶兒生下官哥兒、西門慶靠一份生辰厚禮換來官職，家勢升上新台階。"
  - id: 3
    symbol: "鼎"
    range: "第31—60回"
    start: 31
    end: 60
    title: "帝國鼎盛"
    question: "一座私人帝國怎麼運轉？"
    desc: "官場、生意、妓院、僕役與婚姻全面聯網，壽宴、煙火與賄賂把排場推到頂點。第五十九回官哥兒夭折，在最熱鬧處撕開第一道大裂縫。"
  - id: 4
    symbol: "雪"
    range: "第61—79回"
    start: 61
    end: 79
    title: "華宴轉冷"
    question: "盛宴從哪一刻開始腐壞？"
    desc: "第六十二回李瓶兒病逝，喪禮、夢境與縱慾交錯。官位還在往上爬，身體和家卻已經在垮——第七十九回西門慶暴斃，全書從此走下斷崖。"
  - id: 5
    symbol: "塵"
    range: "第80—100回"
    start: 80
    end: 100
    title: "瓦解與餘波"
    question: "主角死後，誰撿走碎片？"
    desc: "故事交給陳經濟、龐春梅、吳月娘與眾僕人：財物、身分與舊情重新洗牌，僕人翻身作主人，最後以報應、流散與度脫收場。"
segments:
  - range: "第1—10回"
    title: "簾下起風"
    focus: "潘金蓮・王婆・武松"
    task: "把武大命案與金蓮進府的來龍去脈讀懂。"
  - range: "第11—20回"
    title: "新局入宅"
    focus: "李瓶兒・蔣竹山・陳經濟"
    task: "看婚姻、財產與避禍怎麼互相交換。"
  - range: "第21—30回"
    title: "後院結網"
    focus: "宋惠蓮悲劇・生子加官"
    task: "留意誰能接近西門慶、誰掌握情報。"
  - range: "第31—40回"
    title: "權力上桌"
    focus: "官宴賄賂・王六兒"
    task: "把內宅當成官商系統的後台看。"
  - range: "第41—50回"
    title: "煙火照暗處"
    focus: "元宵・苗青案・胡僧藥"
    task: "豪華場面底下，犯罪與致命伏線同時進行。"
  - range: "第51—60回"
    title: "裂縫擴大"
    focus: "陳經濟私情・官哥兒夭折"
    task: "看慾望怎麼傷到下一代。"
  - range: "第61—70回"
    title: "喪鐘與高峰"
    focus: "李瓶兒之死・盛大喪儀"
    task: "對照私人的悲傷與公開的排場。"
  - range: "第71—79回"
    title: "頂峰即斷崖"
    focus: "官場極盛・西門慶之死"
    task: "身體與藥的伏線在這裡一次收攏。"
  - range: "第80—90回"
    title: "碎片爭奪戰"
    focus: "潘金蓮結局・春梅翻身・孫雪娥"
    task: "看階級翻面，僕人怎麼變成主人。"
  - range: "第91—100回"
    title: "餘燼與輪迴"
    focus: "陳經濟敗亡・春梅結局・孝哥出家"
    task: "最後十回回答全書的代價，別當附錄跳過。"

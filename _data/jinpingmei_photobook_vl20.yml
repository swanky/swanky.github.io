tagline: "一個瓶子的一生：被注滿、開花、被遮、變空，然後被記住。"
blurb: "五個房間、五條路線，20 張以器物寫人的當代寫真。"
lead: "李瓶兒離開設定表，走進五個虛構的房間：紅漆金箔、白色花房、黑白長廊、起霧的空屋與一座空舞台。當代訂製造型，主角為 AI 生成的虛構成年角色。"
foreword: "她叫瓶兒。一個瓶子的一生大約只有幾件事：被注滿、插上花、被放在陰影裡、慢慢變空，然後被誰記住。這本寫真集沒有情節，只有一個女人與一個器物在五個房間裡的關係。第一間是紅漆與金箔，光被小心地倒進去；第二間全是白色與水氣，花壓在玻璃上盛開；第三間只剩黑與白，格柵的影子落在肩上，她不躲；第四間起了霧，瓶子空著，她坐在旁邊；第五間是一座空舞台，瓶子被放大到可以走進去，她走進去，回頭看了一眼。光還在瓶子裡。"

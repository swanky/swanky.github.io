<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#0f0f2e"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5C53B"/>
      <stop offset="100%" stop-color="#E5A300"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5A300" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E5A300" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Scanlines effect -->
  <g opacity="0.05">
    <rect x="0" y="0" width="800" height="1" fill="white"/>
    <rect x="0" y="4" width="800" height="1" fill="white"/>
    <rect x="0" y="8" width="800" height="1" fill="white"/>
    <rect x="0" y="12" width="800" height="1" fill="white"/>
    <rect x="0" y="16" width="800" height="1" fill="white"/>
    <rect x="0" y="20" width="800" height="1" fill="white"/>
  </g>

  <!-- Grid floor perspective -->
  <g stroke="#1e3a5e" stroke-width="0.8" opacity="0.5">
    <line x1="400" y1="300" x2="0" y2="450"/>
    <line x1="400" y1="300" x2="100" y2="450"/>
    <line x1="400" y1="300" x2="200" y2="450"/>
    <line x1="400" y1="300" x2="300" y2="450"/>
    <line x1="400" y1="300" x2="400" y2="450"/>
    <line x1="400" y1="300" x2="500" y2="450"/>
    <line x1="400" y1="300" x2="600" y2="450"/>
    <line x1="400" y1="300" x2="700" y2="450"/>
    <line x1="400" y1="300" x2="800" y2="450"/>
    <!-- Horizontal lines -->
    <line x1="0" y1="380" x2="800" y2="380"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="50" y1="345" x2="750" y2="345"/>
    <line x1="120" y1="320" x2="680" y2="320"/>
  </g>

  <!-- NFT Token coin — center -->
  <circle cx="400" cy="190" r="90" fill="url(#glow1)"/>
  <circle cx="400" cy="190" r="64" fill="#1a1400" stroke="url(#coin)" stroke-width="4" filter="url(#neon)"/>
  <circle cx="400" cy="190" r="54" fill="none" stroke="#E5A300" stroke-width="1" opacity="0.5"/>
  <!-- NFT text on coin -->
  <text x="400" y="178" text-anchor="middle" font-size="22" fill="#E5A300" font-family="monospace" font-weight="bold" filter="url(#neon)">NFT</text>
  <text x="400" y="200" text-anchor="middle" font-size="10" fill="#F5C53B" font-family="monospace" letter-spacing="2">TOKEN</text>
  <line x1="366" y1="208" x2="434" y2="208" stroke="#E5A300" stroke-width="0.5" opacity="0.5"/>
  <text x="400" y="220" text-anchor="middle" font-size="9" fill="#E5A300" font-family="monospace" opacity="0.7">#0001</text>

  <!-- GameFi controller shape — left -->
  <g transform="translate(140, 160)" filter="url(#neon)">
    <rect width="100" height="64" rx="20" fill="#0a1a3a" stroke="#00d4ff" stroke-width="1.5"/>
    <!-- D-pad -->
    <rect x="18" y="22" width="8" height="22" rx="2" fill="#00d4ff" opacity="0.7"/>
    <rect x="12" y="28" width="20" height="10" rx="2" fill="#00d4ff" opacity="0.7"/>
    <!-- Buttons -->
    <circle cx="72" cy="24" r="5" fill="#ff6b9d" opacity="0.8"/>
    <circle cx="82" cy="32" r="5" fill="#E5A300" opacity="0.8"/>
    <circle cx="72" cy="40" r="5" fill="#4ade80" opacity="0.8"/>
    <circle cx="62" cy="32" r="5" fill="#60a5fa" opacity="0.8"/>
    <!-- Joystick bumps -->
    <circle cx="30" cy="52" r="6" fill="#1a2a4a" stroke="#00d4ff" stroke-width="1"/>
    <circle cx="70" cy="52" r="6" fill="#1a2a4a" stroke="#00d4ff" stroke-width="1"/>
  </g>

  <!-- Glow around controller -->
  <circle cx="190" cy="192" r="70" fill="url(#glow2)"/>

  <!-- GameFi controller — right (mirror) -->
  <g transform="translate(560, 160)" filter="url(#neon)">
    <rect width="100" height="64" rx="20" fill="#0a1a3a" stroke="#00d4ff" stroke-width="1.5"/>
    <rect x="18" y="22" width="8" height="22" rx="2" fill="#00d4ff" opacity="0.7"/>
    <rect x="12" y="28" width="20" height="10" rx="2" fill="#00d4ff" opacity="0.7"/>
    <circle cx="72" cy="24" r="5" fill="#ff6b9d" opacity="0.8"/>
    <circle cx="82" cy="32" r="5" fill="#E5A300" opacity="0.8"/>
    <circle cx="72" cy="40" r="5" fill="#4ade80" opacity="0.8"/>
    <circle cx="62" cy="32" r="5" fill="#60a5fa" opacity="0.8"/>
    <circle cx="30" cy="52" r="6" fill="#1a2a4a" stroke="#00d4ff" stroke-width="1"/>
    <circle cx="70" cy="52" r="6" fill="#1a2a4a" stroke="#00d4ff" stroke-width="1"/>
  </g>
  <circle cx="610" cy="192" r="70" fill="url(#glow2)"/>

  <!-- Connection lines coin ↔ controllers -->
  <line x1="336" y1="190" x2="244" y2="192" stroke="#E5A300" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
  <line x1="464" y1="190" x2="560" y2="192" stroke="#E5A300" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>

  <!-- Stats row -->
  <g transform="translate(0, 295)">
    <!-- Stat 1 -->
    <rect x="150" y="0" width="140" height="36" rx="6" fill="#0f1a3a" stroke="#E5A300" stroke-width="1" opacity="0.8"/>
    <text x="220" y="14" text-anchor="middle" font-size="8" fill="#E5A300" font-family="monospace" letter-spacing="1">PLAY TO EARN</text>
    <text x="220" y="28" text-anchor="middle" font-size="11" fill="#F5C53B" font-family="monospace" font-weight="bold">GameFi</text>

    <!-- Stat 2 -->
    <rect x="330" y="0" width="140" height="36" rx="6" fill="#0f1a3a" stroke="#E5A300" stroke-width="1" opacity="0.8"/>
    <text x="400" y="14" text-anchor="middle" font-size="8" fill="#E5A300" font-family="monospace" letter-spacing="1">MINT &amp; TRADE</text>
    <text x="400" y="28" text-anchor="middle" font-size="11" fill="#F5C53B" font-family="monospace" font-weight="bold">NFT</text>

    <!-- Stat 3 -->
    <rect x="510" y="0" width="140" height="36" rx="6" fill="#0f1a3a" stroke="#E5A300" stroke-width="1" opacity="0.8"/>
    <text x="580" y="14" text-anchor="middle" font-size="8" fill="#E5A300" font-family="monospace" letter-spacing="1">BUILD &amp; LAUNCH</text>
    <text x="580" y="28" text-anchor="middle" font-size="11" fill="#F5C53B" font-family="monospace" font-weight="bold">Web3</text>
  </g>

  <!-- Title -->
  <text x="400" y="385" text-anchor="middle" font-size="13" fill="#E5A300" font-family="'Lato', sans-serif" font-weight="700" letter-spacing="2" filter="url(#neon)">Z Institute · NFT &amp; GameFi</text>
  <text x="400" y="405" text-anchor="middle" font-size="10" fill="#4fa6d5" font-family="monospace" letter-spacing="3">實戰人才加速器</text>
</svg>

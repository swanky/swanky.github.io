<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="60%" stop-color="#2d1654"/>
      <stop offset="100%" stop-color="#7c3a1e"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#F5C53B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F5C53B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1a4e"/>
      <stop offset="100%" stop-color="#1a0f30"/>
    </linearGradient>
  </defs>

  <!-- Background sky -->
  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- Sun glow -->
  <ellipse cx="400" cy="380" rx="320" ry="180" fill="url(#sun)"/>

  <!-- Horizon line -->
  <line x1="0" y1="340" x2="800" y2="340" stroke="#E5A300" stroke-width="1" opacity="0.3"/>

  <!-- Stars -->
  <g fill="white" opacity="0.7">
    <circle cx="80" cy="50" r="1.5"/>
    <circle cx="150" cy="30" r="1"/>
    <circle cx="240" cy="70" r="1.5"/>
    <circle cx="560" cy="40" r="1"/>
    <circle cx="650" cy="60" r="1.5"/>
    <circle cx="720" cy="25" r="1"/>
    <circle cx="310" cy="55" r="1"/>
    <circle cx="480" cy="35" r="1.5"/>
  </g>

  <!-- Sun/morning arc -->
  <path d="M 200 340 A 200 200 0 0 1 600 340" fill="none" stroke="#E5A300" stroke-width="2" opacity="0.5"/>
  <path d="M 240 340 A 160 160 0 0 1 560 340" fill="none" stroke="#F5C53B" stroke-width="1" opacity="0.3"/>

  <!-- Sun disk -->
  <circle cx="400" cy="340" r="36" fill="#E5A300" opacity="0.25"/>
  <circle cx="400" cy="340" r="22" fill="#F5C53B" opacity="0.5"/>
  <circle cx="400" cy="340" r="10" fill="#F5C53B"/>

  <!-- NFT Profile Cards floating -->
  <!-- Card Left -->
  <g transform="translate(155, 140)">
    <rect width="110" height="130" rx="12" fill="url(#cardA)" stroke="#E5A300" stroke-width="1.5" opacity="0.9"/>
    <rect x="10" y="10" width="90" height="72" rx="8" fill="#3d2060"/>
    <!-- Avatar placeholder -->
    <circle cx="55" cy="46" r="22" fill="#5a3090"/>
    <circle cx="55" cy="34" r="10" fill="#7a50b0"/>
    <path d="M 30 68 Q 55 54 80 68" fill="#7a50b0"/>
    <!-- Wallet badge -->
    <rect x="30" y="90" width="50" height="16" rx="8" fill="#E5A300" opacity="0.8"/>
    <text x="55" y="102" text-anchor="middle" font-size="8" fill="#1a0a2e" font-weight="bold" font-family="monospace">0x3f…a2</text>
    <!-- Name -->
    <rect x="15" y="112" width="80" height="10" rx="3" fill="#4a2a70" opacity="0.7"/>
  </g>

  <!-- Card Right -->
  <g transform="translate(535, 120)">
    <rect width="110" height="130" rx="12" fill="url(#cardA)" stroke="#E5A300" stroke-width="1.5" opacity="0.9"/>
    <rect x="10" y="10" width="90" height="72" rx="8" fill="#1e3050"/>
    <circle cx="55" cy="46" r="22" fill="#254070"/>
    <circle cx="55" cy="34" r="10" fill="#3a60a0"/>
    <path d="M 30 68 Q 55 54 80 68" fill="#3a60a0"/>
    <rect x="30" y="90" width="50" height="16" rx="8" fill="#E5A300" opacity="0.8"/>
    <text x="55" y="102" text-anchor="middle" font-size="8" fill="#1a0a2e" font-weight="bold" font-family="monospace">0x9c…d7</text>
    <rect x="15" y="112" width="80" height="10" rx="3" fill="#2a4060" opacity="0.7"/>
  </g>

  <!-- Connection arc between cards -->
  <path d="M 290 195 Q 400 130 510 190" fill="none" stroke="#E5A300" stroke-width="2" stroke-dasharray="6 4" opacity="0.7"/>
  <!-- Heart at midpoint -->
  <text x="395" y="155" text-anchor="middle" font-size="18" fill="#E5A300" opacity="0.9">♥</text>

  <!-- GMF text -->
  <text x="400" y="395" text-anchor="middle" font-size="28" fill="#F5C53B" font-family="'Lato', sans-serif" font-weight="700" letter-spacing="2" opacity="0.95">Good Morning Frens</text>
  <text x="400" y="418" text-anchor="middle" font-size="11" fill="#E5A300" font-family="monospace" letter-spacing="4" opacity="0.7">WEB3 SOCIAL · NFT IDENTITY</text>
</svg>

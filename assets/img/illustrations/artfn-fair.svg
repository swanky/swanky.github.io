<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="gallery" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9f5ef"/>
      <stop offset="100%" stop-color="#ede8df"/>
    </linearGradient>
    <linearGradient id="frame1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d1b8e"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="frame2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="frame3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Gallery wall -->
  <rect width="800" height="450" fill="url(#gallery)"/>

  <!-- Floor line -->
  <rect x="0" y="360" width="800" height="90" fill="#e8e0d4"/>
  <line x1="0" y1="360" x2="800" y2="360" stroke="#c8b89a" stroke-width="2"/>

  <!-- Wall shadow/molding -->
  <rect x="0" y="0" width="800" height="12" fill="#c8b89a" opacity="0.4"/>
  <line x1="0" y1="50" x2="800" y2="50" stroke="#c8b89a" stroke-width="1" opacity="0.5"/>

  <!-- Picture rail line -->
  <line x1="0" y1="85" x2="800" y2="85" stroke="#b8a888" stroke-width="2" opacity="0.6"/>

  <!-- Hanging wire Left Frame -->
  <line x1="190" y1="86" x2="180" y2="110" stroke="#b8a888" stroke-width="1"/>
  <line x1="190" y1="86" x2="200" y2="110" stroke="#b8a888" stroke-width="1"/>

  <!-- Left Frame — abstract digital art -->
  <g transform="translate(100, 108)">
    <!-- Frame border gold -->
    <rect width="180" height="220" rx="2" fill="#E5A300"/>
    <rect x="8" y="8" width="164" height="204" rx="1" fill="url(#frame1)"/>
    <!-- Abstract pixel art inside -->
    <g opacity="0.9">
      <rect x="20" y="20" width="30" height="30" fill="#a855f7" rx="2"/>
      <rect x="54" y="20" width="30" height="30" fill="#7c3aed" rx="2"/>
      <rect x="88" y="20" width="30" height="30" fill="#4f46e5" rx="2"/>
      <rect x="122" y="20" width="22" height="30" fill="#818cf8" rx="2"/>
      <rect x="20" y="54" width="22" height="30" fill="#c084fc" rx="2"/>
      <rect x="46" y="54" width="38" height="62" fill="#7c3aed" rx="2"/>
      <rect x="88" y="54" width="56" height="30" fill="#6d28d9" rx="2"/>
      <rect x="20" y="88" width="22" height="30" fill="#a855f7" rx="2"/>
      <rect x="88" y="88" width="56" height="30" fill="#4f46e5" rx="2"/>
      <rect x="20" y="122" width="124" height="22" fill="#5b21b6" rx="2"/>
      <rect x="20" y="148" width="56" height="22" fill="#7c3aed" rx="2"/>
      <rect x="80" y="148" width="64" height="22" fill="#a855f7" rx="2"/>
      <!-- NFT tag -->
      <rect x="32" y="172" width="100" height="20" rx="10" fill="#E5A300"/>
      <text x="82" y="186" text-anchor="middle" font-size="9" fill="#1a0a2e" font-weight="bold" font-family="monospace">NFT #0042</text>
    </g>
    <!-- QR code suggestion -->
    <rect x="130" y="170" width="24" height="24" rx="2" fill="#F5C53B" opacity="0.3"/>
  </g>

  <!-- Hanging wire Center Frame -->
  <line x1="400" y1="86" x2="388" y2="108" stroke="#b8a888" stroke-width="1"/>
  <line x1="400" y1="86" x2="412" y2="108" stroke="#b8a888" stroke-width="1"/>

  <!-- Center Frame — main artwork, larger -->
  <g transform="translate(290, 105)">
    <rect width="220" height="240" rx="2" fill="#E5A300"/>
    <rect x="10" y="10" width="200" height="220" rx="1" fill="url(#frame2)"/>
    <!-- Generative art lines -->
    <g stroke="rgba(255,255,255,0.6)" stroke-width="1.5" fill="none">
      <path d="M 20 20 Q 100 60 180 20"/>
      <path d="M 20 50 Q 100 100 180 50"/>
      <path d="M 20 80 Q 60 30 100 110 Q 140 180 180 80"/>
      <path d="M 20 130 Q 100 70 180 130"/>
      <path d="M 20 170 Q 80 120 100 190 Q 120 210 180 170"/>
    </g>
    <!-- Circles -->
    <circle cx="100" cy="115" r="50" fill="none" stroke="#34d399" stroke-width="2" opacity="0.6"/>
    <circle cx="100" cy="115" r="30" fill="none" stroke="#0891b2" stroke-width="1.5" opacity="0.5"/>
    <circle cx="100" cy="115" r="14" fill="#34d399" opacity="0.4"/>
    <!-- NFT tag -->
    <rect x="40" y="190" width="120" height="20" rx="10" fill="#E5A300"/>
    <text x="100" y="204" text-anchor="middle" font-size="9" fill="#1a0a2e" font-weight="bold" font-family="monospace">NFT #0001 · 元宇宙展</text>
  </g>

  <!-- Hanging wire Right Frame -->
  <line x1="610" y1="86" x2="600" y2="108" stroke="#b8a888" stroke-width="1"/>
  <line x1="610" y1="86" x2="620" y2="108" stroke="#b8a888" stroke-width="1"/>

  <!-- Right Frame -->
  <g transform="translate(520, 115)">
    <rect width="180" height="200" rx="2" fill="#E5A300"/>
    <rect x="8" y="8" width="164" height="184" rx="1" fill="url(#frame3)"/>
    <!-- Geometric pattern -->
    <polygon points="82,25 140,75 120,145 44,145 24,75" fill="none" stroke="#fca5a5" stroke-width="2" opacity="0.7"/>
    <polygon points="82,45 120,80 106,130 58,130 44,80" fill="#ef4444" opacity="0.3"/>
    <circle cx="82" cy="85" r="28" fill="#dc2626" opacity="0.4"/>
    <circle cx="82" cy="85" r="14" fill="#fca5a5" opacity="0.5"/>
    <!-- NFT tag -->
    <rect x="28" y="155" width="108" height="18" rx="9" fill="#E5A300"/>
    <text x="82" y="168" text-anchor="middle" font-size="9" fill="#1a0a2e" font-weight="bold" font-family="monospace">NFT #0108</text>
  </g>

  <!-- Floor spotlights -->
  <ellipse cx="190" cy="362" rx="40" ry="8" fill="#E5A300" opacity="0.15"/>
  <ellipse cx="400" cy="362" rx="50" ry="8" fill="#E5A300" opacity="0.15"/>
  <ellipse cx="610" cy="362" rx="40" ry="8" fill="#E5A300" opacity="0.15"/>

  <!-- Label -->
  <rect x="260" y="378" width="280" height="38" rx="4" fill="white" opacity="0.7"/>
  <text x="400" y="396" text-anchor="middle" font-size="11" fill="#2d2926" font-family="'Lato', sans-serif" font-weight="700" letter-spacing="3">ArtfN fair</text>
  <text x="400" y="410" text-anchor="middle" font-size="9" fill="#8B5E00" font-family="'Lato', sans-serif" letter-spacing="2">台北藝術新銳博覽會 · NFT 數位藝術</text>
</svg>

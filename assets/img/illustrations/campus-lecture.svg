<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ee"/>
      <stop offset="100%" stop-color="#f0e8d8"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1c36"/>
      <stop offset="100%" stop-color="#1a2f52"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4a26e"/>
      <stop offset="100%" stop-color="#a8864e"/>
    </linearGradient>
  </defs>

  <!-- Background — lecture hall wall -->
  <rect width="800" height="450" fill="url(#wall)"/>

  <!-- Floor -->
  <rect x="0" y="360" width="800" height="90" fill="#e8dcc8"/>
  <line x1="0" y1="360" x2="800" y2="360" stroke="#c4a882" stroke-width="2"/>

  <!-- Stage platform -->
  <rect x="0" y="320" width="800" height="44" fill="#ddd0b8"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#c4a882" stroke-width="1.5"/>

  <!-- Projection screen -->
  <rect x="180" y="40" width="440" height="260" rx="3" fill="#e8e0d0"/>
  <rect x="184" y="44" width="432" height="252" rx="2" fill="url(#screen)"/>

  <!-- Screen border frame -->
  <rect x="178" y="38" width="444" height="266" rx="4" fill="none" stroke="#c4a882" stroke-width="3"/>

  <!-- Screen content: blockchain lecture slide -->
  <text x="400" y="88" text-anchor="middle" font-size="16" fill="rgba(255,255,255,0.9)" font-family="'Lato', sans-serif" font-weight="700" letter-spacing="1">區塊鏈技術導論</text>
  <line x1="220" y1="96" x2="580" y2="96" stroke="#E5A300" stroke-width="1.5"/>

  <!-- Slide diagram: simple blockchain -->
  <g transform="translate(210, 108)">
    <!-- Block 1 -->
    <rect x="0" y="8" width="70" height="44" rx="4" fill="rgba(229,163,0,0.2)" stroke="#E5A300" stroke-width="1.5"/>
    <text x="35" y="26" text-anchor="middle" font-size="8" fill="#E5A300" font-family="monospace">Block 1</text>
    <text x="35" y="38" text-anchor="middle" font-size="7" fill="rgba(255,255,255,0.6)" font-family="monospace">Hash: a1b2</text>
    <!-- Arrow -->
    <polygon points="74,28 86,30 74,32" fill="#E5A300"/>
    <!-- Block 2 -->
    <rect x="88" y="8" width="70" height="44" rx="4" fill="rgba(229,163,0,0.3)" stroke="#F5C53B" stroke-width="2"/>
    <text x="123" y="26" text-anchor="middle" font-size="8" fill="#F5C53B" font-family="monospace">Block 2</text>
    <text x="123" y="38" text-anchor="middle" font-size="7" fill="rgba(255,255,255,0.7)" font-family="monospace">Hash: c3d4</text>
    <!-- Arrow -->
    <polygon points="162,28 174,30 162,32" fill="#E5A300"/>
    <!-- Block 3 -->
    <rect x="176" y="8" width="70" height="44" rx="4" fill="rgba(229,163,0,0.2)" stroke="#E5A300" stroke-width="1.5"/>
    <text x="211" y="26" text-anchor="middle" font-size="8" fill="#E5A300" font-family="monospace">Block 3</text>
    <text x="211" y="38" text-anchor="middle" font-size="7" fill="rgba(255,255,255,0.6)" font-family="monospace">Hash: e5f6</text>
    <!-- Arrow -->
    <polygon points="250,28 262,30 250,32" fill="#E5A300"/>
    <!-- Block 4 -->
    <rect x="264" y="8" width="70" height="44" rx="4" fill="rgba(229,163,0,0.2)" stroke="#E5A300" stroke-width="1.5"/>
    <text x="299" y="26" text-anchor="middle" font-size="8" fill="#E5A300" font-family="monospace">Block N</text>
    <text x="299" y="38" text-anchor="middle" font-size="7" fill="rgba(255,255,255,0.6)" font-family="monospace">Hash: g7h8</text>
  </g>

  <!-- Bullet points on slide -->
  <g transform="translate(210, 180)">
    <circle cx="8" cy="6" r="3" fill="#E5A300"/>
    <text x="20" y="10" font-size="11" fill="rgba(255,255,255,0.8)" font-family="'Lato', sans-serif">去中心化共識機制</text>
    <circle cx="8" cy="28" r="3" fill="#E5A300"/>
    <text x="20" y="32" font-size="11" fill="rgba(255,255,255,0.8)" font-family="'Lato', sans-serif">智能合約應用</text>
    <circle cx="8" cy="50" r="3" fill="#E5A300"/>
    <text x="20" y="54" font-size="11" fill="rgba(255,255,255,0.8)" font-family="'Lato', sans-serif">NFT 與 DeFi 生態</text>
  </g>

  <!-- Slide footer -->
  <rect x="184" y="268" width="432" height="28" rx="0" fill="rgba(229,163,0,0.1)"/>
  <text x="400" y="285" text-anchor="middle" font-size="9" fill="#E5A300" font-family="monospace" letter-spacing="2">BLOCKCHAIN CAMPUS LECTURE SERIES</text>

  <!-- Projector beam -->
  <polygon points="400,36 340,300 460,300" fill="rgba(255,255,255,0.03)"/>

  <!-- Projector device top center -->
  <rect x="370" y="10" width="60" height="28" rx="4" fill="#444"/>
  <rect x="374" y="14" width="52" height="20" rx="2" fill="#333"/>
  <circle cx="400" cy="24" r="7" fill="#222" stroke="#555" stroke-width="1"/>
  <circle cx="400" cy="24" r="4" fill="#1a1a2e" opacity="0.8"/>

  <!-- Lecturer silhouette -->
  <!-- Body -->
  <ellipse cx="130" cy="290" rx="22" ry="30" fill="#2d2926"/>
  <!-- Head -->
  <circle cx="130" cy="250" r="16" fill="#2d2926"/>
  <!-- Pointing arm -->
  <line x1="148" y1="278" x2="184" y2="258" stroke="#2d2926" stroke-width="8" stroke-linecap="round"/>
  <!-- Laser pointer dot -->
  <circle cx="186" cy="257" r="3" fill="#E5A300"/>

  <!-- Audience rows — silhouettes -->
  <!-- Row 1 (closest) -->
  <g fill="#4a3f34" opacity="0.5">
    <ellipse cx="300" cy="350" rx="14" ry="8"/>
    <circle cx="300" cy="336" r="9"/>
    <ellipse cx="370" cy="350" rx="14" ry="8"/>
    <circle cx="370" cy="336" r="9"/>
    <ellipse cx="440" cy="350" rx="14" ry="8"/>
    <circle cx="440" cy="336" r="9"/>
    <ellipse cx="510" cy="350" rx="14" ry="8"/>
    <circle cx="510" cy="336" r="9"/>
    <ellipse cx="580" cy="350" rx="14" ry="8"/>
    <circle cx="580" cy="336" r="9"/>
    <ellipse cx="650" cy="350" rx="14" ry="8"/>
    <circle cx="650" cy="336" r="9"/>
    <ellipse cx="720" cy="350" rx="14" ry="8"/>
    <circle cx="720" cy="336" r="9"/>
  </g>

  <!-- Row 2 (farther, smaller) -->
  <g fill="#4a3f34" opacity="0.3">
    <ellipse cx="330" cy="395" rx="11" ry="6"/>
    <circle cx="330" cy="384" r="7"/>
    <ellipse cx="390" cy="395" rx="11" ry="6"/>
    <circle cx="390" cy="384" r="7"/>
    <ellipse cx="450" cy="395" rx="11" ry="6"/>
    <circle cx="450" cy="384" r="7"/>
    <ellipse cx="510" cy="395" rx="11" ry="6"/>
    <circle cx="510" cy="384" r="7"/>
    <ellipse cx="570" cy="395" rx="11" ry="6"/>
    <circle cx="570" cy="384" r="7"/>
    <ellipse cx="630" cy="395" rx="11" ry="6"/>
    <circle cx="630" cy="384" r="7"/>
    <ellipse cx="690" cy="395" rx="11" ry="6"/>
    <circle cx="690" cy="384" r="7"/>
  </g>

  <!-- University name label -->
  <rect x="10" y="376" width="200" height="38" rx="4" fill="rgba(229,163,0,0.12)"/>
  <text x="110" y="393" text-anchor="middle" font-size="9" fill="#8B5E00" font-family="'Lato', sans-serif" font-weight="700" letter-spacing="1">校園巡迴講座</text>
  <text x="110" y="408" text-anchor="middle" font-size="8" fill="#8B5E00" font-family="'Lato', sans-serif">銘傳・實踐・元智・台北市大</text>
</svg>

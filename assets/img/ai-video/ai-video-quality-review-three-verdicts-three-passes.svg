<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">完整看三遍，再下結論</title>
  <desc id="d">三遍看片：第一遍當觀眾，從頭看到尾不暫停；第二遍對著檢查清單逐條打勾，在手部、嘴型、剪接點暫停；第三遍用手機小螢幕再看一遍。三遍看完才逐條下結論。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1200" height="660" fill="#FFFFFF"/>
  <text x="48" y="80" font-size="48" font-weight="700" fill="#1F2937">完整看三遍，再下結論</text>
  <text x="48" y="126" font-size="26" fill="#4B5563">每一遍換一種眼睛看</text>
  <rect x="48" y="168" width="340" height="380" rx="24" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
  <circle cx="90" cy="212" r="24" fill="#2C5B8F"/>
  <text x="90" y="222.08" font-size="28" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <g transform="translate(218 290) scale(1.15)"><rect x="-56" y="-40" width="112" height="72" rx="8" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="5"/><rect x="-8" y="32" width="16" height="12" fill="#2C5B8F"/><rect x="-30" y="44" width="60" height="8" rx="4" fill="#2C5B8F"/><path d="M-12,-18 L16,-4 L-12,10 z" fill="#2C5B8F"/></g>
  <text x="218" y="410" font-size="34" font-weight="700" text-anchor="middle" fill="#2C5B8F">當觀眾</text>
  <text x="218" y="460" font-size="26" text-anchor="middle" fill="#4B5563">從頭看到尾，</text>
  <text x="218" y="498" font-size="26" text-anchor="middle" fill="#4B5563">不暫停</text>
  <line x1="392" y1="358" x2="426" y2="358" stroke="#374151" stroke-width="4" stroke-linecap="butt" marker-end="url(#arr)"/>
  <rect x="430" y="168" width="340" height="380" rx="24" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
  <circle cx="472" cy="212" r="24" fill="#2C5B8F"/>
  <text x="472" y="222.08" font-size="28" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <g transform="translate(600 290) scale(1.15)"><rect x="-56" y="-40" width="112" height="72" rx="8" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="5"/><rect x="-8" y="32" width="16" height="12" fill="#2C5B8F"/><rect x="-30" y="44" width="60" height="8" rx="4" fill="#2C5B8F"/><rect x="-14" y="-20" width="9" height="30" rx="2" fill="#2C5B8F"/><rect x="5" y="-20" width="9" height="30" rx="2" fill="#2C5B8F"/></g>
  <text x="600" y="410" font-size="34" font-weight="700" text-anchor="middle" fill="#2C5B8F">對清單</text>
  <text x="600" y="460" font-size="26" text-anchor="middle" fill="#4B5563">逐條打勾；在手部、</text>
  <text x="600" y="498" font-size="26" text-anchor="middle" fill="#4B5563">嘴型、剪接點暫停</text>
  <line x1="774" y1="358" x2="808" y2="358" stroke="#374151" stroke-width="4" stroke-linecap="butt" marker-end="url(#arr)"/>
  <rect x="812" y="168" width="340" height="380" rx="24" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
  <circle cx="854" cy="212" r="24" fill="#2C5B8F"/>
  <text x="854" y="222.08" font-size="28" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <g transform="translate(982 290) scale(1.15)"><rect x="-28" y="-50" width="56" height="100" rx="10" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="5"/><rect x="-18" y="-36" width="36" height="62" rx="3" fill="#2C5B8F" opacity="0.18"/><circle cy="38" r="5" fill="#2C5B8F"/></g>
  <text x="982" y="410" font-size="34" font-weight="700" text-anchor="middle" fill="#2C5B8F">用手機</text>
  <text x="982" y="460" font-size="26" text-anchor="middle" fill="#4B5563">換成小螢幕，</text>
  <text x="982" y="498" font-size="26" text-anchor="middle" fill="#4B5563">再看一遍</text>
  <rect x="48" y="572" width="1104" height="72" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="600.0" y="618.8" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937">三遍都看完，<tspan fill="#8A5D00">才逐條下結論</tspan></text>
</svg>

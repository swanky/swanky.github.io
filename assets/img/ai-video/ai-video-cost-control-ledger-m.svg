  <text x="454.0" y="889.92" font-size="22" font-weight="700" text-anchor="middle" fill="#64748B">設備</text>
  <rect x="60.0" y="913.0" width="358.0" height="38" rx="19.0" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text x="239.0" y="939.92" font-size="22" font-weight="700" text-anchor="middle" fill="#64748B">剪接、混音、品質檢查：自己電腦</text>

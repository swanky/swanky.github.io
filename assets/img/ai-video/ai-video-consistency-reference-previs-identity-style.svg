<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">「一致」其實是兩件事</title>
  <desc id="d">左邊是身分，不能變，只認官方原圖：臉型、眼睛、髮型、膚質或材質、招牌配件、身形與頭身比。右邊是風格，可以每張不同：服裝變體、光線、媒材、色調、場景、姿勢、鏡頭、情緒，衍生圖只能管這邊。下方示意：拿衍生圖當身分參考，每傳一手走樣一點，最後變成另一個人。兩者衝突時以官方原圖為準，不取平均。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1200" height="900" fill="#FFFFFF"/>
  <text x="48" y="80" font-size="48" font-weight="700" fill="#1F2937">「一致」其實是兩件事</text>
  <text x="48" y="126" font-size="26" fill="#4B5563">身分只認官方原圖；風格每張都可以不同</text>
  <rect x="48" y="168" width="532" height="300" rx="24" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
  <g transform="translate(110 232) scale(0.6)"><path d="M-24,-6 L-24,-28 A24,24 0 0 1 24,-28 L24,-6" fill="none" stroke="#2C5B8F" stroke-width="8"/><rect x="-38" y="-8" width="76" height="58" rx="10" fill="#2C5B8F"/><circle cy="16" r="8" fill="#FFFFFF"/><rect x="-3" y="18" width="6" height="16" fill="#FFFFFF"/></g>
  <text x="160" y="226" font-size="34" font-weight="700" fill="#2C5B8F">身分：不能變</text>
  <text x="160" y="266" font-size="24" fill="#4B5563">只認官方原圖</text>
  <rect x="80.0" y="307.0" width="72.0" height="38" rx="19.0" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="2"/>
  <text x="116.0" y="333.92" font-size="22" font-weight="700" text-anchor="middle" fill="#2C5B8F">臉型</text>
  <rect x="162.0" y="307.0" width="72.0" height="38" rx="19.0" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="2"/>
  <text x="198.0" y="333.92" font-size="22" font-weight="700" text-anchor="middle" fill="#2C5B8F">眼睛</text>
  <rect x="244.0" y="307.0" width="72.0" height="38" rx="19.0" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="2"/>
  <text x="280.0" y="333.92" font-size="22" font-weight="700" text-anchor="middle" fill="#2C5B8F">髮型</text>
  <rect x="80.0" y="357.0" width="138.0" height="38" rx="19.0" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="2"/>
  <text x="149.0" y="383.92" font-size="22" font-weight="700" text-anchor="middle" fill="#2C5B8F">膚質或材質</text>
  <rect x="228.0" y="357.0" width="116.0" height="38" rx="19.0" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="2"/>
  <text x="286.0" y="383.92" font-size="22" font-weight="700" text-anchor="middle" fill="#2C5B8F">招牌配件</text>
  <rect x="80.0" y="407.0" width="160.0" height="38" rx="19.0" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="2"/>
  <text x="160.0" y="433.92" font-size="22" font-weight="700" text-anchor="middle" fill="#2C5B8F">身形與頭身比</text>
  <rect x="620" y="168" width="532" height="300" rx="24" fill="#FDF3E7" stroke="#B45309" stroke-width="3"/>
  <g transform="translate(684 232) scale(0.6)"><line x1="-46" y1="-30" x2="46" y2="-30" stroke="#B45309" stroke-width="5" stroke-linecap="round"/><circle cx="-18" cy="-30" r="10" fill="#FFFFFF" stroke="#B45309" stroke-width="5"/><line x1="-46" y1="0" x2="46" y2="0" stroke="#B45309" stroke-width="5" stroke-linecap="round"/><circle cx="20" cy="0" r="10" fill="#FFFFFF" stroke="#B45309" stroke-width="5"/><line x1="-46" y1="30" x2="46" y2="30" stroke="#B45309" stroke-width="5" stroke-linecap="round"/><circle cx="-4" cy="30" r="10" fill="#FFFFFF" stroke="#B45309" stroke-width="5"/></g>
  <text x="734" y="226" font-size="34" font-weight="700" fill="#B45309">風格：可以變</text>
  <text x="734" y="266" font-size="24" fill="#4B5563">衍生圖只能管這一邊</text>
  <rect x="652.0" y="307.0" width="116.0" height="38" rx="19.0" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
  <text x="710.0" y="333.92" font-size="22" font-weight="700" text-anchor="middle" fill="#B45309">服裝變體</text>
  <rect x="778.0" y="307.0" width="72.0" height="38" rx="19.0" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
  <text x="814.0" y="333.92" font-size="22" font-weight="700" text-anchor="middle" fill="#B45309">光線</text>
  <rect x="860.0" y="307.0" width="72.0" height="38" rx="19.0" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
  <text x="896.0" y="333.92" font-size="22" font-weight="700" text-anchor="middle" fill="#B45309">媒材</text>
  <rect x="942.0" y="307.0" width="72.0" height="38" rx="19.0" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
  <text x="978.0" y="333.92" font-size="22" font-weight="700" text-anchor="middle" fill="#B45309">色調</text>
  <rect x="652.0" y="357.0" width="72.0" height="38" rx="19.0" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
  <text x="688.0" y="383.92" font-size="22" font-weight="700" text-anchor="middle" fill="#B45309">場景</text>
  <rect x="734.0" y="357.0" width="72.0" height="38" rx="19.0" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
  <text x="770.0" y="383.92" font-size="22" font-weight="700" text-anchor="middle" fill="#B45309">姿勢</text>
  <rect x="816.0" y="357.0" width="72.0" height="38" rx="19.0" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
  <text x="852.0" y="383.92" font-size="22" font-weight="700" text-anchor="middle" fill="#B45309">鏡頭</text>
  <rect x="898.0" y="357.0" width="72.0" height="38" rx="19.0" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
  <text x="934.0" y="383.92" font-size="22" font-weight="700" text-anchor="middle" fill="#B45309">情緒</text>
  <text x="48" y="528" font-size="28" font-weight="700" fill="#B91C1C">拿衍生圖當身分參考（示意）：每傳一手，走樣一點</text>

  <text x="156" y="786" font-size="26" font-weight="700" text-anchor="middle" fill="#2C5B8F">官方原圖</text>
  <line x1="270" y1="650" x2="330" y2="650" stroke="#374151" stroke-width="4" stroke-linecap="butt" marker-end="url(#arr)"/>
  <rect x="336" y="552" width="216" height="196" rx="18" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  <path d="M381.6,714.0 C383.2,669.2 412.0,658.0 444,658.0 C476.0,658.0 504.8,669.2 506.4,714.0 z" fill="#CBD5E1" stroke="#64748B" stroke-width="3"/>
  <ellipse cx="444" cy="618" rx="36.800000000000004" ry="32.0" fill="#E2E8F0" stroke="#64748B" stroke-width="3"/>
  <path d="M402.4,632.4 C399.2,574.8 488.8,574.8 485.6,632.4 L476.0,613.2 C458.72,600.4 429.28,600.4 412.0,613.2 z" fill="#64748B"/>
  <circle cx="415.2" cy="683.6" r="7.2" fill="#E5A300" stroke="#FFFFFF" stroke-width="2"/>
  <text x="444" y="786" font-size="26" font-weight="700" text-anchor="middle" fill="#64748B">衍生圖</text>
  <line x1="558" y1="650" x2="618" y2="650" stroke="#374151" stroke-width="4" stroke-linecap="butt" marker-end="url(#arr)"/>

  <text x="1020" y="786" font-size="26" font-weight="700" text-anchor="middle" fill="#B91C1C">另一個人</text>
  <g transform="translate(1108 566) scale(0.38)"><circle r="46" fill="#B91C1C"/><path d="M-17.48,-17.48 L17.48,17.48 M17.48,-17.48 L-17.48,17.48" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/></g>
  <rect x="48" y="812" width="1104" height="70" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="600.0" y="857.8" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937">兩者衝突時，<tspan fill="#8A5D00">以官方原圖為準</tspan>，不取平均</text>
</svg>

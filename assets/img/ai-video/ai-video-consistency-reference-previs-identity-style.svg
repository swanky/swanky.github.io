  <text x="732" y="786" font-size="26" font-weight="700" text-anchor="middle" fill="#64748B">再傳一手</text>
  <line x1="846" y1="650" x2="906" y2="650" stroke="#374151" stroke-width="4" stroke-linecap="butt" marker-end="url(#arr)"/>
  <rect x="912" y="552" width="216" height="196" rx="18" fill="#F8FAFC" stroke="#B91C1C" stroke-width="4"/>

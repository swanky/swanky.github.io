<title id="t">提示詞說在 3.5 秒切，片子沒有</title>
<desc id="d">同一支約 15 秒的參考影片，0 秒在左、15.1 秒在右。提示詞要求在 3.5 秒、7.5 秒、11.0 秒切換鏡頭；實際量到的切點在 2.29 秒、5.25 秒、9.83 秒，差距分別是 1.21 秒、2.25 秒、1.17 秒。三處差距不一樣，代表不是片頭被裁掉，而是模型沒照時間碼切。換機位、燈光由暖轉冷這類畫面指令倒是照做了。</desc>

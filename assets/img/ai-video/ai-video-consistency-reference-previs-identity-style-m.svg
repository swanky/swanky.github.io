    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="600" height="1460" fill="#FFFFFF"/>
  <text x="40" y="70" font-size="40" font-weight="700" fill="#1F2937">「一致」其實是兩件事</text>
  <text x="40" y="116" font-size="24" fill="#4B5563">身分只認官方原圖；</text>
  <text x="40" y="150" font-size="24" fill="#4B5563">風格每張都可以不同</text>
  <rect x="40" y="186" width="520" height="300" rx="24" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>

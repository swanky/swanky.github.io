  <text x="266.0" y="351.92" font-size="22" font-weight="700" text-anchor="middle" fill="#2C5B8F">髮型</text>
  <rect x="66.0" y="375.0" width="138.0" height="38" rx="19.0" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="2"/>
  <text x="135.0" y="401.92" font-size="22" font-weight="700" text-anchor="middle" fill="#2C5B8F">膚質或材質</text>
  <rect x="214.0" y="375.0" width="116.0" height="38" rx="19.0" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="2"/>
  <text x="272.0" y="401.92" font-size="22" font-weight="700" text-anchor="middle" fill="#2C5B8F">招牌配件</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1460" width="600" height="1460" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">「一致」其實是兩件事</title>
  <desc id="d">身分不能變、只認官方原圖；風格可以每張不同、衍生圖只能管風格。拿衍生圖當身分參考，每傳一手走樣一點，最後變成另一個人。</desc>

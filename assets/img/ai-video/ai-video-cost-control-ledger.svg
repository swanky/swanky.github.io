  <title id="t">我的帳本：前後實付約 US$125</title>
  <desc id="d">供應商回報的實付金額：賽前彩排 64.11 美元，內容是小型試跑、模型比較、30 秒概念預告、三首 AI 配樂、兩支雙風格短片；正式比賽 60.82 美元，現場限時賽，最後入圍決賽八強。合計 124.93 美元。沒算進去的有：圖片生成用既有訂閱額度、剪接混音與品質檢查在自己電腦上完成、我的時間與設備。</desc>

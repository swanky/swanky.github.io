  <text x="306" y="538" text-anchor="middle" font-size="30" font-weight="700" fill="#2C5B8F">前景跑得比背景快</text>
  <rect x="636" y="168" width="516" height="400" rx="24" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
  <text x="666" y="220" font-size="34" font-weight="700" fill="#64748B">變焦</text>
  <text x="758.08" y="218" font-size="26" fill="#4B5563">攝影機不動，鏡頭放大</text>
  <g transform="translate(706,272) scale(0.5)"><rect x="-46" y="-28" width="76" height="56" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="5"/><circle cx="-8" cy="0" r="15" fill="none" stroke="#64748B" stroke-width="5"/><path d="M30,-14 L52,-26 L52,26 L30,14 z" fill="#64748B"/><rect x="-36" y="-40" width="26" height="12" rx="3" fill="#64748B"/></g>

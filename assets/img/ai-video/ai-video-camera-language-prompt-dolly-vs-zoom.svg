  <rect x="666" y="318" width="203" height="125.86" rx="8" fill="none" stroke="#64748B" stroke-width="3"/>
  <line x1="877" y1="380.93" x2="913" y2="380.93" stroke="#374151" stroke-width="4" marker-end="url(#arr)"/>

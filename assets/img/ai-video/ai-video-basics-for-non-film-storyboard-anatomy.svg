  <title id="t">一格分鏡，回答七件事</title>
  <desc id="d">一格分鏡的解剖圖（示意，非實際委託）：中間是示意畫面，四周標出七件事：第 3 鏡、成片用 4 秒、中近景平視、她放下手機並抬眼、攝影機固定、觀眾聽到雨聲和手機落桌、用途是讓觀眾知道她做了決定。用 AI 生成時再加參考圖、一致性規則、製作方式、驗收條件與備案；驗收條件在生成之前就寫好。</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 982" width="600" height="982" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">量尺，不是評審</title>
<desc id="d">上層：鏡頭表資料一致，拉片工具量得到也檢查得了，包括時間軸連續、秒數加總正確、描述夠具體、運鏡有畫面證據，全部通過就打勾。下層：影片品質合格，它證明不了，包括手有沒有崩、角色有沒有走樣、聲音和畫面有沒有對上、好不好看，標問號，仍要人看。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5A300"/></marker></defs>
<rect width="600" height="982" fill="#FFFFFF"/>
<text x="40" y="72" font-size="42" font-weight="700" fill="#1F2937">量尺，不是評審</text>
<text x="40" y="114" font-size="24" fill="#4B5563">全部通過，不等於片子好看</text>
<rect x="40" y="146" width="520" height="290" rx="22" fill="#E6F4F1" stroke="#0E7568" stroke-width="3"/>
<g transform="translate(96,202) scale(0.7)"><circle cx="0" cy="0" r="40" fill="#FFFFFF" stroke="#0E7568" stroke-width="5"/><polyline points="-18,0 -4,15 20,-14" fill="none" stroke="#0E7568" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="146" y="198" font-size="32" font-weight="700" fill="#0E7568">鏡頭表資料一致</text>
<text x="146" y="234" font-size="22" fill="#4B5563">量得到、檢查得了</text>
<rect x="103" y="274" width="134" height="44" rx="22" fill="#FFFFFF" stroke="#0E7568" stroke-width="2"/><text x="170" y="304" text-anchor="middle" font-size="22" font-weight="700" fill="#0E7568">時間軸連續</text>
<rect x="352" y="274" width="156" height="44" rx="22" fill="#FFFFFF" stroke="#0E7568" stroke-width="2"/><text x="430" y="304" text-anchor="middle" font-size="22" font-weight="700" fill="#0E7568">秒數加總正確</text>
<rect x="103" y="338" width="134" height="44" rx="22" fill="#FFFFFF" stroke="#0E7568" stroke-width="2"/><text x="170" y="368" text-anchor="middle" font-size="22" font-weight="700" fill="#0E7568">描述夠具體</text>
<rect x="341" y="338" width="178" height="44" rx="22" fill="#FFFFFF" stroke="#0E7568" stroke-width="2"/><text x="430" y="368" text-anchor="middle" font-size="22" font-weight="700" fill="#0E7568">運鏡有畫面證據</text>
<line x1="40" y1="476" x2="560" y2="476" stroke="#94A3B8" stroke-width="3" stroke-dasharray="12 8"/>
<rect x="120" y="454" width="360" height="44" rx="22" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<g transform="translate(166,476) scale(0.42)"><rect x="-50" y="-18" width="100" height="36" rx="5" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="4"/><line x1="-40" y1="-18" x2="-40" y2="-4" stroke="#2C5B8F" stroke-width="3"/><line x1="-30" y1="-18" x2="-30" y2="-10" stroke="#2C5B8F" stroke-width="3"/><line x1="-20" y1="-18" x2="-20" y2="-4" stroke="#2C5B8F" stroke-width="3"/><line x1="-10" y1="-18" x2="-10" y2="-10" stroke="#2C5B8F" stroke-width="3"/><line x1="0" y1="-18" x2="0" y2="-4" stroke="#2C5B8F" stroke-width="3"/><line x1="10" y1="-18" x2="10" y2="-10" stroke="#2C5B8F" stroke-width="3"/><line x1="20" y1="-18" x2="20" y2="-4" stroke="#2C5B8F" stroke-width="3"/><line x1="30" y1="-18" x2="30" y2="-10" stroke="#2C5B8F" stroke-width="3"/><line x1="40" y1="-18" x2="40" y2="-4" stroke="#2C5B8F" stroke-width="3"/></g>
<text x="316" y="485" font-size="24" font-weight="700" text-anchor="middle" fill="#1F2937">量尺只量到這條線</text>
<rect x="40" y="516" width="520" height="290" rx="22" fill="#F1F5F9" stroke="#64748B" stroke-width="3" stroke-dasharray="10 8"/>
<g transform="translate(96,572) scale(0.7)"><circle cx="0" cy="0" r="40" fill="#FFFFFF" stroke="#B91C1C" stroke-width="5"/><text x="0" y="18" text-anchor="middle" font-size="52" font-weight="700" fill="#B91C1C">?</text></g>
<text x="146" y="568" font-size="32" font-weight="700" fill="#B91C1C">影片品質合格</text>
<text x="146" y="604" font-size="22" fill="#4B5563">它證明不了，要人看</text>
<rect x="103" y="644" width="134" height="44" rx="22" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2"/><text x="170" y="674" text-anchor="middle" font-size="22" font-weight="700" fill="#B91C1C">手有沒有崩</text>
<rect x="341" y="644" width="178" height="44" rx="22" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2"/><text x="430" y="674" text-anchor="middle" font-size="22" font-weight="700" fill="#B91C1C">角色有沒有走樣</text>
<rect x="81" y="708" width="178" height="44" rx="22" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2"/><text x="170" y="738" text-anchor="middle" font-size="22" font-weight="700" fill="#B91C1C">聲畫有沒有對上</text>
<rect x="374" y="708" width="112" height="44" rx="22" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2"/><text x="430" y="738" text-anchor="middle" font-size="22" font-weight="700" fill="#B91C1C">好不好看</text>
<rect x="40" y="830" width="520" height="116" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/><text x="300.0" y="880" font-size="26" font-weight="700" text-anchor="middle"><tspan fill="#1F2937">拉片結果不能取代人看片：</tspan></text><text x="300.0" y="915" font-size="26" font-weight="700" text-anchor="middle"><tspan fill="#8A5D00">品質仍要人判定</tspan></text>
</svg>

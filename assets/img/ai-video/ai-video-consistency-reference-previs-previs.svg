<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">白模預演：花錢之前，先排空間</title>
  <desc id="d">用沒有貼圖的簡單方塊，在花錢之前先排空間。四步：定這一鏡要交代什麼；排出場景大小、角色站位與走位；排攝影機路徑，確認繞一圈還看得到主角；輸出小尺寸快速預覽檢查時長。交給影片模型時，白模只管空間、時間和機位；角色長相和美術交給參考圖。修的時候先修站位與碰撞，再修構圖與時間。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1200" height="820" fill="#FFFFFF"/>
  <text x="48" y="80" font-size="48" font-weight="700" fill="#1F2937">白模預演：花錢之前，先排空間</text>
  <text x="48" y="126" font-size="26" fill="#4B5563">用沒有貼圖的簡單方塊，排出站位與攝影機路徑</text>
  <rect x="48" y="168" width="258" height="300" rx="24" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
  <circle cx="86" cy="206" r="24" fill="#2C5B8F"/>
  <text x="86" y="216.08" font-size="28" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <g transform="translate(177 272) scale(0.95)"><rect x="-38" y="-46" width="76" height="98" rx="9" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="5"/><rect x="-20" y="-56" width="40" height="20" rx="5" fill="#2C5B8F"/><line x1="-22" y1="-14" x2="24" y2="-14" stroke="#2C5B8F" stroke-width="5" stroke-linecap="round"/><line x1="-22" y1="6" x2="24" y2="6" stroke="#2C5B8F" stroke-width="5" stroke-linecap="round"/><line x1="-22" y1="26" x2="24" y2="26" stroke="#2C5B8F" stroke-width="5" stroke-linecap="round"/></g>
  <text x="177" y="376" font-size="30" font-weight="700" text-anchor="middle" fill="#2C5B8F">定任務</text>
  <text x="177" y="414" font-size="22" text-anchor="middle" fill="#4B5563">這一鏡要</text>
  <text x="177" y="446" font-size="22" text-anchor="middle" fill="#4B5563">交代什麼</text>
  <line x1="308" y1="318" x2="326" y2="318" stroke="#374151" stroke-width="4" stroke-linecap="butt" marker-end="url(#arr)"/>
  <rect x="330" y="168" width="258" height="300" rx="24" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
  <circle cx="368" cy="206" r="24" fill="#2C5B8F"/>
  <text x="368" y="216.08" font-size="28" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <g transform="translate(459 272) scale(0.95)"><rect x="-60" y="-50" width="120" height="100" rx="6" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="4"/><rect x="-46" y="-36" width="26" height="26" fill="#CBD5E1" stroke="#2C5B8F" stroke-width="2"/><rect x="18" y="-38" width="30" height="20" fill="#CBD5E1" stroke="#2C5B8F" stroke-width="2"/><circle cx="-20" cy="24" r="9" fill="#2C5B8F"/><circle cx="28" cy="16" r="9" fill="#2C5B8F"/><path d="M-40,38 C-10,46 10,0 40,-6" fill="none" stroke="#E5A300" stroke-width="4" stroke-dasharray="6 5"/></g>
  <text x="459" y="376" font-size="30" font-weight="700" text-anchor="middle" fill="#2C5B8F">排空間與動線</text>
  <text x="459" y="414" font-size="22" text-anchor="middle" fill="#4B5563">排出場景大小、</text>
  <text x="459" y="446" font-size="22" text-anchor="middle" fill="#4B5563">站位和走位</text>
  <line x1="590" y1="318" x2="608" y2="318" stroke="#374151" stroke-width="4" stroke-linecap="butt" marker-end="url(#arr)"/>
  <rect x="612" y="168" width="258" height="300" rx="24" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
  <circle cx="650" cy="206" r="24" fill="#2C5B8F"/>
  <text x="650" y="216.08" font-size="28" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <g transform="translate(741 272) scale(0.95)"><ellipse rx="58" ry="34" fill="none" stroke="#2C5B8F" stroke-width="3" stroke-dasharray="7 6"/><rect x="-14" y="-14" width="28" height="28" fill="#CBD5E1" stroke="#2C5B8F" stroke-width="3"/><g transform="translate(46 -30) scale(0.42)"><rect x="-50" y="-30" width="70" height="56" rx="8" fill="#E5A300"/><path d="M20,-14 L48,-30 L48,26 L20,10 z" fill="#E5A300"/><circle cx="-15" cy="-2" r="14" fill="#FFFFFF"/><circle cx="-15" cy="-2" r="6" fill="#E5A300"/></g></g>
  <text x="741" y="376" font-size="30" font-weight="700" text-anchor="middle" fill="#2C5B8F">排攝影機路徑</text>
  <text x="741" y="414" font-size="22" text-anchor="middle" fill="#4B5563">繞一圈還看得到</text>
  <text x="741" y="446" font-size="22" text-anchor="middle" fill="#4B5563">主角嗎</text>
  <line x1="872" y1="318" x2="890" y2="318" stroke="#374151" stroke-width="4" stroke-linecap="butt" marker-end="url(#arr)"/>
  <rect x="894" y="168" width="258" height="300" rx="24" fill="#E6F4F1" stroke="#0E7568" stroke-width="3"/>
  <circle cx="932" cy="206" r="24" fill="#0E7568"/>
  <text x="932" y="216.08" font-size="28" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <g transform="translate(1023 272) scale(0.95)"><rect x="-54" y="-48" width="108" height="96" rx="8" fill="#0E7568"/><rect x="-44" y="-40" width="10" height="8" rx="2" fill="#FFFFFF"/><rect x="-44" y="32" width="10" height="8" rx="2" fill="#FFFFFF"/><rect x="-24" y="-40" width="10" height="8" rx="2" fill="#FFFFFF"/><rect x="-24" y="32" width="10" height="8" rx="2" fill="#FFFFFF"/><rect x="-4" y="-40" width="10" height="8" rx="2" fill="#FFFFFF"/><rect x="-4" y="32" width="10" height="8" rx="2" fill="#FFFFFF"/><rect x="16" y="-40" width="10" height="8" rx="2" fill="#FFFFFF"/><rect x="16" y="32" width="10" height="8" rx="2" fill="#FFFFFF"/><rect x="36" y="-40" width="10" height="8" rx="2" fill="#FFFFFF"/><rect x="36" y="32" width="10" height="8" rx="2" fill="#FFFFFF"/><rect x="-38" y="-24" width="76" height="48" rx="4" fill="#FFFFFF"/><path d="M-8,-14 L14,0 L-8,14 z" fill="#0E7568"/></g>
  <text x="1023" y="376" font-size="30" font-weight="700" text-anchor="middle" fill="#0E7568">快速預覽</text>
  <text x="1023" y="414" font-size="22" text-anchor="middle" fill="#4B5563">輸出小尺寸預覽，</text>
  <text x="1023" y="446" font-size="22" text-anchor="middle" fill="#4B5563">檢查時長</text>
  <rect x="48" y="500" width="532" height="190" rx="24" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
  <g transform="translate(120 586) scale(0.95)"><rect x="-46" y="-6" width="40" height="40" rx="3" fill="#E5E7EB" stroke="#64748B" stroke-width="4"/><rect x="4" y="-6" width="40" height="40" rx="3" fill="#E5E7EB" stroke="#64748B" stroke-width="4"/><rect x="-22" y="-48" width="40" height="40" rx="3" fill="#D1D5DB" stroke="#64748B" stroke-width="4"/></g>
  <text x="196" y="560" font-size="30" font-weight="700" fill="#64748B">白模只管</text>
  <text x="196" y="604" font-size="26" fill="#1F2937">空間、時間和機位</text>
  <text x="196" y="644" font-size="22" fill="#4B5563">格線、灰色材質不當風格</text>
  <circle cx="600" cy="595" r="40" fill="#1F2937" stroke="#FFFFFF" stroke-width="6"/>
  <text x="600" y="606" font-size="30" font-weight="700" text-anchor="middle" fill="#FFFFFF">VS</text>
  <rect x="620" y="500" width="532" height="190" rx="24" fill="#FDF3E7" stroke="#B45309" stroke-width="3"/>
  <path d="M657.1,628.0 C658.2,597.2 678.0,589.5 700,589.5 C722.0,589.5 741.8,597.2 742.9,628.0 z" fill="#FDE7CC" stroke="#B45309" stroke-width="3"/>
  <ellipse cx="700" cy="562" rx="22.0" ry="22.0" fill="#E2E8F0" stroke="#B45309" stroke-width="3"/>
  <path d="M674.7,571.9 C672.5,532.3 727.5,532.3 725.3,571.9 L718.7,558.7 C708.8,549.9 691.2,549.9 681.3,558.7 z" fill="#B45309"/>
  <circle cx="680.2" cy="607.1" r="4.95" fill="#E5A300" stroke="#FFFFFF" stroke-width="2"/>
  <text x="770" y="560" font-size="30" font-weight="700" fill="#B45309">參考圖負責</text>
  <text x="770" y="604" font-size="26" fill="#1F2937">角色長相與美術</text>
  <text x="770" y="644" font-size="22" fill="#4B5563">外觀圖決定角色長什麼樣</text>
  <rect x="48" y="716" width="1104" height="76" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="600.0" y="764.8" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937">修的時候，先修<tspan fill="#8A5D00">站位與碰撞</tspan>，再修構圖與時間</text>
</svg>

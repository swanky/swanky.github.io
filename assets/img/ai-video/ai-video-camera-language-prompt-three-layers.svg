<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">這個技法，發生在哪裡？</title>
  <desc id="d">鏡頭語言分三層。第一層發生在一個鏡頭之內，例如景別、運鏡、移焦、動機光、框中框，寫進單鏡指令。第二層發生在鏡頭和鏡頭之間，例如過肩、反應鏡頭、交叉剪輯、蒙太奇、慢動作、一鏡到底，要拆分鏡或交給剪輯。第三層是整支片的世界觀，例如黑色電影、武俠、倒敘、伏筆、調色、底片顆粒，定成全片風格。把第二層塞進一句指令，模型會偷切、瞬移。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5A300"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C5B8F"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#FFFFFF"/>
  <text x="48" y="80" font-size="48" font-weight="700" fill="#1F2937">這個技法，發生在哪裡？</text>
  <text x="48" y="126" font-size="26" fill="#4B5563">先分層，再決定放進指令、分鏡表，還是全片風格</text>
  <rect x="48" y="168" width="336" height="400" rx="24" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
  <circle cx="90" cy="212" r="24" fill="#2C5B8F"/>
  <text x="90" y="222.08" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">1</text>
  <text x="126" y="222" font-size="26" font-weight="700" fill="#2C5B8F">第一層</text>
  <g transform="translate(216,282) scale(1)"><rect x="-56" y="-40" width="112" height="80" rx="8" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="5"/><circle cx="-10" cy="-24.24" r="5.76" fill="#2C5B8F"/><rect x="-20.08" y="-17.04" width="20.16" height="25.2" rx="6.48" fill="#2C5B8F"/><rect x="-17.92" y="3.12" width="6.48" height="28.08" rx="2.16" fill="#2C5B8F"/><rect x="-8.56" y="3.12" width="6.48" height="28.08" rx="2.16" fill="#2C5B8F"/><path d="M14,10 L40,10" stroke="#2C5B8F" stroke-width="5" stroke-linecap="round"/><path d="M36,2 L48,10 L36,18 z" fill="#2C5B8F"/></g>
  <text x="216" y="376" text-anchor="middle" font-size="34" font-weight="700" fill="#2C5B8F">一個鏡頭之內</text>
  <rect x="126.04" y="394" width="179.92" height="40" rx="20.0" fill="#2C5B8F" stroke="#2C5B8F" stroke-width="2"/>
  <text x="216" y="421.92" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">寫進單鏡指令</text>
  <text x="216" y="474" text-anchor="middle" font-size="26" fill="#4B5563">景別、運鏡</text>
  <text x="216" y="510" text-anchor="middle" font-size="26" fill="#4B5563">移焦、動機光</text>
  <text x="216" y="546" text-anchor="middle" font-size="26" fill="#4B5563">框中框</text>
  <rect x="432" y="168" width="336" height="400" rx="24" fill="#FDF3E7" stroke="#B45309" stroke-width="3"/>
  <circle cx="474" cy="212" r="24" fill="#B45309"/>
  <text x="474" y="222.08" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">2</text>
  <text x="510" y="222" font-size="26" font-weight="700" fill="#B45309">第二層</text>
  <g transform="translate(600,282) scale(1)"><rect x="-74" y="-30" width="50" height="60" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="5"/><rect x="24" y="-30" width="50" height="60" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="5"/><g transform="translate(0,-2) scale(0.85)"><circle cx="-22" cy="22" r="13" fill="none" stroke="#B45309" stroke-width="5"/><circle cx="22" cy="22" r="13" fill="none" stroke="#B45309" stroke-width="5"/><path d="M-13,12 L20,-34 M13,12 L-20,-34" stroke="#B45309" stroke-width="6" stroke-linecap="round"/></g></g>
  <text x="600" y="376" text-anchor="middle" font-size="34" font-weight="700" fill="#B45309">鏡頭和鏡頭之間</text>
  <rect x="486.72" y="394" width="226.56" height="40" rx="20.0" fill="#B45309" stroke="#B45309" stroke-width="2"/>
  <text x="600" y="421.92" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">拆分鏡、交給剪輯</text>
  <text x="600" y="474" text-anchor="middle" font-size="26" fill="#4B5563">過肩、反應鏡頭</text>
  <text x="600" y="510" text-anchor="middle" font-size="26" fill="#4B5563">交叉剪輯、蒙太奇</text>
  <text x="600" y="546" text-anchor="middle" font-size="26" fill="#4B5563">慢動作、一鏡到底</text>
  <rect x="816" y="168" width="336" height="400" rx="24" fill="#E6F4F1" stroke="#0E7568" stroke-width="3"/>
  <circle cx="858" cy="212" r="24" fill="#0E7568"/>
  <text x="858" y="222.08" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">3</text>
  <text x="894" y="222" font-size="26" font-weight="700" fill="#0E7568">第三層</text>
  <g transform="translate(984,282) scale(1)"><circle r="48" fill="#E6F4F1" stroke="#0E7568" stroke-width="5"/><circle r="7" fill="#0E7568"/><circle cx="0" cy="-26" r="11" fill="#FFFFFF" stroke="#0E7568" stroke-width="4"/><circle cx="25" cy="-8" r="11" fill="#FFFFFF" stroke="#0E7568" stroke-width="4"/><circle cx="15" cy="22" r="11" fill="#FFFFFF" stroke="#0E7568" stroke-width="4"/><circle cx="-15" cy="22" r="11" fill="#FFFFFF" stroke="#0E7568" stroke-width="4"/><circle cx="-25" cy="-8" r="11" fill="#FFFFFF" stroke="#0E7568" stroke-width="4"/><path d="M0,48 L60,48" stroke="#0E7568" stroke-width="5" stroke-linecap="round"/></g>
  <text x="984" y="376" text-anchor="middle" font-size="34" font-weight="700" fill="#0E7568">整支片的世界觀</text>
  <rect x="894.04" y="394" width="179.92" height="40" rx="20.0" fill="#0E7568" stroke="#0E7568" stroke-width="2"/>
  <text x="984" y="421.92" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">定成全片風格</text>
  <text x="984" y="474" text-anchor="middle" font-size="26" fill="#4B5563">黑色電影、武俠</text>
  <text x="984" y="510" text-anchor="middle" font-size="26" fill="#4B5563">倒敘、伏筆</text>
  <text x="984" y="546" text-anchor="middle" font-size="26" fill="#4B5563">調色、底片顆粒</text>
  <rect x="48" y="598" width="1104" height="86" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <g transform="translate(98,641) scale(0.75)"><path d="M0,-30 L32,26 L-32,26 z" fill="#B91C1C" stroke="#B91C1C" stroke-width="6" stroke-linejoin="round"/><rect x="-3.5" y="-12" width="7" height="22" rx="3" fill="#FFFFFF"/><circle cx="0" cy="18" r="4" fill="#FFFFFF"/></g>
  <text x="144" y="651.8" font-size="30" font-weight="700" fill="#1F2937">把第二層塞進一句指令，<tspan fill="#8A5D00">模型會偷切、瞬移</tspan></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1578" width="600" height="1578" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">送出前，先看一張報價單</title>
  <desc id="d">示意的報價單欄位，金色的秒數、解析度、版本數一改就是新報價。核准只對這一張有效；價格查當下的，查不到寫未知。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="600" height="1578" fill="#FFFFFF"/>
  <text x="40" y="70" font-size="40" font-weight="700" fill="#1F2937">送出前，</text>
  <text x="40" y="122" font-size="40" font-weight="700" fill="#1F2937">先看一張報價單</text>
  <text x="40" y="168" font-size="24" fill="#4B5563">欄位範例（示意）：</text>
  <text x="40" y="202" font-size="24" fill="#4B5563">金色欄位一改，就是一張新報價</text>
  <rect x="40" y="236" width="520" height="772" rx="18" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="3"/>
  <rect x="40" y="236" width="520" height="70" rx="18" fill="#2C5B8F"/>
  <rect x="40" y="276" width="520" height="30" rx="0" fill="#2C5B8F"/>
  <text x="68" y="284" font-size="30" font-weight="700" fill="#FFFFFF">報價單</text>
  <text x="532" y="282" font-size="22" font-weight="700" text-anchor="end" fill="#FFFFFF">示意</text>
  <text x="70" y="359.0" font-size="24" font-weight="700" fill="#1F2937">拍什麼</text>
  <text x="530" y="359.0" font-size="22" text-anchor="end" fill="#2C5B8F">成功條件寫清楚</text>
  <text x="70" y="409.0" font-size="24" font-weight="700" fill="#1F2937">模型</text>
  <rect x="370" y="399.0" width="160" height="10" rx="5" fill="#CBD5E1"/>
  <rect x="54" y="428" width="492" height="44" rx="10" fill="#FFF8E7" stroke="#E5A300" stroke-width="3"/>
  <text x="70" y="459.0" font-size="24" font-weight="700" fill="#8A5D00">秒數</text>
  <rect x="370" y="449.0" width="160" height="10" rx="5" fill="#CBD5E1"/>
  <rect x="54" y="478" width="492" height="44" rx="10" fill="#FFF8E7" stroke="#E5A300" stroke-width="3"/>
  <text x="70" y="509.0" font-size="24" font-weight="700" fill="#8A5D00">解析度</text>
  <rect x="370" y="499.0" width="160" height="10" rx="5" fill="#CBD5E1"/>
  <text x="70" y="559.0" font-size="24" font-weight="700" fill="#1F2937">畫面比例</text>
  <rect x="370" y="549.0" width="160" height="10" rx="5" fill="#CBD5E1"/>
  <rect x="54" y="578" width="492" height="44" rx="10" fill="#FFF8E7" stroke="#E5A300" stroke-width="3"/>
  <text x="70" y="609.0" font-size="24" font-weight="700" fill="#8A5D00">版本數</text>
  <rect x="370" y="599.0" width="160" height="10" rx="5" fill="#CBD5E1"/>
  <text x="70" y="659.0" font-size="24" font-weight="700" fill="#1F2937">單價</text>
  <text x="530" y="659.0" font-size="22" text-anchor="end" fill="#2C5B8F">查當下價格表</text>
  <text x="70" y="709.0" font-size="24" font-weight="700" fill="#1F2937">這次估價</text>
  <rect x="370" y="699.0" width="160" height="10" rx="5" fill="#CBD5E1"/>
  <text x="70" y="759.0" font-size="24" font-weight="700" fill="#1F2937">目前累計</text>
  <rect x="370" y="749.0" width="160" height="10" rx="5" fill="#CBD5E1"/>
  <text x="70" y="809.0" font-size="24" font-weight="700" fill="#1F2937">第幾次</text>
  <rect x="370" y="799.0" width="160" height="10" rx="5" fill="#CBD5E1"/>
  <text x="70" y="859.0" font-size="24" font-weight="700" fill="#1F2937">可能風險</text>
  <text x="530" y="859.0" font-size="22" text-anchor="end" fill="#2C5B8F">內容過濾、角色走樣</text>
  <line x1="64" y1="892" x2="536" y2="892" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6"/>
  <text x="70" y="948" font-size="24" font-weight="700" fill="#1F2937">人核准：</text>
  <g transform="rotate(-12 230 940)"><circle cx="230" cy="940" r="48" fill="none" stroke="#E5A300" stroke-width="6"/><circle cx="230" cy="940" r="36" fill="none" stroke="#E5A300" stroke-width="2"/><text x="230" y="951" font-size="30" font-weight="700" fill="#8A5D00" text-anchor="middle">核准</text></g>
  <text x="530" y="948" font-size="22" text-anchor="end" fill="#2C5B8F">核准後才送出</text>
  <rect x="40" y="1038" width="520" height="168" rx="24" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
  <text x="70" y="1088" font-size="30" font-weight="700" fill="#8A5D00">核准只對這一張有效</text>
  <text x="70" y="1130" font-size="24" fill="#4B5563">改了解析度、秒數、版本數或提示詞，</text>
  <text x="70" y="1164" font-size="24" fill="#4B5563">就是新報價，重新核准</text>
  <rect x="40" y="1228" width="520" height="134" rx="24" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
  <text x="70" y="1278" font-size="30" font-weight="700" fill="#2C5B8F">價格查當下的</text>
  <text x="70" y="1320" font-size="24" fill="#4B5563">不憑印象；查不到就寫「未知」</text>
  <rect x="40" y="1384" width="520" height="168" rx="24" fill="#FDECEC" stroke="#B91C1C" stroke-width="3"/>
  <text x="70" y="1434" font-size="30" font-weight="700" fill="#B91C1C">我碰過的落差</text>
  <text x="70" y="1476" font-size="24" fill="#4B5563">首頁寫每秒 US$0.08，</text>
  <text x="70" y="1510" font-size="24" fill="#4B5563">送 1080p、5 秒，實付卻是 US$1.26</text>
</svg>

  <title id="t">九宮格分鏡的三個陷阱</title>
  <desc id="d">讓 AI 一次生一張 3×3 九宮格分鏡，適合快速檢查景別是否單調，但有三個陷阱：切開後每格解析度很低，要重做單鏡參考；九格一起生會互相污染，服裝和人數可能悄悄改變；九格圖不是九支影片，不能整張丟給影片模型。</desc>

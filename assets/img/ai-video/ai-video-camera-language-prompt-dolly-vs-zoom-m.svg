<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1120" width="600" height="1120" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">推軌 vs 變焦：看背景有沒有湧過來</title>
  <desc id="d">左邊是推軌：攝影機整台往前移，前景柱子跑得比背景山快，空間像湧過來。右邊是變焦：攝影機不動，整張畫面均勻放大。要推軌，指令要寫出前景、主體、背景三層，否則模型容易只把畫面放大。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5A300"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C5B8F"/></marker>
  </defs>
  <rect width="600" height="1120" fill="#FFFFFF"/>
  <text x="40" y="66" font-size="40" font-weight="700" fill="#1F2937">推軌 vs 變焦</text>
  <text x="40" y="118" font-size="40" font-weight="700" fill="#1F2937">看背景有沒有湧過來</text>
  <text x="40" y="162" font-size="24" fill="#4B5563">推軌是攝影機真的往前走</text>
  <rect x="40" y="196" width="520" height="380" rx="24" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
  <text x="70" y="248" font-size="34" font-weight="700" fill="#2C5B8F">推軌</text>
  <text x="162.08" y="246" font-size="26" fill="#4B5563">攝影機整台往前移</text>
  <g transform="translate(110,300) scale(0.5)"><rect x="-46" y="-28" width="76" height="56" rx="10" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="5"/><circle cx="-8" cy="0" r="15" fill="none" stroke="#2C5B8F" stroke-width="5"/><path d="M30,-14 L52,-26 L52,26 L30,14 z" fill="#2C5B8F"/><rect x="-36" y="-40" width="26" height="12" rx="3" fill="#2C5B8F"/></g>
  <line x1="146" y1="300" x2="236" y2="300" stroke="#2C5B8F" stroke-width="5" marker-end="url(#arrB)"/>
  <text x="252" y="309" font-size="26" font-weight="700" fill="#2C5B8F">整台往前</text>
  <clipPath id="c1"><rect x="70" y="346" width="205" height="127.1" rx="8"/></clipPath>
  <g clip-path="url(#c1)"><rect x="70" y="346" width="205.0" height="127.1" fill="#F1F5F9"/><path d="M127.1,460.39 L197.1,390.39 L267.1,460.39 z" fill="#CBD5E1"/><circle cx="172.5" cy="401.87" r="6.08" fill="#2C5B8F"/><rect x="161.86" y="409.47" width="21.28" height="26.6" rx="6.84" fill="#2C5B8F"/><rect x="164.14" y="430.75" width="6.84" height="29.64" rx="2.28" fill="#2C5B8F"/><rect x="174.02" y="430.75" width="6.84" height="29.64" rx="2.28" fill="#2C5B8F"/><rect x="93.8" y="336" width="18" height="147.1" rx="4" fill="#B45309"/></g>
  <rect x="70" y="346" width="205" height="127.1" rx="8" fill="none" stroke="#64748B" stroke-width="3"/>
  <line x1="283" y1="409.55" x2="319" y2="409.55" stroke="#374151" stroke-width="4" marker-end="url(#arr)"/>
  <clipPath id="c2"><rect x="325" y="346" width="205" height="127.1" rx="8"/></clipPath>
  <g clip-path="url(#c2)"><rect x="325.0" y="346" width="205.0" height="127.1" fill="#F1F5F9"/><path d="M373.7,460.39 L452.1,381.99 L530.5,460.39 z" fill="#CBD5E1"/><circle cx="427.5" cy="366.758" r="9.728" fill="#2C5B8F"/><rect x="410.476" y="378.918" width="34.048" height="42.56" rx="10.944" fill="#2C5B8F"/><rect x="414.124" y="412.966" width="10.944" height="47.424" rx="3.648" fill="#2C5B8F"/><rect x="429.932" y="412.966" width="10.944" height="47.424" rx="3.648" fill="#2C5B8F"/><rect x="300.3" y="336" width="57.6" height="147.1" rx="4" fill="#B45309"/></g>
  <rect x="325" y="346" width="205" height="127.1" rx="8" fill="none" stroke="#64748B" stroke-width="3"/>
  <text x="172.5" y="505.1" text-anchor="middle" font-size="22" fill="#4B5563">開始</text>
  <text x="427.5" y="505.1" text-anchor="middle" font-size="22" fill="#4B5563">結束</text>
  <text x="300" y="546" text-anchor="middle" font-size="30" font-weight="700" fill="#2C5B8F">前景跑得比背景快</text>
  <rect x="40" y="626" width="520" height="380" rx="24" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
  <text x="70" y="678" font-size="34" font-weight="700" fill="#64748B">變焦</text>
  <text x="162.08" y="676" font-size="26" fill="#4B5563">攝影機不動，鏡頭放大</text>
  <g transform="translate(110,730) scale(0.5)"><rect x="-46" y="-28" width="76" height="56" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="5"/><circle cx="-8" cy="0" r="15" fill="none" stroke="#64748B" stroke-width="5"/><path d="M30,-14 L52,-26 L52,26 L30,14 z" fill="#64748B"/><rect x="-36" y="-40" width="26" height="12" rx="3" fill="#64748B"/></g>
  <g transform="translate(174,730) scale(0.5)"><path d="M-16,-6 L-16,-20 A16,16 0 0 1 16,-20 L16,-6" fill="none" stroke="#64748B" stroke-width="6"/><rect x="-26" y="-8" width="52" height="40" rx="7" fill="#64748B"/><circle cx="0" cy="10" r="5" fill="#FFFFFF"/></g>
  <text x="202" y="739" font-size="26" font-weight="700" fill="#64748B">位置不動</text>
  <clipPath id="c3"><rect x="70" y="776" width="205" height="127.1" rx="8"/></clipPath>
  <g clip-path="url(#c3)"><rect x="70" y="776" width="205.0" height="127.1" fill="#F1F5F9"/><path d="M127.1,890.39 L197.1,820.39 L267.1,890.39 z" fill="#CBD5E1"/><circle cx="172.5" cy="831.87" r="6.08" fill="#2C5B8F"/><rect x="161.86" y="839.47" width="21.28" height="26.6" rx="6.84" fill="#2C5B8F"/><rect x="164.14" y="860.75" width="6.84" height="29.64" rx="2.28" fill="#2C5B8F"/><rect x="174.02" y="860.75" width="6.84" height="29.64" rx="2.28" fill="#2C5B8F"/><rect x="93.8" y="766" width="18" height="147.1" rx="4" fill="#B45309"/></g>
  <rect x="70" y="776" width="205" height="127.1" rx="8" fill="none" stroke="#64748B" stroke-width="3"/>
  <line x1="283" y1="839.55" x2="319" y2="839.55" stroke="#374151" stroke-width="4" marker-end="url(#arr)"/>
  <clipPath id="c4"><rect x="325" y="776" width="205" height="127.1" rx="8"/></clipPath>
  <g clip-path="url(#c4)"><rect x="325.0" y="776" width="205.0" height="127.1" fill="#F1F5F9"/><g transform="translate(427.5,852.26) scale(1.6) translate(-427.5,-852.26)"><path d="M382.1,890.39 L452.1,820.39 L522.1,890.39 z" fill="#CBD5E1"/><circle cx="427.5" cy="831.87" r="6.08" fill="#2C5B8F"/><rect x="416.86" y="839.47" width="21.28" height="26.6" rx="6.84" fill="#2C5B8F"/><rect x="419.14" y="860.75" width="6.84" height="29.64" rx="2.28" fill="#2C5B8F"/><rect x="429.02" y="860.75" width="6.84" height="29.64" rx="2.28" fill="#2C5B8F"/><rect x="348.8" y="766" width="18" height="147.1" rx="4" fill="#B45309"/></g></g>
  <rect x="325" y="776" width="205" height="127.1" rx="8" fill="none" stroke="#64748B" stroke-width="3"/>
  <text x="172.5" y="935.1" text-anchor="middle" font-size="22" fill="#4B5563">開始</text>
  <text x="427.5" y="935.1" text-anchor="middle" font-size="22" fill="#4B5563">結束</text>
  <text x="300" y="976" text-anchor="middle" font-size="30" font-weight="700" fill="#64748B">整張畫面均勻放大</text>
  <circle cx="300" cy="601" r="30" fill="#1F2937" stroke="#FFFFFF" stroke-width="6"/>
  <text x="300" y="610" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">VS</text>
  <rect x="40" y="1030" width="520" height="70" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="72" y="1075.08" font-size="28" font-weight="700" fill="#1F2937">寫出<tspan fill="#8A5D00">前景、主體、背景</tspan></text>
</svg>

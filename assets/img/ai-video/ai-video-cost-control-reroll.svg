<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">第二次之前，先寫下失敗原因</title>
  <desc id="d">左邊：只換亂數設定再送，等於同一張彩券買兩次，每次都是全額。右邊：先寫下失敗屬於哪一類，構圖不對、角色走樣、動作破綻、首幀有問題或人數錯，再改提示詞、首幀或秒數。問題在首幀就先修圖，比重生影片便宜很多。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#FFFFFF"/>
  <text x="48" y="80" font-size="48" font-weight="700" fill="#1F2937">第二次之前，先寫下失敗原因</text>
  <text x="48" y="126" font-size="26" fill="#4B5563">同一顆鏡頭再送一次之前，先想清楚錯在哪</text>
  <rect x="48" y="168" width="520" height="420" rx="24" fill="#FDECEC" stroke="#B91C1C" stroke-width="3"/>
  <g transform="rotate(-8 240 266)"><rect x="150" y="216" width="180" height="100" rx="12" fill="#FFFFFF" stroke="#B91C1C" stroke-width="4"/><line x1="278" y1="224" x2="278" y2="308" stroke="#B91C1C" stroke-width="3" stroke-dasharray="6 6"/><circle cx="190" cy="266" r="14" fill="#B91C1C" opacity="0.35"/><circle cx="230" cy="266" r="14" fill="#B91C1C" opacity="0.35"/><text x="304" y="278" font-size="34" font-weight="700" fill="#B91C1C" text-anchor="middle">?</text></g>
  <g transform="rotate(6 328 306)"><rect x="238" y="256" width="180" height="100" rx="12" fill="#FFFFFF" stroke="#B91C1C" stroke-width="4"/><line x1="366" y1="264" x2="366" y2="348" stroke="#B91C1C" stroke-width="3" stroke-dasharray="6 6"/><circle cx="278" cy="306" r="14" fill="#B91C1C" opacity="0.35"/><circle cx="318" cy="306" r="14" fill="#B91C1C" opacity="0.35"/><text x="392" y="318" font-size="34" font-weight="700" fill="#B91C1C" text-anchor="middle">?</text></g>
  <text x="308" y="430" font-size="34" font-weight="700" text-anchor="middle" fill="#B91C1C">只換亂數重送</text>
  <text x="308" y="478" font-size="26" text-anchor="middle" fill="#4B5563">同一張彩券買兩次，</text>
  <text x="308" y="516" font-size="26" text-anchor="middle" fill="#4B5563">每次都是全額</text>
  <circle cx="600" cy="378" r="40" fill="#1F2937" stroke="#FFFFFF" stroke-width="6"/>
  <text x="600" y="389" font-size="30" font-weight="700" text-anchor="middle" fill="#FFFFFF">VS</text>
  <rect x="632" y="168" width="520" height="420" rx="24" fill="#E6F4F1" stroke="#0E7568" stroke-width="3"/>
  <circle cx="860" cy="280" r="74" fill="#0E7568"/>
  <circle cx="860" cy="280" r="53.28" fill="#FFFFFF"/>
  <circle cx="860" cy="280" r="34.04" fill="#0E7568"/>
  <circle cx="860" cy="280" r="14.8" fill="#FFFFFF"/>
  <line x1="970" y1="210" x2="868" y2="276" stroke="#1F2937" stroke-width="6" stroke-linecap="round"/>
  <path d="M868,276 l14,-20 l8,14 z" fill="#1F2937"/>
  <path d="M964,206 l20,-6 l-4,18 z M972,214 l20,-6 l-4,18 z" fill="#1F2937"/>
  <text x="892" y="418" font-size="34" font-weight="700" text-anchor="middle" fill="#0E7568">寫下原因，改輸入</text>
  <rect x="668.0" y="445.0" width="116.0" height="38" rx="19.0" fill="#FFFFFF" stroke="#0E7568" stroke-width="2"/>
  <text x="726.0" y="471.92" font-size="22" font-weight="700" text-anchor="middle" fill="#0E7568">構圖不對</text>
  <rect x="796.0" y="445.0" width="116.0" height="38" rx="19.0" fill="#FFFFFF" stroke="#0E7568" stroke-width="2"/>
  <text x="854.0" y="471.92" font-size="22" font-weight="700" text-anchor="middle" fill="#0E7568">角色走樣</text>
  <rect x="924.0" y="445.0" width="116.0" height="38" rx="19.0" fill="#FFFFFF" stroke="#0E7568" stroke-width="2"/>
  <text x="982.0" y="471.92" font-size="22" font-weight="700" text-anchor="middle" fill="#0E7568">動作破綻</text>
  <rect x="668.0" y="493.0" width="138.0" height="38" rx="19.0" fill="#FFFFFF" stroke="#0E7568" stroke-width="2"/>
  <text x="737.0" y="519.92" font-size="22" font-weight="700" text-anchor="middle" fill="#0E7568">首幀有問題</text>
  <rect x="818.0" y="493.0" width="94.0" height="38" rx="19.0" fill="#FFFFFF" stroke="#0E7568" stroke-width="2"/>
  <text x="865.0" y="519.92" font-size="22" font-weight="700" text-anchor="middle" fill="#0E7568">人數錯</text>
  <text x="668" y="564" font-size="26" font-weight="700" fill="#0E7568">→ 改提示詞、首幀或秒數</text>
  <rect x="48" y="616" width="1104" height="80" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="600.0" y="666.8" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937">問題在首幀，<tspan fill="#8A5D00">先修圖</tspan>，比重生影片便宜很多</text>
</svg>

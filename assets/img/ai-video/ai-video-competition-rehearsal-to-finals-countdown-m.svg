<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1458" width="600" height="1458" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">從交件時間往回推</title>
<desc id="d">先釘住交件時間，再往回排六段：一、開賽第一個小時拆規則，分成硬規則、軟規則、假設與待查；二、前五個小時做故事與分鏡，用暫代配音組出會動的分鏡定節奏；三、開始花錢時先查當天價格、設預算上限，只送最短規格的小測試，第一筆約 US$2.48；四、小測通過才生成正式段落，每顆鏡頭最多兩抽；五、交件前完整粗剪，找沒背景的人看；六、最後一小時只做低風險修正，大改不碰。只有第三、四段花錢。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5A300"/></marker></defs>
<rect width="600" height="1458" fill="#FFFFFF"/>
<text x="40" y="72" font-size="42" font-weight="700" fill="#1F2937">從交件時間往回推</text>
<text x="40" y="114" font-size="24" fill="#4B5563">排程從交件往回推，只有中間兩段花錢</text>
<rect x="40" y="146" width="520" height="158" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="76" cy="184" r="22" fill="#2C5B8F"/><text x="76" y="193" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">1</text>
<text x="112" y="192" font-size="22" font-weight="700" fill="#2C5B8F">開賽第一個小時</text>
<text x="54" y="242" font-size="34" font-weight="700" fill="#2C5B8F">拆規則</text>
<text x="54" y="282" font-size="24" fill="#4B5563">硬規則、軟規則、假設、待查</text>
<g transform="translate(486,206) scale(0.62)"><rect x="-34" y="-44" width="68" height="90" rx="8" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="4"/><rect x="-18" y="-54" width="36" height="18" rx="4" fill="#2C5B8F"/><line x1="-20" y1="-14" x2="20" y2="-14" stroke="#2C5B8F" stroke-width="4" stroke-linecap="round"/><line x1="-20" y1="6" x2="20" y2="6" stroke="#2C5B8F" stroke-width="4" stroke-linecap="round"/><line x1="-20" y1="26" x2="20" y2="26" stroke="#2C5B8F" stroke-width="4" stroke-linecap="round"/></g>
<rect x="446" y="255" width="80" height="34" rx="17" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/><text x="486" y="279" text-anchor="middle" font-size="20" font-weight="700" fill="#475569">不花錢</text>
<rect x="40" y="322" width="520" height="158" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="76" cy="360" r="22" fill="#2C5B8F"/><text x="76" y="369" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">2</text>
<text x="112" y="368" font-size="22" font-weight="700" fill="#2C5B8F">前五個小時</text>
<text x="54" y="418" font-size="34" font-weight="700" fill="#2C5B8F">故事分鏡</text>
<text x="54" y="458" font-size="24" fill="#4B5563">暫代配音，組出會動的分鏡</text>
<g transform="translate(486,382) scale(0.62)"><rect x="-46" y="-34" width="92" height="68" rx="6" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="4"/><line x1="0" y1="-34" x2="0" y2="34" stroke="#2C5B8F" stroke-width="3"/><line x1="-46" y1="0" x2="46" y2="0" stroke="#2C5B8F" stroke-width="3"/><polygon points="16,6 16,28 34,17" fill="#2C5B8F"/><circle cx="-23" cy="-17" r="7" fill="#2C5B8F"/></g>
<rect x="446" y="431" width="80" height="34" rx="17" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/><text x="486" y="455" text-anchor="middle" font-size="20" font-weight="700" fill="#475569">不花錢</text>
<rect x="40" y="498" width="520" height="158" rx="22" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
<circle cx="76" cy="536" r="22" fill="#E5A300"/><text x="76" y="545" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">3</text>
<text x="112" y="544" font-size="22" font-weight="700" fill="#8A5D00">開始花錢</text>
<text x="54" y="594" font-size="34" font-weight="700" fill="#8A5D00">小測試</text>
<text x="54" y="634" font-size="24" fill="#4B5563">查價、設上限、最短規格</text>
<g transform="translate(486,558) scale(0.62)"><circle cx="0" cy="0" r="34" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/><circle cx="0" cy="0" r="24" fill="none" stroke="#E5A300" stroke-width="2"/><text x="0" y="13" text-anchor="middle" font-size="36" font-weight="700" fill="#8A5D00">$</text></g>
<rect x="435" y="607" width="101" height="34" rx="17" fill="#FFFFFF" stroke="#E5A300" stroke-width="2"/><text x="486" y="631" text-anchor="middle" font-size="20" font-weight="700" fill="#8A5D00">US$2.48</text>
<rect x="40" y="674" width="520" height="158" rx="22" fill="#FDF3E7" stroke="#B45309" stroke-width="3"/>
<circle cx="76" cy="712" r="22" fill="#B45309"/><text x="76" y="721" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">4</text>
<text x="112" y="720" font-size="22" font-weight="700" fill="#B45309">開始花錢</text>
<text x="54" y="770" font-size="34" font-weight="700" fill="#B45309">正式生成</text>
<text x="54" y="810" font-size="24" fill="#4B5563">小測過了才送，最多兩抽</text>
<g transform="translate(486,734) scale(0.62)"><ellipse cx="0" cy="38" rx="40" ry="13" fill="#B45309"/><ellipse cx="0" cy="30" rx="40" ry="13" fill="#FFFFFF" stroke="#B45309" stroke-width="4"/><ellipse cx="0" cy="20" rx="40" ry="13" fill="#B45309"/><ellipse cx="0" cy="12" rx="40" ry="13" fill="#FFFFFF" stroke="#B45309" stroke-width="4"/><ellipse cx="0" cy="2" rx="40" ry="13" fill="#B45309"/><ellipse cx="0" cy="-6" rx="40" ry="13" fill="#FFFFFF" stroke="#B45309" stroke-width="4"/><ellipse cx="0" cy="-16" rx="40" ry="13" fill="#B45309"/><ellipse cx="0" cy="-24" rx="40" ry="13" fill="#FFFFFF" stroke="#B45309" stroke-width="4"/></g>
<rect x="446" y="783" width="80" height="34" rx="17" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/><text x="486" y="807" text-anchor="middle" font-size="20" font-weight="700" fill="#B45309">上限內</text>
<rect x="40" y="850" width="520" height="158" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="76" cy="888" r="22" fill="#2C5B8F"/><text x="76" y="897" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">5</text>
<text x="112" y="896" font-size="22" font-weight="700" fill="#2C5B8F">交件前</text>
<text x="54" y="946" font-size="34" font-weight="700" fill="#2C5B8F">粗剪</text>
<text x="54" y="986" font-size="24" fill="#4B5563">完整粗剪，找沒背景的人看</text>
<g transform="translate(486,910) scale(0.62)"><path d="M-46,0 Q0,-42 46,0 Q0,42 -46,0 Z" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="5"/><circle cx="0" cy="0" r="15" fill="#2C5B8F"/><circle cx="5" cy="-5" r="5" fill="#FFFFFF"/></g>
<rect x="446" y="959" width="80" height="34" rx="17" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/><text x="486" y="983" text-anchor="middle" font-size="20" font-weight="700" fill="#475569">不花錢</text>
<rect x="40" y="1026" width="520" height="158" rx="22" fill="#E6F4F1" stroke="#0E7568" stroke-width="3"/>
<circle cx="76" cy="1064" r="22" fill="#0E7568"/><text x="76" y="1073" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">6</text>
<text x="112" y="1072" font-size="22" font-weight="700" fill="#0E7568">最後一小時</text>
<text x="54" y="1122" font-size="34" font-weight="700" fill="#0E7568">低風險修正</text>
<text x="54" y="1162" font-size="24" fill="#4B5563">只修小地方，大改不碰</text>
<g transform="translate(486,1086) scale(0.62)"><circle cx="0" cy="0" r="40" fill="#FFFFFF" stroke="#0E7568" stroke-width="5"/><polyline points="-18,0 -4,15 20,-14" fill="none" stroke="#0E7568" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
<rect x="446" y="1135" width="80" height="34" rx="17" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/><text x="486" y="1159" text-anchor="middle" font-size="20" font-weight="700" fill="#475569">不花錢</text>
<g transform="translate(90,1254) scale(0.8)"><line x1="-30" y1="-50" x2="-30" y2="50" stroke="#374151" stroke-width="5" stroke-linecap="round"/><rect x="-28" y="-50" width="14" height="12" fill="#1F2937"/><rect x="-14" y="-50" width="14" height="12" fill="#FFFFFF"/><rect x="0" y="-50" width="14" height="12" fill="#1F2937"/><rect x="14" y="-50" width="14" height="12" fill="#FFFFFF"/><rect x="-28" y="-38" width="14" height="12" fill="#FFFFFF"/><rect x="-14" y="-38" width="14" height="12" fill="#1F2937"/><rect x="0" y="-38" width="14" height="12" fill="#FFFFFF"/><rect x="14" y="-38" width="14" height="12" fill="#1F2937"/><rect x="-28" y="-26" width="14" height="12" fill="#1F2937"/><rect x="-14" y="-26" width="14" height="12" fill="#FFFFFF"/><rect x="0" y="-26" width="14" height="12" fill="#1F2937"/><rect x="14" y="-26" width="14" height="12" fill="#FFFFFF"/><rect x="-28" y="-50" width="56" height="36" fill="none" stroke="#1F2937" stroke-width="2"/></g>
<text x="130" y="1252" font-size="34" font-weight="700" fill="#1F2937">交件</text>
<rect x="40" y="1306" width="520" height="116" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/><text x="300.0" y="1356" font-size="26" font-weight="700" text-anchor="middle"><tspan fill="#1F2937">錢只花在中間兩段：</tspan></text><text x="300.0" y="1391" font-size="26" font-weight="700" text-anchor="middle"><tspan fill="#8A5D00">先花小錢確認，再生成正式段落</tspan></text>
</svg>

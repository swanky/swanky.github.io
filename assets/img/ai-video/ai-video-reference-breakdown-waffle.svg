<title id="t">75 支裡，43 支看不出是否一次生成</title>
<desc id="d">我收的 121 個參考案例中，有 75 個附影片，畫成 75 格方格圖，每格一支。其中 43 格標紅：我在「哪裡不能信」欄寫到無法從成片判斷是不是一次生成；其餘 32 格的筆記沒寫到這一點。下方示意：社群上的 30 秒短片，背後可能是好幾段剪起來的。</desc>

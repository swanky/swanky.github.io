<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1162" width="600" height="1162" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">「我有點看不懂」之後</title>
  <desc id="d">第八集的改版過程。第一版約 4 分鐘，技術檢查全部通過，但很多畫面沒有旁白、字幕沒標誰在說話，審核意見是「我有點看不懂」。AI 助手第一次補的旁白寫成一份解說稿，像在上課，沒有送出；補上方向「跟前幾集同一種語氣」後，第二版變成 6 分 14 秒、14 段故事旁白、字幕標出說話者、依配音長度重排畫面，並拿掉全部配樂。自動檢查只能確認東西都在，看不看得懂要人來看。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C5B8F"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E7568"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
    <marker id="arr-gold" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5A300"/></marker>
  </defs>
  <rect width="600" height="1162" fill="#FFFFFF"/>
  <text x="40" y="70" font-size="40" font-weight="700" fill="#1F2937">「我有點看不懂」</text>
  <text x="40" y="122" font-size="40" font-weight="700" fill="#1F2937">之後</text>
  <text x="40" y="164" font-size="24" fill="#4B5563">第八集：技術檢查全過，還是看不懂</text>
  <rect x="40" y="206" width="520" height="198" rx="24" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
  <g transform="translate(100 305.0) scale(0.62)"><circle r="40" fill="#FFFFFF" stroke="#64748B" stroke-width="5"/><text x="0" y="20" font-size="56" font-weight="700" text-anchor="middle" fill="#64748B">?</text></g>
  <text x="170" y="258" font-size="30" font-weight="700" fill="#64748B">第一版</text>
  <text x="170" y="302" font-size="26" font-weight="700" fill="#1F2937">約 4 分鐘</text>
  <text x="170" y="340" font-size="26" fill="#4B5563">很多畫面沒有旁白</text>
  <text x="170" y="378" font-size="26" fill="#4B5563">字幕沒標誰在說</text>
  <line x1="300" y1="410" x2="300" y2="456" stroke="#374151" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
  <text x="320" y="442" font-size="24" font-weight="700" fill="#8A5D00">「我有點看不懂」</text>
  <rect x="40" y="466" width="520" height="200" rx="24" fill="#FDF3E7" stroke="#B45309" stroke-width="3"/>
  <g transform="translate(100 566.0) scale(0.62)"><path d="M-34,-46 h46 l22,22 v70 h-68 z" fill="#FFFFFF" stroke="#B45309" stroke-width="5" stroke-linejoin="round"/><polyline points="12,-46 12,-24 34,-24" fill="none" stroke="#B45309" stroke-width="5" stroke-linejoin="round"/><line x1="-22" y1="-18" x2="22" y2="-18" stroke="#B45309" stroke-width="4" stroke-linecap="round"/><line x1="-22" y1="-2" x2="22" y2="-2" stroke="#B45309" stroke-width="4" stroke-linecap="round"/><line x1="-22" y1="14" x2="22" y2="14" stroke="#B45309" stroke-width="4" stroke-linecap="round"/></g>
  <text x="170" y="518" font-size="30" font-weight="700" fill="#B45309">AI 補的初稿</text>
  <text x="170" y="562" font-size="26" font-weight="700" fill="#1F2937">寫成一份解說稿</text>
  <text x="170" y="600" font-size="26" fill="#4B5563">像在上課</text>
  <g transform="translate(186 632) scale(1)"><circle r="16" fill="#B91C1C"/><g transform="scale(0.36)"><line x1="-26" y1="-26" x2="26" y2="26" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/><line x1="26" y1="-26" x2="-26" y2="26" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/></g></g>
  <text x="210" y="640" font-size="24" font-weight="700" fill="#B91C1C">沒有送出</text>
  <line x1="300" y1="672" x2="300" y2="718" stroke="#374151" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
  <text x="320" y="704" font-size="24" font-weight="700" fill="#8A5D00">跟前幾集同語氣</text>
  <rect x="40" y="728" width="520" height="274" rx="24" fill="#E6F4F1" stroke="#0E7568" stroke-width="3"/>
  <g transform="translate(100 865.0) scale(0.62)"><circle cx="0" cy="-12" r="30" fill="#FFF8E7" stroke="#0E7568" stroke-width="5"/><rect x="-14" y="18" width="28" height="22" rx="4" fill="#0E7568"/><line x1="-46" y1="-40" x2="-38" y2="-34" stroke="#0E7568" stroke-width="5" stroke-linecap="round"/><line x1="46" y1="-40" x2="38" y2="-34" stroke="#0E7568" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="-56" x2="0" y2="-48" stroke="#0E7568" stroke-width="5" stroke-linecap="round"/></g>
  <text x="170" y="780" font-size="30" font-weight="700" fill="#0E7568">第二版</text>
  <text x="170" y="824" font-size="26" font-weight="700" fill="#1F2937">6 分 14 秒</text>
  <text x="170" y="862" font-size="26" fill="#4B5563">14 段故事旁白</text>
  <text x="170" y="900" font-size="26" fill="#4B5563">字幕標出說話者</text>
  <text x="170" y="938" font-size="26" fill="#4B5563">依配音長度重排</text>
  <text x="170" y="976" font-size="26" fill="#4B5563">拿掉全部配樂</text>
  <rect x="40" y="1022" width="520" height="110" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="300.0" y="1067" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937">自動檢查只確認東西都在，</text>
  <text x="300.0" y="1107" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan fill="#8A5D00">看不看得懂要人來看</tspan></text>
</svg>

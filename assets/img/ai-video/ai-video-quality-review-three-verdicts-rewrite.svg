<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">把形容詞，改成看得到的句子</title>
  <desc id="d">左邊是驗不了的詞：電影感、8K、毛孔級細節、很悲傷，看完也無法打勾。右邊改寫成能對著畫面打勾的句子：數量是兔耳耳機一對、方向是光帶往上不往下、相對位置是能量柱在身後不遮臉、動作是雙臂真的展開、表演是先看向手中物件，停頓後才抬眼看向出口。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#FFFFFF"/>
  <text x="48" y="80" font-size="48" font-weight="700" fill="#1F2937">把形容詞，改成看得到的句子</text>
  <text x="48" y="126" font-size="26" fill="#4B5563">對著畫面能打勾或打叉，才驗得了</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">分數排序問題，人決定交哪一版</title>
<desc id="d">左：每一輪都找全新的 AI 評審盲審，目標 9 分（滿分 10），原版 6 分，修第一輪 5.5 分，修第二輪 5.5 分。中：AI 評審只拿到抽出的畫格與聲音波形圖，看不到動態、聽不到聲畫同步，修好的地方它評不到。右：人看完整片，決定交原本核准的那一版；對改動最明顯的一項，評語是「改了反而效果很差」。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5A300"/></marker></defs>
<rect width="1200" height="720" fill="#FFFFFF"/>
<text x="48" y="80" font-size="48" font-weight="700" fill="#1F2937">分數排序問題，人決定交哪一版</text><text x="48" y="126" font-size="26" fill="#4B5563">盲審的 AI 評審打分，修了反而降分；修好的地方它評不到</text>
<rect x="48" y="168" width="420" height="404" rx="22" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
<text x="76" y="216" font-size="32" font-weight="700" fill="#1F2937">AI 評審打分</text>
<text x="76" y="252" font-size="22" fill="#4B5563">每輪換全新評審，滿分 10</text>
<text x="76" y="360" font-size="24" font-weight="700" fill="#1F2937">原版</text><rect x="186" y="330" width="144" height="42" rx="8" fill="#2C5B8F"/><text x="340.0" y="361" font-size="24" font-weight="700" fill="#2C5B8F">6 分</text><text x="76" y="432" font-size="24" font-weight="700" fill="#1F2937">修第一輪</text><rect x="186" y="402" width="132" height="42" rx="8" fill="#B91C1C"/><text x="328.0" y="433" font-size="24" font-weight="700" fill="#B91C1C">5.5 分</text><text x="76" y="504" font-size="24" font-weight="700" fill="#1F2937">修第二輪</text><rect x="186" y="474" width="132" height="42" rx="8" fill="#B91C1C"/><text x="328.0" y="505" font-size="24" font-weight="700" fill="#B91C1C">5.5 分</text><line x1="402" y1="300" x2="402" y2="532" stroke="#E5A300" stroke-width="4" stroke-dasharray="8 6"/><text x="402" y="292" font-size="22" font-weight="700" text-anchor="middle" fill="#8A5D00">目標 9</text>
<text x="76" y="548" font-size="24" font-weight="700" fill="#B91C1C">修了兩輪，分數反而降</text>
<line x1="472" y1="370" x2="500" y2="370" stroke="#374151" stroke-width="3" marker-end="url(#arr)"/>
<rect x="504" y="168" width="330" height="404" rx="22" fill="#FDECEC" stroke="#B91C1C" stroke-width="2"/>
<text x="532" y="216" font-size="32" font-weight="700" fill="#1F2937">它只拿到這些</text>
<g transform="translate(566,290) scale(0.55)"><rect x="-48" y="-28" width="30" height="24" rx="3" fill="#FFFFFF" stroke="#0E7568" stroke-width="3"/><rect x="-14" y="-22" width="30" height="24" rx="3" fill="#FFFFFF" stroke="#0E7568" stroke-width="3"/><rect x="20" y="-16" width="30" height="24" rx="3" fill="#FFFFFF" stroke="#0E7568" stroke-width="3"/></g>
<text x="612" y="299" font-size="26" font-weight="700" fill="#0E7568">抽出的畫格</text>
<g transform="translate(796,290) scale(0.42)"><circle cx="0" cy="0" r="40" fill="#FFFFFF" stroke="#0E7568" stroke-width="5"/><polyline points="-18,0 -4,15 20,-14" fill="none" stroke="#0E7568" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
<g transform="translate(566,364) scale(0.55)"><rect x="-50" y="-34" width="100" height="68" rx="6" fill="#FFFFFF" stroke="#0E7568" stroke-width="3"/><polyline points="-46.0,0.0 -43.7,7.2 -41.4,12.1 -39.1,6.7 -36.8,-8.3 -34.5,-21.5 -32.2,-19.5 -29.9,0.1 -27.6,7.3 -25.3,12.0 -23.0,6.4 -20.7,-8.6 -18.4,-21.6 -16.1,-19.2 -13.8,0.2 -11.5,7.4 -9.2,12.0 -6.9,6.2 -4.6,-8.9 -2.3,-21.6 0.0,-18.9 2.3,0.3 4.6,7.5 6.9,11.9 9.2,5.9 11.5,-9.2 13.8,-21.7 16.1,-18.6 18.4,0.4 20.7,7.6 23.0,11.9 25.3,5.7 27.6,-9.4 29.9,-21.8 32.2,-18.4 34.5,0.5 36.8,7.7 39.1,11.8 41.4,5.5 43.7,-9.7 46.0,-21.8" fill="none" stroke="#0E7568" stroke-width="3" stroke-linejoin="round"/></g>
<text x="612" y="373" font-size="26" font-weight="700" fill="#0E7568">聲音波形圖</text>
<g transform="translate(796,364) scale(0.42)"><circle cx="0" cy="0" r="40" fill="#FFFFFF" stroke="#0E7568" stroke-width="5"/><polyline points="-18,0 -4,15 20,-14" fill="none" stroke="#0E7568" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
<g transform="translate(566,438) scale(0.55)"><rect x="-46" y="-34" width="92" height="68" rx="6" fill="#B91C1C"/><rect x="-30" y="-20" width="60" height="40" rx="3" fill="#FFFFFF"/><polygon points="-8,-11 -8,11 12,0" fill="#B91C1C"/><rect x="-36" y="-31" width="8" height="7" rx="1" fill="#FFFFFF"/><rect x="-36" y="24" width="8" height="7" rx="1" fill="#FFFFFF"/><rect x="-20" y="-31" width="8" height="7" rx="1" fill="#FFFFFF"/><rect x="-20" y="24" width="8" height="7" rx="1" fill="#FFFFFF"/><rect x="-4" y="-31" width="8" height="7" rx="1" fill="#FFFFFF"/><rect x="-4" y="24" width="8" height="7" rx="1" fill="#FFFFFF"/><rect x="12" y="-31" width="8" height="7" rx="1" fill="#FFFFFF"/><rect x="12" y="24" width="8" height="7" rx="1" fill="#FFFFFF"/><rect x="28" y="-31" width="8" height="7" rx="1" fill="#FFFFFF"/><rect x="28" y="24" width="8" height="7" rx="1" fill="#FFFFFF"/></g>
<text x="612" y="447" font-size="26" font-weight="700" fill="#B91C1C">看不到動態</text>
<g transform="translate(796,438) scale(0.42)"><circle cx="0" cy="0" r="40" fill="#FFFFFF" stroke="#B91C1C" stroke-width="5"/><line x1="-15" y1="-15" x2="15" y2="15" stroke="#B91C1C" stroke-width="7" stroke-linecap="round"/><line x1="15" y1="-15" x2="-15" y2="15" stroke="#B91C1C" stroke-width="7" stroke-linecap="round"/></g>
<g transform="translate(566,512) scale(0.55)"><polygon points="-40,-14 -22,-14 0,-34 0,34 -22,14 -40,14" fill="#FFFFFF" stroke="#B91C1C" stroke-width="4" stroke-linejoin="round"/><line x1="12" y1="-14" x2="38" y2="12" stroke="#B91C1C" stroke-width="5" stroke-linecap="round"/><line x1="38" y1="-14" x2="12" y2="12" stroke="#B91C1C" stroke-width="5" stroke-linecap="round"/></g>
<text x="612" y="521" font-size="26" font-weight="700" fill="#B91C1C">聽不到同步</text>
<g transform="translate(796,512) scale(0.42)"><circle cx="0" cy="0" r="40" fill="#FFFFFF" stroke="#B91C1C" stroke-width="5"/><line x1="-15" y1="-15" x2="15" y2="15" stroke="#B91C1C" stroke-width="7" stroke-linecap="round"/><line x1="15" y1="-15" x2="-15" y2="15" stroke="#B91C1C" stroke-width="7" stroke-linecap="round"/></g>
<line x1="838" y1="370" x2="866" y2="370" stroke="#374151" stroke-width="3" marker-end="url(#arr)"/>
<rect x="870" y="168" width="282" height="404" rx="22" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
<g transform="translate(1011,236) scale(0.9)"><circle cx="0" cy="-22" r="18" fill="#8A5D00"/><path d="M-32,40 Q-32,2 0,2 Q32,2 32,40 Z" fill="#8A5D00"/></g>
<text x="1011" y="316" font-size="30" font-weight="700" text-anchor="middle" fill="#8A5D00">人看完整片</text>
<text x="1011" y="366" font-size="34" font-weight="700" text-anchor="middle" fill="#1F2937">交原本</text>
<text x="1011" y="410" font-size="34" font-weight="700" text-anchor="middle" fill="#1F2937">核准的那一版</text>
<text x="1011" y="470" font-size="22" text-anchor="middle" fill="#4B5563">對最大的改動：</text>
<text x="1011" y="508" font-size="26" font-weight="700" text-anchor="middle" fill="#B91C1C">「改了反而</text>
<text x="1011" y="544" font-size="26" font-weight="700" text-anchor="middle" fill="#B91C1C">效果很差」</text>
<rect x="48" y="606" width="1104" height="84" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/><text x="600.0" y="659" font-size="30" font-weight="700" text-anchor="middle"><tspan fill="#1F2937">分數適合</tspan><tspan fill="#8A5D00">排序問題</tspan><tspan fill="#1F2937">，不適合</tspan><tspan fill="#8A5D00">決定交哪一版</tspan></text>
</svg>

  <text x="880" y="420" font-size="24" font-weight="700" fill="#B45309">只有 1 支過關</text>
  <text x="760" y="518" font-size="24" font-weight="700" fill="#8A5D00">結論不是冠軍，</text>
  <text x="760" y="550" font-size="24" font-weight="700" fill="#8A5D00">是一張分工表</text>
  <rect x="48" y="612" width="1104" height="86" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="80" y="665.8" font-size="30" font-weight="700" fill="#1F2937">排行榜縮名單，<tspan fill="#8A5D00">你的考題</tspan>才決定誰適合你的鏡頭</text>

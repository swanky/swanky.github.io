<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1462" width="600" height="1462" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">鏡頭語言速查卡</title>
  <desc id="d">三層速查。第一層寫進指令：建立鏡頭、中景、中近景、特寫、推近、拉遠、推軌、跟拍、環繞、移焦、動機光、畫面內光源、低調光、框中框，一鏡只給一個主要運鏡。第二層寫進分鏡表：過肩、反應鏡頭、交叉剪輯、蒙太奇、慢動作、一鏡到底、溶接、淡入淡出，不塞進一次生成。第三層寫進全片風格：黑色電影、武俠、倒敘、伏筆、懸念結尾、調色、去飽和、底片顆粒，定一次每一鏡沿用。</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">一顆鏡頭，從報價到記帳</title>
  <desc id="d">送出前先看報價單，人核准這一張報價後才生成。能剪進成片，就記下實付與真正用到的秒數；不能用，先寫下失敗原因、改提示詞、首幀或秒數，再送第二次；還要第三次，要附新報價與失敗原因，由人單獨放行。失敗、被拒絕、下載不到也都要記帳。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1200" height="780" fill="#FFFFFF"/>
  <text x="48" y="80" font-size="48" font-weight="700" fill="#1F2937">一顆鏡頭，從報價到記帳</text>
  <text x="48" y="126" font-size="26" fill="#4B5563">每一次花錢之前有人點頭，每一次花完都有一列帳</text>
  <rect x="48" y="168" width="258" height="226" rx="24" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
  <circle cx="86" cy="206" r="24" fill="#2C5B8F"/>
  <text x="86" y="216.08" font-size="28" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <g transform="translate(177 238) scale(0.62)"><rect x="-38" y="-46" width="76" height="98" rx="9" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="5"/><rect x="-20" y="-56" width="40" height="20" rx="5" fill="#2C5B8F"/><line x1="-22" y1="-14" x2="24" y2="-14" stroke="#2C5B8F" stroke-width="5" stroke-linecap="round"/><line x1="-22" y1="6" x2="24" y2="6" stroke="#2C5B8F" stroke-width="5" stroke-linecap="round"/><line x1="-22" y1="26" x2="24" y2="26" stroke="#2C5B8F" stroke-width="5" stroke-linecap="round"/></g>
  <text x="177" y="316" font-size="30" font-weight="700" text-anchor="middle" fill="#2C5B8F">看報價單</text>
  <text x="177" y="352" font-size="22" text-anchor="middle" fill="#4B5563">模型、秒數、</text>
  <text x="177" y="382" font-size="22" text-anchor="middle" fill="#4B5563">解析度、單價</text>
  <line x1="308" y1="281" x2="326" y2="281" stroke="#374151" stroke-width="4" stroke-linecap="butt" marker-end="url(#arr)"/>
  <rect x="330" y="168" width="258" height="226" rx="24" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
  <circle cx="368" cy="206" r="24" fill="#E5A300"/>
  <text x="368" y="216.08" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937">2</text>
  <g transform="translate(459 238) scale(0.62)"><rect x="-14" y="-50" width="28" height="34" rx="8" fill="#E5A300"/><rect x="-40" y="-18" width="80" height="22" rx="6" fill="#E5A300"/><rect x="-48" y="10" width="96" height="10" rx="3" fill="#E5A300" opacity="0.45"/><path d="M-24,36 L-6,50 L26,26" fill="none" stroke="#E5A300" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="459" y="316" font-size="30" font-weight="700" text-anchor="middle" fill="#8A5D00">人核准</text>
  <text x="459" y="352" font-size="22" text-anchor="middle" fill="#4B5563">只對這一張</text>
  <text x="459" y="382" font-size="22" text-anchor="middle" fill="#4B5563">報價有效</text>
  <line x1="590" y1="281" x2="608" y2="281" stroke="#374151" stroke-width="4" stroke-linecap="butt" marker-end="url(#arr)"/>
  <rect x="612" y="168" width="258" height="226" rx="24" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
  <circle cx="650" cy="206" r="24" fill="#2C5B8F"/>
  <text x="650" y="216.08" font-size="28" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <g transform="translate(741 238) scale(0.62)"><rect x="-50" y="-30" width="70" height="56" rx="8" fill="#2C5B8F"/><path d="M20,-14 L48,-30 L48,26 L20,10 z" fill="#2C5B8F"/><circle cx="-15" cy="-2" r="14" fill="#FFFFFF"/><circle cx="-15" cy="-2" r="6" fill="#2C5B8F"/></g>
  <text x="741" y="316" font-size="30" font-weight="700" text-anchor="middle" fill="#2C5B8F">付費生成</text>
  <text x="741" y="352" font-size="22" text-anchor="middle" fill="#4B5563">生成這顆鏡頭</text>
  <line x1="872" y1="281" x2="890" y2="281" stroke="#374151" stroke-width="4" stroke-linecap="butt" marker-end="url(#arr)"/>
  <rect x="894" y="168" width="258" height="226" rx="24" fill="#FDF3E7" stroke="#B45309" stroke-width="3"/>
  <circle cx="932" cy="206" r="24" fill="#B45309"/>
  <text x="932" y="216.08" font-size="28" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <path d="M1023,206 L1063,238 L1023,270 L983,238 z" fill="#FFFFFF" stroke="#B45309" stroke-width="4"/>
  <text x="1023" y="248" font-size="30" font-weight="700" text-anchor="middle" fill="#B45309">?</text>
  <text x="1023" y="316" font-size="30" font-weight="700" text-anchor="middle" fill="#B45309">能剪進成片？</text>
  <text x="1023" y="352" font-size="22" text-anchor="middle" fill="#4B5563">看片後判斷</text>
  <line x1="1080" y1="396" x2="1080" y2="466" stroke="#374151" stroke-width="4" stroke-linecap="butt" marker-end="url(#arr)"/>
  <text x="1096" y="440" font-size="24" font-weight="700" fill="#0E7568">能</text>
  <rect x="894" y="470" width="258" height="170" rx="24" fill="#E6F4F1" stroke="#0E7568" stroke-width="3"/>
  <g transform="translate(1023 518) scale(0.5)"><circle r="46" fill="#0E7568"/><path d="M-20.7,0 L-4.6000000000000005,15.180000000000001 L22.08,-15.180000000000001" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="1023" y="582" font-size="30" font-weight="700" text-anchor="middle" fill="#0E7568">記帳</text>
  <text x="1023" y="618" font-size="22" text-anchor="middle" fill="#4B5563">實付＋用到的秒數</text>
  <path d="M960,396 L960,430 L760,430 L760,466" fill="none" stroke="#374151" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/>
  <text x="860" y="420" font-size="24" font-weight="700" text-anchor="middle" fill="#B91C1C">不能</text>
  <rect x="470" y="470" width="380" height="170" rx="24" fill="#FDECEC" stroke="#B91C1C" stroke-width="3"/>
  <text x="660" y="520" font-size="30" font-weight="700" text-anchor="middle" fill="#B91C1C">先寫下失敗原因</text>
  <text x="660" y="562" font-size="24" text-anchor="middle" fill="#4B5563">改提示詞、首幀或秒數</text>
  <text x="660" y="600" font-size="24" text-anchor="middle" fill="#4B5563">每顆預設最多兩次</text>
  <line x1="660" y1="466" x2="660" y2="400" stroke="#374151" stroke-width="4" stroke-linecap="butt" marker-end="url(#arr)"/>
  <text x="676" y="444" font-size="22" font-weight="700" fill="#B91C1C">第 2 次</text>
  <line x1="466" y1="555" x2="426" y2="555" stroke="#374151" stroke-width="4" stroke-linecap="butt" marker-end="url(#arr)"/>
  <rect x="48" y="470" width="374" height="170" rx="24" fill="#FDF3E7" stroke="#B45309" stroke-width="3"/>
  <text x="235" y="520" font-size="30" font-weight="700" text-anchor="middle" fill="#B45309">還要第 3 次？</text>
  <text x="235" y="562" font-size="24" text-anchor="middle" fill="#4B5563">附新報價＋失敗原因，</text>
  <text x="235" y="600" font-size="24" text-anchor="middle" fill="#4B5563">由人單獨放行</text>
  <line x1="177" y1="466" x2="177" y2="400" stroke="#374151" stroke-width="4" stroke-linecap="butt" marker-end="url(#arr)"/>
  <text x="193" y="444" font-size="22" font-weight="700" fill="#B45309">新報價</text>
  <rect x="48" y="670" width="1104" height="80" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="600.0" y="720.8" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937">失敗、被拒絕、下載不到，<tspan fill="#8A5D00">也都要記帳</tspan></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">五條停損線：從賽前到交件</title>
<desc id="d">五個階段各守一條停損線。賽前：只準備流程，正式作品不預做，自己要長期保有的角色不放進作品。開賽：先做最短規格的小測試再設預算上限，付費前先看估價、人工核准才送。生成中：每顆鏡頭最多兩抽，卡住的請求只續查、不重送。交件前一晚：列出今晚不要修清單，備好 15 分鐘方案。決定交哪一版：AI 評分只拿來排序問題，由人看完整片決定。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5A300"/></marker></defs>
<rect width="1200" height="720" fill="#FFFFFF"/>
<text x="48" y="80" font-size="48" font-weight="700" fill="#1F2937">五條停損線：從賽前到交件</text><text x="48" y="126" font-size="26" fill="#4B5563">每個階段先畫好「到這裡就停」的線，到了就停，不臨場討論</text>
<rect x="48" y="168" width="200" height="410" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="82" cy="206" r="24" fill="#2C5B8F"/><text x="82" y="216" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">1</text>
<text x="148.0" y="276" font-size="32" font-weight="700" text-anchor="middle" fill="#2C5B8F">賽前</text>
<g transform="translate(152.0,336) scale(0.95)"><rect x="-50" y="-8" width="10" height="56" rx="3" fill="#374151"/><rect x="-60" y="44" width="30" height="8" rx="3" fill="#374151"/><rect x="-40" y="-14" width="18" height="18" fill="#B91C1C"/><rect x="-22" y="-14" width="18" height="18" fill="#FFFFFF"/><rect x="-4" y="-14" width="18" height="18" fill="#B91C1C"/><rect x="14" y="-14" width="18" height="18" fill="#FFFFFF"/><rect x="32" y="-14" width="18" height="18" fill="#B91C1C"/><rect x="-40" y="-14" width="90" height="18" rx="2" fill="none" stroke="#B91C1C" stroke-width="3"/><circle cx="-45" cy="-5" r="9" fill="#B91C1C"/></g>
<text x="148.0" y="430" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">只準備流程</text>
<text x="148.0" y="466" font-size="26" text-anchor="middle" fill="#4B5563">作品不預做</text>
<text x="148.0" y="502" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">自己的角色</text>
<text x="148.0" y="538" font-size="26" text-anchor="middle" fill="#4B5563">不放進作品</text>
<line x1="250" y1="266" x2="272" y2="266" stroke="#374151" stroke-width="3" marker-end="url(#arr)"/>
<rect x="274" y="168" width="200" height="410" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="308" cy="206" r="24" fill="#2C5B8F"/><text x="308" y="216" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">2</text>
<text x="374.0" y="276" font-size="32" font-weight="700" text-anchor="middle" fill="#2C5B8F">開賽</text>
<g transform="translate(378.0,336) scale(0.95)"><rect x="-50" y="-8" width="10" height="56" rx="3" fill="#374151"/><rect x="-60" y="44" width="30" height="8" rx="3" fill="#374151"/><rect x="-40" y="-14" width="18" height="18" fill="#B91C1C"/><rect x="-22" y="-14" width="18" height="18" fill="#FFFFFF"/><rect x="-4" y="-14" width="18" height="18" fill="#B91C1C"/><rect x="14" y="-14" width="18" height="18" fill="#FFFFFF"/><rect x="32" y="-14" width="18" height="18" fill="#B91C1C"/><rect x="-40" y="-14" width="90" height="18" rx="2" fill="none" stroke="#B91C1C" stroke-width="3"/><circle cx="-45" cy="-5" r="9" fill="#B91C1C"/></g>
<text x="374.0" y="430" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">先小測</text>
<text x="374.0" y="466" font-size="26" text-anchor="middle" fill="#4B5563">再設上限</text>
<text x="374.0" y="502" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">看估價、</text>
<text x="374.0" y="538" font-size="26" text-anchor="middle" fill="#4B5563">人核准才送</text>
<line x1="476" y1="266" x2="498" y2="266" stroke="#374151" stroke-width="3" marker-end="url(#arr)"/>
<rect x="500" y="168" width="200" height="410" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="534" cy="206" r="24" fill="#2C5B8F"/><text x="534" y="216" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">3</text>
<text x="600.0" y="276" font-size="32" font-weight="700" text-anchor="middle" fill="#2C5B8F">生成中</text>
<g transform="translate(604.0,336) scale(0.95)"><rect x="-50" y="-8" width="10" height="56" rx="3" fill="#374151"/><rect x="-60" y="44" width="30" height="8" rx="3" fill="#374151"/><rect x="-40" y="-14" width="18" height="18" fill="#B91C1C"/><rect x="-22" y="-14" width="18" height="18" fill="#FFFFFF"/><rect x="-4" y="-14" width="18" height="18" fill="#B91C1C"/><rect x="14" y="-14" width="18" height="18" fill="#FFFFFF"/><rect x="32" y="-14" width="18" height="18" fill="#B91C1C"/><rect x="-40" y="-14" width="90" height="18" rx="2" fill="none" stroke="#B91C1C" stroke-width="3"/><circle cx="-45" cy="-5" r="9" fill="#B91C1C"/></g>
<text x="600.0" y="430" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">每顆鏡頭</text>
<text x="600.0" y="466" font-size="26" text-anchor="middle" fill="#4B5563">最多兩抽</text>
<text x="600.0" y="502" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">卡住只續查</text>
<text x="600.0" y="538" font-size="26" text-anchor="middle" fill="#4B5563">絕不重送</text>
<line x1="702" y1="266" x2="724" y2="266" stroke="#374151" stroke-width="3" marker-end="url(#arr)"/>
<rect x="726" y="168" width="200" height="410" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="760" cy="206" r="24" fill="#2C5B8F"/><text x="760" y="216" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">4</text>
<text x="826.0" y="276" font-size="30" font-weight="700" text-anchor="middle" fill="#2C5B8F">交件前一晚</text>
<g transform="translate(830.0,336) scale(0.95)"><rect x="-50" y="-8" width="10" height="56" rx="3" fill="#374151"/><rect x="-60" y="44" width="30" height="8" rx="3" fill="#374151"/><rect x="-40" y="-14" width="18" height="18" fill="#B91C1C"/><rect x="-22" y="-14" width="18" height="18" fill="#FFFFFF"/><rect x="-4" y="-14" width="18" height="18" fill="#B91C1C"/><rect x="14" y="-14" width="18" height="18" fill="#FFFFFF"/><rect x="32" y="-14" width="18" height="18" fill="#B91C1C"/><rect x="-40" y="-14" width="90" height="18" rx="2" fill="none" stroke="#B91C1C" stroke-width="3"/><circle cx="-45" cy="-5" r="9" fill="#B91C1C"/></g>
<text x="826.0" y="430" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">列出今晚</text>
<text x="826.0" y="466" font-size="26" text-anchor="middle" fill="#4B5563">不要修清單</text>
<text x="826.0" y="502" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">備好 15 分</text>
<text x="826.0" y="538" font-size="26" text-anchor="middle" fill="#4B5563">鐘最小方案</text>
<line x1="928" y1="266" x2="950" y2="266" stroke="#374151" stroke-width="3" marker-end="url(#arr)"/>
<rect x="952" y="168" width="200" height="410" rx="22" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
<circle cx="986" cy="206" r="24" fill="#E5A300"/><text x="986" y="216" text-anchor="middle" font-size="28" font-weight="700" fill="#1F2937">5</text>
<text x="1052.0" y="276" font-size="30" font-weight="700" text-anchor="middle" fill="#8A5D00">決定交哪版</text>
<g transform="translate(1056.0,336) scale(0.95)"><rect x="-50" y="-8" width="10" height="56" rx="3" fill="#374151"/><rect x="-60" y="44" width="30" height="8" rx="3" fill="#374151"/><rect x="-40" y="-14" width="18" height="18" fill="#E5A300"/><rect x="-22" y="-14" width="18" height="18" fill="#FFFFFF"/><rect x="-4" y="-14" width="18" height="18" fill="#E5A300"/><rect x="14" y="-14" width="18" height="18" fill="#FFFFFF"/><rect x="32" y="-14" width="18" height="18" fill="#E5A300"/><rect x="-40" y="-14" width="90" height="18" rx="2" fill="none" stroke="#E5A300" stroke-width="3"/><circle cx="-45" cy="-5" r="9" fill="#E5A300"/></g>
<text x="1052.0" y="430" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">AI 評分</text>
<text x="1052.0" y="466" font-size="26" text-anchor="middle" fill="#4B5563">只排序問題</text>
<text x="1052.0" y="502" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">人看完整片</text>
<text x="1052.0" y="538" font-size="26" text-anchor="middle" fill="#4B5563">決定交哪版</text>
<rect x="48" y="606" width="1104" height="84" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/><text x="600.0" y="659" font-size="30" font-weight="700" text-anchor="middle"><tspan fill="#1F2937">最後一條最關鍵：</tspan><tspan fill="#8A5D00">分數排序問題，人決定交哪一版</tspan></text>
</svg>

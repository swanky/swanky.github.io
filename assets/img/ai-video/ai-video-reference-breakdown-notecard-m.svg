<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1026" width="600" height="1026" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">參考案例筆記卡：只寫四件事</title>
<desc id="d">一張參考案例筆記卡的範本，以虛構的示意範例填寫，不是真實案例。範例是一支宣稱「一句提示詞生成 30 秒」的城市雨夜短片。第一欄為什麼值得看：雨夜反光的光影很穩。第二欄可以學什麼：先固定參考圖，再寫燈光。第三欄哪裡不能信（紅色強調）：沒附提示詞，看起來是多段剪接。第四欄適不適合我的案子：我的案子要長鏡頭，風險高。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5A300"/></marker></defs>
<rect width="600" height="1026" fill="#FFFFFF"/>
<text x="40" y="72" font-size="42" font-weight="700" fill="#1F2937">參考案例筆記卡</text>
<text x="40" y="114" font-size="24" fill="#4B5563">每支只寫四件事；下面是虛構示意</text>
<rect x="40" y="146" width="520" height="120" rx="18" fill="#F1F5F9"/>
<text x="64" y="194" font-size="28" font-weight="700" fill="#1F2937">案例：城市雨夜短片</text>
<text x="64" y="238" font-size="24" fill="#4B5563">宣稱「一句提示詞生成 30 秒」</text>
<g transform="translate(470,186) rotate(-6)"><rect x="-40" y="-24" width="80" height="48" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="3" stroke-dasharray="8 5"/><text x="0" y="9" text-anchor="middle" font-size="22" font-weight="700" fill="#B91C1C">示意</text></g>
<rect x="40" y="286" width="520" height="130" rx="18" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
<circle cx="76" cy="326" r="22" fill="#2C5B8F"/><text x="76" y="335" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">1</text>
<text x="112" y="336" font-size="30" font-weight="700" fill="#2C5B8F">為什麼值得看</text>
<text x="64" y="386" font-size="24" fill="#4B5563">雨夜反光的光影很穩</text>
<rect x="40" y="432" width="520" height="130" rx="18" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
<circle cx="76" cy="472" r="22" fill="#0E7568"/><text x="76" y="481" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">2</text>
<text x="112" y="482" font-size="30" font-weight="700" fill="#0E7568">可以學什麼</text>
<text x="64" y="532" font-size="24" fill="#4B5563">先固定參考圖，再寫燈光</text>
<rect x="40" y="578" width="520" height="130" rx="18" fill="#FDECEC" stroke="#B91C1C" stroke-width="3"/>
<circle cx="76" cy="618" r="22" fill="#B91C1C"/><text x="76" y="627" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">3</text>
<text x="112" y="628" font-size="30" font-weight="700" fill="#B91C1C">哪裡不能信</text>
<text x="64" y="678" font-size="24" font-weight="700" fill="#1F2937">沒附提示詞；看起來是多段剪接</text>
<g transform="translate(506,622) scale(0.55)"><circle cx="-8" cy="-8" r="28" fill="#FFFFFF" stroke="#B91C1C" stroke-width="6"/><line x1="12" y1="12" x2="38" y2="38" stroke="#B91C1C" stroke-width="10" stroke-linecap="round"/></g>
<rect x="40" y="724" width="520" height="130" rx="18" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
<circle cx="76" cy="764" r="22" fill="#B45309"/><text x="76" y="773" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">4</text>
<text x="112" y="774" font-size="30" font-weight="700" fill="#B45309">適不適合我</text>
<text x="64" y="824" font-size="24" fill="#4B5563">我的案子要長鏡頭，風險高</text>
<rect x="40" y="874" width="520" height="116" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/><text x="300.0" y="924" font-size="26" font-weight="700" text-anchor="middle"><tspan fill="#1F2937">最有用的是第三欄：</tspan></text><text x="300.0" y="959" font-size="26" font-weight="700" text-anchor="middle"><tspan fill="#8A5D00">先寫下哪裡不能信</tspan></text>
</svg>

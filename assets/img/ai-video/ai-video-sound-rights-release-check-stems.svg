  <rect x="1030" y="430.0" width="10" height="28" rx="3" fill="#B45309"/>
  <rect x="1078" y="426.0" width="62" height="36" fill="#F8FAFC"/>
  <text x="1136" y="452.0" font-size="22" font-weight="700" text-anchor="end" fill="#B45309">不動</text>
  <text x="48" y="524.0" font-size="26" font-weight="700" fill="#8A5D00">音樂</text>
  <rect x="210" y="486" width="942" height="56" rx="10" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
  <path d="M220,498 H520 L566,534 H854 L900,498 H1142" fill="none" stroke="#E5A300" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="710.0" y="524" font-size="22" font-weight="700" text-anchor="middle" fill="#8A5D00">−6 dB</text>
  <text x="48" y="594.0" font-size="26" font-weight="700" fill="#64748B">轉場音效</text>
  <rect x="210" y="556" width="942" height="56" rx="10" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="230" y="568" width="50" height="32" rx="8" fill="#94A3B8"/>
  <rect x="1082" y="568" width="50" height="32" rx="8" fill="#94A3B8"/>
  <text x="600" y="664" font-size="24" text-anchor="middle" fill="#4B5563">漸變：提前一點降、說完再慢慢回來，不要一格一格硬切</text>
  <rect x="48" y="690" width="1104" height="76" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="600.0" y="739" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937">推動劇情的聲音（門鎖、鑰匙）<tspan fill="#8A5D00">不跟著壓小</tspan></text>
</svg>

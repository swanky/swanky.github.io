  <text x="710.0" y="362" font-size="22" font-weight="700" text-anchor="middle" fill="#0E7568">−3 dB</text>
  <text x="48" y="454.0" font-size="26" font-weight="700" fill="#B45309">擬音</text>
  <rect x="210" y="416" width="942" height="56" rx="10" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="220" y1="444.0" x2="1068" y2="444.0" stroke="#B45309" stroke-width="4" stroke-linecap="round"/>
  <rect x="260" y="430.0" width="10" height="28" rx="3" fill="#B45309"/>
  <rect x="330" y="430.0" width="10" height="28" rx="3" fill="#B45309"/>
  <rect x="400" y="430.0" width="10" height="28" rx="3" fill="#B45309"/>
  <rect x="470" y="430.0" width="10" height="28" rx="3" fill="#B45309"/>
  <rect x="540" y="430.0" width="10" height="28" rx="3" fill="#B45309"/>
  <rect x="610" y="430.0" width="10" height="28" rx="3" fill="#B45309"/>
  <rect x="680" y="430.0" width="10" height="28" rx="3" fill="#B45309"/>
  <rect x="750" y="430.0" width="10" height="28" rx="3" fill="#B45309"/>
  <rect x="820" y="430.0" width="10" height="28" rx="3" fill="#B45309"/>

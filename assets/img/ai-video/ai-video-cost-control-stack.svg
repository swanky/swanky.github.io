<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">一顆鏡頭的錢，是怎麼疊高的</title>
  <desc id="d">一顆 15 秒、720p 的鏡頭實付約 3.48 美元，單看不貴。再疊上三件事：一、秒數，鏡頭拉長價格跟著往上；二、重抽，不滿意再生一次，每次都是全額；三、AI 助手太勤勞，沒有規則擋著，可能把同一個錯誤再生好幾次。別漏算重來、失敗和沒人記得的那幾次。</desc>

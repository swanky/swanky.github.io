<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1238" width="600" height="1238" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">五條停損線：從賽前到交件</title>
<desc id="d">五個階段各守一條停損線。賽前：只準備流程，正式作品不預做，自己要長期保有的角色不放進作品。開賽：先做最短規格的小測試再設預算上限，付費前先看估價、人工核准才送。生成中：每顆鏡頭最多兩抽，卡住的請求只續查、不重送。交件前一晚：列出今晚不要修清單，備好 15 分鐘方案。決定交哪一版：AI 評分只拿來排序問題，由人看完整片決定。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5A300"/></marker></defs>
<rect width="600" height="1238" fill="#FFFFFF"/>
<text x="40" y="72" font-size="42" font-weight="700" fill="#1F2937">五條停損線</text>
<text x="40" y="114" font-size="24" fill="#4B5563">從賽前到交件，每段先畫好停在哪</text>
<rect x="40" y="146" width="520" height="168" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="76" cy="186" r="22" fill="#2C5B8F"/><text x="76" y="195" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">1</text>
<text x="112" y="198" font-size="34" font-weight="700" fill="#2C5B8F">賽前</text>
<g transform="translate(488,192) scale(0.62)"><rect x="-50" y="-8" width="10" height="56" rx="3" fill="#374151"/><rect x="-60" y="44" width="30" height="8" rx="3" fill="#374151"/><rect x="-40" y="-14" width="18" height="18" fill="#B91C1C"/><rect x="-22" y="-14" width="18" height="18" fill="#FFFFFF"/><rect x="-4" y="-14" width="18" height="18" fill="#B91C1C"/><rect x="14" y="-14" width="18" height="18" fill="#FFFFFF"/><rect x="32" y="-14" width="18" height="18" fill="#B91C1C"/><rect x="-40" y="-14" width="90" height="18" rx="2" fill="none" stroke="#B91C1C" stroke-width="3"/><circle cx="-45" cy="-5" r="9" fill="#B91C1C"/></g>
<text x="58" y="252" font-size="24" font-weight="700" fill="#1F2937">只準備流程，正式作品不預做</text>
<text x="58" y="290" font-size="24" fill="#4B5563">自己要保有的角色不放進作品</text>
<rect x="40" y="334" width="520" height="168" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="76" cy="374" r="22" fill="#2C5B8F"/><text x="76" y="383" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">2</text>
<text x="112" y="386" font-size="34" font-weight="700" fill="#2C5B8F">開賽</text>
<g transform="translate(488,380) scale(0.62)"><rect x="-50" y="-8" width="10" height="56" rx="3" fill="#374151"/><rect x="-60" y="44" width="30" height="8" rx="3" fill="#374151"/><rect x="-40" y="-14" width="18" height="18" fill="#B91C1C"/><rect x="-22" y="-14" width="18" height="18" fill="#FFFFFF"/><rect x="-4" y="-14" width="18" height="18" fill="#B91C1C"/><rect x="14" y="-14" width="18" height="18" fill="#FFFFFF"/><rect x="32" y="-14" width="18" height="18" fill="#B91C1C"/><rect x="-40" y="-14" width="90" height="18" rx="2" fill="none" stroke="#B91C1C" stroke-width="3"/><circle cx="-45" cy="-5" r="9" fill="#B91C1C"/></g>
<text x="58" y="440" font-size="24" font-weight="700" fill="#1F2937">先做最短規格小測，再設上限</text>
<text x="58" y="478" font-size="24" fill="#4B5563">看估價、人工核准才送</text>
<rect x="40" y="522" width="520" height="168" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="76" cy="562" r="22" fill="#2C5B8F"/><text x="76" y="571" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">3</text>
<text x="112" y="574" font-size="34" font-weight="700" fill="#2C5B8F">生成中</text>
<g transform="translate(488,568) scale(0.62)"><rect x="-50" y="-8" width="10" height="56" rx="3" fill="#374151"/><rect x="-60" y="44" width="30" height="8" rx="3" fill="#374151"/><rect x="-40" y="-14" width="18" height="18" fill="#B91C1C"/><rect x="-22" y="-14" width="18" height="18" fill="#FFFFFF"/><rect x="-4" y="-14" width="18" height="18" fill="#B91C1C"/><rect x="14" y="-14" width="18" height="18" fill="#FFFFFF"/><rect x="32" y="-14" width="18" height="18" fill="#B91C1C"/><rect x="-40" y="-14" width="90" height="18" rx="2" fill="none" stroke="#B91C1C" stroke-width="3"/><circle cx="-45" cy="-5" r="9" fill="#B91C1C"/></g>
<text x="58" y="628" font-size="24" font-weight="700" fill="#1F2937">每顆鏡頭最多兩抽</text>
<text x="58" y="666" font-size="24" fill="#4B5563">卡住的請求只續查，不重送</text>
<rect x="40" y="710" width="520" height="168" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="76" cy="750" r="22" fill="#2C5B8F"/><text x="76" y="759" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">4</text>
<text x="112" y="762" font-size="34" font-weight="700" fill="#2C5B8F">交件前一晚</text>
<g transform="translate(488,756) scale(0.62)"><rect x="-50" y="-8" width="10" height="56" rx="3" fill="#374151"/><rect x="-60" y="44" width="30" height="8" rx="3" fill="#374151"/><rect x="-40" y="-14" width="18" height="18" fill="#B91C1C"/><rect x="-22" y="-14" width="18" height="18" fill="#FFFFFF"/><rect x="-4" y="-14" width="18" height="18" fill="#B91C1C"/><rect x="14" y="-14" width="18" height="18" fill="#FFFFFF"/><rect x="32" y="-14" width="18" height="18" fill="#B91C1C"/><rect x="-40" y="-14" width="90" height="18" rx="2" fill="none" stroke="#B91C1C" stroke-width="3"/><circle cx="-45" cy="-5" r="9" fill="#B91C1C"/></g>
<text x="58" y="816" font-size="24" font-weight="700" fill="#1F2937">列出「今晚不要修」清單</text>
<text x="58" y="854" font-size="24" fill="#4B5563">備好 15 分鐘做得完的方案</text>
<rect x="40" y="898" width="520" height="168" rx="22" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
<circle cx="76" cy="938" r="22" fill="#E5A300"/><text x="76" y="947" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">5</text>
<text x="112" y="950" font-size="34" font-weight="700" fill="#8A5D00">決定交哪版</text>
<g transform="translate(488,944) scale(0.62)"><rect x="-50" y="-8" width="10" height="56" rx="3" fill="#374151"/><rect x="-60" y="44" width="30" height="8" rx="3" fill="#374151"/><rect x="-40" y="-14" width="18" height="18" fill="#E5A300"/><rect x="-22" y="-14" width="18" height="18" fill="#FFFFFF"/><rect x="-4" y="-14" width="18" height="18" fill="#E5A300"/><rect x="14" y="-14" width="18" height="18" fill="#FFFFFF"/><rect x="32" y="-14" width="18" height="18" fill="#E5A300"/><rect x="-40" y="-14" width="90" height="18" rx="2" fill="none" stroke="#E5A300" stroke-width="3"/><circle cx="-45" cy="-5" r="9" fill="#E5A300"/></g>
<text x="58" y="1004" font-size="24" font-weight="700" fill="#1F2937">AI 評分只拿來排序問題</text>
<text x="58" y="1042" font-size="24" fill="#4B5563">由人看完整片決定交哪一版</text>
<rect x="40" y="1086" width="520" height="116" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/><text x="300.0" y="1136" font-size="26" font-weight="700" text-anchor="middle"><tspan fill="#1F2937">最後一條最關鍵：</tspan></text><text x="300.0" y="1171" font-size="26" font-weight="700" text-anchor="middle"><tspan fill="#8A5D00">分數排序問題，人決定交哪一版</tspan></text>
</svg>

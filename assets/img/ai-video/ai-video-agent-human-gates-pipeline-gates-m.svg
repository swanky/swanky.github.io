<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1010" width="600" height="1010" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">旗子插在花錢和發布之前</title>
  <desc id="d">影片產線：劇本、時間、關鍵畫面、預算、生成、審片、發布。劇本到預算還沒花錢，生成開始花錢，發布是對外公開。五道人工關卡用金色旗子標在花錢與發布之前：時間先定長度、關鍵畫面要人核准、預算列報價與上限、生成只送可以公開的素材、發布另外核准。已授權的不重問，沒授權的動作一定停得下來。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C5B8F"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E7568"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
    <marker id="arr-gold" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5A300"/></marker>
  </defs>
  <rect width="600" height="1010" fill="#FFFFFF"/>
  <text x="40" y="70" font-size="40" font-weight="700" fill="#1F2937">旗子插在</text>
  <text x="40" y="122" font-size="40" font-weight="700" fill="#1F2937">花錢和發布之前</text>
  <text x="40" y="164" font-size="24" fill="#4B5563">最值得先設的五道人工關卡</text>
  <rect x="40" y="202" width="520" height="364" rx="16" fill="#E6F4F1" stroke="#0E7568" stroke-width="2"/>
  <text x="66" y="384" font-size="24" font-weight="700" fill="#0E7568" text-anchor="middle" transform="rotate(-90 66 384)">還沒花錢</text>
  <rect x="40" y="570" width="520" height="180" rx="16" fill="#FDF3E7" stroke="#B45309" stroke-width="2"/>
  <text x="66" y="660" font-size="24" font-weight="700" fill="#B45309" text-anchor="middle" transform="rotate(-90 66 660)">開始花錢</text>
  <rect x="40" y="754" width="520" height="88" rx="16" fill="#FDECEC" stroke="#B91C1C" stroke-width="2"/>
  <text x="66" y="798" font-size="24" font-weight="700" fill="#B91C1C" text-anchor="middle" transform="rotate(-90 66 798)">公開</text>
  <rect x="96" y="210" width="190" height="72" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="191" y="256" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">劇本</text>
  <line x1="191" y1="284" x2="191" y2="298" stroke="#374151" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
  <rect x="96" y="302" width="190" height="72" rx="14" fill="#FFFFFF" stroke="#E5A300" stroke-width="4"/>
  <text x="191" y="348" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">時間</text>
  <line x1="191" y1="376" x2="191" y2="390" stroke="#374151" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
  <g transform="translate(318 340) scale(0.6)"><line x1="-20" y1="-46" x2="-20" y2="46" stroke="#374151" stroke-width="6" stroke-linecap="round"/><path d="M-18,-44 L34,-30 L-18,-14 z" fill="#E5A300"/></g>
  <text x="350" y="348" font-size="26" font-weight="700" fill="#8A5D00">先定長度</text>
  <rect x="96" y="394" width="190" height="72" rx="14" fill="#FFFFFF" stroke="#E5A300" stroke-width="4"/>
  <text x="191" y="440" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">關鍵畫面</text>
  <line x1="191" y1="468" x2="191" y2="482" stroke="#374151" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
  <g transform="translate(318 432) scale(0.6)"><line x1="-20" y1="-46" x2="-20" y2="46" stroke="#374151" stroke-width="6" stroke-linecap="round"/><path d="M-18,-44 L34,-30 L-18,-14 z" fill="#E5A300"/></g>
  <text x="350" y="440" font-size="26" font-weight="700" fill="#8A5D00">人核准畫面</text>
  <rect x="96" y="486" width="190" height="72" rx="14" fill="#FFFFFF" stroke="#E5A300" stroke-width="4"/>
  <text x="191" y="532" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">預算</text>
  <line x1="191" y1="560" x2="191" y2="574" stroke="#374151" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
  <g transform="translate(318 524) scale(0.6)"><line x1="-20" y1="-46" x2="-20" y2="46" stroke="#374151" stroke-width="6" stroke-linecap="round"/><path d="M-18,-44 L34,-30 L-18,-14 z" fill="#E5A300"/></g>
  <text x="350" y="532" font-size="26" font-weight="700" fill="#8A5D00">報價與上限</text>
  <rect x="96" y="578" width="190" height="72" rx="14" fill="#FFFFFF" stroke="#E5A300" stroke-width="4"/>
  <text x="191" y="624" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">生成</text>
  <line x1="191" y1="652" x2="191" y2="666" stroke="#374151" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
  <g transform="translate(318 616) scale(0.6)"><line x1="-20" y1="-46" x2="-20" y2="46" stroke="#374151" stroke-width="6" stroke-linecap="round"/><path d="M-18,-44 L34,-30 L-18,-14 z" fill="#E5A300"/></g>
  <text x="350" y="624" font-size="26" font-weight="700" fill="#8A5D00">只送可公開</text>
  <rect x="96" y="670" width="190" height="72" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="191" y="716" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">審片</text>
  <line x1="191" y1="744" x2="191" y2="758" stroke="#374151" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
  <rect x="96" y="762" width="190" height="72" rx="14" fill="#FFFFFF" stroke="#E5A300" stroke-width="4"/>
  <text x="191" y="808" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">發布</text>
  <g transform="translate(318 800) scale(0.6)"><line x1="-20" y1="-46" x2="-20" y2="46" stroke="#374151" stroke-width="6" stroke-linecap="round"/><path d="M-18,-44 L34,-30 L-18,-14 z" fill="#E5A300"/></g>
  <text x="350" y="808" font-size="26" font-weight="700" fill="#8A5D00">另外核准</text>
  <rect x="40" y="870" width="520" height="110" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="300.0" y="915" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937">已授權的不重問；</text>
  <text x="300.0" y="955" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan fill="#8A5D00">沒授權的，一定停得下來</tspan></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1194" width="600" height="1194" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">生成，只是八站裡的一站</title>
  <desc id="d">AI 影片的八站路線：需求確認、腳本、分鏡、動態分鏡、關鍵畫面、素材製作、後製、驗收交付。每兩站之間都有一個核准點，確認後才往下走。付費的 AI 生成只發生在第六站素材製作。越晚改動，要退回重做的站越多。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5A300"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C5B8F"/></marker>
  </defs>
  <rect width="600" height="1194" fill="#FFFFFF"/>
  <text x="40" y="66" font-size="40" font-weight="700" fill="#1F2937">生成，只是</text>
  <text x="40" y="118" font-size="40" font-weight="700" fill="#1F2937">八站裡的一站</text>
  <text x="40" y="162" font-size="24" fill="#4B5563">每站之間有核准點，</text>
  <text x="40" y="196" font-size="24" fill="#4B5563">付費生成只在第六站</text>
  <rect x="82" y="254" width="16" height="700" rx="8" fill="#2C5B8F"/>
  <g transform="translate(90,304) scale(0.3)"><circle r="40" fill="#FFFFFF" stroke="#0E7568" stroke-width="5"/><path d="M-18,0 L-4,14 L20,-14" fill="none" stroke="#0E7568" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(90,404) scale(0.3)"><circle r="40" fill="#FFFFFF" stroke="#0E7568" stroke-width="5"/><path d="M-18,0 L-4,14 L20,-14" fill="none" stroke="#0E7568" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(90,504) scale(0.3)"><circle r="40" fill="#FFFFFF" stroke="#0E7568" stroke-width="5"/><path d="M-18,0 L-4,14 L20,-14" fill="none" stroke="#0E7568" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(90,604) scale(0.3)"><circle r="40" fill="#FFFFFF" stroke="#0E7568" stroke-width="5"/><path d="M-18,0 L-4,14 L20,-14" fill="none" stroke="#0E7568" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(90,704) scale(0.3)"><circle r="40" fill="#FFFFFF" stroke="#0E7568" stroke-width="5"/><path d="M-18,0 L-4,14 L20,-14" fill="none" stroke="#0E7568" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(90,804) scale(0.3)"><circle r="40" fill="#FFFFFF" stroke="#0E7568" stroke-width="5"/><path d="M-18,0 L-4,14 L20,-14" fill="none" stroke="#0E7568" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(90,904) scale(0.3)"><circle r="40" fill="#FFFFFF" stroke="#0E7568" stroke-width="5"/><path d="M-18,0 L-4,14 L20,-14" fill="none" stroke="#0E7568" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <circle cx="90" cy="254" r="26" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="5"/>
  <text x="90" y="263" text-anchor="middle" font-size="26" font-weight="700" fill="#2C5B8F">1</text>
  <text x="146" y="265" font-size="30" font-weight="700" fill="#1F2937">需求確認</text>
  <circle cx="90" cy="354" r="26" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="5"/>
  <text x="90" y="363" text-anchor="middle" font-size="26" font-weight="700" fill="#2C5B8F">2</text>
  <text x="146" y="365" font-size="30" font-weight="700" fill="#1F2937">腳本</text>
  <circle cx="90" cy="454" r="26" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="5"/>
  <text x="90" y="463" text-anchor="middle" font-size="26" font-weight="700" fill="#2C5B8F">3</text>
  <text x="146" y="465" font-size="30" font-weight="700" fill="#1F2937">分鏡</text>
  <circle cx="90" cy="554" r="26" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="5"/>
  <text x="90" y="563" text-anchor="middle" font-size="26" font-weight="700" fill="#2C5B8F">4</text>
  <text x="146" y="565" font-size="30" font-weight="700" fill="#1F2937">動態分鏡</text>
  <circle cx="90" cy="654" r="26" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="5"/>
  <text x="90" y="663" text-anchor="middle" font-size="26" font-weight="700" fill="#2C5B8F">5</text>
  <text x="146" y="665" font-size="30" font-weight="700" fill="#1F2937">關鍵畫面</text>
  <circle cx="90" cy="754" r="34" fill="#FFF8E7" stroke="#E5A300" stroke-width="6"/>
  <text x="90" y="764" text-anchor="middle" font-size="28" font-weight="700" fill="#8A5D00">6</text>
  <text x="146" y="765" font-size="30" font-weight="700" fill="#8A5D00">素材製作</text>
  <rect x="300" y="720" width="260" height="68" rx="16" fill="#FFF8E7" stroke="#E5A300" stroke-width="4"/>
  <g transform="translate(338,754) scale(0.6)"><circle r="30" fill="#E5A300"/><circle r="22" fill="none" stroke="#FFF8E7" stroke-width="3"/><text x="0" y="10" text-anchor="middle" font-size="28" font-weight="700" fill="#1F2937">$</text></g>
  <text x="372" y="763" font-size="26" font-weight="700" fill="#8A5D00">付費只在這站</text>
  <circle cx="90" cy="854" r="26" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="5"/>
  <text x="90" y="863" text-anchor="middle" font-size="26" font-weight="700" fill="#2C5B8F">7</text>
  <text x="146" y="865" font-size="30" font-weight="700" fill="#1F2937">後製</text>
  <circle cx="90" cy="954" r="26" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="5"/>
  <text x="90" y="963" text-anchor="middle" font-size="26" font-weight="700" fill="#2C5B8F">8</text>
  <text x="146" y="965" font-size="30" font-weight="700" fill="#1F2937">驗收交付</text>
  <g transform="translate(62,1016) scale(0.36)"><circle r="40" fill="#FFFFFF" stroke="#0E7568" stroke-width="5"/><path d="M-18,0 L-4,14 L20,-14" fill="none" stroke="#0E7568" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="88" y="1024" font-size="26" fill="#4B5563">核准點：確認後才往下走</text>
  <rect x="40" y="1058" width="520" height="110" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="72" y="1103.48" font-size="28" font-weight="700" fill="#1F2937">越晚改動，</text>
  <text x="72" y="1142.68" font-size="28" font-weight="700" fill="#1F2937"><tspan fill="#8A5D00">要退回重做的站越多</tspan></text>
</svg>

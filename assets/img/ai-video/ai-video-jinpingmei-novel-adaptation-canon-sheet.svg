<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">開工第一張紙：取材清單</title>
  <desc id="d">以第八集〈紅妝鬥氣〉為例的取材清單，分三欄：取材章回鎖在第四十回與第四十一回；列出這兩回的六個關鍵事件，由我逐一核對；敏感內容怎麼拍：扮成丫鬟的段落維持成年的臉與身形，丫鬟受罰不拍身體接觸、改用偏頭、茶盤落地與旁人反應，兩人受辱與受害都清楚呈現、不能互相抵銷。先寫好這張紙，防止 AI 補上原文沒有的情節，也防止生圖時才發現不該這樣拍。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C5B8F"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E7568"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
    <marker id="arr-gold" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5A300"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#FFFFFF"/>
  <text x="48" y="76" font-size="48" font-weight="700" fill="#1F2937">開工第一張紙：取材清單</text>
  <text x="48" y="122" font-size="26" fill="#4B5563">以第八集〈紅妝鬥氣〉為例：寫劇本之前，先寫這張</text>
  <rect x="48" y="160" width="1104" height="470" rx="22" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3"/>
  <g transform="translate(1100 196) scale(0.5)"><path d="M-22,-8 v-16 a22,22 0 0 1 44,0 v16" fill="none" stroke="#E5A300" stroke-width="7"/><rect x="-36" y="-10" width="72" height="56" rx="8" fill="#E5A300"/><circle cx="0" cy="14" r="8" fill="#FFFFFF"/></g>
  <rect x="64" y="176" width="250" height="54" rx="14" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="2"/>
  <text x="84" y="213" font-size="28" font-weight="700" fill="#2C5B8F">取材章回</text>
  <rect x="346" y="176" width="278" height="54" rx="14" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="2"/>
  <text x="366" y="213" font-size="28" font-weight="700" fill="#2C5B8F">關鍵事件</text>
  <line x1="330" y1="176" x2="330" y2="610" stroke="#E5E7EB" stroke-width="2" stroke-linecap="round"/>
  <rect x="656" y="176" width="420" height="54" rx="14" fill="#FDF3E7" stroke="#B45309" stroke-width="2"/>
  <text x="676" y="213" font-size="28" font-weight="700" fill="#B45309">敏感內容怎麼拍</text>
  <line x1="640" y1="176" x2="640" y2="610" stroke="#E5E7EB" stroke-width="2" stroke-linecap="round"/>
  <g transform="translate(189 310) scale(0.95)"><path d="M0,-30 C-16,-42 -36,-42 -50,-36 V40 C-36,34 -16,34 0,46 C16,34 36,34 50,40 V-36 C36,-42 16,-42 0,-30 z" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="5" stroke-linejoin="round"/><line x1="0" y1="-30" x2="0" y2="46" stroke="#2C5B8F" stroke-width="5"/></g>
  <text x="189" y="410" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937">第四十回</text>
  <text x="189" y="452" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937">第四十一回</text>
  <text x="189" y="500" font-size="24" text-anchor="middle" fill="#4B5563">只取這兩回</text>
  <circle cx="370" cy="268" r="16" fill="#2C5B8F"/>
  <text x="370" y="275" font-size="20" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <line x1="398" y1="276" x2="610" y2="276" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
  <circle cx="370" cy="314" r="16" fill="#2C5B8F"/>
  <text x="370" y="321" font-size="20" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <line x1="398" y1="322" x2="610" y2="322" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
  <circle cx="370" cy="360" r="16" fill="#2C5B8F"/>
  <text x="370" y="367" font-size="20" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <line x1="398" y1="368" x2="610" y2="368" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
  <circle cx="370" cy="406" r="16" fill="#2C5B8F"/>
  <text x="370" y="413" font-size="20" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <line x1="398" y1="414" x2="610" y2="414" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
  <circle cx="370" cy="452" r="16" fill="#2C5B8F"/>
  <text x="370" y="459" font-size="20" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text>
  <line x1="398" y1="460" x2="610" y2="460" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
  <circle cx="370" cy="498" r="16" fill="#2C5B8F"/>
  <text x="370" y="505" font-size="20" font-weight="700" text-anchor="middle" fill="#FFFFFF">6</text>
  <line x1="398" y1="506" x2="610" y2="506" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
  <g transform="translate(372 560) scale(1)"><circle r="16" fill="#0E7568"/><g transform="scale(0.36)"><polyline points="-30,0 -8,24 32,-24" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g></g>
  <text x="398" y="568" font-size="24" font-weight="700" fill="#0E7568">由我逐一核對</text>
  <rect x="664" y="242" width="466" height="98" rx="14" fill="#FDF3E7"/>
  <text x="684" y="274" font-size="26" font-weight="700" fill="#1F2937">扮成丫鬟的段落：</text>
  <text x="684" y="316" font-size="26" fill="#4B5563">維持成年的臉與身形</text>
  <rect x="664" y="354" width="466" height="98" rx="14" fill="#FDF3E7"/>
  <text x="684" y="386" font-size="26" font-weight="700" fill="#1F2937">丫鬟受罰：不拍身體接觸，</text>
  <text x="684" y="428" font-size="26" fill="#4B5563">改用偏頭、茶盤落地、旁人反應</text>
  <rect x="664" y="466" width="466" height="98" rx="14" fill="#FDF3E7"/>
  <text x="684" y="498" font-size="26" font-weight="700" fill="#1F2937">兩人受辱、受害都清楚呈現，</text>
  <text x="684" y="540" font-size="26" fill="#4B5563">不能互相抵銷</text>
  <rect x="48" y="656" width="1104" height="76" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="600.0" y="704" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937">先寫好：防 AI 補寫原文沒有的情節，<tspan fill="#8A5D00">也防拍了才發現不該這樣拍</tspan></text>
</svg>

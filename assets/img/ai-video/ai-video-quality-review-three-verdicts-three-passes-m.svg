<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">完整看三遍，再下結論</title>
  <desc id="d">三遍看片：當觀眾不暫停、對清單逐條打勾並在手部嘴型剪接點暫停、用手機小螢幕再看一遍。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="600" height="900" fill="#FFFFFF"/>
  <text x="40" y="70" font-size="40" font-weight="700" fill="#1F2937">完整看三遍，</text>
  <text x="40" y="122" font-size="40" font-weight="700" fill="#1F2937">再下結論</text>
  <text x="40" y="168" font-size="24" fill="#4B5563">每一遍換一種眼睛看</text>
  <rect x="40" y="196" width="520" height="170" rx="24" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
  <circle cx="74" cy="230" r="22" fill="#2C5B8F"/>
  <text x="74" y="239.36" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <g transform="translate(150 288) scale(0.9)"><rect x="-56" y="-40" width="112" height="72" rx="8" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="5"/><rect x="-8" y="32" width="16" height="12" fill="#2C5B8F"/><rect x="-30" y="44" width="60" height="8" rx="4" fill="#2C5B8F"/><path d="M-12,-18 L16,-4 L-12,10 z" fill="#2C5B8F"/></g>
  <text x="240" y="258" font-size="34" font-weight="700" fill="#2C5B8F">當觀眾</text>
  <text x="240" y="302" font-size="24" fill="#4B5563">從頭看到尾，</text>
  <text x="240" y="338" font-size="24" fill="#4B5563">不暫停</text>
  <line x1="300" y1="368" x2="300" y2="402" stroke="#374151" stroke-width="4" stroke-linecap="butt" marker-end="url(#arr)"/>
  <rect x="40" y="406" width="520" height="170" rx="24" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
  <circle cx="74" cy="440" r="22" fill="#2C5B8F"/>
  <text x="74" y="449.36" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <g transform="translate(150 498) scale(0.9)"><rect x="-56" y="-40" width="112" height="72" rx="8" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="5"/><rect x="-8" y="32" width="16" height="12" fill="#2C5B8F"/><rect x="-30" y="44" width="60" height="8" rx="4" fill="#2C5B8F"/><rect x="-14" y="-20" width="9" height="30" rx="2" fill="#2C5B8F"/><rect x="5" y="-20" width="9" height="30" rx="2" fill="#2C5B8F"/></g>
  <text x="240" y="468" font-size="34" font-weight="700" fill="#2C5B8F">對清單</text>
  <text x="240" y="512" font-size="24" fill="#4B5563">逐條打勾；在手部、</text>
  <text x="240" y="548" font-size="24" fill="#4B5563">嘴型、剪接點暫停</text>
  <line x1="300" y1="578" x2="300" y2="612" stroke="#374151" stroke-width="4" stroke-linecap="butt" marker-end="url(#arr)"/>
  <rect x="40" y="616" width="520" height="170" rx="24" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
  <circle cx="74" cy="650" r="22" fill="#2C5B8F"/>
  <text x="74" y="659.36" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <g transform="translate(150 708) scale(0.9)"><rect x="-28" y="-50" width="56" height="100" rx="10" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="5"/><rect x="-18" y="-36" width="36" height="62" rx="3" fill="#2C5B8F" opacity="0.18"/><circle cy="38" r="5" fill="#2C5B8F"/></g>
  <text x="240" y="678" font-size="34" font-weight="700" fill="#2C5B8F">用手機</text>
  <text x="240" y="722" font-size="24" fill="#4B5563">換成小螢幕，</text>
  <text x="240" y="758" font-size="24" fill="#4B5563">再看一遍</text>
  <rect x="40" y="836" width="520" height="56" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="300.0" y="874.08" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937">三遍都看完，<tspan fill="#8A5D00">才逐條下結論</tspan></text>
</svg>

  <title id="t">景別：觀眾現在需要看到多少？</title>
  <desc id="d">同一個人用四種景別拍：建立鏡頭用寬景交代地點；中景大約腰部以上；中近景胸口以上；特寫最吃臉部一致性。攝影機離人越近，景別越緊。寫指令時，英文術語加上看得到的範圍，例如 medium shot, waist up。</desc>

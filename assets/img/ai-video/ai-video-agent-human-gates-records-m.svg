<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1270" width="600" height="1270" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">同時送 8 支，紀錄別擠在同一張紙</title>
  <desc id="d">左：所有工作編號寫進同一份清單，每次讀出來、加一行、寫回去；同時送 8 支時，後寫的蓋掉前一支，實測會掉 3 到 6 筆，錢付了、工作編號卻不見了（圖中掉 3 筆為示意）。右：每支工作各自一份紀錄，只能新建、永遠不覆寫，8 筆全部留住，中途斷線也能接著查、不重送。</desc>

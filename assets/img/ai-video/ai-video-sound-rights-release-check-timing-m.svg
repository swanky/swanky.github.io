  <rect x="270" y="311" width="16" height="9" rx="2" fill="#FFFFFF"/>
  <rect x="306" y="266" width="16" height="9" rx="2" fill="#FFFFFF"/>
  <rect x="306" y="311" width="16" height="9" rx="2" fill="#FFFFFF"/>
  <rect x="342" y="266" width="16" height="9" rx="2" fill="#FFFFFF"/>
  <rect x="342" y="311" width="16" height="9" rx="2" fill="#FFFFFF"/>
  <rect x="378" y="266" width="16" height="9" rx="2" fill="#FFFFFF"/>
  <rect x="378" y="311" width="16" height="9" rx="2" fill="#FFFFFF"/>

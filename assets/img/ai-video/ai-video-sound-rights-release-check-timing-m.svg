  <rect x="522" y="311" width="16" height="9" rx="2" fill="#FFFFFF"/>
  <text x="300" y="303" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">一顆鏡頭的長度</text>
  <rect x="40" y="338" width="80" height="60" rx="10" fill="#FFF8E7" stroke="#E5A300" stroke-width="3" stroke-dasharray="8 6"/>
  <rect x="480" y="338" width="80" height="60" rx="10" fill="#FFF8E7" stroke="#E5A300" stroke-width="3" stroke-dasharray="8 6"/>
  <rect x="126" y="338" width="348" height="60" rx="10" fill="#2C5B8F"/>
  <text x="300" y="377" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">旁白一句</text>
  <text x="90.0" y="434" font-size="22" font-weight="700" text-anchor="middle" fill="#8A5D00">留 0.3 秒</text>
  <text x="510.0" y="434" font-size="22" font-weight="700" text-anchor="middle" fill="#8A5D00">留 0.3 秒</text>
  <text x="40" y="500" font-size="26" font-weight="700" fill="#1F2937">放不進去：兩條路</text>
  <rect x="40" y="524" width="520" height="190" rx="24" fill="#FDECEC" stroke="#B91C1C" stroke-width="3"/>
  <g transform="translate(118 624) scale(0.85)"><path d="M-46,-30 L-6,0 L-46,30 z" fill="#B91C1C"/><path d="M-4,-30 L36,0 L-4,30 z" fill="#B91C1C"/><line x1="42" y1="-30" x2="42" y2="30" stroke="#B91C1C" stroke-width="7" stroke-linecap="round"/></g>
  <g transform="translate(524 560) scale(1)"><circle r="22" fill="#B91C1C"/><g transform="scale(0.50)"><line x1="-26" y1="-26" x2="26" y2="26" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/><line x1="26" y1="-26" x2="-26" y2="26" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/></g></g>
  <text x="200" y="590" font-size="32" font-weight="700" fill="#B91C1C">加速超過約 1.2 倍</text>
  <text x="200" y="640" font-size="26" fill="#4B5563">講太快的旁白，</text>
  <text x="200" y="678" font-size="26" fill="#4B5563">失去的信任更多</text>
  <rect x="40" y="738" width="520" height="190" rx="24" fill="#E6F4F1" stroke="#0E7568" stroke-width="3"/>
  <g transform="translate(118 838) scale(0.85)"><g transform="rotate(-40)"><rect x="-46" y="-12" width="76" height="24" rx="3" fill="#FFFFFF" stroke="#0E7568" stroke-width="5"/><path d="M30,-12 L52,0 L30,12 z" fill="#0E7568"/><line x1="-30" y1="-12" x2="-30" y2="12" stroke="#0E7568" stroke-width="5"/></g></g>
  <g transform="translate(524 774) scale(1)"><circle r="22" fill="#0E7568"/><g transform="scale(0.50)"><polyline points="-30,0 -8,24 32,-24" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g></g>
  <text x="200" y="804" font-size="32" font-weight="700" fill="#0E7568">改寫句子</text>
  <text x="200" y="854" font-size="26" fill="#4B5563">改短一點，</text>
  <text x="200" y="892" font-size="26" fill="#4B5563">剛好放進鏡頭裡</text>
  <rect x="40" y="972" width="520" height="110" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="300.0" y="1017" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937">先量，再排：</text>
  <text x="300.0" y="1059" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan fill="#8A5D00">不從字數估秒數</tspan></text>
</svg>

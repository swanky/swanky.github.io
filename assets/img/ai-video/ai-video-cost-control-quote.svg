<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="1200" height="920" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">送出前，先看一張報價單</title>
  <desc id="d">示意的報價單欄位：拍什麼與成功條件、模型、秒數、解析度、畫面比例、版本數、單價、這次估價、目前累計、第幾次、可能風險。核准只對這一張報價有效，改了解析度、秒數、版本數或提示詞，就是新報價、要重新核准。價格要查當下的，查不到寫未知；我碰過首頁寫每秒 0.08 美元，送 1080p、5 秒實付卻是 1.26 美元。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1200" height="920" fill="#FFFFFF"/>
  <text x="48" y="80" font-size="48" font-weight="700" fill="#1F2937">送出前，先看一張報價單</text>
  <text x="48" y="126" font-size="26" fill="#4B5563">欄位範例（示意）：金色欄位一改，就是一張新報價</text>
  <rect x="48" y="164" width="600" height="728" rx="18" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="3"/>
  <rect x="48" y="164" width="600" height="70" rx="18" fill="#2C5B8F"/>
  <rect x="48" y="204" width="600" height="30" rx="0" fill="#2C5B8F"/>
  <text x="76" y="212" font-size="30" font-weight="700" fill="#FFFFFF">報價單</text>
  <text x="620" y="210" font-size="22" font-weight="700" text-anchor="end" fill="#FFFFFF">示意</text>
  <text x="78" y="284.52" font-size="24" font-weight="700" fill="#1F2937">拍什麼</text>
  <text x="618" y="284.52" font-size="22" text-anchor="end" fill="#2C5B8F">成功條件寫清楚</text>
  <text x="78" y="330.52" font-size="24" font-weight="700" fill="#1F2937">模型</text>
  <rect x="458" y="321.32" width="160" height="10" rx="5" fill="#CBD5E1"/>
  <rect x="62" y="348" width="572" height="40" rx="10" fill="#FFF8E7" stroke="#E5A300" stroke-width="3"/>
  <text x="78" y="376.52" font-size="24" font-weight="700" fill="#8A5D00">秒數</text>
  <rect x="458" y="367.32" width="160" height="10" rx="5" fill="#CBD5E1"/>
  <rect x="62" y="394" width="572" height="40" rx="10" fill="#FFF8E7" stroke="#E5A300" stroke-width="3"/>
  <text x="78" y="422.52" font-size="24" font-weight="700" fill="#8A5D00">解析度</text>
  <rect x="458" y="413.32" width="160" height="10" rx="5" fill="#CBD5E1"/>
  <text x="78" y="468.52" font-size="24" font-weight="700" fill="#1F2937">畫面比例</text>
  <rect x="458" y="459.32" width="160" height="10" rx="5" fill="#CBD5E1"/>
  <rect x="62" y="486" width="572" height="40" rx="10" fill="#FFF8E7" stroke="#E5A300" stroke-width="3"/>
  <text x="78" y="514.52" font-size="24" font-weight="700" fill="#8A5D00">版本數</text>
  <rect x="458" y="505.32" width="160" height="10" rx="5" fill="#CBD5E1"/>
  <text x="78" y="560.52" font-size="24" font-weight="700" fill="#1F2937">單價</text>
  <text x="618" y="560.52" font-size="22" text-anchor="end" fill="#2C5B8F">查當下價格表</text>
  <text x="78" y="606.52" font-size="24" font-weight="700" fill="#1F2937">這次估價</text>
  <rect x="458" y="597.32" width="160" height="10" rx="5" fill="#CBD5E1"/>
  <text x="78" y="652.52" font-size="24" font-weight="700" fill="#1F2937">目前累計</text>
  <rect x="458" y="643.32" width="160" height="10" rx="5" fill="#CBD5E1"/>
  <text x="78" y="698.52" font-size="24" font-weight="700" fill="#1F2937">第幾次</text>
  <rect x="458" y="689.32" width="160" height="10" rx="5" fill="#CBD5E1"/>
  <text x="78" y="744.52" font-size="24" font-weight="700" fill="#1F2937">可能風險</text>
  <text x="618" y="744.52" font-size="22" text-anchor="end" fill="#2C5B8F">內容過濾、角色走樣</text>
  <line x1="72" y1="776" x2="624" y2="776" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6"/>
  <text x="78" y="832" font-size="24" font-weight="700" fill="#1F2937">人核准：</text>
  <g transform="rotate(-12 238 824)"><circle cx="238" cy="824" r="48" fill="none" stroke="#E5A300" stroke-width="6"/><circle cx="238" cy="824" r="36" fill="none" stroke="#E5A300" stroke-width="2"/><text x="238" y="835" font-size="30" font-weight="700" fill="#8A5D00" text-anchor="middle">核准</text></g>
  <text x="618" y="832" font-size="22" text-anchor="end" fill="#2C5B8F">核准後才送出</text>
  <rect x="700" y="164" width="452" height="210" rx="24" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
  <text x="732" y="216" font-size="30" font-weight="700" fill="#8A5D00">核准只對這一張有效</text>
  <text x="732" y="260" font-size="24" fill="#4B5563">改了解析度、秒數、</text>
  <text x="732" y="296" font-size="24" fill="#4B5563">版本數或提示詞，</text>
  <text x="732" y="332" font-size="24" fill="#4B5563">就是新報價，重新核准</text>
  <rect x="700" y="398" width="452" height="150" rx="24" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
  <text x="732" y="450" font-size="30" font-weight="700" fill="#2C5B8F">價格查當下的</text>
  <text x="732" y="494" font-size="24" fill="#4B5563">不憑印象；</text>
  <text x="732" y="530" font-size="24" fill="#4B5563">查不到就寫「未知」</text>
  <rect x="700" y="572" width="452" height="186" rx="24" fill="#FDECEC" stroke="#B91C1C" stroke-width="3"/>
  <text x="732" y="624" font-size="30" font-weight="700" fill="#B91C1C">我碰過的落差</text>
  <text x="732" y="668" font-size="24" fill="#4B5563">首頁寫每秒 US$0.08，</text>
  <text x="732" y="704" font-size="24" fill="#4B5563">送 1080p、5 秒，</text>
  <text x="732" y="740" font-size="24" fill="#4B5563">實付卻是 US$1.26</text>
</svg>

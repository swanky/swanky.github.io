  <text x="260" y="740" font-size="24" text-anchor="middle" fill="#4B5563">開場</text>
  <line x1="344" y1="650" x2="512" y2="650" stroke="#374151" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
  <g transform="translate(600 650) scale(0.95)"><rect x="-80" y="-52" width="160" height="104" rx="10" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="5"/><line x1="0" y1="-40" x2="0" y2="40" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="6 6"/><line x1="-66" y1="40" x2="66" y2="40" stroke="#CBD5E1" stroke-width="4"/><g transform="translate(40 2) scale(0.62)"><path d="M-40,-6 Q0,-34 40,-6 L46,40 Q0,54 -46,40 z" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="5" stroke-linejoin="round"/><path d="M-8,-20 Q0,-50 8,-20" fill="none" stroke="#2C5B8F" stroke-width="5"/><path d="M-14,-18 L0,-6 L14,-18" fill="none" stroke="#2C5B8F" stroke-width="5" stroke-linejoin="round"/></g></g>
  <g transform="translate(676 604) scale(1)"><circle r="18" fill="#0E7568"/><g transform="scale(0.41)"><polyline points="-30,0 -8,24 32,-24" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g></g>
  <text x="600" y="740" font-size="24" text-anchor="middle" fill="#4B5563">後面出門：同一隻手</text>
  <g transform="translate(940 650) scale(0.95)"><rect x="-80" y="-52" width="160" height="104" rx="10" fill="#FFFFFF" stroke="#B91C1C" stroke-width="5"/><line x1="0" y1="-40" x2="0" y2="40" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="6 6"/><line x1="-66" y1="40" x2="66" y2="40" stroke="#CBD5E1" stroke-width="4"/><g transform="translate(-40 2) scale(0.62)"><path d="M-40,-6 Q0,-34 40,-6 L46,40 Q0,54 -46,40 z" fill="#FFFFFF" stroke="#B91C1C" stroke-width="5" stroke-linejoin="round"/><path d="M-8,-20 Q0,-50 8,-20" fill="none" stroke="#B91C1C" stroke-width="5"/><path d="M-14,-18 L0,-6 L14,-18" fill="none" stroke="#B91C1C" stroke-width="5" stroke-linejoin="round"/></g></g>

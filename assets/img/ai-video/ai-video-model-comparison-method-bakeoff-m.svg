  <text x="354" y="286" font-size="24" font-weight="700" fill="#1F2937">同一段指令</text>
  <g transform="translate(82,324) scale(0.3)"><circle r="40" fill="#FFFFFF" stroke="#0E7568" stroke-width="5"/><path d="M-18,0 L-4,14 L20,-14" fill="none" stroke="#0E7568" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="104" y="332" font-size="24" font-weight="700" fill="#1F2937">同樣 5 秒、16:9</text>

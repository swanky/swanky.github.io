  <text x="40" y="118" font-size="40" font-weight="700" fill="#1F2937">同一份考題</text>
  <text x="40" y="162" font-size="24" fill="#4B5563">只讓模型不同（2026 年 8 月實測）</text>
  <rect x="40" y="190" width="520" height="250" rx="24" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
  <text x="300" y="236" text-anchor="middle" font-size="32" font-weight="700" fill="#8A5D00">同一份考題</text>

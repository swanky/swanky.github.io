<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 914" width="600" height="914" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">人聲一出現，音樂就讓位</title>
  <desc id="d">六條音軌分開：旁白、對白、環境音、擬音、音樂、轉場音效。旁白出現的那一段，音樂的音量漸變降低約 6 dB、環境音降低約 3 dB，說完再慢慢回升；擬音那條不動，推動劇情的聲音不跟著被壓小。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C5B8F"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E7568"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
    <marker id="arr-gold" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5A300"/></marker>
  </defs>
  <rect width="600" height="914" fill="#FFFFFF"/>
  <text x="40" y="70" font-size="40" font-weight="700" fill="#1F2937">人聲一出現，</text>
  <text x="40" y="122" font-size="40" font-weight="700" fill="#1F2937">音樂就讓位</text>
  <text x="40" y="164" font-size="24" fill="#4B5563">六條音軌分開調，讓位要漸變</text>
  <rect x="300" y="202" width="150" height="462" rx="12" fill="#FFF8E7" stroke="#E5A300" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="375.0" y="228" font-size="22" font-weight="700" text-anchor="middle" fill="#8A5D00">旁白說話中</text>
  <text x="40" y="281.0" font-size="26" font-weight="700" fill="#2C5B8F">旁白</text>
  <rect x="168" y="242" width="392" height="58" rx="10" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="306" y="250" width="138" height="42" rx="8" fill="#2C5B8F"/>
  <g transform="translate(375.0 271.0) scale(0.9)"><polyline points="-45.0,0.0 -42.8,2.2 -40.5,4.5 -38.2,6.2 -36.0,6.6 -33.8,5.4 -31.5,2.6 -29.2,-1.4 -27.0,-5.7 -24.8,-9.3 -22.5,-11.1 -20.2,-10.5 -18.0,-7.3 -15.8,-2.1 -13.5,4.3 -11.2,10.3 -9.0,14.5 -6.8,15.7 -4.5,13.4 -2.2,7.9 0.0,0.0 2.2,-7.9 4.5,-13.4 6.8,-15.7 9.0,-14.5 11.2,-10.3 13.5,-4.3 15.8,2.1 18.0,7.3 20.2,10.5 22.5,11.1 24.8,9.3 27.0,5.7 29.2,1.4 31.5,-2.6 33.8,-5.4 36.0,-6.6 38.2,-6.2 40.5,-4.5 42.8,-2.2 45.0,-0.0" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="40" y="353.0" font-size="26" font-weight="700" fill="#2C5B8F">對白</text>
  <rect x="168" y="314" width="392" height="58" rx="10" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="192" y="326" width="68" height="34" rx="8" fill="#9DB6D3"/>
  <rect x="480" y="326" width="50" height="34" rx="8" fill="#9DB6D3"/>
  <text x="40" y="425.0" font-size="26" font-weight="700" fill="#0E7568">環境音</text>
  <rect x="168" y="386" width="392" height="58" rx="10" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
  <path d="M178,398 H274 L306,410 H444 L476,398 H550" fill="none" stroke="#0E7568" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="375.0" y="402" font-size="22" font-weight="700" text-anchor="middle" fill="#0E7568">−3 dB</text>
  <text x="40" y="497.0" font-size="26" font-weight="700" fill="#B45309">擬音</text>
  <rect x="168" y="458" width="392" height="58" rx="10" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="178" y1="487.0" x2="476" y2="487.0" stroke="#B45309" stroke-width="4" stroke-linecap="round"/>
  <rect x="218" y="473.0" width="10" height="28" rx="3" fill="#B45309"/>
  <rect x="268" y="473.0" width="10" height="28" rx="3" fill="#B45309"/>
  <rect x="318" y="473.0" width="10" height="28" rx="3" fill="#B45309"/>
  <rect x="368" y="473.0" width="10" height="28" rx="3" fill="#B45309"/>
  <rect x="418" y="473.0" width="10" height="28" rx="3" fill="#B45309"/>
  <rect x="468" y="473.0" width="10" height="28" rx="3" fill="#B45309"/>
  <rect x="486" y="469.0" width="62" height="36" fill="#F8FAFC"/>
  <text x="544" y="495.0" font-size="22" font-weight="700" text-anchor="end" fill="#B45309">不動</text>
  <text x="40" y="569.0" font-size="26" font-weight="700" fill="#8A5D00">音樂</text>
  <rect x="168" y="530" width="392" height="58" rx="10" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
  <path d="M178,542 H274 L306,580 H444 L476,542 H550" fill="none" stroke="#E5A300" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="375.0" y="570" font-size="22" font-weight="700" text-anchor="middle" fill="#8A5D00">−6 dB</text>
  <text x="40" y="641.0" font-size="26" font-weight="700" fill="#64748B">轉場音效</text>
  <rect x="168" y="602" width="392" height="58" rx="10" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="188" y="614" width="50" height="34" rx="8" fill="#94A3B8"/>
  <rect x="490" y="614" width="50" height="34" rx="8" fill="#94A3B8"/>
  <text x="40" y="714" font-size="24" fill="#4B5563">提前一點降、說完再慢慢回來，</text>
  <text x="40" y="748" font-size="24" fill="#4B5563">不要一格一格硬切</text>
  <rect x="40" y="774" width="520" height="110" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="300.0" y="819" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937">推動劇情的聲音</text>
  <text x="300.0" y="861" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937">（門鎖、鑰匙）<tspan fill="#8A5D00">不跟著壓小</tspan></text>
</svg>

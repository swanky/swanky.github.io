  <text x="48" y="126" font-size="26" fill="#4B5563">核准後還是能改，只是你知道這一刀會牽動哪幾站</text>
  <text x="389.5" y="200" text-anchor="middle" font-size="22" font-weight="700" fill="#4B5563">需求確認</text>
  <text x="490.5" y="200" text-anchor="middle" font-size="22" font-weight="700" fill="#4B5563">腳本</text>
  <text x="591.5" y="200" text-anchor="middle" font-size="22" font-weight="700" fill="#4B5563">分鏡</text>
  <text x="692.5" y="200" text-anchor="middle" font-size="22" font-weight="700" fill="#4B5563">動態分鏡</text>
  <text x="793.5" y="200" text-anchor="middle" font-size="22" font-weight="700" fill="#4B5563">關鍵畫面</text>
  <text x="894.5" y="200" text-anchor="middle" font-size="22" font-weight="700" fill="#4B5563">素材製作</text>
  <text x="995.5" y="200" text-anchor="middle" font-size="22" font-weight="700" fill="#4B5563">後製</text>
  <text x="1096.5" y="200" text-anchor="middle" font-size="22" font-weight="700" fill="#4B5563">驗收交付</text>
  <g transform="translate(76,264) scale(0.62)"><circle cx="-22" cy="22" r="13" fill="none" stroke="#0E7568" stroke-width="5"/><circle cx="22" cy="22" r="13" fill="none" stroke="#0E7568" stroke-width="5"/><path d="M-13,12 L20,-34 M13,12 L-20,-34" stroke="#0E7568" stroke-width="6" stroke-linecap="round"/></g>

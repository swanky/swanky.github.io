<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1240" width="600" height="1240" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">兩人對話：塞一句，還是拆三格？</title>
  <desc id="d">左邊把過肩、反打、反應寫進同一句指令，一次生成，常得到一個鏡頭裡偷切角度、人物瞬移。右邊在分鏡階段拆成三格：A 過肩、B 過肩、反應鏡頭，分別生成，再交給剪接接起來。</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">生成，只是八站裡的一站</title>
  <desc id="d">AI 影片的八站路線：需求確認、腳本、分鏡、動態分鏡、關鍵畫面、素材製作、後製、驗收交付。每兩站之間都有一個核准點，確認後才往下走。付費的 AI 生成只發生在第六站素材製作。越晚改動，要退回重做的站越多。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5A300"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C5B8F"/></marker>
  </defs>
  <rect width="1200" height="660" fill="#FFFFFF"/>
  <text x="48" y="80" font-size="48" font-weight="700" fill="#1F2937">生成，只是八站裡的一站</text>
  <text x="48" y="126" font-size="26" fill="#4B5563">像坐一條捷運線：每站之間都有核准點，付費生成只在第六站</text>
  <rect x="100" y="342" width="1000" height="16" rx="8" fill="#2C5B8F"/>
  <g transform="translate(171.429,350) scale(0.42)"><circle r="40" fill="#FFFFFF" stroke="#0E7568" stroke-width="5"/><path d="M-18,0 L-4,14 L20,-14" fill="none" stroke="#0E7568" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(314.286,350) scale(0.42)"><circle r="40" fill="#FFFFFF" stroke="#0E7568" stroke-width="5"/><path d="M-18,0 L-4,14 L20,-14" fill="none" stroke="#0E7568" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(457.143,350) scale(0.42)"><circle r="40" fill="#FFFFFF" stroke="#0E7568" stroke-width="5"/><path d="M-18,0 L-4,14 L20,-14" fill="none" stroke="#0E7568" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(600,350) scale(0.42)"><circle r="40" fill="#FFFFFF" stroke="#0E7568" stroke-width="5"/><path d="M-18,0 L-4,14 L20,-14" fill="none" stroke="#0E7568" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(742.857,350) scale(0.42)"><circle r="40" fill="#FFFFFF" stroke="#0E7568" stroke-width="5"/><path d="M-18,0 L-4,14 L20,-14" fill="none" stroke="#0E7568" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(885.714,350) scale(0.42)"><circle r="40" fill="#FFFFFF" stroke="#0E7568" stroke-width="5"/><path d="M-18,0 L-4,14 L20,-14" fill="none" stroke="#0E7568" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(1028.57,350) scale(0.42)"><circle r="40" fill="#FFFFFF" stroke="#0E7568" stroke-width="5"/><path d="M-18,0 L-4,14 L20,-14" fill="none" stroke="#0E7568" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <circle cx="100" cy="350" r="30" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="6"/>
  <text x="100" y="360" text-anchor="middle" font-size="28" font-weight="700" fill="#2C5B8F">1</text>
  <text x="100" y="432" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">需求確認</text>
  <circle cx="242.857" cy="350" r="30" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="6"/>
  <text x="242.857" y="360" text-anchor="middle" font-size="28" font-weight="700" fill="#2C5B8F">2</text>
  <text x="242.857" y="432" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">腳本</text>
  <circle cx="385.714" cy="350" r="30" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="6"/>
  <text x="385.714" y="360" text-anchor="middle" font-size="28" font-weight="700" fill="#2C5B8F">3</text>
  <text x="385.714" y="432" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">分鏡</text>
  <circle cx="528.571" cy="350" r="30" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="6"/>
  <text x="528.571" y="360" text-anchor="middle" font-size="28" font-weight="700" fill="#2C5B8F">4</text>
  <text x="528.571" y="432" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">動態分鏡</text>
  <circle cx="671.429" cy="350" r="30" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="6"/>
  <text x="671.429" y="360" text-anchor="middle" font-size="28" font-weight="700" fill="#2C5B8F">5</text>
  <text x="671.429" y="432" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">關鍵畫面</text>
  <circle cx="814.286" cy="350" r="40" fill="#FFF8E7" stroke="#E5A300" stroke-width="6"/>
  <text x="814.286" y="361" text-anchor="middle" font-size="30" font-weight="700" fill="#8A5D00">6</text>
  <text x="814.286" y="432" text-anchor="middle" font-size="26" font-weight="700" fill="#8A5D00">素材製作</text>
  <circle cx="957.143" cy="350" r="30" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="6"/>
  <text x="957.143" y="360" text-anchor="middle" font-size="28" font-weight="700" fill="#2C5B8F">7</text>
  <text x="957.143" y="432" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">後製</text>
  <circle cx="1100" cy="350" r="30" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="6"/>
  <text x="1100" y="360" text-anchor="middle" font-size="28" font-weight="700" fill="#2C5B8F">8</text>
  <text x="1100" y="432" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">驗收交付</text>
  <rect x="644.286" y="172" width="340" height="92" rx="18" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
  <g transform="translate(696.286,218) scale(0.8)"><circle r="30" fill="#E5A300"/><circle r="22" fill="none" stroke="#FFF8E7" stroke-width="3"/><text x="0" y="10" text-anchor="middle" font-size="28" font-weight="700" fill="#1F2937">$</text></g>
  <text x="738.286" y="210" font-size="28" font-weight="700" fill="#8A5D00">付費 AI 生成</text>
  <text x="738.286" y="246" font-size="26" fill="#4B5563">只在這一站</text>
  <line x1="814.286" y1="266" x2="814.286" y2="304" stroke="#E5A300" stroke-width="4" marker-end="url(#arrG)"/>
  <g transform="translate(70,494) scale(0.42)"><circle r="40" fill="#FFFFFF" stroke="#0E7568" stroke-width="5"/><path d="M-18,0 L-4,14 L20,-14" fill="none" stroke="#0E7568" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="98" y="503" font-size="26" fill="#4B5563">核准點：確認後才往下走，之後要改也知道代價</text>
  <rect x="48" y="548" width="1104" height="86" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="80" y="601.8" font-size="30" font-weight="700" fill="#1F2937">越晚改動，<tspan fill="#8A5D00">要退回重做的站越多</tspan></text>
</svg>

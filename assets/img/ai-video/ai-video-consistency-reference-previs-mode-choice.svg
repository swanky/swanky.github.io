<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">先問自己：最在意什麼？</title>
  <desc id="d">三個路標。最在意精確構圖與人數，走首幀模式：最能鎖住人數、順序與構圖，但首幀的缺點也會一起鎖住。最在意很快保住長相，走參考圖模式：靠角色圖保住長相、出片快，但放棄逐格控制。空間站位複雜，先用白模排練：先確認站位和運鏡拍得到，但還沒有實測證明能省多少錢。參考圖是引導，不是精確的畫面錨點。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1200" height="860" fill="#FFFFFF"/>
  <text x="48" y="80" font-size="48" font-weight="700" fill="#1F2937">先問自己：最在意什麼？</text>
  <text x="48" y="126" font-size="26" fill="#4B5563">首幀、參考圖、白模，各管一件事</text>
  <rect x="146" y="172" width="16" height="560" rx="6" fill="#94A3B8"/>
  <rect x="104" y="724" width="100" height="18" rx="8" fill="#94A3B8"/>
  <path d="M60,216 L404,216 L440,258.0 L404,300 L60,300 z" fill="#2C5B8F"/>
  <text x="84" y="268.8" font-size="30" font-weight="700" fill="#FFFFFF">精確構圖、人數</text>
  <line x1="446" y1="258" x2="494" y2="258" stroke="#374151" stroke-width="4" stroke-linecap="butt" marker-end="url(#arr)"/>
  <rect x="500" y="186" width="652" height="150" rx="24" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
  <text x="532" y="236" font-size="34" font-weight="700" fill="#2C5B8F">首幀模式</text>
  <g transform="translate(548 274) scale(0.3)"><circle r="46" fill="#0E7568"/><path d="M-20.7,0 L-4.6000000000000005,15.180000000000001 L22.08,-15.180000000000001" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="574" y="283" font-size="24" fill="#1F2937">最能鎖住人數、順序與構圖</text>
  <g transform="translate(548 312) scale(0.3)"><circle r="46" fill="#B91C1C"/><path d="M-17.48,-17.48 L17.48,17.48 M17.48,-17.48 L-17.48,17.48" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/></g>
  <text x="574" y="321" font-size="24" fill="#4B5563">首幀的缺點也會一起鎖住</text>
  <path d="M60,396 L404,396 L440,438.0 L404,480 L60,480 z" fill="#0E7568"/>
  <text x="84" y="448.8" font-size="30" font-weight="700" fill="#FFFFFF">很快保住長相</text>
  <line x1="446" y1="438" x2="494" y2="438" stroke="#374151" stroke-width="4" stroke-linecap="butt" marker-end="url(#arr)"/>
  <rect x="500" y="366" width="652" height="150" rx="24" fill="#E6F4F1" stroke="#0E7568" stroke-width="3"/>
  <text x="532" y="416" font-size="34" font-weight="700" fill="#0E7568">參考圖模式</text>
  <g transform="translate(548 454) scale(0.3)"><circle r="46" fill="#0E7568"/><path d="M-20.7,0 L-4.6000000000000005,15.180000000000001 L22.08,-15.180000000000001" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="574" y="463" font-size="24" fill="#1F2937">靠角色圖保住長相，出片快</text>
  <g transform="translate(548 492) scale(0.3)"><circle r="46" fill="#B91C1C"/><path d="M-17.48,-17.48 L17.48,17.48 M17.48,-17.48 L-17.48,17.48" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/></g>
  <text x="574" y="501" font-size="24" fill="#4B5563">放棄逐格控制</text>
  <path d="M60,576 L404,576 L440,618.0 L404,660 L60,660 z" fill="#B45309"/>
  <text x="84" y="628.8" font-size="30" font-weight="700" fill="#FFFFFF">空間站位複雜</text>
  <line x1="446" y1="618" x2="494" y2="618" stroke="#374151" stroke-width="4" stroke-linecap="butt" marker-end="url(#arr)"/>
  <rect x="500" y="546" width="652" height="150" rx="24" fill="#FDF3E7" stroke="#B45309" stroke-width="3"/>
  <text x="532" y="596" font-size="34" font-weight="700" fill="#B45309">先用白模排練</text>
  <g transform="translate(548 634) scale(0.3)"><circle r="46" fill="#0E7568"/><path d="M-20.7,0 L-4.6000000000000005,15.180000000000001 L22.08,-15.180000000000001" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="574" y="643" font-size="24" fill="#1F2937">先確認站位、運鏡拍得到</text>
  <g transform="translate(548 672) scale(0.3)"><circle r="46" fill="#B91C1C"/><path d="M-17.48,-17.48 L17.48,17.48 M17.48,-17.48 L-17.48,17.48" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/></g>
  <text x="574" y="681" font-size="24" fill="#4B5563">還沒有實測證明省多少錢</text>
  <rect x="48" y="744" width="1104" height="84" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="600.0" y="796.8" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937">參考圖是引導，<tspan fill="#8A5D00">不是精確的畫面錨點</tspan></text>
</svg>

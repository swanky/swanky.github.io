  <text x="250" y="688" font-size="30" font-weight="700" fill="#2C5B8F">排攝影機路徑</text>
  <text x="250" y="732" font-size="24" fill="#4B5563">繞一圈還看得到</text>
  <text x="250" y="768" font-size="24" fill="#4B5563">主角嗎</text>

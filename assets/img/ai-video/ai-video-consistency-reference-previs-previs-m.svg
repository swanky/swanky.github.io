  <rect x="40" y="632" width="520" height="164" rx="24" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
  <circle cx="72" cy="664" r="20" fill="#2C5B8F"/>
  <text x="72" y="672.64" font-size="24" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>

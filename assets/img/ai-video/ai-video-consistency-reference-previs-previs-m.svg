  <circle cx="72" cy="862" r="20" fill="#0E7568"/>
  <text x="72" y="870.64" font-size="24" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <g transform="translate(150 918) scale(0.78)"><rect x="-54" y="-48" width="108" height="96" rx="8" fill="#0E7568"/><rect x="-44" y="-40" width="10" height="8" rx="2" fill="#FFFFFF"/><rect x="-44" y="32" width="10" height="8" rx="2" fill="#FFFFFF"/><rect x="-24" y="-40" width="10" height="8" rx="2" fill="#FFFFFF"/><rect x="-24" y="32" width="10" height="8" rx="2" fill="#FFFFFF"/><rect x="-4" y="-40" width="10" height="8" rx="2" fill="#FFFFFF"/><rect x="-4" y="32" width="10" height="8" rx="2" fill="#FFFFFF"/><rect x="16" y="-40" width="10" height="8" rx="2" fill="#FFFFFF"/><rect x="16" y="32" width="10" height="8" rx="2" fill="#FFFFFF"/><rect x="36" y="-40" width="10" height="8" rx="2" fill="#FFFFFF"/><rect x="36" y="32" width="10" height="8" rx="2" fill="#FFFFFF"/><rect x="-38" y="-24" width="76" height="48" rx="4" fill="#FFFFFF"/><path d="M-8,-14 L14,0 L-8,14 z" fill="#0E7568"/></g>
  <text x="250" y="886" font-size="30" font-weight="700" fill="#0E7568">快速預覽</text>
  <text x="250" y="930" font-size="24" fill="#4B5563">輸出小尺寸預覽，</text>
  <text x="250" y="966" font-size="24" fill="#4B5563">檢查時長</text>
  <rect x="40" y="1038" width="520" height="150" rx="24" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
  <g transform="translate(110 1118) scale(0.8)"><rect x="-46" y="-6" width="40" height="40" rx="3" fill="#E5E7EB" stroke="#64748B" stroke-width="4"/><rect x="4" y="-6" width="40" height="40" rx="3" fill="#E5E7EB" stroke="#64748B" stroke-width="4"/><rect x="-22" y="-48" width="40" height="40" rx="3" fill="#D1D5DB" stroke="#64748B" stroke-width="4"/></g>
  <text x="190" y="1090" font-size="30" font-weight="700" fill="#64748B">白模只管</text>
  <text x="190" y="1132" font-size="26" fill="#1F2937">空間、時間和機位</text>
  <text x="190" y="1168" font-size="22" fill="#4B5563">格線、灰色材質不當風格</text>
  <rect x="40" y="1208" width="520" height="150" rx="24" fill="#FDF3E7" stroke="#B45309" stroke-width="3"/>
  <path d="M71.0,1326.0 C72.0,1298.0 90.0,1291.0 110,1291.0 C130.0,1291.0 148.0,1298.0 149.0,1326.0 z" fill="#FDE7CC" stroke="#B45309" stroke-width="3"/>
  <ellipse cx="110" cy="1266" rx="20.0" ry="20.0" fill="#E2E8F0" stroke="#B45309" stroke-width="3"/>
  <path d="M87.0,1275.0 C85.0,1239.0 135.0,1239.0 133.0,1275.0 L127.0,1263.0 C118.0,1255.0 102.0,1255.0 93.0,1263.0 z" fill="#B45309"/>
  <circle cx="92.0" cy="1307.0" r="4.5" fill="#E5A300" stroke="#FFFFFF" stroke-width="2"/>
  <text x="190" y="1260" font-size="30" font-weight="700" fill="#B45309">參考圖負責</text>
  <text x="190" y="1302" font-size="26" fill="#1F2937">角色長相與美術</text>
  <text x="190" y="1338" font-size="22" fill="#4B5563">外觀圖決定角色長什麼樣</text>
  <rect x="40" y="1388" width="520" height="100" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="300.0" y="1429.1799999999998" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937">先修<tspan fill="#8A5D00">站位與碰撞</tspan></text>
  <text x="300.0" y="1466.9799999999998" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937">再修構圖與時間</text>

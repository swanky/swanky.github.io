<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1512" width="600" height="1512" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">白模預演：花錢之前，先排空間</title>
  <desc id="d">白模預演四步：定任務、排空間與動線、排攝影機路徑、快速預覽。白模只管空間、時間和機位，角色長相交給參考圖。先修站位與碰撞，再修構圖與時間。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="600" height="1512" fill="#FFFFFF"/>
  <text x="40" y="70" font-size="40" font-weight="700" fill="#1F2937">白模預演：</text>
  <text x="40" y="122" font-size="40" font-weight="700" fill="#1F2937">花錢之前，先排空間</text>
  <text x="40" y="168" font-size="24" fill="#4B5563">用沒有貼圖的簡單方塊，</text>
  <text x="40" y="202" font-size="24" fill="#4B5563">排出站位與攝影機路徑</text>
  <rect x="40" y="236" width="520" height="164" rx="24" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>

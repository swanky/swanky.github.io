  <text x="250" y="292" font-size="30" font-weight="700" fill="#2C5B8F">定任務</text>
  <text x="250" y="336" font-size="24" fill="#4B5563">這一鏡要</text>
  <text x="250" y="372" font-size="24" fill="#4B5563">交代什麼</text>
  <line x1="300" y1="402" x2="300" y2="430" stroke="#374151" stroke-width="4" stroke-linecap="butt" marker-end="url(#arr)"/>
  <rect x="40" y="434" width="520" height="164" rx="24" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
  <circle cx="72" cy="466" r="20" fill="#2C5B8F"/>
  <text x="72" y="474.64" font-size="24" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <g transform="translate(150 522) scale(0.78)"><rect x="-60" y="-50" width="120" height="100" rx="6" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="4"/><rect x="-46" y="-36" width="26" height="26" fill="#CBD5E1" stroke="#2C5B8F" stroke-width="2"/><rect x="18" y="-38" width="30" height="20" fill="#CBD5E1" stroke="#2C5B8F" stroke-width="2"/><circle cx="-20" cy="24" r="9" fill="#2C5B8F"/><circle cx="28" cy="16" r="9" fill="#2C5B8F"/><path d="M-40,38 C-10,46 10,0 40,-6" fill="none" stroke="#E5A300" stroke-width="4" stroke-dasharray="6 5"/></g>
  <text x="250" y="490" font-size="30" font-weight="700" fill="#2C5B8F">排空間與動線</text>
  <text x="250" y="534" font-size="24" fill="#4B5563">排出場景大小、</text>
  <text x="250" y="570" font-size="24" fill="#4B5563">站位和走位</text>

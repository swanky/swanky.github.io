<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1110" width="600" height="1110" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">審 A、送 B？送出前再比一次</title>
  <desc id="d">防止「審 A、送 B」：人核准一張畫面時，系統記下那個檔案的指紋；真正送出前，把實際要送的畫面再算一次指紋，和核准當下的比對。一致才放行；不一致就擋下，並用白話說明原因。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C5B8F"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E7568"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
    <marker id="arr-gold" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5A300"/></marker>
  </defs>
  <rect width="600" height="1110" fill="#FFFFFF"/>
  <text x="40" y="70" font-size="40" font-weight="700" fill="#1F2937">審 A、送 B？</text>
  <text x="40" y="122" font-size="40" font-weight="700" fill="#1F2937">送出前再比一次</text>
  <text x="40" y="164" font-size="24" fill="#4B5563">核准時記指紋，送出前重算</text>
  <rect x="40" y="206" width="520" height="160" rx="24" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
  <circle cx="74" cy="240" r="22" fill="#2C5B8F"/>
  <text x="74" y="249" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <g transform="translate(140 298) scale(0.7)"><rect x="-56" y="-42" width="112" height="84" rx="8" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="5"/><path d="M-46,32 L-14,-2 L8,18 L22,6 L46,32 z" fill="#2C5B8F" opacity="0.35"/><text x="0" y="12" font-size="40" font-weight="700" text-anchor="middle" fill="#2C5B8F">A</text></g>
  <g transform="translate(236 298) scale(0.55)"><rect x="-50" y="-50" width="100" height="100" rx="20" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="4"/><path d="M-10,8 a10,16 0 0 1 20,0 v5" fill="none" stroke="#2C5B8F" stroke-width="5" stroke-linecap="round"/><path d="M-22,8 a22,28 0 0 1 44,0 v11" fill="none" stroke="#2C5B8F" stroke-width="5" stroke-linecap="round"/><path d="M-34,8 a34,40 0 0 1 68,0 v17" fill="none" stroke="#2C5B8F" stroke-width="5" stroke-linecap="round"/></g>
  <text x="300" y="282" font-size="32" font-weight="700" fill="#2C5B8F">核准時</text>
  <text x="300" y="326" font-size="24" fill="#4B5563">人看過，記下指紋</text>
  <line x1="300" y1="370" x2="300" y2="400" stroke="#374151" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
  <rect x="40" y="408" width="520" height="160" rx="24" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
  <circle cx="74" cy="442" r="22" fill="#2C5B8F"/>
  <text x="74" y="451" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <g transform="translate(140 500) scale(0.7)"><rect x="-56" y="-42" width="112" height="84" rx="8" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="5"/><path d="M-46,32 L-14,-2 L8,18 L22,6 L46,32 z" fill="#2C5B8F" opacity="0.35"/><text x="0" y="12" font-size="40" font-weight="700" text-anchor="middle" fill="#2C5B8F">?</text></g>
  <g transform="translate(236 500) scale(0.55)"><rect x="-50" y="-50" width="100" height="100" rx="20" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="4"/><path d="M-10,8 a10,16 0 0 1 20,0 v5" fill="none" stroke="#2C5B8F" stroke-width="5" stroke-linecap="round"/><path d="M-22,8 a22,28 0 0 1 44,0 v11" fill="none" stroke="#2C5B8F" stroke-width="5" stroke-linecap="round"/><path d="M-34,8 a34,40 0 0 1 68,0 v17" fill="none" stroke="#2C5B8F" stroke-width="5" stroke-linecap="round"/></g>
  <text x="300" y="484" font-size="32" font-weight="700" fill="#2C5B8F">送出前</text>
  <text x="300" y="528" font-size="24" fill="#4B5563">要送的畫面再算一次</text>
  <line x1="300" y1="572" x2="300" y2="602" stroke="#374151" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
  <path d="M240,660 L300,610 L360,660 L300,710 z" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
  <text x="300" y="669" font-size="24" font-weight="700" text-anchor="middle" fill="#8A5D00">比對</text>
  <path d="M240,660 L150,660 L150,738" fill="none" stroke="#0E7568" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-green)"/>
  <path d="M360,660 L450,660 L450,738" fill="none" stroke="#B91C1C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-red)"/>
  <rect x="40" y="746" width="250" height="200" rx="24" fill="#E6F4F1" stroke="#0E7568" stroke-width="3"/>
  <g transform="translate(80 788) scale(1)"><circle r="22" fill="#0E7568"/><g transform="scale(0.50)"><polyline points="-30,0 -8,24 32,-24" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g></g>
  <text x="112" y="798" font-size="30" font-weight="700" fill="#0E7568">一致</text>
  <text x="165" y="866" font-size="24" text-anchor="middle" fill="#4B5563">放行，</text>
  <text x="165" y="904" font-size="24" text-anchor="middle" fill="#4B5563">照核准的送</text>
  <rect x="310" y="746" width="250" height="200" rx="24" fill="#FDECEC" stroke="#B91C1C" stroke-width="3"/>
  <g transform="translate(350 788) scale(1)"><circle r="22" fill="#B91C1C"/><g transform="scale(0.50)"><line x1="-26" y1="-26" x2="26" y2="26" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/><line x1="26" y1="-26" x2="-26" y2="26" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/></g></g>
  <text x="382" y="798" font-size="30" font-weight="700" fill="#B91C1C">對不上</text>
  <text x="435" y="866" font-size="24" text-anchor="middle" fill="#4B5563">擋下，用白話</text>
  <text x="435" y="904" font-size="24" text-anchor="middle" fill="#4B5563">說明原因</text>
  <rect x="40" y="970" width="520" height="110" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="300.0" y="1015" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937">人看過的這一張，</text>
  <text x="300.0" y="1057" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan fill="#8A5D00">就是送出去的那一張</tspan></text>
</svg>

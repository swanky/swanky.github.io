<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">旁白先量長度，再放進鏡頭</title>
  <desc id="d">一顆鏡頭的長度像一個框，旁白先生成、量出實際長度，放進框裡，前後各留約 0.3 秒。放不進去時有兩條路：把旁白加速超過約 1.2 倍不行，講太快會失去信任；改寫句子讓它變短才對。原則是先量再排，不從字數估秒數。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>

  <text x="48" y="122" font-size="26" fill="#4B5563">放不進去就改寫句子，不偷偷加速</text>
  <text x="48" y="186" font-size="26" font-weight="700" fill="#1F2937">放得進去：前後各留約 0.3 秒</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1134" width="600" height="1134" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">靜態圖也能「動」：運鏡要有理由</title>
  <desc id="d">四種讓靜態圖有變化的做法：緩推，用在人物意識到真相的那一刻；緩拉，表現她被空間包圍；第二張狀態圖，同一構圖只改一件事，例如手握簪到簪落地，用剪接代替生成動作；每 6 到 10 秒至少要有一個聲音或畫面的變化。不用 AI 變形假裝角色走路，也不要每張圖都慢慢放大。一張圖硬撐 20 秒，就是在消耗觀眾。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C5B8F"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E7568"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
    <marker id="arr-gold" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5A300"/></marker>
  </defs>
  <rect width="600" height="1134" fill="#FFFFFF"/>
  <text x="40" y="70" font-size="40" font-weight="700" fill="#1F2937">靜態圖也能「動」：</text>
  <text x="40" y="122" font-size="40" font-weight="700" fill="#1F2937">運鏡要有理由</text>
  <text x="40" y="164" font-size="24" fill="#4B5563">不用 AI 變形假裝走路</text>
  <rect x="40" y="206" width="520" height="176" rx="24" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
  <circle cx="72" cy="238" r="22" fill="#2C5B8F"/>
  <text x="72" y="247" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <g transform="translate(160 304) scale(0.82)"><rect x="-56" y="-40" width="112" height="80" rx="6" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="5"/><rect x="-24" y="-17" width="48" height="34" rx="3" fill="#2C5B8F" fill-opacity="0.18" stroke="#2C5B8F" stroke-width="3" stroke-dasharray="6 4"/><line x1="-50" y1="-34" x2="-28" y2="-20" stroke="#2C5B8F" stroke-width="4" stroke-linecap="round" marker-end="url(#arr-blue)"/><line x1="50" y1="-34" x2="28" y2="-20" stroke="#2C5B8F" stroke-width="4" stroke-linecap="round" marker-end="url(#arr-blue)"/><line x1="50" y1="34" x2="28" y2="20" stroke="#2C5B8F" stroke-width="4" stroke-linecap="round" marker-end="url(#arr-blue)"/><line x1="-50" y1="34" x2="-28" y2="20" stroke="#2C5B8F" stroke-width="4" stroke-linecap="round" marker-end="url(#arr-blue)"/></g>
  <text x="290" y="268" font-size="32" font-weight="700" fill="#2C5B8F">緩推</text>
  <text x="290" y="316" font-size="26" fill="#4B5563">人物意識到</text>
  <text x="290" y="354" font-size="26" fill="#4B5563">真相的那一刻</text>
  <rect x="40" y="402" width="520" height="176" rx="24" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
  <circle cx="72" cy="434" r="22" fill="#2C5B8F"/>
  <text x="72" y="443" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <g transform="translate(160 500) scale(0.82)"><rect x="-56" y="-40" width="112" height="80" rx="6" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="3" stroke-dasharray="8 6"/><rect x="-24" y="-17" width="48" height="34" rx="3" fill="#2C5B8F" fill-opacity="0.18" stroke="#2C5B8F" stroke-width="5"/><line x1="-28" y1="-20" x2="-50" y2="-34" stroke="#2C5B8F" stroke-width="4" stroke-linecap="round" marker-end="url(#arr-blue)"/><line x1="28" y1="-20" x2="50" y2="-34" stroke="#2C5B8F" stroke-width="4" stroke-linecap="round" marker-end="url(#arr-blue)"/><line x1="28" y1="20" x2="50" y2="34" stroke="#2C5B8F" stroke-width="4" stroke-linecap="round" marker-end="url(#arr-blue)"/><line x1="-28" y1="20" x2="-50" y2="34" stroke="#2C5B8F" stroke-width="4" stroke-linecap="round" marker-end="url(#arr-blue)"/></g>
  <text x="290" y="464" font-size="32" font-weight="700" fill="#2C5B8F">緩拉</text>
  <text x="290" y="512" font-size="26" fill="#4B5563">她被空間</text>
  <text x="290" y="550" font-size="26" fill="#4B5563">包圍住</text>
  <rect x="40" y="598" width="520" height="176" rx="24" fill="#FDF3E7" stroke="#B45309" stroke-width="3"/>
  <circle cx="72" cy="630" r="22" fill="#B45309"/>
  <text x="72" y="639" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <g transform="translate(160 696) scale(0.7789999999999999)"><rect x="-104" y="-40" width="92" height="80" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="5"/><g transform="translate(-58 -2) scale(0.55)"><line x1="-40" y1="34" x2="30" y2="-36" stroke="#B45309" stroke-width="7" stroke-linecap="round"/><circle cx="34" cy="-40" r="12" fill="#B45309"/></g><text x="-96" y="-12" font-size="20" font-weight="700" fill="#B45309">A</text><line x1="-6" y1="0" x2="8" y2="0" stroke="#374151" stroke-width="4" marker-end="url(#arr)"/><rect x="12" y="-40" width="92" height="80" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="5"/><line x1="26" y1="22" x2="90" y2="22" stroke="#CBD5E1" stroke-width="4"/><g transform="translate(58 14) rotate(50) scale(0.5)"><line x1="-40" y1="34" x2="30" y2="-36" stroke="#B45309" stroke-width="7" stroke-linecap="round"/><circle cx="34" cy="-40" r="12" fill="#B45309"/></g><text x="20" y="-12" font-size="20" font-weight="700" fill="#B45309">B</text></g>
  <text x="290" y="660" font-size="28" font-weight="700" fill="#B45309">第二張狀態圖</text>
  <text x="290" y="708" font-size="26" fill="#4B5563">手握簪→簪落地</text>
  <text x="290" y="746" font-size="26" fill="#4B5563">只改一件事</text>
  <rect x="40" y="794" width="520" height="176" rx="24" fill="#E6F4F1" stroke="#0E7568" stroke-width="3"/>
  <circle cx="72" cy="826" r="22" fill="#0E7568"/>
  <text x="72" y="835" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <g transform="translate(132.12 892) scale(0.656)"><circle r="42" fill="#FFFFFF" stroke="#0E7568" stroke-width="5"/><line x1="0" y1="0" x2="0" y2="-26" stroke="#0E7568" stroke-width="6" stroke-linecap="round"/><line x1="0" y1="0" x2="20" y2="10" stroke="#0E7568" stroke-width="6" stroke-linecap="round"/><circle r="5" fill="#0E7568"/></g>
  <g transform="translate(197.72 892) scale(0.82)"><polyline points="-35.0,0.0 -33.2,2.2 -31.5,4.5 -29.8,6.2 -28.0,6.6 -26.2,5.4 -24.5,2.6 -22.8,-1.4 -21.0,-5.7 -19.2,-9.3 -17.5,-11.1 -15.8,-10.5 -14.0,-7.3 -12.2,-2.1 -10.5,4.3 -8.8,10.3 -7.0,14.5 -5.2,15.7 -3.5,13.4 -1.8,7.9 0.0,0.0 1.8,-7.9 3.5,-13.4 5.2,-15.7 7.0,-14.5 8.8,-10.3 10.5,-4.3 12.2,2.1 14.0,7.3 15.8,10.5 17.5,11.1 19.2,9.3 21.0,5.7 22.8,1.4 24.5,-2.6 26.2,-5.4 28.0,-6.6 29.8,-6.2 31.5,-4.5 33.2,-2.2 35.0,-0.0" fill="none" stroke="#0E7568" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="290" y="856" font-size="28" font-weight="700" fill="#0E7568">每 6–10 秒</text>
  <text x="290" y="904" font-size="26" fill="#4B5563">至少一個聲音</text>
  <text x="290" y="942" font-size="26" fill="#4B5563">或畫面的變化</text>
  <rect x="40" y="994" width="520" height="110" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="300.0" y="1039" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937">一張圖硬撐 20 秒，</text>
  <text x="300.0" y="1081" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan fill="#8A5D00">就是在消耗觀眾</tspan></text>
</svg>

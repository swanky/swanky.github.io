<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1130" width="600" height="1130" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">每一鏡，只給三種結論</title>
  <desc id="d">三個問題往下走：核心項全成立嗎？否就是僅概念參考。次要項也全成立嗎？是就是通過、正式選片。寫得出剪輯怎麼避開嗎？是就是有條件通過，否就是僅概念參考。拿不準就往保守降級。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="600" height="1130" fill="#FFFFFF"/>
  <text x="40" y="70" font-size="40" font-weight="700" fill="#1F2937">每一鏡，只給三種結論</text>
  <text x="40" y="116" font-size="24" fill="#4B5563">看片前寫好清單、標出核心項，</text>
  <text x="40" y="150" font-size="24" fill="#4B5563">看完再逐條判</text>
  <rect x="40" y="196" width="520" height="100" rx="24" fill="#FDF3E7" stroke="#B45309" stroke-width="3"/>
  <circle cx="78" cy="246" r="22" fill="#B45309"/>
  <text x="78" y="255.36" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <text x="116" y="242" font-size="30" font-weight="700" fill="#B45309">核心項全成立？</text>
  <text x="116" y="278" font-size="22" fill="#4B5563">主動作＋角色身分</text>
  <line x1="80" y1="296" x2="80" y2="424" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="380" x2="80" y2="424" stroke="#374151" stroke-width="4" stroke-linecap="butt" marker-end="url(#arr)"/>
  <line x1="80" y1="346" x2="176" y2="346" stroke="#374151" stroke-width="4" stroke-linecap="butt" marker-end="url(#arr)"/>
  <text x="128" y="334" font-size="24" font-weight="700" text-anchor="middle" fill="#B91C1C">否</text>
  <rect x="180" y="312" width="380" height="68" rx="18" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
  <text x="200" y="356" font-size="28" font-weight="700" fill="#64748B">僅概念參考</text>
  <text x="544" y="355" font-size="22" text-anchor="end" fill="#4B5563">不進成片</text>
  <text x="92" y="410" font-size="24" font-weight="700" fill="#0E7568">是</text>
  <rect x="40" y="426" width="520" height="100" rx="24" fill="#FDF3E7" stroke="#B45309" stroke-width="3"/>
  <circle cx="78" cy="476" r="22" fill="#B45309"/>
  <text x="78" y="485.36" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <text x="116" y="472" font-size="30" font-weight="700" fill="#B45309">次要項也全成立？</text>
  <text x="116" y="508" font-size="22" fill="#4B5563">清單上其餘每一條</text>
  <line x1="80" y1="526" x2="80" y2="610" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="610" x2="80" y2="654" stroke="#374151" stroke-width="4" stroke-linecap="butt" marker-end="url(#arr)"/>
  <line x1="80" y1="576" x2="176" y2="576" stroke="#374151" stroke-width="4" stroke-linecap="butt" marker-end="url(#arr)"/>
  <text x="128" y="564" font-size="24" font-weight="700" text-anchor="middle" fill="#0E7568">是</text>
  <rect x="180" y="542" width="380" height="68" rx="18" fill="#E6F4F1" stroke="#0E7568" stroke-width="3"/>
  <text x="200" y="586" font-size="28" font-weight="700" fill="#0E7568">通過，正式選片</text>
  <text x="544" y="585" font-size="22" text-anchor="end" fill="#4B5563">進成片</text>
  <text x="92" y="640" font-size="24" font-weight="700" fill="#B91C1C">否</text>
  <rect x="40" y="656" width="520" height="100" rx="24" fill="#FDF3E7" stroke="#B45309" stroke-width="3"/>
  <circle cx="78" cy="706" r="22" fill="#B45309"/>
  <text x="78" y="715.36" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <text x="116" y="702" font-size="30" font-weight="700" fill="#B45309">寫得出怎麼避開？</text>
  <text x="116" y="738" font-size="22" fill="#4B5563">剪掉、裁切、調色</text>
  <line x1="80" y1="756" x2="80" y2="840" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="840" x2="80" y2="884" stroke="#374151" stroke-width="4" stroke-linecap="butt" marker-end="url(#arr)"/>
  <line x1="80" y1="806" x2="176" y2="806" stroke="#374151" stroke-width="4" stroke-linecap="butt" marker-end="url(#arr)"/>
  <text x="128" y="794" font-size="24" font-weight="700" text-anchor="middle" fill="#0E7568">是</text>
  <rect x="180" y="772" width="380" height="68" rx="18" fill="#FDF3E7" stroke="#B45309" stroke-width="3"/>
  <text x="200" y="816" font-size="28" font-weight="700" fill="#B45309">有條件通過</text>
  <text x="544" y="815" font-size="22" text-anchor="end" fill="#4B5563">寫明怎麼避</text>
  <text x="92" y="870" font-size="24" font-weight="700" fill="#B91C1C">否</text>
  <rect x="40" y="886" width="520" height="84" rx="18" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
  <text x="300" y="940" font-size="26" font-weight="700" text-anchor="middle" fill="#4B5563"><tspan fill="#64748B">僅概念參考</tspan><tspan fill="#4B5563">　先查錯在首幀還是動作</tspan></text>
  <rect x="40" y="1000" width="520" height="110" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="300.0" y="1046.1799999999998" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937">拿不準？<tspan fill="#8A5D00">往保守降級</tspan></text>
  <text x="300.0" y="1083.9799999999998" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937">兩人看法不同就不進成片</text>
</svg>

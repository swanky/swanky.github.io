<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">字幕檔，不是「有字幕的影片」</title>
  <desc id="d">字幕有兩種：燒進畫面的字幕長在畫面裡、關不掉；另外交的字幕檔可以開關、交給平台處理，也方便自動翻譯。對方要字幕檔時，只交一支有字幕的影片不夠；必要時再準備一份無字版。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5A300"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C5B8F"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#FFFFFF"/>
  <text x="48" y="80" font-size="48" font-weight="700" fill="#1F2937">字幕檔，不是「有字幕的影片」</text>
  <text x="48" y="126" font-size="26" fill="#4B5563">對方要字幕檔，就另外交；必要時再加一份無字版</text>
  <rect x="48" y="168" width="336" height="400" rx="24" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
  <circle cx="88" cy="210" r="24" fill="#64748B"/>
  <text x="88" y="220.08" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">1</text>
  <g transform="translate(216,290) scale(0.95)"><rect x="-110.0" y="-62.0" width="220" height="124" rx="10" fill="#1F2937"/><circle cx="48.4" cy="-22.32" r="17.360000000000003" fill="#E5A300"/><path d="M-110.0,37.199999999999996 L-33.0,-6.2 L22.0,24.8 L66.0,6.2 L110.0,37.199999999999996 L110.0,52.0 Q110.0,62.0 100.0,62.0 L-100.0,62.0 Q-110.0,62.0 -110.0,52.0 z" fill="#475569"/><rect x="-79.2" y="27.28" width="158.4" height="24.8" rx="4" fill="#FFFFFF"/><rect x="-66.0" y="34.720000000000006" width="132.0" height="9.92" rx="3" fill="#1F2937"/><g transform="translate(96,-44) scale(0.7)"><path d="M-16,-6 L-16,-20 A16,16 0 0 1 16,-20 L16,-6" fill="none" stroke="#64748B" stroke-width="6"/><rect x="-26" y="-8" width="52" height="40" rx="7" fill="#64748B"/><circle cx="0" cy="10" r="5" fill="#FFFFFF"/></g></g>
  <text x="216" y="410" text-anchor="middle" font-size="34" font-weight="700" fill="#64748B">燒進畫面</text>
  <text x="216" y="456" text-anchor="middle" font-size="26" fill="#4B5563">字長在畫面裡，</text>
  <text x="216" y="492" text-anchor="middle" font-size="26" fill="#4B5563">關不掉</text>
  <rect x="126.04" y="514" width="179.92" height="40" rx="20.0" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text x="216" y="541.92" text-anchor="middle" font-size="22" font-weight="700" fill="#64748B">不等於字幕檔</text>
  <rect x="432" y="168" width="336" height="400" rx="24" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
  <circle cx="472" cy="210" r="24" fill="#E5A300"/>
  <text x="472" y="220.08" text-anchor="middle" font-size="28" font-weight="700" fill="#1F2937">2</text>
  <g transform="translate(570,290) scale(0.85)"><rect x="-110.0" y="-62.0" width="220" height="124" rx="10" fill="#1F2937"/><circle cx="48.4" cy="-22.32" r="17.360000000000003" fill="#E5A300"/><path d="M-110.0,37.199999999999996 L-33.0,-6.2 L22.0,24.8 L66.0,6.2 L110.0,37.199999999999996 L110.0,52.0 Q110.0,62.0 100.0,62.0 L-100.0,62.0 Q-110.0,62.0 -110.0,52.0 z" fill="#475569"/><g transform="translate(150,0) scale(0.75)"><path d="M-30,-40 L14,-40 L30,-24 L30,40 L-30,40 z" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="5" stroke-linejoin="round"/><path d="M14,-40 L14,-24 L30,-24" fill="none" stroke="#2C5B8F" stroke-width="4"/><rect x="-22" y="-6" width="44" height="22" rx="4" fill="#2C5B8F"/><text x="0" y="11" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">SRT</text></g><g transform="translate(150,70) scale(0.6)"><rect x="-34" y="-18" width="68" height="36" rx="18" fill="#2C5B8F"/><circle cx="16" cy="0" r="13" fill="#FFFFFF"/></g></g>
  <text x="600" y="410" text-anchor="middle" font-size="34" font-weight="700" fill="#8A5D00">影片＋字幕檔</text>
  <text x="600" y="456" text-anchor="middle" font-size="26" fill="#4B5563">可以開關，</text>
  <text x="600" y="492" text-anchor="middle" font-size="26" fill="#4B5563">方便自動翻譯</text>
  <rect x="498.38" y="514" width="203.24" height="40" rx="20.0" fill="#E5A300" stroke="#E5A300" stroke-width="2"/>
  <text x="600" y="541.92" text-anchor="middle" font-size="22" font-weight="700" fill="#1F2937">對方要的字幕檔</text>
  <rect x="816" y="168" width="336" height="400" rx="24" fill="#E6F4F1" stroke="#0E7568" stroke-width="3"/>
  <circle cx="856" cy="210" r="24" fill="#0E7568"/>
  <text x="856" y="220.08" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">3</text>
  <g transform="translate(984,290) scale(0.95)"><rect x="-110.0" y="-62.0" width="220" height="124" rx="10" fill="#1F2937"/><circle cx="48.4" cy="-22.32" r="17.360000000000003" fill="#E5A300"/><path d="M-110.0,37.199999999999996 L-33.0,-6.2 L22.0,24.8 L66.0,6.2 L110.0,37.199999999999996 L110.0,52.0 Q110.0,62.0 100.0,62.0 L-100.0,62.0 Q-110.0,62.0 -110.0,52.0 z" fill="#475569"/></g>
  <text x="984" y="410" text-anchor="middle" font-size="34" font-weight="700" fill="#0E7568">無字版</text>
  <text x="984" y="456" text-anchor="middle" font-size="26" fill="#4B5563">畫面上</text>
  <text x="984" y="492" text-anchor="middle" font-size="26" fill="#4B5563">不帶任何字</text>
  <rect x="905.7" y="514" width="156.6" height="40" rx="20.0" fill="#FFFFFF" stroke="#0E7568" stroke-width="2"/>
  <text x="984" y="541.92" text-anchor="middle" font-size="22" font-weight="700" fill="#0E7568">必要時加交</text>
  <rect x="48" y="594" width="1104" height="70" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="80" y="639.08" font-size="28" font-weight="700" fill="#1F2937">對方要字幕檔，只交<tspan fill="#8A5D00">有字幕的影片</tspan>不夠</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">審 A、送 B？送出前再比一次</title>
  <desc id="d">防止「審 A、送 B」：人核准一張畫面時，系統記下那個檔案的指紋；真正送出前，把實際要送的畫面再算一次指紋，和核准當下的比對。一致才放行；不一致就擋下，並用白話說明原因。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C5B8F"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E7568"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
    <marker id="arr-gold" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5A300"/></marker>
  </defs>
  <rect width="1200" height="690" fill="#FFFFFF"/>
  <text x="48" y="76" font-size="48" font-weight="700" fill="#1F2937">審 A、送 B？送出前再比一次</text>
  <text x="48" y="122" font-size="26" fill="#4B5563">核准時記下檔案指紋，送出前重算；對不上就擋下</text>
  <rect x="48" y="166" width="290" height="380" rx="24" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
  <circle cx="90" cy="208" r="24" fill="#2C5B8F"/>
  <text x="90" y="218" font-size="28" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <g transform="translate(158 290) scale(0.9)"><rect x="-56" y="-42" width="112" height="84" rx="8" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="5"/><path d="M-46,32 L-14,-2 L8,18 L22,6 L46,32 z" fill="#2C5B8F" opacity="0.35"/><text x="0" y="12" font-size="40" font-weight="700" text-anchor="middle" fill="#2C5B8F">A</text></g>
  <g transform="translate(262 300) scale(0.7)"><rect x="-50" y="-50" width="100" height="100" rx="20" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="4"/><path d="M-10,8 a10,16 0 0 1 20,0 v5" fill="none" stroke="#2C5B8F" stroke-width="5" stroke-linecap="round"/><path d="M-22,8 a22,28 0 0 1 44,0 v11" fill="none" stroke="#2C5B8F" stroke-width="5" stroke-linecap="round"/><path d="M-34,8 a34,40 0 0 1 68,0 v17" fill="none" stroke="#2C5B8F" stroke-width="5" stroke-linecap="round"/></g>
  <text x="193" y="410" font-size="34" font-weight="700" text-anchor="middle" fill="#2C5B8F">核准時</text>
  <text x="193" y="456" font-size="26" text-anchor="middle" fill="#4B5563">人看過這張，</text>
  <text x="193" y="494" font-size="26" text-anchor="middle" fill="#4B5563">系統記下指紋</text>
  <line x1="342" y1="356" x2="374" y2="356" stroke="#374151" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
  <rect x="378" y="166" width="290" height="380" rx="24" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
  <circle cx="420" cy="208" r="24" fill="#2C5B8F"/>
  <text x="420" y="218" font-size="28" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <g transform="translate(488 290) scale(0.9)"><rect x="-56" y="-42" width="112" height="84" rx="8" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="5"/><path d="M-46,32 L-14,-2 L8,18 L22,6 L46,32 z" fill="#2C5B8F" opacity="0.35"/><text x="0" y="12" font-size="40" font-weight="700" text-anchor="middle" fill="#2C5B8F">?</text></g>
  <g transform="translate(592 300) scale(0.7)"><rect x="-50" y="-50" width="100" height="100" rx="20" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="4"/><path d="M-10,8 a10,16 0 0 1 20,0 v5" fill="none" stroke="#2C5B8F" stroke-width="5" stroke-linecap="round"/><path d="M-22,8 a22,28 0 0 1 44,0 v11" fill="none" stroke="#2C5B8F" stroke-width="5" stroke-linecap="round"/><path d="M-34,8 a34,40 0 0 1 68,0 v17" fill="none" stroke="#2C5B8F" stroke-width="5" stroke-linecap="round"/></g>
  <text x="523" y="410" font-size="34" font-weight="700" text-anchor="middle" fill="#2C5B8F">送出前</text>
  <text x="523" y="456" font-size="26" text-anchor="middle" fill="#4B5563">把要送的畫面，</text>
  <text x="523" y="494" font-size="26" text-anchor="middle" fill="#4B5563">再算一次指紋</text>
  <path d="M734,356 L790,300 L846,356 L790,412 z" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
  <text x="790" y="366" font-size="24" font-weight="700" text-anchor="middle" fill="#8A5D00">比對</text>
  <line x1="672" y1="356" x2="728" y2="356" stroke="#374151" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
  <path d="M800,300 L800,262 L868,262" fill="none" stroke="#0E7568" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-green)"/>
  <path d="M800,412 L800,450 L868,450" fill="none" stroke="#B91C1C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-red)"/>
  <rect x="876" y="166" width="276" height="176" rx="24" fill="#E6F4F1" stroke="#0E7568" stroke-width="3"/>
  <g transform="translate(924 214) scale(1)"><circle r="26" fill="#0E7568"/><g transform="scale(0.59)"><polyline points="-30,0 -8,24 32,-24" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g></g>
  <text x="962" y="224" font-size="34" font-weight="700" fill="#0E7568">一致</text>
  <text x="1014" y="286" font-size="26" text-anchor="middle" fill="#4B5563">放行，</text>
  <text x="1014" y="322" font-size="26" text-anchor="middle" fill="#4B5563">照核准的送出</text>
  <rect x="876" y="370" width="276" height="176" rx="24" fill="#FDECEC" stroke="#B91C1C" stroke-width="3"/>
  <g transform="translate(924 418) scale(1)"><circle r="26" fill="#B91C1C"/><g transform="scale(0.59)"><line x1="-26" y1="-26" x2="26" y2="26" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/><line x1="26" y1="-26" x2="-26" y2="26" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/></g></g>
  <text x="962" y="428" font-size="34" font-weight="700" fill="#B91C1C">對不上</text>
  <text x="1014" y="490" font-size="26" text-anchor="middle" fill="#4B5563">擋下，</text>
  <text x="1014" y="526" font-size="26" text-anchor="middle" fill="#4B5563">用白話說明原因</text>
  <rect x="48" y="580" width="1104" height="76" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="600.0" y="629" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937">人看過的這一張，<tspan fill="#8A5D00">就是送出去的那一張</tspan></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">AI Coding 選型九層決策框架</title>
  <desc id="desc">從業務目標、操作介面、Agent harness、LLM、推論供應商、Gateway、專案知識、執行治理到評估營運的九層架構。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10243b"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0e7490"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity=".32"/></filter>
  </defs>
  <rect width="1200" height="900" rx="28" fill="url(#bg)"/>
  <text x="70" y="78" fill="#f8fafc" font-size="36" font-weight="700" font-family="Arial, 'Noto Sans TC', sans-serif">AI Coding 選型的九層決策框架</text>
  <text x="70" y="116" fill="#94a3b8" font-size="20" font-family="Arial, 'Noto Sans TC', sans-serif">模型只是其中一層；成果來自整套工作系統。</text>
  <g font-family="Arial, 'Noto Sans TC', sans-serif" filter="url(#shadow)">
    <g transform="translate(70 155)"><rect width="1060" height="66" rx="14" fill="#0f766e"/><circle cx="42" cy="33" r="20" fill="#ccfbf1"/><text x="42" y="40" text-anchor="middle" fill="#0f766e" font-size="19" font-weight="700">1</text><text x="80" y="29" fill="#fff" font-size="22" font-weight="700">業務目標與任務</text><text x="80" y="51" fill="#ccfbf1" font-size="16">要縮短什麼時間、降低什麼風險？</text></g>
    <g transform="translate(95 231)"><rect width="1010" height="66" rx="14" fill="#0e7490"/><circle cx="42" cy="33" r="20" fill="#cffafe"/><text x="42" y="40" text-anchor="middle" fill="#0e7490" font-size="19" font-weight="700">2</text><text x="80" y="29" fill="#fff" font-size="22" font-weight="700">操作介面</text><text x="80" y="51" fill="#cffafe" font-size="16">IDE、CLI、Desktop、Cloud Agent、CI</text></g>
    <g transform="translate(120 307)"><rect width="960" height="66" rx="14" fill="#0369a1"/><circle cx="42" cy="33" r="20" fill="#e0f2fe"/><text x="42" y="40" text-anchor="middle" fill="#0369a1" font-size="19" font-weight="700">3</text><text x="80" y="29" fill="#fff" font-size="22" font-weight="700">Agent harness</text><text x="80" y="51" fill="#e0f2fe" font-size="16">搜尋、規劃、編輯、驗證、回復與 subagent</text></g>
    <g transform="translate(145 383)"><rect width="910" height="66" rx="14" fill="#2563eb"/><circle cx="42" cy="33" r="20" fill="#dbeafe"/><text x="42" y="40" text-anchor="middle" fill="#2563eb" font-size="19" font-weight="700">4</text><text x="80" y="29" fill="#fff" font-size="22" font-weight="700">LLM</text><text x="80" y="51" fill="#dbeafe" font-size="16">coding、reasoning、tool use、vision、context</text></g>
    <g transform="translate(170 459)"><rect width="860" height="66" rx="14" fill="#4f46e5"/><circle cx="42" cy="33" r="20" fill="#e0e7ff"/><text x="42" y="40" text-anchor="middle" fill="#4f46e5" font-size="19" font-weight="700">5</text><text x="80" y="29" fill="#fff" font-size="22" font-weight="700">推論供應商</text><text x="80" y="51" fill="#e0e7ff" font-size="16">官方 API、雲端平台、OpenRouter provider、on-prem</text></g>
    <g transform="translate(195 535)"><rect width="810" height="66" rx="14" fill="#6d28d9"/><circle cx="42" cy="33" r="20" fill="#ede9fe"/><text x="42" y="40" text-anchor="middle" fill="#6d28d9" font-size="19" font-weight="700">6</text><text x="80" y="29" fill="#fff" font-size="22" font-weight="700">Gateway／Router</text><text x="80" y="51" fill="#ede9fe" font-size="16">key、fallback、成本、region 與資料政策</text></g>
    <g transform="translate(220 611)"><rect width="760" height="66" rx="14" fill="#7c3aed"/><circle cx="42" cy="33" r="20" fill="#f3e8ff"/><text x="42" y="40" text-anchor="middle" fill="#7c3aed" font-size="19" font-weight="700">7</text><text x="80" y="29" fill="#fff" font-size="22" font-weight="700">專案知識與協定</text><text x="80" y="51" fill="#f3e8ff" font-size="16">AGENTS.md、rules、skills、MCP、ADR、spec</text></g>
    <g transform="translate(245 687)"><rect width="710" height="66" rx="14" fill="#a16207"/><circle cx="42" cy="33" r="20" fill="#fef3c7"/><text x="42" y="40" text-anchor="middle" fill="#a16207" font-size="19" font-weight="700">8</text><text x="80" y="29" fill="#fff" font-size="22" font-weight="700">執行與治理</text><text x="80" y="51" fill="#fef3c7" font-size="16">sandbox、secrets、SSO、RBAC、audit、network</text></g>
    <g transform="translate(270 763)"><rect width="660" height="66" rx="14" fill="#b45309"/><circle cx="42" cy="33" r="20" fill="#ffedd5"/><text x="42" y="40" text-anchor="middle" fill="#b45309" font-size="19" font-weight="700">9</text><text x="80" y="29" fill="#fff" font-size="22" font-weight="700">評估與營運</text><text x="80" y="51" fill="#ffedd5" font-size="16">internal eval、accepted-task cost、觀測、回滾</text></g>
  </g>
</svg>

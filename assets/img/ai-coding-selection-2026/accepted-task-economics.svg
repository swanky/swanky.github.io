<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">每個被接受任務的成本構成</title>
  <desc id="desc">有效 CP 值應以通過品質門檻的任務價值除以席次、推論、等待、重工、維運、治理與風險成本。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#122b46"/></linearGradient></defs>
  <rect width="1200" height="650" rx="28" fill="url(#bg)"/>
  <g font-family="Arial, 'Noto Sans TC', sans-serif">
    <text x="70" y="74" fill="#f8fafc" font-size="36" font-weight="700">別只看月費：真正該算的是 accepted task</text>
    <rect x="70" y="125" width="1060" height="112" rx="20" fill="#0f766e" opacity=".96"/>
    <text x="600" y="171" text-anchor="middle" fill="#ccfbf1" font-size="21">有效 CP 值</text>
    <text x="600" y="211" text-anchor="middle" fill="#fff" font-size="29" font-weight="700">被接受且通過品質門檻的任務價值 ÷ 全部真實成本</text>
    <text x="70" y="294" fill="#94a3b8" font-size="19">全部真實成本包含：</text>
    <g font-size="20" font-weight="700">
      <g transform="translate(70 325)"><rect width="310" height="92" rx="16" fill="#1d4ed8"/><text x="155" y="41" text-anchor="middle" fill="#fff">席次＋API／credits</text><text x="155" y="68" text-anchor="middle" fill="#bfdbfe" font-size="16" font-weight="400">訂閱、token、gateway</text></g>
      <g transform="translate(445 325)"><rect width="310" height="92" rx="16" fill="#4f46e5"/><text x="155" y="41" text-anchor="middle" fill="#fff">人工修正＋review</text><text x="155" y="68" text-anchor="middle" fill="#c7d2fe" font-size="16" font-weight="400">資深工程師的時間最貴</text></g>
      <g transform="translate(820 325)"><rect width="310" height="92" rx="16" fill="#7c3aed"/><text x="155" y="41" text-anchor="middle" fill="#fff">重試＋等待＋回滾</text><text x="155" y="68" text-anchor="middle" fill="#ddd6fe" font-size="16" font-weight="400">CI、失敗 loop、復原</text></g>
      <g transform="translate(255 452)"><rect width="310" height="92" rx="16" fill="#a16207"/><text x="155" y="41" text-anchor="middle" fill="#fff">平台維運＋治理</text><text x="155" y="68" text-anchor="middle" fill="#fef3c7" font-size="16" font-weight="400">policy、版本、支援、稽核</text></g>
      <g transform="translate(635 452)"><rect width="310" height="92" rx="16" fill="#b45309"/><text x="155" y="41" text-anchor="middle" fill="#fff">預期事故風險</text><text x="155" y="68" text-anchor="middle" fill="#ffedd5" font-size="16" font-weight="400">資料、品質與 production 代價</text></g>
    </g>
    <text x="600" y="601" text-anchor="middle" fill="#e2e8f0" font-size="21">低價模型多跑五次，再讓人修半小時，通常不便宜。</text>
  </g>
</svg>

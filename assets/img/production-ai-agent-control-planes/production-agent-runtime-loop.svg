<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">Production AI Agent 執行迴圈</title>
  <desc id="desc">一次 Agent 任務由確定性 Orchestrator 載入指令與狀態，模型提出動作，系統驗證證據與權限，通過後執行工具、保存收據、更新狀態，最後依 Completion Contract 決定繼續、等待核准、交接或完成。</desc>
  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#17243b"/></pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050e1b"/><stop offset="1" stop-color="#0c1830"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#7dd3fc"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#fb7185"/></marker>
    <style>.t{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#f8fafc}.h{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#a9b8cc}.bh{font-size:19px;font-weight:700}.b{font-size:15px;fill:#b9c6d8}.s{font-size:13px;fill:#94a3b8}.mono{font-family:Consolas,"JetBrains Mono",monospace}.flow{fill:none;stroke:#7dd3fc;stroke-width:2.2;marker-end:url(#a)}.fail{fill:none;stroke:#fb7185;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#ar)}</style>
  </defs>
  <rect width="1200" height="840" rx="24" fill="url(#bg)"/><rect width="1200" height="840" rx="24" fill="url(#grid)" opacity=".58"/>
  <text class="t h" x="52" y="58">一次 Production Agent 任務，應該怎麼跑？</text>
  <text class="t sub" x="52" y="88">把模型放在受控決策點，不讓它自行改寫流程、權限與完成狀態</text>

  <path class="flow" d="M178 180H258"/><path class="flow" d="M438 180H518"/><path class="flow" d="M698 180H778"/><path class="flow" d="M958 180H1028"/>
  <path class="flow" d="M1118 234V327"/><path class="flow" d="M1028 380H958"/><path class="flow" d="M778 380H698"/><path class="flow" d="M518 380H438"/><path class="flow" d="M258 380H178"/>
  <path class="flow" d="M90 434V545"/>
  <path class="flow" d="M108 434V510H390V545"/>

  <g>
    <rect x="38" y="126" width="140" height="108" rx="14" fill="#122033" stroke="#94a3b8" stroke-width="2"/>
    <text class="t bh" x="108" y="165" text-anchor="middle">1｜接收目標</text><text class="t b" x="108" y="194" text-anchor="middle">Goal＋Scope</text><text class="t s" x="108" y="216" text-anchor="middle">先驗證可接受性</text>
    <rect x="258" y="126" width="180" height="108" rx="14" fill="#092b3c" stroke="#22d3ee" stroke-width="2"/>
    <text class="t bh" x="348" y="165" text-anchor="middle">2｜載入指令</text><text class="t b" x="348" y="194" text-anchor="middle">Artifact＋Context</text><text class="t s" x="348" y="216" text-anchor="middle">固定版本、按需組裝</text>
    <rect x="518" y="126" width="180" height="108" rx="14" fill="#241447" stroke="#c084fc" stroke-width="2"/>
    <text class="t bh" x="608" y="165" text-anchor="middle">3｜取回狀態</text><text class="t b" x="608" y="194" text-anchor="middle">Run＋Checkpoint</text><text class="t s" x="608" y="216" text-anchor="middle">只從成功提交點續跑</text>
    <rect x="778" y="126" width="180" height="108" rx="14" fill="#18264c" stroke="#818cf8" stroke-width="2"/>
    <text class="t bh" x="868" y="165" text-anchor="middle">4｜模型提案</text><text class="t b" x="868" y="194" text-anchor="middle">Action Proposal</text><text class="t s" x="868" y="216" text-anchor="middle">結構化輸出，不直接執行</text>
    <rect x="1028" y="126" width="142" height="108" rx="14" fill="#1d1748" stroke="#818cf8" stroke-width="2"/>
    <text class="t bh" x="1099" y="165" text-anchor="middle">5｜證據驗證</text><text class="t b" x="1099" y="194" text-anchor="middle">Schema＋Source</text><text class="t s" x="1099" y="216" text-anchor="middle">主張與輸入一致</text>

    <rect x="1028" y="327" width="142" height="107" rx="14" fill="#3a1028" stroke="#fb7185" stroke-width="2"/>
    <text class="t bh" x="1099" y="365" text-anchor="middle">6｜權限閘門</text><text class="t b" x="1099" y="393" text-anchor="middle">Policy＋Approval</text><text class="t s" x="1099" y="415" text-anchor="middle">執行／拒絕／等待</text>
    <rect x="778" y="327" width="180" height="107" rx="14" fill="#0f302b" stroke="#34d399" stroke-width="2"/>
    <text class="t bh" x="868" y="365" text-anchor="middle">7｜工具執行</text><text class="t b" x="868" y="393" text-anchor="middle">Tool Gateway</text><text class="t s" x="868" y="415" text-anchor="middle">冪等鍵＋最小權限</text>
    <rect x="518" y="327" width="180" height="107" rx="14" fill="#102c3a" stroke="#38bdf8" stroke-width="2"/>
    <text class="t bh" x="608" y="365" text-anchor="middle">8｜保存收據</text><text class="t b" x="608" y="393" text-anchor="middle">Receipt＋Hash</text><text class="t s" x="608" y="415" text-anchor="middle">保留原始工具結果</text>
    <rect x="258" y="327" width="180" height="107" rx="14" fill="#241447" stroke="#c084fc" stroke-width="2"/>
    <text class="t bh" x="348" y="365" text-anchor="middle">9｜原子更新</text><text class="t b" x="348" y="393" text-anchor="middle">State Commit</text><text class="t s" x="348" y="415" text-anchor="middle">產物與狀態一起提交</text>
    <rect x="38" y="327" width="140" height="107" rx="14" fill="#302109" stroke="#fbbf24" stroke-width="2"/>
    <text class="t bh" x="108" y="365" text-anchor="middle">10｜驗收</text><text class="t b" x="108" y="393" text-anchor="middle">Completion</text><text class="t s" x="108" y="415" text-anchor="middle">Contract 判定</text>
  </g>

  <g>
    <rect x="42" y="545" width="138" height="110" rx="16" fill="#12362c" stroke="#34d399" stroke-width="2"/>
    <circle cx="68" cy="574" r="7" fill="#34d399" filter="url(#glow)"/>
    <text class="t bh" x="111" y="582" text-anchor="middle">Completed</text><text class="t b" x="111" y="612" text-anchor="middle">所有條件＋證據</text><text class="t s" x="111" y="636" text-anchor="middle">最終狀態不可自封</text>
    <rect x="300" y="545" width="180" height="110" rx="16" fill="#302109" stroke="#fbbf24" stroke-width="2"/>
    <text class="t bh" x="390" y="582" text-anchor="middle">Next Step</text><text class="t b" x="390" y="612" text-anchor="middle">條件尚未完成</text><text class="t s" x="390" y="636" text-anchor="middle">回到版本化 State</text>
    <rect x="600" y="545" width="180" height="110" rx="16" fill="#3a1028" stroke="#fb7185" stroke-width="2"/>
    <text class="t bh" x="690" y="582" text-anchor="middle">Awaiting Approval</text><text class="t b" x="690" y="612" text-anchor="middle">綁定 Action Fingerprint</text><text class="t s" x="690" y="636" text-anchor="middle">內容改變就重新核准</text>
    <rect x="900" y="545" width="250" height="110" rx="16" fill="#25213d" stroke="#a78bfa" stroke-width="2"/>
    <text class="t bh" x="1025" y="582" text-anchor="middle">Human／Agent Handoff</text><text class="t b" x="1025" y="612" text-anchor="middle">State＋Evidence＋Blocked Reason</text><text class="t s" x="1025" y="636" text-anchor="middle">交接是正常路徑，不是失敗補丁</text>
  </g>

  <path class="fail" d="M1098 327C1098 275 930 270 868 234"/><text class="t s" x="988" y="268" text-anchor="middle" fill="#fda4af">證據不足 → 修正提案</text>
  <path class="fail" d="M1098 434C1098 490 760 485 690 545"/><text class="t s" x="932" y="490" text-anchor="middle" fill="#fda4af">高風險 → 等待核准</text>
  <path class="fail" d="M868 434C868 510 1015 505 1025 545"/><text class="t s" x="952" y="520" text-anchor="middle" fill="#fda4af">不可恢復／超出 Scope</text>
  <path class="flow" d="M390 545C390 500 205 505 205 270H608V236"/>
  <text class="t s" x="405" y="260" text-anchor="middle">下一步重新載入 State</text>

  <rect x="52" y="712" width="1096" height="76" rx="16" fill="#0d1b2d" stroke="#334155"/>
  <text class="t bh" x="80" y="744">硬規則</text>
  <text class="t b" x="180" y="744">模型不能自行放寬權限、改寫 State Transition、跳過 Evidence Validator，或宣布自己已通過 Completion Contract。</text>
  <text class="t s" x="180" y="770">每次外部副作用都要產生 receipt；每次重試都要先判斷前一次是否其實已成功。</text>
</svg>

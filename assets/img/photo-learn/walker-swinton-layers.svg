<text x="118" y="584" font-size="24" font-weight="700" text-anchor="middle" fill="#1F2937">相機</text>
<text x="242.4" y="584" font-size="24" font-weight="700" text-anchor="middle" fill="#B45309">前景・失焦</text>
<text x="429.6" y="584" font-size="24" font-weight="700" text-anchor="middle" fill="#8A5D00">中景・角色</text>
<text x="660.0" y="584" font-size="24" font-weight="700" text-anchor="middle" fill="#2C5B8F">背景・場景</text>
<text x="242.4" y="618" font-size="20" text-anchor="middle" fill="#4B5563">同一個故事的道具</text>
<text x="429.6" y="618" font-size="20" text-anchor="middle" fill="#4B5563">最清楚</text>
<text x="660.0" y="618" font-size="20" text-anchor="middle" fill="#4B5563">略柔</text>
<rect x="796" y="156" width="356" height="148" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="840" cy="202" r="24" fill="#2C5B8F"/><text x="840" y="212.08" font-size="28" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
<text x="880" y="212" font-size="34" font-weight="700" fill="#1F2937">先傳參考</text>
<text x="824" y="256" font-size="24" fill="#4B5563">三到五張圖，</text>
<text x="824" y="288" font-size="24" fill="#4B5563">拍前先給對方看</text>
<rect x="796" y="322" width="356" height="148" rx="22" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
<circle cx="840" cy="368" r="24" fill="#E5A300"/><text x="840" y="378.08" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937">2</text>
<text x="880" y="378" font-size="34" font-weight="700" fill="#1F2937">寫一句角色</text>
<text x="824" y="422" font-size="24" fill="#4B5563">「她是誰、</text>
<text x="824" y="454" font-size="24" fill="#4B5563">在這裡做什麼」</text>
<rect x="796" y="488" width="356" height="148" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="840" cy="534" r="24" fill="#2C5B8F"/><text x="840" y="544.08" font-size="28" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
<text x="880" y="544" font-size="34" font-weight="700" fill="#1F2937">邊拍邊加</text>
<text x="824" y="588" font-size="24" fill="#4B5563">讓對方提想法，</text>
<text x="824" y="620" font-size="24" fill="#4B5563">角色才是活的</text>
<rect x="48" y="664" width="1104" height="72" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/><text x="600.0" y="710.8" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937">場景、服裝、道具替<tspan fill="#8A5D00">同一個角色</tspan>說話，模特兒才住得進去</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">讀一位攝影師，分六步</title>
<desc id="d">示意圖。讀一位攝影師的六個步驟：一、基本資料卡：生卒、在哪裡工作、替誰拍、拍了多久；二、列作品清單：從館藏頁抄作品名、年份、館藏號；三、看作品：光、距離、構圖、姿態、背景；四、讀他說的話：本人訪談、官方影片，跟別人的評論分開；五、放回時代：雜誌、編輯、合作的人，當年和後來的評價；六、寫成三欄筆記：事實、別人怎麼說、我的看法。底部重點：先事實、再引述、最後才是看法。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="1200" height="720" fill="#FFFFFF"/>
<text x="48" y="82" font-size="48" font-weight="700" fill="#1F2937">讀一位攝影師，分六步</text>
<text x="48" y="128" font-size="26" fill="#4B5563">從找得到的事實開始，最後才寫自己的看法（示意）</text>
<rect x="48" y="160" width="344" height="196" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="90" cy="204" r="24" fill="#2C5B8F"/><text x="90" y="214.08" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="130" y="216" font-size="32" font-weight="700" fill="#2C5B8F">基本資料卡</text>
<text x="76" y="280" font-size="24" fill="#1F2937">生卒、在哪裡工作、</text>
<text x="76" y="318" font-size="24" fill="#1F2937">替誰拍、拍了多久</text>
<rect x="428" y="160" width="344" height="196" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="470" cy="204" r="24" fill="#2C5B8F"/><text x="470" y="214.08" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="510" y="216" font-size="32" font-weight="700" fill="#2C5B8F">列作品清單</text>
<text x="456" y="280" font-size="24" fill="#1F2937">從館藏頁抄：作品名、</text>
<text x="456" y="318" font-size="24" fill="#1F2937">年份、館藏號</text>
<rect x="808" y="160" width="344" height="196" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="850" cy="204" r="24" fill="#2C5B8F"/><text x="850" y="214.08" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="890" y="216" font-size="32" font-weight="700" fill="#2C5B8F">看作品</text>
<text x="836" y="280" font-size="24" fill="#1F2937">光、距離、構圖、</text>
<text x="836" y="318" font-size="24" fill="#1F2937">姿態、背景</text>
<rect x="48" y="384" width="344" height="196" rx="22" fill="#FDF3E7" stroke="#B45309" stroke-width="3"/>
<circle cx="90" cy="428" r="24" fill="#B45309"/><text x="90" y="438.08" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="130" y="440" font-size="32" font-weight="700" fill="#B45309">讀他說的話</text>
<text x="76" y="504" font-size="24" fill="#1F2937">本人訪談、官方影片，</text>
<text x="76" y="542" font-size="24" fill="#1F2937">跟別人的評論分開</text>
<rect x="428" y="384" width="344" height="196" rx="22" fill="#FDF3E7" stroke="#B45309" stroke-width="3"/>
<circle cx="470" cy="428" r="24" fill="#B45309"/><text x="470" y="438.08" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="510" y="440" font-size="32" font-weight="700" fill="#B45309">放回時代</text>
<text x="456" y="504" font-size="24" fill="#1F2937">雜誌、編輯、合作的人；</text>
<text x="456" y="542" font-size="24" fill="#1F2937">當年和後來的評價</text>
<rect x="808" y="384" width="344" height="196" rx="22" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
<circle cx="850" cy="428" r="24" fill="#E5A300"/><text x="850" y="438.08" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">6</text>
<text x="890" y="440" font-size="32" font-weight="700" fill="#8A5D00">寫成三欄筆記</text>
<text x="836" y="504" font-size="24" fill="#1F2937">事實／別人怎麼說／</text>
<text x="836" y="542" font-size="24" fill="#1F2937">我的看法</text>
<line x1="394" y1="258" x2="424" y2="258" stroke="#374151" stroke-width="4" marker-end="url(#arr)"/>
<line x1="774" y1="258" x2="804" y2="258" stroke="#374151" stroke-width="4" marker-end="url(#arr)"/>
<line x1="394" y1="482" x2="424" y2="482" stroke="#374151" stroke-width="4" marker-end="url(#arr)"/>
<line x1="774" y1="482" x2="804" y2="482" stroke="#374151" stroke-width="4" marker-end="url(#arr)"/>
<path d="M980,358 L980,370 L220,370 L220,380" fill="none" stroke="#374151" stroke-width="4" marker-end="url(#arr)"/>
<rect x="48" y="604" width="1104" height="86" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
<text x="600.0" y="658" font-size="30" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan fill="#8A5D00">先事實、再引述、最後才是看法</tspan>，順序不要倒過來</text>
</svg>

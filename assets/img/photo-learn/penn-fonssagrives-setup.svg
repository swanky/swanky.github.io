<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">素色布幕前的一種拍法</title>
<desc id="d">示意圖，由上往下看，不是 Penn 當年的實際布光。上方是一塊素色布幕；人物站在布幕前一到兩公尺；一個大而柔的光源（窗或柔光箱）從左前方照向人物；相機在人物正前方稍遠處。右側三個提醒：布幕邊緣留在畫面裡也沒關係、留一點地板、先讓姿勢試三個版本。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs>
<rect width="1200" height="760" fill="#FFFFFF"/>

<text x="48" y="82" font-size="48" font-weight="700" fill="#1F2937">素色布幕前的一種拍法</text>
<text x="48" y="128" font-size="26" fill="#4B5563">由上往下看・示意，不是 Penn 當年的布光</text>
<rect x="48" y="156" width="760" height="520" rx="24" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
<path d="M150,214 Q430,186 710,214" fill="none" stroke="#8A6F4D" stroke-width="16" stroke-linecap="round"/>
<text x="430" y="252" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937">素色布幕</text>
<text x="430" y="286" font-size="24" text-anchor="middle" fill="#4B5563">舊布、素牆都可以</text>
<ellipse cx="430" cy="420" rx="50.6" ry="22.0" fill="#1F2937" opacity=".85"/><circle cx="430" cy="420" r="18.700000000000003" fill="#FFFFFF" stroke="#1F2937" stroke-width="4"/>
<text x="500" y="412" font-size="30" font-weight="700" fill="#1F2937">人物</text>
<text x="500" y="446" font-size="24" fill="#4B5563">離布幕 1–2 公尺</text>
<line x1="360" y1="300" x2="360" y2="392" stroke="#374151" stroke-width="4" marker-start="url(#arr)" marker-end="url(#arr)"/>
<g transform="translate(170 470) rotate(-35)"><rect x="-80" y="-30" width="160" height="60" rx="12" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/></g>
<line x1="232" y1="400" x2="362" y2="398.0" stroke="#E5A300" stroke-width="4" stroke-dasharray="10 9"/>
<line x1="232" y1="430" x2="362" y2="410.0" stroke="#E5A300" stroke-width="4" stroke-dasharray="10 9"/>
<line x1="232" y1="460" x2="362" y2="422.0" stroke="#E5A300" stroke-width="4" stroke-dasharray="10 9"/>
<text x="78" y="588" font-size="30" font-weight="700" fill="#8A5D00">大而柔的光</text>
<text x="78" y="622" font-size="24" fill="#4B5563">窗或柔光箱，從側前方</text>
<g transform="translate(430 610) rotate(0) scale(1.0)"><rect x="-40" y="-26" width="80" height="52" rx="8" fill="#FFFFFF" stroke="#374151" stroke-width="4"/><rect x="-16" y="-38" width="32" height="14" rx="3" fill="#374151"/><circle cx="0" cy="0" r="15" fill="#FFFFFF" stroke="#374151" stroke-width="4"/><circle cx="0" cy="0" r="6" fill="#374151"/></g>
<line x1="430" y1="572" x2="430" y2="470" stroke="#374151" stroke-width="3" stroke-dasharray="8 8"/>
<text x="500" y="604" font-size="30" font-weight="700" fill="#1F2937">相機</text>
<text x="500" y="638" font-size="24" fill="#4B5563">正前方，退到拍得到全身</text>
<rect x="836" y="156" width="316" height="158" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="876" cy="196" r="24" fill="#2C5B8F"/><text x="876" y="206.08" font-size="28" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
<text x="912" y="206" font-size="30" font-weight="700" fill="#2C5B8F">布幕邊緣</text>
<text x="866" y="252" font-size="26" fill="#4B5563">留在畫面裡</text>
<text x="866" y="286" font-size="26" fill="#4B5563">也沒關係</text>
<rect x="836" y="334" width="316" height="158" rx="22" fill="#E6F4F1" stroke="#0E7568" stroke-width="3"/>
<circle cx="876" cy="374" r="24" fill="#0E7568"/><text x="876" y="384.08" font-size="28" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
<text x="912" y="384" font-size="30" font-weight="700" fill="#0E7568">留一點地板</text>
<text x="866" y="430" font-size="26" fill="#4B5563">人才站得住，</text>
<text x="866" y="464" font-size="26" fill="#4B5563">不會飄起來</text>
<rect x="836" y="512" width="316" height="158" rx="22" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
<circle cx="876" cy="552" r="24" fill="#E5A300"/><text x="876" y="562.08" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937">3</text>
<text x="912" y="562" font-size="30" font-weight="700" fill="#8A5D00">姿勢試三版</text>
<text x="866" y="608" font-size="26" fill="#4B5563">背景不動，</text>
<text x="866" y="642" font-size="26" fill="#4B5563">只換姿勢</text>
<rect x="48" y="692" width="1104" height="56" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/><text x="600.0" y="730.08" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937">背景只留一塊布，<tspan fill="#8A5D00">剩下的交給光和姿勢</tspan></text>
</svg>

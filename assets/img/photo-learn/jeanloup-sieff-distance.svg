<text x="944" y="550" font-size="24" font-weight="700" fill="#1F2937">背景壓扁貼在人後</text>
<text x="944" y="590" font-size="24" fill="#4B5563">人比較平、比較遠</text>
<rect x="48" y="720" width="1104" height="64" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/><text x="600.0" y="762.08" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937">透視只跟「站多遠」有關，<tspan fill="#8A5D00">想要近，就得真的走近</tspan></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">同樣拍到半身，站近和退遠差在哪</title>
<desc id="d">光學示意。上排：廣角鏡頭，拍的人站在約一臂遠，視角很寬；拍出來人很大、靠近鏡頭的手被放大，背景的走廊線條往中間收、空間被拉深。下排：長鏡頭，退到約五公尺外，視角很窄；拍出來人大小差不多，但背景被壓成平平的大塊、貼在人後面。底部重點：透視只跟站多遠有關。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs>
<rect width="1200" height="800" fill="#FFFFFF"/>

<text x="48" y="82" font-size="48" font-weight="700" fill="#1F2937">同樣拍到半身，站近和退遠差在哪</text>
<text x="48" y="128" font-size="26" fill="#4B5563">左：由上往下看　右：拍出來的樣子（光學示意）</text>
<rect x="48" y="156" width="1104" height="264" rx="22" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
<text x="76" y="204" font-size="34" font-weight="700" fill="#8A5D00">廣角・站近</text>
<path d="M126,316 L326,218 L326,414 Z" fill="#FFF8E7" stroke="#E5A300" stroke-width="3" stroke-dasharray="10 8"/>
<g transform="translate(96 316) rotate(90) scale(0.7)"><rect x="-40" y="-26" width="80" height="52" rx="8" fill="#FFFFFF" stroke="#374151" stroke-width="4"/><rect x="-16" y="-38" width="32" height="14" rx="3" fill="#374151"/><circle cx="0" cy="0" r="15" fill="#FFFFFF" stroke="#374151" stroke-width="4"/><circle cx="0" cy="0" r="6" fill="#374151"/></g>
<ellipse cx="246" cy="316" rx="36.800000000000004" ry="16.0" fill="#1F2937" opacity=".85"/><circle cx="246" cy="316" r="13.600000000000001" fill="#FFFFFF" stroke="#1F2937" stroke-width="4"/>
<line x1="130" y1="374" x2="226" y2="374" stroke="#374151" stroke-width="4" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="178.0" y="410" font-size="24" font-weight="700" text-anchor="middle" fill="#1F2937">約一臂遠</text>

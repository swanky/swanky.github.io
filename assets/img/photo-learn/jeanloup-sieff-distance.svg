<text x="944" y="266" font-size="24" font-weight="700" fill="#1F2937">手放大、背景拉深</text>
<text x="944" y="306" font-size="24" fill="#4B5563">人就在你面前</text>
<rect x="48" y="440" width="1104" height="264" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<text x="76" y="488" font-size="34" font-weight="700" fill="#2C5B8F">長鏡頭・退遠</text>
<path d="M126,600 L606,524 L606,676 Z" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3" stroke-dasharray="10 8"/>
<g transform="translate(96 600) rotate(90) scale(0.7)"><rect x="-40" y="-26" width="80" height="52" rx="8" fill="#FFFFFF" stroke="#374151" stroke-width="4"/><rect x="-16" y="-38" width="32" height="14" rx="3" fill="#374151"/><circle cx="0" cy="0" r="15" fill="#FFFFFF" stroke="#374151" stroke-width="4"/><circle cx="0" cy="0" r="6" fill="#374151"/></g>
<ellipse cx="516" cy="600" rx="36.800000000000004" ry="16.0" fill="#1F2937" opacity=".85"/><circle cx="516" cy="600" r="13.600000000000001" fill="#FFFFFF" stroke="#1F2937" stroke-width="4"/>
<line x1="130" y1="658" x2="496" y2="658" stroke="#374151" stroke-width="4" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="313.0" y="694" font-size="24" font-weight="700" text-anchor="middle" fill="#1F2937">約 5 公尺</text>

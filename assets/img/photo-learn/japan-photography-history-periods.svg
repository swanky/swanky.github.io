<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">日本攝影 60 年：拍的人一步步走進照片</title>
<desc id="d">日本攝影從 1959 年到 1990 年代以後的六個節點，由左到右排在一條時間線上。1959 年 VIVO：從報導攝影出發，想做「個人的記錄」。1968 年《写真100年》：回頭清算戰爭時期的照片。1968 到 1970 年 Provoke：粗、晃、失焦，看得見拍的人在走動。1971 年私寫真：荒木經惟拍自己的婚禮和新婚旅行。1974 年 MoMA 展：東松照明、森山大道被海外美術館看見。1990 年代以後：女性攝影家與日常的照片。時間線上方標出拍的人站的位置，從旁觀、走近到在裡面；這是作者的讀法，每個節點的出處列在章末。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="1200" height="760" fill="#FFFFFF"/>
<text x="48" y="82" font-size="46" fill="#1F2937" font-weight="700">日本攝影 60 年：拍的人一步步走進照片</text>
<text x="48" y="126" font-size="24" fill="#4B5563">六個節點（示意）；上排「拍的人站在哪」是我的讀法，出處列在章末</text>
<rect x="48" y="156" width="1104" height="64" rx="16" fill="#F3F4F6"/>
<text x="64" y="197" font-size="22" fill="#4B5563" font-weight="700">拍的人站在哪</text>
<text x="246" y="198" font-size="26" fill="#2C5B8F" font-weight="700" text-anchor="middle">旁觀</text>
<text x="600" y="198" font-size="26" fill="#B91C1C" font-weight="700" text-anchor="middle">走近</text>
<text x="1064" y="198" font-size="26" fill="#8A5D00" font-weight="700" text-anchor="middle">在裡面</text>
<line x1="282" y1="189" x2="560" y2="189" stroke="#374151" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arr)"/>
<line x1="640" y1="189" x2="1018" y2="189" stroke="#374151" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arr)"/>
<line x1="60" y1="274" x2="1140" y2="274" stroke="#374151" stroke-width="5" marker-end="url(#arr)"/>
<circle cx="138" cy="274" r="16" fill="#2C5B8F" stroke="#FFFFFF" stroke-width="5"/>
<rect x="54" y="310" width="168" height="300" rx="20" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<text x="138" y="358" font-size="30" fill="#2C5B8F" font-weight="700" text-anchor="middle">1959</text>
<text x="138" y="404" font-size="26" fill="#1F2937" font-weight="700" text-anchor="middle">VIVO</text>
<text x="138" y="460" font-size="22" fill="#4B5563" text-anchor="middle">從報導出發，</text>
<text x="138" y="500" font-size="22" fill="#4B5563" text-anchor="middle">想做「個人</text>
<text x="138" y="540" font-size="22" fill="#4B5563" text-anchor="middle">的記錄」</text>
<circle cx="323" cy="274" r="16" fill="#2C5B8F" stroke="#FFFFFF" stroke-width="5"/>
<rect x="239" y="310" width="168" height="300" rx="20" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<text x="323" y="358" font-size="30" fill="#2C5B8F" font-weight="700" text-anchor="middle">1968</text>
<text x="323" y="404" font-size="23" fill="#1F2937" font-weight="700" text-anchor="middle">《写真100年》</text>
<text x="323" y="460" font-size="22" fill="#4B5563" text-anchor="middle">回頭清算</text>
<text x="323" y="500" font-size="22" fill="#4B5563" text-anchor="middle">戰爭時期的</text>
<text x="323" y="540" font-size="22" fill="#4B5563" text-anchor="middle">照片</text>
<circle cx="508" cy="274" r="16" fill="#B91C1C" stroke="#FFFFFF" stroke-width="5"/>
<rect x="424" y="310" width="168" height="300" rx="20" fill="#FDECEC" stroke="#B91C1C" stroke-width="3"/>
<text x="508" y="358" font-size="30" fill="#B91C1C" font-weight="700" text-anchor="middle">1968–70</text>
<text x="508" y="404" font-size="23" fill="#1F2937" font-weight="700" text-anchor="middle">Provoke</text>
<text x="508" y="460" font-size="22" fill="#4B5563" text-anchor="middle">粗、晃、失焦</text>
<text x="508" y="500" font-size="22" fill="#4B5563" text-anchor="middle">看得見拍的</text>
<text x="508" y="540" font-size="22" fill="#4B5563" text-anchor="middle">人在走動</text>
<circle cx="693" cy="274" r="16" fill="#B91C1C" stroke="#FFFFFF" stroke-width="5"/>
<rect x="609" y="310" width="168" height="300" rx="20" fill="#FDECEC" stroke="#B91C1C" stroke-width="3"/>
<text x="693" y="358" font-size="30" fill="#B91C1C" font-weight="700" text-anchor="middle">1971</text>
<text x="693" y="404" font-size="26" fill="#1F2937" font-weight="700" text-anchor="middle">私寫真</text>
<text x="693" y="460" font-size="22" fill="#4B5563" text-anchor="middle">拍自己的</text>
<text x="693" y="500" font-size="22" fill="#4B5563" text-anchor="middle">婚禮和</text>
<text x="693" y="540" font-size="22" fill="#4B5563" text-anchor="middle">新婚旅行</text>
<circle cx="878" cy="274" r="16" fill="#2C5B8F" stroke="#FFFFFF" stroke-width="5"/>
<rect x="794" y="310" width="168" height="300" rx="20" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<text x="878" y="358" font-size="30" fill="#2C5B8F" font-weight="700" text-anchor="middle">1974</text>
<text x="878" y="404" font-size="26" fill="#1F2937" font-weight="700" text-anchor="middle">MoMA 展</text>
<text x="878" y="460" font-size="22" fill="#4B5563" text-anchor="middle">東松、森山</text>
<text x="878" y="500" font-size="22" fill="#4B5563" text-anchor="middle">被海外美術</text>
<text x="878" y="540" font-size="22" fill="#4B5563" text-anchor="middle">館看見</text>
<circle cx="1063" cy="274" r="16" fill="#E5A300" stroke="#FFFFFF" stroke-width="5"/>
<rect x="979" y="310" width="168" height="300" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
<text x="1063" y="358" font-size="30" fill="#8A5D00" font-weight="700" text-anchor="middle">1990s–</text>
<text x="1063" y="404" font-size="26" fill="#1F2937" font-weight="700" text-anchor="middle">日常</text>
<text x="1063" y="460" font-size="22" fill="#4B5563" text-anchor="middle">女性攝影家、</text>
<text x="1063" y="500" font-size="22" fill="#4B5563" text-anchor="middle">日常的照片</text>
<text x="1063" y="540" font-size="22" fill="#4B5563" text-anchor="middle">一路到今天</text>
<rect x="48" y="644" width="1104" height="84" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
<text x="600" y="698" font-size="30" fill="#1F2937" font-weight="700" text-anchor="middle">讀照片時問一句：<tspan fill="#8A5D00">拍的人站在畫面外，還是站在裡面？</tspan></text>
</svg>

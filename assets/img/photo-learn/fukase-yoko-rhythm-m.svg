<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1160" width="600" height="1160" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">一段合作，五次公開</title>
<desc id="d">示意圖：深瀨昌久拍妻子洋子的作品，查得到的公開順序。1974 年 2 月與 1975 年 1 月兩次刊在攝影雜誌《カメラ毎日》，1978 年 2 月在新宿與銀座的 Nikon Salon 展出，同年出成寫真集《洋子》，後記由作家瀨戶內晴美執筆；2023 年東京都寫真美術館的回顧展把「洋子」放在第 2 章。拍攝方法沒有可靠紀錄，所以圖裡只有發表順序。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="600" height="1160" fill="#FFFFFF"/>
<text x="40" y="72" font-size="40" font-weight="700" fill="#1F2937">一段合作，五次公開</text>
<text x="40" y="112" font-size="24" fill="#4B5563">查得到的發表順序・不畫拍法</text>
<line x1="80" y1="190" x2="80" y2="1000" stroke="#9CA3AF" stroke-width="4"/>
<circle cx="80" cy="190" r="16" fill="#FFFFFF" stroke="#1F2937" stroke-width="6"/>
<rect x="120" y="150" width="440" height="156" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
<text x="144" y="192" font-size="22" fill="#4B5563">1974 年 2 月</text>
<text x="536" y="194" font-size="28" font-weight="700" text-anchor="end" fill="#1F2937">雜誌刊出</text>
<text x="144" y="244" font-size="22" fill="#1F2937">《カメラ毎日》</text>
<text x="144" y="282" font-size="22" fill="#4B5563">「洋子」</text>
<circle cx="80" cy="370" r="16" fill="#FFFFFF" stroke="#1F2937" stroke-width="6"/>
<rect x="120" y="330" width="440" height="156" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
<text x="144" y="372" font-size="22" fill="#4B5563">1975 年 1 月</text>
<text x="536" y="374" font-size="28" font-weight="700" text-anchor="end" fill="#1F2937">雜誌再刊</text>
<text x="144" y="424" font-size="22" fill="#1F2937">《カメラ毎日》</text>
<text x="144" y="462" font-size="22" fill="#4B5563">「洋子 1974, 1975」</text>
<circle cx="80" cy="550" r="16" fill="#FFFFFF" stroke="#1F2937" stroke-width="6"/>
<rect x="120" y="510" width="440" height="156" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
<text x="144" y="552" font-size="22" fill="#4B5563">1978 年 2 月</text>
<text x="536" y="554" font-size="28" font-weight="700" text-anchor="end" fill="#1F2937">展覽</text>
<text x="144" y="604" font-size="22" fill="#1F2937">新宿、銀座</text>
<text x="144" y="642" font-size="22" fill="#4B5563">Nikon Salon</text>
<circle cx="80" cy="730" r="16" fill="#FFFFFF" stroke="#B45309" stroke-width="6"/>
<rect x="120" y="690" width="440" height="156" rx="14" fill="#FFFFFF" stroke="#B45309" stroke-width="3"/>
<text x="144" y="732" font-size="22" fill="#4B5563">1978 年</text>
<text x="536" y="734" font-size="28" font-weight="700" text-anchor="end" fill="#B45309">寫真集</text>
<text x="144" y="784" font-size="22" fill="#1F2937">《洋子》</text>
<text x="144" y="822" font-size="22" fill="#4B5563">後記：瀨戶內晴美</text>
<circle cx="80" cy="910" r="16" fill="#FFFFFF" stroke="#1F2937" stroke-width="6"/>
<rect x="120" y="870" width="440" height="156" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
<text x="144" y="912" font-size="22" fill="#4B5563">2023 年</text>
<text x="536" y="914" font-size="28" font-weight="700" text-anchor="end" fill="#1F2937">回顧展</text>
<text x="144" y="964" font-size="22" fill="#1F2937">東京都寫真美術館</text>
<text x="144" y="1002" font-size="22" fill="#4B5563">第 2 章「洋子」</text>
<text x="40" y="1110" font-size="22" fill="#6B7280">依深瀨昌久官方檔案整理。</text>
</svg>

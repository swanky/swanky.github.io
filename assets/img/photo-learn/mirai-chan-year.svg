<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">《未来ちゃん》：三個固定、一個在變</title>
<desc id="d">示意圖，依攝影師官網、出版社、國立國會圖書館與 IMA 訪談整理，不含書中任何影像。左邊是一個分成春夏秋冬四格的圓，代表全書的骨架是一年。中間是三個固定條件：同一個人、同一座島（寄住佐渡島）、同一台相機（Nikon F6）。右邊是兩個版本：2011 年初版 23 公分、2,000 円、不印頁碼；2024 年新裝版改名 Miraichan、A5 精裝 208 頁、新增 6 張照片。</desc>
<rect width="1200" height="720" fill="#FFFFFF"/>
<text x="48" y="78" font-size="46" font-weight="700" fill="#1F2937" text-anchor="start">三個固定，一個在變</text>
<text x="48" y="122" font-size="24" fill="#4B5563" text-anchor="start">示意，依官網、出版社、國會圖書館書目與 IMA 訪談整理；不含書中影像</text>
<path d="M200 370 L200.0 220.0 A150 150 0 0 1 350.0 370.0 Z" fill="#FFF8E7" stroke="#FFFFFF" stroke-width="6"/>
<text x="270" y="312" font-size="34" font-weight="700" fill="#1F2937" text-anchor="middle">春</text>
<path d="M200 370 L350.0 370.0 A150 150 0 0 1 200.0 520.0 Z" fill="#FDECC8" stroke="#FFFFFF" stroke-width="6"/>
<text x="270" y="452" font-size="34" font-weight="700" fill="#1F2937" text-anchor="middle">夏</text>
<path d="M200 370 L200.0 520.0 A150 150 0 0 1 50.0 370.0 Z" fill="#F1F5F9" stroke="#FFFFFF" stroke-width="6"/>
<text x="130" y="452" font-size="34" font-weight="700" fill="#1F2937" text-anchor="middle">秋</text>
<path d="M200 370 L50.0 370.0 A150 150 0 0 1 200.0 220.0 Z" fill="#E2E8F0" stroke="#FFFFFF" stroke-width="6"/>
<text x="130" y="312" font-size="34" font-weight="700" fill="#1F2937" text-anchor="middle">冬</text>
<circle cx="200" cy="370" r="45" fill="#FFFFFF" stroke="#E5A300" stroke-width="4"/>
<text x="200" y="381" font-size="30" font-weight="700" fill="#8A5D00" text-anchor="middle">一年</text>
<text x="200" y="572" font-size="26" fill="#374151" text-anchor="middle">骨架：島上的四季</text>
<rect x="400" y="170" width="330" height="112" rx="18" fill="#FFF8E7" stroke="#E5A300" stroke-width="4"/>
<text x="565" y="216" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">同一個人</text>
<text x="565" y="252" font-size="24" fill="#374151" text-anchor="middle">一整年跟拍</text>
<rect x="400" y="306" width="330" height="112" rx="18" fill="#FFF8E7" stroke="#E5A300" stroke-width="4"/>
<text x="565" y="352" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">同一座島</text>
<text x="565" y="388" font-size="24" fill="#374151" text-anchor="middle">寄住佐渡島</text>
<rect x="400" y="442" width="330" height="112" rx="18" fill="#FFF8E7" stroke="#E5A300" stroke-width="4"/>
<text x="565" y="488" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">同一台相機</text>
<text x="565" y="524" font-size="24" fill="#374151" text-anchor="middle">只用 Nikon F6</text>
<rect x="780" y="170" width="372" height="180" rx="18" fill="#F1F5F9" stroke="#64748B" stroke-width="4"/>
<text x="966" y="232" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">2011 初版</text>
<text x="966" y="268" font-size="24" fill="#374151" text-anchor="middle">23 公分・2,000 円</text>
<text x="966" y="304" font-size="24" fill="#374151" text-anchor="middle">不印頁碼</text>
<rect x="780" y="374" width="372" height="206" rx="18" fill="#F1F5F9" stroke="#64748B" stroke-width="4"/>
<text x="966" y="434" font-size="26" font-weight="700" fill="#1F2937" text-anchor="middle">2024 新裝版</text>
<text x="966" y="468" font-size="22" fill="#374151" text-anchor="middle">改名 Miraichan</text>
<text x="966" y="502" font-size="22" fill="#374151" text-anchor="middle">A5 精裝 208 頁</text>
<text x="966" y="536" font-size="22" fill="#374151" text-anchor="middle">新增 6 張照片</text>
<rect x="48" y="612" width="1104" height="72" rx="16" fill="#1F2937"/>
<text x="600" y="658" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">骨架越簡單，照片越自由</text>
</svg>

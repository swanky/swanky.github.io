<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">一段合作，五次公開</title>
<desc id="d">示意圖：深瀨昌久拍妻子洋子的作品，查得到的公開順序。1974 年 2 月與 1975 年 1 月兩次刊在攝影雜誌《カメラ毎日》，1978 年 2 月在新宿與銀座的 Nikon Salon 展出，同年出成寫真集《洋子》，後記由作家瀨戶內晴美執筆；2023 年東京都寫真美術館的回顧展把「洋子」放在第 2 章。拍攝方法沒有可靠紀錄，所以圖裡只有發表順序。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="1200" height="700" fill="#FFFFFF"/>
<text x="48" y="82" font-size="48" font-weight="700" fill="#1F2937">一段合作，五次公開</text>
<text x="48" y="128" font-size="26" fill="#4B5563">查得到的發表順序・拍法沒有紀錄，所以只畫時間</text>
<rect x="48" y="160" width="1104" height="460" rx="18" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
<line x1="110" y1="290" x2="1090" y2="290" stroke="#9CA3AF" stroke-width="4"/>
<circle cx="150" cy="290" r="18" fill="#FFFFFF" stroke="#1F2937" stroke-width="6"/>
<text x="150" y="244" font-size="24" text-anchor="middle" fill="#4B5563">1974 年 2 月</text>
<rect x="50" y="330" width="200" height="240" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
<text x="150" y="384" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937">雜誌刊出</text>
<text x="150" y="450" font-size="20" text-anchor="middle" fill="#4B5563">《カメラ毎日》</text>
<text x="150" y="486" font-size="18" text-anchor="middle" fill="#4B5563">「洋子」</text>
<circle cx="375" cy="290" r="18" fill="#FFFFFF" stroke="#1F2937" stroke-width="6"/>
<text x="375" y="244" font-size="24" text-anchor="middle" fill="#4B5563">1975 年 1 月</text>
<rect x="275" y="330" width="200" height="240" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
<text x="375" y="384" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937">雜誌再刊</text>
<text x="375" y="450" font-size="20" text-anchor="middle" fill="#4B5563">《カメラ毎日》</text>
<text x="375" y="486" font-size="18" text-anchor="middle" fill="#4B5563">「洋子 1974, 1975」</text>
<circle cx="600" cy="290" r="18" fill="#FFFFFF" stroke="#1F2937" stroke-width="6"/>
<text x="600" y="244" font-size="24" text-anchor="middle" fill="#4B5563">1978 年 2 月</text>
<rect x="500" y="330" width="200" height="240" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
<text x="600" y="384" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937">展覽</text>
<text x="600" y="450" font-size="20" text-anchor="middle" fill="#4B5563">新宿、銀座</text>
<text x="600" y="486" font-size="18" text-anchor="middle" fill="#4B5563">Nikon Salon</text>
<circle cx="825" cy="290" r="18" fill="#FFFFFF" stroke="#B45309" stroke-width="6"/>
<text x="825" y="244" font-size="24" text-anchor="middle" fill="#4B5563">1978 年</text>
<rect x="725" y="330" width="200" height="240" rx="14" fill="#FFFFFF" stroke="#B45309" stroke-width="3"/>
<text x="825" y="384" font-size="30" font-weight="700" text-anchor="middle" fill="#B45309">寫真集</text>
<text x="825" y="450" font-size="20" text-anchor="middle" fill="#4B5563">《洋子》</text>
<text x="825" y="486" font-size="18" text-anchor="middle" fill="#4B5563">後記：瀨戶內晴美</text>
<circle cx="1050" cy="290" r="18" fill="#FFFFFF" stroke="#1F2937" stroke-width="6"/>
<text x="1050" y="244" font-size="24" text-anchor="middle" fill="#4B5563">2023 年</text>
<rect x="950" y="330" width="200" height="240" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
<text x="1050" y="384" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937">回顧展</text>
<text x="1050" y="450" font-size="20" text-anchor="middle" fill="#4B5563">東京都寫真美術館</text>
<text x="1050" y="486" font-size="18" text-anchor="middle" fill="#4B5563">第 2 章「洋子」</text>
<text x="48" y="664" font-size="22" fill="#6B7280">依深瀨昌久官方檔案的作品年表、寫真集頁、展覽頁整理。</text>
</svg>

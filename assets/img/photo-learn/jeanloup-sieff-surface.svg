<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">「貼近畫面表層」是什麼意思</title>
<desc id="d">光學示意，從側面看廣角站近。相機在最左邊；最靠近鏡頭的是伸出來的手，會被放大、貼著畫面前緣；臉在中間，大小正常；背景的牆在最右邊很遠的地方，看起來又小又遠。下方三張卡片依序說明前、中、後三層。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs>
<rect width="1200" height="720" fill="#FFFFFF"/>

<text x="48" y="82" font-size="48" font-weight="700" fill="#1F2937">「貼近畫面表層」是什麼意思</text>
<text x="48" y="128" font-size="26" fill="#4B5563">從側面看廣角站近：前、中、後三層（光學示意）</text>
<rect x="48" y="150" width="1104" height="300" rx="24" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
<g transform="translate(110 300) rotate(90) scale(0.75)"><rect x="-40" y="-26" width="80" height="52" rx="8" fill="#FFFFFF" stroke="#374151" stroke-width="4"/><rect x="-16" y="-38" width="32" height="14" rx="3" fill="#374151"/><circle cx="0" cy="0" r="15" fill="#FFFFFF" stroke="#374151" stroke-width="4"/><circle cx="0" cy="0" r="6" fill="#374151"/></g><line x1="140.0" y1="300" x2="1010.0" y2="170.0" stroke="#94A3B8" stroke-width="3" stroke-dasharray="10 8"/><line x1="140.0" y1="300" x2="1010.0" y2="430.0" stroke="#94A3B8" stroke-width="3" stroke-dasharray="10 8"/><ellipse cx="260.0" cy="330.0" rx="22.0" ry="40.0" fill="#E5A300" stroke="#8A5D00" stroke-width="3"/><circle cx="440.0" cy="250.0" r="30.0" fill="#1F2937"/><path d="M406.0,450.0 L410.0,290.0 Q440.0,276.0 470.0,290.0 L474.0,450.0 Z" fill="#1F2937"/><line x1="420.0" y1="304.0" x2="272.0" y2="322.0" stroke="#1F2937" stroke-width="12.0" stroke-linecap="round"/><rect x="1010.0" y="170.0" width="18.0" height="260.0" fill="#CBD5E1" stroke="#64748B" stroke-width="3"/>
<rect x="48" y="476" width="352" height="214" rx="22" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
<circle cx="92" cy="520" r="24" fill="#E5A300"/><text x="92" y="530.08" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937">1</text>
<text x="130" y="530" font-size="34" font-weight="700" fill="#8A5D00">前：手</text>
<text x="84" y="590" font-size="26" fill="#4B5563">被放大，</text>
<text x="84" y="630" font-size="26" fill="#4B5563">貼著畫面前緣</text>
<rect x="424" y="476" width="352" height="214" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="468" cy="520" r="24" fill="#2C5B8F"/><text x="468" y="530.08" font-size="28" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
<text x="506" y="530" font-size="34" font-weight="700" fill="#2C5B8F">中：臉</text>
<text x="460" y="590" font-size="26" fill="#4B5563">大小正常，</text>
<text x="460" y="630" font-size="26" fill="#4B5563">放在中間附近</text>
<rect x="800" y="476" width="352" height="214" rx="22" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
<circle cx="844" cy="520" r="24" fill="#64748B"/><text x="844" y="530.08" font-size="28" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
<text x="882" y="530" font-size="34" font-weight="700" fill="#64748B">後：背景</text>
<text x="836" y="590" font-size="26" fill="#4B5563">變小、變遠，</text>
<text x="836" y="630" font-size="26" fill="#4B5563">空間被拉深</text>
<line x1="260.0" y1="456" x2="224" y2="476" stroke="#374151" stroke-width="3"/>
<line x1="440.0" y1="456" x2="600" y2="476" stroke="#374151" stroke-width="3"/>
<line x1="1010.0" y1="456" x2="976" y2="476" stroke="#374151" stroke-width="3"/>
</svg>

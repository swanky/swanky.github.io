<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2184" width="1200" height="2184" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">日本與歐美時尚攝影對照年表</title>
<desc id="d">雙軌年表。左欄紅色是日本，右欄藍色是歐美，中間金色標籤是時期。1911–1930 年代（雜誌開始用照片賣衣服）：歐美 1911 Steichen 拍 Poiret 的衣服13 張柔焦照刊在雜誌、歐美 1914 de Meyer 成為《Vogue》第一位全職攝影師、日本 1930 中山岩太〈福助足袋〉國際廣告寫真展一等、日本 1932–33 《光画》出刊不到兩年新興寫真的園地、歐美 1933 Munkácsi 讓模特兒在海灘上奔跑；1940–1950 年代（從棚內走到街上）：歐美 1943 Penn 的第一張彩色照成為《Vogue》封面、歐美 1955 Avedon〈Dovima withElephants〉在馬戲場拍、日本 1957 常盤とよ子《危険な毒花》日本女性攝影師的第一本寫真集；1959–1970 年代（攝影師開始問：我看到的是什麼）：日本 1959 VIVO 成立約兩年後解散、歐美 50 年代末 Klein 手持 35mm 相機把模特兒帶到城市裡、日本 1965 鋤田正義上京做男裝時尚的工作、歐美 1965 Bailey《Box of Pin-Ups》36 張名人肖像、日本 1968–69 《Provoke》出三期粗、晃、失焦（1970 出書）、日本 1974 紐約 MoMA 辦日本攝影展第一次獲國際機構肯定、歐美 1975 Turbeville 浴場照刊在《Vogue》5 月號；1980 年代–2001（拍真實的人、拍日常）：歐美 1980 年代 風格刊物興起街頭「straight ups」、歐美 1990 Corinne Day 在《The Face》第一次發表作品、日本 1990 年代 「女の子写真」這個標籤出現、歐美 1997 V&amp;A 辦《當代時尚攝影》展、日本 2000 年度 木村伊兵衛賞長島・蜷川・HIROMIX、日本 2001 年度 木村伊兵衛賞川內倫子《うたたね》；2005 年至今（每個人都在發照片）：歐美 2005 起 街拍部落格、Instagram挑戰印刷雜誌、日本 2012 東京都寫真美術館鋤田正義回顧展、日本 2015–16 Getty 展出 1990 年代後崛起的五位女性攝影師、歐美 2026 Tate Britain《The 90s: Art and Fashion》。同一時期並列，不代表彼此影響。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="1200" height="2184" fill="#FFFFFF"/>

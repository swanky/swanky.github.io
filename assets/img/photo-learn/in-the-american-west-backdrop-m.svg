<rect x="270" y="966" width="24" height="90" fill="#1F2937"/>
<rect x="306" y="966" width="24" height="90" fill="#1F2937"/>
<text x="300" y="1134" font-size="26" font-weight="700" fill="#1F2937" text-anchor="middle">只剩臉、衣服、姿態</text>
<rect x="40" y="1164" width="520" height="50" rx="10" fill="#FBF3E0" stroke="#B07D1A" stroke-width="2"/>
<text x="300" y="1198" font-size="24" font-weight="700" fill="#B07D1A" text-anchor="middle">題名：姓名、職業、地點、日期</text>

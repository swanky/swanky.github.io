<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1500" width="600" height="1500" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">同一件衣服，兩種拍法</title>
<desc id="d">示意圖，由上往下看，不是任何一張原作的布光。左邊是精修棚拍：無縫背景紙、主燈加補光、髮妝造型團隊、模特兒擺好姿勢、照片會再修。右邊是日常場景：真的房間或街頭、窗光或現場的燈、被攝者是朋友或不是職業模特兒、房間裡的東西留在畫面裡、相機離人很近。底下三行對照：場景、人、光與修飾。出處：V&amp;A 說 1990 年代代表人物關心日常生活與真實的人；Getty 說 1990 年代初的這類照片用破舊環境與刺眼的光。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="600" height="1500" fill="#FFFFFF"/>
<text x="24" y="66" font-size="40" fill="#1F2937" font-weight="700">同一件衣服，兩種拍法</text>
<text x="24" y="108" font-size="22" fill="#4B5563">由上往下看・示意，不是任何原作的布光</text>
<rect x="24" y="140" width="552" height="470" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<text x="48" y="186" font-size="32" fill="#2C5B8F" font-weight="700">精修棚拍</text>
<path d="M84,236 Q300.0,210 516,236" fill="none" stroke="#9CA3AF" stroke-width="14" stroke-linecap="round"/>
<text x="300.0" y="270" font-size="22" fill="#4B5563" text-anchor="middle">無縫背景紙</text>
<circle cx="300.0" cy="340" r="20" fill="#FFFFFF" stroke="#1F2937" stroke-width="4"/>
<text x="334.0" y="348" font-size="22" fill="#1F2937" font-weight="700">擺好的姿勢</text>
<rect x="60" y="372" width="68" height="36" rx="8" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="4"/>
<text x="94" y="442" font-size="22" fill="#4B5563" text-anchor="middle">主燈</text>
<line x1="94" y1="370" x2="274.0" y2="352" stroke="#2C5B8F" stroke-width="3" stroke-dasharray="8 8"/>
<rect x="472" y="372" width="68" height="36" rx="8" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="4"/>
<text x="506" y="442" font-size="22" fill="#4B5563" text-anchor="middle">補光</text>
<line x1="506" y1="370" x2="326.0" y2="352" stroke="#2C5B8F" stroke-width="3" stroke-dasharray="8 8"/>
<rect x="270.0" y="470" width="60" height="40" rx="8" fill="#1F2937"/><circle cx="300.0" cy="490" r="11" fill="#FFFFFF"/>
<text x="300.0" y="540" font-size="22" fill="#4B5563" text-anchor="middle">相機離人遠一點</text>
<text x="300.0" y="580" font-size="22" fill="#1F2937" font-weight="700" text-anchor="middle">髮妝、造型、後製團隊</text>
<line x1="300" y1="622" x2="300" y2="676" stroke="#374151" stroke-width="4" marker-end="url(#arr)"/>
<rect x="24" y="690" width="552" height="470" rx="22" fill="#FFF8E7" stroke="#E5A300" stroke-width="3"/>
<text x="48" y="736" font-size="32" fill="#8A5D00" font-weight="700">日常場景</text>
<rect x="64" y="776" width="16" height="140" fill="#93C5FD"/>
<text x="94" y="800" font-size="22" fill="#4B5563">窗光／現場的燈</text>
<rect x="426" y="780" width="110" height="60" rx="10" fill="#FFFFFF" stroke="#8A6F4D" stroke-width="4"/>
<text x="481" y="868" font-size="22" fill="#4B5563" text-anchor="middle">房間的東西</text>
<text x="481" y="894" font-size="22" fill="#4B5563" text-anchor="middle">留在畫面裡</text>
<circle cx="300.0" cy="940" r="20" fill="#FFFFFF" stroke="#1F2937" stroke-width="4"/>
<text x="334.0" y="948" font-size="22" fill="#1F2937" font-weight="700">朋友、非職業模特兒</text>
<line x1="84" y1="850" x2="276.0" y2="936" stroke="#E5A300" stroke-width="3" stroke-dasharray="8 8"/>
<rect x="270.0" y="990" width="60" height="40" rx="8" fill="#1F2937"/><circle cx="300.0" cy="1010" r="11" fill="#FFFFFF"/>
<text x="300.0" y="1060" font-size="22" fill="#4B5563" text-anchor="middle">相機靠很近</text>
<text x="300.0" y="1130" font-size="22" fill="#1F2937" font-weight="700" text-anchor="middle">一兩個人就能拍</text>
<rect x="24" y="1190" width="552" height="270" rx="18" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="2"/>
<text x="48" y="1244" font-size="26" fill="#1F2937" font-weight="700">場景</text>
<text x="130" y="1244" font-size="22" fill="#2C5B8F">棚、搭景</text>
<text x="130" y="1276" font-size="22" fill="#8A5D00" font-weight="700">→ 真的房間、街頭</text>
<text x="48" y="1320" font-size="26" fill="#1F2937" font-weight="700">人</text>
<text x="130" y="1320" font-size="22" fill="#2C5B8F">職業模特兒擺姿勢</text>
<text x="130" y="1352" font-size="22" fill="#8A5D00" font-weight="700">→ 朋友、非典型的臉</text>
<text x="48" y="1396" font-size="26" fill="#1F2937" font-weight="700">修飾</text>
<text x="130" y="1396" font-size="22" fill="#2C5B8F">精修、理想化</text>
<text x="130" y="1428" font-size="22" fill="#8A5D00" font-weight="700">→ 保留缺點和現場</text>
</svg>

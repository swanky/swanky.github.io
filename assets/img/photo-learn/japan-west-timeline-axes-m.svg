<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1180" width="600" height="1180" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">用兩個問題把照片放上地圖</title>
<desc id="d">示意圖（我的讀法，不是史料）。橫軸是「在哪裡拍」：左邊攝影棚或搭景，右邊街頭與日常場景；縱軸是「人怎麼出現」：上面是擺好的姿勢，下面是抓到的瞬間。年表裡幾個時期的位置：1911 柔焦棚拍在左上；1930 廣告構成偏左上；1933 海灘奔跑在中間偏右；1950 年代走上街在右邊中間；1968 粗、晃、失焦在右下；1990 年代日常與真人在右下；今天的搭景幻想在左邊偏下（其實是擺好的，但看起來像故事裡的一刻）。金色的點是讀者自己的照片，請自己放。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="600" height="1180" fill="#FFFFFF"/>
<text x="24" y="64" font-size="40" fill="#1F2937" font-weight="700">用兩個問題</text>
<text x="24" y="110" font-size="40" fill="#1F2937" font-weight="700">把照片放上地圖</text>
<text x="24" y="152" font-size="22" fill="#4B5563">示意・我的讀法，不是史料</text>
<rect x="70" y="200" width="490" height="640" rx="20" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
<line x1="315.0" y1="212" x2="315.0" y2="828" stroke="#D1D5DB" stroke-width="3"/>
<line x1="82" y1="520.0" x2="548" y2="520.0" stroke="#D1D5DB" stroke-width="3"/>
<circle cx="152" cy="311" r="11" fill="#2C5B8F"/>
<text x="170" y="319" font-size="22" fill="#1F2937" font-weight="700" text-anchor="start">1911 柔焦棚拍</text>
<circle cx="229" cy="439" r="11" fill="#B91C1C"/>
<text x="247" y="447" font-size="22" fill="#1F2937" font-weight="700" text-anchor="start">1930 廣告構成</text>
<circle cx="358" cy="497" r="11" fill="#2C5B8F"/>
<text x="376" y="505" font-size="22" fill="#1F2937" font-weight="700" text-anchor="start">1933 海灘奔跑</text>
<circle cx="444" cy="358" r="11" fill="#2C5B8F"/>
<text x="426" y="366" font-size="22" fill="#1F2937" font-weight="700" text-anchor="end">1950 年代走上街</text>
<circle cx="461" cy="775" r="11" fill="#B91C1C"/>
<text x="443" y="783" font-size="22" fill="#1F2937" font-weight="700" text-anchor="end">1968 粗、晃、失焦</text>
<circle cx="478" cy="636" r="11" fill="#2C5B8F"/>
<text x="460" y="644" font-size="22" fill="#1F2937" font-weight="700" text-anchor="end">1990 年代日常與真人</text>
<circle cx="169" cy="694" r="11" fill="#64748B"/>
<text x="187" y="702" font-size="22" fill="#1F2937" font-weight="700" text-anchor="start">今天：搭景幻想</text>
<circle cx="229" cy="590" r="16" fill="#E5A300" stroke="#FFFFFF" stroke-width="4"/>
<text x="255" y="599" font-size="24" fill="#8A5D00" font-weight="700">你的照片？</text>
<text x="329.0" y="240" font-size="22" fill="#4B5563" font-weight="700">↑ 擺好的姿勢</text>
<text x="329.0" y="820" font-size="22" fill="#4B5563" font-weight="700">↓ 抓到的瞬間</text>
<text x="70" y="880" font-size="22" fill="#4B5563" font-weight="700">← 攝影棚、搭景</text>
<text x="560" y="880" font-size="22" fill="#4B5563" font-weight="700" text-anchor="end">街頭、日常 →</text>
<rect x="24" y="910" width="552" height="250" rx="18" fill="#FFF8E7" stroke="#E5A300" stroke-width="3"/>
<text x="48" y="958" font-size="26" fill="#8A5D00" font-weight="700">看一張照片，先問兩句：</text>
<text x="48" y="1002" font-size="24" fill="#1F2937">1. 這是在哪裡拍的？</text>
<text x="48" y="1046" font-size="24" fill="#1F2937">　棚裡、搭的景，還是真的地方？</text>
<text x="48" y="1090" font-size="24" fill="#1F2937">2. 人是被擺好的，還是被抓到的？</text>
<text x="48" y="1134" font-size="26" fill="#8A5D00" font-weight="700">答完，它就有位置了。</text>
</svg>

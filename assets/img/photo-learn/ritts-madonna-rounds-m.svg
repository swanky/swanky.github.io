<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1200" width="600" height="1200" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">兩個都懂影像的人，一來一往</title>
<desc id="d">示意圖。中間是一來一往的循環：被攝者帶著新造型出現，攝影師用光和取景回應，被攝者再把它當成下一次的挑戰。左邊列出被攝者決定的：自己的形象怎麼被看見、這一次的新造型、照片要拿去哪裡用。右邊列出攝影師決定的：光從哪裡來、景框多大、快門時機和選片。下方提醒：先講好誰決定什麼，較勁才會變成作品。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="600" height="1200" fill="#FFFFFF"/>
<text x="32" y="64" font-size="36" fill="#1F2937" font-weight="700">兩個都懂影像的人，</text>
<text x="32" y="106" font-size="36" fill="#1F2937" font-weight="700">一來一往</text>
<text x="32" y="144" font-size="22" fill="#4B5563">示意圖・不是兩人的工作紀錄</text>
<rect x="24" y="170" width="552" height="240" rx="20" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
<text x="48" y="218" font-size="28" fill="#1F2937" font-weight="700">被攝者決定</text>
<circle cx="52" cy="266" r="5" fill="#1F2937"/><text x="68" y="274" font-size="24" fill="#4B5563">自己的形象怎麼被看見</text>
<circle cx="52" cy="316" r="5" fill="#1F2937"/><text x="68" y="324" font-size="24" fill="#4B5563">這一次的新造型</text>
<circle cx="52" cy="366" r="5" fill="#1F2937"/><text x="68" y="374" font-size="24" fill="#4B5563">照片要拿去哪裡用</text>
<circle cx="300" cy="590" r="100" fill="#FFF8E7" stroke="#E5A300" stroke-width="6" stroke-dasharray="14 10"/><path d="M200,590 A100,100 0 0 1 300,490" fill="none" stroke="#374151" stroke-width="4" marker-end="url(#arr)"/><path d="M400,590 A100,100 0 0 1 300,690" fill="none" stroke="#374151" stroke-width="4" marker-end="url(#arr)"/><text x="300" y="468" font-size="24" fill="#1F2937" font-weight="700" text-anchor="middle">新造型出現</text>
<text x="300" y="730" font-size="24" fill="#1F2937" font-weight="700" text-anchor="middle">再挑戰一次</text>
<text x="300" y="582" font-size="30" fill="#8A5D00" font-weight="700" text-anchor="middle">一來</text>
<text x="300" y="622" font-size="30" fill="#8A5D00" font-weight="700" text-anchor="middle">一往</text>
<rect x="24" y="770" width="552" height="240" rx="20" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
<text x="48" y="818" font-size="28" fill="#1F2937" font-weight="700">攝影師決定</text>
<circle cx="52" cy="866" r="5" fill="#1F2937"/><text x="68" y="874" font-size="24" fill="#4B5563">光從哪裡來</text>
<circle cx="52" cy="916" r="5" fill="#1F2937"/><text x="68" y="924" font-size="24" fill="#4B5563">景框要多大</text>
<circle cx="52" cy="966" r="5" fill="#1F2937"/><text x="68" y="974" font-size="24" fill="#4B5563">快門時機和選片</text>
<rect x="24" y="1040" width="552" height="130" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="3"/>
<text x="300" y="1092" font-size="26" fill="#8A5D00" font-weight="700" text-anchor="middle">先講好誰決定什麼，</text>
<text x="300" y="1136" font-size="26" fill="#8A5D00" font-weight="700" text-anchor="middle">較勁才會變成作品。</text>
</svg>

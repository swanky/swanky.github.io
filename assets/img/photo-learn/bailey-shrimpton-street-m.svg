<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1190" width="600" height="1190" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">攝影棚裡擺好，和跟著人走到街上</title>
<desc id="d">示意圖，由上往下看，不是 Bailey 當年的實際拍攝配置。左邊是攝影棚：燈、背景、相機都固定，模特兒站在標好的位置。右邊是街頭：攝影師拿著輕便的小相機，跟著模特兒在真的街道上移動，路人和街景都進到畫面裡。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="600" height="1190" fill="#FFFFFF"/>
<text x="32" y="64" font-size="38" fill="#1F2937" font-weight="700">攝影棚裡擺好，</text>
<text x="32" y="108" font-size="38" fill="#1F2937" font-weight="700">和跟著人走到街上</text>
<text x="32" y="146" font-size="22" fill="#4B5563">由上往下看・示意，不是當年的配置</text>
<rect x="24" y="170" width="552" height="400" rx="20" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
<rect x="134" y="240" width="331" height="16" rx="6" fill="#8A6F4D"/><text x="300" y="226" font-size="22" fill="#4B5563" text-anchor="middle">固定背景</text>
<circle cx="300.0" cy="318.0" r="14.0" fill="#1F2937"/><rect x="284.0" y="334.0" width="32.0" height="52.0" rx="12.0" fill="#1F2937"/>
<circle cx="300" cy="412" r="12" fill="none" stroke="#E5A300" stroke-width="4" stroke-dasharray="4 4"/><rect x="64" y="310" width="60" height="44" rx="8" fill="#FFF8E7" stroke="#E5A300" stroke-width="4"/><rect x="476" y="310" width="60" height="44" rx="8" fill="#FFF8E7" stroke="#E5A300" stroke-width="4"/><text x="94" y="386" font-size="22" fill="#8A5D00" font-weight="700" text-anchor="middle">燈</text>
<text x="506" y="386" font-size="22" fill="#8A5D00" font-weight="700" text-anchor="middle">燈</text>
<g transform="translate(300.0 474.0) scale(1.0)"><rect x="-34" y="-22" width="68" height="44" rx="8" fill="#FFFFFF" stroke="#374151" stroke-width="4"/><circle cx="0" cy="0" r="13" fill="none" stroke="#374151" stroke-width="4"/><rect x="-14" y="-32" width="24" height="10" rx="3" fill="#374151"/></g>
<line x1="274" y1="498" x2="256" y2="536" stroke="#374151" stroke-width="4"/><line x1="326" y1="498" x2="344" y2="536" stroke="#374151" stroke-width="4"/><text x="360" y="482" font-size="22" fill="#4B5563">三腳架</text>
<text x="300" y="612" font-size="24" fill="#1F2937" font-weight="700" text-anchor="middle">攝影棚：人站定，光和背景都擺好</text>
<text x="300" y="648" font-size="22" fill="#4B5563" text-anchor="middle">好控制，但人容易像在「被擺」</text>
<rect x="24" y="680" width="552" height="400" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="3"/>
<text x="546" y="736" font-size="22" fill="#4B5563" text-anchor="end">真的街道</text>
<rect x="64" y="756" width="98" height="34" rx="4" fill="#E5E7EB"/><rect x="182" y="756" width="98" height="34" rx="4" fill="#E5E7EB"/><rect x="300" y="756" width="98" height="34" rx="4" fill="#E5E7EB"/><rect x="418" y="756" width="98" height="34" rx="4" fill="#E5E7EB"/><rect x="44" y="810" width="512" height="168" fill="#F3F4F6"/><circle cx="244.8" cy="848.0" r="14.0" fill="#1F2937"/><rect x="228.8" y="864.0" width="32.0" height="52.0" rx="12.0" fill="#1F2937"/>
<text x="245" y="960" font-size="22" fill="#1F2937" font-weight="700" text-anchor="middle">模特兒</text>
<circle cx="465.6" cy="833.6" r="9.8" fill="#9CA3AF"/><rect x="454.4" y="844.8" width="22.4" height="36.4" rx="8.4" fill="#9CA3AF"/>
<text x="466" y="910" font-size="20" fill="#4B5563" text-anchor="middle">路人</text>
<line x1="289" y1="872" x2="377" y2="872" stroke="#374151" stroke-width="4" marker-end="url(#arr)"/><g transform="translate(145.4 1016.0) scale(0.8)"><rect x="-34" y="-22" width="68" height="44" rx="8" fill="#FFFFFF" stroke="#374151" stroke-width="4"/><circle cx="0" cy="0" r="13" fill="none" stroke="#374151" stroke-width="4"/><rect x="-14" y="-32" width="24" height="10" rx="3" fill="#374151"/></g>
<text x="185" y="1024" font-size="22" fill="#4B5563">小相機，手持</text>
<line x1="366" y1="1016" x2="499" y2="1016" stroke="#374151" stroke-width="4" stroke-dasharray="8 8" marker-end="url(#arr)"/><text x="300" y="1122" font-size="24" fill="#8A5D00" font-weight="700" text-anchor="middle">街上：小相機，跟著人一起走</text>
<text x="300" y="1158" font-size="22" fill="#4B5563" text-anchor="middle">路人和街景也進畫面，像一起散步</text>
</svg>

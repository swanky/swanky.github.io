<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">一件館藏頁，要抄下哪幾欄</title>
<desc id="d">示意圖，不是館方版面。以英國 V&amp;A 一件 1955 年作品的館藏頁為例，列出要抄的欄位：作品名 Dovima with the Elephants；拍攝 1955 年；刊登 Harper's Bazaar 1955 年 9 月號；印製 1981 年（這一張相片）；館藏號 PH.26-1985；權利 Copyright Richard Avedon。右側三個提醒：拍攝、刊登、印製是三個不同的年份；館藏號讓別人找得回同一件；權利那一行決定能不能放圖。底部重點：引用時寫哪一館、哪一號，別人才能打開核對。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="1200" height="720" fill="#FFFFFF"/>
<text x="48" y="82" font-size="48" font-weight="700" fill="#1F2937">一件館藏頁，要抄下哪幾欄</text>
<text x="48" y="128" font-size="26" fill="#4B5563">以 V&amp;A 一件 1955 年作品的館藏頁為例（示意，不是館方版面）</text>
<rect x="48" y="160" width="648" height="420" rx="22" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
<rect x="48" y="160" width="648" height="52" rx="22" fill="#64748B"/><rect x="48" y="190" width="648" height="22" fill="#64748B"/>
<text x="76" y="196" font-size="24" font-weight="700" fill="#FFFFFF">館藏頁（示意）</text>
<rect x="64" y="226" width="616" height="50" rx="10" fill="#FFFFFF"/>
<text x="84" y="260" font-size="24" font-weight="700" fill="#4B5563">作品名</text>
<text x="200" y="260" font-size="24" fill="#1F2937">Dovima with the Elephants</text>
<rect x="64" y="284" width="616" height="50" rx="10" fill="#FFFFFF" stroke="#E5A300" stroke-width="3"/>
<text x="84" y="318" font-size="24" font-weight="700" fill="#4B5563">拍攝</text>
<text x="200" y="318" font-size="24" fill="#1F2937">1955 年</text>
<rect x="64" y="342" width="616" height="50" rx="10" fill="#FFFFFF" stroke="#E5A300" stroke-width="3"/>
<text x="84" y="376" font-size="24" font-weight="700" fill="#4B5563">刊登</text>
<text x="200" y="376" font-size="24" fill="#1F2937">Harper's Bazaar 1955 年 9 月號</text>
<rect x="64" y="400" width="616" height="50" rx="10" fill="#FFFFFF" stroke="#E5A300" stroke-width="3"/>
<text x="84" y="434" font-size="24" font-weight="700" fill="#4B5563">印製</text>
<text x="200" y="434" font-size="24" fill="#1F2937">1981 年（這一張相片）</text>
<rect x="64" y="458" width="616" height="50" rx="10" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="3"/>
<text x="84" y="492" font-size="24" font-weight="700" fill="#4B5563">館藏號</text>
<text x="200" y="492" font-size="24" fill="#1F2937">PH.26-1985</text>
<rect x="64" y="516" width="616" height="50" rx="10" fill="#FFFFFF" stroke="#B91C1C" stroke-width="3"/>
<text x="84" y="550" font-size="24" font-weight="700" fill="#4B5563">權利</text>
<text x="200" y="550" font-size="24" fill="#1F2937">Copyright Richard Avedon …</text>
<rect x="736" y="160" width="416" height="130" rx="22" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
<text x="764" y="206" font-size="30" font-weight="700" fill="#8A5D00">三個年份</text>
<text x="764" y="246" font-size="24" fill="#1F2937">拍攝、刊登、印製</text>
<text x="764" y="278" font-size="24" fill="#1F2937">是三件事，別混寫</text>
<rect x="736" y="305" width="416" height="130" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<text x="764" y="351" font-size="30" font-weight="700" fill="#2C5B8F">館藏號</text>
<text x="764" y="391" font-size="24" fill="#1F2937">換頁、換語言，</text>
<text x="764" y="423" font-size="24" fill="#1F2937">都找得回同一件</text>
<rect x="736" y="450" width="416" height="130" rx="22" fill="#FDECEC" stroke="#B91C1C" stroke-width="3"/>
<text x="764" y="496" font-size="30" font-weight="700" fill="#B91C1C">權利那一行</text>
<text x="764" y="536" font-size="24" fill="#1F2937">決定你能放圖，</text>
<text x="764" y="568" font-size="24" fill="#1F2937">還是只能放連結</text>
<rect x="48" y="604" width="1104" height="86" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
<text x="600.0" y="658" font-size="30" font-weight="700" fill="#1F2937" text-anchor="middle">引用時寫「哪一館、哪一號」，<tspan fill="#8A5D00">別人才能打開核對</tspan></text>
</svg>

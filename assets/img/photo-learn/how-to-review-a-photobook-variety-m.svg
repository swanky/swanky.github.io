<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1096" width="600" height="1096" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">單張都好，整本還要「連貫但不單調」</title>
<desc id="d">示意圖。上排「單調」：六張都是全身、站著、正面、雙手垂下，像同一張重複六次。下排「連貫但不單調」：同一位人物、同一個場景，但六張分別是環境遠景、走路、近臉、手部細節、側身坐、背面，景別、姿勢、朝向、手、視線都在變。底部重點：同一個動作只留最好的一張，每一張都要說得出留下的理由。</desc>
<rect width="600" height="1096" fill="#FFFFFF"/>
<text x="28" y="56" font-size="30" font-weight="700" fill="#1F2937">單張都好，整本還要</text>
<text x="28" y="96" font-size="30" font-weight="700" fill="#1F2937">「連貫但不單調」</text>
<text x="28" y="130" font-size="18" fill="#4B5563">六張一小段的兩種排法（示意）</text>

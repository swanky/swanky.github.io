<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">翻一個跨頁，先看兩張怎麼對話</title>
<desc id="d">示意圖，不是原書的任何一頁。左邊畫一個攤開的跨頁：左右兩頁各有一張近方形照片放在上方，照片下面留一大塊白，頁面上沒有圖說也沒有頁碼。右邊三張卡片列出讀跨頁時可以問的三組對比：近和遠、小和大、靜和動。底部重點：沒有字的時候，故事藏在左右兩張的關係裡。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="1200" height="720" fill="#FFFFFF"/>
<text x="48" y="82" font-size="48" font-weight="700" fill="#1F2937">翻一個跨頁，先看兩張怎麼對話</text>
<text x="48" y="128" font-size="26" fill="#4B5563">照片頁不放字時，讀者自己會去找左右兩張的關係（示意）</text>

<!-- 攤開的跨頁 -->
<rect x="48" y="166" width="620" height="420" rx="22" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
<path d="M92,206 L356,198 L356,560 L92,552 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3"/>
<path d="M360,198 L624,206 L624,552 L360,560 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3"/>
<line x1="358" y1="196" x2="358" y2="562" stroke="#64748B" stroke-width="3"/>
<rect x="114" y="226" width="222" height="214" rx="4" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<rect x="380" y="226" width="222" height="214" rx="4" fill="#FDF3E7" stroke="#B45309" stroke-width="3"/>
<text x="225" y="340" text-anchor="middle" font-size="30" font-weight="700" fill="#2C5B8F">近</text>
<text x="225" y="378" text-anchor="middle" font-size="22" fill="#2C5B8F">手裡的小東西</text>
<text x="491" y="340" text-anchor="middle" font-size="30" font-weight="700" fill="#B45309">遠</text>
<text x="491" y="378" text-anchor="middle" font-size="22" fill="#B45309">一整片天空</text>
<text x="225" y="500" text-anchor="middle" font-size="22" fill="#64748B">下方留白</text>
<text x="491" y="500" text-anchor="middle" font-size="22" fill="#64748B">下方留白</text>
<text x="358" y="616" text-anchor="middle" font-size="24" fill="#4B5563">圖說：0 字　頁碼：不印</text>

<!-- 三組對比 -->
<rect x="712" y="166" width="440" height="128" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="752" cy="208" r="24" fill="#2C5B8F"/><text x="752" y="218" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">1</text>
<text x="790" y="218" font-size="32" font-weight="700" fill="#2C5B8F">近 × 遠</text>
<text x="752" y="268" font-size="24" fill="#374151">一張貼近，一張退到天邊</text>
<rect x="712" y="312" width="440" height="128" rx="22" fill="#E6F4F1" stroke="#0E7568" stroke-width="3"/>
<circle cx="752" cy="354" r="24" fill="#0E7568"/><text x="752" y="364" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">2</text>
<text x="790" y="364" font-size="32" font-weight="700" fill="#0E7568">一個 × 一大群</text>
<text x="752" y="414" font-size="24" fill="#374151">單獨一件，對上滿滿一片</text>
<rect x="712" y="458" width="440" height="128" rx="22" fill="#FDF3E7" stroke="#B45309" stroke-width="3"/>
<circle cx="752" cy="500" r="24" fill="#B45309"/><text x="752" y="510" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">3</text>
<text x="790" y="510" font-size="32" font-weight="700" fill="#B45309">靜 × 動</text>
<text x="752" y="560" font-size="24" fill="#374151">放著不動，對上正在轉的</text>
<line x1="636" y1="378" x2="700" y2="378" stroke="#374151" stroke-width="4" marker-end="url(#arr)"/>

<rect x="48" y="632" width="1104" height="64" rx="18" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
<text x="600" y="675" text-anchor="middle" font-size="30" font-weight="700" fill="#1F2937">沒有字的時候，故事藏在<tspan fill="#8A5D00">左右兩張的關係</tspan>裡</text>
</svg>

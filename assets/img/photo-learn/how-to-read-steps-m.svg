<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1290" width="600" height="1290" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">讀一位攝影師，分六步</title>
<desc id="d">示意圖。讀一位攝影師的六個步驟：一、基本資料卡：生卒、在哪裡工作、替誰拍、拍了多久；二、列作品清單：從館藏頁抄作品名、年份、館藏號；三、看作品：光、距離、構圖、姿態、背景；四、讀他說的話：本人訪談、官方影片，跟別人的評論分開；五、放回時代：雜誌、編輯、合作的人，當年和後來的評價；六、寫成三欄筆記：事實、別人怎麼說、我的看法。底部重點：先事實、再引述、最後才是看法。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="600" height="1290" fill="#FFFFFF"/>
<text x="28" y="62" font-size="40" font-weight="700" fill="#1F2937">讀一位攝影師，</text>
<text x="28" y="112" font-size="40" font-weight="700" fill="#1F2937">分六步</text>
<text x="28" y="154" font-size="24" fill="#4B5563">先事實，最後才寫看法（示意）</text>
<rect x="28" y="182" width="544" height="120" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="70" cy="222" r="22" fill="#2C5B8F"/><text x="70" y="231.36" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="106" y="234" font-size="32" font-weight="700" fill="#2C5B8F">基本資料卡</text>
<text x="52" y="280" font-size="26" fill="#1F2937">生卒、在哪裡工作、替誰拍、拍了多久</text>
<line x1="300" y1="306" x2="300" y2="326" stroke="#374151" stroke-width="4" marker-end="url(#arr)"/>
<rect x="28" y="332" width="544" height="120" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="70" cy="372" r="22" fill="#2C5B8F"/><text x="70" y="381.36" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="106" y="384" font-size="32" font-weight="700" fill="#2C5B8F">列作品清單</text>
<text x="52" y="430" font-size="26" fill="#1F2937">從館藏頁抄：作品名、年份、館藏號</text>
<line x1="300" y1="456" x2="300" y2="476" stroke="#374151" stroke-width="4" marker-end="url(#arr)"/>
<rect x="28" y="482" width="544" height="120" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="70" cy="522" r="22" fill="#2C5B8F"/><text x="70" y="531.36" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="106" y="534" font-size="32" font-weight="700" fill="#2C5B8F">看作品</text>
<text x="52" y="580" font-size="26" fill="#1F2937">光、距離、構圖、姿態、背景</text>
<line x1="300" y1="606" x2="300" y2="626" stroke="#374151" stroke-width="4" marker-end="url(#arr)"/>
<rect x="28" y="632" width="544" height="150" rx="22" fill="#FDF3E7" stroke="#B45309" stroke-width="3"/>
<circle cx="70" cy="672" r="22" fill="#B45309"/><text x="70" y="681.36" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="106" y="684" font-size="32" font-weight="700" fill="#B45309">讀他說的話</text>
<text x="52" y="730" font-size="26" fill="#1F2937">本人訪談、官方影片，</text>
<text x="52" y="766" font-size="26" fill="#1F2937">跟別人的評論分開</text>
<line x1="300" y1="786" x2="300" y2="806" stroke="#374151" stroke-width="4" marker-end="url(#arr)"/>
<rect x="28" y="812" width="544" height="150" rx="22" fill="#FDF3E7" stroke="#B45309" stroke-width="3"/>
<circle cx="70" cy="852" r="22" fill="#B45309"/><text x="70" y="861.36" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="106" y="864" font-size="32" font-weight="700" fill="#B45309">放回時代</text>
<text x="52" y="910" font-size="26" fill="#1F2937">雜誌、編輯、合作的人；</text>
<text x="52" y="946" font-size="26" fill="#1F2937">當年和後來的評價</text>
<line x1="300" y1="966" x2="300" y2="986" stroke="#374151" stroke-width="4" marker-end="url(#arr)"/>
<rect x="28" y="992" width="544" height="120" rx="22" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
<circle cx="70" cy="1032" r="22" fill="#E5A300"/><text x="70" y="1041.36" font-size="26" font-weight="700" fill="#1F2937" text-anchor="middle">6</text>
<text x="106" y="1044" font-size="32" font-weight="700" fill="#8A5D00">寫成三欄筆記</text>
<text x="52" y="1090" font-size="26" fill="#1F2937">事實／別人怎麼說／我的看法</text>
<rect x="28" y="1146" width="544" height="118" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
<text x="300.0" y="1195" font-size="30" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan fill="#8A5D00">先事實、再引述、</tspan></text>
<text x="300.0" y="1237" font-size="30" font-weight="700" fill="#1F2937" text-anchor="middle">最後才是看法</text>
</svg>

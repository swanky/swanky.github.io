<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">一半在現場，一半在拍完之後</title>
<desc id="d">構圖與流程示意，不是某張作品的復原。左：現場的俯視圖，一間空房間，窗在上方，四個人分散在房間各處、各自朝不同方向，彼此不互看；相機在遠處角落，用寬視角把整個房間收進來；拍的時候可以讓焦點柔一點、讓窗邊的亮部過曝。右：拍完之後的三步，印得淡一點偏褐色，把照片弄舊、抹掉一點，撕、剪、釘成拼貼。底部重點：現場給氣氛，弄舊與拼貼是拍完之後的事。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
</defs>
<rect width="1200" height="760" fill="#FFFFFF"/>
<text x="48" y="80" font-size="48" font-weight="700" fill="#1F2937">一半在現場，一半在拍完之後</text>
<text x="48" y="126" font-size="26" fill="#4B5563">構圖與流程示意，不是某張作品的復原</text>
<rect x="48" y="168" width="560" height="480" rx="24" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<text x="76" y="220" font-size="34" font-weight="700" fill="#2C5B8F">現場：俯視一間空房間</text>
<rect x="84" y="250" width="488" height="290" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="4"/>
<rect x="200" y="244" width="240" height="14" fill="#FFF8E7" stroke="#E5A300" stroke-width="3"/>
<text x="320" y="290" text-anchor="middle" font-size="22" fill="#8A5D00">窗</text>
<g fill="#475569">
<circle cx="160" cy="330" r="20"/><circle cx="420" cy="320" r="20"/><circle cx="250" cy="450" r="20"/><circle cx="470" cy="440" r="20"/>
</g>
<g stroke="#475569" stroke-width="5" stroke-linecap="round">
<line x1="160" y1="330" x2="132" y2="304"/><line x1="420" y1="320" x2="452" y2="298"/><line x1="250" y1="450" x2="222" y2="478"/><line x1="470" y1="440" x2="470" y2="404"/>
</g>
<g stroke="#2C5B8F" stroke-width="3" stroke-dasharray="8 8"><line x1="526" y1="512" x2="92" y2="262"/><line x1="540" y1="508" x2="560" y2="258"/></g>
<rect x="526" y="508" width="48" height="34" rx="6" fill="#1F2937"/>
<circle cx="538" cy="525" r="10" fill="#FFFFFF"/>
<text x="548" y="572" text-anchor="middle" font-size="22" fill="#2C5B8F">相機</text>
<text x="76" y="600" font-size="26" fill="#1F2937">人分散、各看各的，不互動</text>
<text x="76" y="634" font-size="26" fill="#1F2937">焦點柔一點，讓窗邊亮部過曝</text>
<line x1="614" y1="408" x2="652" y2="408" stroke="#374151" stroke-width="4" marker-end="url(#arr)"/>
<rect x="660" y="168" width="492" height="480" rx="24" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
<text x="688" y="220" font-size="34" font-weight="700" fill="#8A5D00">拍完之後：暗房與桌上</text>
<rect x="688" y="246" width="436" height="104" rx="18" fill="#FFFFFF" stroke="#E5A300" stroke-width="3"/>
<circle cx="732" cy="298" r="24" fill="#E5A300"/><text x="732" y="308" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">1</text>
<text x="772" y="292" font-size="26" font-weight="700" fill="#1F2937">印得淡一點</text>
<text x="772" y="328" font-size="22" fill="#4B5563">褪色的顏色、偏褐色調</text>
<rect x="688" y="372" width="436" height="104" rx="18" fill="#FFFFFF" stroke="#E5A300" stroke-width="3"/>
<circle cx="732" cy="424" r="24" fill="#E5A300"/><text x="732" y="434" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">2</text>
<text x="772" y="418" font-size="26" font-weight="700" fill="#1F2937">把照片弄舊</text>
<text x="772" y="454" font-size="22" fill="#4B5563">抹掉一點，不讓畫面完整</text>
<rect x="688" y="498" width="436" height="104" rx="18" fill="#FFFFFF" stroke="#E5A300" stroke-width="3"/>
<circle cx="732" cy="550" r="24" fill="#E5A300"/><text x="732" y="560" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">3</text>
<text x="772" y="544" font-size="26" font-weight="700" fill="#1F2937">撕、剪、釘成拼貼</text>
<text x="772" y="580" font-size="22" fill="#4B5563">有些影像用負片重複</text>
<rect x="48" y="672" width="1104" height="72" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
<text x="600" y="718" text-anchor="middle" font-size="30" font-weight="700" fill="#1F2937">現場給氣氛，<tspan fill="#8A5D00">弄舊與拼貼是拍完之後的事</tspan></text>
</svg>

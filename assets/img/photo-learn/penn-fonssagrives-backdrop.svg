<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">背景越少，姿勢越重要</title>
<desc id="d">示意圖，不是任何一張原作。左邊是道具很多的搭景：窗簾、畫框、檯燈、椅子、盆栽，中間的人只是畫面的一小部分。右邊是一塊素色布幕，同一個人、同一個姿勢放大成畫面主角，虛線三角形標出姿勢本身形成的外形。底部重點：背景拿掉之後，模特兒的身體就是構圖。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs>
<rect width="1200" height="720" fill="#FFFFFF"/>

<text x="48" y="82" font-size="48" font-weight="700" fill="#1F2937">背景越少，姿勢越重要</text>
<text x="48" y="128" font-size="26" fill="#4B5563">同一個人、同一個姿勢，放進兩種背景（示意）</text>
<rect x="48" y="160" width="500" height="410" rx="22" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
<path d="M82,192 q30,60 0,110 M112,192 q-20,70 10,100" fill="none" stroke="#64748B" stroke-width="5"/><path d="M514,192 q-30,60 0,110 M484,192 q20,70 -10,100" fill="none" stroke="#64748B" stroke-width="5"/><rect x="144" y="216" width="70" height="56" fill="#FFFFFF" stroke="#64748B" stroke-width="4"/><rect x="362" y="206" width="86" height="64" fill="#FFFFFF" stroke="#64748B" stroke-width="4"/><line x1="164" y1="376" x2="164" y2="326" stroke="#64748B" stroke-width="4"/><path d="M140,326 L188,326 L176,294 L152,294 Z" fill="#FDF3E7" stroke="#64748B" stroke-width="4"/><rect x="382" y="306" width="70" height="60" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="4"/><line x1="382" y1="366" x2="382" y2="396" stroke="#64748B" stroke-width="4"/><line x1="452" y1="366" x2="452" y2="396" stroke="#64748B" stroke-width="4"/><circle cx="124" cy="366" r="22" fill="#E6F4F1" stroke="#0E7568" stroke-width="3"/><circle cx="102" cy="342" r="18" fill="#E6F4F1" stroke="#0E7568" stroke-width="3"/><circle cx="146" cy="340" r="18" fill="#E6F4F1" stroke="#0E7568" stroke-width="3"/><ellipse cx="298.0" cy="402" rx="164.0" ry="16" fill="#FDECEC" stroke="#64748B" stroke-width="3"/>
<circle cx="298.0" cy="266.6" r="16.1" fill="#374151"/><path d="M278.1,287.5 L317.9,287.5 L308.4,338.8 L287.6,338.8 Z" fill="#374151"/><path d="M287.6,338.8 L308.4,338.8 L330.3,430.0 L258.1,430.0 Z" fill="#374151"/><polyline points="317.0,291.3 345.5,317.9 309.4,335.0" fill="none" stroke="#374151" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="279.0,291.3 250.5,255.2 277.1,234.3" fill="none" stroke="#374151" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="298" y="488" font-size="34" font-weight="700" text-anchor="middle" fill="#475569">道具很多</text>
<text x="298" y="530" font-size="26" text-anchor="middle" fill="#4B5563">眼睛到處跑，人變成一小塊</text>
<rect x="652" y="160" width="500" height="410" rx="22" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
<path d="M680,180 L1124,180 L1124,380 Q1124,436 1060,436 L744,436 Q680,436 680,380 Z" fill="#F3EEE3"/>
<path d="M902,198 L838,436 L966,436 Z" fill="none" stroke="#E5A300" stroke-width="4" stroke-dasharray="12 10"/>
<circle cx="902.0" cy="231.0" r="20.1" fill="#1F2937"/><path d="M877.2,257.0 L926.8,257.0 L915.0,320.7 L889.0,320.7 Z" fill="#1F2937"/><path d="M889.0,320.7 L915.0,320.7 L942.1,434.0 L852.4,434.0 Z" fill="#1F2937"/><polyline points="925.6,261.7 961.0,294.8 916.2,316.0" fill="none" stroke="#1F2937" stroke-width="10.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="878.4,261.7 843.0,216.9 876.0,190.9" fill="none" stroke="#1F2937" stroke-width="10.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="902" y="488" font-size="34" font-weight="700" text-anchor="middle" fill="#8A5D00">一塊素布幕</text>
<text x="902" y="530" font-size="26" text-anchor="middle" fill="#4B5563">姿勢就是整張照片的骨架</text>
<circle cx="600" cy="365" r="38" fill="#1F2937" stroke="#FFFFFF" stroke-width="6"/><text x="600" y="376" font-size="28" font-weight="700" text-anchor="middle" fill="#FFFFFF">VS</text>
<rect x="48" y="600" width="1104" height="86" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/><text x="600.0" y="653.8" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937">背景拿掉之後，<tspan fill="#8A5D00">模特兒的身體就是構圖</tspan></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">同一件衣服，兩種拍法</title>
<desc id="d">示意圖，由上往下看，不是任何一張原作的布光。左邊是精修棚拍：無縫背景紙、主燈加補光、髮妝造型團隊、模特兒擺好姿勢、照片會再修。右邊是日常場景：真的房間或街頭、窗光或現場的燈、被攝者是朋友或不是職業模特兒、房間裡的東西留在畫面裡、相機離人很近。底下三行對照：場景、人、光與修飾。出處：V&amp;A 說 1990 年代代表人物關心日常生活與真實的人；Getty 說 1990 年代初的這類照片用破舊環境與刺眼的光。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="1200" height="800" fill="#FFFFFF"/>
<text x="48" y="82" font-size="48" fill="#1F2937" font-weight="700">同一件衣服，兩種拍法</text>
<text x="48" y="128" font-size="26" fill="#4B5563">由上往下看・示意，不是任何一張原作的布光</text>
<rect x="48" y="160" width="500" height="470" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<text x="72" y="206" font-size="32" fill="#2C5B8F" font-weight="700">精修棚拍</text>
<path d="M108,256 Q298.0,230 488,256" fill="none" stroke="#9CA3AF" stroke-width="14" stroke-linecap="round"/>
<text x="298.0" y="290" font-size="22" fill="#4B5563" text-anchor="middle">無縫背景紙</text>
<circle cx="298.0" cy="360" r="20" fill="#FFFFFF" stroke="#1F2937" stroke-width="4"/>
<text x="332.0" y="368" font-size="22" fill="#1F2937" font-weight="700">擺好的姿勢</text>
<rect x="84" y="392" width="68" height="36" rx="8" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="4"/>
<text x="118" y="462" font-size="22" fill="#4B5563" text-anchor="middle">主燈</text>
<line x1="118" y1="390" x2="272.0" y2="372" stroke="#2C5B8F" stroke-width="3" stroke-dasharray="8 8"/>
<rect x="444" y="392" width="68" height="36" rx="8" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="4"/>
<text x="478" y="462" font-size="22" fill="#4B5563" text-anchor="middle">補光</text>
<line x1="478" y1="390" x2="324.0" y2="372" stroke="#2C5B8F" stroke-width="3" stroke-dasharray="8 8"/>
<rect x="268.0" y="490" width="60" height="40" rx="8" fill="#1F2937"/><circle cx="298.0" cy="510" r="11" fill="#FFFFFF"/>
<text x="298.0" y="560" font-size="22" fill="#4B5563" text-anchor="middle">相機離人遠一點</text>
<text x="298.0" y="600" font-size="22" fill="#1F2937" font-weight="700" text-anchor="middle">髮妝、造型、後製團隊</text>
<line x1="566" y1="395" x2="634" y2="395" stroke="#374151" stroke-width="4" marker-end="url(#arr)"/>
<rect x="652" y="160" width="500" height="470" rx="22" fill="#FFF8E7" stroke="#E5A300" stroke-width="3"/>
<text x="676" y="206" font-size="32" fill="#8A5D00" font-weight="700">日常場景</text>
<rect x="692" y="246" width="16" height="140" fill="#93C5FD"/>
<text x="722" y="270" font-size="22" fill="#4B5563">窗光／現場的燈</text>
<rect x="1002" y="250" width="110" height="60" rx="10" fill="#FFFFFF" stroke="#8A6F4D" stroke-width="4"/>
<text x="1057" y="338" font-size="22" fill="#4B5563" text-anchor="middle">房間的東西</text>
<text x="1057" y="364" font-size="22" fill="#4B5563" text-anchor="middle">留在畫面裡</text>
<circle cx="902.0" cy="410" r="20" fill="#FFFFFF" stroke="#1F2937" stroke-width="4"/>
<text x="936.0" y="418" font-size="22" fill="#1F2937" font-weight="700">朋友、非職業模特兒</text>
<line x1="712" y1="320" x2="878.0" y2="406" stroke="#E5A300" stroke-width="3" stroke-dasharray="8 8"/>
<rect x="872.0" y="460" width="60" height="40" rx="8" fill="#1F2937"/><circle cx="902.0" cy="480" r="11" fill="#FFFFFF"/>
<text x="902.0" y="530" font-size="22" fill="#4B5563" text-anchor="middle">相機靠很近</text>
<text x="902.0" y="600" font-size="22" fill="#1F2937" font-weight="700" text-anchor="middle">一兩個人就能拍</text>
<rect x="48" y="650" width="1104" height="124" rx="18" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="2"/>
<text x="72" y="694" font-size="26" fill="#1F2937" font-weight="700">場景</text>
<text x="142" y="694" font-size="22" fill="#2C5B8F">棚、搭景</text>
<text x="142" y="738" font-size="22" fill="#8A5D00" font-weight="700">→ 真的房間、街頭</text>
<text x="436" y="694" font-size="26" fill="#1F2937" font-weight="700">人</text>
<text x="506" y="694" font-size="22" fill="#2C5B8F">職業模特兒擺姿勢</text>
<text x="506" y="738" font-size="22" fill="#8A5D00" font-weight="700">→ 朋友、非典型的臉</text>
<text x="800" y="694" font-size="26" fill="#1F2937" font-weight="700">修飾</text>
<text x="870" y="694" font-size="22" fill="#2C5B8F">精修、理想化</text>
<text x="870" y="738" font-size="22" fill="#8A5D00" font-weight="700">→ 保留缺點和現場</text>
</svg>

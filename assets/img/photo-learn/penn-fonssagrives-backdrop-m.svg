<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1180" width="600" height="1180" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">背景越少，姿勢越重要</title>
<desc id="d">示意圖，不是任何一張原作。上方是道具很多的搭景，人只是一小部分；下方是一塊素色布幕，同一個姿勢成了畫面主角，虛線三角形標出姿勢的外形。底部重點：背景拿掉之後，模特兒的身體就是構圖。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs>
<rect width="600" height="1180" fill="#FFFFFF"/>

<text x="40" y="72" font-size="40" font-weight="700" fill="#1F2937">背景越少，姿勢越重要</text>
<text x="40" y="116" font-size="24" fill="#4B5563">同一個人、同一個姿勢（示意）</text>
<rect x="40" y="146" width="520" height="440" rx="22" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
<path d="M74,178 q30,60 0,150 M104,178 q-20,70 10,140" fill="none" stroke="#64748B" stroke-width="5"/><path d="M526,178 q-30,60 0,150 M496,178 q20,70 -10,140" fill="none" stroke="#64748B" stroke-width="5"/><rect x="136" y="202" width="70" height="56" fill="#FFFFFF" stroke="#64748B" stroke-width="4"/><rect x="374" y="192" width="86" height="64" fill="#FFFFFF" stroke="#64748B" stroke-width="4"/><line x1="156" y1="402" x2="156" y2="312" stroke="#64748B" stroke-width="4"/><path d="M132,312 L180,312 L168,280 L144,280 Z" fill="#FDF3E7" stroke="#64748B" stroke-width="4"/><rect x="394" y="332" width="70" height="60" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="4"/><line x1="394" y1="392" x2="394" y2="422" stroke="#64748B" stroke-width="4"/><line x1="464" y1="392" x2="464" y2="422" stroke="#64748B" stroke-width="4"/><circle cx="116" cy="392" r="22" fill="#E6F4F1" stroke="#0E7568" stroke-width="3"/><circle cx="94" cy="368" r="18" fill="#E6F4F1" stroke="#0E7568" stroke-width="3"/><circle cx="138" cy="366" r="18" fill="#E6F4F1" stroke="#0E7568" stroke-width="3"/><ellipse cx="300.0" cy="428" rx="174.0" ry="16" fill="#FDECEC" stroke="#64748B" stroke-width="3"/>
<circle cx="300.0" cy="292.6" r="16.1" fill="#374151"/><path d="M280.1,313.5 L319.9,313.5 L310.4,364.8 L289.6,364.8 Z" fill="#374151"/><path d="M289.6,364.8 L310.4,364.8 L332.3,456.0 L260.1,456.0 Z" fill="#374151"/><polyline points="319.0,317.3 347.5,343.9 311.4,361.0" fill="none" stroke="#374151" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="281.0,317.3 252.5,281.2 279.1,260.3" fill="none" stroke="#374151" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="300" y="516" font-size="34" font-weight="700" text-anchor="middle" fill="#475569">道具很多</text>
<text x="300" y="558" font-size="26" text-anchor="middle" fill="#4B5563">眼睛到處跑，人變成一小塊</text>
<circle cx="300" cy="610" r="34" fill="#1F2937" stroke="#FFFFFF" stroke-width="6"/><text x="300" y="620" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">VS</text>
<rect x="40" y="636" width="520" height="420" rx="22" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
<path d="M70,656 L530,656 L530,880 Q530,920 480,920 L120,920 Q70,920 70,880 Z" fill="#F3EEE3"/>
<path d="M300,676 L230,918 L370,918 Z" fill="none" stroke="#E5A300" stroke-width="4" stroke-dasharray="12 10"/>
<circle cx="300.0" cy="706.2" r="20.7" fill="#1F2937"/><path d="M274.4,733.0 L325.6,733.0 L313.4,798.9 L286.6,798.9 Z" fill="#1F2937"/><path d="M286.6,798.9 L313.4,798.9 L341.5,916.0 L248.8,916.0 Z" fill="#1F2937"/><polyline points="324.4,737.9 361.0,772.0 314.6,794.0" fill="none" stroke="#1F2937" stroke-width="11.0" stroke-linecap="round" stroke-linejoin="round"/><polyline points="275.6,737.9 239.0,691.5 273.2,664.7" fill="none" stroke="#1F2937" stroke-width="11.0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="300" y="978" font-size="34" font-weight="700" text-anchor="middle" fill="#8A5D00">一塊素布幕</text>
<text x="300" y="1020" font-size="26" text-anchor="middle" fill="#4B5563">姿勢就是整張照片的骨架</text>
<rect x="40" y="1078" width="520" height="80" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
<text x="300" y="1110" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">背景拿掉之後，</text>
<text x="300" y="1144" font-size="26" font-weight="700" text-anchor="middle" fill="#8A5D00">模特兒的身體就是構圖</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1270" width="600" height="1270" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">同樣拍到半身，站近和退遠差在哪</title>
<desc id="d">光學示意。上：廣角站在約一臂遠，拍出來人很大、近手放大、背景被拉深。下：長鏡頭退到約五公尺外，背景被壓扁、貼在人後面。底部重點：透視只跟站多遠有關。</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">二十年，分成三段</title>
<desc id="d">示意圖：一條從 2006 到 2026 年的時間線，標出 2026 年回顧展的三個年份標題：2006「憧れと畏怖のあいだ」（在憧憬與畏懼之間）、2018「ひとりの少女を撮り続けること」（持續拍一位少女）、2026「青春をとりもどせ」（把青春找回來）。下方寫著同一天推出的三件事：寫真集、展覽、網路媒體。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="1200" height="720" fill="#FFFFFF"/>
<text x="48" y="82" font-size="48" font-weight="700" fill="#1F2937">二十年，分成三段</text>
<text x="48" y="128" font-size="26" fill="#4B5563">依作者官網與展覽報導整理・示意，不是任何一張原作</text>
<rect x="48" y="160" width="1104" height="330" rx="18" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
<line x1="120" y1="240" x2="1080" y2="240" stroke="#9CA3AF" stroke-width="4"/>
<line x1="1060" y1="240" x2="1100" y2="240" stroke="#374151" stroke-width="3" marker-end="url(#arr)"/>
<circle cx="170" cy="240" r="16" fill="#FFFFFF" stroke="#B45309" stroke-width="6"/>
<text x="170" y="210" font-size="30" font-weight="700" text-anchor="middle" fill="#B45309">2006</text>
<rect x="70" y="290" width="320" height="170" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
<line x1="170" y1="258" x2="230" y2="288" stroke="#9CA3AF" stroke-width="2"/>
<text x="230" y="350" font-size="20" font-weight="700" text-anchor="middle" fill="#1F2937">憧れと畏怖のあいだ</text>
<text x="230" y="400" font-size="24" text-anchor="middle" fill="#4B5563">在憧憬與畏懼之間</text>
<circle cx="686" cy="240" r="16" fill="#FFFFFF" stroke="#B45309" stroke-width="6"/>
<text x="686" y="210" font-size="30" font-weight="700" text-anchor="middle" fill="#B45309">2018</text>
<rect x="445" y="290" width="320" height="170" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
<line x1="686" y1="258" x2="605" y2="288" stroke="#9CA3AF" stroke-width="2"/>
<text x="605" y="350" font-size="20" font-weight="700" text-anchor="middle" fill="#1F2937">ひとりの少女を撮り続けること</text>
<text x="605" y="400" font-size="24" text-anchor="middle" fill="#4B5563">持續拍一位少女</text>
<circle cx="1030" cy="240" r="16" fill="#FFFFFF" stroke="#B45309" stroke-width="6"/>
<text x="1030" y="210" font-size="30" font-weight="700" text-anchor="middle" fill="#B45309">2026</text>
<rect x="820" y="290" width="320" height="170" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
<line x1="1030" y1="258" x2="980" y2="288" stroke="#9CA3AF" stroke-width="2"/>
<text x="980" y="350" font-size="20" font-weight="700" text-anchor="middle" fill="#1F2937">青春をとりもどせ</text>
<text x="980" y="400" font-size="24" text-anchor="middle" fill="#4B5563">把青春找回來</text>
<text x="48" y="548" font-size="28" font-weight="700" fill="#1F2937">2026 年 9 月 19 日，同一天推出三件事</text>
<rect x="48" y="572" width="360" height="100" rx="12" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
<text x="72" y="614" font-size="26" font-weight="700" fill="#1F2937">寫真集</text>
<text x="72" y="652" font-size="20" fill="#4B5563">96 頁、200 部限定</text>
<rect x="420" y="572" width="360" height="100" rx="12" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
<text x="444" y="614" font-size="26" font-weight="700" fill="#1F2937">展覽</text>
<text x="444" y="652" font-size="20" fill="#4B5563">新畫廊的開幕展</text>
<rect x="792" y="572" width="360" height="100" rx="12" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
<text x="816" y="614" font-size="26" font-weight="700" fill="#1F2937">網路媒體</text>
<text x="816" y="652" font-size="20" fill="#4B5563">同名，同時創刊</text>
</svg>

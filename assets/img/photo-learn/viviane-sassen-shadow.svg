<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">影子什麼時候會變成一個形狀</title><desc id="d">一般光學示意，不是 Sassen 的實際布光。上排：小而遠的光源（直射的太陽或一盞裸燈），人站得離牆只有一步，影子落在藍牆上，邊緣清楚，大小和本人差不多。下排：很大的柔光、人離牆很遠，影子糊開、變淡、變大，看不出形狀。底部重點：想讓影子上場，光源小一點、人離牆近一點。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter><filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter></defs>
<rect width="1200" height="830" fill="#FFFFFF"/>
<text x="48" y="82" font-size="48" font-weight="700" fill="#1F2937" text-anchor="start">影子什麼時候會變成一個形狀</text>
<text x="48" y="128" font-size="26" font-weight="400" fill="#4B5563" text-anchor="start">左：從側面看光、人和牆　右：拍出來的樣子（一般光學示意）</text>
<rect x="48" y="156" width="1104" height="250" rx="22" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
<text x="76" y="202" font-size="34" font-weight="700" fill="#8A5D00" text-anchor="start">清楚的影子</text>
<text x="300" y="202" font-size="26" font-weight="400" fill="#4B5563" text-anchor="start">小光源・人離牆一步</text>
<g transform="translate(96 206)"><line x1="0" y1="160" x2="470" y2="160" stroke="#94A3B8" stroke-width="3"/><rect x="420" y="6" width="26" height="154" fill="#2C5B8F"/><circle cx="40" cy="92" r="16" fill="#E5A300"/><line x1="40.0" y1="71.0" x2="40.0" y2="62.599999999999994" stroke="#E5A300" stroke-width="4" stroke-linecap="round"/><line x1="40.0" y1="113.0" x2="40.0" y2="121.4" stroke="#E5A300" stroke-width="4" stroke-linecap="round"/><line x1="19.0" y1="92.0" x2="10.599999999999998" y2="92.0" stroke="#E5A300" stroke-width="4" stroke-linecap="round"/><line x1="25.0" y1="77.0" x2="19.0" y2="71.0" stroke="#E5A300" stroke-width="4" stroke-linecap="round"/><line x1="25.0" y1="107.0" x2="19.0" y2="113.0" stroke="#E5A300" stroke-width="4" stroke-linecap="round"/><line x1="55.0" y1="77.0" x2="61.0" y2="71.0" stroke="#E5A300" stroke-width="4" stroke-linecap="round"/><line x1="55.0" y1="107.0" x2="61.0" y2="113.0" stroke="#E5A300" stroke-width="4" stroke-linecap="round"/><circle cx="370" cy="56.5" r="16.5" fill="#F8EFE0" stroke="#1F2937" stroke-width="3"/><rect x="355.1" y="77.0" width="29.7" height="81.0" rx="13.2" fill="#F8EFE0" stroke="#1F2937" stroke-width="3"/><line x1="40" y1="92" x2="420" y2="22" stroke="#B45309" stroke-width="2.5" stroke-dasharray="8 7"/><line x1="40" y1="92" x2="420" y2="158" stroke="#B45309" stroke-width="2.5" stroke-dasharray="8 7"/><rect x="412" y="24" width="10" height="134" fill="#0B1F33"/><line x1="378" y1="180" x2="416" y2="180" stroke="#374151" stroke-width="3" marker-start="url(#arr)" marker-end="url(#arr)"/></g>
<text x="466" y="394" font-size="22" font-weight="700" fill="#1F2937" text-anchor="end">一步</text>
<line x1="582" y1="286" x2="676" y2="286" stroke="#374151" stroke-width="4" marker-end="url(#arr)"/>
<g transform="translate(704 181)"><rect x="0" y="0" width="420" height="200" rx="14" fill="#2C5B8F"/><path d="M0,160 L420,160 L420,186 Q420,200 406,200 L14,200 Q0,200 0,186 Z" fill="#E5A300"/><g transform="translate(-74 -4)" opacity=".92"><circle cx="250" cy="56.8" r="16.8" fill="#0B1F33" stroke="#0B1F33" stroke-width="3"/><rect x="234.9" y="77.6" width="30.2" height="82.4" rx="13.4" fill="#0B1F33" stroke="#0B1F33" stroke-width="3"/></g><circle cx="250" cy="56.8" r="16.8" fill="#F8EFE0" stroke="#1F2937" stroke-width="3"/><rect x="234.9" y="77.6" width="30.2" height="82.4" rx="13.4" fill="#F8EFE0" stroke="#1F2937" stroke-width="3"/></g>
<rect x="48" y="424" width="1104" height="250" rx="22" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
<text x="76" y="470" font-size="34" font-weight="700" fill="#475569" text-anchor="start">糊掉的影子</text>
<text x="300" y="470" font-size="26" font-weight="400" fill="#4B5563" text-anchor="start">大柔光・人離牆很遠</text>
<g transform="translate(96 474)"><line x1="0" y1="160" x2="470" y2="160" stroke="#94A3B8" stroke-width="3"/><rect x="420" y="6" width="26" height="154" fill="#2C5B8F"/><rect x="14" y="20" width="40" height="140" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="4"/><line x1="22" y1="40" x2="46" y2="40" stroke="#CBD5E1" stroke-width="3"/><line x1="22" y1="70" x2="46" y2="70" stroke="#CBD5E1" stroke-width="3"/><line x1="22" y1="100" x2="46" y2="100" stroke="#CBD5E1" stroke-width="3"/><line x1="22" y1="130" x2="46" y2="130" stroke="#CBD5E1" stroke-width="3"/><circle cx="190" cy="56.5" r="16.5" fill="#F8EFE0" stroke="#1F2937" stroke-width="3"/><rect x="175.1" y="77.0" width="29.7" height="81.0" rx="13.2" fill="#F8EFE0" stroke="#1F2937" stroke-width="3"/><line x1="54" y1="22" x2="420" y2="150" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="8 7"/><line x1="54" y1="158" x2="420" y2="8" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="8 7"/><rect x="410" y="6" width="12" height="154" fill="#0B1F33" opacity=".35" filter="url(#blur2)"/><line x1="200" y1="180" x2="416" y2="180" stroke="#374151" stroke-width="3" marker-start="url(#arr)" marker-end="url(#arr)"/></g>
<text x="288" y="662" font-size="22" font-weight="700" fill="#1F2937" text-anchor="end">很遠</text>
<line x1="582" y1="554" x2="676" y2="554" stroke="#374151" stroke-width="4" marker-end="url(#arr)"/>
<g transform="translate(704 449)"><rect x="0" y="0" width="420" height="200" rx="14" fill="#2C5B8F"/><path d="M0,160 L420,160 L420,186 Q420,200 406,200 L14,200 Q0,200 0,186 Z" fill="#E5A300"/><g transform="translate(-150 -46) scale(1.3)" opacity=".55" filter="url(#blur)"><circle cx="250" cy="56.8" r="16.8" fill="#0B1F33" stroke="#0B1F33" stroke-width="3"/><rect x="234.9" y="77.6" width="30.2" height="82.4" rx="13.4" fill="#0B1F33" stroke="#0B1F33" stroke-width="3"/></g><circle cx="250" cy="56.8" r="16.8" fill="#F8EFE0" stroke="#1F2937" stroke-width="3"/><rect x="234.9" y="77.6" width="30.2" height="82.4" rx="13.4" fill="#F8EFE0" stroke="#1F2937" stroke-width="3"/></g>
<rect x="48" y="730" width="1104" height="76" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
<text x="600" y="778" text-anchor="middle" font-size="30" font-weight="700" fill="#1F2937">想讓影子上場：<tspan fill="#8A5D00">光源小一點，人離牆近一點</tspan></text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1180" width="600" height="1180" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">《人與土地》：先定封面，再分四段</title>
<desc id="d">示意圖，依《遠見》1987 年訪談整理。上排是做書的順序：先決定題目與封面，再從一千多卷底片、四萬多格影像裡精選照片，最後分成四部份。下排是四部份：成長、勞動、信仰、歸宿，連起來是每個人都會經歷的生老病死。底部重點：章名說的是人生的哪一段，不說哪個村子、哪一年。</desc>
<rect width="600" height="1180" fill="#FFFFFF"/>
<text x="24" y="62" font-size="38" font-weight="700" fill="#1F2937" text-anchor="start">先定封面，再選片</text>
<text x="24" y="104" font-size="38" font-weight="700" fill="#1F2937" text-anchor="start">再分四段</text>
<text x="24" y="144" font-size="22" fill="#4B5563" text-anchor="start">示意，依《遠見》1987 年訪談整理</text>
<text x="24" y="200" font-size="28" font-weight="700" fill="#8A5D00" text-anchor="start">做書的順序</text>
<rect x="24" y="218" width="552" height="110" rx="18" fill="#FFF8E7" stroke="#E5A300" stroke-width="4"/>
<text x="300" y="263" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">1 題目與封面</text>
<text x="300" y="299" font-size="24" fill="#374151" text-anchor="middle">最先決定</text>
<path d="M294 332 l0 14 l-12 0 l18 20 l18 -20 l-12 0 l0 -14z" fill="#E5A300"/>
<rect x="24" y="368" width="552" height="110" rx="18" fill="#FFF8E7" stroke="#E5A300" stroke-width="4"/>
<text x="300" y="413" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">2 精選照片</text>
<text x="300" y="449" font-size="24" fill="#374151" text-anchor="middle">一千多卷、四萬多格</text>
<path d="M294 482 l0 14 l-12 0 l18 20 l18 -20 l-12 0 l0 -14z" fill="#E5A300"/>
<rect x="24" y="518" width="552" height="110" rx="18" fill="#FFF8E7" stroke="#E5A300" stroke-width="4"/>
<text x="300" y="563" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">3 分成四部份</text>
<text x="300" y="599" font-size="24" fill="#374151" text-anchor="middle">一個詞一段</text>
<text x="24" y="694" font-size="28" font-weight="700" fill="#334155" text-anchor="start">四部份（一個人的一生）</text>
<rect x="24" y="712" width="264" height="126" rx="18" fill="#F1F5F9" stroke="#64748B" stroke-width="4"/>
<text x="156" y="766" font-size="26" font-weight="700" fill="#1F2937" text-anchor="middle">成長</text>
<text x="156" y="800" font-size="22" fill="#374151" text-anchor="middle">孩子在土地上</text>
<rect x="312" y="712" width="264" height="126" rx="18" fill="#F1F5F9" stroke="#64748B" stroke-width="4"/>
<text x="444" y="766" font-size="26" font-weight="700" fill="#1F2937" text-anchor="middle">勞動</text>
<text x="444" y="800" font-size="22" fill="#374151" text-anchor="middle">靠土地養活自己</text>
<rect x="24" y="862" width="264" height="126" rx="18" fill="#F1F5F9" stroke="#64748B" stroke-width="4"/>
<text x="156" y="916" font-size="26" font-weight="700" fill="#1F2937" text-anchor="middle">信仰</text>
<text x="156" y="950" font-size="22" fill="#374151" text-anchor="middle">環繞土地的信仰</text>
<rect x="312" y="862" width="264" height="126" rx="18" fill="#F1F5F9" stroke="#64748B" stroke-width="4"/>
<text x="444" y="916" font-size="26" font-weight="700" fill="#1F2937" text-anchor="middle">歸宿</text>
<text x="444" y="950" font-size="22" fill="#374151" text-anchor="middle">生於斯、死於斯</text>
<rect x="24" y="1028" width="552" height="120" rx="16" fill="#1F2937"/>
<text x="300" y="1078" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">章名只說走到人生的哪一段</text>
<text x="300" y="1118" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">不說哪個村子、哪一年</text>
</svg>

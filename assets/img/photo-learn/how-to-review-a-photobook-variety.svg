<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">單張都好，整本還要「連貫但不單調」</title>
<desc id="d">示意圖。上排「單調」：六張都是全身、站著、正面、雙手垂下，像同一張重複六次。下排「連貫但不單調」：同一位人物、同一個場景，但六張分別是環境遠景、走路、近臉、手部細節、側身坐、背面，景別、姿勢、朝向、手、視線都在變。底部重點：同一個動作只留最好的一張，每一張都要說得出留下的理由。</desc>
<rect width="1200" height="720" fill="#FFFFFF"/>
<text x="48" y="78" font-size="44" font-weight="700" fill="#1F2937">單張都好，整本還要「連貫但不單調」</text>
<text x="48" y="120" font-size="24" fill="#4B5563">同一位人物、同一個場景，六張一小段的兩種排法（示意）</text>
<rect x="48" y="148" width="1104" height="212" rx="18" fill="#FDECEC" stroke="#B91C1C" stroke-width="2"/>
<text x="68" y="182" font-size="24" font-weight="700" fill="#B91C1C">單調：六張都一樣</text>
<text x="320" y="182" font-size="20" fill="#4B5563">景別、姿勢、朝向、手都沒變，翻起來像同一張重複六次</text>

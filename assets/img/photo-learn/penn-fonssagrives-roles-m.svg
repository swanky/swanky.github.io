<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1060" width="600" height="1060" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">拍之前，先講好誰決定什麼</title>
<desc id="d">三段分工示意，由上到下：攝影師決定背景、取景、按快門的時機（我的整理）；構圖和用光一起決定；模特兒決定姿勢、造型、化妝。後兩段依瑞典女性傳記辭典對 Lisa Fonssagrives 的記載。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs>
<rect width="600" height="1060" fill="#FFFFFF"/>

<text x="40" y="72" font-size="40" font-weight="700" fill="#1F2937">拍之前，先講好</text>
<text x="40" y="122" font-size="40" font-weight="700" fill="#1F2937">誰決定什麼</text>
<text x="40" y="164" font-size="22" fill="#4B5563">下兩段依史料記載；第一段是我的整理</text>
<rect x="40" y="192" width="520" height="196" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<g transform="translate(130 290) rotate(0) scale(1.1)"><rect x="-40" y="-26" width="80" height="52" rx="8" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="4"/><rect x="-16" y="-38" width="32" height="14" rx="3" fill="#2C5B8F"/><circle cx="0" cy="0" r="15" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="4"/><circle cx="0" cy="0" r="6" fill="#2C5B8F"/></g>
<text x="230" y="266" font-size="34" font-weight="700" fill="#2C5B8F">攝影師</text>
<text x="230" y="316" font-size="26" fill="#1F2937">背景、取景、按快門的時機</text>
<line x1="300" y1="392" x2="300" y2="422" stroke="#374151" stroke-width="4" marker-end="url(#arr)"/>
<rect x="40" y="428" width="520" height="196" rx="22" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
<circle cx="108" cy="526" r="34" fill="none" stroke="#2C5B8F" stroke-width="5"/><circle cx="152" cy="526" r="34" fill="none" stroke="#0E7568" stroke-width="5"/><path d="M130,500 Q144,526 130,552 Q116,526 130,500 Z" fill="#E5A300"/>
<text x="230" y="502" font-size="34" font-weight="700" fill="#8A5D00">一起決定</text>
<text x="230" y="552" font-size="26" fill="#1F2937">構圖、用光</text>
<line x1="300" y1="628" x2="300" y2="658" stroke="#374151" stroke-width="4" marker-end="url(#arr)"/>
<rect x="40" y="664" width="520" height="196" rx="22" fill="#E6F4F1" stroke="#0E7568" stroke-width="3"/>
<circle cx="130" cy="732" r="20" fill="#FFFFFF" stroke="#0E7568" stroke-width="5"/><path d="M94,802 Q94,758 130,758 Q166,758 166,802 Z" fill="#FFFFFF" stroke="#0E7568" stroke-width="5"/>
<text x="230" y="738" font-size="34" font-weight="700" fill="#0E7568">模特兒</text>
<text x="230" y="788" font-size="26" fill="#1F2937">姿勢、造型、化妝</text>
<rect x="40" y="904" width="520" height="130" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
<text x="300" y="950" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937">她自己做造型、化妝，</text>
<text x="300" y="996" font-size="28" font-weight="700" text-anchor="middle" fill="#8A5D00">對構圖和用光也有發言權</text>
</svg>

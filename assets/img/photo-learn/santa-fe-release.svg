<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">《Santa Fe》的發行時間線</title>
<desc id="d">示意圖，依國立國會圖書館書目與文春オンライン報導整理，不含書中任何影像。時間線：1991 年 4 月提案；5 月下旬在 Santa Fe 拍攝；10 月 13 日讀賣新聞整版廣告；10 月 14 日朝日新聞同一廣告；11 月 13 日發售，發售前預購 30 萬部（據文春報導）。下方對照兩種開本：1991 年初版 35 公分、4,500 円含稅；1999 年新版 20 公分、1,900 円。</desc>
<rect width="1200" height="720" fill="#FFFFFF"/>
<text x="48" y="78" font-size="46" font-weight="700" fill="#1F2937" text-anchor="start">書還沒上架，話題先到</text>
<text x="48" y="122" font-size="26" fill="#4B5563" text-anchor="start">示意，依國立國會圖書館書目與文春報導整理；不含書中影像</text>
<line x1="110" y1="250" x2="1090" y2="250" stroke="#E5A300" stroke-width="6"/>
<circle cx="130" cy="250" r="16" fill="#FFFFFF" stroke="#E5A300" stroke-width="5"/>
<text x="130" y="212" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">1991.4</text>
<text x="130" y="300" font-size="24" fill="#374151" text-anchor="middle">提案</text>
<circle cx="365" cy="250" r="16" fill="#FFFFFF" stroke="#E5A300" stroke-width="5"/>
<text x="365" y="212" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">5 月下旬</text>
<text x="365" y="300" font-size="24" fill="#374151" text-anchor="middle">Santa Fe 拍攝</text>
<circle cx="600" cy="250" r="16" fill="#E5A300" stroke="#E5A300" stroke-width="5"/>
<text x="600" y="212" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">10.13</text>
<text x="600" y="300" font-size="24" fill="#374151" text-anchor="middle">讀賣整版廣告</text>
<circle cx="835" cy="250" r="16" fill="#E5A300" stroke="#E5A300" stroke-width="5"/>
<text x="835" y="212" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">10.14</text>
<text x="835" y="300" font-size="24" fill="#374151" text-anchor="middle">朝日同一廣告</text>
<circle cx="1070" cy="250" r="16" fill="#FFFFFF" stroke="#E5A300" stroke-width="5"/>
<text x="1070" y="212" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">11.13</text>
<text x="1070" y="300" font-size="24" fill="#374151" text-anchor="middle">發售</text>
<rect x="600" y="330" width="552" height="64" rx="14" fill="#FFF8E7" stroke="#E5A300" stroke-width="3"/>
<text x="876" y="372" font-size="26" font-weight="700" fill="#8A5D00" text-anchor="middle">發售前預購 30 萬部（據文春報導）</text>
<text x="48" y="452" font-size="30" font-weight="700" fill="#334155" text-anchor="start">同一本書，兩種開本（國立國會圖書館書目）</text>
<rect x="48" y="474" width="196" height="196" fill="#F1F5F9" stroke="#64748B" stroke-width="4"/>
<text x="270" y="540" font-size="30" font-weight="700" fill="#1F2937" text-anchor="start">1991 初版</text>
<text x="270" y="584" font-size="26" fill="#374151" text-anchor="start">高 35 公分</text>
<text x="270" y="624" font-size="26" fill="#374151" text-anchor="start">4,500 円（含稅）</text>
<rect x="640" y="558" width="112" height="112" fill="#F1F5F9" stroke="#64748B" stroke-width="4"/>
<text x="776" y="584" font-size="30" font-weight="700" fill="#1F2937" text-anchor="start">1999 新版</text>
<text x="776" y="626" font-size="26" fill="#374151" text-anchor="start">高 20 公分</text>
<text x="776" y="664" font-size="26" fill="#374151" text-anchor="start">1,900 円</text>
</svg>

<text x="744" y="196" font-weight="700" fill="#1F2937">1　等光從開口斜進來</text>
<text x="784" y="232" font-size="22" fill="#6B7280">他說：要等對的光</text>
<text x="744" y="300" font-weight="700" fill="#1F2937">2　有煙有塵，光才看得見</text>
<text x="784" y="336" font-size="22" fill="#6B7280">光變成一道一道的光柱</text>
<text x="744" y="404" font-weight="700" fill="#1F2937">3　人小小一個就夠</text>
<text x="784" y="440" font-size="22" fill="#6B7280">站進光裡，四周壓暗</text>
<text x="744" y="508" font-weight="700" fill="#1F2937">4　相機放低往上拍</text>
<text x="784" y="544" font-size="22" fill="#6B7280">樓梯和屋頂成了布景</text>

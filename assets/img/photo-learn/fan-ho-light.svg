</g>
<g font-size="22" font-weight="700">
<circle cx="425" cy="230" r="20" fill="#B91C1C"/><text x="425" y="238" text-anchor="middle" fill="#FFFFFF">1</text>
<circle cx="450" cy="292" r="20" fill="#B91C1C"/><text x="450" y="300" text-anchor="middle" fill="#FFFFFF">2</text>
<circle cx="555" cy="455" r="20" fill="#B91C1C"/><text x="555" y="463" text-anchor="middle" fill="#FFFFFF">3</text>
<circle cx="179" cy="598" r="20" fill="#B91C1C"/><text x="179" y="606" text-anchor="middle" fill="#FFFFFF">4</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">一道光、一點煙、相機放低：把街市變成舞台</title>
<desc id="d">示意圖，側面看一座有屋頂開口的街市樓梯，不是任何一張原作。光從屋頂開口斜斜照進來；空氣裡的煙或塵讓光變成看得見的光柱；人走上樓梯，剛好站進光裡，周圍大片壓暗；相機放在低處往上拍。右側四點說明：一，等光從開口斜進來；二，有煙有塵，光才看得見；三，人只要小小一個，站進光裡就夠；四，相機放低，樓梯和屋頂成了舞台布景。依 M+ 館藏頁對《迷離世界》的說明（低角度、開頂建築的光影）與家屬官網的自述（背光、煙霧與光線）整理。</desc>
<rect width="1200" height="720" fill="#FFFFFF"/>
<text x="48" y="78" font-size="44" font-weight="700" fill="#1F2937">一道光、一點煙、相機放低</text>
<text x="48" y="120" font-size="26" fill="#4B5563">側面示意，不是任何一張原作</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">同一對人，三種距離</title>
<desc id="d">構圖示意，不是任何一張原作。第一格「近」：畫面裡只有兩個人的頭和肩膀。第二格「中」：兩個人站在一棵開花的樹旁，背後是一面磚牆。第三格「遠」：兩個人坐在畫面中間一座小門樓頂上，只佔一小塊；四周是碎磚、梯子，背後是兩棟高樓。</desc>
<rect width="1200" height="720" fill="#FFFFFF"/>
<text x="48" y="82" font-size="48" font-weight="700" fill="#1F2937">同一對人，三種距離</text>
<text x="48" y="128" font-size="26" fill="#4B5563">構圖示意・不是任何一張原作</text>

<!-- 1 近 -->
<rect x="48" y="170" width="352" height="264" fill="#EDE7DD"/>
<g fill="#374151">
  <circle cx="178" cy="262" r="44"/><path d="M98,434 C98,344 258,344 258,434 Z"/>
  <circle cx="282" cy="270" r="42"/><path d="M206,434 C206,350 358,350 358,434 Z"/>
</g>
<text x="48" y="482" font-size="30" font-weight="700" fill="#1F2937">近：只有兩個人</text>
<text x="48" y="518" font-size="22" fill="#4B5563">看得到表情和手，</text>
<text x="48" y="548" font-size="22" fill="#4B5563">看不出他們在哪裡</text>

<!-- 2 中 -->
<rect x="424" y="170" width="352" height="264" fill="#F3F4F6"/>
<rect x="424" y="230" width="352" height="140" fill="#C9B9A6"/>
<g stroke="#A8957E" stroke-width="2">
  <line x1="424" y1="258" x2="776" y2="258"/><line x1="424" y1="286" x2="776" y2="286"/>
  <line x1="424" y1="314" x2="776" y2="314"/><line x1="424" y1="342" x2="776" y2="342"/>
</g>
<rect x="424" y="370" width="352" height="64" fill="#E5E1D8"/>
<path d="M664,410 L668,300 M668,330 L620,262 M668,312 L716,246 M666,350 L708,300" stroke="#4B5563" stroke-width="7" fill="none" stroke-linecap="round"/>
<g fill="#F2C6D0"><circle cx="622" cy="252" r="26"/><circle cx="666" cy="228" r="30"/><circle cx="716" cy="242" r="28"/><circle cx="700" cy="286" r="22"/><circle cx="640" cy="290" r="20"/></g>
<g fill="#1F2937">
  <circle cx="520" cy="320" r="11"/><rect x="510" y="332" width="20" height="62" rx="7"/>
  <circle cx="554" cy="318" r="11"/><rect x="544" y="330" width="20" height="64" rx="7"/>
</g>
<text x="424" y="482" font-size="30" font-weight="700" fill="#1F2937">中：加上樹和一面牆</text>
<text x="424" y="518" font-size="22" fill="#4B5563">開始知道他們在什麼地方，</text>
<text x="424" y="548" font-size="22" fill="#4B5563">背影也說得出「一起」</text>
<text x="424" y="600" font-size="20" fill="#B45309">對照：〈三影堂，北京 No.20-3〉</text>

<!-- 3 遠 -->
<rect x="800" y="170" width="352" height="264" fill="#E5E7EB"/>
<rect x="820" y="196" width="72" height="174" fill="#9CA3AF"/>
<rect x="1060" y="184" width="72" height="186" fill="#9CA3AF"/>
<g fill="#E5E7EB">
  <rect x="832" y="210" width="12" height="10"/><rect x="852" y="210" width="12" height="10"/><rect x="872" y="210" width="12" height="10"/>
  <rect x="832" y="236" width="12" height="10"/><rect x="852" y="236" width="12" height="10"/><rect x="872" y="236" width="12" height="10"/>
  <rect x="1072" y="200" width="12" height="10"/><rect x="1092" y="200" width="12" height="10"/><rect x="1112" y="200" width="12" height="10"/>
  <rect x="1072" y="226" width="12" height="10"/><rect x="1092" y="226" width="12" height="10"/><rect x="1112" y="226" width="12" height="10"/>
</g>
<rect x="800" y="370" width="352" height="64" fill="#D6CFC2"/>
<rect x="948" y="318" width="60" height="62" fill="#6B7280"/>
<rect x="964" y="340" width="28" height="40" fill="#E5E7EB"/>
<rect x="940" y="306" width="76" height="14" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
<g fill="#1F2937"><circle cx="968" cy="292" r="6"/><rect x="962" y="298" width="12" height="12" rx="4"/><circle cx="988" cy="292" r="6"/><rect x="982" y="298" width="12" height="12" rx="4"/></g>
<path d="M820,434 L846,392 L874,410 L900,380 L924,434 Z" fill="#8B7B6B"/>
<path d="M1030,434 L1052,398 L1080,414 L1104,392 L1132,434 Z" fill="#8B7B6B"/>
<g stroke="#4B5563" stroke-width="3"><line x1="912" y1="300" x2="924" y2="400"/><line x1="930" y1="300" x2="942" y2="400"/><line x1="914" y1="322" x2="932" y2="322"/><line x1="917" y1="346" x2="935" y2="346"/><line x1="920" y1="370" x2="938" y2="370"/></g>
<circle cx="978" cy="300" r="40" fill="none" stroke="#B45309" stroke-width="3" stroke-dasharray="8 6"/>
<text x="800" y="482" font-size="30" font-weight="700" fill="#1F2937">遠：人只佔一小塊</text>
<text x="800" y="518" font-size="22" fill="#4B5563">舊房子、碎磚和新大樓，</text>
<text x="800" y="548" font-size="22" fill="#4B5563">替兩個人說完這個地方</text>
<text x="800" y="600" font-size="20" fill="#B45309">對照：〈六里屯，北京 2003 No.1〉</text>

<text x="48" y="676" font-size="22" fill="#4B5563">同一組人，退得越遠，地方說的話越多；選哪一格，看你想讓照片講「人」還是講「他們在哪裡」。</text>
</svg>

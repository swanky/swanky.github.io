<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1180" width="600" height="1180" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">一道光、一點煙、相機放低：把街市變成舞台</title>
<desc id="d">示意圖，側面看一座有屋頂開口的街市樓梯，不是任何一張原作。光從屋頂開口斜斜照進來；空氣裡的煙或塵讓光變成看得見的光柱；人走上樓梯，剛好站進光裡，周圍壓暗；相機放在低處往上拍。下方四點說明：等光從開口斜進來；有煙有塵，光才看得見；人小小一個就夠；相機放低，樓梯和屋頂成了布景。依 M+ 館藏頁對《迷離世界》的說明與家屬官網的自述整理。</desc>
<rect width="600" height="1180" fill="#FFFFFF"/>
<text x="28" y="62" font-size="40" font-weight="700" fill="#1F2937">一道光、一點煙、</text>
<text x="28" y="112" font-size="40" font-weight="700" fill="#1F2937">相機放低</text>
<text x="28" y="154" font-size="24" fill="#4B5563">側面示意，不是任何一張原作</text>

<g transform="translate(-6,10) scale(0.83)">

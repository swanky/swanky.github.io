<circle cx="450" cy="338" r="24" fill="#B91C1C"/><text x="450" y="347" text-anchor="middle" fill="#FFFFFF">2</text>
<circle cx="560" cy="496" r="24" fill="#B91C1C"/><text x="560" y="505" text-anchor="middle" fill="#FFFFFF">3</text>
<circle cx="179" cy="640" r="24" fill="#B91C1C"/><text x="179" y="649" text-anchor="middle" fill="#FFFFFF">4</text>
</g>
</g>

<g font-size="28" fill="#1F2937" font-weight="700">
<text x="28" y="660">1　等光從開口斜進來</text>
<text x="28" y="772">2　有煙有塵，光才看得見</text>
<text x="28" y="884">3　人小小一個就夠</text>
<text x="28" y="996">4　相機放低往上拍</text>
</g>
<g font-size="24" fill="#6B7280">
<text x="68" y="700">他說：要等對的光</text>
<text x="68" y="812">光變成一道一道的光柱</text>
<text x="68" y="924">站進光裡，四周壓暗</text>
<text x="68" y="1036">樓梯和屋頂成了布景</text>
</g>

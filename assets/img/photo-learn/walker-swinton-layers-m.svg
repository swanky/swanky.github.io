<text x="108" y="942" font-size="26" fill="#4B5563">「她是誰、在這裡做什麼」</text>
<rect x="24" y="984" width="552" height="120" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="68" cy="1044" r="24" fill="#2C5B8F"/><text x="68" y="1054.08" font-size="28" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
<text x="108" y="1036" font-size="34" font-weight="700" fill="#1F2937">邊拍邊加</text>
<text x="108" y="1078" font-size="26" fill="#4B5563">讓對方提想法，角色才是活的</text>
<rect x="24" y="1136" width="552" height="160" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
<text x="300" y="1202" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937">場景、服裝、道具替同一個角色</text>
<text x="300" y="1252" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan fill="#8A5D00">說話，模特兒才住得進去</tspan></text>

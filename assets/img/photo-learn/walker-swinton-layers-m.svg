<text x="211.68" y="634" font-size="22" font-weight="700" text-anchor="middle" fill="#B45309">前景・失焦</text>
<text x="338.64" y="634" font-size="22" font-weight="700" text-anchor="middle" fill="#8A5D00">中景・角色</text>

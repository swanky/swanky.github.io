<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1140" width="600" height="1140" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">跟著一個人一整年</title>
<desc id="d">示意圖：左邊一個圓代表一年，四周寫著春、夏、秋、冬，圓心寫著同一個人、同一台相機。右邊列出三件查得到的做法：借住在當地朋友家拍；因為孩子動作快，改用自動對焦相機，整本只用這一台；書名「未来ちゃん」是一個稱呼，不是本名。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="600" height="1140" fill="#FFFFFF"/>
<text x="40" y="72" font-size="40" font-weight="700" fill="#1F2937">跟著一個人一整年</text>
<text x="40" y="112" font-size="24" fill="#4B5563">示意，不描寫書裡的照片</text>
<rect x="40" y="140" width="520" height="440" rx="18" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
<circle cx="300" cy="360" r="150" fill="#FFFFFF" stroke="#B45309" stroke-width="6"/>
<circle cx="300" cy="210" r="28" fill="#FAFAF7" stroke="#1F2937" stroke-width="3"/>
<text x="300" y="220" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">春</text>
<circle cx="450" cy="360" r="28" fill="#FAFAF7" stroke="#1F2937" stroke-width="3"/>
<text x="450" y="370" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">夏</text>
<circle cx="300" cy="510" r="28" fill="#FAFAF7" stroke="#1F2937" stroke-width="3"/>
<text x="300" y="520" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">秋</text>
<circle cx="150" cy="360" r="28" fill="#FAFAF7" stroke="#1F2937" stroke-width="3"/>
<text x="150" y="370" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">冬</text>
<text x="300" y="354" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937">同一個人</text>
<text x="300" y="392" font-size="22" text-anchor="middle" fill="#4B5563">同一台相機</text>
<rect x="40" y="606" width="520" height="156" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
<circle cx="84" cy="652" r="22" fill="#B45309"/>
<text x="84" y="661" font-size="24" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
<text x="124" y="662" font-size="28" font-weight="700" fill="#1F2937">住下來</text>
<text x="64" y="704" font-size="22" fill="#4B5563">借住在佐渡島的朋友家拍</text>
<rect x="40" y="778" width="520" height="156" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
<circle cx="84" cy="824" r="22" fill="#B45309"/>
<text x="84" y="833" font-size="24" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
<text x="124" y="834" font-size="28" font-weight="700" fill="#1F2937">一台相機</text>
<text x="64" y="876" font-size="22" fill="#4B5563">孩子動作快，改用自動對焦，</text>
<text x="64" y="912" font-size="22" fill="#4B5563">整本只用這一台</text>
<rect x="40" y="950" width="520" height="156" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
<circle cx="84" cy="996" r="22" fill="#B45309"/>
<text x="84" y="1005" font-size="24" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
<text x="124" y="1006" font-size="28" font-weight="700" fill="#1F2937">一個稱呼</text>
<text x="64" y="1048" font-size="22" fill="#4B5563">書名「未来ちゃん」不是本名</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1230" width="600" height="1230" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">硬光和柔光，差在影子的邊</title>
<desc id="d">一般光學原理示意，不是他當年的布光。上：直射陽光，光源小而遠，影子邊緣清楚、亮暗分得很開。下：陰天或大面積柔光，光源大而近，影子邊緣是漸層。底部重點：想要強烈反差，先找直射的光，看影子的邊。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
<filter id="blur" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="600" height="1230" fill="#FFFFFF"/>
<text x="40" y="72" font-size="40" font-weight="700" fill="#1F2937">硬光和柔光，</text>
<text x="40" y="122" font-size="40" font-weight="700" fill="#1F2937">差在影子的邊</text>
<text x="40" y="164" font-size="24" fill="#4B5563">一般光學原理（示意），不是他當年的布光</text>
<rect x="40" y="196" width="520" height="440" rx="22" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
<text x="68" y="248" font-size="34" font-weight="700" fill="#8A5D00">直射陽光</text>
<circle cx="490" cy="252" r="28" fill="#E5A300"/>
<g stroke="#E5A300" stroke-width="5" stroke-linecap="round"><line x1="490" y1="210" x2="490" y2="198"/><line x1="448" y1="252" x2="436" y2="252"/><line x1="460" y1="222" x2="450" y2="212"/><line x1="520" y1="222" x2="530" y2="212"/><line x1="460" y1="282" x2="450" y2="292"/></g>
<line x1="466" y1="276" x2="346" y2="330" stroke="#374151" stroke-width="4" marker-end="url(#arr)"/>
<line x1="68" y1="496" x2="532" y2="496" stroke="#64748B" stroke-width="3"/>
<polygon points="285,496 335,496 194,538 152,532" fill="#1F2937"/>
<circle cx="310" cy="326" r="26" fill="#FFFFFF" stroke="#1F2937" stroke-width="4"/>
<path d="M310,326 m0,-26 a26,26 0 0,1 0,52 z" fill="#1F2937" transform="rotate(180 310 326)"/>
<rect x="285" y="358" width="50" height="138" rx="20" fill="#FFFFFF" stroke="#1F2937" stroke-width="4"/>
<rect x="285" y="358" width="22" height="138" rx="11" fill="#1F2937"/>
<text x="68" y="584" font-size="26" fill="#1F2937">光源小而遠</text>
<text x="68" y="618" font-size="26" font-weight="700" fill="#8A5D00">影子的邊很清楚，亮暗分得開</text>
<rect x="40" y="664" width="520" height="440" rx="22" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
<text x="68" y="716" font-size="34" font-weight="700" fill="#334155">陰天／大柔光</text>
<rect x="330" y="684" width="210" height="56" rx="14" fill="#FFFFFF" stroke="#64748B" stroke-width="3"/>
<text x="435" y="720" text-anchor="middle" font-size="22" fill="#4B5563">大面積的光</text>
<g stroke="#94A3B8" stroke-width="3" stroke-dasharray="6 8"><line x1="350" y1="744" x2="294" y2="810"/><line x1="435" y1="744" x2="322" y2="810"/><line x1="520" y1="744" x2="340" y2="820"/></g>
<line x1="68" y1="964" x2="532" y2="964" stroke="#64748B" stroke-width="3"/>
<ellipse cx="240" cy="982" rx="110" ry="18" fill="#1F2937" opacity="0.45" filter="url(#blur)"/>
<circle cx="310" cy="794" r="26" fill="#FFFFFF" stroke="#64748B" stroke-width="4"/>
<rect x="285" y="826" width="50" height="138" rx="20" fill="#FFFFFF" stroke="#64748B" stroke-width="4"/>
<rect x="285" y="826" width="22" height="138" rx="11" fill="#CBD5E1"/>
<text x="68" y="1052" font-size="26" fill="#1F2937">光源大而近</text>
<text x="68" y="1086" font-size="26" font-weight="700" fill="#334155">影子的邊是漸層，過渡柔和</text>
<rect x="40" y="1128" width="520" height="84" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
<text x="300" y="1166" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">想要強烈反差：先找直射的光，</text>
<text x="300" y="1198" text-anchor="middle" font-size="26" font-weight="700" fill="#8A5D00">看影子的邊</text>
</svg>

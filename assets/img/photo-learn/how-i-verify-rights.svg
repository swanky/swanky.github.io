<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">看得到，不等於能拿來用</title>
<desc id="d">示意圖，實際以每件作品頁為準。四種常見的館方條款寫法：一、可以自由用：公有領域作品、標示 CC0，或寫沒有已知的出版限制，例如大都會、芝加哥藝術學院、國會圖書館；二、非商業可用：限非商業、限尺寸、限期間，原作版權可能另有人，例如 V&amp;A 線上 768 像素、最多 5 年；三、要找權利人：館方沒有這件的權利，要自己聯絡攝影師或遺產取得許可，例如英國國家肖像館；四、只能看：頁面只給看，不能放大、不能下載，例如大都會有版權的作品頁。底部重點：先找頁面上講權利的那一句，再決定放圖還是只放連結。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="1200" height="720" fill="#FFFFFF"/>
<text x="48" y="82" font-size="48" font-weight="700" fill="#1F2937">看得到，不等於能拿來用</text>
<text x="48" y="128" font-size="26" fill="#4B5563">四種常見的館方條款寫法（示意，實際以每件作品頁為準）</text>
<rect x="48" y="160" width="258" height="420" rx="22" fill="#E6F4F1" stroke="#0E7568" stroke-width="3"/>
<circle cx="90" cy="202" r="24" fill="#0E7568"/><text x="90" y="212.08" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="177" y="268" font-size="32" font-weight="700" fill="#0E7568" text-anchor="middle">可以自由用</text>
<text x="72" y="322" font-size="26" fill="#1F2937">公有領域作品，</text>
<text x="72" y="358" font-size="26" fill="#1F2937">標示 CC0，或寫</text>
<text x="72" y="394" font-size="26" fill="#1F2937">「沒有已知的</text>
<text x="72" y="430" font-size="26" fill="#1F2937">出版限制」</text>
<line x1="72" y1="470" x2="282" y2="470" stroke="#0E7568" stroke-width="2" stroke-dasharray="6 6"/>
<text x="72" y="506" font-size="22" font-weight="700" fill="#0E7568">例：大都會、</text>
<text x="72" y="536" font-size="22" font-weight="700" fill="#0E7568">芝加哥藝術</text>
<text x="72" y="566" font-size="22" font-weight="700" fill="#0E7568">學院、國會圖書館</text>
<rect x="330" y="160" width="258" height="420" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="372" cy="202" r="24" fill="#2C5B8F"/><text x="372" y="212.08" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="459" y="268" font-size="32" font-weight="700" fill="#2C5B8F" text-anchor="middle">非商業可用</text>
<text x="354" y="322" font-size="26" fill="#1F2937">限非商業、</text>
<text x="354" y="358" font-size="26" fill="#1F2937">限尺寸、限期間；</text>
<text x="354" y="394" font-size="26" fill="#1F2937">原作的版權</text>
<text x="354" y="430" font-size="26" fill="#1F2937">可能另有人</text>
<line x1="354" y1="470" x2="564" y2="470" stroke="#2C5B8F" stroke-width="2" stroke-dasharray="6 6"/>
<text x="354" y="506" font-size="22" font-weight="700" fill="#2C5B8F">例：V&amp;A</text>
<text x="354" y="536" font-size="22" font-weight="700" fill="#2C5B8F">線上 768 像素、</text>
<text x="354" y="566" font-size="22" font-weight="700" fill="#2C5B8F">最多 5 年</text>
<rect x="612" y="160" width="258" height="420" rx="22" fill="#FDF3E7" stroke="#B45309" stroke-width="3"/>
<circle cx="654" cy="202" r="24" fill="#B45309"/><text x="654" y="212.08" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="741" y="268" font-size="32" font-weight="700" fill="#B45309" text-anchor="middle">要找權利人</text>
<text x="636" y="322" font-size="26" fill="#1F2937">館方沒有這件的</text>
<text x="636" y="358" font-size="26" fill="#1F2937">權利，要自己</text>
<text x="636" y="394" font-size="26" fill="#1F2937">聯絡攝影師或</text>
<text x="636" y="430" font-size="26" fill="#1F2937">遺產取得許可</text>
<line x1="636" y1="470" x2="846" y2="470" stroke="#B45309" stroke-width="2" stroke-dasharray="6 6"/>
<text x="636" y="506" font-size="22" font-weight="700" fill="#B45309">例：英國國家</text>
<text x="636" y="536" font-size="22" font-weight="700" fill="#B45309">肖像館</text>
<rect x="894" y="160" width="258" height="420" rx="22" fill="#FDECEC" stroke="#B91C1C" stroke-width="3"/>
<circle cx="936" cy="202" r="24" fill="#B91C1C"/><text x="936" y="212.08" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="1023" y="268" font-size="32" font-weight="700" fill="#B91C1C" text-anchor="middle">只能看</text>
<text x="918" y="322" font-size="26" fill="#1F2937">頁面只給看，</text>
<text x="918" y="358" font-size="26" fill="#1F2937">不能放大、</text>
<text x="918" y="394" font-size="26" fill="#1F2937">不能下載</text>
<line x1="918" y1="470" x2="1128" y2="470" stroke="#B91C1C" stroke-width="2" stroke-dasharray="6 6"/>
<text x="918" y="506" font-size="22" font-weight="700" fill="#B91C1C">例：大都會</text>
<text x="918" y="536" font-size="22" font-weight="700" fill="#B91C1C">有版權的</text>
<text x="918" y="566" font-size="22" font-weight="700" fill="#B91C1C">作品頁</text>
<rect x="48" y="604" width="1104" height="86" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
<text x="600.0" y="658" font-size="30" font-weight="700" fill="#1F2937" text-anchor="middle">先找頁面上講權利的那一句，<tspan fill="#8A5D00">再決定放圖還是只放連結</tspan></text>
</svg>

<line x1="54" y1="398" x2="546" y2="398" stroke="#D1D5DB" stroke-width="3"/><text x="300" y="532" font-size="24" fill="#1F2937" font-weight="700" text-anchor="middle">排隊形：等距、各站各的</text>

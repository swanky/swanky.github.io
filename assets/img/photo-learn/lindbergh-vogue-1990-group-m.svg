<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1170" width="600" height="1170" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">五個人同框：排隊形，還是靠在一起</title>
<desc id="d">示意圖，不是原作的構圖。左邊五個人等距站成一排，像排好隊形的廣告。右邊五個人靠得很近、前後交錯、互相搭著，像一群朋友。下方提醒：群像的默契，多半是之前一次一次合作攢下來的。</desc>

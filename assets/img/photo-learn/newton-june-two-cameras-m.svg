<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1820" width="600" height="1820" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">現場多一台相機，照片多了什麼</title><desc id="d">由上往下看的拍攝現場示意，不是任何一張原作的現場。藍色圓是攝影師，橘色圓是模特兒，綠色圓是第二位攝影師，扇形是相機拍得到的範圍。第一格：只有一台相機，照片只記下被拍的人。第二格：第二台相機站在側邊，把攝影師、模特兒和現場一起拍進去。第三格：兩人交換位置、互相拍，拍的人和被拍的人輪流。底部重點：第二台相機記下的，是誰在拍。</desc>
<rect width="600" height="1820" fill="#FFFFFF"/>
<text x="40" y="70" font-size="42" font-weight="700" fill="#1F2937">現場多一台相機，</text>
<text x="40" y="122" font-size="42" font-weight="700" fill="#1F2937">照片多了什麼</text>
<text x="40" y="166" font-size="24" fill="#4B5563">由上往下看（示意，不是原作的現場）</text>
<circle cx="52" cy="206" r="12" fill="#2C5B8F"/><text x="72" y="214" font-size="22" font-weight="700" fill="#4B5563">攝影師</text><circle cx="182" cy="206" r="12" fill="#B45309"/><text x="202" y="214" font-size="22" font-weight="700" fill="#4B5563">模特兒</text><circle cx="312" cy="206" r="12" fill="#0E7568"/><text x="332" y="214" font-size="22" font-weight="700" fill="#4B5563">第二位攝影師</text><text x="40" y="250" font-size="22" fill="#4B5563">虛線扇形＝相機拍得到的範圍</text>
<rect x="40" y="280" width="520" height="440" rx="22" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/><circle cx="82" cy="324" r="24" fill="#64748B"/><text x="82" y="334" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">1</text><text x="120" y="336" font-size="34" font-weight="700" fill="#475569">只有一台相機</text><g transform="translate(130 366)"><rect x="0" y="0" width="340" height="230" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><path d="M122.0,120.0 L283.7,67.5 L283.7,172.5 Z" fill="#2C5B8F" fill-opacity=".14" stroke="#2C5B8F" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="70" cy="120" r="26" fill="#2C5B8F"/><text x="70" y="129" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">攝</text><g transform="translate(106.0 120.0) rotate(0)"><rect x="-10" y="-11" width="20" height="22" rx="4" fill="#1F2937"/><rect x="8" y="-6" width="8" height="12" rx="2" fill="#1F2937"/></g><circle cx="280" cy="120" r="26" fill="#B45309"/><text x="280" y="129" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">模</text></g><text x="300" y="642" text-anchor="middle" font-size="26" fill="#1F2937">照片只記下</text><text x="300" y="680" text-anchor="middle" font-size="26" fill="#1F2937">被拍的人</text>
<rect x="40" y="750" width="520" height="440" rx="22" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/><circle cx="82" cy="794" r="24" fill="#E5A300"/><text x="82" y="804" text-anchor="middle" font-size="28" font-weight="700" fill="#1F2937">2</text><text x="120" y="806" font-size="34" font-weight="700" fill="#8A5D00">多一台在側邊</text><g transform="translate(130 836)"><rect x="0" y="0" width="340" height="230" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><path d="M170.0,98.0 L288.2,190.3 L51.8,190.3 Z" fill="#0E7568" fill-opacity=".14" stroke="#0E7568" stroke-width="2.5" stroke-dasharray="8 6"/><path d="M122.0,160.0 L266.2,118.7 L266.2,201.3 Z" fill="#2C5B8F" fill-opacity=".14" stroke="#2C5B8F" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="70" cy="160" r="26" fill="#2C5B8F"/><text x="70" y="169" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">攝</text><g transform="translate(106.0 160.0) rotate(0)"><rect x="-10" y="-11" width="20" height="22" rx="4" fill="#1F2937"/><rect x="8" y="-6" width="8" height="12" rx="2" fill="#1F2937"/></g><circle cx="270" cy="160" r="26" fill="#B45309"/><text x="270" y="169" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">模</text><circle cx="170" cy="46" r="26" fill="#0E7568"/><text x="170" y="55" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">攝</text><g transform="translate(170.0 82.0) rotate(90)"><rect x="-10" y="-11" width="20" height="22" rx="4" fill="#1F2937"/><rect x="8" y="-6" width="8" height="12" rx="2" fill="#1F2937"/></g></g><text x="300" y="1112" text-anchor="middle" font-size="26" fill="#1F2937">攝影師和現場</text><text x="300" y="1150" text-anchor="middle" font-size="26" fill="#1F2937">也進了照片</text>
<rect x="40" y="1220" width="520" height="440" rx="22" fill="#E6F4F1" stroke="#0E7568" stroke-width="3"/><circle cx="82" cy="1264" r="24" fill="#0E7568"/><text x="82" y="1274" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">3</text><text x="120" y="1276" font-size="34" font-weight="700" fill="#0E7568">兩人換位置</text><g transform="translate(130 1306)"><rect x="0" y="0" width="340" height="230" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><path d="M122.0,120.0 L275.3,81.8 L275.3,158.2 Z" fill="#2C5B8F" fill-opacity=".14" stroke="#2C5B8F" stroke-width="2.5" stroke-dasharray="8 6"/><path d="M218.0,120.0 L64.7,158.2 L64.7,81.8 Z" fill="#0E7568" fill-opacity=".14" stroke="#0E7568" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="70" cy="120" r="26" fill="#2C5B8F"/><text x="70" y="129" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">攝</text><g transform="translate(106.0 120.0) rotate(0)"><rect x="-10" y="-11" width="20" height="22" rx="4" fill="#1F2937"/><rect x="8" y="-6" width="8" height="12" rx="2" fill="#1F2937"/></g><circle cx="270" cy="120" r="26" fill="#0E7568"/><text x="270" y="129" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">攝</text><g transform="translate(234.0 120.0) rotate(180)"><rect x="-10" y="-11" width="20" height="22" rx="4" fill="#1F2937"/><rect x="8" y="-6" width="8" height="12" rx="2" fill="#1F2937"/></g></g><text x="300" y="1582" text-anchor="middle" font-size="26" fill="#1F2937">拍的人和被拍的</text><text x="300" y="1620" text-anchor="middle" font-size="26" fill="#1F2937">輪流交換</text>
<rect x="40" y="1690" width="520" height="106" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
<text x="300" y="1734" text-anchor="middle" font-size="28" font-weight="700" fill="#1F2937">第二台相機記下的，是</text>
<text x="300" y="1774" text-anchor="middle" font-size="28" font-weight="700" fill="#8A5D00">「誰在拍、怎麼拍」</text>
</svg>
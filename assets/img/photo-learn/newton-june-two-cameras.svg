<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">現場多一台相機，照片多了什麼</title><desc id="d">由上往下看的拍攝現場示意，不是任何一張原作的現場。藍色圓是攝影師，橘色圓是模特兒，綠色圓是第二位攝影師，扇形是相機拍得到的範圍。第一格：只有一台相機，照片只記下被拍的人。第二格：第二台相機站在側邊，把攝影師、模特兒和現場一起拍進去。第三格：兩人交換位置、互相拍，拍的人和被拍的人輪流。底部重點：第二台相機記下的，是誰在拍。</desc>
<rect width="1200" height="760" fill="#FFFFFF"/>
<text x="48" y="82" font-size="48" font-weight="700" fill="#1F2937">現場多一台相機，照片多了什麼</text>
<text x="48" y="128" font-size="26" fill="#4B5563">由上往下看的拍攝現場（示意，不是原作的現場）</text>
<circle cx="60" cy="168" r="12" fill="#2C5B8F"/><text x="80" y="176" font-size="22" font-weight="700" fill="#4B5563">攝影師</text><circle cx="180" cy="168" r="12" fill="#B45309"/><text x="200" y="176" font-size="22" font-weight="700" fill="#4B5563">模特兒</text><circle cx="300" cy="168" r="12" fill="#0E7568"/><text x="320" y="176" font-size="22" font-weight="700" fill="#4B5563">第二位攝影師</text><text x="498" y="176" font-size="22" fill="#4B5563">虛線扇形＝相機拍得到的範圍</text>
<rect x="48" y="204" width="346" height="440" rx="22" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/><circle cx="90" cy="248" r="24" fill="#64748B"/><text x="90" y="258" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">1</text><text x="128" y="260" font-size="34" font-weight="700" fill="#475569">只有一台相機</text><g transform="translate(51 290)"><rect x="0" y="0" width="340" height="230" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><path d="M122.0,120.0 L283.7,67.5 L283.7,172.5 Z" fill="#2C5B8F" fill-opacity=".14" stroke="#2C5B8F" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="70" cy="120" r="26" fill="#2C5B8F"/><text x="70" y="129" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">攝</text><g transform="translate(106.0 120.0) rotate(0)"><rect x="-10" y="-11" width="20" height="22" rx="4" fill="#1F2937"/><rect x="8" y="-6" width="8" height="12" rx="2" fill="#1F2937"/></g><circle cx="280" cy="120" r="26" fill="#B45309"/><text x="280" y="129" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">模</text></g><text x="221" y="566" text-anchor="middle" font-size="26" fill="#1F2937">照片只記下</text><text x="221" y="604" text-anchor="middle" font-size="26" fill="#1F2937">被拍的人</text>
<rect x="427" y="204" width="346" height="440" rx="22" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/><circle cx="469" cy="248" r="24" fill="#E5A300"/><text x="469" y="258" text-anchor="middle" font-size="28" font-weight="700" fill="#1F2937">2</text><text x="507" y="260" font-size="34" font-weight="700" fill="#8A5D00">多一台在側邊</text><g transform="translate(430 290)"><rect x="0" y="0" width="340" height="230" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><path d="M170.0,98.0 L288.2,190.3 L51.8,190.3 Z" fill="#0E7568" fill-opacity=".14" stroke="#0E7568" stroke-width="2.5" stroke-dasharray="8 6"/><path d="M122.0,160.0 L266.2,118.7 L266.2,201.3 Z" fill="#2C5B8F" fill-opacity=".14" stroke="#2C5B8F" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="70" cy="160" r="26" fill="#2C5B8F"/><text x="70" y="169" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">攝</text><g transform="translate(106.0 160.0) rotate(0)"><rect x="-10" y="-11" width="20" height="22" rx="4" fill="#1F2937"/><rect x="8" y="-6" width="8" height="12" rx="2" fill="#1F2937"/></g><circle cx="270" cy="160" r="26" fill="#B45309"/><text x="270" y="169" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">模</text><circle cx="170" cy="46" r="26" fill="#0E7568"/><text x="170" y="55" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">攝</text><g transform="translate(170.0 82.0) rotate(90)"><rect x="-10" y="-11" width="20" height="22" rx="4" fill="#1F2937"/><rect x="8" y="-6" width="8" height="12" rx="2" fill="#1F2937"/></g></g><text x="600" y="566" text-anchor="middle" font-size="26" fill="#1F2937">攝影師和現場</text><text x="600" y="604" text-anchor="middle" font-size="26" fill="#1F2937">也進了照片</text>
<rect x="806" y="204" width="346" height="440" rx="22" fill="#E6F4F1" stroke="#0E7568" stroke-width="3"/><circle cx="848" cy="248" r="24" fill="#0E7568"/><text x="848" y="258" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">3</text><text x="886" y="260" font-size="34" font-weight="700" fill="#0E7568">兩人換位置</text><g transform="translate(809 290)"><rect x="0" y="0" width="340" height="230" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><path d="M122.0,120.0 L275.3,81.8 L275.3,158.2 Z" fill="#2C5B8F" fill-opacity=".14" stroke="#2C5B8F" stroke-width="2.5" stroke-dasharray="8 6"/><path d="M218.0,120.0 L64.7,158.2 L64.7,81.8 Z" fill="#0E7568" fill-opacity=".14" stroke="#0E7568" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="70" cy="120" r="26" fill="#2C5B8F"/><text x="70" y="129" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">攝</text><g transform="translate(106.0 120.0) rotate(0)"><rect x="-10" y="-11" width="20" height="22" rx="4" fill="#1F2937"/><rect x="8" y="-6" width="8" height="12" rx="2" fill="#1F2937"/></g><circle cx="270" cy="120" r="26" fill="#0E7568"/><text x="270" y="129" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">攝</text><g transform="translate(234.0 120.0) rotate(180)"><rect x="-10" y="-11" width="20" height="22" rx="4" fill="#1F2937"/><rect x="8" y="-6" width="8" height="12" rx="2" fill="#1F2937"/></g></g><text x="979" y="566" text-anchor="middle" font-size="26" fill="#1F2937">拍的人和被拍的</text><text x="979" y="604" text-anchor="middle" font-size="26" fill="#1F2937">輪流交換</text>
<rect x="48" y="668" width="1104" height="72" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
<text x="600" y="715" text-anchor="middle" font-size="30" font-weight="700" fill="#1F2937">第二台相機記下的，是<tspan fill="#8A5D00">「誰在拍、怎麼拍」</tspan></text>
</svg>
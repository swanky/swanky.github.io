<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">資料分四層，只有第一層能寫成事實</title>
<desc id="d">示意圖。資料來源分四層：第一層一手來源（館藏頁、基金會、出版社、國家圖書館、學術單位），可以寫成事實；第二層部分可用，只寫它撐得起的句子；第三層只當線索（百科、新聞、拍賣行、搜尋摘要、圖片檔名），拿來找下一頁；第四層不能用（打不開、內容對不上、找不到館方原始紀錄）。底部重點：看到說法先別寫，追到館方原始頁再寫。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="1200" height="720" fill="#FFFFFF"/>
<text x="48" y="82" font-size="48" font-weight="700" fill="#1F2937">資料分四層，只有第一層能寫成事實</text>
<text x="48" y="128" font-size="26" fill="#4B5563">線索可以從哪裡都來；寫進文章之前，要追到第一層（示意）</text>
<rect x="48" y="158" width="1104" height="94" rx="22" fill="#E6F4F1" stroke="#0E7568" stroke-width="3"/>
<circle cx="92" cy="205" r="24" fill="#0E7568"/><text x="92" y="215.08" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="134" y="217" font-size="34" font-weight="700" fill="#0E7568">一手來源</text>
<text x="330" y="215" font-size="26" fill="#1F2937">館藏頁、基金會、出版社、國家圖書館、學術</text>
<rect x="922" y="183" width="206" height="44" rx="22" fill="#FFFFFF" stroke="#0E7568" stroke-width="2"/>
<text x="1025" y="213" font-size="22" font-weight="700" fill="#0E7568" text-anchor="middle">可以寫成事實</text>
<rect x="48" y="266" width="1104" height="94" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="92" cy="313" r="24" fill="#2C5B8F"/><text x="92" y="323.08" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="134" y="325" font-size="34" font-weight="700" fill="#2C5B8F">部分可用</text>
<text x="330" y="323" font-size="26" fill="#1F2937">來源可靠，但只撐得起其中幾句</text>
<rect x="922" y="291" width="206" height="44" rx="22" fill="#FFFFFF" stroke="#2C5B8F" stroke-width="2"/>
<text x="1025" y="321" font-size="22" font-weight="700" fill="#2C5B8F" text-anchor="middle">只寫它撐得起的</text>
<rect x="48" y="374" width="1104" height="94" rx="22" fill="#FDF3E7" stroke="#B45309" stroke-width="3"/>
<circle cx="92" cy="421" r="24" fill="#B45309"/><text x="92" y="431.08" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="134" y="433" font-size="34" font-weight="700" fill="#B45309">只當線索</text>
<text x="330" y="431" font-size="26" fill="#1F2937">百科、新聞、拍賣行、搜尋摘要、圖片檔名</text>
<rect x="922" y="399" width="206" height="44" rx="22" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
<text x="1025" y="429" font-size="22" font-weight="700" fill="#B45309" text-anchor="middle">拿來找下一頁</text>
<rect x="48" y="482" width="1104" height="94" rx="22" fill="#FDECEC" stroke="#B91C1C" stroke-width="3"/>
<circle cx="92" cy="529" r="24" fill="#B91C1C"/><text x="92" y="539.08" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="134" y="541" font-size="34" font-weight="700" fill="#B91C1C">不能用</text>
<text x="330" y="539" font-size="26" fill="#1F2937">打不開、內容對不上、找不到館方原始紀錄</text>
<rect x="922" y="507" width="206" height="44" rx="22" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2"/>
<text x="1025" y="537" font-size="22" font-weight="700" fill="#B91C1C" text-anchor="middle">不寫</text>
<rect x="48" y="604" width="1104" height="86" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
<text x="600.0" y="658" font-size="30" font-weight="700" fill="#1F2937" text-anchor="middle">看到說法先別寫，<tspan fill="#8A5D00">追到館方原始頁再寫</tspan></text>
</svg>

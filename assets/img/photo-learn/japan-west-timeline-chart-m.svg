<rect x="40" y="3206" width="66" height="34" rx="17" fill="#2C5B8F"/>
<text x="73" y="3231" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">歐美</text>
<text x="122" y="3232" font-size="26" fill="#2C5B8F" font-weight="700">1990</text>
<text x="48" y="3274" font-size="26" fill="#1F2937">Corinne Day 在《The Face》</text>

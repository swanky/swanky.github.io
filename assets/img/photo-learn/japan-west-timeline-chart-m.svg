<rect x="24" y="2440" width="552" height="144" rx="16" fill="#FDECEC" stroke="#B91C1C" stroke-width="2"/>
<rect x="40" y="2454" width="66" height="34" rx="17" fill="#B91C1C"/>
<text x="73" y="2479" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">日本</text>
<text x="122" y="2480" font-size="26" fill="#B91C1C" font-weight="700">1968–69</text>
<text x="48" y="2522" font-size="26" fill="#1F2937">《Provoke》出三期</text>
<text x="48" y="2556" font-size="24" fill="#4B5563">粗、晃、失焦（1970 出書）</text>
<rect x="24" y="2596" width="552" height="144" rx="16" fill="#FDECEC" stroke="#B91C1C" stroke-width="2"/>
<rect x="40" y="2610" width="66" height="34" rx="17" fill="#B91C1C"/>
<text x="73" y="2635" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">日本</text>
<text x="122" y="2636" font-size="26" fill="#B91C1C" font-weight="700">1974</text>
<text x="48" y="2678" font-size="26" fill="#1F2937">紐約 MoMA 辦日本攝影展</text>
<text x="48" y="2712" font-size="24" fill="#4B5563">第一次獲國際機構肯定</text>
<rect x="24" y="2752" width="552" height="144" rx="16" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="2"/>
<rect x="40" y="2766" width="66" height="34" rx="17" fill="#2C5B8F"/>
<text x="73" y="2791" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">歐美</text>
<text x="122" y="2792" font-size="26" fill="#2C5B8F" font-weight="700">1975</text>
<text x="48" y="2834" font-size="26" fill="#1F2937">Turbeville 浴場照</text>
<text x="48" y="2868" font-size="24" fill="#4B5563">刊在《Vogue》5 月號</text>
<rect x="24" y="2924" width="552" height="96" rx="18" fill="#FFF8E7" stroke="#E5A300" stroke-width="3"/>
<text x="48" y="2964" font-size="26" fill="#8A5D00" font-weight="700">1980 年代–2001</text>
<text x="48" y="3002" font-size="26" fill="#1F2937" font-weight="700">拍真實的人、拍日常</text>
<rect x="24" y="3036" width="552" height="144" rx="16" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="2"/>
<rect x="40" y="3050" width="66" height="34" rx="17" fill="#2C5B8F"/>
<text x="73" y="3075" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">歐美</text>
<text x="122" y="3076" font-size="26" fill="#2C5B8F" font-weight="700">1980 年代</text>
<text x="48" y="3118" font-size="26" fill="#1F2937">風格刊物興起</text>
<text x="48" y="3152" font-size="24" fill="#4B5563">街頭「straight ups」</text>

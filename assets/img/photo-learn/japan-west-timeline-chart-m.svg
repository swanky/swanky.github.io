<rect x="24" y="3348" width="552" height="144" rx="16" fill="#FDECEC" stroke="#B91C1C" stroke-width="2"/>
<rect x="40" y="3362" width="66" height="34" rx="17" fill="#B91C1C"/>
<text x="73" y="3387" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">日本</text>
<text x="122" y="3388" font-size="26" fill="#B91C1C" font-weight="700">1990 年代</text>
<text x="48" y="3430" font-size="26" fill="#1F2937">「女の子写真」</text>
<text x="48" y="3464" font-size="24" fill="#4B5563">這個標籤出現</text>
<rect x="24" y="3504" width="552" height="110" rx="16" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="2"/>
<rect x="40" y="3518" width="66" height="34" rx="17" fill="#2C5B8F"/>
<text x="73" y="3543" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">歐美</text>
<text x="122" y="3544" font-size="26" fill="#2C5B8F" font-weight="700">1997</text>
<text x="48" y="3586" font-size="26" fill="#1F2937">V&amp;A 辦《當代時尚攝影》展</text>
<rect x="24" y="3626" width="552" height="144" rx="16" fill="#FDECEC" stroke="#B91C1C" stroke-width="2"/>
<rect x="40" y="3640" width="66" height="34" rx="17" fill="#B91C1C"/>
<text x="73" y="3665" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">日本</text>
<text x="122" y="3666" font-size="26" fill="#B91C1C" font-weight="700">2000 年度</text>
<text x="48" y="3708" font-size="26" fill="#1F2937">木村伊兵衛賞</text>
<text x="48" y="3742" font-size="24" fill="#4B5563">長島・蜷川・HIROMIX</text>
<rect x="24" y="3782" width="552" height="144" rx="16" fill="#FDECEC" stroke="#B91C1C" stroke-width="2"/>
<rect x="40" y="3796" width="66" height="34" rx="17" fill="#B91C1C"/>
<text x="73" y="3821" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">日本</text>
<text x="122" y="3822" font-size="26" fill="#B91C1C" font-weight="700">2001 年度</text>
<text x="48" y="3864" font-size="26" fill="#1F2937">木村伊兵衛賞</text>
<text x="48" y="3898" font-size="24" fill="#4B5563">川內倫子《うたたね》</text>
<rect x="24" y="3954" width="552" height="96" rx="18" fill="#FFF8E7" stroke="#E5A300" stroke-width="3"/>
<text x="48" y="3994" font-size="26" fill="#8A5D00" font-weight="700">2005 年至今</text>
<text x="48" y="4032" font-size="26" fill="#1F2937" font-weight="700">每個人都在發照片</text>
<rect x="24" y="4066" width="552" height="144" rx="16" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="2"/>
<rect x="40" y="4080" width="66" height="34" rx="17" fill="#2C5B8F"/>
<text x="73" y="4105" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">歐美</text>

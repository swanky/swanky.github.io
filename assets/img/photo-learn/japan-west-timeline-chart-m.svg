<rect x="40" y="4392" width="66" height="34" rx="17" fill="#B91C1C"/>
<text x="73" y="4417" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">日本</text>
<text x="122" y="4418" font-size="26" fill="#B91C1C" font-weight="700">2015–16</text>
<text x="48" y="4460" font-size="26" fill="#1F2937">Getty 展出 1990 年代後</text>
<text x="48" y="4494" font-size="24" fill="#4B5563">崛起的五位女性攝影師</text>
<rect x="24" y="4534" width="552" height="144" rx="16" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="2"/>
<rect x="40" y="4548" width="66" height="34" rx="17" fill="#2C5B8F"/>
<text x="73" y="4573" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">歐美</text>
<text x="122" y="4574" font-size="26" fill="#2C5B8F" font-weight="700">2026</text>
<text x="48" y="4616" font-size="26" fill="#1F2937">Tate Britain</text>
<text x="48" y="4650" font-size="24" fill="#4B5563">《The 90s: Art and Fashion》</text>

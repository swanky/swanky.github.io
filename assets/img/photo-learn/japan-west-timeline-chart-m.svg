<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 4826" width="600" height="4826" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">日本與歐美時尚攝影對照年表（手機版）</title>
<desc id="d">手機直式版：依時期排列，每個節點標日本或歐美。內容同桌機版。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="600" height="4826" fill="#FFFFFF"/>
<text x="24" y="70" font-size="40" fill="#1F2937" font-weight="700">日本與歐美時尚攝影</text>
<text x="24" y="116" font-size="40" fill="#1F2937" font-weight="700">一張對照年表</text>
<text x="24" y="160" font-size="22" fill="#4B5563">紅＝日本，藍＝歐美；並列不代表互相影響</text>
<rect x="24" y="200" width="552" height="96" rx="18" fill="#FFF8E7" stroke="#E5A300" stroke-width="3"/>
<text x="48" y="240" font-size="26" fill="#8A5D00" font-weight="700">1911–1930 年代</text>
<text x="48" y="278" font-size="26" fill="#1F2937" font-weight="700">雜誌開始用照片賣衣服</text>
<rect x="24" y="312" width="552" height="144" rx="16" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="2"/>
<rect x="40" y="326" width="66" height="34" rx="17" fill="#2C5B8F"/>
<text x="73" y="351" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">歐美</text>
<text x="122" y="352" font-size="26" fill="#2C5B8F" font-weight="700">1911</text>
<text x="48" y="394" font-size="26" fill="#1F2937">Steichen 拍 Poiret 的衣服</text>
<text x="48" y="428" font-size="24" fill="#4B5563">13 張柔焦照刊在雜誌</text>
<rect x="24" y="468" width="552" height="144" rx="16" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="2"/>
<rect x="40" y="482" width="66" height="34" rx="17" fill="#2C5B8F"/>
<text x="73" y="507" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">歐美</text>
<text x="122" y="508" font-size="26" fill="#2C5B8F" font-weight="700">1914</text>
<text x="48" y="550" font-size="26" fill="#1F2937">de Meyer 成為《Vogue》</text>
<text x="48" y="584" font-size="24" fill="#4B5563">第一位全職攝影師</text>
<rect x="24" y="624" width="552" height="144" rx="16" fill="#FDECEC" stroke="#B91C1C" stroke-width="2"/>
<rect x="40" y="638" width="66" height="34" rx="17" fill="#B91C1C"/>
<text x="73" y="663" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">日本</text>
<text x="122" y="664" font-size="26" fill="#B91C1C" font-weight="700">1930</text>
<text x="48" y="706" font-size="26" fill="#1F2937">中山岩太〈福助足袋〉</text>
<text x="48" y="740" font-size="24" fill="#4B5563">國際廣告寫真展一等</text>
<rect x="24" y="780" width="552" height="144" rx="16" fill="#FDECEC" stroke="#B91C1C" stroke-width="2"/>
<rect x="40" y="794" width="66" height="34" rx="17" fill="#B91C1C"/>
<text x="73" y="819" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">日本</text>
<text x="122" y="820" font-size="26" fill="#B91C1C" font-weight="700">1932–33</text>
<text x="48" y="862" font-size="26" fill="#1F2937">《光画》出刊不到兩年</text>
<text x="48" y="896" font-size="24" fill="#4B5563">新興寫真的園地</text>
<rect x="24" y="936" width="552" height="144" rx="16" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="2"/>
<rect x="40" y="950" width="66" height="34" rx="17" fill="#2C5B8F"/>
<text x="73" y="975" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">歐美</text>
<text x="122" y="976" font-size="26" fill="#2C5B8F" font-weight="700">1933</text>
<text x="48" y="1018" font-size="26" fill="#1F2937">Munkácsi 讓模特兒</text>
<text x="48" y="1052" font-size="24" fill="#4B5563">在海灘上奔跑</text>
<rect x="24" y="1108" width="552" height="96" rx="18" fill="#FFF8E7" stroke="#E5A300" stroke-width="3"/>
<text x="48" y="1148" font-size="26" fill="#8A5D00" font-weight="700">1940–1950 年代</text>
<text x="48" y="1186" font-size="26" fill="#1F2937" font-weight="700">從棚內走到街上</text>
<rect x="24" y="1220" width="552" height="144" rx="16" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="2"/>
<rect x="40" y="1234" width="66" height="34" rx="17" fill="#2C5B8F"/>
<text x="73" y="1259" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">歐美</text>
<text x="122" y="1260" font-size="26" fill="#2C5B8F" font-weight="700">1943</text>
<text x="48" y="1302" font-size="26" fill="#1F2937">Penn 的第一張彩色照</text>
<text x="48" y="1336" font-size="24" fill="#4B5563">成為《Vogue》封面</text>
<rect x="24" y="1376" width="552" height="144" rx="16" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="2"/>
<rect x="40" y="1390" width="66" height="34" rx="17" fill="#2C5B8F"/>
<text x="73" y="1415" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">歐美</text>
<text x="122" y="1416" font-size="26" fill="#2C5B8F" font-weight="700">1955</text>
<text x="48" y="1458" font-size="26" fill="#1F2937">Avedon〈Dovima with</text>
<text x="48" y="1492" font-size="24" fill="#4B5563">Elephants〉在馬戲場拍</text>
<rect x="24" y="1532" width="552" height="144" rx="16" fill="#FDECEC" stroke="#B91C1C" stroke-width="2"/>
<rect x="40" y="1546" width="66" height="34" rx="17" fill="#B91C1C"/>
<text x="73" y="1571" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">日本</text>
<text x="122" y="1572" font-size="26" fill="#B91C1C" font-weight="700">1957</text>
<text x="48" y="1614" font-size="26" fill="#1F2937">常盤とよ子《危険な毒花》</text>
<text x="48" y="1648" font-size="24" fill="#4B5563">日本女性攝影師的第一本寫真集</text>
<rect x="24" y="1704" width="552" height="96" rx="18" fill="#FFF8E7" stroke="#E5A300" stroke-width="3"/>
<text x="48" y="1744" font-size="26" fill="#8A5D00" font-weight="700">1959–1970 年代</text>
<text x="48" y="1782" font-size="26" fill="#1F2937" font-weight="700">攝影師開始問：我看到的是什麼</text>
<rect x="24" y="1816" width="552" height="144" rx="16" fill="#FDECEC" stroke="#B91C1C" stroke-width="2"/>
<rect x="40" y="1830" width="66" height="34" rx="17" fill="#B91C1C"/>
<text x="73" y="1855" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">日本</text>
<text x="122" y="1856" font-size="26" fill="#B91C1C" font-weight="700">1959</text>
<text x="48" y="1898" font-size="26" fill="#1F2937">VIVO 成立</text>
<text x="48" y="1932" font-size="24" fill="#4B5563">約兩年後解散</text>
<rect x="24" y="1972" width="552" height="144" rx="16" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="2"/>
<rect x="40" y="1986" width="66" height="34" rx="17" fill="#2C5B8F"/>
<text x="73" y="2011" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">歐美</text>
<text x="122" y="2012" font-size="26" fill="#2C5B8F" font-weight="700">50 年代末</text>
<text x="48" y="2054" font-size="26" fill="#1F2937">Klein 手持 35mm 相機</text>
<text x="48" y="2088" font-size="24" fill="#4B5563">把模特兒帶到城市裡</text>
<rect x="24" y="2128" width="552" height="144" rx="16" fill="#FDECEC" stroke="#B91C1C" stroke-width="2"/>
<rect x="40" y="2142" width="66" height="34" rx="17" fill="#B91C1C"/>
<text x="73" y="2167" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">日本</text>
<text x="122" y="2168" font-size="26" fill="#B91C1C" font-weight="700">1965</text>
<text x="48" y="2210" font-size="26" fill="#1F2937">鋤田正義上京</text>
<text x="48" y="2244" font-size="24" fill="#4B5563">做男裝時尚的工作</text>
<rect x="24" y="2284" width="552" height="144" rx="16" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="2"/>
<rect x="40" y="2298" width="66" height="34" rx="17" fill="#2C5B8F"/>
<text x="73" y="2323" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">歐美</text>
<text x="122" y="2324" font-size="26" fill="#2C5B8F" font-weight="700">1965</text>
<text x="48" y="2366" font-size="26" fill="#1F2937">Bailey《Box of Pin-Ups》</text>

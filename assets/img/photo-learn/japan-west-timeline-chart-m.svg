<rect x="24" y="4222" width="552" height="144" rx="16" fill="#FDECEC" stroke="#B91C1C" stroke-width="2"/>
<rect x="40" y="4236" width="66" height="34" rx="17" fill="#B91C1C"/>
<text x="73" y="4261" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">日本</text>
<text x="122" y="4262" font-size="26" fill="#B91C1C" font-weight="700">2012</text>
<text x="48" y="4304" font-size="26" fill="#1F2937">東京都寫真美術館</text>

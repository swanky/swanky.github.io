<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1100" width="600" height="1100" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">一本 308 頁的書，字放在哪裡</title>
<desc id="d">示意圖。上方長條代表 1972 年初版的 308 頁：第 1 到 276 頁以照片為主，第 277 到 308 頁是森山大道和中平卓馬的對談。下方四張卡片是四個版本：1972 初版有對談；2006 年新版不印頁碼、辭典記載沒收對談；2019 年月曜社集成版 328 頁；2023 年普及版 316 頁、照片 145 張、對談全文收錄。</desc>
<rect width="600" height="1100" fill="#FFFFFF"/>
<text x="28" y="60" font-size="38" font-weight="700" fill="#1F2937">一本 308 頁的書，</text>
<text x="28" y="106" font-size="38" font-weight="700" fill="#1F2937">字放在哪裡</text>
<text x="28" y="146" font-size="22" fill="#4B5563">1972 年初版，長條照頁數比例畫</text>

<!-- 544px / 308 頁；276 頁 = 487px -->
<rect x="28" y="172" width="487" height="90" fill="#1F2937"/>
<rect x="515" y="172" width="57" height="90" fill="#F59E0B"/>
<rect x="28" y="172" width="544" height="90" fill="none" stroke="#111827" stroke-width="3"/>
<text x="271" y="226" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">p.1–276　以照片為主</text>
<text x="572" y="292" text-anchor="end" font-size="20" font-weight="700" fill="#B45309">p.277–308</text>
<text x="572" y="318" text-anchor="end" font-size="20" font-weight="700" fill="#B45309">對談</text>
<text x="28" y="356" font-size="22" fill="#4B5563">字幾乎全部退到最後 32 頁。</text>
<text x="28" y="388" font-size="20" fill="#64748B">照片頁內部怎麼排，書目沒有細分。</text>

<text x="28" y="446" font-size="28" font-weight="700" fill="#1F2937">同一本書，四個版本</text>
<g font-size="22">
<rect x="28" y="466" width="544" height="130" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="50" y="506" font-weight="700" fill="#1F2937">1972　写真評論社初版</text><text x="50" y="542" fill="#475569">308 頁、23 公分</text><text x="50" y="576" fill="#B45309" font-weight="700">書末有對談</text>
<rect x="28" y="610" width="544" height="130" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="50" y="650" font-weight="700" fill="#1F2937">2006　パワーショベル新版</text><text x="50" y="686" fill="#475569">不印頁碼、29 公分</text><text x="50" y="720" fill="#64748B">辭典記載：沒收對談</text>
<rect x="28" y="754" width="544" height="130" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="50" y="794" font-weight="700" fill="#1F2937">2019　月曜社「集成」第 3 卷</text><text x="50" y="830" fill="#475569">328 頁、照初版圖像尺寸重印</text><text x="50" y="864" fill="#64748B">已售完</text>
<rect x="28" y="898" width="544" height="130" rx="14" fill="#FDF3E7" stroke="#B45309" stroke-width="2"/>
<text x="50" y="938" font-weight="700" fill="#1F2937">2023　月曜社普及版</text><text x="50" y="974" fill="#475569">316 頁、照片 145 張</text><text x="50" y="1008" fill="#B45309" font-weight="700">對談全文收錄</text>
</g>
<text x="28" y="1066" font-size="18" fill="#64748B">資料：國會圖書館、月曜社；2006 年版依 artscape 辭典。</text>
</svg>

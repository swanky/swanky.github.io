<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">把一座村子當舞台：三方各站哪裡</title>
<desc id="d">示意圖，不是原作的實際配置。由上往下看一片田地：中間是舞者，負責用身體即興；周圍有幾位村民，他們的反應也會被拍進畫面；攝影師站在較遠的田埂上，用比較寬的視角把人和地方一起框進來，負責選地點、取景和等時機。右側三張卡片分別寫攝影師、舞者、村民各自帶來什麼。底部提醒：今天在公共場所拍到路人，要先取得同意。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="1200" height="720" fill="#FFFFFF"/>
<text x="48" y="82" font-size="46" font-weight="700" fill="#1F2937">把一座村子當舞台：三方各站哪裡</text>
<text x="48" y="126" font-size="25" fill="#4B5563">由上往下看的一種拍攝配置（示意，不是《鎌鼬》的實際位置）</text>

<!-- 田地 -->
<rect x="48" y="160" width="640" height="460" rx="20" fill="#F3F7EE" stroke="#7C8B5B" stroke-width="3"/>
<g stroke="#B9C6A0" stroke-width="2">
<line x1="78" y1="200" x2="660" y2="200"/><line x1="78" y1="240" x2="660" y2="240"/><line x1="78" y1="280" x2="660" y2="280"/>
<line x1="78" y1="320" x2="660" y2="320"/><line x1="78" y1="360" x2="660" y2="360"/><line x1="78" y1="400" x2="660" y2="400"/>
<line x1="78" y1="440" x2="660" y2="440"/><line x1="78" y1="480" x2="660" y2="480"/>
</g>
<text x="76" y="190" font-size="20" fill="#5B6B3A">田地</text>
<!-- 田埂 -->
<rect x="48" y="520" width="640" height="100" fill="#E7DCC8" stroke="#A08A64" stroke-width="2"/>
<text x="76" y="608" font-size="20" fill="#7A6640">田埂</text>

<!-- 視角 -->
<path d="M368,560 L110,214 L630,214 Z" fill="#2C5B8F" fill-opacity="0.07" stroke="#2C5B8F" stroke-width="2" stroke-dasharray="8 6"/>

<!-- 舞者 -->
<circle cx="368" cy="330" r="34" fill="#B45309"/>
<text x="368" y="340" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">舞</text>
<path d="M410,300 C450,280 470,300 488,276" fill="none" stroke="#B45309" stroke-width="3" marker-end="url(#arr)"/>
<path d="M326,300 C290,276 268,296 250,270" fill="none" stroke="#B45309" stroke-width="3" marker-end="url(#arr)"/>

<!-- 村民 -->
<g fill="#64748B">
<circle cx="200" cy="420" r="20"/><circle cx="246" cy="452" r="20"/><circle cx="520" cy="412" r="20"/><circle cx="560" cy="300" r="20"/><circle cx="168" cy="290" r="20"/>
</g>
<text x="223" y="500" text-anchor="middle" font-size="20" fill="#475569">村民</text>
<text x="540" y="460" text-anchor="middle" font-size="20" fill="#475569">村民</text>

<!-- 攝影師 -->
<rect x="340" y="548" width="56" height="40" rx="8" fill="#2C5B8F"/>
<circle cx="368" cy="568" r="11" fill="#FFFFFF"/>
<text x="414" y="576" font-size="22" font-weight="700" fill="#2C5B8F">攝影師：站遠一點</text>

<!-- 三張卡 -->
<rect x="724" y="160" width="428" height="136" rx="16" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<text x="748" y="202" font-size="28" font-weight="700" fill="#2C5B8F">攝影師帶來</text>
<text x="748" y="240" font-size="23" fill="#1F2937">選哪裡拍、怎麼框、什麼時候按</text>
<text x="748" y="274" font-size="23" fill="#1F2937">把人和地方放進同一張</text>

<rect x="724" y="312" width="428" height="136" rx="16" fill="#FDF3E7" stroke="#B45309" stroke-width="3"/>
<text x="748" y="354" font-size="28" font-weight="700" fill="#B45309">舞者帶來</text>
<text x="748" y="392" font-size="23" fill="#1F2937">一個角色，和隨地即興的身體</text>
<text x="748" y="426" font-size="23" fill="#1F2937">不等指令，自己先動</text>

<rect x="724" y="464" width="428" height="156" rx="16" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
<text x="748" y="506" font-size="28" font-weight="700" fill="#475569">現場帶來</text>
<text x="748" y="544" font-size="23" fill="#1F2937">真的田、真的房子</text>
<text x="748" y="578" font-size="23" fill="#1F2937">和旁人真實的反應</text>
<text x="748" y="608" font-size="19" fill="#64748B">這一塊沒辦法事先排練</text>

<rect x="48" y="644" width="1104" height="56" rx="12" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/>
<text x="72" y="681" font-size="23" fill="#7F1D1D">今天的提醒：在公共場所拍到路人，要先說明、先取得同意，不能把別人當成免費的臨演。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1300" width="600" height="1300" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">從七、八百張幻燈片，剪成 127 張的書</title>
<desc id="d">示意圖，不是原書的任何一頁。上半部：左邊一大片小方塊代表幻燈秀，45 分鐘可以放七、八百張，每次順序都不同；箭頭寫著刪掉 550～600 張，指向右邊一本書，收 127 張。下半部是一排橫直不一的方框，示意編輯說的排法：橫幅與直幅交替、室內與戶外交替、看鏡頭與看旁邊交替。數字依 Aperture 1986 年訪談與 2020 年編輯訪談。重點：排書像排歌單，相鄰兩張要換一點東西。</desc>

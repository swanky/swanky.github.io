<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">硬光和柔光，差在影子的邊</title>
<desc id="d">一般光學原理示意，不是他當年的布光。左：直射陽光，光源小而遠，人的影子邊緣清楚、亮暗分得很開。右：陰天或大面積柔光，光源大而近，影子邊緣是漸層、亮暗過渡柔和。底部重點：想要強烈反差，先找直射的光，看影子的邊。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
<filter id="blur" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="1200" height="740" fill="#FFFFFF"/>
<text x="48" y="80" font-size="48" font-weight="700" fill="#1F2937">硬光和柔光，差在影子的邊</text>
<text x="48" y="126" font-size="26" fill="#4B5563">一般光學原理（示意），不是他當年的布光</text>
<rect x="48" y="168" width="540" height="440" rx="24" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
<text x="80" y="222" font-size="34" font-weight="700" fill="#8A5D00">直射陽光</text>
<circle cx="514" cy="226" r="28" fill="#E5A300"/>
<g stroke="#E5A300" stroke-width="5" stroke-linecap="round"><line x1="514" y1="182" x2="514" y2="168"/><line x1="470" y1="226" x2="456" y2="226"/><line x1="483" y1="195" x2="473" y2="185"/><line x1="545" y1="195" x2="555" y2="185"/><line x1="483" y1="257" x2="473" y2="267"/></g>
<line x1="490" y1="250" x2="366" y2="306" stroke="#374151" stroke-width="4" marker-end="url(#arr)"/>
<line x1="80" y1="470" x2="556" y2="470" stroke="#64748B" stroke-width="3"/>
<polygon points="305,470 355,470 214,512 172,506" fill="#1F2937"/>
<circle cx="330" cy="300" r="26" fill="#FFFFFF" stroke="#1F2937" stroke-width="4"/>
<path d="M330,300 m0,-26 a26,26 0 0,1 0,52 z" fill="#1F2937" transform="rotate(180 330 300)"/>
<rect x="305" y="332" width="50" height="138" rx="20" fill="#FFFFFF" stroke="#1F2937" stroke-width="4"/>
<rect x="305" y="332" width="22" height="138" rx="11" fill="#1F2937"/>
<text x="80" y="552" font-size="26" fill="#1F2937">光源小而遠</text>
<text x="80" y="590" font-size="26" font-weight="700" fill="#8A5D00">影子的邊很清楚，亮暗分得開</text>
<rect x="612" y="168" width="540" height="440" rx="24" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
<text x="644" y="222" font-size="34" font-weight="700" fill="#334155">陰天／大柔光</text>
<rect x="900" y="186" width="220" height="60" rx="14" fill="#FFFFFF" stroke="#64748B" stroke-width="3"/>
<text x="1010" y="225" text-anchor="middle" font-size="22" fill="#4B5563">大面積的光</text>
<g stroke="#94A3B8" stroke-width="3" stroke-dasharray="6 8"><line x1="930" y1="250" x2="884" y2="330"/><line x1="1010" y1="250" x2="912" y2="330"/><line x1="1090" y1="250" x2="930" y2="340"/></g>
<line x1="644" y1="470" x2="1120" y2="470" stroke="#64748B" stroke-width="3"/>
<ellipse cx="830" cy="488" rx="110" ry="18" fill="#1F2937" opacity="0.45" filter="url(#blur)"/>
<circle cx="900" cy="300" r="26" fill="#FFFFFF" stroke="#64748B" stroke-width="4"/>
<rect x="875" y="332" width="50" height="138" rx="20" fill="#FFFFFF" stroke="#64748B" stroke-width="4"/>
<rect x="875" y="332" width="22" height="138" rx="11" fill="#CBD5E1"/>
<text x="644" y="552" font-size="26" fill="#1F2937">光源大而近</text>
<text x="644" y="590" font-size="26" font-weight="700" fill="#334155">影子的邊是漸層，過渡柔和</text>
<rect x="48" y="632" width="1104" height="84" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
<text x="600" y="686" text-anchor="middle" font-size="30" font-weight="700" fill="#1F2937">想要強烈反差：先找直射的光，<tspan fill="#8A5D00">看影子的邊</tspan></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1060" width="600" height="1060" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">翻一個跨頁，先看兩張怎麼對話</title>
<desc id="d">示意圖，不是原書的任何一頁。上方畫一個攤開的跨頁：左右兩頁各有一張近方形照片放在上方，照片下面留白，沒有圖說也沒有頁碼。下方三張卡片列出讀跨頁時可以問的三組對比：近和遠、一個和一大群、靜和動。底部重點：沒有字的時候，故事藏在左右兩張的關係裡。</desc>
<rect width="600" height="1060" fill="#FFFFFF"/>
<text x="28" y="62" font-size="40" font-weight="700" fill="#1F2937">翻一個跨頁，</text>
<text x="28" y="112" font-size="40" font-weight="700" fill="#1F2937">先看兩張怎麼對話</text>
<text x="28" y="156" font-size="26" fill="#4B5563">照片頁不放字時（示意）</text>

<rect x="28" y="186" width="544" height="380" rx="22" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
<path d="M54,216 L298,208 L298,520 L54,512 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3"/>
<path d="M302,208 L546,216 L546,512 L302,520 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3"/>
<line x1="300" y1="206" x2="300" y2="522" stroke="#64748B" stroke-width="3"/>
<rect x="72" y="234" width="208" height="196" rx="4" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<rect x="320" y="234" width="208" height="196" rx="4" fill="#FDF3E7" stroke="#B45309" stroke-width="3"/>
<text x="176" y="336" text-anchor="middle" font-size="34" font-weight="700" fill="#2C5B8F">近</text>
<text x="424" y="336" text-anchor="middle" font-size="34" font-weight="700" fill="#B45309">遠</text>
<text x="176" y="480" text-anchor="middle" font-size="24" fill="#64748B">下方留白</text>
<text x="424" y="480" text-anchor="middle" font-size="24" fill="#64748B">下方留白</text>
<text x="300" y="552" text-anchor="middle" font-size="26" fill="#4B5563">圖說 0 字・頁碼不印</text>

<rect x="28" y="592" width="544" height="104" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="66" cy="632" r="22" fill="#2C5B8F"/><text x="66" y="641" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">1</text>
<text x="102" y="642" font-size="32" font-weight="700" fill="#2C5B8F">近 × 遠</text>
<text x="52" y="680" font-size="26" fill="#374151">一張貼近，一張退到天邊</text>
<rect x="28" y="712" width="544" height="104" rx="22" fill="#E6F4F1" stroke="#0E7568" stroke-width="3"/>
<circle cx="66" cy="752" r="22" fill="#0E7568"/><text x="66" y="761" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">2</text>
<text x="102" y="762" font-size="32" font-weight="700" fill="#0E7568">一個 × 一大群</text>
<text x="52" y="800" font-size="26" fill="#374151">單獨一件，對上滿滿一片</text>
<rect x="28" y="832" width="544" height="104" rx="22" fill="#FDF3E7" stroke="#B45309" stroke-width="3"/>
<circle cx="66" cy="872" r="22" fill="#B45309"/><text x="66" y="881" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">3</text>
<text x="102" y="882" font-size="32" font-weight="700" fill="#B45309">靜 × 動</text>
<text x="52" y="920" font-size="26" fill="#374151">放著不動，對上正在轉的</text>

<rect x="28" y="956" width="544" height="88" rx="18" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
<text x="300" y="992" text-anchor="middle" font-size="28" font-weight="700" fill="#1F2937">沒有字的時候，故事藏在</text>
<text x="300" y="1028" text-anchor="middle" font-size="28" font-weight="700" fill="#8A5D00">左右兩張的關係裡</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1300" width="600" height="1300" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">讓身體去接場景裡的大形狀</title>
<desc id="d">手機版構圖示意，不是任何一張原作。兩側各有一個大形狀，人物在正中間兩手往兩側伸，金色虛線表示手臂延伸線接到形狀上。下方三步：先找形狀、再擺手臂、臉最安靜。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs>
<rect width="600" height="1300" fill="#FFFFFF"/>

<text x="24" y="66" font-size="42" font-weight="700" fill="#1F2937">讓身體去接場景</text>
<text x="24" y="116" font-size="42" font-weight="700" fill="#1F2937">裡的大形狀</text>
<text x="24" y="158" font-size="24" fill="#4B5563">正面構圖示意・不是原作</text>
<rect x="24" y="186" width="552" height="470" rx="24" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
<line x1="48" y1="596" x2="552" y2="596" stroke="#CBD5E1" stroke-width="4"/>
<path d="M58,596 L58,330.52 A74.52000000000001,74.52000000000001 0 0 1 207.04000000000002,330.52 L207.04000000000002,596 Z" fill="#CBD5E1" stroke="#94A3B8" stroke-width="3" opacity=".75"/>
<path d="M392.96,596 L392.96,360.52 A74.52000000000001,74.52000000000001 0 0 1 542.0,360.52 L542.0,596 Z" fill="#CBD5E1" stroke="#94A3B8" stroke-width="3" opacity=".75"/>
<circle cx="300.0" cy="363.8" r="23.0" fill="#1F2937"/><path d="M271.6,393.5 L328.4,393.5 L314.9,466.4 L285.1,466.4 Z" fill="#1F2937"/><path d="M285.1,466.4 L314.9,466.4 L345.9,596.0 L243.3,596.0 Z" fill="#1F2937"/><polyline points="273.0,398.9 216.3,358.4 159.6,317.9" fill="none" stroke="#1F2937" stroke-width="12.2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="327.0,398.9 389.1,380.0 448.5,358.4" fill="none" stroke="#1F2937" stroke-width="12.2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="160" cy="318" r="16" fill="none" stroke="#E5A300" stroke-width="5"/>
<circle cx="448" cy="358" r="16" fill="none" stroke="#E5A300" stroke-width="5"/>
<text x="132.52" y="405.04" font-size="24" font-weight="700" text-anchor="middle" fill="#1F2937">大形狀</text>
<text x="467.48" y="435.04" font-size="24" font-weight="700" text-anchor="middle" fill="#1F2937">大形狀</text>
<text x="132.52" y="437.04" font-size="22" text-anchor="middle" fill="#4B5563">略柔</text>
<text x="467.48" y="467.04" font-size="22" text-anchor="middle" fill="#4B5563">略柔</text>
<text x="300.0" y="636" font-size="24" font-weight="700" text-anchor="middle" fill="#8A5D00">人在正中、最清楚、表情最安靜</text>
<text x="300.0" y="230" font-size="24" font-weight="700" text-anchor="middle" fill="#8A5D00">手臂順著線，接到兩邊的形狀</text>
<rect x="24" y="684" width="552" height="120" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="68" cy="744" r="24" fill="#2C5B8F"/><text x="68" y="754.08" font-size="28" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
<text x="108" y="736" font-size="34" font-weight="700" fill="#1F2937">先找形狀</text>
<text x="108" y="778" font-size="26" fill="#4B5563">拱門、柱子、樹幹、布料</text>
<rect x="24" y="820" width="552" height="120" rx="22" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
<circle cx="68" cy="880" r="24" fill="#E5A300"/><text x="68" y="890.08" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937">2</text>
<text x="108" y="872" font-size="34" font-weight="700" fill="#1F2937">再擺手臂</text>
<text x="108" y="914" font-size="26" fill="#4B5563">手和肩膀的線指向形狀</text>
<rect x="24" y="956" width="552" height="120" rx="22" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="68" cy="1016" r="24" fill="#2C5B8F"/><text x="68" y="1026.08" font-size="28" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
<text x="108" y="1008" font-size="34" font-weight="700" fill="#1F2937">臉最安靜</text>
<text x="108" y="1050" font-size="26" fill="#4B5563">場景越熱鬧，表情越穩</text>
<rect x="24" y="1100" width="552" height="160" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
<text x="300" y="1166" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937">場景越大，人越要穩；</text>
<text x="300" y="1216" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan fill="#8A5D00">姿勢是連起兩邊的那條線</tspan></text>
</svg>

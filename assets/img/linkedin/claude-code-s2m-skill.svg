<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E5A300;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5C53B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E5A300;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#F5C53B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E5A300;stop-opacity:0.6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Decorative grid lines -->
  <g opacity="0.06" stroke="#4fa6d5" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Left: slide icon (PPTX/PDF representation) -->
  <g transform="translate(620, 80)">
    <!-- Slide frame -->
    <rect width="220" height="165" rx="8" fill="#21262d" stroke="#30363d" stroke-width="2" />
    <!-- Slide content area -->
    <rect x="15" y="15" width="190" height="135" rx="4" fill="#0d1117" />
    <!-- Title bar in slide -->
    <rect x="25" y="28" width="120" height="10" rx="3" fill="#E5A300" opacity="0.7" />
    <!-- Bullet lines -->
    <rect x="25" y="52" width="160" height="6" rx="2" fill="#8b949e" opacity="0.4" />
    <rect x="25" y="66" width="140" height="6" rx="2" fill="#8b949e" opacity="0.3" />
    <rect x="25" y="80" width="150" height="6" rx="2" fill="#8b949e" opacity="0.35" />
    <!-- Chart placeholder -->
    <rect x="25" y="100" width="70" height="40" rx="3" fill="#4fa6d5" opacity="0.2" stroke="#4fa6d5" stroke-width="1" />
    <rect x="105" y="110" width="70" height="30" rx="3" fill="#3fb950" opacity="0.2" stroke="#3fb950" stroke-width="1" />
    <!-- PDF/PPTX label -->
    <rect x="140" y="-12" width="70" height="24" rx="4" fill="#E5A300" opacity="0.2" />
    <text x="175" y="5" font-family="monospace" font-size="11" fill="#F5C53B" text-anchor="middle" font-weight="bold">PPTX</text>
  </g>

  <!-- Arrow: slide → markdown -->
  <g transform="translate(620, 280)">
    <line x1="110" y1="0" x2="110" y2="50" stroke="url(#arrowGold)" stroke-width="3" />
    <polygon points="95,45 110,65 125,45" fill="#F5C53B" opacity="0.8" />
    <text x="145" y="40" font-family="monospace" font-size="13" fill="#F5C53B" opacity="0.8">/s2m</text>
  </g>

  <!-- Right: Markdown output panel -->
  <g transform="translate(590, 355)">
    <rect width="570" height="210" rx="12" fill="url(#termGrad)" stroke="#30363d" stroke-width="2" />
    <!-- Terminal title bar -->
    <rect width="570" height="40" rx="12" fill="#21262d" />
    <rect y="20" width="570" height="20" fill="#21262d" />
    <circle cx="30" cy="20" r="7" fill="#ff5f57" />
    <circle cx="55" cy="20" r="7" fill="#febc2e" />
    <circle cx="80" cy="20" r="7" fill="#28c840" />
    <text x="285" y="25" font-family="monospace" font-size="13" fill="#8b949e" text-anchor="middle">output_slides.md</text>
    <!-- Markdown content preview -->
    <text x="20" y="68" font-family="monospace" font-size="12" fill="#E5A300"># 簡報標題</text>
    <text x="20" y="90" font-family="monospace" font-size="11" fill="#8b949e">## 第 1 頁</text>
    <text x="20" y="110" font-family="monospace" font-size="11" fill="#4fa6d5">![第1頁](./slides/page_001.png)</text>
    <text x="20" y="130" font-family="monospace" font-size="11" fill="#8b949e">### 解讀</text>
    <text x="20" y="150" font-family="monospace" font-size="11" fill="#3fb950">```mermaid</text>
    <text x="20" y="168" font-family="monospace" font-size="11" fill="#c9d1d9">flowchart LR</text>
    <text x="20" y="186" font-family="monospace" font-size="11" fill="#c9d1d9">  A[輸入] --> B[處理] --> C[輸出]</text>
    <text x="20" y="200" font-family="monospace" font-size="11" fill="#3fb950">```</text>
  </g>

  <!-- Decorative sparkles -->
  <text x="570" y="120" font-size="22" fill="#E5A300" opacity="0.6">✦</text>
  <text x="850" y="95" font-size="14" fill="#4fa6d5" opacity="0.4">◆</text>
  <text x="555" y="380" font-size="16" fill="#F5C53B" opacity="0.5">✦</text>

  <!-- Left side content -->
  <!-- Label badge -->
  <rect x="50" y="108" width="200" height="36" rx="4" fill="url(#gold)" opacity="0.12" />
  <rect x="50" y="108" width="200" height="36" rx="4" fill="none" stroke="url(#gold)" stroke-width="1.5" />
  <text x="150" y="131" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F5C53B" text-anchor="middle" letter-spacing="2">CLAUDE CODE SKILL</text>

  <!-- Main title -->
  <text x="50" y="210" font-family="sans-serif" font-size="40" font-weight="bold" fill="#ffffff">一鍵把簡報</text>
  <text x="50" y="262" font-family="sans-serif" font-size="40" font-weight="bold" fill="#ffffff">變成文件</text>

  <!-- Subtitle -->
  <text x="50" y="310" font-family="sans-serif" font-size="22" fill="#c9d1d9">PPTX / PDF → Markdown</text>
  <text x="50" y="342" font-family="sans-serif" font-size="22" fill="#c9d1d9">逐頁截圖 + AI 解讀</text>

  <!-- Divider -->
  <rect x="50" y="368" width="490" height="2" fill="url(#gold)" opacity="0.4" />

  <!-- Tags -->
  <rect x="50" y="386" width="130" height="28" rx="14" fill="#4fa6d5" opacity="0.15" />
  <text x="115" y="404" font-family="sans-serif" font-size="12" fill="#4fa6d5" text-anchor="middle">Mermaid 圖表</text>

  <rect x="192" y="386" width="130" height="28" rx="14" fill="#E5A300" opacity="0.15" />
  <text x="257" y="404" font-family="sans-serif" font-size="12" fill="#E5A300" text-anchor="middle">平行處理</text>

  <rect x="334" y="386" width="130" height="28" rx="14" fill="#3fb950" opacity="0.15" />
  <text x="399" y="404" font-family="sans-serif" font-size="12" fill="#3fb950" text-anchor="middle">一句指令搞定</text>

  <!-- Feature list -->
  <text x="65" y="450" font-family="monospace" font-size="13" fill="#3fb950">✓</text>
  <text x="85" y="450" font-family="sans-serif" font-size="13" fill="#c9d1d9">高解析度逐頁截圖</text>
  <text x="65" y="476" font-family="monospace" font-size="13" fill="#3fb950">✓</text>
  <text x="85" y="476" font-family="sans-serif" font-size="13" fill="#c9d1d9">AI 視覺解讀每頁內容</text>
  <text x="65" y="502" font-family="monospace" font-size="13" fill="#3fb950">✓</text>
  <text x="85" y="502" font-family="sans-serif" font-size="13" fill="#c9d1d9">流程圖自動轉 Mermaid</text>
  <text x="65" y="528" font-family="monospace" font-size="13" fill="#3fb950">✓</text>
  <text x="85" y="528" font-family="sans-serif" font-size="13" fill="#c9d1d9">三層 Fallback 轉換策略</text>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#000000" opacity="0.3" />
  <text x="50" y="614" font-family="sans-serif" font-size="13" fill="#8b949e">Swanky Studio｜史旺基工作室</text>
  <text x="1150" y="614" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="end">2026</text>
</svg>

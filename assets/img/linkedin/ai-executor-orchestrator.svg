<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E5A300;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5C53B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="execGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#555;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#333;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="orchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E5A300;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#F5C53B;stop-opacity:0.05" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid -->
  <g opacity="0.05" stroke="#4fa6d5" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" /><line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" /><line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" /><line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" /><line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Right panel: comparison boxes -->
  <!-- Executor box (dimming) -->
  <rect x="570" y="70" width="280" height="490" rx="10" fill="url(#execGrad)" stroke="#555" stroke-width="1.5" />
  <text x="710" y="105" font-family="sans-serif" font-size="13" fill="#888" text-anchor="middle" letter-spacing="2">EXECUTOR</text>
  <line x1="590" y1="115" x2="830" y2="115" stroke="#444" stroke-width="1" />

  <text x="590" y="150" font-family="monospace" font-size="12" fill="#666">收到任務</text>
  <text x="710" y="148" font-family="monospace" font-size="16" fill="#555" text-anchor="middle">→</text>
  <text x="730" y="150" font-family="monospace" font-size="12" fill="#666">開始執行</text>

  <text x="590" y="185" font-family="monospace" font-size="12" fill="#666">完成交付</text>
  <text x="710" y="183" font-family="monospace" font-size="16" fill="#555" text-anchor="middle">→</text>
  <text x="730" y="185" font-family="monospace" font-size="12" fill="#666">等下一個</text>

  <rect x="590" y="205" width="230" height="1" fill="#444" />

  <text x="590" y="235" font-family="sans-serif" font-size="11" fill="#666">▸ 標準化、可重複任務</text>
  <text x="590" y="258" font-family="sans-serif" font-size="11" fill="#666">▸ 寫程式初版、整理文件</text>
  <text x="590" y="281" font-family="sans-serif" font-size="11" fill="#666">▸ 產出測試案例</text>

  <rect x="590" y="305" width="230" height="1" fill="#444" />

  <!-- AI replacing label -->
  <rect x="610" y="325" width="190" height="36" rx="6" fill="#ff5f57" fill-opacity="0.12" stroke="#ff5f57" stroke-width="1" stroke-opacity="0.5" />
  <text x="705" y="347" font-family="monospace" font-size="12" fill="#ff5f57" text-anchor="middle">AI 正在接手這一層</text>

  <text x="590" y="395" font-family="sans-serif" font-size="11" fill="#555">稀缺性↓</text>
  <text x="590" y="418" font-family="sans-serif" font-size="11" fill="#555">可替換性↑</text>

  <!-- Large X overlay -->
  <text x="710" y="510" font-family="sans-serif" font-size="72" fill="#ff5f57" text-anchor="middle" opacity="0.2" font-weight="bold">✕</text>

  <!-- Orchestrator box (glowing) -->
  <rect x="880" y="70" width="280" height="490" rx="10" fill="url(#orchGrad)" stroke="#E5A300" stroke-width="2" />
  <text x="1020" y="105" font-family="sans-serif" font-size="13" fill="#E5A300" text-anchor="middle" letter-spacing="2">ORCHESTRATOR</text>
  <line x1="900" y1="115" x2="1140" y2="115" stroke="#E5A300" stroke-width="1" opacity="0.4" />

  <text x="900" y="148" font-family="monospace" font-size="12" fill="#c9d1d9">定義問題</text>
  <text x="1020" y="146" font-family="monospace" font-size="16" fill="#E5A300" text-anchor="middle">→</text>
  <text x="1040" y="148" font-family="monospace" font-size="12" fill="#c9d1d9">拆解任務</text>

  <text x="900" y="178" font-family="monospace" font-size="12" fill="#c9d1d9">協調執行</text>
  <text x="1020" y="176" font-family="monospace" font-size="16" fill="#E5A300" text-anchor="middle">→</text>
  <text x="1040" y="178" font-family="monospace" font-size="12" fill="#c9d1d9">驗證結果</text>

  <rect x="900" y="198" width="240" height="1" fill="#E5A300" opacity="0.3" />

  <text x="900" y="228" font-family="sans-serif" font-size="11" fill="#c9d1d9">▸ 問題定義能力</text>
  <text x="900" y="251" font-family="sans-serif" font-size="11" fill="#c9d1d9">▸ 任務拆解與編排</text>
  <text x="900" y="274" font-family="sans-serif" font-size="11" fill="#c9d1d9">▸ 結果判斷與責任感</text>
  <text x="900" y="297" font-family="sans-serif" font-size="11" fill="#c9d1d9">▸ 跨域翻譯能力</text>

  <rect x="900" y="315" width="240" height="1" fill="#E5A300" opacity="0.3" />

  <!-- AI amplify label -->
  <rect x="920" y="330" width="200" height="36" rx="6" fill="#E5A300" fill-opacity="0.12" stroke="#E5A300" stroke-width="1" stroke-opacity="0.6" />
  <text x="1020" y="352" font-family="monospace" font-size="12" fill="#E5A300" text-anchor="middle">AI 放大這一層的價值</text>

  <text x="900" y="410" font-family="sans-serif" font-size="11" fill="#F5C53B">稀缺性↑</text>
  <text x="900" y="433" font-family="sans-serif" font-size="11" fill="#F5C53B">不可替換性↑</text>

  <!-- Checkmark -->
  <text x="1020" y="510" font-family="sans-serif" font-size="72" fill="#E5A300" text-anchor="middle" opacity="0.25" font-weight="bold">✓</text>

  <!-- Left side title -->
  <text x="55" y="115" font-size="26" fill="#E5A300" opacity="0.7">✦</text>
  <text x="490" y="180" font-size="16" fill="#F5C53B" opacity="0.5">✦</text>

  <!-- Label badge -->
  <rect x="50" y="140" width="210" height="36" rx="4" fill="none" stroke="url(#gold)" stroke-width="1.5" />
  <rect x="50" y="140" width="210" height="36" rx="4" fill="#E5A300" fill-opacity="0.08" />
  <text x="155" y="163" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F5C53B" text-anchor="middle" letter-spacing="2">AI 時代職場</text>

  <!-- Title -->
  <text x="50" y="240" font-family="sans-serif" font-size="40" font-weight="bold" fill="#ffffff">職場分水嶺</text>
  <text x="50" y="292" font-family="sans-serif" font-size="40" font-weight="bold" fill="#ffffff">已經不是</text>

  <!-- Old paradigm (crossed) -->
  <text x="50" y="346" font-family="sans-serif" font-size="28" fill="#666">Junior / Senior</text>
  <line x1="50" y1="338" x2="310" y2="338" stroke="#ff5f57" stroke-width="2.5" opacity="0.7" />

  <text x="50" y="380" font-family="sans-serif" font-size="20" fill="#c9d1d9">而是</text>

  <!-- New paradigm -->
  <text x="50" y="430" font-family="sans-serif" font-size="36" font-weight="bold" fill="#E5A300">Executor</text>
  <text x="50" y="432" font-family="sans-serif" font-size="20" fill="#c9d1d9" dx="230">vs</text>
  <text x="50" y="476" font-family="sans-serif" font-size="36" font-weight="bold" fill="#E5A300">Orchestrator</text>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#000000" opacity="0.3" />
  <text x="50" y="614" font-family="sans-serif" font-size="13" fill="#8b949e">Swanky Studio｜史旺基工作室</text>
  <text x="1150" y="614" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="end">2026</text>
</svg>

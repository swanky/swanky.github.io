<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="line1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E5A300;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#E5A300;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#E5A300;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="line2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F5C53B;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#F5C53B;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#F5C53B;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g opacity="0.08" stroke="#E5A300" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
    <line x1="213" y1="0" x2="213" y2="720"/>
    <line x1="426" y1="0" x2="426" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="853" y1="0" x2="853" y2="720"/>
    <line x1="1066" y1="0" x2="1066" y2="720"/>
  </g>

  <!-- Connection lines between nodes -->
  <g stroke="#E5A300" stroke-width="2" opacity="0.3" fill="none">
    <path d="M320,320 Q480,250 640,360"/>
    <path d="M640,360 Q800,250 960,320"/>
    <path d="M320,320 Q640,180 960,320"/>
  </g>
  <line x1="320" y1="320" x2="640" y2="360" stroke="url(#line1)" stroke-width="3"/>
  <line x1="640" y1="360" x2="960" y2="320" stroke="url(#line1)" stroke-width="3"/>
  <line x1="320" y1="320" x2="960" y2="320" stroke="url(#line2)" stroke-width="2" stroke-dasharray="8,6"/>

  <!-- Left node: Google A2A -->
  <circle cx="320" cy="320" r="70" fill="none" stroke="#E5A300" stroke-width="2.5" opacity="0.8"/>
  <circle cx="320" cy="320" r="55" fill="#1a1a2e" stroke="#E5A300" stroke-width="1" opacity="0.5"/>
  <text x="320" y="310" text-anchor="middle" fill="#E5A300" font-family="Arial, sans-serif" font-size="22" font-weight="bold">A2A</text>
  <text x="320" y="338" text-anchor="middle" fill="#aaa" font-family="Arial, sans-serif" font-size="13">Agent ↔ Agent</text>

  <!-- Center node: Integration -->
  <circle cx="640" cy="360" r="80" fill="none" stroke="#F5C53B" stroke-width="3" opacity="0.9"/>
  <circle cx="640" cy="360" r="62" fill="#16213e" stroke="#F5C53B" stroke-width="1.5" opacity="0.6"/>
  <text x="640" y="350" text-anchor="middle" fill="#F5C53B" font-family="Arial, sans-serif" font-size="20" font-weight="bold">AI Agent</text>
  <text x="640" y="378" text-anchor="middle" fill="#ccc" font-family="Arial, sans-serif" font-size="14">Orchestration</text>

  <!-- Right node: Anthropic MCP -->
  <circle cx="960" cy="320" r="70" fill="none" stroke="#E5A300" stroke-width="2.5" opacity="0.8"/>
  <circle cx="960" cy="320" r="55" fill="#1a1a2e" stroke="#E5A300" stroke-width="1" opacity="0.5"/>
  <text x="960" y="310" text-anchor="middle" fill="#E5A300" font-family="Arial, sans-serif" font-size="22" font-weight="bold">MCP</text>
  <text x="960" y="338" text-anchor="middle" fill="#aaa" font-family="Arial, sans-serif" font-size="13">Agent ↔ Tool</text>

  <!-- Small satellite nodes -->
  <circle cx="180" cy="220" r="20" fill="none" stroke="#E5A300" stroke-width="1" opacity="0.3"/>
  <circle cx="220" cy="450" r="15" fill="none" stroke="#F5C53B" stroke-width="1" opacity="0.25"/>
  <circle cx="1080" cy="210" r="18" fill="none" stroke="#E5A300" stroke-width="1" opacity="0.3"/>
  <circle cx="1100" cy="460" r="22" fill="none" stroke="#F5C53B" stroke-width="1" opacity="0.2"/>
  <circle cx="640" cy="180" r="16" fill="none" stroke="#E5A300" stroke-width="1" opacity="0.25"/>

  <!-- Satellite connection lines -->
  <line x1="180" y1="220" x2="280" y2="280" stroke="#E5A300" stroke-width="1" opacity="0.15"/>
  <line x1="220" y1="450" x2="290" y2="370" stroke="#F5C53B" stroke-width="1" opacity="0.15"/>
  <line x1="1080" y1="210" x2="1000" y2="270" stroke="#E5A300" stroke-width="1" opacity="0.15"/>
  <line x1="1100" y1="460" x2="1010" y2="375" stroke="#F5C53B" stroke-width="1" opacity="0.15"/>
  <line x1="640" y1="180" x2="640" y2="285" stroke="#E5A300" stroke-width="1" opacity="0.15"/>

  <!-- Title text -->
  <text x="640" y="560" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="bold" opacity="0.9">AI Agent 協作的未來</text>
  <text x="640" y="600" text-anchor="middle" fill="#E5A300" font-family="Arial, sans-serif" font-size="20" opacity="0.8">Google A2A × Anthropic MCP</text>

  <!-- Decorative dots -->
  <circle cx="100" cy="100" r="3" fill="#E5A300" opacity="0.3"/>
  <circle cx="1180" cy="650" r="3" fill="#E5A300" opacity="0.3"/>
  <circle cx="1200" cy="80" r="2" fill="#F5C53B" opacity="0.25"/>
  <circle cx="80" cy="640" r="2" fill="#F5C53B" opacity="0.25"/>
</svg>

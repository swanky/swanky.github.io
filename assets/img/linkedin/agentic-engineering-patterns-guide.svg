<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E5A300;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5C53B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Decorative grid lines -->
  <g opacity="0.06" stroke="#4fa6d5" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Right panel: the guide's structure -->
  <rect x="590" y="70" width="570" height="470" rx="12" ry="12" fill="url(#termGrad)" stroke="#30363d" stroke-width="2" />
  <rect x="590" y="70" width="570" height="40" rx="12" ry="12" fill="#21262d" />
  <rect x="590" y="90" width="570" height="20" fill="#21262d" />
  <circle cx="620" cy="90" r="7" fill="#ff5f57" />
  <circle cx="645" cy="90" r="7" fill="#febc2e" />
  <circle cx="670" cy="90" r="7" fill="#28c840" />
  <text x="875" y="95" font-family="monospace" font-size="13" fill="#8b949e" text-anchor="middle">simonwillison.net / guides</text>

  <!-- TOC header -->
  <text x="618" y="150" font-family="sans-serif" font-size="13" fill="#E5A300" font-weight="bold" letter-spacing="1">本指南六大主題</text>

  <!-- Six themes -->
  <text x="618" y="192" font-family="monospace" font-size="14" fill="#3fb950">▸</text>
  <text x="644" y="192" font-family="sans-serif" font-size="17" fill="#c9d1d9">原則 Principles</text>
  <text x="644" y="212" font-family="monospace" font-size="11" fill="#8b949e">寫程式變便宜了，好程式沒有</text>

  <text x="618" y="248" font-family="monospace" font-size="14" fill="#3fb950">▸</text>
  <text x="644" y="248" font-family="sans-serif" font-size="17" fill="#c9d1d9">與 coding agent 協作</text>
  <text x="644" y="268" font-family="monospace" font-size="11" fill="#8b949e">運作原理 · Git · 子代理</text>

  <text x="618" y="304" font-family="monospace" font-size="14" fill="#3fb950">▸</text>
  <text x="644" y="304" font-family="sans-serif" font-size="17" fill="#c9d1d9">測試與 QA</text>
  <text x="644" y="324" font-family="monospace" font-size="11" fill="#8b949e">紅綠 TDD · 先跑測試 · 代理式手測</text>

  <text x="618" y="360" font-family="monospace" font-size="14" fill="#3fb950">▸</text>
  <text x="644" y="360" font-family="sans-serif" font-size="17" fill="#c9d1d9">理解程式碼</text>
  <text x="644" y="380" font-family="monospace" font-size="11" fill="#8b949e">線性導覽 · 互動式解說</text>

  <text x="618" y="416" font-family="monospace" font-size="14" fill="#3fb950">▸</text>
  <text x="644" y="416" font-family="sans-serif" font-size="17" fill="#c9d1d9">Prompt 註解</text>
  <text x="644" y="436" font-family="monospace" font-size="11" fill="#8b949e">真實 prompt 逐句拆解</text>

  <text x="618" y="472" font-family="monospace" font-size="14" fill="#3fb950">▸</text>
  <text x="644" y="472" font-family="sans-serif" font-size="17" fill="#c9d1d9">附錄：常用 prompts</text>
  <text x="644" y="492" font-family="monospace" font-size="11" fill="#8b949e">把好提示詞沉澱成資產</text>

  <!-- Blinking cursor -->
  <rect x="644" y="514" width="10" height="16" fill="#58a6ff" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1s" repeatCount="indefinite" />
  </rect>
  <text x="618" y="526" font-family="monospace" font-size="13" fill="#8b949e">$ _</text>

  <!-- Left side decorative marks -->
  <text x="60" y="120" font-size="28" fill="#E5A300" opacity="0.7">&#10022;</text>
  <text x="500" y="195" font-size="18" fill="#F5C53B" opacity="0.5">&#10022;</text>
  <text x="90" y="520" font-size="14" fill="#4fa6d5" opacity="0.4">&#9670;</text>

  <!-- Label badge -->
  <rect x="50" y="150" width="240" height="36" rx="4" fill="url(#gold)" opacity="0.12" />
  <rect x="50" y="150" width="240" height="36" rx="4" fill="none" stroke="url(#gold)" stroke-width="1.5" />
  <text x="170" y="173" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F5C53B" text-anchor="middle" letter-spacing="2">AI 學習分享 · 導讀</text>

  <!-- Faint big mark -->
  <text x="48" y="300" font-family="sans-serif" font-size="120" font-weight="bold" fill="#ffffff" opacity="0.07">AEP</text>

  <!-- Main title -->
  <text x="150" y="252" font-family="sans-serif" font-size="44" font-weight="bold" fill="#ffffff">Agentic Engineering</text>
  <text x="150" y="304" font-family="sans-serif" font-size="34" font-weight="bold" fill="#F5C53B">Patterns 實戰指南導讀</text>
  <text x="150" y="346" font-family="sans-serif" font-size="22" fill="#c9d1d9">Simon Willison 的系統整理</text>
  <text x="150" y="378" font-family="sans-serif" font-size="22" fill="#c9d1d9">＋ 我帶團隊導入的對照</text>

  <!-- Divider -->
  <rect x="150" y="400" width="390" height="2" fill="url(#gold)" opacity="0.4" />

  <!-- Tags -->
  <rect x="50" y="418" width="110" height="28" rx="14" fill="#4fa6d5" opacity="0.15" />
  <text x="105" y="436" font-family="sans-serif" font-size="12" fill="#4fa6d5" text-anchor="middle">6 大主題</text>

  <rect x="172" y="418" width="110" height="28" rx="14" fill="#E5A300" opacity="0.15" />
  <text x="227" y="436" font-family="sans-serif" font-size="12" fill="#E5A300" text-anchor="middle">16 篇精華</text>

  <rect x="294" y="418" width="130" height="28" rx="14" fill="#3fb950" opacity="0.15" />
  <text x="359" y="436" font-family="sans-serif" font-size="12" fill="#3fb950" text-anchor="middle">導讀 + 實務對照</text>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#000000" opacity="0.3" />
  <text x="50" y="614" font-family="sans-serif" font-size="13" fill="#8b949e">Swanky Studio｜史旺基工作室</text>
  <text x="1150" y="614" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="end">2026</text>
</svg>

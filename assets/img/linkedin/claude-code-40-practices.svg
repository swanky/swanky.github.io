<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E5A300;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5C53B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Decorative grid lines -->
  <g opacity="0.06" stroke="#4fa6d5" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Right panel: terminal/checklist -->
  <rect x="590" y="70" width="570" height="470" rx="12" ry="12" fill="url(#termGrad)" stroke="#30363d" stroke-width="2" />
  <rect x="590" y="70" width="570" height="40" rx="12" ry="12" fill="#21262d" />
  <rect x="590" y="90" width="570" height="20" fill="#21262d" />
  <circle cx="620" cy="90" r="7" fill="#ff5f57" />
  <circle cx="645" cy="90" r="7" fill="#febc2e" />
  <circle cx="670" cy="90" r="7" fill="#28c840" />
  <text x="875" y="95" font-family="monospace" font-size="13" fill="#8b949e" text-anchor="middle">40 best practices</text>

  <!-- Checklist items -->
  <!-- Section 1 header -->
  <text x="618" y="138" font-family="sans-serif" font-size="12" fill="#E5A300" font-weight="bold">一、基礎設定</text>
  <text x="618" y="160" font-family="monospace" font-size="12" fill="#3fb950">✓</text>
  <text x="636" y="160" font-family="monospace" font-size="12" fill="#8b949e">alias cc='claude --dangerously-skip-permissions'</text>
  <text x="618" y="180" font-family="monospace" font-size="12" fill="#3fb950">✓</text>
  <text x="636" y="180" font-family="monospace" font-size="12" fill="#8b949e">/statusline  /config  remote-control</text>

  <!-- Section 2 header -->
  <text x="618" y="210" font-family="sans-serif" font-size="12" fill="#4fa6d5" font-weight="bold">二、工作流加速</text>
  <text x="618" y="232" font-family="monospace" font-size="12" fill="#3fb950">✓</text>
  <text x="636" y="232" font-family="monospace" font-size="12" fill="#8b949e">!git status  Esc+Esc  Ctrl+B  /btw</text>
  <text x="618" y="252" font-family="monospace" font-size="12" fill="#3fb950">✓</text>
  <text x="636" y="252" font-family="monospace" font-size="12" fill="#8b949e">Ctrl+G 先改計畫，再讓它做</text>

  <!-- Section 3 header -->
  <text x="618" y="282" font-family="sans-serif" font-size="12" fill="#e3b341" font-weight="bold">三、上下文管理</text>
  <text x="618" y="304" font-family="monospace" font-size="12" fill="#3fb950">✓</text>
  <text x="636" y="304" font-family="monospace" font-size="12" fill="#8b949e">/clear  Plan Mode  @src/file.ts</text>
  <text x="618" y="324" font-family="monospace" font-size="12" fill="#3fb950">✓</text>
  <text x="636" y="324" font-family="monospace" font-size="12" fill="#8b949e">/compact  ultrathink  貼原始 log</text>

  <!-- Section 4 header -->
  <text x="618" y="354" font-family="sans-serif" font-size="12" fill="#3fb950" font-weight="bold">四、自動化與驗證</text>
  <text x="618" y="376" font-family="monospace" font-size="12" fill="#3fb950">✓</text>
  <text x="636" y="376" font-family="monospace" font-size="12" fill="#8b949e">跑測試並修到通過再結束</text>
  <text x="618" y="396" font-family="monospace" font-size="12" fill="#3fb950">✓</text>
  <text x="636" y="396" font-family="monospace" font-size="12" fill="#8b949e">PostToolUse hook + /permissions allowlist</text>

  <!-- Section 5 header -->
  <text x="618" y="426" font-family="sans-serif" font-size="12" fill="#ff7b72" font-weight="bold">五、CLAUDE.md 管理</text>
  <text x="618" y="448" font-family="monospace" font-size="12" fill="#3fb950">✓</text>
  <text x="636" y="448" font-family="monospace" font-size="12" fill="#8b949e">/init → 砍掉一半 → 每次犯錯就更新</text>

  <!-- Section 6 header -->
  <text x="618" y="478" font-family="sans-serif" font-size="12" fill="#bc8cff" font-weight="bold">六、平行與多代理</text>
  <text x="618" y="500" font-family="monospace" font-size="12" fill="#3fb950">✓</text>
  <text x="636" y="500" font-family="monospace" font-size="12" fill="#8b949e">--worktree  subagents  agent teams</text>

  <!-- Blinking cursor -->
  <rect x="636" y="518" width="10" height="16" fill="#58a6ff" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1s" repeatCount="indefinite" />
  </rect>
  <text x="618" y="530" font-family="monospace" font-size="12" fill="#8b949e">$ _</text>

  <!-- Left side -->
  <text x="60" y="120" font-size="28" fill="#E5A300" opacity="0.7">✦</text>
  <text x="490" y="185" font-size="18" fill="#F5C53B" opacity="0.5">✦</text>
  <text x="90" y="510" font-size="14" fill="#4fa6d5" opacity="0.4">◆</text>

  <!-- Label badge -->
  <rect x="50" y="148" width="200" height="36" rx="4" fill="url(#gold)" opacity="0.12" />
  <rect x="50" y="148" width="200" height="36" rx="4" fill="none" stroke="url(#gold)" stroke-width="1.5" />
  <text x="150" y="171" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F5C53B" text-anchor="middle" letter-spacing="2">CLAUDE CODE</text>

  <!-- Big number 40 -->
  <text x="50" y="300" font-family="sans-serif" font-size="130" font-weight="bold" fill="#ffffff" opacity="0.08">40</text>

  <!-- Main title -->
  <text x="150" y="260" font-family="sans-serif" font-size="42" font-weight="bold" fill="#ffffff">40 個實戰技巧</text>
  <text x="150" y="310" font-family="sans-serif" font-size="24" fill="#c9d1d9">真正把 AI Coding 工具</text>
  <text x="150" y="348" font-family="sans-serif" font-size="24" fill="#c9d1d9">用到飛起來的方法</text>

  <!-- Divider -->
  <rect x="150" y="375" width="390" height="2" fill="url(#gold)" opacity="0.4" />

  <!-- Tags -->
  <rect x="50" y="393" width="110" height="28" rx="14" fill="#4fa6d5" opacity="0.15" />
  <text x="105" y="411" font-family="sans-serif" font-size="12" fill="#4fa6d5" text-anchor="middle">6 大主題</text>

  <rect x="172" y="393" width="110" height="28" rx="14" fill="#E5A300" opacity="0.15" />
  <text x="227" y="411" font-family="sans-serif" font-size="12" fill="#E5A300" text-anchor="middle">每週省 4–6 小時</text>

  <rect x="294" y="393" width="110" height="28" rx="14" fill="#3fb950" opacity="0.15" />
  <text x="349" y="411" font-family="sans-serif" font-size="12" fill="#3fb950" text-anchor="middle">立即可用</text>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#000000" opacity="0.3" />
  <text x="50" y="614" font-family="sans-serif" font-size="13" fill="#8b949e">Swanky Studio｜史旺基工作室</text>
  <text x="1150" y="614" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="end">2026</text>
</svg>

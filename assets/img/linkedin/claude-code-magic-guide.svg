<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E5A300;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5C53B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Decorative grid lines -->
  <g opacity="0.06" stroke="#4fa6d5" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Terminal window on right -->
  <rect x="580" y="80" width="580" height="420" rx="12" ry="12" fill="url(#termGrad)" stroke="#30363d" stroke-width="2" />

  <!-- Terminal title bar -->
  <rect x="580" y="80" width="580" height="40" rx="12" ry="12" fill="#21262d" />
  <rect x="580" y="100" width="580" height="20" fill="#21262d" />

  <!-- Terminal dots -->
  <circle cx="610" cy="100" r="7" fill="#ff5f57" />
  <circle cx="635" cy="100" r="7" fill="#febc2e" />
  <circle cx="660" cy="100" r="7" fill="#28c840" />

  <!-- Terminal title -->
  <text x="870" y="105" font-family="monospace" font-size="14" fill="#8b949e" text-anchor="middle">claude — terminal</text>

  <!-- Terminal content -->
  <text x="608" y="152" font-family="monospace" font-size="15" fill="#8b949e">$ </text>
  <text x="628" y="152" font-family="monospace" font-size="15" fill="#e6edf3">/model opusplan</text>

  <text x="608" y="178" font-family="monospace" font-size="14" fill="#3fb950">✓ </text>
  <text x="630" y="178" font-family="monospace" font-size="14" fill="#8b949e">混合動力模式已啟動</text>

  <text x="608" y="210" font-family="monospace" font-size="15" fill="#8b949e">$ </text>
  <text x="628" y="210" font-family="monospace" font-size="15" fill="#e6edf3">/simplify</text>

  <text x="608" y="236" font-family="monospace" font-size="14" fill="#3fb950">✓ </text>
  <text x="630" y="236" font-family="monospace" font-size="14" fill="#8b949e">3 agents reviewing code...</text>

  <text x="608" y="268" font-family="monospace" font-size="15" fill="#8b949e">$ </text>
  <text x="628" y="268" font-family="monospace" font-size="15" fill="#e6edf3">/btw</text>

  <text x="608" y="294" font-family="monospace" font-size="14" fill="#3fb950">✓ </text>
  <text x="630" y="294" font-family="monospace" font-size="14" fill="#8b949e">平行進程已開啟</text>

  <text x="608" y="326" font-family="monospace" font-size="15" fill="#8b949e">$ </text>
  <text x="628" y="326" font-family="monospace" font-size="15" fill="#e6edf3">/rewind</text>

  <text x="608" y="352" font-family="monospace" font-size="14" fill="#e3b341">↺ </text>
  <text x="630" y="352" font-family="monospace" font-size="14" fill="#8b949e">選擇回退模式...</text>

  <text x="608" y="384" font-family="monospace" font-size="15" fill="#8b949e">$ </text>
  <text x="628" y="384" font-family="monospace" font-size="15" fill="#e6edf3">/loop 5m 檢查部署狀態</text>

  <text x="608" y="410" font-family="monospace" font-size="14" fill="#3fb950">✓ </text>
  <text x="630" y="410" font-family="monospace" font-size="14" fill="#8b949e">自動循環已設定</text>

  <!-- Blinking cursor -->
  <rect x="628" y="438" width="10" height="18" fill="#58a6ff" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1s" repeatCount="indefinite" />
  </rect>
  <text x="608" y="452" font-family="monospace" font-size="15" fill="#8b949e">$ </text>

  <!-- Left side: Title area -->
  <!-- Magic sparkles -->
  <text x="60" y="130" font-size="32" fill="#E5A300" opacity="0.8">✦</text>
  <text x="480" y="200" font-size="20" fill="#F5C53B" opacity="0.6">✦</text>
  <text x="100" y="520" font-size="16" fill="#4fa6d5" opacity="0.5">◆</text>
  <text x="520" y="490" font-size="24" fill="#E5A300" opacity="0.4">✦</text>

  <!-- Main label -->
  <rect x="50" y="155" width="200" height="36" rx="4" fill="url(#gold)" opacity="0.15" />
  <rect x="50" y="155" width="200" height="36" rx="4" fill="none" stroke="url(#gold)" stroke-width="1.5" />
  <text x="150" y="178" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F5C53B" text-anchor="middle" letter-spacing="2">CLAUDE CODE</text>

  <!-- Main title -->
  <text x="150" y="255" font-family="sans-serif" font-size="44" font-weight="bold" fill="#ffffff">終端機魔法書</text>
  <text x="150" y="310" font-family="sans-serif" font-size="28" fill="#c9d1d9">初學者的</text>
  <text x="150" y="355" font-family="sans-serif" font-size="28" fill="#c9d1d9">開發加速指南</text>

  <!-- Divider -->
  <rect x="150" y="385" width="380" height="2" fill="url(#gold)" opacity="0.4" />

  <!-- Subtitle tags -->
  <rect x="50" y="405" width="120" height="30" rx="15" fill="#4fa6d5" opacity="0.15" />
  <text x="110" y="424" font-family="sans-serif" font-size="13" fill="#4fa6d5" text-anchor="middle">指令速查</text>

  <rect x="182" y="405" width="120" height="30" rx="15" fill="#E5A300" opacity="0.15" />
  <text x="242" y="424" font-family="sans-serif" font-size="13" fill="#E5A300" text-anchor="middle">效能優化</text>

  <rect x="314" y="405" width="120" height="30" rx="15" fill="#3fb950" opacity="0.15" />
  <text x="374" y="424" font-family="sans-serif" font-size="13" fill="#3fb950" text-anchor="middle">快捷鍵</text>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#000000" opacity="0.3" />
  <text x="50" y="614" font-family="sans-serif" font-size="13" fill="#8b949e">Swanky Studio｜史旺基工作室</text>
  <text x="1150" y="614" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="end">2026</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E5A300;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5C53B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pipeGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E5A300;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#E5A300;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#4fa6d5" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Terminal window (right) -->
  <rect x="575" y="65" width="590" height="500" rx="12" fill="url(#termGrad)" stroke="#30363d" stroke-width="2" />
  <rect x="575" y="65" width="590" height="40" rx="12" fill="#21262d" />
  <rect x="575" y="85" width="590" height="20" fill="#21262d" />
  <circle cx="606" cy="85" r="7" fill="#ff5f57" />
  <circle cx="631" cy="85" r="7" fill="#febc2e" />
  <circle cx="656" cy="85" r="7" fill="#28c840" />
  <text x="870" y="90" font-family="monospace" font-size="13" fill="#8b949e" text-anchor="middle">gstack workflow</text>

  <!-- Workflow pipeline in terminal -->
  <!-- Step 1: office-hours -->
  <text x="600" y="138" font-family="monospace" font-size="14" fill="#8b949e">$ </text>
  <text x="618" y="138" font-family="monospace" font-size="14" fill="#E5A300">/office-hours</text>
  <text x="618" y="158" font-family="monospace" font-size="13" fill="#3fb950">  ✓ </text>
  <text x="648" y="158" font-family="monospace" font-size="13" fill="#8b949e">問題框架確認，找出真正要解的事</text>
  <!-- Arrow -->
  <text x="660" y="182" font-family="monospace" font-size="13" fill="#E5A300" opacity="0.5">  ↓</text>

  <!-- Step 2: plan-eng-review -->
  <text x="600" y="206" font-family="monospace" font-size="14" fill="#8b949e">$ </text>
  <text x="618" y="206" font-family="monospace" font-size="14" fill="#E5A300">/plan-eng-review</text>
  <text x="618" y="226" font-family="monospace" font-size="13" fill="#3fb950">  ✓ </text>
  <text x="648" y="226" font-family="monospace" font-size="13" fill="#8b949e">架構骨架、邊界條件、test matrix</text>
  <text x="660" y="250" font-family="monospace" font-size="13" fill="#E5A300" opacity="0.5">  ↓</text>

  <!-- Step 3: implementation -->
  <text x="600" y="274" font-family="monospace" font-size="14" fill="#8b949e">$ </text>
  <text x="618" y="274" font-family="monospace" font-size="14" fill="#c9d1d9">實作中...</text>
  <text x="618" y="294" font-family="monospace" font-size="13" fill="#58a6ff">  → </text>
  <text x="648" y="294" font-family="monospace" font-size="13" fill="#8b949e">Claude Code 執行，範圍受控</text>
  <text x="660" y="318" font-family="monospace" font-size="13" fill="#E5A300" opacity="0.5">  ↓</text>

  <!-- Step 4: review -->
  <text x="600" y="342" font-family="monospace" font-size="14" fill="#8b949e">$ </text>
  <text x="618" y="342" font-family="monospace" font-size="14" fill="#E5A300">/review</text>
  <text x="618" y="362" font-family="monospace" font-size="13" fill="#3fb950">  ✓ </text>
  <text x="648" y="362" font-family="monospace" font-size="13" fill="#8b949e">PR 結構安全，無信任邊界問題</text>
  <text x="660" y="386" font-family="monospace" font-size="13" fill="#E5A300" opacity="0.5">  ↓</text>

  <!-- Step 5: qa -->
  <text x="600" y="410" font-family="monospace" font-size="14" fill="#8b949e">$ </text>
  <text x="618" y="410" font-family="monospace" font-size="14" fill="#E5A300">/qa</text>
  <text x="618" y="430" font-family="monospace" font-size="13" fill="#3fb950">  ✓ </text>
  <text x="648" y="430" font-family="monospace" font-size="13" fill="#8b949e">9/9 場景通過，regression tests 生成</text>
  <text x="660" y="454" font-family="monospace" font-size="13" fill="#E5A300" opacity="0.5">  ↓</text>

  <!-- Step 6: ship -->
  <text x="600" y="478" font-family="monospace" font-size="14" fill="#8b949e">$ </text>
  <text x="618" y="478" font-family="monospace" font-size="14" fill="#E5A300">/ship</text>
  <text x="618" y="498" font-family="monospace" font-size="14" fill="#3fb950">  🚀 </text>
  <text x="656" y="498" font-family="monospace" font-size="14" fill="#3fb950">出貨完成，文件已同步</text>

  <!-- Cursor -->
  <rect x="618" y="525" width="10" height="18" fill="#58a6ff" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0;0.85" dur="1s" repeatCount="indefinite" />
  </rect>
  <text x="600" y="539" font-family="monospace" font-size="14" fill="#8b949e">$ </text>

  <!-- Left side: Title -->
  <!-- Decorative sparkles -->
  <text x="55" y="125" font-size="28" fill="#E5A300" opacity="0.7">✦</text>
  <text x="490" y="195" font-size="18" fill="#F5C53B" opacity="0.5">✦</text>
  <text x="90" y="530" font-size="14" fill="#4fa6d5" opacity="0.4">◆</text>
  <text x="510" y="500" font-size="22" fill="#E5A300" opacity="0.35">✦</text>

  <!-- Label badge -->
  <rect x="50" y="148" width="230" height="36" rx="4" fill="url(#gold)" opacity="0.12" />
  <rect x="50" y="148" width="230" height="36" rx="4" fill="none" stroke="url(#gold)" stroke-width="1.5" />
  <text x="165" y="171" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F5C53B" text-anchor="middle" letter-spacing="2">CLAUDE CODE × GSTACK</text>

  <!-- Main title -->
  <text x="150" y="250" font-family="sans-serif" font-size="46" font-weight="bold" fill="#ffffff">把 AI 變成</text>
  <text x="150" y="308" font-family="sans-serif" font-size="46" font-weight="bold" fill="#ffffff">開發工作流</text>

  <!-- Divider -->
  <rect x="150" y="335" width="390" height="2" fill="url(#gold)" opacity="0.4" />

  <!-- Subtitle -->
  <text x="150" y="362" font-family="sans-serif" font-size="18" fill="#c9d1d9">從需求定義到出貨的完整 gstack 教學</text>

  <!-- Tag pills -->
  <rect x="50" y="390" width="110" height="30" rx="15" fill="#E5A300" opacity="0.15" />
  <text x="105" y="409" font-family="sans-serif" font-size="13" fill="#E5A300" text-anchor="middle">/office-hours</text>

  <rect x="172" y="390" width="80" height="30" rx="15" fill="#4fa6d5" opacity="0.15" />
  <text x="212" y="409" font-family="sans-serif" font-size="13" fill="#4fa6d5" text-anchor="middle">/review</text>

  <rect x="264" y="390" width="60" height="30" rx="15" fill="#3fb950" opacity="0.15" />
  <text x="294" y="409" font-family="sans-serif" font-size="13" fill="#3fb950" text-anchor="middle">/qa</text>

  <rect x="336" y="390" width="70" height="30" rx="15" fill="#E5A300" opacity="0.15" />
  <text x="371" y="409" font-family="sans-serif" font-size="13" fill="#E5A300" text-anchor="middle">/ship</text>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#000000" opacity="0.3" />
  <text x="50" y="614" font-family="sans-serif" font-size="13" fill="#8b949e">Swanky Studio｜史旺基工作室</text>
  <text x="1150" y="614" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="end">2026</text>
</svg>

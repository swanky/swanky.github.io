<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <rect width="760" height="372" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Agent 能力 -->
  <rect x="24" y="178" width="156" height="64" rx="6" fill="#EFF6FF" stroke="#2C5B8F" stroke-width="1.4"/>
  <text x="102" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F2937">Agent 能力</text>
  <text x="102" y="221" text-anchor="middle" font-size="9.5" fill="#4B5563">讀檔・改檔・上網</text>
  <text x="102" y="235" text-anchor="middle" font-size="9.5" fill="#4B5563">寄信・呼叫 API</text>
  <line x1="180" y1="210" x2="226" y2="210" stroke="#374151" stroke-width="1.3" marker-end="url(#ar)"/>

  <!-- 風險研判 菱形 -->
  <polygon points="302,158 376,210 302,262 228,210" fill="#FFF7ED" stroke="#B45309" stroke-width="1.4"/>
  <text x="302" y="205" text-anchor="middle" font-size="13" fill="#1F2937">風險等級</text>
  <text x="302" y="222" text-anchor="middle" font-size="13" fill="#1F2937">研判</text>

  <!-- 主幹與分支 -->
  <path d="M376,210 L430,210" fill="none" stroke="#374151" stroke-width="1.3"/>
  <path d="M430,50 L430,314" fill="none" stroke="#374151" stroke-width="1.3"/>
  <line x1="430" y1="50" x2="470" y2="50" stroke="#374151" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="430" y1="138" x2="470" y2="138" stroke="#374151" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="430" y1="226" x2="470" y2="226" stroke="#374151" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="430" y1="314" x2="470" y2="314" stroke="#374151" stroke-width="1.3" marker-end="url(#ar)"/>

  <!-- Low -->
  <rect x="470" y="18" width="266" height="64" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.3"/>
  <rect x="470" y="20" width="6" height="60" fill="#16A34A"/>
  <text x="494" y="44" text-anchor="start" font-size="14" font-weight="bold" fill="#166534">低風險</text>
  <text x="494" y="64" text-anchor="start" font-size="12" fill="#1F2937">允許自動執行</text>
  <rect x="648" y="37" width="76" height="26" rx="13" fill="#16A34A"/>
  <text x="686" y="54" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Low</text>

  <!-- Medium -->
  <rect x="470" y="106" width="266" height="64" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
  <rect x="470" y="108" width="6" height="60" fill="#2563EB"/>
  <text x="494" y="132" text-anchor="start" font-size="14" font-weight="bold" fill="#1E40AF">中風險</text>
  <text x="494" y="152" text-anchor="start" font-size="12" fill="#1F2937">需人工審閱</text>
  <rect x="648" y="125" width="76" height="26" rx="13" fill="#2563EB"/>
  <text x="686" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Medium</text>

  <!-- High -->
  <rect x="470" y="194" width="266" height="64" rx="6" fill="#FFFBEB" stroke="#B45309" stroke-width="1.3"/>
  <rect x="470" y="196" width="6" height="60" fill="#B45309"/>
  <text x="494" y="220" text-anchor="start" font-size="14" font-weight="bold" fill="#92400E">高風險</text>
  <text x="494" y="240" text-anchor="start" font-size="12" fill="#1F2937">僅限人工核准</text>
  <rect x="648" y="213" width="76" height="26" rx="13" fill="#B45309"/>
  <text x="686" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">High</text>

  <!-- Critical -->
  <rect x="470" y="282" width="266" height="64" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/>
  <rect x="470" y="284" width="6" height="60" fill="#DC2626"/>
  <text x="494" y="308" text-anchor="start" font-size="14" font-weight="bold" fill="#991B1B">極高風險</text>
  <text x="494" y="328" text-anchor="start" font-size="12" fill="#1F2937">不自動化</text>
  <rect x="648" y="301" width="76" height="26" rx="13" fill="#DC2626"/>
  <text x="686" y="318" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Critical</text>
</svg>

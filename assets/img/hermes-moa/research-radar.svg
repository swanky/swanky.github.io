<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 548" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <rect width="720" height="548" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Cron 每日觸發 -->
  <rect x="280" y="18" width="160" height="48" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.4"/>
  <text x="360" y="39" text-anchor="middle" font-size="15" fill="#1F2937">Cron 每日觸發</text>
  <text x="360" y="56" text-anchor="middle" font-size="10" fill="#64748B">排程自主觸發</text>
  <line x1="360" y1="66" x2="360" y2="90" stroke="#374151" stroke-width="1.3" marker-end="url(#ar)"/>

  <!-- 三路 Scout 容器 -->
  <rect x="40" y="92" width="640" height="96" rx="8" fill="#F7FAFF" stroke="#2C5B8F" stroke-width="1.2"/>
  <rect x="40" y="92" width="640" height="24" rx="8" fill="#2C5B8F"/>
  <text x="360" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">三路 Scout（平行蒐集）</text>
  <rect x="64" y="128" width="178" height="48" rx="5" fill="#ffffff" stroke="#2C5B8F" stroke-width="1.2"/>
  <text x="153" y="148" text-anchor="middle" font-size="13" fill="#1F2937">News Scout</text>
  <text x="153" y="165" text-anchor="middle" font-size="9.5" fill="#4B5563">新框架與新聞</text>
  <rect x="271" y="128" width="178" height="48" rx="5" fill="#ffffff" stroke="#2C5B8F" stroke-width="1.2"/>
  <text x="360" y="148" text-anchor="middle" font-size="13" fill="#1F2937">Paper Scout</text>
  <text x="360" y="165" text-anchor="middle" font-size="9.5" fill="#4B5563">MoA／multi-agent 論文</text>
  <rect x="478" y="128" width="178" height="48" rx="5" fill="#ffffff" stroke="#2C5B8F" stroke-width="1.2"/>
  <text x="567" y="148" text-anchor="middle" font-size="13" fill="#1F2937">GitHub Scout</text>
  <text x="567" y="165" text-anchor="middle" font-size="9.5" fill="#4B5563">熱門 agent repo</text>
  <line x1="360" y1="188" x2="360" y2="212" stroke="#374151" stroke-width="1.3" marker-end="url(#ar)"/>

  <!-- 研究摘要 -->
  <rect x="268" y="214" width="184" height="48" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="1.3"/>
  <text x="360" y="235" text-anchor="middle" font-size="14" fill="#1F2937">研究摘要</text>
  <text x="360" y="252" text-anchor="middle" font-size="10" fill="#64748B">彙整每日發現</text>
  <line x1="360" y1="262" x2="360" y2="286" stroke="#374151" stroke-width="1.3" marker-end="url(#ar)"/>

  <!-- Skeptic 反方檢查 -->
  <rect x="258" y="288" width="204" height="48" rx="6" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.3"/>
  <text x="360" y="309" text-anchor="middle" font-size="14" fill="#1F2937">Skeptic 反方檢查</text>
  <text x="360" y="326" text-anchor="middle" font-size="10" fill="#7F1D1D">挑錯 · 找風險</text>
  <line x1="360" y1="336" x2="360" y2="360" stroke="#374151" stroke-width="1.3" marker-end="url(#ar)"/>

  <!-- MoA Aggregator（品牌金強調） -->
  <rect x="248" y="362" width="224" height="56" rx="8" fill="#FFF8E7" stroke="#E5A300" stroke-width="2.2"/>
  <text x="360" y="387" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1F2937">MoA Aggregator 整合</text>
  <text x="360" y="405" text-anchor="middle" font-size="10.5" fill="#7C5A00">多觀點取捨 · 形成定稿</text>
  <line x1="360" y1="418" x2="360" y2="442" stroke="#374151" stroke-width="1.3" marker-end="url(#ar)"/>

  <!-- 多通道輸出 容器 -->
  <rect x="40" y="444" width="640" height="92" rx="8" fill="#F0FDF4" stroke="#0E7568" stroke-width="1.2"/>
  <rect x="40" y="444" width="640" height="24" rx="8" fill="#0E7568"/>
  <text x="360" y="460" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">多通道輸出</text>
  <rect x="64" y="480" width="178" height="46" rx="5" fill="#ffffff" stroke="#0E7568" stroke-width="1.2"/>
  <text x="153" y="508" text-anchor="middle" font-size="13" fill="#1F2937">網站長文草稿</text>
  <rect x="271" y="480" width="178" height="46" rx="5" fill="#ffffff" stroke="#0E7568" stroke-width="1.2"/>
  <text x="360" y="508" text-anchor="middle" font-size="13" fill="#1F2937">LinkedIn 觀點文</text>
  <rect x="478" y="480" width="178" height="46" rx="5" fill="#ffffff" stroke="#0E7568" stroke-width="1.2"/>
  <text x="567" y="508" text-anchor="middle" font-size="13" fill="#1F2937">X Thread</text>
</svg>

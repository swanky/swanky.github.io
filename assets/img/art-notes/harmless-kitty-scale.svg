<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">原作比你記憶中大：150 × 140 公分</title>
  <desc id="d">以同一比例尺畫出《Harmless Kitty》原作尺寸（高 150 公分、寬 140 公分）與一位假設身高 170 公分的觀者。畫框只用色塊表示尺寸，不重畫作品；懸掛高度是示意，不是真實展場。</desc>
  <rect width="1200" height="720" fill="#FFFFFF"/>
  <text x="48" y="78" font-size="48" font-weight="700" fill="#1F2937">它比你記憶中的大</text>
  <text x="48" y="122" font-size="26" fill="#4B5563">同一把尺：原作 150 × 140 公分，旁邊站一位 170 公分的大人</text>
  <!-- 地面 -->
  <line x1="60" y1="660" x2="1140" y2="660" stroke="#CDC1B1" stroke-width="3"/>
  <!-- 人形（通用人體剪影，比例 2.4 px／公分） -->
  <g transform="translate(300 252) scale(1.2) translate(-241 -140)" fill="#B8AB98">
    <circle cx="241" cy="166" r="26"/>
    <path d="M220 198Q241 188 262 198L278 290Q283 309 272 313Q261 317 257 299L248 250L256 324L270 466Q271 480 258 480Q247 480 246 466L234 355L225 466Q224 480 211 480Q199 480 201 464L215 324L221 251L209 304Q206 318 195 314Q187 311 191 295L207 218Q211 203 220 198Z"/>
  </g>
  <path d="M180 252V660M168 252H192M168 660H192" stroke="#64748B" stroke-width="3" fill="none"/>
  <text x="150" y="456" transform="rotate(-90 150 456)" text-anchor="middle" font-size="26" fill="#4B5563">假設身高 170 公分</text>
  <!-- 畫作：色塊代表畫布範圍 -->
  <rect x="552" y="148" width="352" height="376" rx="4" fill="#E7DDD0"/>
  <rect x="560" y="156" width="336" height="360" fill="#F4F1E9" stroke="#D9CFC2" stroke-width="2"/>
  <text x="728" y="326" text-anchor="middle" font-size="34" font-weight="700" fill="#8A5D00">原作畫布</text>
  <text x="728" y="370" text-anchor="middle" font-size="26" fill="#4B5563">（色塊示意）</text>
  <!-- 尺寸線 -->
  <path d="M940 156V516M928 156H952M928 516H952" stroke="#B45309" stroke-width="3" fill="none"/>
  <text x="980" y="336" transform="rotate(-90 980 336)" text-anchor="middle" font-size="28" font-weight="700" fill="#B45309">高 150 公分</text>
  <path d="M560 560H896M560 548V572M896 548V572" stroke="#B45309" stroke-width="3" fill="none"/>
  <text x="728" y="604" text-anchor="middle" font-size="28" font-weight="700" fill="#B45309">寬 140 公分</text>
  <!-- 重點帶 -->
  <rect x="48" y="676" width="1104" height="38" rx="12" fill="#FFF8E7"/>
  <text x="600" y="703" text-anchor="middle" font-size="22" fill="#1F2937">人與畫的比例照官方尺寸；<tspan fill="#8A5D00" font-weight="700">掛多高只是示意</tspan>，不是哪一次展覽的實景</text>
</svg>

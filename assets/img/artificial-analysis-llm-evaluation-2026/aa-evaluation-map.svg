<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">2026 LLM 評估地圖</title><desc id="desc">公開評估由人類偏好、綜合能力、專項能力與營運品質逐層收斂，最後以私有業務評估決定模型、推理強度、Provider、Harness 與 Routing。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071224"/><stop offset="1" stop-color="#141c38"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#62d7ff"/></marker></defs>
<rect width="1200" height="820" rx="28" fill="url(#bg)"/>
<text x="58" y="68" fill="#f8fafc" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="38" font-weight="800">2026 LLM 評估地圖：越接近部署，越需要自己的資料</text>
<text x="58" y="106" fill="#9fb0cc" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="22">公開 Benchmark 負責縮小候選，私有 Eval 負責決定分工</text>
<path d="M600 216V250M600 342V376M600 468V502M600 594V628" stroke="#62d7ff" stroke-width="5" marker-end="url(#a)"/>
<g font-family="Noto Sans TC,Microsoft JhengHei,sans-serif">
<rect x="90" y="142" width="1020" height="74" rx="18" fill="#0c3442" stroke="#22d3ee"/><text x="118" y="174" fill="#67e8f9" font-size="22" font-weight="800">第一層｜人類偏好</text><text x="352" y="174" fill="#fff" font-size="20">LMArena・產品體驗測試</text><text x="352" y="201" fill="#a9bbd0" font-size="17">回答是否好讀、自然、符合使用者偏好</text>
<rect x="150" y="268" width="900" height="74" rx="18" fill="#142d55" stroke="#60a5fa"/><text x="178" y="300" fill="#bfdbfe" font-size="22" font-weight="800">第二層｜綜合能力</text><text x="430" y="300" fill="#fff" font-size="20">Artificial Analysis・HLE・GPQA</text><text x="430" y="327" fill="#a9bbd0" font-size="17">把數百個模型縮小成可測試候選</text>
<rect x="210" y="394" width="780" height="74" rx="18" fill="#2e1854" stroke="#a78bfa"/><text x="238" y="426" fill="#d8b4fe" font-size="22" font-weight="800">第三層｜專項能力</text><text x="488" y="426" fill="#fff" font-size="20">Coding・Agent・Domain・Multimodal</text><text x="488" y="453" fill="#a9bbd0" font-size="17">模型是否適合你的工作類型</text>
<rect x="270" y="520" width="660" height="74" rx="18" fill="#473714" stroke="#fbbf24"/><text x="298" y="552" fill="#fde68a" font-size="22" font-weight="800">第四層｜營運品質</text><text x="542" y="552" fill="#fff" font-size="20">Latency・Cost・Error・Rate Limit</text><text x="542" y="579" fill="#d6cdb4" font-size="17">模型能不能進入生產環境</text>
<rect x="330" y="646" width="540" height="74" rx="18" fill="#123a30" stroke="#34d399"/><text x="358" y="678" fill="#a7f3d0" font-size="22" font-weight="800">第五層｜私有業務評估</text><text x="625" y="678" fill="#fff" font-size="20">成功・風險・人工・ROI</text><text x="625" y="705" fill="#b8d8cd" font-size="17">真實任務是否能穩定交付</text>
<rect x="210" y="748" width="780" height="52" rx="16" fill="#164e63" stroke="#67e8f9" stroke-width="2"/><text x="600" y="781" text-anchor="middle" fill="#fff" font-size="23" font-weight="900">部署決策：Model + Effort + Provider + Harness + Routing</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E5A300;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5C53B;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <g opacity="0.05" stroke="#4fa6d5" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157" /><line x1="0" y1="315" x2="1200" y2="315" /><line x1="0" y1="472" x2="1200" y2="472" />
    <line x1="300" y1="0" x2="300" y2="630" /><line x1="600" y1="0" x2="600" y2="630" /><line x1="900" y1="0" x2="900" y2="630" />
  </g>
  <!-- central AI brain + distributed GPU nodes -->
  <g transform="translate(880,300)">
    <g stroke="#4fa6d5" stroke-width="1.2" opacity="0.45">
      <line x1="0" y1="0" x2="-120" y2="-80" /><line x1="0" y1="0" x2="125" y2="-60" />
      <line x1="0" y1="0" x2="-100" y2="95" /><line x1="0" y1="0" x2="110" y2="95" />
    </g>
    <!-- GPU node chips -->
    <g fill="#4fa6d5" fill-opacity="0.15" stroke="#4fa6d5" stroke-width="1.5">
      <rect x="-148" y="-100" width="40" height="40" rx="6" /><rect x="105" y="-80" width="40" height="40" rx="6" /><rect x="-120" y="75" width="40" height="40" rx="6" /><rect x="90" y="75" width="40" height="40" rx="6" />
    </g>
    <g stroke="#4fa6d5" stroke-width="1" opacity="0.6">
      <line x1="-148" y1="-90" x2="-158" y2="-90" /><line x1="-148" y1="-70" x2="-158" y2="-70" />
      <line x1="-108" y1="-90" x2="-98" y2="-90" /><line x1="-108" y1="-70" x2="-98" y2="-70" />
    </g>
    <!-- AI core -->
    <circle r="46" fill="#E5A300" fill-opacity="0.18" stroke="url(#gold)" stroke-width="2.5" />
    <text x="0" y="8" font-family="sans-serif" font-size="30" font-weight="bold" fill="#F5C53B" text-anchor="middle">AI</text>
  </g>
  <rect x="50" y="70" width="200" height="34" rx="17" fill="none" stroke="#4fa6d5" stroke-width="1.5" />
  <text x="150" y="92" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4fa6d5" text-anchor="middle" letter-spacing="2">Web3 入門精選</text>
  <text x="50" y="205" font-family="sans-serif" font-size="54" font-weight="bold" fill="#ffffff">AI × 加密</text>
  <rect x="50" y="227" width="420" height="3" fill="url(#gold)" opacity="0.6" />
  <text x="50" y="283" font-family="sans-serif" font-size="24" fill="#c9d1d9">去中心化算力網路</text>
  <text x="50" y="320" font-family="sans-serif" font-size="20" fill="#8b949e">會是下一個風口嗎？</text>
  <rect x="0" y="590" width="1200" height="40" fill="#000000" opacity="0.3" />
  <text x="50" y="615" font-family="sans-serif" font-size="13" fill="#8b949e">Swanky Studio｜史旺基工作室</text>
  <text x="1150" y="615" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="end">2026</text>
</svg>

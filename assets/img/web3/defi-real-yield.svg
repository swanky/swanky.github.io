<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E5A300;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5C53B;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <g opacity="0.05" stroke="#4fa6d5" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157" /><line x1="0" y1="315" x2="1200" y2="315" /><line x1="0" y1="472" x2="1200" y2="472" />
    <line x1="300" y1="0" x2="300" y2="630" /><line x1="600" y1="0" x2="600" y2="630" /><line x1="900" y1="0" x2="900" y2="630" />
  </g>
  <!-- real yield coin vs deflating -->
  <g transform="translate(880,300)">
    <!-- real coin (gold, solid up) -->
    <circle cx="-50" cy="0" r="62" fill="#E5A300" fill-opacity="0.2" stroke="url(#gold)" stroke-width="3" />
    <text x="-50" y="14" font-family="sans-serif" font-size="40" font-weight="bold" fill="#F5C53B" text-anchor="middle">$</text>
    <path d="M -50 -90 l -16 22 h 10 v 14 h 12 v -14 h 10 z" fill="#F5C53B" />
    <!-- inflation balloon (dashed, deflating) -->
    <circle cx="95" cy="20" r="44" fill="none" stroke="#4fa6d5" stroke-width="2" stroke-dasharray="5 6" opacity="0.7" />
    <text x="95" y="32" font-family="sans-serif" font-size="26" fill="#4fa6d5" text-anchor="middle" opacity="0.8">%</text>
    <path d="M 95 80 l 0 36" stroke="#4fa6d5" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />
    <path d="M 95 118 l -10 -14 h 20 z" fill="#4fa6d5" opacity="0.6" />
  </g>
  <rect x="50" y="70" width="200" height="34" rx="17" fill="none" stroke="#4fa6d5" stroke-width="1.5" />
  <text x="150" y="92" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4fa6d5" text-anchor="middle" letter-spacing="2">Web3 入門精選</text>
  <text x="150" y="205" font-family="sans-serif" font-size="50" font-weight="bold" fill="#ffffff">DeFi 真實收益</text>
  <rect x="150" y="227" width="320" height="3" fill="url(#gold)" opacity="0.6" />
  <text x="150" y="283" font-family="sans-serif" font-size="24" fill="#c9d1d9">vs 代幣通膨陷阱</text>
  <text x="150" y="322" font-family="sans-serif" font-size="20" fill="#8b949e">「年化 100%」是真的嗎？</text>
  <rect x="0" y="590" width="1200" height="40" fill="#000000" opacity="0.3" />
  <text x="50" y="615" font-family="sans-serif" font-size="13" fill="#8b949e">Swanky Studio｜史旺基工作室</text>
  <text x="1150" y="615" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="end">2026</text>
</svg>

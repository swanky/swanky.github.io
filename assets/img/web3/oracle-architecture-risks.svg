<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E5A300;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5C53B;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <g opacity="0.05" stroke="#4fa6d5" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157" /><line x1="0" y1="315" x2="1200" y2="315" /><line x1="0" y1="472" x2="1200" y2="472" />
    <line x1="300" y1="0" x2="300" y2="630" /><line x1="600" y1="0" x2="600" y2="630" /><line x1="900" y1="0" x2="900" y2="630" />
  </g>
  <!-- offchain data feeding into onchain block -->
  <g transform="translate(870,300)" font-family="sans-serif" font-size="13" text-anchor="middle">
    <!-- offchain sources -->
    <g fill="#4fa6d5" fill-opacity="0.15" stroke="#4fa6d5" stroke-width="1.3">
      <rect x="-180" y="-110" width="86" height="40" rx="8" /><rect x="-180" y="-20" width="86" height="40" rx="8" /><rect x="-180" y="70" width="86" height="40" rx="8" />
    </g>
    <g fill="#7cc4ec"><text x="-137" y="-85">價格</text><text x="-137" y="5">匯率</text><text x="-137" y="95">事件</text></g>
    <!-- oracle aggregator -->
    <circle cx="0" cy="0" r="46" fill="#4fa6d5" fill-opacity="0.2" stroke="#4fa6d5" stroke-width="2" />
    <text x="0" y="-2" font-family="sans-serif" font-size="14" fill="#a8d8f5" font-weight="bold">預言機</text>
    <text x="0" y="18" font-family="sans-serif" font-size="11" fill="#7cc4ec">Oracle</text>
    <g stroke="#4fa6d5" stroke-width="1.3" opacity="0.6">
      <line x1="-94" y1="-90" x2="-40" y2="-18" /><line x1="-94" y1="0" x2="-46" y2="0" /><line x1="-94" y1="90" x2="-40" y2="18" />
    </g>
    <!-- onchain block -->
    <line x1="46" y1="0" x2="96" y2="0" stroke="url(#gold)" stroke-width="2" />
    <path d="M 96 0 l -12 -8 v 16 z" fill="#E5A300" />
    <rect x="106" y="-46" width="92" height="92" rx="12" fill="#E5A300" fill-opacity="0.15" stroke="url(#gold)" stroke-width="2.5" />
    <text x="152" y="-2" font-family="sans-serif" font-size="13" fill="#F5C53B" font-weight="bold">智能</text>
    <text x="152" y="18" font-family="sans-serif" font-size="13" fill="#F5C53B" font-weight="bold">合約</text>
  </g>
  <rect x="50" y="70" width="200" height="34" rx="17" fill="none" stroke="#4fa6d5" stroke-width="1.5" />
  <text x="150" y="92" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4fa6d5" text-anchor="middle" letter-spacing="2">Web3 入門精選</text>
  <text x="150" y="225" font-family="sans-serif" font-size="58" font-weight="bold" fill="#ffffff">預言機 Oracle</text>
  <rect x="150" y="247" width="320" height="3" fill="url(#gold)" opacity="0.6" />
  <text x="150" y="303" font-family="sans-serif" font-size="22" fill="#c9d1d9">鏈外資料如何安全進鏈</text>
  <text x="150" y="339" font-family="sans-serif" font-size="20" fill="#8b949e">智能合約的眼睛與耳朵</text>
  <rect x="0" y="590" width="1200" height="40" fill="#000000" opacity="0.3" />
  <text x="50" y="615" font-family="sans-serif" font-size="13" fill="#8b949e">Swanky Studio｜史旺基工作室</text>
  <text x="1150" y="615" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="end">2026</text>
</svg>

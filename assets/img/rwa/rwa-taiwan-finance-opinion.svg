<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E5A300;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5C53B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="clone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8c8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7fb0e8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <g opacity="0.05" stroke="#7fb0e8" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157" /><line x1="0" y1="315" x2="1200" y2="315" /><line x1="0" y1="472" x2="1200" y2="472" />
    <line x1="300" y1="0" x2="300" y2="630" /><line x1="600" y1="0" x2="600" y2="630" /><line x1="900" y1="0" x2="900" y2="630" />
  </g>

  <!-- Right: Taiwan outline + up-chain arrow -->
  <g transform="translate(880,315)">
    <circle r="150" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="3 5" />
    <!-- stylized Taiwan island (sweet-potato shape) -->
    <path d="M 10 -130
             C 40 -120 48 -80 44 -40
             C 40 0 30 50 6 95
             C -8 122 -30 132 -42 120
             C -52 108 -44 78 -40 50
             C -36 18 -46 -10 -34 -50
             C -24 -90 -20 -122 10 -130 Z"
          fill="url(#clone)" fill-opacity="0.18" stroke="url(#clone)" stroke-width="2.5" />
    <!-- on-chain blocks rising arrow -->
    <g opacity="0.9">
      <rect x="-10" y="40" width="22" height="22" rx="4" fill="#E5A300" fill-opacity="0.85" />
      <rect x="-10" y="6" width="22" height="22" rx="4" fill="#F5C53B" fill-opacity="0.85" />
      <rect x="-10" y="-28" width="22" height="22" rx="4" fill="#F5C53B" fill-opacity="0.95" />
      <path d="M 1 -66 l -16 22 h 10 v 16 h 12 v -16 h 10 z" fill="#E5A300" />
    </g>
  </g>

  <!-- Series badge -->
  <rect x="50" y="70" width="220" height="34" rx="17" fill="none" stroke="url(#clone)" stroke-width="1.5" />
  <text x="160" y="92" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a8c8ff" text-anchor="middle" letter-spacing="2">RWA 代幣化系列</text>

  <!-- observation badge -->
  <rect x="280" y="70" width="80" height="34" rx="17" fill="#E5A300" opacity="0.15" />
  <text x="320" y="92" font-family="sans-serif" font-size="13" font-weight="bold" fill="#E5A300" text-anchor="middle" letter-spacing="2">觀點</text>

  <!-- Title -->
  <text x="50" y="200" font-family="sans-serif" font-size="52" font-weight="bold" fill="#ffffff">當資產開始上鏈</text>
  <rect x="50" y="222" width="430" height="3" fill="url(#gold)" opacity="0.6" />
  <text x="50" y="278" font-family="sans-serif" font-size="24" fill="#c9d1d9">RWA 對台灣金融業</text>
  <text x="50" y="314" font-family="sans-serif" font-size="24" fill="#c9d1d9">的真實意義</text>

  <!-- pills -->
  <g font-family="sans-serif" font-size="13" text-anchor="middle">
    <rect x="50" y="370" width="92" height="30" rx="15" fill="#7fb0e8" opacity="0.15" /><text x="96" y="390" fill="#7fb0e8">DvP 結算</text>
    <rect x="152" y="370" width="92" height="30" rx="15" fill="#E5A300" opacity="0.15" /><text x="198" y="390" fill="#E5A300">時間窗口</text>
    <rect x="254" y="370" width="108" height="30" rx="15" fill="#7fb0e8" opacity="0.15" /><text x="308" y="390" fill="#7fb0e8">CSD 主導</text>
  </g>

  <rect x="0" y="590" width="1200" height="40" fill="#000000" opacity="0.3" />
  <text x="50" y="615" font-family="sans-serif" font-size="13" fill="#8b949e">Swanky Studio｜史旺基工作室</text>
  <text x="1150" y="615" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="end">2026</text>
</svg>

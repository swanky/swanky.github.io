<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E5A300;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5C53B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="clone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8c8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7fb0e8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <g opacity="0.05" stroke="#7fb0e8" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157" /><line x1="0" y1="315" x2="1200" y2="315" /><line x1="0" y1="472" x2="1200" y2="472" />
    <line x1="300" y1="0" x2="300" y2="630" /><line x1="600" y1="0" x2="600" y2="630" /><line x1="900" y1="0" x2="900" y2="630" />
  </g>

  <!-- Right: two-column compare -->
  <g transform="translate(680,150)">
    <!-- simple -->
    <rect x="0" y="0" width="180" height="330" rx="12" fill="#7fb0e8" fill-opacity="0.08" stroke="#7fb0e8" stroke-width="1.5" />
    <text x="90" y="36" font-family="monospace" font-size="17" font-weight="bold" fill="#a8c8ff" text-anchor="middle">ERC-1404</text>
    <text x="90" y="60" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">簡化派</text>
    <line x1="20" y1="78" x2="160" y2="78" stroke="#30363d" />
    <g font-family="sans-serif" font-size="13" fill="#c9d1d9" text-anchor="middle">
      <text x="90" y="115">2 個函數</text>
      <text x="90" y="155">介面標準</text>
      <text x="90" y="195">彈性極大</text>
      <text x="90" y="235">規則自理</text>
    </g>
    <text x="90" y="300" font-family="monospace" font-size="30" fill="#7fb0e8" text-anchor="middle" opacity="0.6">{ }</text>

    <text x="225" y="180" font-family="sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">vs</text>

    <!-- framework -->
    <rect x="270" y="0" width="180" height="330" rx="12" fill="#E5A300" fill-opacity="0.08" stroke="#E5A300" stroke-width="1.5" />
    <text x="360" y="36" font-family="monospace" font-size="17" font-weight="bold" fill="#F5C53B" text-anchor="middle">ERC-3643</text>
    <text x="360" y="60" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">整合派</text>
    <line x1="290" y1="78" x2="430" y2="78" stroke="#30363d" />
    <g font-family="sans-serif" font-size="13" fill="#c9d1d9" text-anchor="middle">
      <text x="360" y="115">6 個合約</text>
      <text x="360" y="155">完整框架</text>
      <text x="360" y="195">鏈上身分</text>
      <text x="360" y="235">強制合規</text>
    </g>
    <g transform="translate(330,270)" opacity="0.6">
      <rect x="0" y="0" width="60" height="10" rx="2" fill="#E5A300" /><rect x="0" y="14" width="60" height="10" rx="2" fill="#E5A300" /><rect x="0" y="28" width="60" height="10" rx="2" fill="#E5A300" />
    </g>
  </g>

  <rect x="50" y="70" width="220" height="34" rx="17" fill="none" stroke="url(#clone)" stroke-width="1.5" />
  <text x="160" y="92" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a8c8ff" text-anchor="middle" letter-spacing="2">RWA 代幣化系列</text>

  <text x="50" y="195" font-family="sans-serif" font-size="46" font-weight="bold" fill="#ffffff">合規型代幣標準</text>
  <rect x="50" y="218" width="400" height="3" fill="url(#gold)" opacity="0.6" />
  <text x="50" y="272" font-family="sans-serif" font-size="22" fill="#c9d1d9">ERC-3643 與 ERC-1404</text>
  <text x="50" y="304" font-family="sans-serif" font-size="22" fill="#c9d1d9">的設計哲學</text>

  <g font-family="monospace" font-size="13" text-anchor="middle">
    <rect x="50" y="360" width="84" height="32" rx="6" fill="#7fb0e8" opacity="0.13" /><text x="92" y="381" fill="#7fb0e8">CMTAT</text>
    <rect x="144" y="360" width="110" height="32" rx="6" fill="#E5A300" opacity="0.13" /><text x="199" y="381" fill="#E5A300">RuleEngine</text>
    <rect x="264" y="360" width="96" height="32" rx="6" fill="#7fb0e8" opacity="0.13" /><text x="312" y="381" fill="#7fb0e8">ERC-7943</text>
  </g>

  <rect x="0" y="590" width="1200" height="40" fill="#000000" opacity="0.3" />
  <text x="50" y="615" font-family="sans-serif" font-size="13" fill="#8b949e">Swanky Studio｜史旺基工作室</text>
  <text x="1150" y="615" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="end">2026</text>
</svg>

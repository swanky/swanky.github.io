<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E5A300;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5C53B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="clone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8c8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7fb0e8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <g opacity="0.05" stroke="#7fb0e8" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157" /><line x1="0" y1="315" x2="1200" y2="315" /><line x1="0" y1="472" x2="1200" y2="472" />
    <line x1="300" y1="0" x2="300" y2="630" /><line x1="600" y1="0" x2="600" y2="630" /><line x1="900" y1="0" x2="900" y2="630" />
  </g>

  <!-- Right: global nodes network -->
  <g transform="translate(870,300)">
    <circle r="160" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="3 5" />
    <circle r="105" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="2 6" opacity="0.6" />
    <!-- connection lines -->
    <g stroke="url(#clone)" stroke-width="1.2" opacity="0.5">
      <line x1="0" y1="-120" x2="118" y2="40" />
      <line x1="118" y1="40" x2="-30" y2="130" />
      <line x1="-30" y1="130" x2="-120" y2="-30" />
      <line x1="-120" y1="-30" x2="0" y2="-120" />
      <line x1="0" y1="-120" x2="-30" y2="130" />
      <line x1="118" y1="40" x2="-120" y2="-30" />
    </g>
    <!-- nodes -->
    <g font-family="sans-serif" font-size="12" text-anchor="middle" fill="#c9d1d9">
      <circle cx="0" cy="-120" r="24" fill="#7fb0e8" fill-opacity="0.15" stroke="#7fb0e8" stroke-width="1.5" /><text x="0" y="-116">新加坡</text>
      <circle cx="118" cy="40" r="24" fill="#7fb0e8" fill-opacity="0.15" stroke="#7fb0e8" stroke-width="1.5" /><text x="118" y="44">香港</text>
      <circle cx="-30" cy="130" r="24" fill="#E5A300" fill-opacity="0.15" stroke="#E5A300" stroke-width="1.5" /><text x="-30" y="134" fill="#E5A300">台灣</text>
      <circle cx="-120" cy="-30" r="24" fill="#7fb0e8" fill-opacity="0.15" stroke="#7fb0e8" stroke-width="1.5" /><text x="-120" y="-26">美國</text>
      <circle cx="40" cy="-30" r="20" fill="#7fb0e8" fill-opacity="0.10" stroke="#7fb0e8" stroke-width="1" /><text x="40" y="-26" font-size="11">歐盟</text>
    </g>
  </g>

  <!-- Series badge -->
  <rect x="50" y="70" width="220" height="34" rx="17" fill="none" stroke="url(#clone)" stroke-width="1.5" />
  <text x="160" y="92" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a8c8ff" text-anchor="middle" letter-spacing="2">RWA 代幣化系列</text>

  <!-- Title -->
  <text x="50" y="200" font-family="sans-serif" font-size="54" font-weight="bold" fill="#ffffff">全球 RWA</text>
  <text x="50" y="262" font-family="sans-serif" font-size="54" font-weight="bold" fill="#ffffff">監管地圖</text>
  <rect x="50" y="284" width="430" height="3" fill="url(#gold)" opacity="0.6" />
  <text x="50" y="330" font-family="sans-serif" font-size="22" fill="#c9d1d9">從新加坡、香港到美國 DTC</text>

  <!-- pills -->
  <g font-family="sans-serif" font-size="13" text-anchor="middle">
    <rect x="50" y="378" width="108" height="30" rx="15" fill="#7fb0e8" opacity="0.15" /><text x="104" y="398" fill="#7fb0e8">Guardian</text>
    <rect x="168" y="378" width="108" height="30" rx="15" fill="#7fb0e8" opacity="0.15" /><text x="222" y="398" fill="#7fb0e8">Ensemble</text>
    <rect x="286" y="378" width="78" height="30" rx="15" fill="#E5A300" opacity="0.15" /><text x="325" y="398" fill="#E5A300">DORA</text>
  </g>

  <rect x="0" y="590" width="1200" height="40" fill="#000000" opacity="0.3" />
  <text x="50" y="615" font-family="sans-serif" font-size="13" fill="#8b949e">Swanky Studio｜史旺基工作室</text>
  <text x="1150" y="615" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="end">2026</text>
</svg>

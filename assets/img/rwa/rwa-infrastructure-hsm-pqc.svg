<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E5A300;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5C53B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="clone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8c8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7fb0e8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <g opacity="0.05" stroke="#7fb0e8" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157" /><line x1="0" y1="315" x2="1200" y2="315" /><line x1="0" y1="472" x2="1200" y2="472" />
    <line x1="300" y1="0" x2="300" y2="630" /><line x1="600" y1="0" x2="600" y2="630" /><line x1="900" y1="0" x2="900" y2="630" />
  </g>

  <!-- Right: HSM safe + quantum shield -->
  <g transform="translate(870,300)">
    <!-- quantum orbit shield -->
    <g opacity="0.6" fill="none" stroke="url(#clone)" stroke-width="1.5">
      <ellipse rx="155" ry="60" transform="rotate(0)" />
      <ellipse rx="155" ry="60" transform="rotate(60)" />
      <ellipse rx="155" ry="60" transform="rotate(120)" />
    </g>
    <circle r="9" fill="#a8c8ff" cx="155" cy="0" />
    <circle r="9" fill="#a8c8ff" cx="-77" cy="134" />
    <circle r="9" fill="#a8c8ff" cx="-77" cy="-134" />
    <!-- HSM safe (lock) -->
    <rect x="-62" y="-52" width="124" height="124" rx="14" fill="#E5A300" fill-opacity="0.12" stroke="url(#gold)" stroke-width="2.5" />
    <path d="M -26 -10 v -16 a 26 26 0 0 1 52 0 v 16" fill="none" stroke="#F5C53B" stroke-width="6" stroke-linecap="round" />
    <rect x="-34" y="-10" width="68" height="56" rx="8" fill="#F5C53B" fill-opacity="0.85" />
    <circle r="8" cy="12" fill="#0a1628" />
    <rect x="-3" y="12" width="6" height="20" rx="3" fill="#0a1628" />
  </g>

  <!-- Series badge -->
  <rect x="50" y="70" width="220" height="34" rx="17" fill="none" stroke="url(#clone)" stroke-width="1.5" />
  <text x="160" y="92" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a8c8ff" text-anchor="middle" letter-spacing="2">RWA 代幣化系列</text>

  <!-- Title -->
  <text x="50" y="200" font-family="sans-serif" font-size="54" font-weight="bold" fill="#ffffff">RWA 的隱形基建</text>
  <rect x="50" y="222" width="430" height="3" fill="url(#gold)" opacity="0.6" />
  <text x="50" y="278" font-family="sans-serif" font-size="24" fill="#c9d1d9">HSM 硬體保管</text>
  <text x="50" y="314" font-family="sans-serif" font-size="24" fill="#c9d1d9">與後量子密碼學</text>

  <!-- pills -->
  <g font-family="sans-serif" font-size="13" text-anchor="middle">
    <rect x="50" y="370" width="78" height="30" rx="15" fill="#E5A300" opacity="0.15" /><text x="89" y="390" fill="#E5A300">HSM</text>
    <rect x="138" y="370" width="78" height="30" rx="15" fill="#7fb0e8" opacity="0.15" /><text x="177" y="390" fill="#7fb0e8">PQC</text>
    <rect x="226" y="370" width="120" height="30" rx="15" fill="#7fb0e8" opacity="0.15" /><text x="286" y="390" fill="#7fb0e8">FIPS 140-3</text>
  </g>

  <rect x="0" y="590" width="1200" height="40" fill="#000000" opacity="0.3" />
  <text x="50" y="615" font-family="sans-serif" font-size="13" fill="#8b949e">Swanky Studio｜史旺基工作室</text>
  <text x="1150" y="615" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="end">2026</text>
</svg>

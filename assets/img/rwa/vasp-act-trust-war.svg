<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E5A300;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5C53B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <g opacity="0.05" stroke="#4fa6d5" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157" /><line x1="0" y1="315" x2="1200" y2="315" /><line x1="0" y1="472" x2="1200" y2="472" />
    <line x1="300" y1="0" x2="300" y2="630" /><line x1="600" y1="0" x2="600" y2="630" /><line x1="900" y1="0" x2="900" y2="630" />
  </g>

  <!-- Right: shield of trust amid exchange node network -->
  <g transform="translate(870,300)">
    <circle r="160" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="3 5" />
    <circle r="105" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="2 6" opacity="0.6" />

    <!-- scattered exchange nodes converging toward the shield -->
    <g stroke="#4fa6d5" stroke-width="1" opacity="0.3">
      <line x1="-190" y1="-95" x2="-46" y2="-38" /><line x1="185" y1="-100" x2="46" y2="-38" />
      <line x1="-175" y1="115" x2="-46" y2="20" /><line x1="180" y1="120" x2="46" y2="20" />
    </g>
    <g fill="#4fa6d5" fill-opacity="0.5">
      <circle cx="-190" cy="-95" r="4" /><circle cx="185" cy="-100" r="4" />
      <circle cx="-175" cy="115" r="4" /><circle cx="180" cy="120" r="4" />
    </g>

    <!-- shield -->
    <circle r="62" fill="#E5A300" fill-opacity="0.12" />
    <path d="M 0,-55 L 45,-37 L 45,9 Q 45,50 0,72 Q -45,50 -45,9 L -45,-37 Z" fill="url(#gold)" fill-opacity="0.15" stroke="url(#gold)" stroke-width="2.5" />
    <path d="M -19,6 L -6,21 L 23,-14" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- five regulatory spokes -->
    <g font-family="sans-serif" font-size="13" text-anchor="middle">
      <line x1="0" y1="-72" x2="0" y2="-130" stroke="#E5A300" stroke-opacity="0.5" />
      <circle cx="0" cy="-150" r="26" fill="#E5A300" fill-opacity="0.12" stroke="#E5A300" stroke-width="1" /><text x="0" y="-146" fill="#F5C53B">許可</text>

      <line x1="42" y1="-40" x2="120" y2="-46" stroke="#7fb0e8" stroke-opacity="0.5" />
      <circle cx="143" cy="-55" r="26" fill="#7fb0e8" fill-opacity="0.12" stroke="#7fb0e8" stroke-width="1" /><text x="143" y="-51" fill="#c9d1d9">隔離</text>

      <line x1="42" y1="38" x2="120" y2="46" stroke="#E5A300" stroke-opacity="0.5" />
      <circle cx="143" cy="55" r="26" fill="#E5A300" fill-opacity="0.12" stroke="#E5A300" stroke-width="1" /><text x="143" y="59" fill="#F5C53B">穩定幣</text>

      <line x1="-42" y1="38" x2="-120" y2="46" stroke="#7fb0e8" stroke-opacity="0.5" />
      <circle cx="-143" cy="55" r="26" fill="#7fb0e8" fill-opacity="0.12" stroke="#7fb0e8" stroke-width="1" /><text x="-143" y="59" fill="#c9d1d9">內控</text>

      <line x1="-42" y1="-40" x2="-120" y2="-46" stroke="#7fb0e8" stroke-opacity="0.5" />
      <circle cx="-143" cy="-55" r="26" fill="#7fb0e8" fill-opacity="0.12" stroke="#7fb0e8" stroke-width="1" /><text x="-143" y="-51" fill="#c9d1d9">監控</text>
    </g>
  </g>

  <!-- Series badge -->
  <rect x="50" y="70" width="200" height="34" rx="17" fill="none" stroke="url(#gold)" stroke-width="1.5" />
  <text x="150" y="92" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F5C53B" text-anchor="middle" letter-spacing="2">監理動態</text>

  <!-- Title -->
  <text x="150" y="205" font-family="sans-serif" font-size="52" font-weight="bold" fill="#ffffff">VASP 三讀通過</text>
  <rect x="150" y="227" width="360" height="3" fill="url(#gold)" opacity="0.6" />
  <text x="150" y="270" font-family="sans-serif" font-size="26" font-weight="bold" fill="#F5C53B">信任戰爭的開端</text>
  <text x="150" y="310" font-family="sans-serif" font-size="20" fill="#c9d1d9">交易所競爭，從流量戰走向合規與信任</text>

  <!-- pills -->
  <g font-family="sans-serif" font-size="13" text-anchor="middle">
    <rect x="150" y="360" width="92" height="30" rx="15" fill="#E5A300" opacity="0.15" /><text x="196" y="380" fill="#E5A300">許可制</text>
    <rect x="252" y="360" width="102" height="30" rx="15" fill="#7fb0e8" opacity="0.15" /><text x="303" y="380" fill="#7fb0e8">資產保管</text>
    <rect x="364" y="360" width="112" height="30" rx="15" fill="#E5A300" opacity="0.15" /><text x="420" y="380" fill="#E5A300">穩定幣合規</text>
  </g>

  <rect x="0" y="590" width="1200" height="40" fill="#000000" opacity="0.3" />
  <text x="50" y="615" font-family="sans-serif" font-size="13" fill="#8b949e">Swanky Studio｜史旺基工作室</text>
  <text x="1150" y="615" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="end">2026</text>
</svg>

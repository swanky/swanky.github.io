<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E5A300;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5C53B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="clone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8c8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7fb0e8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <g opacity="0.05" stroke="#7fb0e8" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157" /><line x1="0" y1="315" x2="1200" y2="315" /><line x1="0" y1="472" x2="1200" y2="472" />
    <line x1="300" y1="0" x2="300" y2="630" /><line x1="600" y1="0" x2="600" y2="630" /><line x1="900" y1="0" x2="900" y2="630" />
  </g>

  <!-- Right: vertical timeline -->
  <g transform="translate(760,0)">
    <line x1="60" y1="90" x2="60" y2="540" stroke="#30363d" stroke-width="2" />
    <g font-family="sans-serif" font-size="15">
      <circle cx="60" cy="120" r="9" fill="#8b949e" /><text x="90" y="118" fill="#c9d1d9" font-weight="bold">2014</text><text x="90" y="140" fill="#8b949e" font-size="13">Colored Coins</text>
      <circle cx="60" cy="220" r="9" fill="#7fb0e8" /><text x="90" y="218" fill="#a8c8ff" font-weight="bold">2018</text><text x="90" y="240" fill="#8b949e" font-size="13">三條路線爆發</text>
      <circle cx="60" cy="320" r="9" fill="#7fb0e8" /><text x="90" y="318" fill="#a8c8ff" font-weight="bold">2022</text><text x="90" y="340" fill="#8b949e" font-size="13">UBS 數位債券</text>
      <circle cx="60" cy="420" r="11" fill="#E5A300" /><text x="95" y="418" fill="#F5C53B" font-weight="bold">2024</text><text x="95" y="440" fill="#8b949e" font-size="13">ERC-3643 Final</text>
      <circle cx="60" cy="510" r="11" fill="#E5A300" /><text x="95" y="508" fill="#F5C53B" font-weight="bold">2026</text><text x="95" y="528" fill="#8b949e" font-size="13">DTC / Nasdaq 上線</text>
    </g>
  </g>

  <rect x="50" y="70" width="220" height="34" rx="17" fill="none" stroke="url(#clone)" stroke-width="1.5" />
  <text x="160" y="92" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a8c8ff" text-anchor="middle" letter-spacing="2">RWA 代幣化系列</text>

  <text x="50" y="195" font-family="sans-serif" font-size="50" font-weight="bold" fill="#ffffff">標準演進史</text>
  <rect x="50" y="218" width="380" height="3" fill="url(#gold)" opacity="0.6" />
  <text x="50" y="270" font-family="sans-serif" font-size="22" fill="#c9d1d9">從 Colored Coins</text>
  <text x="50" y="302" font-family="sans-serif" font-size="22" fill="#c9d1d9">到 ERC-3643 的十二年</text>

  <g font-family="monospace" font-size="14" text-anchor="middle">
    <rect x="50" y="360" width="110" height="32" rx="6" fill="#E5A300" opacity="0.13" /><text x="105" y="381" fill="#E5A300">ERC-3643</text>
    <rect x="172" y="360" width="92" height="32" rx="6" fill="#7fb0e8" opacity="0.13" /><text x="218" y="381" fill="#7fb0e8">CMTAT</text>
    <rect x="276" y="360" width="104" height="32" rx="6" fill="#7fb0e8" opacity="0.13" /><text x="328" y="381" fill="#7fb0e8">ERC-1400</text>
  </g>

  <rect x="0" y="590" width="1200" height="40" fill="#000000" opacity="0.3" />
  <text x="50" y="615" font-family="sans-serif" font-size="13" fill="#8b949e">Swanky Studio｜史旺基工作室</text>
  <text x="1150" y="615" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="end">2026</text>
</svg>

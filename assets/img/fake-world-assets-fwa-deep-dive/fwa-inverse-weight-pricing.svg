<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">FWA 倒數權重與調和平均定價</title>
  <desc id="desc">作者以 0.05、0.5、5 ETH 三個部位做簡化試算。擔保金倒數形成 20、2、0.2 的相對權重，抽中機率約為 90.09%、9.01%、0.90%。調和平均擔保金約 0.135 ETH，加上預設 10% surcharge 後約為 0.149 ETH。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071224"/><stop offset="1" stop-color="#1b1430"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#263655" stroke-width="1" opacity=".34"/></pattern>
    <marker id="arrow" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0L11 4.5L0 9Z" fill="#7dd3fc"/></marker>
    <style>.t{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#f8fafc}.h{font-size:34px;font-weight:800}.sub{font-size:18px;fill:#a9b8cc}.bh{font-size:23px;font-weight:800}.body{font-size:17px;fill:#d6deeb}.small{font-size:15px;fill:#9fb0c8}.num{font-size:30px;font-weight:900}.line{fill:none;stroke:#7dd3fc;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/><rect width="1200" height="720" rx="28" fill="url(#grid)"/>
  <text class="t h" x="54" y="62">低擔保部位決定大多數人的抽卡價格</text>
  <text class="t sub" x="54" y="98">倒數權重讓高擔保頭獎非常醒目，卻很少被抽中，也很少拉高整體票價</text>

  <g>
    <rect x="54" y="142" width="280" height="264" rx="22" fill="#0b3942" stroke="#22d3ee" stroke-width="2"/>
    <text class="t bh" x="194" y="182" text-anchor="middle">低擔保部位</text>
    <circle cx="194" cy="238" r="42" fill="#0e7490"/><text class="t num" x="194" y="248" text-anchor="middle">0.05</text>
    <text class="t small" x="194" y="300" text-anchor="middle">ETH backing</text>
    <text class="t body" x="82" y="338">倒數權重：20</text>
    <text class="t bh" x="82" y="378" fill="#67e8f9">抽中機率 90.09%</text>
  </g>
  <g>
    <rect x="372" y="142" width="280" height="264" rx="22" fill="#2b284b" stroke="#818cf8" stroke-width="2"/>
    <text class="t bh" x="512" y="182" text-anchor="middle">中擔保部位</text>
    <circle cx="512" cy="238" r="42" fill="#4338ca"/><text class="t num" x="512" y="248" text-anchor="middle">0.5</text>
    <text class="t small" x="512" y="300" text-anchor="middle">ETH backing</text>
    <text class="t body" x="400" y="338">倒數權重：2</text>
    <text class="t bh" x="400" y="378" fill="#c4b5fd">抽中機率 9.01%</text>
  </g>
  <g>
    <rect x="690" y="142" width="280" height="264" rx="22" fill="#493012" stroke="#fbbf24" stroke-width="2"/>
    <text class="t bh" x="830" y="182" text-anchor="middle">高擔保頭獎</text>
    <circle cx="830" cy="238" r="42" fill="#a16207"/><text class="t num" x="830" y="248" text-anchor="middle">5</text>
    <text class="t small" x="830" y="300" text-anchor="middle">ETH backing</text>
    <text class="t body" x="718" y="338">倒數權重：0.2</text>
    <text class="t bh" x="718" y="378" fill="#fde68a">抽中機率 0.90%</text>
  </g>

  <g>
    <rect x="1002" y="142" width="144" height="264" rx="22" fill="#311d3e" stroke="#c084fc" stroke-width="2"/>
    <text class="t bh" x="1074" y="186" text-anchor="middle">公式</text>
    <text class="t body" x="1074" y="232" text-anchor="middle">pᵢ =</text>
    <text class="t bh" x="1074" y="266" text-anchor="middle">1／Bᵢ</text>
    <line x1="1028" y1="278" x2="1120" y2="278" stroke="#c4b5fd" stroke-width="2"/>
    <text class="t body" x="1074" y="310" text-anchor="middle">Σ 1／B</text>
    <text class="t small" x="1074" y="356" text-anchor="middle">B = 擔保金</text>
    <text class="t small" x="1074" y="382" text-anchor="middle">K 會相消</text>
  </g>

  <path class="line" d="M194 410V452"/><path class="line" d="M512 410V452"/><path class="line" d="M830 410V452"/><path class="line" d="M1074 410V452"/>

  <rect x="54" y="466" width="1092" height="172" rx="22" fill="#111d35" stroke="#475569"/>
  <g class="t">
    <text class="bh" x="92" y="508">定價試算</text>
    <text class="body" x="92" y="548">調和平均 = 3 ÷（1／0.05 ＋ 1／0.5 ＋ 1／5）</text>
    <text class="num" x="92" y="594" fill="#67e8f9">≈ 0.135 ETH</text>
    <text class="bh" x="510" y="568">× 預設 1.10 surcharge</text>
    <text class="num" x="844" y="594" fill="#fde68a">≈ 0.149 ETH</text>
  </g>
  <rect x="54" y="654" width="1092" height="42" rx="12" fill="#291b2d" stroke="#6b355f"/>
  <text class="t small" x="600" y="681" text-anchor="middle">作者簡化試算｜非即時池資料；未含 VRF 服務費、Gas、滑價與池子變動｜參數截點：2026-07-25</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 影片彩排成本與重抽規則</title>
  <desc id="desc">總成本 64.11 美元，其中 REROLL 卡通與擬真各 27.80 美元。預算控制靠生成前估價、每鏡最多兩次，以及第三次生成必須由人工明示核准。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
    <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.eyebrow{font-size:18px;fill:#176bff;font-weight:800;letter-spacing:3px}.title{font-size:40px;fill:#07111f;font-weight:900}.sub{font-size:20px;fill:#475569}.amount{font-size:68px;fill:#07111f;font-weight:900}.label{font-size:18px;fill:#334155;font-weight:700}.bar{font-size:17px;fill:#07111f;font-weight:800}.small{font-size:16px;fill:#64748b}.step{font-size:21px;fill:#fff;font-weight:900}.step-sub{font-size:16px;fill:#dbeafe}.gate{font-size:17px;fill:#713f12;font-weight:900}</style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="70" y="72" class="eyebrow">COST &amp; ROLL DISCIPLINE</text>
  <text x="70" y="124" class="title">US$64.11 花在哪裡？</text>
  <text x="70" y="162" class="sub">作者依本次 OpenRouter 生成任務與費用紀錄彙總；金額為實付。</text>

  <text x="70" y="270" class="amount">64.11</text><text x="70" y="304" class="label">美元｜6 天彩排總計</text>
  <rect x="355" y="218" width="765" height="78" rx="16" fill="#dbeafe"/>
  <rect x="355" y="218" width="416" height="78" rx="16" fill="#176bff"/>
  <rect x="771" y="218" width="332" height="78" fill="#e5a300"/>
  <rect x="1103" y="218" width="17" height="78" rx="0 16 16 0" fill="#38bdf8"/>
  <text x="563" y="265" text-anchor="middle" class="step">REROLL 卡通 27.80</text>
  <text x="937" y="265" text-anchor="middle" class="step" fill="#111">REROLL 擬真 27.80</text>
  <text x="70" y="330" class="bar">其餘 US$8.51：冒煙／模型比較／30 秒預告／首尾幀驗證／配樂／短測試</text>

  <text x="70" y="413" class="title" font-size="31">讓 AI 助手能花錢之前，先設三道鎖</text>
  <g transform="translate(70 452)">
    <rect width="305" height="164" rx="22" fill="#07111f"/>
    <circle cx="42" cy="42" r="22" fill="#38bdf8"/><text x="42" y="49" text-anchor="middle" class="bar">1</text>
    <text x="78" y="49" class="step">生成前估價</text>
    <text x="28" y="94" class="step-sub">秒數、解析度、模型與累計</text>
    <text x="28" y="124" class="step-sub">全部先寫進付費說明書</text>
  </g>
  <g transform="translate(408 452)">
    <rect width="305" height="164" rx="22" fill="#07111f"/>
    <circle cx="42" cy="42" r="22" fill="#38bdf8"/><text x="42" y="49" text-anchor="middle" class="bar">2</text>
    <text x="78" y="49" class="step">每鏡最多重抽 2 次</text>
    <text x="28" y="94" class="step-sub">失敗要分類，不准無限重抽</text>
    <text x="28" y="124" class="step-sub">先換圖、換模式或降人數</text>
  </g>
  <g transform="translate(746 452)">
    <rect width="374" height="164" rx="22" fill="#fff7d6" stroke="#e5a300" stroke-width="3"/>
    <circle cx="42" cy="42" r="22" fill="#e5a300"/><text x="42" y="49" text-anchor="middle" class="bar">3</text>
    <text x="78" y="49" class="gate">第三次只能人工明示</text>
    <text x="28" y="94" class="label">本次兩個最後鏡頭都用到第 3 次生成</text>
    <text x="28" y="124" class="label">原因、代價與核准一起寫進製作帳本</text>
  </g>

  <text x="70" y="672" class="small">後製、剪接、字卡、混音、品質檢查與 YouTube 上傳包在本機完成，未增加 OpenRouter 現金成本。</text>
</svg>

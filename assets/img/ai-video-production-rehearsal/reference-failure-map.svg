<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AI 影片參考圖的三種失敗模式</title>
  <desc id="desc">寫實圖片可能被供應商擋，卡通與擬真混用會造成風格漂移，模糊的身形形容詞會把比例拉長。對策是先探針並略過問題圖、只用同風格參考，以及寫入可量化比例。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#132f46"/></linearGradient>
    <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.eyebrow{font-size:18px;fill:#7dd3fc;font-weight:800;letter-spacing:3px}.title{font-size:40px;fill:#fff;font-weight:900}.sub{font-size:20px;fill:#cbd5e1}.tag{font-size:15px;fill:#07111f;font-weight:900;letter-spacing:1px}.card-title{font-size:27px;fill:#07111f;font-weight:900}.body{font-size:18px;fill:#475569}.fix{font-size:19px;fill:#075985;font-weight:800}.small{font-size:16px;fill:#64748b}.bottom{font-size:21px;fill:#f8fafc;font-weight:800}</style>
  </defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <text x="70" y="72" class="eyebrow">REFERENCE FAILURE MAP</text>
  <text x="70" y="124" class="title">參考圖不是越多越好</text>
  <text x="70" y="162" class="sub">每一張圖都可能同時改變身分、材質、比例與畫風。</text>

  <g transform="translate(70 215)">
    <rect width="330" height="390" rx="24" fill="#fff"/>
    <rect x="24" y="24" width="98" height="30" rx="15" fill="#fecaca"/><text x="73" y="45" text-anchor="middle" class="tag">INPUT BLOCK</text>
    <text x="24" y="98" class="card-title">寫實參考被擋</text>
    <rect x="24" y="128" width="282" height="92" rx="14" fill="#fff1f2" stroke="#fda4af"/>
    <circle cx="75" cy="174" r="28" fill="#fda4af"/><path d="M60 159l30 30m0-30l-30 30" stroke="#7f1d1d" stroke-width="6" stroke-linecap="round"/>
    <text x="116" y="166" class="body">同一角色不同角度</text><text x="116" y="193" class="body">可能一張過、一張擋</text>
    <text x="24" y="264" class="fix">對策：先做 480p × 4 秒短測試</text>
    <text x="24" y="300" class="body">略過問題圖並重編 @Image 索引</text>
    <text x="24" y="332" class="body">正式長鏡頭不要拿來猜政策</text>
    <text x="24" y="370" class="small">失敗免費，但會破壞整段角色配置</text>
  </g>

  <g transform="translate(435 215)">
    <rect width="330" height="390" rx="24" fill="#fff"/>
    <rect x="24" y="24" width="112" height="30" rx="15" fill="#fde68a"/><text x="80" y="45" text-anchor="middle" class="tag">STYLE DRIFT</text>
    <text x="24" y="98" class="card-title">卡通與擬真混用</text>
    <rect x="24" y="128" width="112" height="92" rx="14" fill="#dbeafe"/><circle cx="80" cy="163" r="22" fill="#60a5fa"/><path d="M51 205q29-38 58 0" fill="#2563eb"/>
    <text x="151" y="183" class="card-title" fill="#94a3b8">＋</text>
    <rect x="194" y="128" width="112" height="92" rx="14" fill="#fef3c7"/><circle cx="250" cy="163" r="22" fill="#d6a06d"/><path d="M221 205q29-38 58 0" fill="#92400e"/>
    <text x="24" y="264" class="fix">對策：一段只留同一風格參考</text>
    <text x="24" y="300" class="body">缺身分時寧可減少角色</text>
    <text x="24" y="332" class="body">不要用另一種畫風硬補</text>
    <text x="24" y="370" class="small">本次混用後，擬真鏡頭整段漂成動畫</text>
  </g>

  <g transform="translate(800 215)">
    <rect width="330" height="390" rx="24" fill="#fff"/>
    <rect x="24" y="24" width="110" height="30" rx="15" fill="#bae6fd"/><text x="79" y="45" text-anchor="middle" class="tag">PROPORTION</text>
    <text x="24" y="98" class="card-title">形容詞把比例拉壞</text>
    <line x1="88" y1="135" x2="88" y2="224" stroke="#176bff" stroke-width="10" stroke-linecap="round"/><circle cx="88" cy="133" r="24" fill="#60a5fa"/><line x1="61" y1="174" x2="115" y2="174" stroke="#176bff" stroke-width="9" stroke-linecap="round"/><line x1="88" y1="221" x2="60" y2="252" stroke="#176bff" stroke-width="9" stroke-linecap="round"/><line x1="88" y1="221" x2="116" y2="252" stroke="#176bff" stroke-width="9" stroke-linecap="round"/>
    <text x="144" y="168" class="body">只寫 tall</text><text x="144" y="199" class="body">→ 全員被拉到</text><text x="144" y="230" class="card-title" fill="#b45309">8.5 頭身</text>
    <text x="24" y="286" class="fix">對策：把比例變成可驗收條件</text>
    <text x="24" y="322" class="body">約 7.5 頭身、自然、不拉伸</text>
    <text x="24" y="354" class="body">多人鏡頭再寫誰高半個頭</text>
  </g>

  <rect x="180" y="655" width="840" height="64" rx="18" fill="#176bff"/>
  <text x="600" y="695" text-anchor="middle" class="bottom">先分類失敗，再決定刪圖、降人數，還是換控制方式。</text>
</svg>

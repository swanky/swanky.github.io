<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 678" width="840" height="678" role="img" aria-labelledby="p07-w-t p07-w-d"><title id="p07-w-t">safe-swap：從不擋指令，只把看懂的危險指令換成較安全的版本，或先拍快照再跑</title><desc id="p07-w-d">AI 下終端機指令時，safe-swap 在 pre_tool_call 用自己寫的小掃描器讀指令，只改它完全看懂的。git push --force 換成 --force-with-lease --force-if-includes，拒絕不安全的推送；rm -r 換成把檔案搬進隔離區，之後可以救回；git reset --hard、git clean、git branch -D 這類不換指令，而是先拍快照再照原樣執行；看起來具破壞性但看不懂的指令（包在 bash -c 裡、接在 sudo 後面）照原樣執行，並明講 NOT swapped；插件自己出錯也照原樣執行。限制：它不是護欄，不擋任何東西；推出去的收不回；find -delete、寫檔工具不涵蓋；隔離區不會自己清。</desc><defs><marker id="p07-w-ms" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5F5B53"/></marker><marker id="p07-w-mr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#C0392B"/></marker><marker id="p07-w-mg" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2E8B57"/></marker><marker id="p07-w-mb" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F5F85"/></marker><marker id="p07-w-mo" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8A5D00"/></marker></defs><rect width="100%" height="100%" fill="#FFFDF9"/><circle cx="42" cy="40" r="17" fill="#E5A300"/><text x="42" y="46" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">7</text><text x="70" y="47" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="22" font-weight="800" fill="#232020" text-anchor="start">safe-swap</text><text x="202.79999999999998" y="47" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="400" fill="#5F5B53" text-anchor="start">不擋，只讓手滑可以救回</text><rect x="24" y="94" width="200" height="80" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><g transform="translate(40 109.0) scale(1)" fill="none" stroke="#232020" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7l5 5l-5 5"/><path d="M12 19l7 0"/></g><text x="72" y="127.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#232020" text-anchor="start">AI 下指令</text><text x="40" y="151.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">在終端機刪檔、強推</text><rect x="24" y="214" width="200" height="118" rx="10" fill="#FBF3DC" stroke="#E5A300" stroke-width="2.5"/><text x="40" y="244.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#232020" text-anchor="start">小掃描器</text><text x="40" y="268.2" font-family="Consolas,'Cascadia Mono','Segoe UI Mono',monospace" font-size="14" font-weight="400" fill="#8A5D00" text-anchor="start">pre_tool_call</text><text x="40" y="290.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">只改完全看懂的</text><text x="40" y="312.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">出錯就照原樣跑</text><polyline points="124,174 124,212" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#p07-w-ms)"/><text x="304" y="112" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="700" fill="#5F5B53" text-anchor="start">AI 原本要跑的</text><text x="544" y="112" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="700" fill="#5F5B53" text-anchor="start">實際會跑的</text><rect x="264" y="124" width="236" height="84" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><text x="280" y="158" font-family="Consolas,'Cascadia Mono','Segoe UI Mono',monospace" font-size="14" font-weight="400" fill="#232020" text-anchor="start">git push --force</text><polyline points="500,166.0 530,166.0" fill="none" stroke="#1F5F85" stroke-width="2" marker-end="url(#p07-w-mb)"/><rect x="532" y="124" width="284" height="84" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><rect x="532" y="124" width="6" height="84" rx="2" fill="#1F5F85"/><text x="552" y="152" font-family="Consolas,'Cascadia Mono','Segoe UI Mono',monospace" font-size="14" font-weight="400" fill="#8A5D00" text-anchor="start">--force-with-lease</text><text x="552" y="172" font-family="Consolas,'Cascadia Mono','Segoe UI Mono',monospace" font-size="14" font-weight="400" fill="#8A5D00" text-anchor="start">--force-if-includes</text><text x="552" y="194" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="700" fill="#1F5F85" text-anchor="start">換掉：拒絕不安全的推送</text><polyline points="224,273 244,273 244,166.0 262,166.0" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#p07-w-ms)"/><rect x="264" y="222" width="236" height="84" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><text x="280" y="256" font-family="Consolas,'Cascadia Mono','Segoe UI Mono',monospace" font-size="14" font-weight="400" fill="#232020" text-anchor="start">rm -r build</text><polyline points="500,264.0 530,264.0" fill="none" stroke="#1F5F85" stroke-width="2" marker-end="url(#p07-w-mb)"/><rect x="532" y="222" width="284" height="84" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><rect x="532" y="222" width="6" height="84" rx="2" fill="#1F5F85"/><text x="552" y="250" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#8A5D00" text-anchor="start">搬進隔離區</text><text x="552" y="292" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="700" fill="#1F5F85" text-anchor="start">換掉：之後可以救回</text><polyline points="224,273 244,273 244,264.0 262,264.0" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#p07-w-ms)"/><rect x="264" y="320" width="236" height="84" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><text x="280" y="354" font-family="Consolas,'Cascadia Mono','Segoe UI Mono',monospace" font-size="14" font-weight="400" fill="#232020" text-anchor="start">git reset --hard</text><text x="280" y="378" font-family="Consolas,'Cascadia Mono','Segoe UI Mono',monospace" font-size="14" font-weight="400" fill="#232020" text-anchor="start">git clean / branch -D</text><polyline points="500,362.0 530,362.0" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#p07-w-ms)"/><rect x="532" y="320" width="284" height="84" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><rect x="532" y="320" width="6" height="84" rx="2" fill="#5F5B53"/><text x="552" y="368" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="700" fill="#5F5B53" text-anchor="start">不換：先拍快照，再照原樣跑</text><polyline points="224,273 244,273 244,362.0 262,362.0" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#p07-w-ms)"/><rect x="264" y="418" width="236" height="84" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><text x="280" y="452" font-family="Consolas,'Cascadia Mono','Segoe UI Mono',monospace" font-size="14" font-weight="400" fill="#232020" text-anchor="start">bash -c "..." / sudo ...</text><text x="280" y="476" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">看起來危險但看不懂</text><polyline points="500,460.0 530,460.0" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#p07-w-ms)"/><rect x="532" y="418" width="284" height="84" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><rect x="532" y="418" width="6" height="84" rx="2" fill="#5F5B53"/><text x="552" y="466" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="700" fill="#5F5B53" text-anchor="start">不換：照跑，明講 NOT swapped</text><polyline points="224,273 244,273 244,460.0 262,460.0" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#p07-w-ms)"/><text x="24" y="536" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="800" fill="#8A5D00" text-anchor="start">每一種都沒有「擋下」：它從不擋指令</text><rect x="24" y="556" width="792" height="98" rx="10" fill="#FCF1EF" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="6 5"/><text x="44" y="588" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="17" font-weight="800" fill="#C0392B" text-anchor="start">它的盲點（作者自己寫的）</text><text x="44" y="616" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#232020" text-anchor="start">✕ 它不是護欄：find -delete、mv 覆蓋、寫檔工具都不涵蓋</text><text x="44" y="640" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#232020" text-anchor="start">✕ 推出去的收不回；隔離區不會自己清，只會越來越大</text></svg>

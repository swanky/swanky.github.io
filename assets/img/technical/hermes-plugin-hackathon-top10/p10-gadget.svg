<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 762" width="840" height="762" role="img" aria-labelledby="p10-w-t p10-w-d"><title id="p10-w-t">Hermes Gadget SDK：小裝置只負責收音和畫面，核准問題顯示不全就只能拒絕</title><desc id="p10-w-d">ESP32 開發板或桌面模擬器做成的小裝置，經一條 WebSocket 連到 Hermes 主機上的 hub；語音轉文字、語音合成和模型都在主機，裝置只負責收音、畫面、播放，並宣告自己會做哪些動作。每個裝置在 Hermes 裡是一個私訊聊天。Hermes 要核准危險指令時，裝置螢幕顯示這條指令：TALK 鍵是只核准這一次，CANCEL 鍵是拒絕。指令只有在一行放得下、而且都是一般可列印字元時才顯示；顯示不全時畫面寫 Can't show this command，只能拒絕或回主機核准。讓 AI 問選擇題的功能刻意和核准分開，AI 不能用選擇題頂替核准。限制：大多數板子仍標為實驗性，沒有實體驗證報告；沒有喚醒詞。</desc><defs><marker id="p10-w-ms" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5F5B53"/></marker><marker id="p10-w-mr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#C0392B"/></marker><marker id="p10-w-mg" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2E8B57"/></marker><marker id="p10-w-mb" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F5F85"/></marker><marker id="p10-w-mo" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8A5D00"/></marker></defs><rect width="100%" height="100%" fill="#FFFDF9"/><circle cx="42" cy="40" r="17" fill="#E5A300"/><text x="42" y="46" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">10</text><text x="70" y="47" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="22" font-weight="800" fill="#232020" text-anchor="start">Hermes Gadget SDK</text><text x="308.4" y="47" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="400" fill="#5F5B53" text-anchor="start">把核准按鈕做成實體小裝置</text><rect x="24" y="94" width="220" height="96" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><g transform="translate(40 106.0) scale(1)" fill="none" stroke="#232020" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2v-14"/><path d="M11 4h2"/><path d="M12 17v.01"/></g><text x="72" y="124.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#232020" text-anchor="start">小裝置</text><text x="40" y="148.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">ESP32 開發板、模擬器</text><text x="40" y="170.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">只收音、畫面、播放</text><rect x="300" y="94" width="220" height="96" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><g transform="translate(316 106.0) scale(1)" fill="none" stroke="#232020" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3"/><path d="M3 15a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3l0 -2"/><path d="M7 8l0 .01"/><path d="M7 16l0 .01"/></g><text x="348" y="124.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#232020" text-anchor="start">主機上的 hub</text><text x="316" y="148.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">一條 WebSocket 連線</text><text x="316" y="170.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">認證、聲音進出</text><rect x="576" y="94" width="240" height="96" rx="10" fill="#E6F2F9" stroke="#1F5F85" stroke-width="1.5"/><g transform="translate(592 106.0) scale(1)" fill="none" stroke="#1F5F85" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v4a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2l0 -4"/><path d="M12 2v2"/><path d="M9 12v9"/><path d="M15 12v9"/><path d="M5 16l4 -2"/><path d="M15 14l4 2"/><path d="M9 18h6"/><path d="M10 8v.01"/><path d="M14 8v.01"/></g><text x="624" y="124.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#1F5F85" text-anchor="start">Hermes</text><text x="592" y="148.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">語音轉文字、模型、工具</text><text x="592" y="170.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">都在主機上</text><polyline points="244,134 298,134" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#p10-w-ms)"/><polyline points="298,156 246,156" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#p10-w-ms)"/><polyline points="520,134 574,134" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#p10-w-ms)"/><polyline points="574,156 522,156" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#p10-w-ms)"/><line x1="24" y1="212" x2="816" y2="212" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><text x="24" y="240" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="800" fill="#8A5D00" text-anchor="start">Hermes 要核准危險指令時</text><rect x="24" y="256" width="300" height="190" rx="18" fill="#2B2724" stroke="#2B2724" stroke-width="1.5"/><rect x="42" y="274" width="264" height="90" rx="8" fill="#FFFDF9" stroke="#FFFDF9" stroke-width="1"/><text x="174" y="326" font-family="Consolas,'Cascadia Mono','Segoe UI Mono',monospace" font-size="16" font-weight="400" fill="#8A5D00" text-anchor="middle">rm -r build</text><rect x="42" y="380" width="124" height="48" rx="8" fill="#2E8B57" stroke="#2E8B57" stroke-width="1.5"/><text x="104" y="411" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">TALK</text><rect x="182" y="380" width="124" height="48" rx="8" fill="#C0392B" stroke="#C0392B" stroke-width="1.5"/><text x="244" y="411" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">CANCEL</text><text x="24" y="472" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">示意畫面。指令要一行放得下、</text><text x="24" y="496" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">都是一般字元，才會顯示</text><rect x="360" y="256" width="456" height="72" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><rect x="360" y="256" width="6" height="72" rx="2" fill="#2E8B57"/><text x="384" y="285.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#2E8B57" text-anchor="start">✓ 按 TALK</text><text x="384" y="309.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">只核准這一次，不會變成一律允許</text><rect x="360" y="340" width="456" height="72" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><rect x="360" y="340" width="6" height="72" rx="2" fill="#C0392B"/><text x="384" y="369.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#C0392B" text-anchor="start">✕ 按 CANCEL</text><text x="384" y="393.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">拒絕</text><rect x="360" y="424" width="456" height="96" rx="10" fill="#FBF3DC" stroke="#E5A300" stroke-width="2.5"/><text x="376" y="454.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#232020" text-anchor="start">指令顯示不全時</text><text x="376" y="478.2" font-family="Consolas,'Cascadia Mono','Segoe UI Mono',monospace" font-size="14" font-weight="400" fill="#8A5D00" text-anchor="start">Can't show this command</text><text x="376" y="500.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">TALK 不動作：只能拒絕，或回主機核准</text><polyline points="324,292 358,292" fill="none" stroke="#2E8B57" stroke-width="2" marker-end="url(#p10-w-mg)"/><polyline points="324,376 358,376" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#p10-w-mr)"/><polyline points="324,426 342,426 342,472 358,472" fill="none" stroke="#8A5D00" stroke-width="2" marker-end="url(#p10-w-mo)"/><rect x="24" y="546" width="792" height="74" rx="10" fill="#FAF5EA" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><g transform="translate(40 558.0) scale(1)" fill="none" stroke="#232020" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0"/><path d="M12 16h.01"/></g><text x="72" y="576.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#232020" text-anchor="start">AI 問的選擇題，和核准刻意分開</text><text x="40" y="600.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">AI 不能用一道選擇題頂替核准</text><rect x="24" y="640" width="792" height="98" rx="10" fill="#FCF1EF" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="6 5"/><text x="44" y="672" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="17" font-weight="800" fill="#C0392B" text-anchor="start">它的盲點（作者自己寫的）</text><text x="44" y="700" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#232020" text-anchor="start">✕ 大多數板子仍標為實驗性，沒有實體驗證報告；CI 與模擬器只驗軟體行為</text><text x="44" y="724" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#232020" text-anchor="start">✕ 沒有喚醒詞</text></svg>

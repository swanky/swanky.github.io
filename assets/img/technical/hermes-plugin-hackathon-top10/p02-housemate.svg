<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 702" width="840" height="702" role="img" aria-labelledby="p02-w-t p02-w-d"><title id="p02-w-t">Housemate：舊手機、筆電變成房間喇叭，危險指令可以口頭核准，但聽不清楚就不算</title><desc id="p02-w-d">房間裡的舊手機或筆電只跑網頁，把聲音傳到主機上的 hub；喚醒詞與語音偵測在 hub 上判斷，喚醒後的問句交給 Hermes，由 Hermes 自己的語音轉文字與 agent 回答，答案再從房間喇叭唸出。Hermes 遇到危險指令要問人時，Housemate 用喇叭唸出Hermes 對指令的描述，完整指令顯示在房間螢幕的卡片上。人說出明確的 approve，只對應卡片上最窄的一種放行；含糊的回答或沒有回答一律不核准，等 Hermes 自己的核准逾時（預設 300 秒）拒絕。被 Hermes 智慧核准標記的指令只能點螢幕核准。限制：喇叭唸的是描述，不是指令本身；作者的喚醒與速度數字是用合成語音、在同一台電腦上量的。</desc><defs><marker id="p02-w-ms" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5F5B53"/></marker><marker id="p02-w-mr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#C0392B"/></marker><marker id="p02-w-mg" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2E8B57"/></marker><marker id="p02-w-mb" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F5F85"/></marker><marker id="p02-w-mo" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8A5D00"/></marker></defs><rect width="100%" height="100%" fill="#FFFDF9"/><circle cx="42" cy="40" r="17" fill="#E5A300"/><text x="42" y="46" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="70" y="47" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="22" font-weight="800" fill="#232020" text-anchor="start">Housemate</text><text x="202.79999999999998" y="47" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="400" fill="#5F5B53" text-anchor="start">把 Hermes 搬進每個房間</text><text x="24" y="102" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="800" fill="#8A5D00" text-anchor="start">平常：問一句，喇叭答一句</text><rect x="24" y="120" width="210" height="104" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><g transform="translate(40 136.0) scale(1)" fill="none" stroke="#232020" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2v-14"/><path d="M11 4h2"/><path d="M12 17v.01"/></g><text x="72" y="154.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#232020" text-anchor="start">房間裡的裝置</text><text x="40" y="178.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">舊手機、筆電</text><text x="40" y="200.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">只開網頁：收音、播放</text><rect x="296" y="120" width="220" height="104" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><g transform="translate(312 136.0) scale(1)" fill="none" stroke="#232020" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3"/><path d="M3 15a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3l0 -2"/><path d="M7 8l0 .01"/><path d="M7 16l0 .01"/></g><text x="344" y="154.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#232020" text-anchor="start">主機上的 hub</text><text x="312" y="178.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">判斷喚醒詞與說話</text><text x="312" y="200.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">喚醒後的問句才往下送</text><rect x="578" y="120" width="238" height="104" rx="10" fill="#E6F2F9" stroke="#1F5F85" stroke-width="1.5"/><g transform="translate(594 136.0) scale(1)" fill="none" stroke="#1F5F85" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v4a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2l0 -4"/><path d="M12 2v2"/><path d="M9 12v9"/><path d="M15 12v9"/><path d="M5 16l4 -2"/><path d="M15 14l4 2"/><path d="M9 18h6"/><path d="M10 8v.01"/><path d="M14 8v.01"/></g><text x="626" y="154.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#1F5F85" text-anchor="start">Hermes</text><text x="594" y="178.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">自己的語音轉文字</text><text x="594" y="200.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">agent 想答案、用工具</text><polyline points="234,156 294,156" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#p02-w-ms)"/><rect x="245.0" y="136" width="38.0" height="20" rx="4" fill="#FFFDF9"/><text x="264" y="150" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="700" fill="#5F5B53" text-anchor="middle">聲音</text><polyline points="516,156 576,156" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#p02-w-ms)"/><rect x="527.0" y="136" width="38.0" height="20" rx="4" fill="#FFFDF9"/><text x="546" y="150" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="700" fill="#5F5B53" text-anchor="middle">問句</text><polyline points="697,224 697,246 129,246 129,226" fill="none" stroke="#1F5F85" stroke-width="2" marker-end="url(#p02-w-mb)"/><rect x="342.0" y="237" width="128.0" height="20" rx="4" fill="#FFFDF9"/><text x="406" y="251" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="700" fill="#1F5F85" text-anchor="middle">回答從喇叭唸出來</text><line x1="24" y1="276" x2="816" y2="276" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><text x="24" y="302" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="800" fill="#8A5D00" text-anchor="start">遇到危險指令：口頭核准</text><rect x="578" y="318" width="238" height="100" rx="10" fill="#FBF3DC" stroke="#E5A300" stroke-width="2.5"/><g transform="translate(594 332.0) scale(1)" fill="none" stroke="#232020" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0"/><path d="M12 16h.01"/></g><text x="626" y="350.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#232020" text-anchor="start">Hermes 的核准卡</text><text x="594" y="374.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">Hermes 決定要問人</text><text x="594" y="396.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">Housemate 只負責傳話</text><rect x="296" y="318" width="220" height="100" 
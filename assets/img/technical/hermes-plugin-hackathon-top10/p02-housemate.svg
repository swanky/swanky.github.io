fill="#2E8B57" text-anchor="start">✓ 明確說 approve</text><text x="48" y="526.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">只對應卡片上最窄的放行</text><rect x="296" y="462" width="250" height="94" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><rect x="296" y="462" width="6" height="94" rx="2" fill="#C0392B"/><text x="320" y="491.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#C0392B" text-anchor="start">✕ 含糊或沒回答</text><text x="320" y="515.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">不算核准，等 Hermes</text><text x="320" y="537.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">逾時拒絕（預設 300 秒）</text><rect x="568" y="462" width="248" height="94" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><rect x="568" y="462" width="6" height="94" rx="2" fill="#5F5B53"/><text x="592" y="502.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#5F5B53" text-anchor="start">被智慧核准標記的</text><text x="592" y="526.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">口頭不算，只能點螢幕</text><polyline points="129,418 129,460" fill="none" stroke="#2E8B57" stroke-width="2" marker-end="url(#p02-w-mg)"/><polyline points="129,436 421,436 421,460" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#p02-w-mr)"/><polyline points="421,436 692,436 692,460" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="u
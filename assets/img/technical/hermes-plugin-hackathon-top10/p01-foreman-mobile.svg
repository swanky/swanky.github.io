<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1279" width="420" height="1279" role="img" aria-labelledby="p01-m-t p01-m-d"><title id="p01-m-t">Foreman：提交前讀真正會被提交的程式差異，合併只能由人下指令</title><desc id="p01-m-d">AI 想 commit、push 或開 PR 時，Foreman 在 pre_tool_call 關口認出動作，讀 git 真正會記錄的程式差異（審查規則取自分支從主線分出去的那個點，第二個模型只供參考）；沒問題就放行，發現跳過測試、放寬檢查或塞進機密就擋下，人可用 /foreman allow 放行 24 小時。AI 自己執行 gh pr merge 一律擋下，合併只能由人輸入 /foreman merge，重新檢查並在選單確認後才合併。作者自承：它只認得寫出來的指令，gh api 直接合併、alias、$G commit 認不出，真正獨立的關卡是 GitHub 分支保護與 CI 必要檢查。</desc><defs><marker id="p01-m-ms" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5F5B53"/></marker><marker id="p01-m-mr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#C0392B"/></marker><marker id="p01-m-mg" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2E8B57"/></marker><marker id="p01-m-mb" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F5F85"/></marker><marker id="p01-m-mo" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8A5D00"/></marker></defs><rect width="100%" height="100%" fill="#FFFDF9"/><circle cx="38" cy="38" r="16" fill="#E5A300"/><text x="38" y="44" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="64" y="45" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="20" font-weight="800" fill="#232020" text-anchor="start">Foreman</text><text x="24" y="74" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">提交讀差異，合併只能由人</text><text x="24" y="118" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="800" fill="#8A5D00" text-anchor="start">提交這一步</text><rect x="24" y="132" width="372" height="93" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><g transform="translate(40 142.5) scale(1)" fill="none" stroke="#232020" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v4a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2l0 -4"/><path d="M12 2v2"/><path d="M9 12v9"/><path d="M15 12v9"/><path d="M5 16l4 -2"/><path d="M15 14l4 2"/><path d="M9 18h6"/><path d="M10 8v.01"/><path d="M14 8v.01"/></g><text x="72" y="160.6" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="17" font-weight="700" fill="#232020" text-anchor="start">AI 想提交</text><text x="40" y="184.2" font-family="Consolas,'Cascadia Mono','Segoe UI Mono',monospace" font-size="14" font-weight="400" fill="#8A5D00" text-anchor="start">commit / push</text><text x="40" y="206.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">開 PR</text><polyline points="210,225 210,247" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#p01-m-ms)"/><rect x="24" y="249" width="372" height="71" rx="10" fill="#FBF3DC" stroke="#E5A300" stroke-width="2.5"/><text x="40" y="277.6" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="17" font-weight="700" fill="#232020" text-anchor="start">關口 pre_tool_call</text><text x="40" y="301.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">認出是哪個動作</text><polyline points="210,320 210,342" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#p01-m-ms)"/><rect x="24" y="344" width="372" height="115" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><g transform="translate(40 354.5) scale(1)" fill="none" stroke="#232020" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/><path d="M21 21l-6 -6"/></g><text x="72" y="372.6" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="17" font-weight="700" fill="#232020" text-anchor="start">讀程式差異</text><text x="40" y="396.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">真正會被提交的內容</text><text x="40" y="418.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">規則取自分出主線那點</text><text x="40" y="440.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">第二個模型只供參考</text><rect x="24" y="483" width="176" height="94" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><rect x="24" y="483" width="6" height="94" rx="2" fill="#5F5B53"/><text x="48" y="523.1" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="17" font-weight="700" fill="#5F5B53" text-anchor="start">✓ 放行</text><text x="48" y="546.7" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">沒找到問題</text><rect x="220" y="483" width="176" height="94" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><rect x="220" y="483" width="6" height="94" rx="2" fill="#C0392B"/><text x="244" y="512.1" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="17" font-weight="700" fill="#C0392B" text-anchor="start">✕ 擋下</text><text x="244" y="535.7" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">跳過測試、放寬</text><text x="244" y="557.7" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">檢查或塞進機密</text><polyline points="210,459 210,471 112,471 112,481" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#p01-m-ms)"/><polyline points="210,471 308,471 308,481" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#p01-m-mr)"/><polyline points="308,577 308,599" fill="none" stroke="#2E8B57" stroke-width="2" marker-end="url(#p01-m-mg)"/><rect x="24" y="601" width="372" height="93" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><rect x="24" y="601" width="6" height="93" rx="2" fill="#2E8B57"/><text x="48" y="629.6" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="17" font-weight="700" fill="#2E8B57" text-anchor="start">例外放行（人打的）</text><text x="48" y="653.2" font-family="Consolas,'Cascadia Mono','Segoe UI Mono',monospace" font-size="14" font-weight="400" fill="#8A5D00" text-anchor="start">/foreman allow</text><text x="48" y="675.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">限 24 小時</text><line x1="24" y1="712" x2="396" y2="712" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><text x="24" y="742" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="800" fill="#8A5D00" text-anchor="start">合併：只有人能下指令</text><rect x="24" y="756" width="372" height="71" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><g transform="translate(40 766.5) scale(1)" fill="none" stroke="#232020" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v4a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2l0 -4"/><path d="M12 2v2"/><path d="M9 12v9"/><path d="M15 12v9"/><path d="M5 16l4 -2"/><path d="M15 14l4 2"/><path d="M9 18h6"/><path d="M10 8v.01"/><path d="M14 8v.01"/></g><text x="72" y="784.6" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="17" font-weight="700" fill="#232020" text-anchor="start">AI 自己合併</text><text x="40" y="808.2" font-family="Consolas,'Cascadia Mono','Segoe UI Mono',monospace" font-size="14" font-weight="400" fill="#8A5D00" text-anchor="start">gh pr merge</text><polyline points="210,827 210,849" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#p01-m-mr)"/><rect x="24" y="851" width="372" height="93" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><rect x="24" y="851" width="6" height="93" rx="2" fill="#C0392B"/><text x="48" y="879.6" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="17" font-weight="700" fill="#C0392B" text-anchor="start">✕ 一律擋下</text><text x="48" y="903.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">「合併是使用者的決定，</text><text x="48" y="925.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">請他執行 /foreman merge」</text><polyline points="210,944 210,966" fill="none" stroke="#5F5B53" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#p01-m-ms)"/><rect x="24" y="968" width="372" height="93" rx="10" fill="#EEF6F0" stroke="#2E8B57" stroke-width="2"/><g transform="translate(40 978.5) scale(1)" fill="none" stroke="#2E8B57" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"/><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/></g><text x="72" y="996.6" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="17" font-weight="700" fill="#2E8B57" text-anchor="start">人下合併指令</text><text x="40" y="1020.2" font-family="Consolas,'Cascadia Mono','Segoe UI Mono',monospace" font-size="14" font-weight="400" fill="#8A5D00" text-anchor="start">/foreman merge</text><text x="40" y="1042.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">重新檢查，選單確認才合併</text><rect x="24" y="1085" width="372" height="170" rx="10" fill="#FCF1EF" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="6 5"/><text x="44" y="1117" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="17" font-weight="800" fill="#C0392B" text-anchor="start">它的盲點（作者自己寫的）</text><text x="44" y="1145" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#232020" text-anchor="start">✕ 只認得寫出來的指令：</text><text x="44" y="1169" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#232020" text-anchor="start">　gh api 直接合併、alias、</text><text x="44" y="1193" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#232020" text-anchor="start">　$G commit 都認不出</text><text x="44" y="1217" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#232020" text-anchor="start">✕ 作者結論：真正獨立的關卡是</text><text x="44" y="1241" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#232020" text-anchor="start">　分支保護與 CI 必要檢查</text></svg>

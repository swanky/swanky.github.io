<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 722" width="840" height="722" role="img" aria-labelledby="p01-w-t p01-w-d"><title id="p01-w-t">Foreman：提交前讀真正會被提交的程式差異，合併只能由人下指令</title><desc id="p01-w-d">AI 想 commit、push 或開 PR 時，Foreman 在 pre_tool_call 關口認出動作，讀 git 真正會記錄的程式差異（審查規則取自分支從主線分出去的那個點，第二個模型只供參考）；沒問題就放行，發現跳過測試、放寬檢查或塞進機密就擋下，人可用 /foreman allow 放行 24 小時。AI 自己執行 gh pr merge 一律擋下，合併只能由人輸入 /foreman merge，重新檢查並在選單確認後才合併。作者自承：它只認得寫出來的指令，gh api 直接合併、alias、$G commit 認不出，真正獨立的關卡是 GitHub 分支保護與 CI 必要檢查。</desc><defs><marker id="p01-w-ms" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5F5B53"/></marker><marker id="p01-w-mr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#C0392B"/></marker><marker id="p01-w-mg" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2E8B57"/></marker><marker id="p01-w-mb" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F5F85"/></marker><marker id="p01-w-mo" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8A5D00"/></marker></defs><rect width="100%" height="100%" fill="#FFFDF9"/><circle cx="42" cy="40" r="17" fill="#E5A300"/><text x="42" y="46" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="70" y="47" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="22" font-weight="800" fill="#232020" text-anchor="start">Foreman</text><text x="176.4" y="47" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="400" fill="#5F5B53" text-anchor="start">提交讀差異，合併只能由人</text><text x="24" y="102" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="800" fill="#8A5D00" text-anchor="start">提交這一步</text><rect x="624" y="116" width="192" height="72" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><rect x="624" y="116" width="6" height="72" rx="2" fill="#5F5B53"/><text x="648" y="145.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#5F5B53" text-anchor="start">✓ 放行</text><text x="648" y="169.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">沒找到問題</text><rect x="624" y="202" width="192" height="94" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><rect x="624" y="202" width="6" height="94" rx="2" fill="#C0392B"/><text x="648" y="231.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#C0392B" text-anchor="start">✕ 擋下</text><text x="648" y="255.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">跳過測試、放寬檢查</text><text x="648" y="277.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">或塞進機密</text><rect x="624" y="326" width="192" height="94" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><rect x="624" y="326" width="6" height="94" rx="2" fill="#2E8B57"/><text x="648" y="355.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#2E8B57" text-anchor="start">例外放行</text><text x="648" y="379.2" font-family="Consolas,'Cascadia Mono','Segoe UI Mono',monospace" font-size="14" font-weight="400" fill="#8A5D00" text-anchor="start">/foreman allow</text><text x="648" y="401.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">人打的，限 24 小時</text><rect x="24" y="179.0" width="150" height="100" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><g transform="translate(40 193.0) scale(1)" fill="none" stroke="#232020" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v4a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2l0 -4"/><path d="M12 2v2"/><path d="M9 12v9"/><path d="M15 12v9"/><path d="M5 16l4 -2"/><path d="M15 14l4 2"/><path d="M9 18h6"/><path d="M10 8v.01"/><path d="M14 8v.01"/></g><text x="72" y="211.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#232020" text-anchor="start">AI 想提交</text><text x="40" y="235.2" font-family="Consolas,'Cascadia Mono','Segoe UI Mono',monospace" font-size="14" font-weight="400" fill="#8A5D00" text-anchor="start">commit / push</text><text x="40" y="257.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">開 PR</text><rect x="204" y="169.0" width="160" height="120" rx="10" fill="#FBF3DC" stroke="#E5A300" stroke-width="2.5"/><text x="220" y="211.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#232020" text-anchor="start">關口</text><text x="220" y="235.2" font-family="Consolas,'Cascadia Mono','Segoe UI Mono',monospace" font-size="14" font-weight="400" fill="#8A5D00" text-anchor="start">pre_tool_call</text><text x="220" y="257.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">認出是哪個動作</text><rect x="394" y="159.0" width="200" height="140" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><g transform="translate(410 182.0) scale(1)" fill="none" stroke="#232020" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/><path d="M21 21l-6 -6"/></g><text x="442" y="200.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#232020" text-anchor="start">讀程式差異</text><text x="410" y="224.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">真正會被提交的內容</text><text x="410" y="246.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">規則取自分出主線那點</text><text x="410" y="268.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">第二個模型只供參考</text><polyline points="174,229.0 202,229.0" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#p01-w-ms)"/><polyline points="364,229.0 392,229.0" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#p01-w-ms)"/><polyline points="594,229.0 608,229.0 608,152.0 622,152.0" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#p01-w-ms)"/><polyline points="608,229.0 608,249.0 622,249.0" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#p01-w-mr)"/><polyline points="720.0,296 720.0,324" fill="none" stroke="#2E8B57" stroke-width="2" marker-end="url(#p01-w-mg)"/><line x1="24" y1="436" x2="816" y2="436" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><text x="24" y="466" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="800" fill="#8A5D00" text-anchor="start">合併這一步：只有人能下指令</text><rect x="24" y="480" width="190" height="96" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><g transform="translate(40 503.0) scale(1)" fill="none" stroke="#232020" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v4a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2l0 -4"/><path d="M12 2v2"/><path d="M9 12v9"/><path d="M15 12v9"/><path d="M5 16l4 -2"/><path d="M15 14l4 2"/><path d="M9 18h6"/><path d="M10 8v.01"/><path d="M14 8v.01"/></g><text x="72" y="521.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#232020" text-anchor="start">AI 自己合併</text><text x="40" y="545.2" font-family="Consolas,'Cascadia Mono','Segoe UI Mono',monospace" font-size="14" font-weight="400" fill="#8A5D00" text-anchor="start">gh pr merge</text><rect x="250" y="480" width="270" height="96" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><rect x="250" y="480" width="6" height="96" rx="2" fill="#C0392B"/><text x="274" y="510.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#C0392B" text-anchor="start">✕ 一律擋下</text><text x="274" y="534.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">「合併是使用者的決定，</text><text x="274" y="556.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">請他執行 /foreman merge」</text><rect x="556" y="480" width="260" height="96" rx="10" fill="#EEF6F0" stroke="#2E8B57" stroke-width="2"/><g transform="translate(572 492.0) scale(1)" fill="none" stroke="#2E8B57" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"/><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/></g><text x="604" y="510.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#2E8B57" text-anchor="start">人下合併指令</text><text x="572" y="534.2" font-family="Consolas,'Cascadia Mono','Segoe UI Mono',monospace" font-size="14" font-weight="400" fill="#8A5D00" text-anchor="start">/foreman merge</text><text x="572" y="556.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">重新檢查，選單確認才合併</text><polyline points="214,528 248,528" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#p01-w-mr)"/><polyline points="520,528 554,528" fill="none" stroke="#5F5B53" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#p01-w-ms)"/><rect x="24" y="600" width="792" height="98" rx="10" fill="#FCF1EF" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="6 5"/><text x="44" y="632" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="17" font-weight="800" fill="#C0392B" text-anchor="start">它的盲點（作者自己寫的）</text><text x="44" y="660" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#232020" text-anchor="start">✕ 只認得寫出來的指令：gh api 直接合併、alias、$G commit 都認不出</text><text x="44" y="684" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#232020" text-anchor="start">✕ 作者自己的結論：真正獨立的關卡是 GitHub 分支保護與 CI 必要檢查</text></svg>

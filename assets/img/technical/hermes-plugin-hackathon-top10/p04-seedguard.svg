<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 686" width="840" height="686" role="img" aria-labelledby="p04-w-t p04-w-d"><title id="p04-w-t">Seedguard：祕密送出前換成代號，模型只看得到代號，工具真的要用時由人限時放行</title><desc id="p04-w-d">你的訊息或工具輸出裡有種子碼、私鑰或 API key 時，Seedguard 在送給模型供應商前把它換成代號，真值只留在你的電腦上；遮罩出錯時改送不含內容的空白請求。模型只看得到代號，要用工具時也只能填代號。工具要執行前，只有三個條件同時成立才換回真值：人用 /seedguard arm 限時放行、這個工具在允許清單上、同一個聊天；否則參數還帶著鎖住的代號，pre_tool_call 擋下。限制：產生標題、壓縮對話這類輔助模型呼叫，Hermes 只讓插件旁觀，在終端機打進去的祕密仍可能被送出；放行期間，被注入指令的 agent 可以在允許的工具裡使用那個祕密。</desc><defs><marker id="p04-w-ms" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5F5B53"/></marker><marker id="p04-w-mr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#C0392B"/></marker><marker id="p04-w-mg" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2E8B57"/></marker><marker id="p04-w-mb" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F5F85"/></marker><marker id="p04-w-mo" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8A5D00"/></marker></defs><rect width="100%" height="100%" fill="#FFFDF9"/><circle cx="42" cy="40" r="17" fill="#E5A300"/><text x="42" y="46" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="70" y="47" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="22" font-weight="800" fill="#232020" text-anchor="start">Seedguard</text><text x="202.79999999999998" y="47" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="400" fill="#5F5B53" text-anchor="start">祕密不出門，只給代號</text><rect x="24" y="94" width="470" height="430" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><text x="44" y="124" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="800" fill="#8A5D00" text-anchor="start">你的電腦這一側：有真值</text><rect x="594" y="94" width="222" height="430" rx="10" fill="#E6F2F9" stroke="#1F5F85" stroke-width="1.5"/><text x="705" y="124" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="800" fill="#1F5F85" text-anchor="middle">模型供應商那一側</text><line x1="544" y1="94" x2="544" y2="524" stroke="#E5A300" stroke-width="3" stroke-dasharray="8 6"/><text x="544" y="542" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="700" fill="#8A5D00" text-anchor="middle">送出的界線</text><rect x="44" y="142" width="200" height="96" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><g transform="translate(60 154.0) scale(1)" fill="none" stroke="#232020" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16.555 3.843l3.602 3.602a2.877 2.877 0 0 1 0 4.069l-2.643 2.643a2.877 2.877 0 0 1 -4.069 0l-.301 -.301l-6.558 6.558a2 2 0 0 1 -1.239 .578l-.175 .008h-1.172a1 1 0 0 1 -.993 -.883l-.007 -.117v-1.172a2 2 0 0 1 .467 -1.284l.119 -.13l.414 -.414h2v-2h2v-2l2.144 -2.144l-.301 -.301a2.877 2.877 0 0 1 0 -4.069l2.643 -2.643a2.877 2.877 0 0 1 4.069 0"/><path d="M15 9h.01"/></g><text x="92" y="172.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#232020" text-anchor="start">含祕密的內容</text><text x="60" y="196.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">你的訊息、工具輸出</text><text x="60" y="218.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">種子碼、私鑰、API key</text><rect x="272" y="142" width="202" height="96" rx="10" fill="#FBF3DC" stroke="#E5A300" stroke-width="2.5"/><text x="288" y="172.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#232020" text-anchor="start">送出前換成代號</text><text x="288" y="196.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">真值留在這台電腦</text><text x="288" y="218.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">出錯就改送空白請求</text><rect x="610" y="142" width="190" height="118" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><g transform="translate(626 154.0) scale(1)" fill="none" stroke="#232020" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v4a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2l0 -4"/><path d="M12 2v2"/><path d="M9 12v9"/><path d="M15 12v9"/><path d="M5 16l4 -2"/><path d="M15 14l4 2"/><path d="M9 18h6"/><path d="M10 8v.01"/><path d="M14 8v.01"/></g><text x="658" y="172.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#232020" text-anchor="start">模型</text><text x="626" y="196.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">只看得到代號</text><text x="626" y="218.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">要用工具也只能</text><text x="626" y="240.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">填代號</text><polyline points="244,190 270,190" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#p04-w-ms)"/><polyline points="474,190 608,190" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#p04-w-ms)"/><rect x="507.0" y="170" width="68.0" height="20" rx="4" fill="#FFFDF9"/><text x="541" y="184" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="700" fill="#5F5B53" text-anchor="middle">只有代號</text><rect x="272" y="290" width="202" height="96" rx="10" fill="#FBF3DC" stroke="#E5A300" stroke-width="2.5"/><text x="288" y="320.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#232020" text-anchor="start">工具要執行前</text><text x="288" y="344.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">檢查三個條件</text><text x="288" y="366.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">全部成立才換回真值</text><polyline points="705,260 705,338 476,338" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#p04-w-ms)"/><rect x="540.5" y="316" width="143.0" height="20" rx="4" fill="#FFFDF9"/><text x="612" y="330" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="700" fill="#5F5B53" text-anchor="middle">工具呼叫（帶代號）</text><rect x="44" y="290" width="200" height="96" rx="10" fill="#EEF6F0" stroke="#2E8B57" stroke-width="2"/><g transform="translate(60 302.0) scale(1)" fill="none" stroke="#2E8B57" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"/><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/></g><text x="92" y="320.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#2E8B57" text-anchor="start">人放行</text><text x="60" y="344.2" font-family="Consolas,'Cascadia Mono','Segoe UI Mono',monospace" font-size="14" font-weight="400" fill="#8A5D00" text-anchor="start">/seedguard arm</text><text x="60" y="366.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">限時、限工具</text><polyline points="244,338 270,338" fill="none" stroke="#2E8B57" stroke-width="2" marker-end="url(#p04-w-mg)"/><rect x="44" y="410" width="200" height="94" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><rect x="44" y="410" width="6" height="94" rx="2" fill="#5F5B53"/><text x="68" y="450.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#5F5B53" text-anchor="start">✓ 換回真值</text><text x="68" y="474.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">交給允許的工具</text><rect x="272" y="410" width="202" height="94" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><rect x="272" y="410" width="6" height="94" rx="2" fill="#C0392B"/><text x="296" y="439.5" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#C0392B" text-anchor="start">✕ 擋下</text><text x="296" y="463.2" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="start">代號還鎖著，在</text><text x="296" y="485.2" font-family="Consolas,'Cascadia Mono','Segoe UI Mono',monospace" font-size="14" font-weight="400" fill="#8A5D00" text-anchor="start">pre_tool_call</text><polyline points="320,386 320,396 144,396 144,408" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#p04-w-ms)"/><polyline points="400,386 400,408" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#p04-w-mr)"/><rect x="24" y="564" width="792" height="98" rx="10" fill="#FCF1EF" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="6 5"/><text x="44" y="596" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="17" font-weight="800" fill="#C0392B" text-anchor="start">它的盲點（作者自己寫的）</text><text x="44" y="624" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#232020" text-anchor="start">✕ 產生標題、壓縮對話這類輔助模型呼叫，插件只能旁觀：在終端機打進去的祕密仍可能被送出</text><text x="44" y="648" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="400" fill="#232020" text-anchor="start">✕ 放行期間，被注入指令的 agent 可以在允許的工具裡使用那個祕密</text></svg>

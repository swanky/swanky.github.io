<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">/interrogate 的審查流程：多個模型挑毛病，一位主審下判斷</title><desc id="desc">依 interrogate 規格整理：先寫出意圖，兩個模型各自審查，合併並標出提出者，主審分成必須處理、值得考慮、記下就好、駁回四類，不自動修改程式碼。</desc><defs><marker id="a72ddda" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#72ddda" stroke-width="1.6"/></marker><marker id="af5cb78" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#f5cb78" stroke-width="1.6"/></marker><marker id="aff9a98" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#ff9a98" stroke-width="1.6"/></marker><marker id="ab6cbd4" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#b6cbd4" stroke-width="1.6"/></marker><marker id="a9be39b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#9be39b" stroke-width="1.6"/></marker></defs><rect width="1200" height="700" rx="24" fill="#081725"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="48" y="62" fill="#f4f5ef" font-size="34" font-weight="700" text-anchor="start">/interrogate：多個模型挑毛病，一位主審下判斷</text><text x="48" y="104" fill="#b6cbd4" font-size="23" font-weight="400" text-anchor="start">依規格整理｜對抗的訊號來自模型差異，不靠指派人設</text><rect x="48" y="150" width="250" height="190" rx="16" fill="#132d40" stroke="#72ddda" stroke-width="2"/><text x="70" y="192" fill="#72ddda" font-size="26" font-weight="700" text-anchor="start">1 寫出意圖</text><text x="70" y="234" fill="#f4f5ef" font-size="22" font-weight="400" text-anchor="start">這次改動</text><text x="70" y="264" fill="#f4f5ef" font-size="22" font-weight="400" text-anchor="start">想做到什麼</text><text x="70" y="310" fill="#b6cbd4" font-size="21" font-weight="400" text-anchor="start">不確定就先問你</text><rect x="352" y="150" width="250" height="88" rx="16" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="374" y="188" fill="#f4f5ef" font-size="24" font-weight="700" text-anchor="start">審查者 A</text><text x="374" y="222" fill="#b6cbd4" font-size="21" font-weight="400" text-anchor="start">預設 Opus 5.5</text><path d="M298 245 L344 194" stroke="#72ddda" stroke-width="2.4" fill="none" marker-end="url(#a72ddda)"/><path d="M602 194 L650 245" stroke="#72ddda" stroke-width="2.4" fill="none" marker-end="url(#a72ddda)"/><rect x="352" y="252" width="250" height="88" rx="16" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="374" y="290" fill="#f4f5ef" font-size="24" font-weight="700" text-anchor="start">審查者 B</text><text x="374" y="324" fill="#b6cbd4" font-size="21" font-weight="400" text-anchor="start">預設 Grok</text><path d="M298 245 L344 296" stroke="#72ddda" stroke-width="2.4" fill="none" marker-end="url(#a72ddda)"/><path d="M602 296 L650 245" stroke="#72ddda" stroke-width="2.4" fill="none" marker-end="url(#a72ddda)"/><rect x="656" y="150" width="230" height="190" rx="16" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="678" y="192" fill="#f4f5ef" font-size="26" font-weight="700" text-anchor="start">2 合併意見</text><text x="678" y="234" fill="#f4f5ef" font-size="22" font-weight="400" text-anchor="start">標出哪幾個</text><text x="678" y="264" fill="#f4f5ef" font-size="22" font-weight="400" text-anchor="start">模型提出</text><text x="678" y="310" fill="#b6cbd4" font-size="20" font-weight="400" text-anchor="start">兩個以上＝最高訊號</text><path d="M886 245 L930 245" stroke="#72ddda" stroke-width="2.4" fill="none" marker-end="url(#a72ddda)"/><rect x="936" y="150" width="216" height="190" rx="16" fill="#132d40" stroke="#f5cb78" stroke-width="2"/><text x="958" y="192" fill="#f5cb78" font-size="26" font-weight="700" text-anchor="start">3 主審判斷</text><text x="958" y="234" fill="#f4f5ef" font-size="22" font-weight="400" text-anchor="start">務實的</text><text x="958" y="264" fill="#f4f5ef" font-size="22" font-weight="400" text-anchor="start">資深工程師</text><text x="958" y="310" fill="#b6cbd4" font-size="20" font-weight="400" text-anchor="start">不是中立統計員</text><path d="M1044 340 L1044 372 L171 372" stroke="#f5cb78" stroke-width="2.4" fill="none"/><path d="M171 372 L171 404" stroke="#f5cb78" stroke-width="2.4" fill="none" marker-end="url(#af5cb78)"/><rect x="48" y="410" width="246" height="130" rx="16" fill="#132d40" stroke="#ff9a98" stroke-width="2"/><text x="72" y="460" fill="#ff9a98" font-size="27" font-weight="700" text-anchor="start">必須處理</text><text x="72" y="504" fill="#f4f5ef" font-size="22" font-weight="400" text-anchor="start">會擋下真實 PR</text><path d="M451 372 L451 404" stroke="#f5cb78" stroke-width="2.4" fill="none" marker-end="url(#af5cb78)"/><rect x="328" y="410" width="246" height="130" rx="16" fill="#132d40" stroke="#f5cb78" stroke-width="2"/><text x="352" y="460" fill="#f5cb78" font-size="27" font-weight="700" text-anchor="start">值得考慮</text><text x="352" y="504" fill="#f4f5ef" font-size="22" font-weight="400" text-anchor="start">交給你判斷</text><path d="M731 372 L731 404" stroke="#f5cb78" stroke-width="2.4" fill="none" marker-end="url(#af5cb78)"/><rect x="608" y="410" width="246" height="130" rx="16" fill="#132d40" stroke="#b6cbd4" stroke-width="2"/><text x="632" y="460" fill="#b6cbd4" font-size="27" font-weight="700" text-anchor="start">記下就好</text><text x="632" y="504" fill="#f4f5ef" font-size="22" font-weight="400" text-anchor="start">現在不必動</text><path d="M1011 372 L1011 404" stroke="#f5cb78" stroke-width="2.4" fill="none" marker-end="url(#af5cb78)"/><rect x="888" y="410" width="246" height="130" rx="16" fill="#132d40" stroke="#b6cbd4" stroke-width="2"/><text x="912" y="460" fill="#b6cbd4" font-size="27" font-weight="700" text-anchor="start">駁回</text><text x="912" y="504" fill="#f4f5ef" font-size="22" font-weight="400" text-anchor="start">附上簡短理由</text><rect x="48" y="576" width="1104" height="92" rx="16" fill="#0f2433" stroke="#72ddda" stroke-width="2"/><text x="72" y="614" fill="#72ddda" font-size="25" font-weight="700" text-anchor="start">程式碼不會被自動修改</text><text x="72" y="650" fill="#f4f5ef" font-size="22" font-weight="400" text-anchor="start">交出的是一份判決；要不要改、先改哪一條，由你決定</text></g></svg>
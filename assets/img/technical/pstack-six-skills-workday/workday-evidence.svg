<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1080" viewBox="0 0 960 1080" role="img" aria-labelledby="title desc"><title id="title">一天的六個指令，各自交出什麼證據</title><desc id="desc">照影片的一天順序排列六個 pstack 指令，並依各自規格列出完成時要交出的內容。</desc><defs><marker id="a72ddda" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#72ddda" stroke-width="1.6"/></marker><marker id="af5cb78" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#f5cb78" stroke-width="1.6"/></marker><marker id="aff9a98" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#ff9a98" stroke-width="1.6"/></marker><marker id="ab6cbd4" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#b6cbd4" stroke-width="1.6"/></marker><marker id="a9be39b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#9be39b" stroke-width="1.6"/></marker></defs><rect width="960" height="1080" rx="24" fill="#081725"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="32" y="60" fill="#f4f5ef" font-size="36" font-weight="700" text-anchor="start">一天的六個指令，各自交出什麼</text><text x="32" y="102" fill="#b6cbd4" font-size="24" font-weight="400" text-anchor="start">順序依影片｜「交出」依各指令的規格檔</text><rect x="32" y="140" width="432" height="252" rx="16" fill="#132d40" stroke="#72ddda" stroke-width="2"/><text x="56" y="182" fill="#b6cbd4" font-size="24" font-weight="400" text-anchor="start">1　早上開工</text><text x="56" y="230" fill="#72ddda" font-size="32" font-weight="700" text-anchor="start">/recall</text><text x="56" y="280" fill="#f4f5ef" font-size="28" font-weight="700" text-anchor="start">交出：現況簡報</text><text x="56" y="328" fill="#b6cbd4" font-size="23" font-weight="400" text-anchor="start">最多 5 點摘要</text><text x="56" y="364" fill="#b6cbd4" font-size="23" font-weight="400" text-anchor="start">每條工作線掛狀態＋下一步</text><rect x="496" y="140" width="432" height="252" rx="16" fill="#132d40" stroke="#72ddda" stroke-width="2"/><text x="520" y="182" fill="#b6cbd4" font-size="24" font-weight="400" text-anchor="start">2　修 bug</text><text x="520" y="230" fill="#72ddda" font-size="32" font-weight="700" text-anchor="start">/tdd</text><text x="520" y="280" fill="#f4f5ef" font-size="28" font-weight="700" text-anchor="start">交出：修前失敗、修後通過</text><text x="520" y="328" fill="#b6cbd4" font-size="23" font-weight="400" text-anchor="start">做不到就說明原因</text><text x="520" y="364" fill="#b6cbd4" font-size="23" font-weight="400" text-anchor="start">改用最接近的檢查</text><rect x="32" y="418" width="432" height="252" rx="16" fill="#132d40" stroke="#72ddda" stroke-width="2"/><text x="56" y="460" fill="#b6cbd4" font-size="24" font-weight="400" text-anchor="start">3　改完要審</text><text x="56" y="508" fill="#72ddda" font-size="32" font-weight="700" text-anchor="start">/interrogate</text><text x="56" y="558" fill="#f4f5ef" font-size="28" font-weight="700" text-anchor="start">交出：四類審查判決</text><text x="56" y="606" fill="#b6cbd4" font-size="23" font-weight="400" text-anchor="start">必須處理／值得考慮</text><text x="56" y="642" fill="#b6cbd4" font-size="23" font-weight="400" text-anchor="start">記下就好／駁回</text><rect x="496" y="418" width="432" height="252" rx="16" fill="#132d40" stroke="#72ddda" stroke-width="2"/><text x="520" y="460" fill="#b6cbd4" font-size="24" font-weight="400" text-anchor="start">4　審查之前</text><text x="520" y="508" fill="#72ddda" font-size="32" font-weight="700" text-anchor="start">/no-comments</text><text x="520" y="558" fill="#f4f5ef" font-size="28" font-weight="700" text-anchor="start">交出：刪除與保留清單</text><text x="520" y="606" fill="#b6cbd4" font-size="23" font-weight="400" text-anchor="start">自家程式的怪行為</text><text x="520" y="642" fill="#b6cbd4" font-size="23" font-weight="400" text-anchor="start">改標為「必須重構」</text><rect x="32" y="696" width="432" height="252" rx="16" fill="#132d40" stroke="#f5cb78" stroke-width="2"/><text x="56" y="738" fill="#b6cbd4" font-size="24" font-weight="400" text-anchor="start">5　收工之前</text><text x="56" y="786" fill="#f5cb78" font-size="25" font-weight="700" text-anchor="start">/create-verification-skill</text><text x="56" y="836" fill="#f4f5ef" font-size="28" font-weight="700" text-anchor="start">交出：可重跑的驗收流程</text><text x="56" y="884" fill="#b6cbd4" font-size="23" font-weight="400" text-anchor="start">啟動、操作、存證、清理</text><text x="56" y="920" fill="#b6cbd4" font-size="23" font-weight="400" text-anchor="start">沒跑過＝草稿</text><rect x="496" y="696" width="432" height="252" rx="16" fill="#132d40" stroke="#b6cbd4" stroke-width="2"/><text x="520" y="738" fill="#b6cbd4" font-size="24" font-weight="400" text-anchor="start">6　看不懂時</text><text x="520" y="786" fill="#b6cbd4" font-size="32" font-weight="700" text-anchor="start">/bro</text><text x="520" y="836" fill="#f4f5ef" font-size="28" font-weight="700" text-anchor="start">交出：一段白話</text><text x="520" y="884" fill="#b6cbd4" font-size="23" font-weight="400" text-anchor="start">別用術語</text><text x="520" y="920" fill="#b6cbd4" font-size="23" font-weight="400" text-anchor="start">像人跟人說話</text><text x="32" y="1008" fill="#f5cb78" font-size="24" font-weight="400" text-anchor="start">前五個交出的，都是別人不必相信你也能檢查的東西；</text><text x="32" y="1046" fill="#f5cb78" font-size="24" font-weight="400" text-anchor="start">/bro 交出的是理解。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">pstack 怎麼把一句需求，變成一套工程流程</title><desc id="desc">依 pstack 0.15.25 說明文件與 poteto-mode、bug-fix 規格整理：使用者以 /poteto-mode 描述任務，原則決定判斷標準，流程決定順序，技能負責各步驟動作。</desc><defs><marker id="a72ddda" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#72ddda" stroke-width="1.6"/></marker><marker id="af5cb78" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#f5cb78" stroke-width="1.6"/></marker><marker id="aff9a98" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#ff9a98" stroke-width="1.6"/></marker><marker id="ab6cbd4" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#b6cbd4" stroke-width="1.6"/></marker><marker id="a9be39b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#9be39b" stroke-width="1.6"/></marker></defs><rect width="1200" height="720" rx="24" fill="#081725"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="48" y="62" fill="#f4f5ef" font-size="36" font-weight="700" text-anchor="start">pstack 怎麼把一句需求，變成一套工程流程</text><text x="48" y="104" fill="#b6cbd4" font-size="23" font-weight="400" text-anchor="start">依 0.15.25 規格整理｜以修 bug 為例</text><rect x="48" y="150" width="300" height="172" rx="16" fill="#132d40" stroke="#72ddda" stroke-width="2"/><text x="72" y="196" fill="#72ddda" font-size="24" font-weight="700" text-anchor="start">你只說一句</text><text x="72" y="238" fill="#f4f5ef" font-size="26" font-weight="700" text-anchor="start">/poteto-mode</text><text x="72" y="282" fill="#f4f5ef" font-size="24" font-weight="400" text-anchor="start">修好這個 bug</text><rect x="418" y="150" width="232" height="172" rx="16" fill="#132d40" stroke="#f5cb78" stroke-width="2"/><text x="440" y="192" fill="#f5cb78" font-size="26" font-weight="700" text-anchor="start">24 條原則</text><text x="440" y="228" fill="#b6cbd4" font-size="22" font-weight="400" text-anchor="start">怎麼判斷</text><text x="440" y="266" fill="#f4f5ef" font-size="22" font-weight="400" text-anchor="start">能刪就不加</text><text x="440" y="302" fill="#f4f5ef" font-size="22" font-weight="400" text-anchor="start">做完要證明能用</text><rect x="676" y="150" width="232" height="172" rx="16" fill="#132d40" stroke="#72ddda" stroke-width="2"/><text x="698" y="192" fill="#72ddda" font-size="26" font-weight="700" text-anchor="start">23 套流程</text><text x="698" y="228" fill="#b6cbd4" font-size="22" font-weight="400" text-anchor="start">照什麼順序</text><text x="698" y="266" fill="#f4f5ef" font-size="22" font-weight="400" text-anchor="start">選中：修 bug</text><text x="698" y="302" fill="#f4f5ef" font-size="22" font-weight="400" text-anchor="start">步驟抄成待辦</text><rect x="934" y="150" width="232" height="172" rx="16" fill="#132d40" stroke="#9be39b" stroke-width="2"/><text x="956" y="192" fill="#9be39b" font-size="26" font-weight="700" text-anchor="start">30 個技能</text><text x="956" y="228" fill="#b6cbd4" font-size="22" font-weight="400" text-anchor="start">具體做什麼</text><text x="956" y="266" fill="#f4f5ef" font-size="22" font-weight="400" text-anchor="start">/how　/why</text><text x="956" y="302" fill="#f4f5ef" font-size="22" font-weight="400" text-anchor="start">/architect　/tdd</text><path d="M348 236 L410 236" stroke="#72ddda" stroke-width="2.4" fill="none" marker-end="url(#a72ddda)"/><text x="48" y="372" fill="#72ddda" font-size="26" font-weight="700" text-anchor="start">修 bug 流程（bug-fix playbook）</text><rect x="48" y="400" width="200" height="150" rx="16" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="68" y="442" fill="#f4f5ef" font-size="25" font-weight="700" text-anchor="start">1 重現</text><text x="68" y="484" fill="#b6cbd4" font-size="22" font-weight="400" text-anchor="start">在使用者會</text><text x="68" y="516" fill="#b6cbd4" font-size="22" font-weight="400" text-anchor="start">碰到的地方</text><path d="M248 475 L270 475" stroke="#72ddda" stroke-width="2.4" fill="none" marker-end="url(#a72ddda)"/><rect x="274" y="400" width="200" height="150" rx="16" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="294" y="442" fill="#f4f5ef" font-size="25" font-weight="700" text-anchor="start">2 找原因</text><text x="294" y="484" fill="#b6cbd4" font-size="22" font-weight="400" text-anchor="start">/how　/why</text><text x="294" y="516" fill="#b6cbd4" font-size="22" font-weight="400" text-anchor="start">逐一排除假設</text><path d="M474 475 L496 475" stroke="#72ddda" stroke-width="2.4" fill="none" marker-end="url(#a72ddda)"/><rect x="500" y="400" width="200" height="150" rx="16" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="520" y="442" fill="#f4f5ef" font-size="25" font-weight="700" text-anchor="start">3 規劃修法</text><text x="520" y="484" fill="#b6cbd4" font-size="22" font-weight="400" text-anchor="start">跨函式先</text><text x="520" y="516" fill="#b6cbd4" font-size="22" font-weight="400" text-anchor="start">/architect</text><path d="M700 475 L722 475" stroke="#72ddda" stroke-width="2.4" fill="none" marker-end="url(#a72ddda)"/><rect x="726" y="400" width="200" height="150" rx="16" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="746" y="442" fill="#f4f5ef" font-size="25" font-weight="700" text-anchor="start">4 驗證</text><text x="746" y="484" fill="#b6cbd4" font-size="22" font-weight="400" text-anchor="start">原本的重現</text><text x="746" y="516" fill="#b6cbd4" font-size="22" font-weight="400" text-anchor="start">現在通過</text><path d="M926 475 L948 475" stroke="#72ddda" stroke-width="2.4" fill="none" marker-end="url(#a72ddda)"/><rect x="952" y="400" width="200" height="150" rx="16" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="972" y="442" fill="#f4f5ef" font-size="25" font-weight="700" text-anchor="start">5 整理提交</text><text x="972" y="484" fill="#b6cbd4" font-size="22" font-weight="400" text-anchor="start">失敗的重現</text><text x="972" y="516" fill="#b6cbd4" font-size="22" font-weight="400" text-anchor="start">先進紀錄</text><rect x="48" y="584" width="1104" height="96" rx="16" fill="#1d2a2c" stroke="#f5cb78" stroke-width="2"/><text x="72" y="624" fill="#f5cb78" font-size="25" font-weight="700" text-anchor="start">每一步都受原則約束</text><text x="72" y="660" fill="#f4f5ef" font-size="22" font-weight="400" text-anchor="start">回覆時要點名：哪條原則改變了哪個決定；只能引用這次真的讀過的原則</text></g></svg>
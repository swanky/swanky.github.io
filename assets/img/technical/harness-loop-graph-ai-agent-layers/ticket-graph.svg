<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 466" width="840" height="466" role="img" aria-labelledby="graph-w-t graph-w-d"><title id="graph-w-t">把一張任務單改畫成工作圖：只畫真的相依的箭頭</title><desc id="graph-w-d">問題單先界定範圍，接著修登入驗證、稽核帳務、稽核管理功能、更新文件四件事平行跑，各自有自己的迴圈與上下文；結果用一般程式合併，再經過依復原代價設定的驗收關卡，最後才開 PR。</desc><defs><marker id="graph-w-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5F5B53"/></marker></defs><rect width="100%" height="100%" fill="#FFFDF9"/><text x="420" y="36" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="800" fill="#232020" text-anchor="middle">只畫真的相依的箭頭，其他全部平行</text><rect x="20" y="186" width="88" height="48" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><text x="64.0" y="216.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="800" fill="#232020" text-anchor="middle">問題單</text><rect x="132" y="186" width="96" height="48" rx="10" fill="#fff" stroke="rgba(66,52,32,0.18)" stroke-width="1.5"/><text x="180.0" y="216.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="800" fill="#232020" text-anchor="middle">界定範圍</text><line x1="108" y1="210" x2="128" y2="210" stroke="#5F5B53" stroke-width="2" marker-end="url(#graph-w-a)"/><rect x="290" y="70" width="150" height="52" rx="10" fill="#FCF1EF" stroke="#D0573A" stroke-width="2"/><text x="365.0" y="102.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="800" fill="#D0573A" text-anchor="middle">修登入驗證 ↻</text><line x1="228" y1="210" x2="286" y2="96" stroke="#5F5B53" stroke-width="2" marker-end="url(#graph-w-a)"/><line x1="440" y1="96" x2="508" y2="210" stroke="#5F5B53" stroke-width="2" marker-end="url(#graph-w-a)"/><rect x="290" y=
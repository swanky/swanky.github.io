<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1778" width="400" height="1778" role="img" aria-labelledby="ly-m-title ly-m-desc" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif">
<title id="ly-m-title">Agent 付款的四層：各管一層還是互相競爭</title>
<desc id="ly-m-desc">四層由上到下。第 1 層找商品與下單（Agent 怎麼看懂店裡有什麼、怎麼下單）：ACP（OpenAI、Stripe）、UCP（Google、Shopify）、Copilot Checkout（Microsoft）、PayPal Store Sync。第 2 層授權（人同意它買什麼、最多花多少）：AP2 的授權憑證（Google，已捐給 FIDO Alliance，兩邊都接）、Verifiable Intent（Mastercard）、Shared Payment Token（Stripe，兩邊都接）。第 3 層身分（這個 Agent 是誰、可不可信）：Trusted Agent Protocol（Visa）、Web Bot Auth（Cloudflare）、ERC-8004（以太坊，草案）、KYAPay（Skyfire，草案），這三張不分付款方式。第 4 層付款與結算（錢實際怎麼過去）：卡網路（Visa、Mastercard、American Express）、x402（穩定幣）、MPP（Stripe、Tempo；卡與穩定幣，兩邊都接）。卡片顏色區分卡與平台路線、穩定幣路線、兩邊都接，以及不分付款方式。多數方案各管一層；同一層正面較勁的只有少數幾組。分層是作者的整理，不是官方分類。</desc>

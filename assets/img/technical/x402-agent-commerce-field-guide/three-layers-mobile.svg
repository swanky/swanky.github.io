<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 898" width="400" height="898" role="img" aria-labelledby="tl-m-title tl-m-desc" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif">
<title id="tl-m-title">付款、收據、NFT 是三層不同的事</title>
<desc id="tl-m-desc">作者依官方概念整理的三層：付款層是 x402 加 USDC，回答誰付了多少、在哪條鏈；存證層是賣方簽章的收據，回答這筆錢買的是哪個商品、哪個版本；權利層是 NFT 或授權憑證，回答現在誰有權使用。查一次資料只需要付款層，買一份報告、之後還要重新下載，要加上存證層與賣方的訂單紀錄，可轉讓、或要讓別家服務驗證的使用權才需要權利層，所以不必每筆交易都發 NFT。NFT 轉手後原始付款人不變，持有 NFT 也不等於取得著作權。</desc>
<defs><marker id="tl-m-a" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8z" fill="#5F5B53"/></marker><marker id="tl-m-acc" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8z" fill="#E5A300"/></marker><marker id="tl-m-gray" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8z" fill="#8F8A80"/></marker><marker id="tl-m-blue" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8z" fill="#4FA6D5"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFDF9"/>
<text x="24" y="40" font-size="20" font-weight="700" fill="#232020">不必每筆交易都發 NFT。</text>
<rect x="292" y="22" width="80" height="28" rx="14" fill="#FDF4DC" stroke="#E5A300" stroke-width="1.2"/>
<text x="332.0" y="41.04" font-size="14" font-weight="700" fill="#8A5D00" text-anchor="middle">作者整理</text>
<rect x="24" y="64" width="352" height="108" rx="10" fill="#FFFFFF" stroke="rgba(66,52,32,0.22)" stroke-width="1.5"/>
<g transform="translate(40,80)" fill="none" stroke="#8A5D00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.8 4.5v9l-7.8 4.5l-7.8 -4.5v-9z"/><path d="M12 8l3.5 2v4l-3.5 2l-3.5 -2v-4z"/></g>
<text x="74" y="99" font-size="18" font-weight="700" fill="#232020">權利層</text>
<text x="360" y="99" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="end">第 3 層</text>
<text x="40" y="126" font-size="15" font-weight="400" fill="#5F5B53">NFT 或授權憑證</text>
<text x="40" y="152" font-size="15" font-weight="400" fill="#232020">回答：現在誰有權使用</text>
<rect x="24" y="182" width="352" height="130" rx="10" fill="#FFFFFF" stroke="rgba(66,52,32,0.22)" stroke-width="1.5"/>
<g transform="translate(40,198)" fill="none" stroke="#8A5D00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21v-16a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v16l-3 -2l-2 2l-2 -2l-2 2l-2 -2l-3 2"/><path d="M9 7h6"/><path d="M9 11h6"/><path d="M9 15h4"/></g>
<text x="74" y="217" font-size="18" font-weight="700" fill="#232020">存證層</text>
<text x="360" y="217" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="end">第 2 層</text>
<text x="40" y="244" font-size="15" font-weight="400" fill="#5F5B53">賣方簽章的收據</text>
<text x="40" y="270" font-size="15" font-weight="400" fill="#232020">回答：賣方承諾這筆錢買的是</text>
<text x="40" y="292" font-size="15" font-weight="400" fill="#232020">哪個商品、哪個版本</text>
<rect x="24" y="322" width="352" height="108" rx="10" fill="#FFFFFF" stroke="rgba(66,52,32,0.22)" stroke-width="1.5"/>
<g transform="translate(40,338)" fill="none" stroke="#8A5D00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path d="M14.8 9a2 2 0 0 0 -1.8 -1h-2a2 2 0 1 0 0 4h2a2 2 0 1 1 0 4h-2a2 2 0 0 1 -1.8 -1"/><path d="M12 7v10"/></g>
<text x="74" y="357" font-size="18" font-weight="700" fill="#232020">付款層</text>
<text x="360" y="357" font-size="15" font-weight="400" fill="#5F5B53" text-anchor="end">第 1 層</text>
<text x="40" y="384" font-size="15" font-weight="400" fill="#5F5B53">x402 加 USDC</text>
<text x="40" y="410" font-size="15" font-weight="400" fill="#232020">回答：誰付了多少、在哪條鏈</text>
<text x="24" y="470" font-size="18" font-weight="700" fill="#232020">對應情境</text>
<text x="24" y="512" font-size="16" font-weight="700" fill="#232020">查一次資料</text>
<text x="24" y="536" font-size="15" font-weight="400" fill="#8A5D00">只需要付款層</text>
<rect x="196" y="500" width="52" height="32" rx="8" fill="#FDF4DC" stroke="#E5A300" stroke-width="1.5"/>
<text x="222" y="522" font-size="15" font-weight="700" fill="#8A5D00" text-anchor="middle">付款</text>
<rect x="256" y="500" width="52" height="32" rx="8" fill="#FFFDF9" stroke="#8F8A80" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="282" y="522" font-size="15" font-weight="400" fill="#8F8A80" text-anchor="middle">存證</text>
<rect x="316" y="500" width="52" height="32" rx="8" fill="#FFFDF9" stroke="#8F8A80" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="342" y="522" font-size="15" font-weight="400" fill="#8F8A80" text-anchor="middle">權利</text>
<text x="24" y="602" font-size="16" font-weight="700" fill="#232020">買一份報告、</text>
<text x="24" y="624" font-size="16" font-weight="700" fill="#232020">之後還要重新下載</text>
<text x="24" y="648" font-size="15" font-weight="400" fill="#8A5D00">加上存證層與</text>
<text x="24" y="670" font-size="15" font-weight="400" fill="#8A5D00">賣方的訂單紀錄</text>
<rect x="196" y="590" width="52" height="32" rx="8" fill="#FDF4DC" stroke="#E5A300" stroke-width="1.5"/>
<text x="222" y="612" font-size="15" font-weight="700" fill="#8A5D00" text-anchor="middle">付款</text>
<rect x="256" y="590" width="52" height="32" rx="8" fill="#FDF4DC" stroke="#E5A300" stroke-width="1.5"/>
<text x="282" y="612" font-size="15" font-weight="700" fill="#8A5D00" text-anchor="middle">存證</text>
<rect x="316" y="590" width="52" height="32" rx="8" fill="#FFFDF9" stroke="#8F8A80" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="342" y="612" font-size="15" font-weight="400" fill="#8F8A80" text-anchor="middle">權利</text>
<text x="24" y="736" font-size="16" font-weight="700" fill="#232020">可轉讓、或要讓別家</text>
<text x="24" y="758" font-size="16" font-weight="700" fill="#232020">服務驗證的使用權</text>
<text x="24" y="782" font-size="15" font-weight="400" fill="#8A5D00">才需要權利層</text>
<rect x="196" y="724" width="52" height="32" rx="8" fill="#FDF4DC" stroke="#E5A300" stroke-width="1.5"/>
<text x="222" y="746" font-size="15" font-weight="700" fill="#8A5D00" text-anchor="middle">付款</text>
<rect x="256" y="724" width="52" height="32" rx="8" fill="#FDF4DC" stroke="#E5A300" stroke-width="1.5"/>
<text x="282" y="746" font-size="15" font-weight="700" fill="#8A5D00" text-anchor="middle">存證</text>
<rect x="316" y="724" width="52" height="32" rx="8" fill="#FDF4DC" stroke="#E5A300" stroke-width="1.5"/>
<text x="342" y="746" font-size="15" font-weight="700" fill="#8A5D00" text-anchor="middle">權利</text>
<rect x="24" y="835" width="3" height="44" fill="#E5A300"/>
<text x="36" y="850" font-size="15" font-weight="400" fill="#232020">NFT 轉手後，原始付款人不變；</text>
<text x="36" y="873" font-size="15" font-weight="400" fill="#232020">持有 NFT 也不等於取得著作權。</text>
</svg>

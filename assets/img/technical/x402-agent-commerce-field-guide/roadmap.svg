<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 476" width="1088" height="476" role="img" aria-labelledby="rm-w-title rm-w-desc" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif">
<title id="rm-w-title">接上 x402 的五個階段</title>
<desc id="rm-w-desc">作者規劃的五個階段與過關條件：測試網付第一筆、私有內容與訂單、NFT 授權、讓 Agent 找得到、正式主網；目前在第 1 階段，賣方程式已在本機回出 402 與正確報價，還沒付過任何一筆。先證明一筆，再往上疊。</desc>
<defs><marker id="rm-w-a" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8z" fill="#5F5B53"/></marker><marker id="rm-w-acc" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8z" fill="#E5A300"/></marker><marker id="rm-w-gray" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8z" fill="#8F8A80"/></marker><marker id="rm-w-blue" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8z" fill="#4FA6D5"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFDF9"/>
<text x="24" y="42" font-size="22" font-weight="700" fill="#232020">先證明一筆，再往上疊。</text>
<rect x="984" y="22" width="80" height="28" rx="14" fill="#FDF4DC" stroke="#E5A300" stroke-width="1.2"/>
<text x="1024.0" y="41.04" font-size="14" font-weight="700" fill="#8A5D00" text-anchor="middle">作者規劃</text>
<line x1="217" y1="140" x2="235" y2="140" stroke="#5F5B53" stroke-width="2" marker-end="url(#rm-w-a)"/>
<line x1="429" y1="140" x2="447" y2="140" stroke="#5F5B53" stroke-width="2" marker-end="url(#rm-w-a)"/>
<line x1="641" y1="140" x2="659" y2="140" stroke="#5F5B53" stroke-width="2" marker-end="url(#rm-w-a)"/>
<line x1="853" y1="140" x2="871" y2="140" stroke="#5F5B53" stroke-width="2" marker-end="url(#rm-w-a)"/>
<line x1="120" y1="344" x2="120" y2="376" stroke="#E5A300" stroke-width="2"/>
<rect x="24" y="108" width="192" height="236" rx="10" fill="#FDF4DC" stroke="#E5A300" stroke-width="2"/>
<circle cx="56" cy="140" r="16" fill="#E5A300"/>
<text x="56" y="145.76" font-size="16" font-weight="700" fill="#232020" text-anchor="middle">1</text>
<g transform="translate(174,127) scale(1.08333)" fill="none" stroke="#8A5D00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path d="M14.8 9a2 2 0 0 0 -1.8 -1h-2a2 2 0 1 0 0 4h2a2 2 0 1 1 0 4h-2a2 2 0 0 1 -1.8 -1"/><path d="M12 7v10"/></g>
<text x="40" y="192" font-size="20" font-weight="700" fill="#232020">測試網付第一筆</text>
<text x="40" y="224" font-size="14" font-weight="700" fill="#8A5D00">過關條件</text>
<text x="40" y="252" font-size="16" font-weight="400" fill="#232020">沒付錢得到 402，</text>
<text x="40" y="276" font-size="16" font-weight="400" fill="#232020">付了得到 200，</text>
<text x="40" y="300" font-size="16" font-weight="400" fill="#232020">鏈上查得到轉帳</text>
<rect x="236" y="108" width="192" height="236" rx="10" fill="#FFFFFF" stroke="rgba(66,52,32,0.22)" stroke-width="1.5"/>
<circle cx="268" cy="140" r="16" fill="#232020"/>
<text x="268" y="145.76" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<g transform="translate(386,127) scale(1.08333)" fill="none" stroke="#5F5B53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6" /> <path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0" /> <path d="M8 11v-4a4 4 0 1 1 8 0v4" /></g>
<text x="252" y="192" font-size="20" font-weight="700" fill="#232020">私有內容與訂單</text>

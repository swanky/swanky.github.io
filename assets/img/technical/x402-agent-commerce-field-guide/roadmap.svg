<text x="252" y="252" font-size="16" font-weight="400" fill="#232020">付費內容沒有</text>
<text x="252" y="276" font-size="16" font-weight="400" fill="#232020">公開的繞道，</text>
<text x="252" y="300" font-size="16" font-weight="400" fill="#232020">付款後可再查詢、</text>
<text x="252" y="324" font-size="16" font-weight="400" fill="#232020">可對帳</text>
<rect x="448" y="108" width="192" height="236" rx="10" fill="#FFFFFF" stroke="rgba(66,52,32,0.22)" stroke-width="1.5"/>
<circle cx="480" cy="140" r="16" fill="#232020"/>
<text x="480" y="145.76" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<g transform="translate(598,127) scale(1.08333)" fill="none" stroke="#5F5B53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.8 4.5v9l-7.8 4.5l-7.8 -4.5v-9z"/><path d="M12 8l3.5 2v4l-3.5 2l-3.5 -2v-4z"/></g>
<text x="464" y="192" font-size="20" font-weight="700" fill="#232020">NFT 授權</text>
<text x="464" y="224" font-size="14" font-weight="700" fill="#5F5B53">過關條件</text>
<text x="464" y="252" font-size="16" font-weight="400" fill="#232020">一張訂單只發</text>
<text x="464" y="276" font-size="16" font-weight="400" fill="#232020">一次憑證，</text>
<text x="464" y="300" font-size="16" font-weight="400" fill="#232020">重試不會重複發</text>
<rect x="660" y="108" width="192" height="236" rx="10" fill="#FFFFFF" stroke="rgba(66,52,32,0.22)" stroke-width="1.5"/>
<circle cx="692" cy="140" r="16" fill="#232020"/>
<text x="692" y="145.76" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<g transform="translate(810,127) scale(1.08333)" fill="none" stroke="#5F5B53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v4a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2l0 -4" /> <path d="M12 2v2" /> <path d="M9 12v9" /> <path d="M15 12v9" /> <path d="M5 16l4 -2" /> <path d="M15 14l4 2" /> <path d="M9 18h6" /> <path d="M10 8v.01" /> <path d="M14 8v.01" /></g>
<text x="676" y="192" font-size="20" font-weight="700" fill="#232020">讓 Agent 找得到</text>
<text x="676" y="224" font-size="14" font-weight="700" fill="#5F5B53">過關條件</text>
<text x="676" y="252" font-size="16" font-weight="400" fill="#232020">至少兩種不同的</text>
<text x="676" y="276" font-size="16" font-weight="400" fill="#232020">Agent 工具能</text>
<text x="676" y="300" font-size="16" font-weight="400" fill="#232020">完成整個購買</text>
<rect x="872" y="108" width="192" height="236" rx="10" fill="#FFFFFF" stroke="rgba(66,52,32,0.22)" stroke-width="1.5"/>
<circle cx="904" cy="140" r="16" fill="#232020"/>
<text x="904" y="145.76" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<g transform="translate(1022,127) scale(1.08333)" fill="none" stroke="#5F5B53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21v-17"/><path d="M5 4h11l-2 4l2 4h-11"/></g>
<text x="888" y="192" font-size="20" font-weight="700" fill="#232020">正式主網</text>
<text x="888" y="224" font-size="14" font-weight="700" fill="#5F5B53">過關條件</text>
<text x="888" y="252" font-size="16" font-weight="400" fill="#232020">收款、限額、</text>
<text x="888" y="276" font-size="16" font-weight="400" fill="#232020">條款、監控</text>
<text x="888" y="300" font-size="16" font-weight="400" fill="#232020">都驗收過</text>
<rect x="24" y="66" width="84" height="30" rx="15" fill="#E5A300" stroke="#E5A300" stroke-width="1.2"/>
<text x="66.0" y="86.4" font-size="15" font-weight="700" fill="#232020" text-anchor="middle">目前進度</text>
<rect x="24" y="376" width="520" height="76" rx="8" fill="#FDF4DC" stroke="#E5A300" stroke-width="1.5"/>
<text x="44" y="404" font-size="15" font-weight="700" fill="#8A5D00">目前進度（2026-11-28 本機實測）</text>
<text x="44" y="432" font-size="16" font-weight="400" fill="#232020">賣方程式已在本機回出 402 與正確報價；還沒付過任何一筆。</text>

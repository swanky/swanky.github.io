<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1280" width="400" height="1280" role="img" aria-labelledby="bp-m-title bp-m-desc" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif">
<title id="bp-m-title">買方付款的三條路</title>
<desc id="bp-m-desc">作者規劃的三條買方付款路線：先用官方開發套件寫付款腳本、由自己的測試錢包簽名；再拿現成的付款工具接上 AI Agent 對照，由該工具管理的錢包簽名，但要注意它支援的鏈與地區；最後才考慮自己做付款閘道，人在外部頁面核准後由閘道背後的獨立錢包服務簽名，工程最大。跑這條測試流程，三條路都要有：有測試用 USDC、能簽名的錢包，寫在程式裡的支出上限，以及人的核准或事先授權；模型不拿私鑰，付款能力在工具層。</desc>
<defs><marker id="bp-m-a" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8z" fill="#5F5B53"/></marker><marker id="bp-m-acc" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8z" fill="#E5A300"/></marker><marker id="bp-m-gray" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8z" fill="#8F8A80"/></marker><marker id="bp-m-blue" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8z" fill="#4FA6D5"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFDF9"/>
<text x="24" y="38" font-size="20" font-weight="700" fill="#232020">模型不拿私鑰，</text>
<text x="24" y="66" font-size="20" font-weight="700" fill="#232020">付款能力在工具層。</text>
<rect x="292" y="48" width="80" height="28" rx="14" fill="#FDF4DC" stroke="#E5A300" stroke-width="1.2"/>
<text x="332.0" y="67.04" font-size="14" font-weight="700" fill="#8A5D00" text-anchor="middle">作者規劃</text>
<rect x="24" y="100" width="352" height="300" rx="10" fill="#FDF4DC" stroke="#E5A300" stroke-width="2"/>
<circle cx="54" cy="132" r="15" fill="#E5A300"/>
<text x="54" y="137.4" font-size="15" font-weight="700" fill="#232020" text-anchor="middle">A</text>
<text x="78" y="138" font-size="18" font-weight="700" fill="#232020">程式直接付</text>
<rect x="308" y="118" width="52" height="28" rx="14" fill="#E5A300" stroke="#E5A300" stroke-width="1.2"/>
<text x="334.0" y="137.04" font-size="14" font-weight="700" fill="#232020" text-anchor="middle">先做</text>
<line x1="40" y1="160" x2="360" y2="160" stroke="rgba(66,52,32,0.22)" stroke-width="1"/>
<text x="40" y="186" font-size="15" font-weight="700" fill="#8A5D00">做法</text>
<text x="40" y="210" font-size="15" font-weight="400" fill="#232020">用官方開發套件寫一支付款腳本</text>
<text x="40" y="244" font-size="15" font-weight="700" fill="#8A5D00">誰簽名</text>
<text x="40" y="268" font-size="15" font-weight="400" fill="#232020">自己的測試錢包</text>
<text x="40" y="302" font-size="15" font-weight="700" fill="#8A5D00">優點</text>
<text x="40" y="326" font-size="15" font-weight="400" fill="#232020">買賣兩邊的條件都在自己手上</text>
<text x="40" y="360" font-size="15" font-weight="700" fill="#8A5D00">適合</text>
<text x="40" y="384" font-size="15" font-weight="400" fill="#232020">第一筆測試</text>
<line x1="200" y1="400" x2="200" y2="430" stroke="#5F5B53" stroke-width="1.8" stroke-dasharray="6,5" marker-end="url(#bp-m-a)"/>
<rect x="24" y="432" width="352" height="264" rx="10" fill="#FFFFFF" stroke="rgba(66,52,32,0.22)" stroke-width="1.5"/>
<circle cx="54" cy="464" r="15" fill="#232020"/>
<text x="54" y="469.4" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">B</text>
<text x="78" y="470" font-size="18" font-weight="700" fill="#232020">現成的付款工具</text>
<rect x="280" y="450" width="80" height="28" rx="14" fill="#FFFFFF" stroke="rgba(66,52,32,0.22)" stroke-width="1.2"/>
<text x="320.0" y="469.04" font-size="14" font-weight="700" fill="#5F5B53" text-anchor="middle">拿來對照</text>
<line x1="40" y1="492" x2="360" y2="492" stroke="rgba(66,52,32,0.22)" stroke-width="1"/>
<text x="40" y="518" font-size="15" font-weight="700" fill="#5F5B53">做法</text>
<text x="40" y="542" font-size="15" font-weight="400" fill="#232020">把別人做好的付款工具接到 AI Agent 上</text>
<text x="40" y="576" font-size="15" font-weight="700" fill="#5F5B53">誰簽名</text>
<text x="40" y="600" font-size="15" font-weight="400" fill="#232020">該工具管理的錢包</text>
<text x="40" y="634" font-size="15" font-weight="700" fill="#5F5B53">要注意</text>
<text x="40" y="658" font-size="15" font-weight="400" fill="#232020">它支援哪條鏈、哪些地區，</text>
<text x="40" y="680" font-size="15" font-weight="400" fill="#232020">不一定能付你的服務</text>
<line x1="200" y1="696" x2="200" y2="726" stroke="#5F5B53" stroke-width="1.8" stroke-dasharray="6,5" marker-end="url(#bp-m-a)"/>
<rect x="24" y="728" width="352" height="264" rx="10" fill="#FFFFFF" stroke="rgba(66,52,32,0.22)" stroke-width="1.5"/>
<circle cx="54" cy="760" r="15" fill="#232020"/>
<text x="54" y="765.4" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">C</text>
<text x="78" y="766" font-size="18" font-weight="700" fill="#232020">自己做付款閘道</text>
<rect x="264" y="746" width="96" height="28" rx="14" fill="#FFFFFF" stroke="rgba(66,52,32,0.22)" stroke-width="1.2"/>
<text x="312.0" y="765.04" font-size="14" font-weight="700" fill="#5F5B53" text-anchor="middle">最後才考慮</text>
<line x1="40" y1="788" x2="360" y2="788" stroke="rgba(66,52,32,0.22)" stroke-width="1"/>
<text x="40" y="814" font-size="15" font-weight="700" fill="#5F5B53">做法</text>
<text x="40" y="838" font-size="15" font-weight="400" fill="#232020">聊天型助理透過連接器呼叫你的閘道；</text>
<text x="40" y="860" font-size="15" font-weight="400" fill="#232020">人在外部頁面按核准</text>
<text x="40" y="894" font-size="15" font-weight="700" fill="#5F5B53">誰簽名</text>
<text x="40" y="918" font-size="15" font-weight="400" fill="#232020">閘道背後的獨立錢包服務</text>
<text x="40" y="952" font-size="15" font-weight="700" fill="#5F5B53">要注意</text>
<text x="40" y="976" font-size="15" font-weight="400" fill="#232020">工程最大，等於自己營運錢包服務</text>
<rect x="24" y="1016" width="352" height="240" rx="10" fill="#FAF5EA" stroke="rgba(66,52,32,0.22)" stroke-width="1.5"/>
<text x="40" y="1050" font-size="18" font-weight="700" fill="#232020">跑這條測試流程，三條路都要有</text>
<rect x="40" y="1068" width="320" height="48" rx="8" fill="#FFFFFF" stroke="rgba(66,52,32,0.22)" stroke-width="1.5"/>
<g transform="translate(54,1080)" fill="none" stroke="#8A5D00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8v-3a1 1 0 0 0 -1 -1h-10a2 2 0 0 0 0 4h12a1 1 0 0 1 1 1v3m0 4v3a1 1 0 0 1 -1 1h-12a2 2 0 0 1 -2 -2v-12"/><path d="M20 12v4h-4a2 2 0 0 1 0 -4h4"/></g>
<text x="88" y="1098" font-size="17" font-weight="700" fill="#232020">有測試用 USDC、能簽名的錢包</text>
<rect x="40" y="1128" width="320" height="48" rx="8" fill="#FFFFFF" stroke="rgba(66,52,32,0.22)" stroke-width="1.5"/>
<g transform="translate(54,1140)" fill="none" stroke="#8A5D00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 16a9 9 0 1 1 17 0"/><path d="M12 13l4 -4"/><path d="M11 13a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/></g>
<text x="88" y="1158" font-size="17" font-weight="700" fill="#232020">寫在程式裡的支出上限</text>
<rect x="40" y="1188" width="320" height="48" rx="8" fill="#FFFFFF" stroke="rgba(66,52,32,0.22)" stroke-width="1.5"/>
<g transform="translate(54,1200)" fill="none" stroke="#8A5D00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" /> <path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" /></g>
<text x="88" y="1218" font-size="17" font-weight="700" fill="#232020">人的核准或事先授權</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 992" width="400" height="992" role="img" aria-labelledby="sj-m-title sj-m-desc" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif">
<title id="sj-m-title">AI 幫我買東西，哪一步是我自己來</title>
<desc id="sj-m-desc">六步由左到右：問（「幫我找 500–600 左右的」）、找（AI 上網查，列出八款與當天價格）、比（AI 排順序、給建議）、查（「這個是正版的嗎？」AI 查授權公告）、試（「真人戴起來會長怎樣？」AI 生一張試戴圖），這五步 AI 做；第六步付（到購物網站結帳）還是人自己來，第五步之後換成人。前五步 AI 都做了，付款是我自己來。依據：作者與 ChatGPT 的兩段對話（2026-11-28）。</desc>
<defs><marker id="sj-m-a" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8z" fill="#5F5B53"/></marker><marker id="sj-m-acc" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8z" fill="#E5A300"/></marker><marker id="sj-m-blue" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8z" fill="#4FA6D5"/></marker><marker id="sj-m-gray" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8z" fill="#8F8A80"/></marker></defs>

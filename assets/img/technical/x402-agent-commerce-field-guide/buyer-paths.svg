<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 744" width="960" height="744" role="img" aria-labelledby="bp-w-title bp-w-desc" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif">
<title id="bp-w-title">買方付款的三條路</title>
<desc id="bp-w-desc">作者規劃的三條買方付款路線：先用官方開發套件寫付款腳本、由自己的測試錢包簽名；再拿現成的付款工具接上 AI Agent 對照，由該工具管理的錢包簽名，但要注意它支援的鏈與地區；最後才考慮自己做付款閘道，人在外部頁面核准後由閘道背後的獨立錢包服務簽名，工程最大。跑這條測試流程，三條路都要有：有測試用 USDC、能簽名的錢包，寫在程式裡的支出上限，以及人的核准或事先授權；模型不拿私鑰，付款能力在工具層。</desc>
<defs><marker id="bp-w-a" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8z" fill="#5F5B53"/></marker><marker id="bp-w-acc" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8z" fill="#E5A300"/></marker><marker id="bp-w-gray" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8z" fill="#8F8A80"/></marker><marker id="bp-w-blue" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8z" fill="#4FA6D5"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFDF9"/>
<text x="24" y="42" font-size="22" font-weight="700" fill="#232020">模型不拿私鑰，付款能力在工具層。</text>
<rect x="856" y="22" width="80" height="28" rx="14" fill="#FDF4DC" stroke="#E5A300" stroke-width="1.2"/>
<text x="896.0" y="41.04" font-size="14" font-weight="700" fill="#8A5D00" text-anchor="middle">作者規劃</text>
<line x1="202.0" y1="96" x2="432.0" y2="96" stroke="#5F5B53" stroke-width="1.8" stroke-dasharray="6,5" marker-end="url(#bp-w-a)"/>
<line x1="528.0" y1="96" x2="736.0" y2="96" stroke="#5F5B53" stroke-width="1.8" stroke-dasharray="6,5" marker-end="url(#bp-w-a)"/>
<text x="24" y="101" font-size="14" font-weight="700" fill="#5F5B53">規劃順序</text>
<rect x="140.0" y="81" width="56" height="30" rx="15" fill="#E5A300" stroke="#E5A300" stroke-width="1.2"/>
<text x="168.0" y="101.4" font-size="15" font-weight="700" fill="#232020" text-anchor="middle">先做</text>
<rect x="438.0" y="81" width="84" height="30" rx="15" fill="#FFFFFF" stroke="rgba(66,52,32,0.22)" stroke-width="1.2"/>
<text x="480.0" y="101.4" font-size="15" font-weight="700" fill="#5F5B53" text-anchor="middle">拿來對照</text>
<rect x="742.0" y="81" width="100" height="30" rx="15" fill="#FFFFFF" stroke="rgba(66,52,32,0.22)" stroke-width="1.2"/>
<text x="792.0" y="101.4" font-size="15" font-weight="700" fill="#5F5B53" text-anchor="middle">最後才考慮</text>
<line x1="168.0" y1="544" x2="168.0" y2="588" stroke="#5F5B53" stroke-width="1.8"/>
<line x1="480.0" y1="544" x2="480.0" y2="588" stroke="#5F5B53" stroke-width="1.8"/>
<line x1="792.0" y1="544" x2="792.0" y2="588" stroke="#5F5B53" stroke-width="1.8"/>
<rect x="24" y="136" width="288" height="408" rx="10" fill="#FDF4DC" stroke="#E5A300" stroke-width="2"/>
<circle cx="60" cy="172" r="16" fill="#E5A300"/>
<text x="60" y="177.76" font-size="16" font-weight="700" fill="#232020" text-anchor="middle">A</text>
<text x="86" y="179" font-size="20" font-weight="700" fill="#232020">程式直接付</text>
<line x1="44" y1="200" x2="292" y2="200" stroke="rgba(66,52,32,0.22)" stroke-width="1"/>
<text x="44" y="220" font-size="14" font-weight="700" fill="#8A5D00">做法</text>
<text x="44" y="246" font-size="16" font-weight="400" fill="#232020">用官方開發套件</text>
<text x="44" y="270" font-size="16" font-weight="400" fill="#232020">寫一支付款腳本</text>
<text x="44" y="332" font-size="14" font-weight="700" fill="#8A5D00">誰簽名</text>
<text x="44" y="358" font-size="16" font-weight="400" fill="#232020">自己的測試錢包</text>
<text x="44" y="396" font-size="14" font-weight="700" fill="#8A5D00">優點</text>
<text x="44" y="422" font-size="16" font-weight="400" fill="#232020">買賣兩邊的條件</text>
<text x="44" y="446" font-size="16" font-weight="400" fill="#232020">都在自己手上</text>
<text x="44" y="484" font-size="14" font-weight="700" fill="#8A5D00">適合</text>
<text x="44" y="510" font-size="16" font-weight="400" fill="#232020">第一筆測試</text>
<rect x="336" y="136" width="288" height="408" rx="10" fill="#FFFFFF" stroke="rgba(66,52,32,0.22)" stroke-width="1.5"/>
<circle cx="372" cy="172" r="16" fill="#232020"/>
<text x="372" y="177.76" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">B</text>
<text x="398" y="179" font-size="20" font-weight="700" fill="#232020">現成的付款工具</text>
<line x1="356" y1="200" x2="604" y2="200" stroke="rgba(66,52,32,0.22)" stroke-width="1"/>
<text x="356" y="220" font-size="14" font-weight="700" fill="#5F5B53">做法</text>
<text x="356" y="246" font-size="16" font-weight="400" fill="#232020">把別人做好的付款工具</text>
<text x="356" y="270" font-size="16" font-weight="400" fill="#232020">接到 AI Agent 上</text>
<text x="356" y="332" font-size="14" font-weight="700" fill="#5F5B53">誰簽名</text>
<text x="356" y="358" font-size="16" font-weight="400" fill="#232020">該工具管理的錢包</text>
<text x="356" y="396" font-size="14" font-weight="700" fill="#5F5B53">要注意</text>
<text x="356" y="422" font-size="16" font-weight="400" fill="#232020">它支援哪條鏈、哪些地區，</text>
<text x="356" y="446" font-size="16" font-weight="400" fill="#232020">不一定能付你的服務</text>
<rect x="648" y="136" width="288" height="408" rx="10" fill="#FFFFFF" stroke="rgba(66,52,32,0.22)" stroke-width="1.5"/>
<circle cx="684" cy="172" r="16" fill="#232020"/>
<text x="684" y="177.76" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">C</text>
<text x="710" y="179" font-size="20" font-weight="700" fill="#232020">自己做付款閘道</text>
<line x1="668" y1="200" x2="916" y2="200" stroke="rgba(66,52,32,0.22)" stroke-width="1"/>
<text x="668" y="220" font-size="14" font-weight="700" fill="#5F5B53">做法</text>
<text x="668" y="246" font-size="16" font-weight="400" fill="#232020">聊天型助理透過連接器</text>
<text x="668" y="270" font-size="16" font-weight="400" fill="#232020">呼叫你的閘道；</text>
<text x="668" y="294" font-size="16" font-weight="400" fill="#232020">人在外部頁面按核准</text>
<text x="668" y="332" font-size="14" font-weight="700" fill="#5F5B53">誰簽名</text>
<text x="668" y="358" font-size="16" font-weight="400" fill="#232020">閘道背後的獨立錢包服務</text>
<text x="668" y="396" font-size="14" font-weight="700" fill="#5F5B53">要注意</text>
<text x="668" y="422" font-size="16" font-weight="400" fill="#232020">工程最大，</text>
<text x="668" y="446" font-size="16" font-weight="400" fill="#232020">等於自己營運錢包服務</text>
<rect x="24" y="588" width="912" height="132" rx="10" fill="#FAF5EA" stroke="rgba(66,52,32,0.22)" stroke-width="1.5"/>
<text x="44" y="622" font-size="18" font-weight="700" fill="#232020">跑這條測試流程，三條路都要有</text>
<rect x="44" y="644" width="280" height="52" rx="8" fill="#FFFFFF" stroke="rgba(66,52,32,0.22)" stroke-width="1.5"/>
<g transform="translate(56,658)" fill="none" stroke="#8A5D00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8v-3a1 1 0 0 0 -1 -1h-10a2 2 0 0 0 0 4h12a1 1 0 0 1 1 1v3m0 4v3a1 1 0 0 1 -1 1h-12a2 2 0 0 1 -2 -2v-12"/><path d="M20 12v4h-4a2 2 0 0 1 0 -4h4"/></g>
<text x="88" y="676" font-size="16" font-weight="700" fill="#232020">有測試用 USDC、能簽名的錢包</text>
<rect x="340" y="644" width="280" height="52" rx="8" fill="#FFFFFF" stroke="rgba(66,52,32,0.22)" stroke-width="1.5"/>
<g transform="translate(352,658)" fill="none" stroke="#8A5D00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 16a9 9 0 1 1 17 0"/><path d="M12 13l4 -4"/><path d="M11 13a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/></g>
<text x="384" y="676" font-size="16" font-weight="700" fill="#232020">寫在程式裡的支出上限</text>
<rect x="636" y="644" width="280" height="52" rx="8" fill="#FFFFFF" stroke="rgba(66,52,32,0.22)" stroke-width="1.5"/>
<g transform="translate(648,658)" fill="none" stroke="#8A5D00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" /> <path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" /></g>
<text x="680" y="676" font-size="16" font-weight="700" fill="#232020">人的核准或事先授權</text>
</svg>

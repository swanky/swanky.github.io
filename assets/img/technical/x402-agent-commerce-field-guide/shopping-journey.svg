<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 538" width="828" height="538" role="img" aria-labelledby="sj-w-title sj-w-desc" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif">
<title id="sj-w-title">AI 幫我買東西，哪一步是我自己來</title>
<desc id="sj-w-desc">六步由左到右：問（「幫我找 500–600 左右的」）、找（AI 上網查，列出八款與當天價格）、比（AI 排順序、給建議）、查（「這個是正版的嗎？」AI 查授權公告）、試（「真人戴起來會長怎樣？」AI 生一張試戴圖），這五步 AI 做；第六步付（到購物網站結帳）還是人自己來，第五步之後換成人。前五步 AI 都做了，付款是我自己來。依據：作者與 ChatGPT 的兩段對話（2026-11-28）。</desc>

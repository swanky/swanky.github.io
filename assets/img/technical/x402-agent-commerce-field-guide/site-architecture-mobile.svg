<text x="40" y="320" font-size="15" font-weight="400" fill="#232020">另外部署的一支小程式</text>
<text x="40" y="344" font-size="15" font-weight="400" fill="#5F5B53">跑在 Cloudflare Workers 上</text>
<rect x="40" y="364" width="320" height="44" rx="8" fill="#FAF5EA" stroke="rgba(66,52,32,0.22)" stroke-width="1.5"/>
<g transform="translate(52,376) scale(0.833333)" fill="none" stroke="#5F5B53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19l16 0" /> <path d="M4 15l4 -6l4 2l4 -5l4 4" /></g>

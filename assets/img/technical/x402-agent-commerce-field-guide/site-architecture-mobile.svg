<text x="40" y="132" font-size="15" font-weight="400" fill="#232020">現有的個人網站</text>
<text x="40" y="156" font-size="15" font-weight="400" fill="#232020">放免費文章與作品</text>
<text x="40" y="180" font-size="15" font-weight="700" fill="#5F5B53">維持不動</text>

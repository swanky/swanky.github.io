<rect x="292" y="22" width="80" height="28" rx="14" fill="#FDF4DC" stroke="#E5A300" stroke-width="1.2"/>
<text x="332.0" y="41.04" font-size="14" font-weight="700" fill="#8A5D00" text-anchor="middle">作者規劃</text>
<line x1="106" y1="196" x2="106" y2="250" stroke="#5F5B53" stroke-width="2" marker-end="url(#sa-m-a)"/>
<text x="118" y="228" font-size="15" font-weight="500" fill="#5F5B53">只放一個連結</text>
<line x1="294" y1="196" x2="294" y2="250" stroke="#4FA6D5" stroke-width="2" marker-end="url(#sa-m-blue)"/>
<line x1="200" y1="540" x2="200" y2="586" stroke="#5F5B53" stroke-width="2" marker-end="url(#sa-m-a)"/>
<text x="212" y="568" font-size="15" font-weight="500" fill="#5F5B53">驗證與結算</text>
<line x1="200" y1="660" x2="200" y2="698" stroke="#5F5B53" stroke-width="2" marker-end="url(#sa-m-a)"/>

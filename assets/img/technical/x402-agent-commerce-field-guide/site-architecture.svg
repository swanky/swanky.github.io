<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 812" width="960" height="812" role="img" aria-labelledby="sa-w-title sa-w-desc" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif">
<title id="sa-w-title">個人網站接上 x402 的規劃架構</title>
<desc id="sa-w-desc">作者規劃：現有的展示站維持不動，只放一個連結；另外部署在 Cloudflare Workers 上的付費服務有健康檢查、公開目錄、付費資料三個入口，AI Agent 直接呼叫它；付費服務透過代驗代結服務在區塊鏈上以 USDC 收款到賣方的收款地址，賣方服務只需要公開的收款地址、不放私鑰。訂單與收據資料庫、私有儲存空間、NFT 合約、給 Agent 用的服務入口是之後才加的模組。</desc>

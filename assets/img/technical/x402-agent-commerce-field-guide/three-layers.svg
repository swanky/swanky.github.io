<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 512" width="960" height="512" role="img" aria-labelledby="tl-w-title tl-w-desc" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif">
<title id="tl-w-title">付款、收據、NFT 是三層不同的事</title>
<desc id="tl-w-desc">作者依官方概念整理的三層：付款層是 x402 加 USDC，回答誰付了多少、在哪條鏈；存證層是賣方簽章的收據，回答這筆錢買的是哪個商品、哪個版本；權利層是 NFT 或授權憑證，回答現在誰有權使用。查一次資料只需要付款層，買一份報告、之後還要重新下載，要加上存證層與賣方的訂單紀錄，可轉讓、或要讓別家服務驗證的使用權才需要權利層，所以不必每筆交易都發 NFT。NFT 轉手後原始付款人不變，持有 NFT 也不等於取得著作權。</desc>
<defs><marker id="tl-w-a" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8z" fill="#5F5B53"/></marker><marker id="tl-w-acc" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8z" fill="#E5A300"/></marker><marker id="tl-w-gray" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8z" fill="#8F8A80"/></marker><marker id="tl-w-blue" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8z" fill="#4FA6D5"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFDF9"/>
<text x="24" y="42" font-size="22" font-weight="700" fill="#232020">不必每筆交易都發 NFT。</text>
<rect x="856" y="22" width="80" height="28" rx="14" fill="#FDF4DC" stroke="#E5A300" stroke-width="1.2"/>
<text x="896.0" y="41.04" font-size="14" font-weight="700" fill="#8A5D00" text-anchor="middle">作者整理</text>
<rect x="24" y="76" width="544" height="96" rx="10" fill="#FFFFFF" stroke="rgba(66,52,32,0.22)" stroke-width="1.5"/>
<g transform="translate(44,98) scale(1.08333)" fill="none" stroke="#8A5D00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.8 4.5v9l-7.8 4.5l-7.8 -4.5v-9z"/><path d="M12 8l3.5 2v4l-3.5 2l-3.5 -2v-4z"/></g>
<text x="80" y="119" font-size="20" font-weight="700" fill="#232020">權利層</text>
<text x="44" y="152" font-size="16" font-weight="400" fill="#5F5B53">NFT 或授權憑證</text>
<text x="268" y="108" font-size="14" font-weight="700" fill="#8A5D00">回答</text>
<text x="548" y="108" font-size="14" font-weight="400" fill="#5F5B53" text-anchor="end">第 3 層</text>
<text x="268" y="134" font-size="16" font-weight="400" fill="#232020">現在誰有權使用</text>
<rect x="24" y="184" width="544" height="96" rx="10" fill="#FFFFFF" stroke="rgba(66,52,32,0.22)" stroke-width="1.5"/>
<g transform="translate(44,206) scale(1.08333)" fill="none" stroke="#8A5D00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21v-16a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v16l-3 -2l-2 2l-2 -2l-2 2l-2 -2l-3 2"/><path d="M9 7h6"/><path d="M9 11h6"/><path d="M9 15h4"/></g>
<text x="80" y="227" font-size="20" font-weight="700" fill="#232020">存證層</text>
<text x="44" y="260" font-size="16" font-weight="400" fill="#5F5B53">賣方簽章的收據</text>
<text x="268" y="216" font-size="14" font-weight="700" fill="#8A5D00">回答</text>
<text x="548" y="216" font-size="14" font-weight="400" fill="#5F5B53" text-anchor="end">第 2 層</text>
<text x="268" y="242" font-size="16" font-weight="400" fill="#232020">賣方承諾這筆錢買的是</text>
<text x="268" y="266" font-size="16" font-weight="400" fill="#232020">哪個商品、哪個版本</text>
<rect x="24" y="292" width="544" height="96" rx="10" fill="#FFFFFF" stroke="rgba(66,52,32,0.22)" stroke-width="1.5"/>
<g transform="translate(44,314) scale(1.08333)" fill="none" stroke="#8A5D00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path d="M14.8 9a2 2 0 0 0 -1.8 -1h-2a2 2 0 1 0 0 4h2a2 2 0 1 1 0 4h-2a2 2 0 0 1 -1.8 -1"/><path d="M12 7v10"/></g>
<text x="80" y="335" font-size="20" font-weight="700" fill="#232020">付款層</text>
<text x="44" y="368" font-size="16" font-weight="400" fill="#5F5B53">x402 加 USDC</text>
<text x="268" y="324" font-size="14" font-weight="700" fill="#8A5D00">回答</text>
<text x="548" y="324" font-size="14" font-weight="400" fill="#5F5B53" text-anchor="end">第 1 層</text>
<text x="268" y="350" font-size="16" font-weight="400" fill="#232020">誰付了多少、在哪條鏈</text>
<rect x="612" y="300" width="72" height="80" rx="8" fill="#FDF4DC" stroke="#E5A300" stroke-width="2"/>
<text x="648" y="346" font-size="16" font-weight="700" fill="#8A5D00" text-anchor="middle">付款</text>
<rect x="612" y="192" width="72" height="80" rx="8" fill="#FFFDF9" stroke="#8F8A80" stroke-width="1.2" stroke-dasharray="5,4"/>
<rect x="612" y="84" width="72" height="80" rx="8" fill="#FFFDF9" stroke="#8F8A80" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="648" y="418" font-size="16" font-weight="700" fill="#232020" text-anchor="middle">查一次資料</text>
<text x="648" y="444" font-size="15" font-weight="400" fill="#8A5D00" text-anchor="middle">只需要付款層</text>
<rect x="732" y="300" width="72" height="80" rx="8" fill="#FDF4DC" stroke="#E5A300" stroke-width="2"/>
<text x="768" y="346" font-size="16" font-weight="700" fill="#8A5D00" text-anchor="middle">付款</text>
<rect x="732" y="192" width="72" height="80" rx="8" fill="#FDF4DC" stroke="#E5A300" stroke-width="2"/>
<text x="768" y="238" font-size="16" font-weight="700" fill="#8A5D00" text-anchor="middle">存證</text>
<rect x="732" y="84" width="72" height="80" rx="8" fill="#FFFDF9" stroke="#8F8A80" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="768" y="418" font-size="16" font-weight="700" fill="#232020" text-anchor="middle">買報告、</text>
<text x="768" y="440" font-size="16" font-weight="700" fill="#232020" text-anchor="middle">之後重新下載</text>
<text x="768" y="466" font-size="15" font-weight="400" fill="#8A5D00" text-anchor="middle">加上存證層</text>
<text x="768" y="488" font-size="15" font-weight="400" fill="#8A5D00" text-anchor="middle">與訂單紀錄</text>
<rect x="852" y="300" width="72" height="80" rx="8" fill="#FDF4DC" stroke="#E5A300" stroke-width="2"/>
<text x="888" y="346" font-size="16" font-weight="700" fill="#8A5D00" text-anchor="middle">付款</text>
<rect x="852" y="192" width="72" height="80" rx="8" fill="#FDF4DC" stroke="#E5A300" stroke-width="2"/>
<text x="888" y="238" font-size="16" font-weight="700" fill="#8A5D00" text-anchor="middle">存證</text>
<rect x="852" y="84" width="72" height="80" rx="8" fill="#FDF4DC" stroke="#E5A300" stroke-width="2"/>
<text x="888" y="130" font-size="16" font-weight="700" fill="#8A5D00" text-anchor="middle">權利</text>
<text x="888" y="418" font-size="16" font-weight="700" fill="#232020" text-anchor="middle">可轉讓、或要讓</text>
<text x="888" y="440" font-size="16" font-weight="700" fill="#232020" text-anchor="middle">別家服務驗證的</text>
<text x="888" y="462" font-size="16" font-weight="700" fill="#232020" text-anchor="middle">使用權</text>
<text x="888" y="488" font-size="15" font-weight="400" fill="#8A5D00" text-anchor="middle">才需要權利層</text>
<rect x="24" y="413" width="3" height="21" fill="#E5A300"/>
<text x="36" y="428" font-size="15" font-weight="400" fill="#232020">NFT 轉手後，原始付款人不變；持有 NFT 也不等於取得著作權。</text>
</svg>

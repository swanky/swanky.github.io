<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 876" width="600" height="876" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><title id="t">門檻降在「讓同一個人一直是同一個人」</title><desc id="d">五步：角色參考表、鎖定身份、附參考圖的場景 prompt、影片模型生成、人工挑選；不合格回到生成。</desc><rect width="600" height="876" fill="#fbfaf7"/><text x="30" y="70" font-size="34" font-weight="700" fill="#1f2a37">門檻降在「讓同一個人</text><text x="30" y="116" font-size="34" font-weight="700" fill="#1f2a37">一直是同一個人」</text><rect x="30" y="156" width="540" height="100" rx="14" fill="#e8f3ee" stroke="#1a7f5a" stroke-width="2"/><text x="54" y="200" font-size="28" font-weight="700" fill="#1a7f5a">① 角色參考表</text><text x="54" y="244" font-size="24" fill="#1f2a37">多角度、多表情，社群公開分享</text><rect x="30" y="280" width="540" height="100" rx="14" fill="#e8f3ee" stroke="#1a7f5a" stroke-width="2"/><text x="54" y="324" font-size="28" font-weight="700" fill="#1a7f5a">② 鎖定身份</text><text x="54" y="368" font-size="24" fill="#1f2a37">多圖參考輸入／Soul ID／LoRA</text><rect x="30" y="404" width="540" height="100" rx="14" fill="#ffffff" stroke="#52606d" stroke-width="2"/><text x="54" y="448" font-size="28" font-weight="700" fill="#52606d">③ 場景 prompt</text><text x="54" y="492" font-size="24" fill="#1f2a37">每次都附參考圖：角色＋場景＋風格</text><rect x="30" y="528" width="540" height="100" rx="14" fill="#ffffff" stroke="#52606d" stroke-width="2"/><text x="54" y="572" font-size="28" font-weight="700" fill="#52606d">④ 影片模型</text><text x="54" y="616" font-size="24" fill="#1f2a37">Seedance、Kling、Minimax、Vidu</text><rect x="30" y="652" width="540" height="140" rx="14" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="54" y="696" font-size="28" font-weight="700" fill="#c0392b">⑤ 人工挑選</text><text x="54" y="740" font-size="24" fill="#1f2a37">手、臉漂移、長鏡頭；串接成短片</text><text x="54" y="780" font-size="24" fill="#1f2a37">不合格 → 回到 ④ 重生，不是重畫</text><text x="30" y="836" font-size="18" fill="#7b8794">工具名稱依文件與報導，未逐一實測。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 792" width="600" height="792" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><title id="t">鎖角色的四種做法：準備越多，臉越穩</title><desc id="d">單張參考圖、多參考輸入、Element 元素庫、訓練身份與 LoRA，依準備成本由低到高排列。</desc><rect width="600" height="792" fill="#fbfaf7"/><text x="30" y="70" font-size="34" font-weight="700" fill="#1f2a37">鎖角色的四種做法：</text><text x="30" y="116" font-size="34" font-weight="700" fill="#1f2a37">準備越多，臉越穩</text><rect x="30" y="156" width="540" height="100" rx="14" fill="#ffffff" stroke="#52606d" stroke-width="2"/><text x="54" y="200" font-size="28" font-weight="700" fill="#52606d">單張參考圖</text><text x="54" y="244" font-size="24" fill="#1f2a37">零準備；多次生成會漂</text><rect x="30" y="280" width="540" height="140" rx="14" fill="#eef4fb" stroke="#3b6ea5" stroke-width="2"/><text x="54" y="324" font-size="28" font-weight="700" fill="#3b6ea5">多參考輸入</text><text x="54" y="368" font-size="24" fill="#1f2a37">Seedance 2.5：一次最多 30 圖</text><text x="54" y="408" font-size="24" fill="#1f2a37">每張要指定「負責什麼」</text><rect x="30" y="444" width="540" height="100" rx="14" fill="#eef4fb" stroke="#3b6ea5" stroke-width="2"/><text x="54" y="488" font-size="28" font-weight="700" fill="#3b6ea5">Element 元素庫</text><text x="54" y="532" font-size="24" fill="#1f2a37">Kling：2–4 張建一次，之後用 @ 呼叫</text><rect x="30" y="568" width="540" height="140" rx="14" fill="#e8f3ee" stroke="#1a7f5a" stroke-width="2"/><text x="54" y="612" font-size="28" font-weight="700" fill="#1a7f5a">訓練身份／LoRA</text><text x="54" y="656" font-size="24" fill="#1f2a37">Soul ID：20–80 張；LoRA 幾天內上架</text><text x="54" y="696" font-size="24" fill="#1f2a37">仍是「像」，不是複製</text><text x="30" y="752" font-size="18" fill="#7b8794">定性排序示意，非量測。由上到下：準備成本與穩定度遞增。</text></svg>
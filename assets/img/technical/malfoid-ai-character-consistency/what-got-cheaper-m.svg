<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 704" width="600" height="704" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><title id="t">AI 拆掉的是製作門檻，不是全部門檻</title><desc id="d">變便宜：角色一致、圖轉短片、複製角色設定、一人連載。沒變便宜：好梗、細節品質、權利與名稱爭議、觀眾反感。</desc><rect width="600" height="704" fill="#fbfaf7"/><text x="30" y="70" font-size="34" font-weight="700" fill="#1f2a37">AI 拆掉的是製作門檻，</text><text x="30" y="116" font-size="34" font-weight="700" fill="#1f2a37">不是全部門檻</text><rect x="30" y="156" width="540" height="220" rx="14" fill="#e8f3ee" stroke="#1a7f5a" stroke-width="2"/><text x="54" y="200" font-size="28" font-weight="700" fill="#1a7f5a">變便宜了</text><text x="54" y="244" font-size="24" fill="#1f2a37">讓同一個角色長得一樣</text><text x="54" y="284" font-size="24" fill="#1f2a37">從一張圖做成會動的短片</text><text x="54" y="324" font-size="24" fill="#1f2a37">複製公開的角色設定（LoRA、參考表）</text><text x="54" y="364" font-size="24" fill="#1f2a37">一個人就能連載迷你劇情</text><rect x="30" y="400" width="540" height="220" rx="14" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="54" y="444" font-size="28" font-weight="700" fill="#c0392b">沒有變便宜</text><text x="54" y="488" font-size="24" fill="#1f2a37">想出「嘲諷完會臉紅」這種梗</text><text x="54" y="528" font-size="24" fill="#1f2a37">逐格瑕疵、長鏡頭穩定</text><text x="54" y="568" font-size="24" fill="#1f2a37">原作 IP 與名稱字源的爭議</text><text x="54" y="608" font-size="24" fill="#1f2a37">觀眾對「AI slop」的反感</text><text x="30" y="664" font-size="18" fill="#7b8794">作者整理判斷。</text></svg>
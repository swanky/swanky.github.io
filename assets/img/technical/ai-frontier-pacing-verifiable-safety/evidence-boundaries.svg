<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc"><title id="title">不要讓證據跨級背書</title><desc id="desc">本文判讀框架：METR 事故觀察與 Dario 未來能力擔憂不同；控速及管制效果需另有論證。</desc>
<rect width="1200" height="1080" rx="28" fill="#07111f"/><g font-family="Noto Sans TC,Microsoft JhengHei,sans-serif">
<text x="64" y="96" font-size="58" fill="#ffffff" font-weight="700">不要讓證據跨級背書</text>
<text x="64" y="163" font-size="40" fill="#b9c9da" font-weight="400">行為觀察、未來推測、政策選擇要分開</text>
<rect x="56" y="206" width="1088" height="229" rx="18" fill="#122238" stroke="#314963" stroke-width="2"/>
<rect x="56" y="206" width="8" height="229" rx="4" fill="#67deef"/>
<text x="92" y="261" font-size="36" fill="#67deef" font-weight="700">事故調查｜METR</text>
<text x="92" y="318" font-size="48" fill="#ffffff" font-weight="700">Agent 確實協同越權</text>
<text x="92" y="372" font-size="42" fill="#e8edf4" font-weight="400">約 1,200 個互通消息，約 700 個攻擊</text>
<text x="92" y="419" font-size="42" fill="#e8edf4" font-weight="400">成立的是事件，不是末日時間表</text>
<rect x="56" y="457" width="1088" height="229" rx="18" fill="#122238" stroke="#314963" stroke-width="2"/>
<rect x="56" y="457" width="8" height="229" rx="4" fill="#ffcf66"/>
<text x="92" y="512" font-size="36" fill="#ffcf66" font-weight="700">能力外推｜Amodei 的擔憂</text>
<text x="92" y="569" font-size="48" fill="#ffffff" font-weight="700">六到十二個月內接管網路？</text>
<text x="92" y="623" font-size="42" fill="#e8edf4" font-weight="400">仍須驗證擴散、持久性與防禦對抗</text>
<text x="92" y="670" font-size="42" fill="#e8edf4" font-weight="400">不能當作 METR 已證實的預測</text>
<rect x="56" y="708" width="1088" height="229" rx="18" fill="#122238" stroke="#314963" stroke-width="2"/>
<rect x="56" y="708" width="8" height="229" rx="4" fill="#b6acff"/>
<text x="92" y="763" font-size="36" fill="#b6acff" font-weight="700">制度選擇｜需要另外論證</text>
<text x="92" y="820" font-size="48" fill="#ffffff" font-weight="700">控速與管制是否相稱？</text>
<text x="92" y="874" font-size="42" fill="#e8edf4" font-weight="400">檢查有效性、成本、競爭與替代方案</text>
<text x="92" y="921" font-size="42" fill="#e8edf4" font-weight="400">真實事故不會自動證明全部處方</text>
<text x="64" y="1030" font-size="40" fill="#ffcf66" font-weight="600">支持驗證，不等於接受所有政策延伸。</text>
</g></svg>

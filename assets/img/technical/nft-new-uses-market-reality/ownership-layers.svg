<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc">
<title id="title">買到 NFT，不代表買到所有權利</title><desc id="desc">NFT持有紀錄、實際控制及契約權利是不同層。NFT可控制帳戶，但餘額與授權需另查；工作身分不等於可信成果；實體資產兌領需要保管人與契約履約。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#996514"/></marker></defs>
<rect width="1200" height="830" rx="22" fill="#fbfaf5"/>
<g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<text x="52" y="68" font-size="42" fill="#172b2a" font-weight="700" text-anchor="start">買到 NFT，不代表買到所有權利</text>
<text x="52" y="119" font-size="30" fill="#526961" font-weight="400" text-anchor="start">拆成三層看，才能知道買到什麼、還要相信誰。</text>
<rect x="52" y="166" width="1096" height="153" rx="16" fill="#ffffff" stroke="#d5ded7" stroke-width="2"/>
<text x="80" y="223" font-size="37" fill="#996514" font-weight="700" text-anchor="start">01</text>
<text x="160" y="220" font-size="35" fill="#172b2a" font-weight="700" text-anchor="start">鏈上持有</text>
<text x="160" y="271" font-size="30" fill="#172b2a" font-weight="400" text-anchor="start">誰持有？能轉給誰？持有不等於著作權。</text>
<text x="650" y="220" font-size="25" fill="#526961" font-weight="400" text-anchor="start">例：NFT 擁有者</text>
<rect x="52" y="348" width="1096" height="153" rx="16" fill="#ffffff" stroke="#d5ded7" stroke-width="2"/>
<text x="80" y="405" font-size="37" fill="#996514" font-weight="700" text-anchor="start">02</text>
<text x="160" y="402" font-size="35" fill="#172b2a" font-weight="700" text-anchor="start">實際控制</text>
<text x="160" y="453" font-size="30" fill="#172b2a" font-weight="400" text-anchor="start">帳戶還有資產嗎？資格是否仍有效？</text>
<text x="650" y="402" font-size="25" fill="#526961" font-weight="400" text-anchor="start">例：帳戶授權與設備</text>
<rect x="52" y="530" width="1096" height="153" rx="16" fill="#ffffff" stroke="#d5ded7" stroke-width="2"/>
<text x="80" y="587" font-size="37" fill="#996514" font-weight="700" text-anchor="start">03</text>
<text x="160" y="584" font-size="35" fill="#172b2a" font-weight="700" text-anchor="start">契約權利</text>
<text x="160" y="635" font-size="30" fill="#172b2a" font-weight="400" text-anchor="start">誰負責交貨？停止營運後能向誰主張？</text>
<text x="650" y="584" font-size="25" fill="#526961" font-weight="400" text-anchor="start">例：收藏卡保管</text>
<text x="52" y="745" font-size="33" fill="#172b2a" font-weight="700" text-anchor="start">可驗證的持有紀錄，不能替代真實的餘額、服務與履約。</text>
<text x="52" y="798" font-size="25" fill="#526961" font-weight="400" text-anchor="start">作者分析框架｜依 ERC-6551、ERC-8004 與各專案條款整理</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">Agent 的工作環境：三件事</title>
  <desc id="d">Agent 的工作環境由三件事組成：地圖讓它找得到路，回饋迴路讓它改完自己知道對錯，規則手冊讓它不重犯。Agent 先查地圖動手改，再用測試、原型等回饋自己檢查，沒過就自己修；人只做抽查，抽到的錯回寫成規則或自動檢查，下次直接跑不過。</desc>
  <defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C5B8F"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E7568"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="a-gold" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A5D00"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs>
  <rect width="1200" height="720" fill="#FFFFFF"/>
  <text x="48" y="72" font-size="44" font-weight="700" fill="#1F2937" text-anchor="start">Agent 的工作環境：三件事</text>
  <text x="48" y="116" font-size="26" font-weight="400" fill="#4B5563" text-anchor="start">改完自己看得到對錯；犯過的錯，下次直接跑不過</text>
  <rect x="48" y="160" width="330" height="200" rx="16" fill="#F1F5FA" stroke="#2C5B8F" stroke-width="2.5"/>
  <text x="72" y="211" font-size="32" font-weight="700" fill="#2C5B8F" text-anchor="start">① 地圖</text>
  <text x="72" y="260" font-size="26" font-weight="400" fill="#1F2937" text-anchor="start">要做什麼，先讀哪裡</text>
  <text x="72" y="299" font-size="26" font-weight="400" fill="#1F2937" text-anchor="start">模組、文件放在哪</text>
  <rect x="435" y="160" width="330" height="200" rx="16" fill="#EAF6F3" stroke="#0E7568" stroke-width="2.5"/>
  <text x="459" y="211" font-size="32" font-weight="700" fill="#0E7568" text-anchor="start">② 回饋迴路</text>
  <text x="459" y="260" font-size="26" font-weight="400" fill="#1F2937" text-anchor="start">測試、原型、設計文件</text>
  <text x="459" y="299" font-size="26" font-weight="400" fill="#1F2937" text-anchor="start">改完自己知道對錯</text>
  <rect x="822" y="160" width="330" height="200" rx="16" fill="#FFF8E7" stroke="#8A5D00" stroke-width="2.5"/>
  <text x="846" y="211" font-size="32" font-weight="700" fill="#8A5D00" text-anchor="start">③ 規則手冊</text>
  <text x="846" y="260" font-size="26" font-weight="400" fill="#1F2937" text-anchor="start">寫在 AGENTS.md</text>
  <text x="846" y="299" font-size="26" font-weight="400" fill="#1F2937" text-anchor="start">硬規則＋自動檢查</text>
  <rect x="48" y="470" width="330" height="140" rx="16" fill="#F1F5FA" stroke="#2C5B8F" stroke-width="2.5"/>
  <text x="72" y="520" font-size="30" font-weight="700" fill="#2C5B8F" text-anchor="start">Agent 動手改</text>
  <text x="72" y="566" font-size="25" font-weight="400" fill="#1F2937" text-anchor="start">照地圖找到位置</text>
  <rect x="435" y="470" width="330" height="140" rx="16" fill="#EAF6F3" stroke="#0E7568" stroke-width="2.5"/>
  <text x="459" y="520" font-size="30" font-weight="700" fill="#0E7568" text-anchor="start">自己跑檢查</text>
  <text x="459" y="566" font-size="25" font-weight="400" fill="#1F2937" text-anchor="start">沒過就自己修</text>
  <rect x="822" y="470" width="330" height="140" rx="16" fill="#FFF4E5" stroke="#B45309" stroke-width="2.5"/>
  <text x="846" y="520" font-size="30" font-weight="700" fill="#B45309" text-anchor="start">人抽查</text>
  <text x="846" y="566" font-size="25" font-weight="400" fill="#1F2937" text-anchor="start">不必逐行讀完</text>
  <path d="M213,368 L213,462" fill="none" stroke="#2C5B8F" stroke-width="3.5" marker-end="url(#a-blue)"/>
  <text x="229" y="424" font-size="24" font-weight="700" fill="#2C5B8F" text-anchor="start">先查地圖</text>
  <path d="M600,368 L600,462" fill="none" stroke="#0E7568" stroke-width="3.5" marker-end="url(#a-green)"/>
  <text x="616" y="424" font-size="24" font-weight="700" fill="#0E7568" text-anchor="start">用回饋驗證</text>
  <path d="M987,466 L987,372" fill="none" stroke="#B45309" stroke-width="3.5" marker-end="url(#a-orange)"/>
  <text x="1003" y="424" font-size="24" font-weight="700" fill="#B45309" text-anchor="start">抽到的錯回寫</text>
  <path d="M378,540 L427,540" fill="none" stroke="#64748B" stroke-width="3.5" marker-end="url(#a-gray)"/>
  <path d="M765,540 L814,540" fill="none" stroke="#64748B" stroke-width="3.5" marker-end="url(#a-gray)"/>
  <text x="48" y="676" font-size="24" font-weight="400" fill="#4B5563" text-anchor="start">規則越寫越多時，靠地圖指路：做這件事，再讀那一段，不必整本塞給它。</text>
</svg>

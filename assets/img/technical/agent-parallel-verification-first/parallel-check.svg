<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">派出去之前，先問三個問題</title>
  <desc id="d">派工前依序問三個問題。任務能不能自己驗收？不能就先補驗收條件再派。跟其他任務有沒有依賴？有就排隊依序做。會不會改到同一處？不會就在主線上一起改；會就各開獨立工作區（worktree），做完合併回主線，並刪掉工作區。</desc>
  <defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C5B8F"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E7568"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="a-gold" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A5D00"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs>
  <rect width="1200" height="760" fill="#FFFFFF"/>
  <text x="48" y="72" font-size="44" font-weight="700" fill="#1F2937" text-anchor="start">派出去之前，先問三個問題</text>
  <text x="48" y="116" font-size="26" font-weight="400" fill="#4B5563" text-anchor="start">依原文整理的判斷順序；卡在哪一關，先處理那一關</text>
  <rect x="48" y="150" width="470" height="104" rx="16" fill="#F1F5FA" stroke="#2C5B8F" stroke-width="2.5"/>
  <text x="72" y="214" font-size="30" font-weight="700" fill="#2C5B8F" text-anchor="start">① 能自己驗收嗎？</text>
  <path d="M526,202 L634,202" fill="none" stroke="#B45309" stroke-width="3.5" marker-end="url(#a-orange)"/>
  <text x="580" y="188" font-size="24" font-weight="700" fill="#B45309" text-anchor="middle">不能</text>
  <rect x="642" y="150" width="510" height="104" rx="16" fill="#FFF4E5" stroke="#B45309" stroke-width="2.5"/>
  <text x="666" y="214" font-size="28" font-weight="700" fill="#1F2937" text-anchor="start">先補驗收條件，再派</text>
  <path d="M283,260 L283,302" fill="none" stroke="#2C5B8F" stroke-width="3.5" marker-end="url(#a-blue)"/>
  <text x="299" y="290" font-size="24" font-weight="700" fill="#2C5B8F" text-anchor="start">能</text>
  <rect x="48" y="310" width="470" height="104" rx="16" fill="#F1F5FA" stroke="#2C5B8F" stroke-width="2.5"/>
  <text x="72" y="374" font-size="30" font-weight="700" fill="#2C5B8F" text-anchor="start">② 跟別的任務有依賴嗎？</text>
  <path d="M526,362 L634,362" fill="none" stroke="#B45309" stroke-width="3.5" marker-end="url(#a-orange)"/>
  <text x="580" y="348" font-size="24" font-weight="700" fill="#B45309" text-anchor="middle">有</text>
  <rect x="642" y="310" width="510" height="104" rx="16" fill="#FFF4E5" stroke="#B45309" stroke-width="2.5"/>
  <text x="666" y="374" font-size="28" font-weight="700" fill="#1F2937" text-anchor="start">排隊，依序做</text>
  <path d="M283,420 L283,462" fill="none" stroke="#2C5B8F" stroke-width="3.5" marker-end="url(#a-blue)"/>
  <text x="299" y="450" font-size="24" font-weight="700" fill="#2C5B8F" text-anchor="start">沒有</text>
  <rect x="48" y="470" width="470" height="104" rx="16" fill="#F1F5FA" stroke="#2C5B8F" stroke-width="2.5"/>
  <text x="72" y="534" font-size="30" font-weight="700" fill="#2C5B8F" text-anchor="start">③ 會改到同一處嗎？</text>
  <path d="M526,522 L634,522" fill="none" stroke="#0E7568" stroke-width="3.5" marker-end="url(#a-green)"/>
  <text x="580" y="508" font-size="24" font-weight="700" fill="#0E7568" text-anchor="middle">不會</text>
  <rect x="642" y="470" width="510" height="104" rx="16" fill="#EAF6F3" stroke="#0E7568" stroke-width="2.5"/>
  <text x="666" y="534" font-size="28" font-weight="700" fill="#1F2937" text-anchor="start">直接在主線上一起改</text>
  <path d="M283,580 L283,622" fill="none" stroke="#2C5B8F" stroke-width="3.5" marker-end="url(#a-blue)"/>
  <text x="299" y="610" font-size="24" font-weight="700" fill="#2C5B8F" text-anchor="start">會</text>
  <rect x="48" y="630" width="470" height="104" rx="16" fill="#FFF8E7" stroke="#8A5D00" stroke-width="2.5"/>
  <text x="72" y="676" font-size="28" font-weight="700" fill="#8A5D00" text-anchor="start">各開獨立工作區</text>
  <text x="72" y="714" font-size="24" font-weight="400" fill="#1F2937" text-anchor="start">（Git worktree）</text>
  <path d="M526,682 L634,682" fill="none" stroke="#8A5D00" stroke-width="3.5" marker-end="url(#a-gold)"/>
  <rect x="642" y="630" width="510" height="104" rx="16" fill="#FFF8E7" stroke="#8A5D00" stroke-width="2.5"/>
  <text x="666" y="676" font-size="28" font-weight="700" fill="#1F2937" text-anchor="start">做完合併回主線</text>
  <text x="666" y="714" font-size="24" font-weight="400" fill="#1F2937" text-anchor="start">然後刪掉工作區（寫進規則）</text>
</svg>

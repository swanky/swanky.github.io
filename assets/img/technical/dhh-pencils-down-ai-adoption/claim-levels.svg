<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">公司政策不能直接推成全產業結論</title><desc id="desc">三個互不等同的層次：公司政策、跨公司經濟判斷、2026年底該經濟判斷擴及幾乎所有領域工程師與公司的預測。每一層都需要另外提出證據。</desc><style>text{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#232020}.heading{font-size:48px;font-weight:700}.sub{font-size:29px;fill:#5b5650}.label{font-size:36px;font-weight:700}.body{font-size:31px}.small{font-size:27px;fill:#5b5650}</style><rect width="1200" height="790" rx="24" fill="#faf7f0"/><text x="60" y="80" class="heading">同一句「放下筆」，其實有三層主張</text><text x="60" y="132" class="sub">三項主張須各自查驗，前一項不會自動證明後一項。</text><rect x="50" y="175" width="1100" height="145" rx="16" fill="white" stroke="#d9d0c1"/><rect x="50" y="175" width="10" height="145" rx="4" fill="#176bff"/><text x="82" y="226" class="label" style="fill:#176bff">01</text><text x="168" y="226" class="label">37signals 的開發政策</text><text x="168" y="278" class="body">Agent 優先，手寫程式為例外</text><text x="720" y="278" class="small">成效看交付與故障紀錄</text><rect x="50" y="345" width="1100" height="145" rx="16" fill="white" stroke="#d9d0c1"/><rect x="50" y="345" width="10" height="145" rx="4" fill="#986722"/><text x="82" y="396" class="label" style="fill:#986722">02</text><text x="168" y="396" class="label">對多數公司的經濟主張</text><text x="168" y="448" class="body">以手寫為主已不再划算</text><text x="720" y="448" class="small">跨公司比較同等品質的總成本</text><rect x="50" y="515" width="1100" height="145" rx="16" fill="white" stroke="#d9d0c1"/><rect x="50" y="515" width="10" height="145" rx="4" fill="#923e4d"/><text x="82" y="566" class="label" style="fill:#923e4d">03</text><text x="168" y="566" class="label">2026 年底，經濟判斷擴及何處？</text><text x="168" y="618" class="body">幾乎所有領域、工程師與公司</text><text x="720" y="618" class="small">先定涵蓋門檻，再查驗例外</text><text x="60" y="724" class="small">左：DHH 的主張；右：對應的檢驗方式。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">以完整成本與合格交付比較AI開發的經濟性</title><desc id="desc">將模型、規格與環境、審查、返工及維運成本加總，除以通過同一驗收的交付數；另記完成時間與人工介入，並設定停用條件。</desc><style>text{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#232020}.heading{font-size:48px;font-weight:700}.sub{font-size:29px;fill:#5b5650}.label{font-size:36px;font-weight:700}.body{font-size:31px}.small{font-size:27px;fill:#5b5650}</style><rect width="1200" height="790" rx="24" fill="#faf7f0"/><text x="60" y="80" class="heading">划不划算，算每一份合格交付</text><text x="60" y="132" class="sub">比較同類任務、相同驗收標準與一致的觀察期間。</text><rect x="50" y="181" width="1100" height="299" rx="16" fill="white" stroke="#d9d0c1"/><text x="600" y="237" text-anchor="middle" class="label">模型費用 ＋ 環境與規格準備</text><text x="600" y="293" text-anchor="middle" class="label">＋ 審查 ＋ 返工 ＋ 維運成本</text><path d="M 140 325 H 1060" stroke="#986722" stroke-width="4"/><text x="600" y="385" text-anchor="middle" class="label">通過同一驗收門檻的交付數量</text><text x="600" y="445" text-anchor="middle" class="small">人工時間換算成本；跨期建置費需一致分攤。</text><rect x="50" y="510" width="535" height="162" rx="16" fill="#e9effa"/><text x="82" y="564" class="label">一起記錄</text><text x="82" y="616" class="body">完成時間、人工介入、漏網缺陷</text><rect x="615" y="510" width="535" height="162" rx="16" fill="#f3e7d5"/><text x="647" y="564" class="label">先訂停用條件</text><text x="647" y="616" class="body">權限失守、關鍵錯誤、無法復原</text><text x="60" y="738" class="small">以通過驗收的成果計算，不用程式行數代替交付。</text></svg>
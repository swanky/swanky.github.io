<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">Gallup中美AI影響預期：中國93%，美國36%</title><desc id="desc">根據2026年4至7月Microsoft–Gallup調查，知道AI的受訪者中，認為AI對本國人民大致有幫助的比例，中國93%、美國36%。這是態度而非使用率，不能建立競爭力因果。</desc><style>text{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#232020}.heading{font-size:48px;font-weight:700}.sub{font-size:29px;fill:#5b5650}.label{font-size:36px;font-weight:700}.body{font-size:31px}.small{font-size:27px;fill:#5b5650}</style><rect width="1200" height="790" rx="24" fill="#faf7f0"/><text x="60" y="80" class="heading">預期 AI 對本國人民大致有幫助</text><text x="60" y="132" class="sub">分母：知道 AI 的受訪者。不是 AI 使用率。</text><line x1="220.0" y1="200" x2="220.0" y2="465" stroke="#ded7cb"/><text x="220.0" y="508" text-anchor="middle" class="small">0%</text><line x1="420.0" y1="200" x2="420.0" y2="465" stroke="#ded7cb"/><text x="420.0" y="508" text-anchor="middle" class="small">25%</text><line x1="620.0" y1="200" x2="620.0" y2="465" stroke="#ded7cb"/><text x="620.0" y="508" text-anchor="middle" class="small">50%</text><line x1="820.0" y1="200" x2="820.0" y2="465" stroke="#ded7cb"/><text x="820.0" y="508" text-anchor="middle" class="small">75%</text><line x1="1020.0" y1="200" x2="1020.0" y2="465" stroke="#ded7cb"/><text x="1020.0" y="508" text-anchor="middle" class="small">100%</text><text x="70" y="277" class="label">中國</text><rect x="220" y="233" width="744.0" height="64" rx="8" fill="#986722"/><text x="982.0" y="277" class="label">93%</text><text x="70" y="412" class="label">美國</text><rect x="220" y="368" width="288.0" height="64" rx="8" fill="#176bff"/><text x="526.0" y="412" class="label">36%</text><text x="60" y="586" class="body">態度差距可觀察，競爭力的因果不能由此證明。</text><text x="60" y="650" class="small">Microsoft–Gallup 調查，2026 年 4–7 月；9 月 22 日發表。</text><text x="60" y="702" class="small">受訪者對未來的期待，不是已實現的經濟效益。</text></svg>
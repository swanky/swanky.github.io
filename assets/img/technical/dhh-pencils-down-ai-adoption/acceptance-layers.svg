<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">使用AI不等於信任所有產出或同意產業預言</title><desc id="desc">以工具使用、產出信任、論述認同三個獨立問題分析反應，不能以部分留言推估全體讀者的AI接受度。</desc><style>text{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#232020}.heading{font-size:48px;font-weight:700}.sub{font-size:29px;fill:#5b5650}.label{font-size:36px;font-weight:700}.body{font-size:31px}.small{font-size:27px;fill:#5b5650}</style><rect width="1200" height="790" rx="24" fill="#faf7f0"/><text x="60" y="80" class="heading">使用、信任、認同，分開問</text><text x="60" y="132" class="sub">同一個人，可以每天用 AI，也不同意 DHH 的預測。</text><rect x="50" y="185" width="1100" height="145" rx="16" fill="white" stroke="#d9d0c1"/><rect x="75" y="217" width="136" height="76" rx="12" fill="#e9effa"/><text x="143" y="267" text-anchor="middle" class="label" style="fill:#1859ab">工具</text><text x="250" y="238" class="label">願不願意使用？</text><text x="250" y="290" class="body">我是否讓 AI 幫我完成工作？</text><rect x="50" y="355" width="1100" height="145" rx="16" fill="white" stroke="#d9d0c1"/><rect x="75" y="387" width="136" height="76" rx="12" fill="#e9effa"/><text x="143" y="437" text-anchor="middle" class="label" style="fill:#1859ab">產出</text><text x="250" y="408" class="label">能不能放心交付？</text><text x="250" y="460" class="body">我需要哪些測試、審查與復原措施？</text><rect x="50" y="525" width="1100" height="145" rx="16" fill="white" stroke="#d9d0c1"/><rect x="75" y="557" width="136" height="76" rx="12" fill="#e9effa"/><text x="143" y="607" text-anchor="middle" class="label" style="fill:#1859ab">論述</text><text x="250" y="578" class="label">接不接受他的結論？</text><text x="250" y="630" class="body">我是否相信手寫已對多數公司不划算？</text><text x="60" y="738" class="small">不要用一句負面留言，替三個不同問題一起作答。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1407" viewBox="0 0 640 1407" role="img" aria-labelledby="title desc">
<title id="title">章節期間不等於展期</title><desc id="desc">七個章節的官方期間與館方展期對照：M+、Crystal Bridges、森美術館的館方展期都與官方章節期間不同；第二、第五章館方展期本輪未核對；第七章 NODE 展期一致，但官方站至今仍標目前展出。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8c8577"/></marker></defs>
<rect width="640" height="1407" fill="#fffdf9"/>
<g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="#232020">
<text x="36" y="58" font-size="32" font-weight="700">章節期間不等於展期</text>
<text x="36" y="94" font-size="22" fill="#665e51">官方站寫的是章節期間，館方頁寫的是展期，兩者常常</text>
<text x="36" y="130" font-size="22" fill="#665e51">對不上</text>
<rect x="36" y="150" width="18" height="18" rx="4" fill="#1f6f5c"/><text x="62" y="168" font-size="22" fill="#232020">已用館方或報導核對</text>
<rect x="276.1" y="150" width="18" height="18" rx="4" fill="#8a5d00"/><text x="302.1" y="168" font-size="22" fill="#232020">未核對</text>
<rect x="390.8" y="150" width="18" height="18" rx="4" fill="#2b5ea8"/><text x="416.8" y="168" font-size="22" fill="#232020">拍賣場合</text>
<path d="M36 194H604" stroke="#d9d0bf"/>
<text x="52" y="238" font-size="22" fill="#2b5ea8" font-weight="700">第一章</text>
<text x="52" y="277" font-size="27" font-weight="700">A Human is Born｜佳士得</text>
<text x="52" y="311" font-size="22" fill="#3d3a35">官方：2021-11 至 2022-04；佳士得預展 2021-10-30</text>
<text x="52" y="345" font-size="22" fill="#3d3a35">起</text>
<rect x="36" y="210" width="6" height="143" rx="3" fill="#2b5ea8"/>
<path d="M36 367H604" stroke="#ece5d6"/>
<text x="52" y="411" font-size="22" fill="#8a5d00" font-weight="700">第二章</text>
<text x="52" y="450" font-size="27" font-weight="700">A War of Attrition｜Castello di Rivoli</text>
<text x="52" y="484" font-size="22" fill="#3d3a35">官方：2022-04 至 2022-12；館方展期本輪未核對</text>
<rect x="36" y="383" width="6" height="109" rx="3" fill="#8a5d00"/>
<path d="M36 506H604" stroke="#ece5d6"/>
<text x="52" y="550" font-size="22" fill="#1f6f5c" font-weight="700">第三章</text>
<text x="52" y="589" font-size="27" font-weight="700">The Year of the Rabbit｜M+ 香港</text>
<text x="52" y="623" font-size="22" fill="#3d3a35">官方：2022-12 至 2023-09；M+ 館方：2022-12-09 至</text>
<text x="52" y="657" font-size="22" fill="#3d3a35">2023-06-11</text>
<rect x="36" y="522" width="6" height="143" rx="3" fill="#1f6f5c"/>
<path d="M36 679H604" stroke="#ece5d6"/>
<text x="52" y="723" font-size="22" fill="#1f6f5c" font-weight="700">第四章</text>
<text x="52" y="762" font-size="27" font-weight="700">Fully F***ing Gone｜Crystal Bridges</text>
<text x="52" y="796" font-size="22" fill="#3d3a35">官方：2023-09 至 2024-11；報導：2023-07-29 起展</text>
<text x="52" y="830" font-size="22" fill="#3d3a35">到隔年初</text>
<rect x="36" y="695" width="6" height="143" rx="3" fill="#1f6f5c"/>
<path d="M36 852H604" stroke="#ece5d6"/>
<text x="52" y="896" font-size="22" fill="#8a5d00" font-weight="700">第五章</text>
<text x="52" y="935" font-size="27" font-weight="700">Singularity: Phase.01｜德基藝術博物館</text>
<text x="52" y="969" font-size="22" fill="#3d3a35">官方：2024-11 至 2025-02；館方展期本輪未核對</text>
<rect x="36" y="868" width="6" height="109" rx="3" fill="#8a5d00"/>
<path d="M36 991H604" stroke="#ece5d6"/>
<text x="52" y="1035" font-size="22" fill="#1f6f5c" font-weight="700">第六章</text>
<text x="52" y="1074" font-size="27" font-weight="700">Semi Artificial Rainbow｜森美術館</text>
<text x="52" y="1108" font-size="22" fill="#3d3a35">官方：2025-02 至 2026-04；館方：2025-02-13 至</text>
<text x="52" y="1142" font-size="22" fill="#3d3a35">2025-06-08</text>
<rect x="36" y="1007" width="6" height="143" rx="3" fill="#1f6f5c"/>
<path d="M36 1164H604" stroke="#ece5d6"/>
<text x="52" y="1208" font-size="22" fill="#1f6f5c" font-weight="700">第七章</text>
<text x="52" y="1247" font-size="27" font-weight="700">Pre-Human Feedback｜NODE</text>
<text x="52" y="1281" font-size="22" fill="#3d3a35">2026-04-18 至 2026-06-28，與館方一致；官方站至今</text>
<text x="52" y="1315" font-size="22" fill="#3d3a35">仍標 Current Exhibition</text>
<rect x="36" y="1180" width="6" height="143" rx="3" fill="#1f6f5c"/>
<path d="M36 1337H604" stroke="#ece5d6"/>
<text x="36" y="1371" font-size="20" fill="#665e51">第四章原標題含粗口，此處遮字。資料截點 2026-11-10。</text>
</g>
</svg>

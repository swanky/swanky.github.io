<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1350" viewBox="0 0 640 1350" role="img" aria-labelledby="title desc">
<title id="title">你持有的是第一格，其他格在別人手上</title><desc id="desc">持有人用 9 位簽署者、門檻 5 的多簽錢包控制 token 轉移；合約記錄持有人；tokenURI 由藝術家端的合約管理者設定；metadata 與影片放在 beeple-collect.com 的中心化主機；實體雕塑有內建媒體伺服器，藝術家保留遠端存取。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8c8577"/></marker></defs>
<rect width="640" height="1350" fill="#fffdf9"/>
<g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="#232020">
<text x="36" y="58" font-size="32" font-weight="700">你持有的是第一格，其他格在別人手上</text>
<text x="36" y="94" font-size="22" fill="#665e51">從錢包一路追到影片：HUMAN ONE token #1 在</text>
<text x="36" y="130" font-size="22" fill="#665e51">2026-11-10 的讀取路徑</text>
<rect x="36" y="150" width="18" height="18" rx="4" fill="#1f6f5c"/><text x="62" y="168" font-size="22" fill="#232020">持有人控制</text>
<rect x="192.5" y="150" width="18" height="18" rx="4" fill="#b03a2e"/><text x="218.5" y="168" font-size="22" fill="#232020">藝術家控制</text>
<rect x="349.0" y="150" width="18" height="18" rx="4" fill="#8a5d00"/><text x="375.0" y="168" font-size="22" fill="#232020">中心化主機</text>
<rect x="505.5" y="150" width="18" height="18" rx="4" fill="#6b4fa0"/><text x="531.5" y="168" font-size="22" fill="#232020">實體</text>
<path d="M36 194H604" stroke="#d9d0bf"/>
<text x="52" y="238" font-size="22" fill="#1f6f5c" font-weight="700">持有人</text>
<text x="52" y="277" font-size="27" font-weight="700">多簽錢包</text>
<text x="52" y="311" font-size="22" fill="#3d3a35">9 位簽署者、門檻 5；能決定 token 轉給誰</text>
<rect x="36" y="210" width="6" height="109" rx="3" fill="#1f6f5c"/>
<path d="M60 327V353" stroke="#8c8577" stroke-width="3" marker-end="url(#ah)"/>
<text x="52" y="407" font-size="22" fill="#2b5ea8" font-weight="700">鏈上</text>
<text x="52" y="446" font-size="27" font-weight="700">合約 HUMANS 的 ownerOf(1)</text>
<text x="52" y="480" font-size="22" fill="#3d3a35">記錄誰持有；這一格只會因轉移而改變</text>
<rect x="36" y="379" width="6" height="109" rx="3" fill="#2b5ea8"/>
<path d="M60 496V522" stroke="#8c8577" stroke-width="3" marker-end="url(#ah)"/>
<text x="52" y="576" font-size="22" fill="#b03a2e" font-weight="700">藝術家端</text>
<text x="52" y="615" font-size="27" font-weight="700">tokenURI 字串</text>
<text x="52" y="649" font-size="22" fill="#3d3a35">合約管理者可呼叫 setTokenURI；2021 與 2025 年各</text>
<text x="52" y="683" font-size="22" fill="#3d3a35">改過</text>
<rect x="36" y="548" width="6" height="143" rx="3" fill="#b03a2e"/>
<path d="M60 699V725" stroke="#8c8577" stroke-width="3" marker-end="url(#ah)"/>
<text x="52" y="779" font-size="22" fill="#8a5d00" font-weight="700">中心化主機</text>
<text x="52" y="818" font-size="27" font-weight="700">metadata：metadata.beeple-collect.com</text>
<text x="52" y="852" font-size="22" fill="#3d3a35">雲端網頁服務回傳 JSON；目前內容是第七章</text>
<rect x="36" y="751" width="6" height="109" rx="3" fill="#8a5d00"/>
<path d="M60 868V894" stroke="#8c8577" stroke-width="3" marker-end="url(#ah)"/>
<text x="52" y="948" font-size="22" fill="#8a5d00" font-weight="700">中心化主機</text>
<text x="52" y="987" font-size="27" font-weight="700">影片：nft.beeple-collect.com</text>
<text x="52" y="1021" font-size="22" fill="#3d3a35">約 49 MB 的 mp4；伺服器標示的最後修改日是</text>
<text x="52" y="1055" font-size="22" fill="#3d3a35">2026-04-16（台灣時間）</text>
<rect x="36" y="920" width="6" height="143" rx="3" fill="#8a5d00"/>
<path d="M60 1071V1097" stroke="#8c8577" stroke-width="3" marker-end="url(#ah)"/>
<text x="52" y="1151" font-size="22" fill="#6b4fa0" font-weight="700">實體</text>
<text x="52" y="1190" font-size="27" font-weight="700">雕塑與內建媒體伺服器</text>
<text x="52" y="1224" font-size="22" fill="#3d3a35">條款寫明藝術家保留遠端存取，以維護或更新畫面</text>
<rect x="36" y="1123" width="6" height="109" rx="3" fill="#6b4fa0"/>
<path d="M36 1246H604" stroke="#ece5d6"/>
<text x="36" y="1280" font-size="20" fill="#665e51">讀取時間 2026-11-10 19:58–20:04（台灣時間）；來源：</text>
<text x="36" y="1314" font-size="20" fill="#665e51">公開 RPC、Blockscout、佳士得拍品條款。</text>
</g>
</svg>

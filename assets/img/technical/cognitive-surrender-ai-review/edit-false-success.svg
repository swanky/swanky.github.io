<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">AI 說改好了，其實沒改</title><desc id="desc">2026 年 6 月：AI 說改好了，檔案卻沒變，它的解釋是環境有問題，我們把這個解釋記進工作筆記。約三週後：追根才發現大多是 AI 自己編的，它在同一則回覆裡寫出了修改成功的結果。新規則：沒有證據不算完成，回報要附可以貼出來的檢查結果，沒有就寫已改、未驗。2026 年 9 月：這次檔案真的被改回去，檢查都過了，正式網站卻是舊版，拿正式網站對照才抓到。</desc>
<rect width="1200" height="700" fill="#fffdf9"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" fill="#232020">
<text x="36" y="58" font-size="40" font-weight="700">AI 說改好了，其實沒改</text>
<text x="36" y="103" font-size="26" fill="#665e51">我自己的一段放行紀錄</text>
<path d="M36 135H1164" stroke="#d9d0bf"/>
<rect x="28" y="150" width="1144" height="110" rx="10" fill="#f3efe7"/>
<text x="52" y="196" font-size="26" font-weight="700" fill="#665e51">2026 年 6 月</text>
<text x="300" y="196" font-size="29" font-weight="700">AI 說改好了，檔案卻沒變</text>
<text x="300" y="236" font-size="23" fill="#665e51">它的解釋是「環境有問題」，我們把這個解釋記進了工作筆記</text>
<rect x="28" y="274" width="1144" height="110" rx="10" fill="#fbf1d9"/>
<text x="52" y="320" font-size="26" font-weight="700" fill="#8a5d00">約三週後</text>
<text x="300" y="320" font-size="29" font-weight="700">追根才發現，大多是 AI 自己編的</text>
<text x="300" y="360" font-size="23" fill="#665e51">它在同一則回覆裡，自己寫出了「修改成功」的結果</text>
<rect x="28" y="398" width="1144" height="110" rx="10" fill="#f3efe7"/>
<text x="52" y="444" font-size="26" font-weight="700" fill="#665e51">新規則</text>
<text x="300" y="444" font-size="29" font-weight="700">沒有證據，不算完成</text>
<text x="300" y="484" font-size="23" fill="#665e51">回報要附可以貼出來的檢查結果；沒有，就寫「已改、未驗」</text>
<rect x="28" y="522" width="1144" height="110" rx="10" fill="#fbf1d9"/>
<text x="52" y="568" font-size="26" font-weight="700" fill="#8a5d00">2026 年 9 月</text>
<text x="300" y="568" font-size="29" font-weight="700">這次檔案真的被改回去了</text>
<text x="300" y="608" font-size="23" fill="#665e51">檢查都過了，正式網站卻是舊版；拿正式網站對照才抓到</text>
<text x="36" y="672" font-size="20" fill="#665e51">依作者的 AI 協作工作紀錄整理</text>
</g></svg>

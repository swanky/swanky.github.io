<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">看不完的時候，我改跟 AI 要這三樣</title><desc id="desc">AI 交回一大段說明、一堆改動和一句完成了。我不再假裝全部看完，改要三樣東西：可以核對的證據，例如檢查結果、截圖、和正式網站對照；看得懂的報告，用圖文並茂的網頁取代一長串文字；只列出要我決定的事，其他照規則處理。</desc>
<rect width="1200" height="640" fill="#fffdf9"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a5d00"/></marker></defs>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" fill="#232020">
<text x="36" y="58" font-size="40" font-weight="700">看不完的時候，我改跟 AI 要這三樣</text>
<text x="36" y="103" font-size="26" fill="#665e51">不再假裝全部看完，只看能快速核對的東西</text>
<path d="M36 135H1164" stroke="#d9d0bf"/>
<rect x="28" y="152" width="1144" height="84" rx="10" fill="#f3efe7"/>
<text x="600" y="204" font-size="28" text-anchor="middle">AI 交回：一大段說明、一堆改動，加上一句「完成了」</text>
<path d="M210 244V292" stroke="#8a5d00" stroke-width="3" marker-end="url(#a)"/>
<path d="M600 244V292" stroke="#8a5d00" stroke-width="3" marker-end="url(#a)"/>
<path d="M990 244V292" stroke="#8a5d00" stroke-width="3" marker-end="url(#a)"/>
<rect x="28" y="304" width="364" height="230" rx="10" fill="#fbf1d9"/>
<text x="52" y="354" font-size="30" font-weight="700" fill="#8a5d00">可以核對的證據</text>
<text x="52" y="404" font-size="24">檢查跑出來的結果</text>
<text x="52" y="444" font-size="24">改完的畫面截圖</text>
<text x="52" y="484" font-size="24">和正式網站對照</text>
<rect x="418" y="304" width="364" height="230" rx="10" fill="#fbf1d9"/>
<text x="442" y="354" font-size="30" font-weight="700" fill="#8a5d00">看得懂的報告</text>
<text x="442" y="404" font-size="24">圖文並茂的網頁</text>
<text x="442" y="444" font-size="24">取代一長串文字</text>
<text x="442" y="484" font-size="24">一眼看出改了什麼</text>
<rect x="808" y="304" width="364" height="230" rx="10" fill="#fbf1d9"/>
<text x="832" y="354" font-size="30" font-weight="700" fill="#8a5d00">只列我該決定的事</text>
<text x="832" y="404" font-size="24">上線、花錢、對外文字</text>
<text x="832" y="444" font-size="24">其他照規則處理</text>
<text x="832" y="484" font-size="24">不用我逐行看</text>
<text x="36" y="600" font-size="20" fill="#665e51">作者的做法｜證據也可能騙人，關鍵的地方要兩端對照</text>
</g></svg>

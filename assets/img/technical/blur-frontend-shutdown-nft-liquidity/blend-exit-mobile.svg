<svg xmlns="http://www.w3.org/2000/svg" width="640" height="950" viewBox="0 0 640 950" role="img" aria-labelledby="title desc">
<title id="title">貸方想退出，接下來呢？</title><desc id="desc">Blend 接續借款的簡化分支；起點，貸方啟動接續借款競價，尋找願意接手這筆債務的新貸方；A｜借款人還款，借款人還清本息，借款結束，取回抵押品；B｜新貸方接手，新貸方接受競價條件，接續借款，利率可能改變；C｜競價失敗且未還款，原貸方可取得抵押品，沒有固定到期日，不等於不會清算</desc>
<rect width="640" height="950" fill="#fffdf9"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" fill="#232020">
<text x="36" y="58" font-size="32" fill="#232020" font-weight="700">貸方想退出，接下來呢？</text>
<text x="36" y="103" font-size="23" fill="#665e51" font-weight="400">Blend 接續借款的簡化分支</text>
<path d="M36 142H604" stroke="#d9d0bf"/>
<text x="36" y="182" font-size="23" fill="#8a5d00" font-weight="700">起點</text>
<text x="36" y="226" font-size="30" fill="#232020" font-weight="700">貸方啟動接續借款競價</text>
<text x="36" y="270" font-size="25" fill="#232020" font-weight="400">尋找願意接手這筆債務的新貸方</text>
<path d="M36 322H604" stroke="#d9d0bf"/>
<text x="36" y="362" font-size="23" fill="#8a5d00" font-weight="700">A｜借款人還款</text>
<text x="36" y="406" font-size="30" fill="#232020" font-weight="700">借款人還清本息</text>
<text x="36" y="450" font-size="25" fill="#232020" font-weight="400">借款結束，取回抵押品</text>
<path d="M36 502H604" stroke="#d9d0bf"/>
<text x="36" y="542" font-size="23" fill="#8a5d00" font-weight="700">B｜新貸方接手</text>
<text x="36" y="586" font-size="30" fill="#232020" font-weight="700">新貸方接受競價條件</text>
<text x="36" y="630" font-size="25" fill="#232020" font-weight="400">接續借款，利率可能改變</text>
<path d="M36 682H604" stroke="#d9d0bf"/>
<text x="36" y="722" font-size="23" fill="#8a5d00" font-weight="700">C｜競價失敗且未還款</text>
<text x="36" y="766" font-size="30" fill="#232020" font-weight="700">原貸方可取得抵押品</text>
<text x="36" y="810" font-size="25" fill="#232020" font-weight="400">沒有固定到期日，不等於不會清算</text>
<text x="36" y="924" font-size="20" fill="#665e51" font-weight="400">依 Paradigm 原始設計簡化｜非個別交易重建</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">拆開一枚 USDC</title><desc id="desc">合約程式，ERC-20 合約、名稱與代號，位置：鏈上，AI 能否重做：能；鏈上狀態，每個地址的餘額與轉帳歷史，位置：鏈上，AI 能否重做：不能；準備金，現金與短期美國公債，每週揭露，位置：鏈下，AI 能否重做：不能；銀行通道，鑄造與贖回走銀行，受營業時間限制，位置：鏈下，AI 能否重做：不能；法規，GENIUS Act：100% 準備、每月揭露，位置：鏈下，AI 能否重做：不能；接受度，交易所、協議與付款服務願意收，位置：人與機構，AI 能否重做：不能。</desc>
<rect width="1200" height="720" fill="#fffdf9"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" fill="#232020">
<text x="36" y="58" font-size="40" fill="#232020" font-weight="700">拆開一枚 USDC</text>
<text x="36" y="103" font-size="26" fill="#665e51" font-weight="400">能被複製的只有最上面一層；最難取代的幾層在鏈下</text>
<text x="36" y="160" font-size="22" fill="#665e51" font-weight="700">層</text>
<text x="240" y="160" font-size="22" fill="#665e51" font-weight="700">內容</text>
<text x="905" y="160" font-size="22" fill="#665e51" font-weight="700" text-anchor="middle">在哪裡</text>
<text x="1085" y="160" font-size="22" fill="#665e51" font-weight="700" text-anchor="middle">AI 能重做？</text>
<rect x="28" y="178" width="1144" height="64" rx="10" fill="#e8f0fa"/>
<text x="48" y="220" font-size="28" fill="#1f4f8a" font-weight="700">合約程式</text>
<text x="240" y="220" font-size="27" fill="#232020" font-weight="400">ERC-20 合約、名稱與代號</text>
<text x="905" y="220" font-size="26" fill="#232020" font-weight="700" text-anchor="middle">鏈上</text>
<text x="1085" y="220" font-size="28" fill="#1f4f8a" font-weight="700" text-anchor="middle">能</text>
<rect x="28" y="254" width="1144" height="64" rx="10" fill="#f3efe7"/>
<text x="48" y="296" font-size="28" fill="#8a5d00" font-weight="700">鏈上狀態</text>
<text x="240" y="296" font-size="27" fill="#232020" font-weight="400">每個地址的餘額與轉帳歷史</text>
<text x="905" y="296" font-size="26" fill="#232020" font-weight="700" text-anchor="middle">鏈上</text>
<text x="1085" y="296" font-size="28" fill="#8a5d00" font-weight="700" text-anchor="middle">不能</text>
<rect x="28" y="330" width="1144" height="64" rx="10" fill="#fbf1d9"/>
<text x="48" y="372" font-size="28" fill="#8a5d00" font-weight="700">準備金</text>
<text x="240" y="372" font-size="27" fill="#232020" font-weight="400">現金與短期美國公債，每週揭露</text>
<text x="905" y="372" font-size="26" fill="#8a5d00" font-weight="700" text-anchor="middle">鏈下</text>
<text x="1085" y="372" font-size="28" fill="#8a5d00" font-weight="700" text-anchor="middle">不能</text>
<rect x="28" y="406" width="1144" height="64" rx="10" fill="#fbf1d9"/>
<text x="48" y="448" font-size="28" fill="#8a5d00" font-weight="700">銀行通道</text>
<text x="240" y="448" font-size="27" fill="#232020" font-weight="400">鑄造與贖回走銀行，受營業時間限制</text>
<text x="905" y="448" font-size="26" fill="#8a5d00" font-weight="700" text-anchor="middle">鏈下</text>
<text x="1085" y="448" font-size="28" fill="#8a5d00" font-weight="700" text-anchor="middle">不能</text>
<rect x="28" y="482" width="1144" height="64" rx="10" fill="#fbf1d9"/>
<text x="48" y="524" font-size="28" fill="#8a5d00" font-weight="700">法規</text>
<text x="240" y="524" font-size="27" fill="#232020" font-weight="400">GENIUS Act：100% 準備、每月揭露</text>
<text x="905" y="524" font-size="26" fill="#8a5d00" font-weight="700" text-anchor="middle">鏈下</text>
<text x="1085" y="524" font-size="28" fill="#8a5d00" font-weight="700" text-anchor="middle">不能</text>
<rect x="28" y="558" width="1144" height="64" rx="10" fill="#fbf1d9"/>
<text x="48" y="600" font-size="28" fill="#8a5d00" font-weight="700">接受度</text>
<text x="240" y="600" font-size="27" fill="#232020" font-weight="400">交易所、協議與付款服務願意收</text>
<text x="905" y="600" font-size="26" fill="#8a5d00" font-weight="700" text-anchor="middle">人與機構</text>
<text x="1085" y="600" font-size="28" fill="#8a5d00" font-weight="700" text-anchor="middle">不能</text>
<text x="36" y="690" font-size="22" fill="#665e51" font-weight="400">來源：Circle 透明度頁、Circle 2023 年 SVB 聲明、白宮 GENIUS Act 說明｜作者整理</text>
</g></svg>

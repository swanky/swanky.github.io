<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">公司收攤以後，還剩下什麼？</title><desc id="desc">網站入口：關閉，Blur 停用官方網站；POAP 停止維護，AI 最容易重做；圖片與資料：要有人備份，POAP 留下約 15 GB 的封存檔，有備份才能接手；鏈上紀錄：還在，代幣、持有與交易歷史留在鏈上，沒人能刪，也沒人能複製；整合與社群：不會自動跟過去，新平台用新合約，舊工具認不得，只能重新累積。</desc>
<rect width="1200" height="660" fill="#fffdf9"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" fill="#232020">
<text x="36" y="58" font-size="40" fill="#232020" font-weight="700">公司收攤以後，還剩下什麼？</text>
<text x="36" y="103" font-size="26" fill="#665e51" font-weight="400">以 Blur 與 POAP 的收攤安排為例</text>
<path d="M36 135H1164" stroke="#d9d0bf"/>
<rect x="28" y="150" width="1144" height="96" rx="10" fill="#f3efe7"/>
<text x="52" y="194" font-size="30" fill="#232020" font-weight="700">網站入口</text>
<text x="52" y="230" font-size="24" fill="#665e51" font-weight="700">關閉</text>
<text x="300" y="194" font-size="28" fill="#232020" font-weight="400">Blur 停用官方網站；POAP 停止維護</text>
<text x="300" y="230" font-size="24" fill="#665e51" font-weight="400">AI 最容易重做</text>
<rect x="28" y="262" width="1144" height="96" rx="10" fill="#f3efe7"/>
<text x="52" y="306" font-size="30" fill="#232020" font-weight="700">圖片與資料</text>
<text x="52" y="342" font-size="24" fill="#665e51" font-weight="700">要有人備份</text>
<text x="300" y="306" font-size="28" fill="#232020" font-weight="400">POAP 留下約 15 GB 的封存檔</text>
<text x="300" y="342" font-size="24" fill="#665e51" font-weight="400">有備份才能接手</text>
<rect x="28" y="374" width="1144" height="96" rx="10" fill="#fbf1d9"/>
<text x="52" y="418" font-size="30" fill="#8a5d00" font-weight="700">鏈上紀錄</text>
<text x="52" y="454" font-size="24" fill="#8a5d00" font-weight="700">還在</text>
<text x="300" y="418" font-size="28" fill="#232020" font-weight="400">代幣、持有與交易歷史留在鏈上</text>
<text x="300" y="454" font-size="24" fill="#665e51" font-weight="400">沒人能刪，也沒人能複製</text>
<rect x="28" y="486" width="1144" height="96" rx="10" fill="#fbf1d9"/>
<text x="52" y="530" font-size="30" fill="#8a5d00" font-weight="700">整合與社群</text>
<text x="52" y="566" font-size="24" fill="#8a5d00" font-weight="700">不會自動跟過去</text>
<text x="300" y="530" font-size="28" fill="#232020" font-weight="400">新平台用新合約，舊工具認不得</text>
<text x="300" y="566" font-size="24" fill="#665e51" font-weight="400">只能重新累積</text>
<text x="36" y="630" font-size="22" fill="#665e51" font-weight="400">依 Blur 關站報導與區塊勢 #795 整理｜作者判斷</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1120" viewBox="0 0 640 1120" role="img" aria-labelledby="title desc">
<title id="title">抄得走的，與抄不走的</title><desc id="desc">左欄是程式碼與介面，AI 可以重做：錢包 App 的畫面、API 與後端程式、智能合約的原始碼、一枚代號叫 USDC 的代幣。右欄是狀態與責任，AI 做不出來：帳上的餘額與流動性、誰持有過、交易過的紀錄、準備金、銀行與兌付承諾、願意收它的交易所與服務。</desc>
<rect width="640" height="1120" fill="#fffdf9"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" fill="#232020">
<text x="32" y="54" font-size="34" fill="#232020" font-weight="700">抄得走的，與抄不走的</text>
<text x="32" y="96" font-size="24" fill="#665e51" font-weight="400">AI 讓上面越來越便宜</text>
<text x="32" y="130" font-size="24" fill="#665e51" font-weight="400">下面要靠時間與責任累積</text>
<rect x="32" y="160" width="576" height="420" rx="14" fill="#e8f0fa"/>
<text x="56" y="212" font-size="30" fill="#1f4f8a" font-weight="700">程式碼與介面</text>
<text x="584" y="212" font-size="23" fill="#1f4f8a" font-weight="700" text-anchor="end">AI 可以重做</text>
<path d="M56 234H584" stroke="#1f4f8a" stroke-opacity="0.35"/>
<circle cx="68" cy="287" r="7" fill="#1f4f8a"/>
<text x="88" y="296" font-size="27" fill="#232020" font-weight="400">錢包 App 的畫面</text>
<circle cx="68" cy="361" r="7" fill="#1f4f8a"/>
<text x="88" y="370" font-size="27" fill="#232020" font-weight="400">API 與後端程式</text>
<circle cx="68" cy="435" r="7" fill="#1f4f8a"/>
<text x="88" y="444" font-size="27" fill="#232020" font-weight="400">智能合約的原始碼</text>
<circle cx="68" cy="509" r="7" fill="#1f4f8a"/>
<text x="88" y="518" font-size="27" fill="#232020" font-weight="400">一枚代號叫 USDC 的代幣</text>
<rect x="32" y="610" width="576" height="420" rx="14" fill="#fbf1d9"/>
<text x="56" y="662" font-size="30" fill="#8a5d00" font-weight="700">狀態與責任</text>
<text x="584" y="662" font-size="23" fill="#8a5d00" font-weight="700" text-anchor="end">AI 做不出來</text>
<path d="M56 684H584" stroke="#8a5d00" stroke-opacity="0.35"/>
<circle cx="68" cy="737" r="7" fill="#8a5d00"/>
<text x="88" y="746" font-size="27" fill="#232020" font-weight="400">帳上的餘額與流動性</text>
<circle cx="68" cy="811" r="7" fill="#8a5d00"/>
<text x="88" y="820" font-size="27" fill="#232020" font-weight="400">誰持有過、交易過的紀錄</text>
<circle cx="68" cy="885" r="7" fill="#8a5d00"/>
<text x="88" y="894" font-size="27" fill="#232020" font-weight="400">準備金、銀行與兌付承諾</text>
<circle cx="68" cy="959" r="7" fill="#8a5d00"/>
<text x="88" y="968" font-size="27" fill="#232020" font-weight="400">願意收它的交易所與服務</text>
<text x="32" y="1070" font-size="21" fill="#665e51" font-weight="400">依 a16z 論點整理，加上作者判斷</text>
<text x="32" y="1100" font-size="21" fill="#665e51" font-weight="400">2026.11</text>
</g></svg>

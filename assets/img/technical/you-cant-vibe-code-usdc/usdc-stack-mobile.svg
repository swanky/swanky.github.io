<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1150" viewBox="0 0 640 1150" role="img" aria-labelledby="title desc">
<title id="title">拆開一枚 USDC</title><desc id="desc">合約程式，ERC-20 合約、名稱與代號，位置：鏈上，AI 能否重做：能；鏈上狀態，每個地址的餘額與轉帳歷史，位置：鏈上，AI 能否重做：不能；準備金，現金與短期美國公債，每週揭露，位置：鏈下，AI 能否重做：不能；銀行通道，鑄造與贖回走銀行，受營業時間限制，位置：鏈下，AI 能否重做：不能；法規，GENIUS Act：100% 準備、每月揭露，位置：鏈下，AI 能否重做：不能；接受度，交易所、協議與付款服務願意收，位置：人與機構，AI 能否重做：不能。</desc>
<rect width="640" height="1150" fill="#fffdf9"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" fill="#232020">
<text x="32" y="54" font-size="34" fill="#232020" font-weight="700">拆開一枚 USDC</text>
<text x="32" y="96" font-size="24" fill="#665e51" font-weight="400">能被複製的只有最上面一層</text>
<text x="32" y="130" font-size="24" fill="#665e51" font-weight="400">最難取代的幾層在鏈下</text>
<rect x="24" y="160" width="592" height="134" rx="10" fill="#e8f0fa"/>
<text x="44" y="204" font-size="28" fill="#1f4f8a" font-weight="700">合約程式</text>
<text x="596" y="204" font-size="22" fill="#1f4f8a" font-weight="700" text-anchor="end">鏈上｜AI 能重做</text>
<text x="44" y="252" font-size="25" fill="#232020" font-weight="400">ERC-20 合約、名稱與代號</text>
<rect x="24" y="310" width="592" height="134" rx="10" fill="#f3efe7"/>
<text x="44" y="354" font-size="28" fill="#8a5d00" font-weight="700">鏈上狀態</text>
<text x="596" y="354" font-size="22" fill="#8a5d00" font-weight="700" text-anchor="end">鏈上｜AI 不能重做</text>
<text x="44" y="402" font-size="25" fill="#232020" font-weight="400">每個地址的餘額與轉帳歷史</text>
<rect x="24" y="460" width="592" height="134" rx="10" fill="#fbf1d9"/>
<text x="44" y="504" font-size="28" fill="#8a5d00" font-weight="700">準備金</text>
<text x="596" y="504" font-size="22" fill="#8a5d00" font-weight="700" text-anchor="end">鏈下｜AI 不能重做</text>
<text x="44" y="552" font-size="25" fill="#232020" font-weight="400">現金與短期美國公債，每週揭露</text>
<rect x="24" y="610" width="592" height="134" rx="10" fill="#fbf1d9"/>
<text x="44" y="654" font-size="28" fill="#8a5d00" font-weight="700">銀行通道</text>
<text x="596" y="654" font-size="22" fill="#8a5d00" font-weight="700" text-anchor="end">鏈下｜AI 不能重做</text>
<text x="44" y="702" font-size="25" fill="#232020" font-weight="400">鑄造與贖回走銀行，受營業時間限制</text>
<rect x="24" y="760" width="592" height="134" rx="10" fill="#fbf1d9"/>
<text x="44" y="804" font-size="28" fill="#8a5d00" font-weight="700">法規</text>
<text x="596" y="804" font-size="22" fill="#8a5d00" font-weight="700" text-anchor="end">鏈下｜AI 不能重做</text>
<text x="44" y="852" font-size="25" fill="#232020" font-weight="400">GENIUS Act：100% 準備、每月揭露</text>
<rect x="24" y="910" width="592" height="134" rx="10" fill="#fbf1d9"/>
<text x="44" y="954" font-size="28" fill="#8a5d00" font-weight="700">接受度</text>
<text x="596" y="954" font-size="22" fill="#8a5d00" font-weight="700" text-anchor="end">人與機構｜AI 不能重做</text>
<text x="44" y="1002" font-size="25" fill="#232020" font-weight="400">交易所、協議與付款服務願意收</text>
<text x="32" y="1080" font-size="20" fill="#665e51" font-weight="400">來源：Circle 透明度頁、2023 年 SVB 聲明、</text>
<text x="32" y="1110" font-size="20" fill="#665e51" font-weight="400">白宮 GENIUS Act 說明｜作者整理</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">讓目錄與型別邊界，替 agent 記住架構</title><desc id="desc">根據公開簡報重繪 Dune process boundaries。renderer 包含 Feature UI、Navigation、Client；服務程序包含 Host extensions、Electron main；跨界經過 typed edge，共用跨程序型別。</desc><defs><marker id="a-72ddda" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#72ddda" stroke-width="1.4"/></marker><marker id="a-f5cb78" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#f5cb78" stroke-width="1.4"/></marker><marker id="a-ff9a98" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#ff9a98" stroke-width="1.4"/></marker><marker id="a-b6cbd4" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#b6cbd4" stroke-width="1.4"/></marker></defs><rect width="1200" height="760" rx="24" fill="#081725"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="48" y="59" fill="#f4f5ef" font-size="37" font-weight="700" text-anchor="start">讓目錄與型別邊界，替 agent 記住架構</text><text x="48" y="102" fill="#b6cbd4" font-size="24" font-weight="400" text-anchor="start">公開簡報觀念重繪｜這是程序分工示意，不是內部原始碼或完整協定</text><rect x="55" y="158" width="440" height="405" rx="18" fill="#112c40" stroke="#72ddda" stroke-width="2"/><text x="80" y="199" fill="#72ddda" font-size="29" font-weight="700" text-anchor="start">renderer／畫面端</text><rect x="80" y="227" width="390" height="123" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="104" y="271" fill="#72ddda" font-size="29" font-weight="700" text-anchor="start">Feature UI ＋ Navigation</text><text x="104" y="311" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">React 畫面；導覽只連結功能</text><rect x="80" y="394" width="390" height="126" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="104" y="438" fill="#72ddda" font-size="29" font-weight="700" text-anchor="start">Client</text><text x="104" y="478" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">畫面端狀態與指令</text><rect x="539" y="255" width="123" height="255" rx="18" fill="#3b3550" stroke="#bba8df" stroke-width="2"/><text x="600" y="365" fill="#f4f5ef" font-size="25" font-weight="700" text-anchor="middle">Typed</text><text x="600" y="403" fill="#f4f5ef" font-size="25" font-weight="700" text-anchor="middle">edge</text><rect x="708" y="158" width="437" height="405" rx="18" fill="#332e2d" stroke="#f5cb78" stroke-width="2"/><text x="733" y="199" fill="#f5cb78" font-size="27" font-weight="700" text-anchor="start">serving processes／服務端</text><rect x="733" y="227" width="387" height="123" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="757" y="271" fill="#f5cb78" font-size="29" font-weight="700" text-anchor="start">Host extensions</text><text x="757" y="311" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">持續運作的領域行為</text><rect x="733" y="394" width="387" height="126" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="757" y="438" fill="#f5cb78" font-size="29" font-weight="700" text-anchor="start">Electron main</text><text x="757" y="478" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">視窗與作業系統能力</text><path d="M275 350 L275 390" fill="none" stroke="#72ddda" stroke-width="3"/><path d="M471 458 L533 458" fill="none" stroke="#72ddda" stroke-width="3"/><path d="M668 286 L729 286" fill="none" stroke="#f5cb78" stroke-width="3"/><path d="M668 458 L729 458" fill="none" stroke="#f5cb78" stroke-width="3"/><rect x="86" y="603" width="1028" height="69" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="600" y="647" fill="#f4f5ef" font-size="28" font-weight="700" text-anchor="middle">shared/ 共用跨程序型別；每個程序只匯入允許的層</text><text x="48" y="728" fill="#b6cbd4" font-size="21" font-weight="400" text-anchor="start">來源：Lauren Tan「Process boundaries are visible in the tree」投影片。</text></g></svg>
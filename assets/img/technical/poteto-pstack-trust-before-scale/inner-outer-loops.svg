<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">先打通單次驗證，再把它接到持續運作的系統</title><desc id="desc">本文依講者 inner/outer loop 觀念延伸；外迴圈選擇任務，內迴圈重現實作驗證，通過整合關卡後受控發布並回饋；權限預算由系統強制。</desc><defs><marker id="a-72ddda" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#72ddda" stroke-width="1.4"/></marker><marker id="a-f5cb78" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#f5cb78" stroke-width="1.4"/></marker><marker id="a-ff9a98" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#ff9a98" stroke-width="1.4"/></marker><marker id="a-b6cbd4" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#b6cbd4" stroke-width="1.4"/></marker></defs><rect width="1200" height="760" rx="24" fill="#081725"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="48" y="59" fill="#f4f5ef" font-size="37" font-weight="700" text-anchor="start">先打通單次驗證，再把它接到持續運作的系統</text><text x="48" y="102" fill="#b6cbd4" font-size="24" font-weight="400" text-anchor="start">本文工程延伸｜迴圈觀念來自演講；風險與權限關卡為作者建議</text><rect x="60" y="155" width="485" height="139" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="84" y="199" fill="#f5cb78" font-size="29" font-weight="700" text-anchor="start">外迴圈｜選擇值得做的事</text><text x="84" y="239" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">事件、使用者回報、錯誤與遙測</text><text x="84" y="275" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">判斷優先序、風險、任務範圍</text><rect x="655" y="155" width="485" height="139" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="679" y="199" fill="#72ddda" font-size="29" font-weight="700" text-anchor="start">內迴圈｜把一件事做對</text><text x="679" y="239" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">重現 → 研究／規劃 → 修改</text><text x="679" y="275" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">操作真實應用 → 證據 → 修正</text><path d="M550 223 L648 223" fill="none" stroke="#f5cb78" stroke-width="3" marker-end="url(#a-f5cb78)"/><text x="600" y="194" fill="#f5cb78" font-size="24" font-weight="400" text-anchor="middle">派工</text><rect x="655" y="385" width="485" height="152" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="679" y="429" fill="#72ddda" font-size="29" font-weight="700" text-anchor="start">整合關卡｜不是 agent 自己說了算</text><text x="679" y="469" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">依風險選擇自動或人工核准</text><text x="679" y="505" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">受保護的檢查、版本一致的證據</text><path d="M897 300 L897 376" fill="none" stroke="#72ddda" stroke-width="3" marker-end="url(#a-72ddda)"/><rect x="60" y="385" width="485" height="152" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="84" y="429" fill="#f5cb78" font-size="29" font-weight="700" text-anchor="start">上線觀察｜檢查真實結果</text><text x="84" y="469" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">受控發布、故障停損與回滾</text><text x="84" y="505" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">看使用者結果，不只看 PR 數</text><path d="M649 461 L552 461" fill="none" stroke="#f5cb78" stroke-width="3" marker-end="url(#a-f5cb78)"/><path d="M303 379 L303 302" fill="none" stroke="#f5cb78" stroke-width="3" marker-end="url(#a-f5cb78)"/><rect x="60" y="599" width="1080" height="83" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="600" y="633" fill="#f4f5ef" font-size="27" font-weight="700" text-anchor="middle">貫穿兩個迴圈：授權範圍、預算、隔離環境、事件去重與停止條件</text><text x="600" y="666" fill="#b6cbd4" font-size="25" font-weight="400" text-anchor="middle">回報與日誌是待判讀的資料，不是提高權限的指令。</text><text x="48" y="728" fill="#b6cbd4" font-size="21" font-weight="400" text-anchor="start">依 Lauren Tan 演講與 Matt Pocock 對談整理；非 Grok Bot 官方系統架構。</text></g></svg>
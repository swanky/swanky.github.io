<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">驗證技能的交付物，不只是一份說明書</title><desc id="desc">依 create-verification-skill 規格整理：啟動、檢查、實際操作、存證、清理並確認證據仍在。</desc><defs><marker id="a-72ddda" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#72ddda" stroke-width="1.4"/></marker><marker id="a-f5cb78" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#f5cb78" stroke-width="1.4"/></marker><marker id="a-ff9a98" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#ff9a98" stroke-width="1.4"/></marker><marker id="a-b6cbd4" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#b6cbd4" stroke-width="1.4"/></marker></defs><rect width="1200" height="760" rx="24" fill="#081725"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="48" y="59" fill="#f4f5ef" font-size="37" font-weight="700" text-anchor="start">驗證技能的交付物，不只是一份說明書</text><text x="48" y="102" fill="#b6cbd4" font-size="24" font-weight="400" text-anchor="start">規格整理｜腳本、產品路徑與留下來的證據，缺一不可</text><rect x="55" y="156" width="334" height="135" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="79" y="200" fill="#72ddda" font-size="29" font-weight="700" text-anchor="start">1. Launch</text><text x="79" y="240" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">啟動正確版本</text><text x="79" y="276" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">確認就緒條件</text><rect x="433" y="156" width="334" height="135" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="457" y="200" fill="#72ddda" font-size="29" font-weight="700" text-anchor="start">2. Doctor</text><text x="457" y="240" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">唯讀檢查實例</text><text x="457" y="276" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">環境不對就停止</text><rect x="811" y="156" width="334" height="135" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="835" y="200" fill="#72ddda" font-size="29" font-weight="700" text-anchor="start">3. Drive</text><text x="835" y="240" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">操作已列入地圖的功能</text><text x="835" y="276" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">走真實使用者路徑</text><path d="M394 219 L427 219" fill="none" stroke="#72ddda" stroke-width="3" marker-end="url(#a-72ddda)"/><path d="M772 219 L805 219" fill="none" stroke="#72ddda" stroke-width="3" marker-end="url(#a-72ddda)"/><rect x="811" y="367" width="334" height="137" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="835" y="411" fill="#f5cb78" font-size="29" font-weight="700" text-anchor="start">4. Evidence</text><text x="835" y="451" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">動作、結果與副作用</text><text x="835" y="487" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">保留可核對的產物</text><rect x="433" y="367" width="334" height="137" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="457" y="411" fill="#f5cb78" font-size="29" font-weight="700" text-anchor="start">5. Cleanup</text><text x="457" y="451" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">只清自己的執行狀態</text><text x="457" y="487" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">不要把證據一起刪掉</text><rect x="55" y="367" width="334" height="137" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="79" y="411" fill="#f5cb78" font-size="29" font-weight="700" text-anchor="start">6. 查證仍可讀</text><text x="79" y="451" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">清理後仍能找到證據</text><text x="79" y="487" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">未實跑只能算草稿</text><path d="M978 297 L978 361" fill="none" stroke="#f5cb78" stroke-width="3" marker-end="url(#a-f5cb78)"/><path d="M805 435 L772 435" fill="none" stroke="#f5cb78" stroke-width="3" marker-end="url(#a-f5cb78)"/><path d="M427 435 L394 435" fill="none" stroke="#f5cb78" stroke-width="3" marker-end="url(#a-f5cb78)"/><rect x="55" y="558" width="1090" height="117" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="84" y="602" fill="#72ddda" font-size="29" font-weight="700" text-anchor="start">底座：Feature map ＋ 可執行的 Helpers ＋ 隔離與停止條件</text><text x="84" y="646" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">初次跑通一個功能，證明工具鏈可用；不代表全產品已完成驗證。</text><text x="48" y="728" fill="#b6cbd4" font-size="21" font-weight="400" text-anchor="start">來源：pstack 0.15.15 create-verification-skill；本文流程圖。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">信任先於規模，不是先開一百個 agent</title><desc id="desc">依 Lauren Tan 演講信任曲線重繪。縱軸信任、橫軸 agent 數量；原圖是概念圖，不是實測或產能預測。</desc><defs><marker id="a-72ddda" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#72ddda" stroke-width="1.4"/></marker><marker id="a-f5cb78" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#f5cb78" stroke-width="1.4"/></marker><marker id="a-ff9a98" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#ff9a98" stroke-width="1.4"/></marker><marker id="a-b6cbd4" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#b6cbd4" stroke-width="1.4"/></marker></defs><rect width="1200" height="760" rx="24" fill="#081725"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="48" y="59" fill="#f4f5ef" font-size="37" font-weight="700" text-anchor="start">信任先於規模，不是先開一百個 agent</text><text x="48" y="102" fill="#b6cbd4" font-size="24" font-weight="400" text-anchor="start">簡報觀念重繪｜保留原圖軸向與概念級距</text><path d="M170 530 L1110 530" fill="none" stroke="#b6cbd4" stroke-width="3" marker-end="url(#a-b6cbd4)"/><path d="M170 530 L170 154" fill="none" stroke="#b6cbd4" stroke-width="3" marker-end="url(#a-b6cbd4)"/><text x="49" y="326" fill="#72ddda" font-size="29" font-weight="700" text-anchor="start">信任</text><text x="644" y="603" fill="#72ddda" font-size="29" font-weight="700" text-anchor="middle">可委派的 agent 規模</text><path d="M180 520 C260 245 530 192 1090 167" stroke="#72ddda" fill="none" stroke-width="6"/><path d="M180 519.999999999997 L180 530" fill="none" stroke="#b6cbd4" stroke-width="3" stroke-dasharray="9 7"/><text x="180" y="568" fill="#f4f5ef" font-size="24" font-weight="400" text-anchor="middle">1</text><path d="M275 354.4881499814692 L275 530" fill="none" stroke="#b6cbd4" stroke-width="3" stroke-dasharray="9 7"/><text x="275" y="568" fill="#f4f5ef" font-size="24" font-weight="400" text-anchor="middle">1–5</text><path d="M392 275.0750409367817 L392 530" fill="none" stroke="#b6cbd4" stroke-width="3" stroke-dasharray="9 7"/><text x="392" y="568" fill="#f4f5ef" font-size="24" font-weight="400" text-anchor="middle">5–10</text><path d="M515 231.64544306673454 L515 530" fill="none" stroke="#b6cbd4" stroke-width="3" stroke-dasharray="9 7"/><text x="515" y="568" fill="#f4f5ef" font-size="24" font-weight="400" text-anchor="middle">10–20</text><path d="M790 186.716368061997 L790 530" fill="none" stroke="#b6cbd4" stroke-width="3" stroke-dasharray="9 7"/><text x="790" y="568" fill="#f4f5ef" font-size="24" font-weight="400" text-anchor="middle">數百</text><path d="M1050 168.8597743037897 L1050 530" fill="none" stroke="#b6cbd4" stroke-width="3" stroke-dasharray="9 7"/><text x="1050" y="568" fill="#f4f5ef" font-size="24" font-weight="400" text-anchor="middle">數千</text><rect x="568" y="300" width="527" height="143" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="595" y="341" fill="#f5cb78" font-size="28" font-weight="700" text-anchor="start">不要把概念曲線當成產能公式</text><text x="595" y="381" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">先建立可驗證的環境，再增加並行。</text><text x="595" y="417" fill="#b6cbd4" font-size="23" font-weight="400" text-anchor="start">刻度為概念分區，非等距實測座標。</text><text x="64" y="665" fill="#f5cb78" font-size="28" font-weight="400" text-anchor="start">人盯著每一步 → 工具提出證據 → 環境限制錯誤 → 擴大授權</text><text x="48" y="728" fill="#b6cbd4" font-size="21" font-weight="400" text-anchor="start">來源：Lauren Tan 演講「trust」投影片；本文中文重繪，非量化研究。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">抽樣看品質，不代表抽樣決定安全</title><desc id="desc">候選變更通過獨立規則判斷後，三個互斥分支：停止補證據、人工核准、限定自動合併。不是依序都執行。</desc><defs><marker id="a-72ddda" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#72ddda" stroke-width="1.4"/></marker><marker id="a-f5cb78" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#f5cb78" stroke-width="1.4"/></marker><marker id="a-ff9a98" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#ff9a98" stroke-width="1.4"/></marker><marker id="a-b6cbd4" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#b6cbd4" stroke-width="1.4"/></marker></defs><rect width="1200" height="760" rx="24" fill="#081725"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="48" y="59" fill="#f4f5ef" font-size="37" font-weight="700" text-anchor="start">抽樣看品質，不代表抽樣決定安全</text><text x="48" y="102" fill="#b6cbd4" font-size="24" font-weight="400" text-anchor="start">本文導入建議｜抽樣審查用來改善系統，高風險變更仍逐件核准</text><rect x="345" y="145" width="510" height="122" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="369" y="189" fill="#72ddda" font-size="29" font-weight="700" text-anchor="start">候選 PR ＋ 同版本證據</text><text x="369" y="229" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">測試、真實操作、trace、變更範圍</text><path d="M600 274 L600 325" fill="none" stroke="#72ddda" stroke-width="3" marker-end="url(#a-72ddda)"/><rect x="300" y="335" width="600" height="104" rx="18" fill="#163b44" stroke="#72ddda" stroke-width="2"/><text x="600" y="378" fill="#f4f5ef" font-size="29" font-weight="700" text-anchor="middle">可信的外部規則判斷風險與證據</text><text x="600" y="416" fill="#b6cbd4" font-size="25" font-weight="400" text-anchor="middle">寫程式的 agent 不得自行降級規則</text><path d="M355 446 L217 500" fill="none" stroke="#ff9a98" stroke-width="3" marker-end="url(#a-ff9a98)"/><path d="M600 446 L600 500" fill="none" stroke="#f5cb78" stroke-width="3" marker-end="url(#a-f5cb78)"/><path d="M845 446 L983 500" fill="none" stroke="#72ddda" stroke-width="3" marker-end="url(#a-72ddda)"/><rect x="55" y="512" width="325" height="159" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="79" y="556" fill="#ff9a98" font-size="29" font-weight="700" text-anchor="start">停止／補證據</text><text x="79" y="596" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">失敗、缺件、過期</text><text x="79" y="632" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">禁止整合或發布</text><rect x="437" y="512" width="325" height="159" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="461" y="556" fill="#f5cb78" font-size="29" font-weight="700" text-anchor="start">人工核准</text><text x="461" y="596" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">權限、付款、資料遷移</text><text x="461" y="632" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">不可逆或高風險變更</text><rect x="819" y="512" width="325" height="159" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="843" y="556" fill="#72ddda" font-size="29" font-weight="700" text-anchor="start">限定自動合併</text><text x="843" y="596" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">低風險且符合政策</text><text x="843" y="632" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">合併後仍須監測</text><text x="48" y="728" fill="#b6cbd4" font-size="21" font-weight="400" text-anchor="start">作者設計的風險分流；不是 Lauren Tan 團隊已公開實作的完整政策。</text></g></svg>
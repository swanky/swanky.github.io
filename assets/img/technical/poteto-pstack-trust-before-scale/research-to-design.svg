<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">先讓問題可回答，再讓計畫可執行</title><desc id="desc">把問題重述、機制與理由研究、競爭設計、原型與可驗證計畫組合。不是每次都固定全跑。</desc><defs><marker id="a-72ddda" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#72ddda" stroke-width="1.4"/></marker><marker id="a-f5cb78" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#f5cb78" stroke-width="1.4"/></marker><marker id="a-ff9a98" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#ff9a98" stroke-width="1.4"/></marker><marker id="a-b6cbd4" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#b6cbd4" stroke-width="1.4"/></marker></defs><rect width="1200" height="760" rx="24" fill="#081725"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="48" y="59" fill="#f4f5ef" font-size="37" font-weight="700" text-anchor="start">先讓問題可回答，再讓計畫可執行</text><text x="48" y="102" fill="#b6cbd4" font-size="24" font-weight="400" text-anchor="start">來源觀念整理｜依任務選擇路徑，不是固定的技能串接命令</text><rect x="55" y="156" width="340" height="126" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="79" y="200" fill="#72ddda" font-size="29" font-weight="700" text-anchor="start">先重述問題</text><text x="79" y="240" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">抓出誤解，避免先猜根因</text><rect x="55" y="340" width="340" height="126" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="79" y="384" fill="#72ddda" font-size="29" font-weight="700" text-anchor="start">理解機制與理由</text><text x="79" y="424" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">/how 查機制；/why 查證據</text><path d="M225 290 L225 333" fill="none" stroke="#72ddda" stroke-width="3" marker-end="url(#a-72ddda)"/><rect x="447" y="156" width="333" height="126" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="471" y="200" fill="#f5cb78" font-size="29" font-weight="700" text-anchor="start">比較不同設計</text><text x="471" y="240" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">先寫呼叫方式與邊界</text><rect x="447" y="340" width="333" height="126" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="471" y="384" fill="#f5cb78" font-size="29" font-weight="700" text-anchor="start">以小原型回答問題</text><text x="471" y="424" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">用實測淘汰錯誤假設</text><path d="M399 404 L440 219" fill="none" stroke="#72ddda" stroke-width="3" marker-end="url(#a-72ddda)"/><path d="M614 290 L614 333" fill="none" stroke="#f5cb78" stroke-width="3" marker-end="url(#a-f5cb78)"/><rect x="830" y="245" width="315" height="148" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="854" y="289" fill="#72ddda" font-size="29" font-weight="700" text-anchor="start">形成可執行計畫</text><text x="854" y="329" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">任務、依賴、驗證</text><text x="854" y="365" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">保留要求的人工關卡</text><path d="M784 375 L825 325" fill="none" stroke="#72ddda" stroke-width="3" marker-end="url(#a-72ddda)"/><rect x="55" y="544" width="1090" height="136" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="83" y="585" fill="#f5cb78" font-size="29" font-weight="700" text-anchor="start">別把不同層次當成同一件事</text><text x="83" y="625" fill="#f4f5ef" font-size="27" font-weight="400" text-anchor="start">合理推論 ≠ 歷史事實　｜　原型成功 ≠ 正式交付</text><text x="83" y="662" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">計畫格式通過 ≠ 功能已驗證　｜　預設流程 ≠ 你想要的授權</text><text x="48" y="728" fill="#b6cbd4" font-size="21" font-weight="400" text-anchor="start">來源：pstack Guide Pt. 2、architect、multi-phase-plan；本文整理。</text></g></svg>
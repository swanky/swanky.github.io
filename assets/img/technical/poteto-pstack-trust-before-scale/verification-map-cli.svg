<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">驗證能力＝產品地圖＋可重現的操作工具</title><desc id="desc">左側 Feature map 提供產品知識，右側 CLI 提供真實應用操作與取證能力，兩者結合才能驗證自己的工作。</desc><defs><marker id="a-72ddda" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#72ddda" stroke-width="1.4"/></marker><marker id="a-f5cb78" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#f5cb78" stroke-width="1.4"/></marker><marker id="a-ff9a98" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#ff9a98" stroke-width="1.4"/></marker><marker id="a-b6cbd4" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#b6cbd4" stroke-width="1.4"/></marker></defs><rect width="1200" height="760" rx="24" fill="#081725"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="48" y="59" fill="#f4f5ef" font-size="37" font-weight="700" text-anchor="start">驗證能力＝產品地圖＋可重現的操作工具</text><text x="48" y="102" fill="#b6cbd4" font-size="24" font-weight="400" text-anchor="start">簡報結構重繪｜Feature map gives context. A CLI gives control.</text><rect x="65" y="164" width="500" height="278" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="89" y="208" fill="#72ddda" font-size="29" font-weight="700" text-anchor="start">Feature map｜知道要驗什麼</text><text x="89" y="248" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">有哪些功能、使用者怎麼抵達</text><text x="89" y="284" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">需要什麼狀態與前置條件</text><text x="89" y="320" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">正確行為與重要例外</text><text x="89" y="356" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">持續維護的產品操作知識</text><rect x="635" y="164" width="500" height="278" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="659" y="208" fill="#f5cb78" font-size="29" font-weight="700" text-anchor="start">CLI｜真的能操作與取證</text><text x="659" y="248" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">啟動真實應用、建立可重現環境</text><text x="659" y="284" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">操作畫面、讀取狀態</text><text x="659" y="320" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">擷取 trace、heap snapshot、畫面</text><text x="659" y="356" fill="#f4f5ef" font-size="25" font-weight="400" text-anchor="start">固定工具，不是每次即興寫腳本</text><text x="600" y="310" fill="#72ddda" font-size="43" font-weight="700" text-anchor="middle">＋</text><path d="M315 448 L315 490" fill="none" stroke="#72ddda" stroke-width="3" marker-end="url(#a-72ddda)"/><path d="M885 448 L885 490" fill="none" stroke="#72ddda" stroke-width="3" marker-end="url(#a-72ddda)"/><path d="M315 490 L885 490" fill="none" stroke="#72ddda" stroke-width="3"/><path d="M600 490 L600 535" fill="none" stroke="#72ddda" stroke-width="3" marker-end="url(#a-72ddda)"/><rect x="195" y="544" width="810" height="98" rx="18" fill="#163b44" stroke="#72ddda" stroke-width="2"/><text x="600" y="585" fill="#f4f5ef" font-size="30" font-weight="700" text-anchor="middle">Agent 能自行驗證工作，並交付可檢查的證據</text><text x="600" y="623" fill="#b6cbd4" font-size="25" font-weight="400" text-anchor="middle">會跑測試，不等於知道該走哪條使用者流程。</text><text x="48" y="728" fill="#b6cbd4" font-size="21" font-weight="400" text-anchor="start">來源：Lauren Tan「High-quality verification」投影片；細項依演講整理。</text></g></svg>
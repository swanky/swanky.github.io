<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">每次糾正 agent，都要決定教訓存在哪裡</title><desc id="desc">依原投影片保留五層與順序：codebase、static analysis、rules/bugbot、skills、style guide。越靠前越能把規範變成結構與強制檢查。</desc><defs><marker id="a-72ddda" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#72ddda" stroke-width="1.4"/></marker><marker id="a-f5cb78" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#f5cb78" stroke-width="1.4"/></marker><marker id="a-ff9a98" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#ff9a98" stroke-width="1.4"/></marker><marker id="a-b6cbd4" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#b6cbd4" stroke-width="1.4"/></marker></defs><rect width="1200" height="760" rx="24" fill="#081725"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="48" y="59" fill="#f4f5ef" font-size="37" font-weight="700" text-anchor="start">每次糾正 agent，都要決定教訓存在哪裡</text><text x="48" y="102" fill="#b6cbd4" font-size="24" font-weight="400" text-anchor="start">簡報順序重繪｜強制約束與軟性指引，不能混為一談</text><rect x="65" y="146" width="1050" height="86" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="90" y="200" fill="#72ddda" font-size="38" font-weight="700" text-anchor="start">1</text><text x="150" y="181" fill="#72ddda" font-size="27" font-weight="700" text-anchor="start">Codebase｜架構與資料結構</text><text x="150" y="215" fill="#f4f5ef" font-size="24" font-weight="400" text-anchor="start">讓特定錯誤沒有合法的表達方式</text><rect x="65" y="246" width="1050" height="86" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="90" y="300" fill="#72ddda" font-size="38" font-weight="700" text-anchor="start">2</text><text x="150" y="281" fill="#72ddda" font-size="27" font-weight="700" text-anchor="start">Static analysis｜靜態檢查</text><text x="150" y="315" fill="#f4f5ef" font-size="24" font-weight="400" text-anchor="start">lint、編譯器與 CI 擋下違規</text><rect x="65" y="346" width="1050" height="86" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="90" y="400" fill="#f5cb78" font-size="38" font-weight="700" text-anchor="start">3</text><text x="150" y="381" fill="#f5cb78" font-size="27" font-weight="700" text-anchor="start">Rules / Bugbot｜規則與審查</text><text x="150" y="415" fill="#f4f5ef" font-size="24" font-weight="400" text-anchor="start">提供指引、找出問題；不等於強制隔離</text><rect x="65" y="446" width="1050" height="86" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="90" y="500" fill="#f5cb78" font-size="38" font-weight="700" text-anchor="start">4</text><text x="150" y="481" fill="#f5cb78" font-size="27" font-weight="700" text-anchor="start">Skills｜可重複的工程程序</text><text x="150" y="515" fill="#f4f5ef" font-size="24" font-weight="400" text-anchor="start">教 agent 怎麼研究、實作與驗證</text><rect x="65" y="546" width="1050" height="86" rx="18" fill="#132d40" stroke="#345467" stroke-width="2"/><text x="90" y="600" fill="#b6cbd4" font-size="38" font-weight="700" text-anchor="start">5</text><text x="150" y="581" fill="#b6cbd4" font-size="27" font-weight="700" text-anchor="start">Style guide｜人工約定</text><text x="150" y="615" fill="#f4f5ef" font-size="24" font-weight="400" text-anchor="start">仍仰賴人看見、記得、持續糾正</text><text x="70" y="682" fill="#f5cb78" font-size="28" font-weight="400" text-anchor="start">原則：重複出現的教訓，盡量搬到更能強制執行的地方。</text><text x="48" y="728" fill="#b6cbd4" font-size="21" font-weight="400" text-anchor="start">來源：Lauren Tan「whenever you correct your agent」投影片；中文說明為本文整理。</text></g></svg>
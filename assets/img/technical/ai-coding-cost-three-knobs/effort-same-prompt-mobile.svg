<svg xmlns="http://www.w3.org/2000/svg" width="640" height="790" viewBox="0 0 640 790" role="img" aria-labelledby="title desc">
<title id="title">同一個模型、同一個 prompt，只改 effort</title><desc id="desc">一位開發者用 Fable 5.2 跑同一個 prompt，只改 effort：high 花 24.31 美元、1 小時 5 分；高一級花 43.79 美元、3 小時 9 分；max 花 87.99 美元、3 小時 28 分。從 high 到 max，花費約 3.6 倍。單次實驗，不代表平均。</desc>
<rect width="640" height="790" fill="#fffdf9"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a5d00"/></marker></defs>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" fill="#232020">
<text x="28" y="56" font-size="34" fill="#232020" font-weight="700">同一個模型、同一個 prompt，</text>
<text x="28" y="100" font-size="34" fill="#232020" font-weight="700">只改 effort</text>
<text x="28" y="140" font-size="22" fill="#665e51">一位開發者用 Fable 5.2 的單次實驗</text>
<path d="M28 166H612" stroke="#d9d0bf"/>
<text x="28" y="206" font-size="26" fill="#232020" font-weight="700">high</text>
<text x="612" y="206" font-size="22" fill="#665e51" text-anchor="end">1 小時 5 分</text>
<rect x="28" y="222" width="161.3" height="56" rx="6" fill="#E5A300"/>
<text x="199.3" y="260" font-size="26" fill="#232020" font-weight="700">24.31 美元</text>
<text x="28" y="336" font-size="26" fill="#232020" font-weight="700">高一級</text>
<text x="612" y="336" font-size="22" fill="#665e51" text-anchor="end">3 小時 9 分</text>
<rect x="28" y="352" width="290.6" height="56" rx="6" fill="#E5A300"/>
<text x="328.6" y="390" font-size="26" fill="#232020" font-weight="700">43.79 美元</text>
<text x="28" y="466" font-size="26" fill="#232020" font-weight="700">max</text>
<text x="612" y="466" font-size="22" fill="#665e51" text-anchor="end">3 小時 28 分</text>
<rect x="28" y="482" width="584.0" height="56" rx="6" fill="#8a5d00"/>
<text x="44" y="520" font-size="26" fill="#ffffff" font-weight="700">87.99 美元</text>
<rect x="28" y="606" width="584" height="104" rx="10" fill="#f3efe7"/>
<text x="48" y="648" font-size="24" fill="#8a5d00" font-weight="700">從 high 到 max：花費約 3.6 倍</text>
<text x="48" y="686" font-size="22" fill="#665e51">他說 high 版漏畫了一道極光</text>
<text x="28" y="750" font-size="22" fill="#665e51">單次實驗，不代表平均；但數量級值得記住。</text>
</g>
</svg>

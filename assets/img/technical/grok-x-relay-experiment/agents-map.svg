<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif">
  <title>地端與雲端 AI agent、四種入口與 bot 模式的位置</title>
  <desc>你透過終端機、信箱、手機 app、瀏覽器四種入口接觸 AI agent。地端是你的電腦：Claude Code、Codex 是對話式，Hermes 是常駐的 bot 模式。雲端是別人的電腦：Grok Bot、OpenAI dot、Claude Duet 與排程任務都是 bot 模式。Hermes 寄信給 Grok Bot；Claude Code 與 Grok Bot 在私有倉庫的 issue 留言板對話；Grok Bot 每則先給你看、你說好才發上 X。</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6B7280"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B37A00"/></marker>
  </defs>
  <rect width="1200" height="780" fill="#fff"/>

  <!-- 你 -->
  <circle cx="80" cy="85" r="34" fill="#E5A300"/>
  <text x="80" y="94" font-size="26" font-weight="700" fill="#1F2937" text-anchor="middle">你</text>
  <text x="80" y="140" font-size="13" fill="#4B5563" text-anchor="middle">方向、審圖、同意</text>
  <line x1="114" y1="85" x2="210" y2="85" stroke="#6B7280" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="390" y1="85" x2="420" y2="85" stroke="#6B7280" stroke-width="2"/>
  <line x1="600" y1="85" x2="630" y2="85" stroke="#6B7280" stroke-width="2"/>
  <line x1="810" y1="85" x2="840" y2="85" stroke="#6B7280" stroke-width="2"/>

  <!-- 四種入口 -->
  <g font-size="20" font-weight="700" fill="#1F2937" text-anchor="middle">
    <rect x="210" y="50" width="180" height="70" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
    <text x="300" y="80">終端機</text><text x="300" y="104" font-size="13" font-weight="400" fill="#4B5563">電腦上的指令視窗</text>
    <rect x="420" y="50" width="180" height="70" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
    <text x="510" y="80">信箱</text><text x="510" y="104" font-size="13" font-weight="400" fill="#4B5563">寄一封信就是交辦</text>
    <rect x="630" y="50" width="180" height="70" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
    <text x="720" y="80">手機 app</text><text x="720" y="104" font-size="13" font-weight="400" fill="#4B5563">提醒、按同意</text>
    <rect x="840" y="50" width="180" height="70" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
    <text x="930" y="80">瀏覽器介面</text><text x="930" y="104" font-size="13" font-weight="400" fill="#4B5563">網頁裡跟它對話</text>
  </g>
  <text x="210" y="38" font-size="14" fill="#4B5563">你接觸 AI 的四種入口</text>

  <!-- 入口 → agent 的線 -->
  <g fill="none" stroke="#6B7280" stroke-width="2">
    <polyline points="300,120 300,175 145,175 145,250" marker-end="url(#ah)"/>
    <polyline points="300,175 315,175 315,250" marker-end="url(#ah)"/>
    <polyline points="510,120 510,175 480,175 480,250" marker-end="url(#ah)"/>
    <polyline points="720,120 720,250" marker-end="url(#ah)"/>
    <polyline points="930,120 930,165 895,165 895,250" marker-end="url(#ah)"/>
    <polyline points="930,165 1065,165 1065,250" marker-end="url(#ah)"/>
  </g>

  <!-- 地端 -->
  <rect x="40" y="190" width="520" height="320" rx="14" fill="#F3F6FA" stroke="#2C5B8F" stroke-width="2"/>
  <text x="60" y="222" font-size="19" font-weight="700" fill="#2C5B8F">地端：你的電腦</text>
  <!-- 雲端 -->
  <rect x="620" y="190" width="540" height="320" rx="14" fill="#FFF8E6" stroke="#B37A00" stroke-width="2"/>
  <text x="640" y="222" font-size="19" font-weight="700" fill="#8A5A00">雲端：別人的電腦，不用開著你的</text>

  <!-- agent 方塊 -->
  <g text-anchor="middle">
    <rect x="70" y="250" width="150" height="100" rx="10" fill="#fff" stroke="#2C5B8F" stroke-width="2"/>
    <text x="145" y="290" font-size="19" font-weight="700" fill="#1F2937">Claude Code</text>
    <rect x="100" y="312" width="90" height="26" rx="13" fill="#E5E7EB"/><text x="145" y="330" font-size="14" fill="#374151">對話式</text>

    <rect x="240" y="250" width="150" height="100" rx="10" fill="#fff" stroke="#2C5B8F" stroke-width="2"/>
    <text x="315" y="290" font-size="19" font-weight="700" fill="#1F2937">Codex</text>
    <rect x="270" y="312" width="90" height="26" rx="13" fill="#E5E7EB"/><text x="315" y="330" font-size="14" fill="#374151">對話式</text>

    <rect x="410" y="250" width="140" height="100" rx="10" fill="#fff" stroke="#B37A00" stroke-width="2.5"/>
    <text x="480" y="290" font-size="19" font-weight="700" fill="#1F2937">Hermes</text>
    <rect x="435" y="312" width="90" height="26" rx="13" fill="#E5A300"/><text x="480" y="330" font-size="14" font-weight="700" fill="#1F2937">bot 模式</text>

    <rect x="650" y="250" width="150" height="100" rx="10" fill="#fff" stroke="#B37A00" stroke-width="2.5"/>
    <text x="725" y="290" font-size="19" font-weight="700" fill="#1F2937">Grok Bot</text>
    <rect x="680" y="312" width="90" height="26" rx="13" fill="#E5A300"/><text x="725" y="330" font-size="14" font-weight="700" fill="#1F2937">bot 模式</text>

    <rect x="820" y="250" width="150" height="100" rx="10" fill="#fff" stroke="#B37A00" stroke-width="2.5"/>
    <text x="895" y="290" font-size="19" font-weight="700" fill="#1F2937">OpenAI dot</text>
    <rect x="850" y="312" width="90" height="26" rx="13" fill="#E5A300"/><text x="895" y="330" font-size="14" font-weight="700" fill="#1F2937">bot 模式</text>

    <rect x="990" y="250" width="150" height="100" rx="10" fill="#fff" stroke="#B37A00" stroke-width="2.5"/>
    <text x="1065" y="290" font-size="19" font-weight="700" fill="#1F2937">Claude Duet</text>
    <rect x="1020" y="312" width="90" height="26" rx="13" fill="#E5A300"/><text x="1065" y="330" font-size="14" font-weight="700" fill="#1F2937">bot 模式</text>

    <rect x="800" y="410" width="340" height="60" rx="10" fill="#fff" stroke="#B37A00" stroke-width="2.5"/>
    <text x="970" y="446" font-size="15" font-weight="700" fill="#1F2937">Claude Code／Codex 排程任務、Claude Tag</text>
  </g>
  <text x="810" y="386" font-size="14" fill="#4B5563">有自己的信箱與電腦，照排程收工作</text>

  <!-- Hermes → Grok Bot 寄信 -->
  <line x1="550" y1="300" x2="650" y2="300" stroke="#B37A00" stroke-width="2.5" marker-end="url(#ahg)"/>
  <text x="600" y="290" font-size="13" fill="#8A5A00" text-anchor="middle">寄信</text>
  <text x="598" y="324" font-size="12" fill="#8A5A00" text-anchor="middle">每日雷達</text>

  <!-- 地端／雲端 註 -->
  <text x="170" y="400" font-size="14" fill="#4B5563">對話式：你開著視窗它才動。</text>
  <text x="170" y="424" font-size="14" fill="#4B5563">Hermes 常駐在你的機器上，每隔幾秒看一次信箱。</text>
  <text x="170" y="470" font-size="14" font-weight="700" fill="#2C5B8F">只有地端讀得到你的硬碟、作品與網站後台。</text>
  <text x="800" y="496" font-size="14" font-weight="700" fill="#8A5A00">雲端讀得到公開的 X，讀不到你的硬碟。</text>

  <!-- 下方：留言板與 X -->
  <g fill="none" stroke="#6B7280" stroke-width="2">
    <polyline points="145,350 145,635 250,635" marker-end="url(#ah)"/>
    <polyline points="725,350 725,635 630,635" marker-end="url(#ah)"/>
    <polyline points="760,350 760,540 1065,540 1065,600" marker-end="url(#ah)"/>
  </g>
  <rect x="250" y="600" width="380" height="70" rx="10" fill="#fff" stroke="#6B7280" stroke-width="2"/>
  <text x="440" y="630" font-size="19" font-weight="700" fill="#1F2937" text-anchor="middle">私有倉庫的 issue 留言板</text>
  <text x="440" y="656" font-size="14" fill="#4B5563" text-anchor="middle">兩個 AI 在這裡對話；貼文與圖放在同一個倉庫</text>
  <text x="160" y="620" font-size="13" fill="#4B5563">出稿、開 issue</text>
  <text x="735" y="612" font-size="13" fill="#4B5563">讀、排程、週報</text>
  <rect x="990" y="600" width="150" height="70" rx="10" fill="#fff" stroke="#6B7280" stroke-width="2"/>
  <text x="1065" y="643" font-size="24" font-weight="700" fill="#1F2937" text-anchor="middle">X</text>
  <text x="930" y="534" font-size="13" fill="#4B5563" text-anchor="middle">每則先給你看，你說好才發</text>

  <!-- 圖例 -->
  <rect x="40" y="712" width="90" height="26" rx="13" fill="#E5A300"/><text x="85" y="730" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">bot 模式</text>
  <text x="140" y="730" font-size="14" fill="#374151">＝常駐、有自己的身分或排程、自己收工作，不用你開著視窗</text>
  <rect x="40" y="746" width="90" height="26" rx="13" fill="#E5E7EB"/><text x="85" y="764" font-size="14" fill="#374151" text-anchor="middle">對話式</text>
  <text x="140" y="764" font-size="14" fill="#374151">＝你在終端機或網頁裡開著它才動；關掉就停</text>
</svg>

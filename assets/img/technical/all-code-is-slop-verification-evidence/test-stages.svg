<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 236" width="840" height="236" role="img" aria-labelledby="test-stages-w-title test-stages-w-desc"><title id="test-stages-w-title">測試不只在上線前：四個階段，共 42 種檢查</title><desc id="test-stages-w-desc">上線前在自己的環境測，有二十項；部署、發布、發布後三個階段都在正式環境裡測，分別有六項、五項、十一項。</desc><defs><marker id="test-stages-w-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5F5B53"/></marker><marker id="test-stages-w-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E5A300"/></marker><marker id="test-stages-w-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4FA6D5"/></marker></defs><rect width="100%" height="100%" fill="#FFFDF9"/><text x="24" y="44" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="500" fill="#5F5B53" text-anchor="start">在自己的環境測</text><text x="229" y="44" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="500" fill="#8A5D00" text-anchor="start">在正式環境裡測</text><line x1="24" y1="56" x2="201" y2="56" stroke="#4FA6D5" stroke-width="2"/><line x1="229" y1="56" x2="816" y2="56" stroke="#E5A300" stroke-width="2"/><path d="M203,140 H225" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#test-stages-w-arrow)"/><path d="M408,140 H430" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#test-stages-w-arrow)"/><path d="M613,140 H635" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#test-stages-w-arrow)"/><rect x="24" y="72" width="177" height="140" rx="10" fill="#E6F2F9" stroke="#4FA6D5" stroke-width="2"/><text x="40" y="108" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="20" font-weight="700" fill="#232020" text-anchor="start">上線前</text><text x="40" y="138" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="400" fill="#5F5B53" text-anchor="start">還在自己的環境</text><text x="40" y="194" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="700" fill="#8A5D00" text-anchor="start">20 項</text><rect x="229" y="72" width="177" height="140" rx="10" fill="rgba(229,163,0,0.10)" stroke="#E5A300" stroke-width="2"/><text x="245" y="108" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="20" font-weight="700" fill="#232020" text-anchor="start">部署</text><text x="245" y="138" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="400" fill="#5F5B53" text-anchor="start">放上正式環境，</text><text x="245" y="160" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="400" fill="#5F5B53" text-anchor="start">還沒有使用者流量</text><text x="245" y="194" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="700" fill="#8A5D00" text-anchor="start">6 項</text><rect x="434" y="72" width="177" height="140" rx="10" fill="rgba(229,163,0,0.10)" stroke="#E5A300" stroke-width="2"/><text x="450" y="108" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="20" font-weight="700" fill="#232020" text-anchor="start">發布</text><text x="450" y="138" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="400" fill="#5F5B53" text-anchor="start">逐步放使用者</text><text x="450" y="160" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="400" fill="#5F5B53" text-anchor="start">進來</text><text x="450" y="194" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="700" fill="#8A5D00" text-anchor="start">5 項</text><rect x="639" y="72" width="177" height="140" rx="10" fill="rgba(229,163,0,0.10)" stroke="#E5A300" stroke-width="2"/><text x="655" y="108" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="20" font-weight="700" fill="#232020" text-anchor="start">發布後</text><text x="655" y="138" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="400" fill="#5F5B53" text-anchor="start">所有人都在用</text><text x="655" y="194" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="700" fill="#8A5D00" text-anchor="start">11 項</text></svg>

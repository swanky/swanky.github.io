<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 640" width="440" height="640" role="img" aria-labelledby="cancel-race-m-title cancel-race-m-desc"><title id="cancel-race-m-title">按下取消之後，哪個訊息先到，結果就不同</title><desc id="cancel-race-m-desc">按下取消時有兩個訊息正在往回送。做好了先到，結果是已完成；取消成功先到，結果是已取消。</desc><defs><marker id="cancel-race-m-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5F5B53"/></marker><marker id="cancel-race-m-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E5A300"/></marker><marker id="cancel-race-m-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4FA6D5"/></marker></defs><rect width="100%" height="100%" fill="#FFFDF9"/><path d="M220,104 V134" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#cancel-race-m-arrow)"/><rect x="24" y="24" width="392" height="80" rx="10" fill="#FAF5EA" stroke="rgba(66,52,32,0.14)" stroke-width="1.5"/><text x="220.0" y="58.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#232020" text-anchor="middle">你按下「取消」</text><text x="220.0" y="85.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="17" font-weight="400" fill="#5F5B53" text-anchor="middle">這時有兩個訊息正在往回送</text><rect x="24" y="140" width="392" height="216" rx="10" fill="#FFFDF9" stroke="#4FA6D5" stroke-width="2"/><path d="M220,236 V258" fill="none" stroke="#4FA6D5" stroke-width="2" marker-end="url(#cancel-race-m-arrow-link)"/><rect x="40" y="156" width="360" height="80" rx="10" fill="#FFFDF9" stroke="rgba(66,52,32,0.14)" stroke-width="1.5"/><text x="220.0" y="190.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#232020" text-anchor="middle">「做好了」先到</text><text x="220.0" y="217.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="17" font-weight="400" fill="#5F5B53" text-anchor="middle">報表已經做完，訊息搶先回來</text><rect x="40" y="262" width="360" height="80" rx="10" fill="#E6F2F9" stroke="#4FA6D5" stroke-width="1.5"/><text x="220.0" y="296.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#232020" text-anchor="middle">結果：已完成</text><text x="220.0" y="323.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="17" font-weight="400" fill="#5F5B53" text-anchor="middle">你按了取消，卻收到一份報表</text><rect x="24" y="372" width="392" height="216" rx="10" fill="#FFFDF9" stroke="#E5A300" stroke-width="2"/><path d="M220,468 V490" fill="none" stroke="#E5A300" stroke-width="2" marker-end="url(#cancel-race-m-arrow-accent)"/><rect x="40" y="388" width="360" height="80" rx="10" fill="#FFFDF9" stroke="rgba(66,52,32,0.14)" stroke-width="1.5"/><text x="220.0" y="422.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#232020" text-anchor="middle">「取消成功」先到</text><text x="220.0" y="449.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="17" font-weight="400" fill="#5F5B53" text-anchor="middle">取消的要求先被系統確認</text><rect x="40" y="494" width="360" height="80" rx="10" fill="rgba(229,163,0,0.10)" stroke="#E5A300" stroke-width="1.5"/><text x="220.0" y="528.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#232020" text-anchor="middle">結果：已取消</text><text x="220.0" y="555.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="17" font-weight="400" fill="#5F5B53" text-anchor="middle">和你預期的一樣</text><text x="220" y="618" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="500" fill="#8A5D00" text-anchor="middle">▸ 同樣的事件，順序不同，結果不同</text></svg>

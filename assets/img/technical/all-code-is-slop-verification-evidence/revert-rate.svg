<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 316" width="840" height="316" role="img" aria-labelledby="revert-rate-w-title revert-rate-w-desc"><title id="revert-rate-w-title">回退率只算到三種情況裡的一種</title><desc id="revert-rate-w-desc">有錯的 PR 有三種下場：整條被回退、另開一條 PR 補上、還沒被發現。回退率只算第一種。</desc><defs><marker id="revert-rate-w-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5F5B53"/></marker><marker id="revert-rate-w-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E5A300"/></marker><marker id="revert-rate-w-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4FA6D5"/></marker></defs><rect width="100%" height="100%" fill="#FFFDF9"/><path d="M330,96 V120 Q330,128 322,128 H159 Q151,128 151,136 V154" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#revert-rate-w-arrow)"/><path d="M420,96 V154" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#revert-rate-w-arrow)"/><path d="M510,96 V120 Q510,128 518,128 H681 Q689,128 689,136 V154" fill="none" stroke="#5F5B53" stroke-width="2" marker-end="url(#revert-rate-w-arrow)"/><rect x="200" y="24" width="440" height="72" rx="10" fill="#FAF5EA" stroke="rgba(66,52,32,0.14)" stroke-width="1.5"/><text x="420.0" y="54.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="20" font-weight="700" fill="#232020" text-anchor="middle">有錯的 PR</text><text x="420.0" y="80.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="400" fill="#5F5B53" text-anchor="middle">總共多少，外人不知道</text><rect x="24" y="160" width="254" height="92" rx="10" fill="rgba(229,163,0,0.10)" stroke="#E5A300" stroke-width="1.5"/><text x="151.0" y="200.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="20" font-weight="700" fill="#232020" text-anchor="middle">整條被回退</text><text x="151.0" y="226.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="400" fill="#5F5B53" text-anchor="middle">回退率只算這一格：約 0.5%</text><rect x="293" y="160" width="254" height="92" rx="10" fill="#FFFDF9" stroke="rgba(66,52,32,0.14)" stroke-width="1.5"/><text x="420.0" y="200.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="20" font-weight="700" fill="#232020" text-anchor="middle">另開一條 PR 補上</text><text x="420.0" y="226.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="400" fill="#5F5B53" text-anchor="middle">修好了，但不算回退</text><rect x="562" y="160" width="254" height="92" rx="10" fill="#FFFDF9" stroke="rgba(66,52,32,0.14)" stroke-width="1.5"/><text x="689.0" y="200.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="20" font-weight="700" fill="#232020" text-anchor="middle">還沒被發現</text><text x="689.0" y="226.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="400" fill="#5F5B53" text-anchor="middle">沒人知道，也不在數字裡</text><text x="420" y="292" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="500" fill="#8A5D00" text-anchor="middle">▸ 回退率低，可能是品質好，也可能是後兩格比較大</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="840" height="440" role="img" aria-labelledby="cancel-race-w-title cancel-race-w-desc"><title id="cancel-race-w-title">按下取消之後，哪個訊息先到，結果就不同</title><desc id="cancel-race-w-desc">按下取消時有兩個訊息正在往回送。做好了先到，結果是已完成；取消成功先到，結果是已取消。</desc><defs><marker id="cancel-race-w-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5F5B53"/></marker><marker id="cancel-race-w-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E5A300"/></marker><marker id="cancel-race-w-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4FA6D5"/></marker></defs><rect width="100%" height="100%" fill="#FFFDF9"/><path d="M406,108 V128 Q406,136 398,136 H212 Q204,136 204,144 V166" fill="none" stroke="#4FA6D5" stroke-width="2" marker-end="url(#cancel-race-w-arrow-link)"/><path d="M434,108 V128 Q434,136 442,136 H628 Q636,136 636,144 V166" fill="none" stroke="#E5A300" stroke-width="2" marker-end="url(#cancel-race-w-arrow-accent)"/><path d="M204,256 V292" fill="none" stroke="#4FA6D5" stroke-width="2" marker-end="url(#cancel-race-w-arrow-link)"/><path d="M636,256 V292" fill="none" stroke="#E5A300" stroke-width="2" marker-end="url(#cancel-race-w-arrow-accent)"/><rect x="200" y="24" width="440" height="84" rx="10" fill="#FAF5EA" stroke="rgba(66,52,32,0.14)" stroke-width="1.5"/><text x="420.0" y="60.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="20" font-weight="700" fill="#232020" text-anchor="middle">你按下「取消」</text><text x="420.0" y="86.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="400" fill="#5F5B53" text-anchor="middle">這時有兩個訊息正在往回送</text><rect x="24" y="172" width="360" height="84" rx="10" fill="#FFFDF9" stroke="#4FA6D5" stroke-width="1.5"/><text x="204.0" y="208.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="20" font-weight="700" fill="#232020" text-anchor="middle">「做好了」先到</text><text x="204.0" y="234.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="400" fill="#5F5B53" text-anchor="middle">報表已經做完，訊息搶先回來</text><rect x="24" y="298" width="360" height="84" rx="10" fill="#E6F2F9" stroke="#4FA6D5" stroke-width="1.5"/><text x="204.0" y="334.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="20" font-weight="700" fill="#232020" text-anchor="middle">結果：已完成</text><text x="204.0" y="360.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="400" fill="#5F5B53" text-anchor="middle">你按了取消，卻收到一份報表</text><rect x="456" y="172" width="360" height="84" rx="10" fill="#FFFDF9" stroke="#E5A300" stroke-width="1.5"/><text x="636.0" y="208.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="20" font-weight="700" fill="#232020" text-anchor="middle">「取消成功」先到</text><text x="636.0" y="234.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="400" fill="#5F5B53" text-anchor="middle">取消的要求先被系統確認</text><rect x="456" y="298" width="360" height="84" rx="10" fill="rgba(229,163,0,0.10)" stroke="#E5A300" stroke-width="1.5"/><text x="636.0" y="334.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="20" font-weight="700" fill="#232020" text-anchor="middle">結果：已取消</text><text x="636.0" y="360.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="400" fill="#5F5B53" text-anchor="middle">和你預期的一樣</text><text x="420" y="418" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="15" font-weight="500" fill="#8A5D00" text-anchor="middle">▸ 同樣的事件，順序不同，結果不同</text></svg>

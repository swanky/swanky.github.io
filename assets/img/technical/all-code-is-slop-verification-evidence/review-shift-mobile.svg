<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 786" width="440" height="786" role="img" aria-labelledby="review-shift-m-title review-shift-m-desc"><title id="review-shift-m-title">審查的對象換了：從看程式修改，到看 AI 交出的證據</title><desc id="review-shift-m-desc">左欄是以前人逐行看程式修改，一天約三條看得完、約三百條看不完；右欄是現在看操作影片、截圖、狀態圖與數學驗證結果，問的是它有沒有做到我要的事。</desc><defs><marker id="review-shift-m-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5F5B53"/></marker><marker id="review-shift-m-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E5A300"/></marker><marker id="review-shift-m-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4FA6D5"/></marker></defs><rect width="100%" height="100%" fill="#FFFDF9"/><path d="M220,372 V412" fill="none" stroke="#E5A300" stroke-width="2" marker-end="url(#review-shift-m-arrow-accent)"/><text x="236" y="398" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="500" fill="#8A5D00" text-anchor="start">換個東西看</text><rect x="24" y="24" width="392" height="344" rx="10" fill="#E6F2F9" stroke="#4FA6D5" stroke-width="2"/><text x="48" y="68" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#232020" text-anchor="start">以前：人逐行看程式修改</text><rect x="48" y="96" width="344" height="72" rx="10" fill="#FFFDF9" stroke="rgba(66,52,32,0.14)" stroke-width="1.5"/><text x="64" y="126.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="700" fill="#232020" text-anchor="start">看什麼</text><text x="64" y="153.0" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="17" font-weight="400" fill="#5F5B53" text-anchor="
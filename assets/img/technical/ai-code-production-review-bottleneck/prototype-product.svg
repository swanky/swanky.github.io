<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">展示成功，只回答了一個問題</title><desc id="desc">課程報名原型呈現正常操作；正式使用還要處理名額、通知、權限、規則與復原。</desc>
<defs><marker id="cyan" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#6fe5ed"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#ffd07a"/></marker></defs>
<rect width="1200" height="740" rx="24" fill="#07111f"/>
<g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="48" y="64" fill="#eef5ff" font-size="38" font-weight="700">展示成功，只回答了一個問題</text><text x="48" y="111" fill="#c1d2e4" font-size="25" font-weight="400">課程報名工具｜本文自擬情境，非客戶案例</text><rect x="48" y="155" width="330" height="240" rx="18" fill="#13263b" stroke="#6fe5ed" stroke-width="2"/><text x="73" y="199" fill="#6fe5ed" font-size="30" font-weight="700">原型能展示</text><text x="73" y="246" fill="#eef5ff" font-size="25" font-weight="400">選課 → 填寫資料</text><text x="73" y="286" fill="#eef5ff" font-size="25" font-weight="400">付款 → 成功畫面</text><text x="73" y="326" fill="#eef5ff" font-size="25" font-weight="400">正常路徑走得通</text><path d="M392 276 H451" fill="none" stroke="#6fe5ed" stroke-width="3"  marker-end="url(#cyan)"/><rect x="480" y="155" width="672" height="240" rx="18" fill="#13263b" stroke="#ffd07a" stroke-width="2"/><text x="505" y="199" fill="#ffd07a" font-size="30" font-weight="700">產品還得回答</text><text x="505" y="246" fill="#eef5ff" font-size="25" font-weight="400">名額快滿：同時付款怎麼分配？</text><text x="505" y="286" fill="#eef5ff" font-size="25" font-weight="400">通知重送：會不會重複建單？</text><text x="505" y="326" fill="#eef5ff" font-size="25" font-weight="400">資料權限：誰能看哪一班學員？</text><rect x="48" y="440" width="535" height="180" rx="18" fill="#13263b" stroke="#6fe5ed" stroke-width="2"/><text x="73" y="484" fill="#6fe5ed" font-size="30" font-weight="700">失敗時也要成立</text><text x="73" y="531" fill="#eef5ff" font-size="25" font-weight="400">扣款後出錯，要能對帳與補救</text><text x="73" y="571" fill="#eef5ff" font-size="25" font-weight="400">改版失敗，要知道怎麼恢復</text><rect x="617" y="440" width="535" height="180" rx="18" fill="#13263b" stroke="#ffd07a" stroke-width="2"/><text x="642" y="484" fill="#ffd07a" font-size="30" font-weight="700">價值還要另外驗證</text><text x="642" y="531" fill="#eef5ff" font-size="25" font-weight="400">誰需要？誰付錢？資料拿得到嗎？</text><text x="642" y="571" fill="#eef5ff" font-size="25" font-weight="400">維運與服務成本，能不能承擔？</text><text x="48" y="692" fill="#eef5ff" font-size="29" font-weight="700">AI 可以協助每一層，但「能跑」不會自動證明這些條件。</text></g></svg>
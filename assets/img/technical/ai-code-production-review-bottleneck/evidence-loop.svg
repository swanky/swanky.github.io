<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc">
<title id="title">測試有沒有能力抓到錯？</title><desc id="desc">規則轉成驗收案例，以已知錯誤測試抓錯能力，驗證實作後才受控上線，將真實失敗回饋到下一版案例。</desc>
<defs><marker id="cyan" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#6fe5ed"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#ffd07a"/></marker></defs>
<rect width="1200" height="770" rx="24" fill="#07111f"/>
<g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="48" y="64" fill="#eef5ff" font-size="38" font-weight="700">測試有沒有能力抓到錯？</text><text x="48" y="110" fill="#c1d2e4" font-size="25" font-weight="400">本文建議循環｜測試全綠是證據，不是安全保證</text><rect x="48" y="160" width="330" height="175" rx="18" fill="#13263b" stroke="#6fe5ed" stroke-width="2"/><text x="73" y="204" fill="#6fe5ed" font-size="30" font-weight="700">先定義規則</text><text x="73" y="251" fill="#eef5ff" font-size="25" font-weight="400">例：不得超賣</text><text x="73" y="291" fill="#eef5ff" font-size="25" font-weight="400">扣款不得無故遺失</text><path d="M378 247 H424" fill="none" stroke="#6fe5ed" stroke-width="3"  marker-end="url(#cyan)"/><rect x="448" y="160" width="330" height="175" rx="18" fill="#13263b" stroke="#6fe5ed" stroke-width="2"/><text x="473" y="204" fill="#6fe5ed" font-size="30" font-weight="700">寫成驗收案例</text><text x="473" y="251" fill="#eef5ff" font-size="25" font-weight="400">最後一席同時搶購</text><text x="473" y="291" fill="#eef5ff" font-size="25" font-weight="400">逾時、重送、越權</text><path d="M778 247 H824" fill="none" stroke="#6fe5ed" stroke-width="3"  marker-end="url(#cyan)"/><rect x="848" y="160" width="304" height="175" rx="18" fill="#13263b" stroke="#ffd07a" stroke-width="2"/><text x="873" y="204" fill="#ffd07a" font-size="30" font-weight="700">先驗測試會抓錯</text><text x="873" y="251" fill="#eef5ff" font-size="25" font-weight="400">已知錯誤版本</text><text x="873" y="291" fill="#eef5ff" font-size="25" font-weight="400">應該被測試擋下</text><path d="M1000 335 V390" fill="none" stroke="#6fe5ed" stroke-width="3"  marker-end="url(#cyan)"/><rect x="848" y="414" width="304" height="175" rx="18" fill="#13263b" stroke="#6fe5ed" stroke-width="2"/><text x="873" y="458" fill="#6fe5ed" font-size="30" font-weight="700">驗證實作結果</text><text x="873" y="505" fill="#eef5ff" font-size="25" font-weight="400">通過才往前</text><text x="873" y="545" fill="#eef5ff" font-size="25" font-weight="400">失敗就修正重驗</text><path d="M848 501 H802" fill="none" stroke="#6fe5ed" stroke-width="3"  marker-end="url(#cyan)"/><rect x="448" y="414" width="330" height="175" rx="18" fill="#13263b" stroke="#6fe5ed" stroke-width="2"/><text x="473" y="458" fill="#6fe5ed" font-size="30" font-weight="700">受控上線與監測</text><text x="473" y="505" fill="#eef5ff" font-size="25" font-weight="400">逐步開放使用</text><text x="473" y="545" fill="#eef5ff" font-size="25" font-weight="400">觀察失敗與復原</text><path d="M448 501 H402" fill="none" stroke="#ffd07a" stroke-width="3"  marker-end="url(#amber)"/><rect x="48" y="414" width="330" height="175" rx="18" fill="#13263b" stroke="#ffd07a" stroke-width="2"/><text x="73" y="458" fill="#ffd07a" font-size="30" font-weight="700">保留真實失敗</text><text x="73" y="505" fill="#eef5ff" font-size="25" font-weight="400">轉成下一版案例</text><text x="73" y="545" fill="#eef5ff" font-size="25" font-weight="400">追查原先漏掉什麼</text><path d="M210 414 V373 H610 V335" fill="none" stroke="#ffd07a" stroke-width="3"  stroke-dasharray="8 7" marker-end="url(#amber)"/><text x="48" y="657" fill="#ffd07a" font-size="26" font-weight="400">金色虛線：真實失敗回到驗收案例，補上原本的盲點。</text><text x="48" y="714" fill="#eef5ff" font-size="29" font-weight="700">別讓同一個 Agent 為了過關，把答案和考卷一起改掉。</text></g></svg>
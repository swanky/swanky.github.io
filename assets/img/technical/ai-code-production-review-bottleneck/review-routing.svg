<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="970" viewBox="0 0 1200 970" role="img" aria-labelledby="title desc">
<title id="title">審得過來，先從風險分流</title><desc id="desc">修改分成低風險、高風險和風險不明。前兩者須證據足夠才逐步上線；風險不明停下補資料，不直接放行。</desc>
<defs><marker id="cyan" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#6fe5ed"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#ffd07a"/></marker></defs>
<rect width="1200" height="970" rx="24" fill="#07111f"/>
<g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="48" y="64" fill="#eef5ff" font-size="38" font-weight="700">審得過來，先從風險分流</text><text x="48" y="110" fill="#c1d2e4" font-size="25" font-weight="400">本文建議流程｜參考 Orosz 的審查方法，非通用合規標準</text><rect x="335" y="148" width="530" height="126" rx="18" fill="#13263b" stroke="#6fe5ed" stroke-width="2"/><text x="360" y="192" fill="#6fe5ed" font-size="30" font-weight="700">一筆小修改＋影響範圍</text><text x="360" y="239" fill="#eef5ff" font-size="25" font-weight="400">先辨認資料、權限與失敗後果</text><path d="M600 274 V312 H225 V347" fill="none" stroke="#6fe5ed" stroke-width="3"  marker-end="url(#cyan)"/><path d="M600 274 V347" fill="none" stroke="#6fe5ed" stroke-width="3"  marker-end="url(#cyan)"/><path d="M600 312 H975 V347" fill="none" stroke="#ffd07a" stroke-width="3"  marker-end="url(#amber)"/><rect x="48" y="347" width="354" height="224" rx="18" fill="#13263b" stroke="#6fe5ed" stroke-width="2"/><text x="73" y="391" fill="#6fe5ed" font-size="30" font-weight="700">低風險、易恢復</text><text x="73" y="438" fill="#eef5ff" font-size="25" font-weight="400">測試與自動檢查</text><text x="73" y="478" fill="#eef5ff" font-size="25" font-weight="400">抽查驗證</text><text x="73" y="518" fill="#eef5ff" font-size="25" font-weight="400">要有分類依據</text><rect x="423" y="347" width="354" height="224" rx="18" fill="#13263b" stroke="#ffd07a" stroke-width="2"/><text x="448" y="391" fill="#ffd07a" font-size="30" font-weight="700">高風險</text><text x="448" y="438" fill="#eef5ff" font-size="25" font-weight="400">人審規則與測試</text><text x="448" y="478" fill="#eef5ff" font-size="25" font-weight="400">深入看關鍵程式</text><text x="448" y="518" fill="#eef5ff" font-size="25" font-weight="400">確認復原方案</text><rect x="798" y="347" width="354" height="224" rx="18" fill="#13263b" stroke="#ffd07a" stroke-width="2"/><text x="823" y="391" fill="#ffd07a" font-size="30" font-weight="700">風險不明</text><text x="823" y="438" fill="#eef5ff" font-size="25" font-weight="400">停止放行</text><text x="823" y="478" fill="#eef5ff" font-size="25" font-weight="400">補資料或提高等級</text><text x="823" y="518" fill="#eef5ff" font-size="25" font-weight="400">重新判定後再走</text><path d="M225 571 V624 H370 V660" fill="none" stroke="#6fe5ed" stroke-width="3"  marker-end="url(#cyan)"/><path d="M600 571 V624 H370" fill="none" stroke="#6fe5ed" stroke-width="3"  marker-end="url(#cyan)"/><rect x="110" y="660" width="520" height="120" rx="18" fill="#13263b" stroke="#6fe5ed" stroke-width="2"/><text x="135" y="704" fill="#6fe5ed" font-size="30" font-weight="700">證據足夠，才逐步上線</text><text x="135" y="751" fill="#eef5ff" font-size="25" font-weight="400">證據不足：退回修改，不合併</text><path d="M630 720 H689" fill="none" stroke="#6fe5ed" stroke-width="3"  marker-end="url(#cyan)"/><rect x="713" y="660" width="439" height="120" rx="18" fill="#13263b" stroke="#ffd07a" stroke-width="2"/><text x="738" y="704" fill="#ffd07a" font-size="30" font-weight="700">持續監測與復原</text><text x="738" y="751" fill="#eef5ff" font-size="25" font-weight="400">有異常：停止擴大、處理事故</text><text x="48" y="861" fill="#eef5ff" font-size="29" font-weight="700">風險不明不是低風險；人工簽名不能代替實際理解。</text><text x="48" y="916" fill="#c1d2e4" font-size="25" font-weight="400">修改越小、證據越清楚，有限的審查時間越有用。</text></g></svg>
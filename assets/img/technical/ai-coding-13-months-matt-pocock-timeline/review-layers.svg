<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 474" width="840" height="474" role="img" aria-labelledby="review-layers-t review-layers-d"><title id="review-layers-t">四種審查各回答一個問題，風險越高疊越多層</title><desc id="review-layers-d">看結果問有沒有幫到人，所有東西都要看；看證據問有沒有照要求做，對外功能以上要看；看計畫與設計問方向對不對、讀關鍵程式碼問是不是願意負責的寫法，動到錢、權限、資料時要看。</desc><rect width="100%" height="100%" fill="#FFFDF9"/><defs><marker id="rv-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E5A300"/></marker></defs><text x="24" y="40" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="22" font-weight="700" fill="#232020" text-anchor="start">四種審查各回答一個問題，風險越高疊越多層</text><text x="24" y="74" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="14" font-weight="700" fill="#5F5B53" text-anchor="start">審什麼</text><text x="200" y="74" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="14" font-weight="700" fill="#5F5B53" text-anchor="start">回答的問題</text><text x="540" y="74" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="14" font-weight="700" fill="#8A5D00" text-anchor="middle">小工具</text><text x="640" y="74" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="14" font-weight="700" fill="#8A5D00" text-anchor="middle">對外功能</text><text x="750" y="56" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="14" font-weight="700" fill="#8A5D00" text-anchor="middle">動到錢、權限、</text><text x="750" y="74" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="14" font-weight="700" fill="#8A5D00" text-anchor="middle">資料</text><path d="M500,88 H800" stroke="#E5A300" stroke-width="2" marker-end="url(#rv-arrow)"/><text x="640" y="106" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="13" font-weight="500" fill="#8A5D00" text-anchor="middle">風險越高 →</text><rect x="16" y="120" width="808" height="70" rx="10" fill="#fff" stroke="#E6E1D6" stroke-width="1.5"/><rect x="16" y="120" width="6" height="70" rx="3" fill="#4FA6D5"/><text x="36" y="162" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="800" fill="#232020" text-anchor="start">看結果</text><text x="200" y="162" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="400" fill="#232020" text-anchor="start">有沒有真的幫到人？</text><circle cx="540" cy="156" r="11" fill="#E5A300"/><path d="M535,156 l4,4 l7,-8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640" cy="156" r="11" fill="#E5A300"/><path d="M635,156 l4,4 l7,-8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="750" cy="156" r="11" fill="#E5A300"/><path d="M745,156 l4,4 l7,-8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="16" y="200" width="808" height="70" rx="10" fill="#fff" stroke="#E6E1D6" stroke-width="1.5"/><rect x="16" y="200" width="6" height="70" rx="3" fill="#4FA6D5"/><text x="36" y="242" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="800" fill="#232020" text-anchor="start">看證據</text><text x="200" y="242" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="400" fill="#232020" text-anchor="start">有沒有照我要的做？</text><circle cx="540" cy="236" r="4" fill="#E6E1D6"/><circle cx="640" cy="236" r="11" fill="#E5A300"/><path d="M635,236 l4,4 l7,-8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="750" cy="236" r="11" fill="#E5A300"/><path d="M745,236 l4,4 l7,-8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="16" y="280" width="808" height="70" rx="10" fill="#fff" stroke="#E6E1D6" stroke-width="1.5"/><rect x="16" y="280" width="6" height="70" rx="3" fill="#E5A300"/><text x="36" y="322" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="800" fill="#232020" text-anchor="start">看計畫與設計</text><text x="200" y="322" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="400" fill="#232020" text-anchor="start">方向對不對？</text><circle cx="540" cy="316" r="4" fill="#E6E1D6"/><circle cx="640" cy="316" r="4" fill="#E6E1D6"/><circle cx="750" cy="316" r="11" fill="#E5A300"/><path d="M745,316 l4,4 l7,-8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="16" y="360" width="808" height="70" rx="10" fill="#fff" stroke="#E6E1D6" stroke-width="1.5"/><rect x="16" y="360" width="6" height="70" rx="3" fill="#E5A300"/><text x="36" y="402" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="18" font-weight="800" fill="#232020" text-anchor="start">讀關鍵程式碼</text><text x="200" y="402" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="16" font-weight="400" fill="#232020" text-anchor="start">這是不是我願意負責的寫法？</text><circle cx="540" cy="396" r="4" fill="#E6E1D6"/><circle cx="640" cy="396" r="4" fill="#E6E1D6"/><circle cx="750" cy="396" r="11" fill="#E5A300"/><path d="M745,396 l4,4 l7,-8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="454" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif" font-size="13" font-weight="400" fill="#5F5B53" text-anchor="start">四種審查整理自 No AI Slop 宣言第 17、18 條與 Lauren Tan 的演講；依風險分級是作者歸納。</text></svg>
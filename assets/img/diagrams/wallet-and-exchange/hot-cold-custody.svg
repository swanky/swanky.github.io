      <symbol id="dgp-hot-cold-custody-ic-w-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l9.5 16h-19z"/><path d="M12 10v4.5"/><path d="M12 17.3h.01"/></symbol>
      <symbol id="dgp-hot-cold-custody-ic-w-bank" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M4 18h16"/><path d="M4 10h16"/><path d="M12 3l8 5h-16z"/><path d="M7 10v8"/><path d="M12 10v8"/><path d="M17 10v8"/></symbol>
      <symbol id="dgp-hot-cold-custody-ic-w-hw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 8v-5h5v5"/><path d="M7 8h10v11a2 2 0 0 1 -2 2h-6a2 2 0 0 1 -2 -2z"/><path d="M10 12h4"/><path d="M12 17h.01"/></symbol>
      <symbol id="dgp-hot-cold-custody-ic-w-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2"/><path d="M11 18h2"/></symbol>
      <symbol id="dgp-hot-cold-custody-ic-w-vault" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14a2 2 0 0 1 2 2v11a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2"/><path d="M9 11.5a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/><path d="M12 8.5v-1"/><path d="M12 15.5v-1"/><path d="M15 11.5h1"/><path d="M8 11.5h1"/><path d="M6 19v2"/><path d="M18 19v2"/></symbol>
      <symbol id="dgp-hot-cold-custody-ic-w-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19h.01"/><path d="M8.5 15.5a5 5 0 0 1 7 0"/><path d="M5.5 12.2a9.2 9.2 0 0 1 13 0"/><path d="M2.5 9a13.5 13.5 0 0 1 19 0"/></symbol>
      <symbol id="dgp-hot-cold-custody-ic-w-wifi-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19h.01"/><path d="M8.5 15.5a5 5 0 0 1 7 0"/><path d="M5.5 12.2a9.2 9.2 0 0 1 13 0"/><path d="M2.5 9a13.5 13.5 0 0 1 19 0"/><path d="M4 3l16 18"/></symbol>
  </defs>
  <text class="ttl" x="16" y="34">冷熱、託管交叉成四格，</text>
  <text class="ttl" x="16" y="72">硬體錢包冷又自管</text>
  <rect class="bar" x="16" y="98" width="64" height="6" rx="3"/>
  <g data-step="2"><g class="b r"><rect x="8" y="116" width="424" height="52" rx="12"/><use href="#dgp-hot-cold-custody-ic-w-wifi" class="ic-r" x="22" y="125" width="34" height="34"/><text class="m lg t-r" x="66" y="142">熱錢包</text><text class="e sm t-r" x="418" y="143">私鑰連網</text></g></g>
  <g data-step="3"><g class="b"><rect x="8" y="180" width="424" height="150" rx="12"/><use href="#dgp-hot-cold-custody-ic-w-bank" class="ic-r" x="24" y="196" width="48" height="48"/><text class="m lg" x="86" y="208">交易所帳戶</text><text class="m sm mute" x="86" y="238">託管：第三方握私鑰</text><text class="m" x="24" y="274">連網，交易快</text><use href="#dgp-hot-cold-custody-ic-w-alert" class="ic-r" x="24" y="293" width="26" height="26"/><text class="m t-r" x="58" y="306">風險：平台倒閉、被駭</text></g></g>
  <g data-step="4"><g class="b"><rect x="8" y="342" width="424" height="150" rx="12"/><use href="#dgp-hot-cold-custody-ic-w-phone" class="ic-r" x="24" y="358" width="48" height="48"/><text class="m lg" x="86" y="370">手機錢包</text><text class="m sm mute" x="86" y="400">非託管：自己握私鑰</text><text class="m" x="24" y="436">私鑰在連網的手機上</text><use href="#dgp-hot-cold-custody-ic-w-alert" class="ic-r" x="24" y="455" width="26" height="26"/><text class="m t-r" x="58" y="468">風險：較容易被駭</text></g></g>
  <g data-step="2"><g class="b b2"><rect x="8" y="508" width="424" height="52" rx="12"/><use href="#dgp-hot-cold-custody-ic-w-wifi-off" class="ic-b" x="22" y="517" width="34" height="34"/><text class="m lg t-b" x="66" y="534">冷錢包</text><text class="e sm t-b" x="418" y="535">私鑰不連網</text></g></g>
  <g data-step="5"><g class="b"><rect x="8" y="572" width="424" height="150" rx="12"/><use href="#dgp-hot-cold-custody-ic-w-vault" class="ic-b" x="24" y="588" width="48" height="48"/><text class="m lg" x="86" y="600">平台離線金庫</text><text class="m sm mute" x="86" y="630">託管：第三方握私鑰</text><text class="m" x="24" y="666">平台把幣離線保管</text><use href="#dgp-hot-cold-custody-ic-w-alert" class="ic-r" x="24" y="685" width="26" height="26"/><text class="m t-r" x="58" y="698">風險：仍要信任第三方</text></g></g>
  <g data-step="6"><g class="b y"><rect x="8" y="734" width="424" height="150" rx="12"/><use href="#dgp-hot-cold-custody-ic-w-hw" class="ic-b" x="24" y="750" width="48" height="48"/><text class="m lg" x="86" y="762">硬體錢包</text><text class="m sm" x="86" y="792">非託管：自己握私鑰</text><text class="m" x="24" y="828">私鑰自己握、不連網</text><use href="#dgp-hot-cold-custody-ic-w-alert" class="ic-r" x="24" y="847" width="26" height="26"/><text class="m t-r" x="58" y="860">風險：弄丟或壞掉找不回</text></g></g>
</svg>

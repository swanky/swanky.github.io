<svg xmlns="http://www.w3.org/2000/svg" id="dgp-hot-cold-custody" viewBox="0 0 440 896" role="img" aria-labelledby="dgp-hot-cold-custody-title dgp-hot-cold-custody-desc">
  <title id="dgp-hot-cold-custody-title">冷熱、託管交叉成四格，硬體錢包冷又自管</title>
  <desc id="dgp-hot-cold-custody-desc">錢包四格（直式）：先依私鑰有沒有連網分成熱錢包與冷錢包兩組，每組再分託管與非託管。交易所帳戶是熱加託管，手機錢包是熱加非託管，平台離線金庫是冷加託管，硬體錢包是冷加非託管。</desc>
  <style>
      #dgp-hot-cold-custody text { font-family: 'Noto Sans TC','Microsoft JhengHei',sans-serif; font-size: 22px; font-weight: 600; fill: #232020; font-variant-numeric: lining-nums; }
      #dgp-hot-cold-custody .c { text-anchor: middle; dominant-baseline: central; }
      #dgp-hot-cold-custody .m { dominant-baseline: central; }
      #dgp-hot-cold-custody .e { text-anchor: end; dominant-baseline: central; }
      #dgp-hot-cold-custody .sm { font-size: 20px; font-weight: 500; }
      #dgp-hot-cold-custody .lg { font-size: 26px; font-weight: 700; }
      #dgp-hot-cold-custody .ttl { font-size: 28px; font-weight: 700; dominant-baseline: central; }
      #dgp-hot-cold-custody .mute { fill: #5F5B53; }
      #dgp-hot-cold-custody .t-y { fill: #8A5D00; } #dgp-hot-cold-custody .t-b { fill: #1F5F9C; } #dgp-hot-cold-custody .t-g { fill: #1E7A41; } #dgp-hot-cold-custody .t-r { fill: #B83232; }
      #dgp-hot-cold-custody .bar { fill: #E5A300; }
      #dgp-hot-cold-custody .zone { fill: #F4F5F7; stroke: #C9CED6; stroke-width: 2; stroke-dasharray: 8 6; }
      #dgp-hot-cold-custody .zone.y { fill: #FAF5EA; stroke: #E5A300; } #dgp-hot-cold-custody .zone.b { fill: #F3F8FD; stroke: #4FA6D5; }
      #dgp-hot-cold-custody .zone.g { fill: #F3FBF6; stroke: #2E9E5B; } #dgp-hot-cold-custody .zone.r { fill: #FEF5F5; stroke: #D64545; }
      #dgp-hot-cold-custody .b > rect { fill: #fff; stroke: #C9CED6; stroke-width: 2; }
      #dgp-hot-cold-custody .b.y > rect { fill: #FCF3DB; stroke: #E5A300; } #dgp-hot-cold-custody .b.b2 > rect { fill: #E6F2F9; stroke: #4FA6D5; }
      #dgp-hot-cold-custody .b.g > rect { fill: #E9F7EF; stroke: #2E9E5B; } #dgp-hot-cold-custody .b.r > rect { fill: #FDECEC; stroke: #D64545; }
      #dgp-hot-cold-custody .b.solid > rect { fill: #E5A300; stroke: #C98F00; } #dgp-hot-cold-custody .b.solid > text { fill: #fff; }
      #dgp-hot-cold-custody .ic-y { color: #8A5D00; } #dgp-hot-cold-custody .ic-b { color: #1F5F9C; } #dgp-hot-cold-custody .ic-g { color: #1E7A41; }
      #dgp-hot-cold-custody .ic-r { color: #B83232; } #dgp-hot-cold-custody .ic-n { color: #5F5B53; } #dgp-hot-cold-custody .ic-k { color: #232020; }
      #dgp-hot-cold-custody .num > circle { fill: #E5A300; stroke: #fff; stroke-width: 2; }
      #dgp-hot-cold-custody .num > text { fill: #fff; font-size: 20px; font-weight: 800; text-anchor: middle; dominant-baseline: central; }
      #dgp-hot-cold-custody .num.r > circle { fill: #D64545; }
      #dgp-hot-cold-custody .ln { fill: none; stroke: #5F5B53; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      #dgp-hot-cold-custody .head { fill: #5F5B53; stroke: none; }
      #dgp-hot-cold-custody .y > .ln, #dgp-hot-cold-custody .ln.y { stroke: #E5A300; } #dgp-hot-cold-custody .y > .head { fill: #E5A300; }
      #dgp-hot-cold-custody .b3 > .ln, #dgp-hot-cold-custody .ln.b3 { stroke: #4FA6D5; } #dgp-hot-cold-custody .b3 > .head { fill: #4FA6D5; }
      #dgp-hot-cold-custody .g > .ln, #dgp-hot-cold-custody .ln.g { stroke: #2E9E5B; } #dgp-hot-cold-custody .g > .head { fill: #2E9E5B; }
      #dgp-hot-cold-custody .r > .ln, #dgp-hot-cold-custody .ln.r { stroke: #D64545; } #dgp-hot-cold-custody .r > .head { fill: #D64545; }
      #dgp-hot-cold-custody .dash { stroke-dasharray: 9 7; }
      #dgp-hot-cold-custody .thin { stroke-width: 2; }
      #dgp-hot-cold-custody .row { fill: none; stroke: #C9CED6; stroke-width: 4; stroke-linecap: round; }
      #dgp-hot-cold-custody .f-g { fill: #2E9E5B; } #dgp-hot-cold-custody .f-r { fill: #F8CFCF; stroke: #D64545; stroke-width: 2; stroke-dasharray: 6 5; } #dgp-hot-cold-custody .f-n { fill: none; stroke: #5F5B53; stroke-width: 2.5; }
  </style>

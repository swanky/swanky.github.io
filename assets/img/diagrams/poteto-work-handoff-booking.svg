<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="800" height="310" role="img" aria-labelledby="booking-w-title booking-w-desc" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif">
  <title id="booking-w-title">預約時間有出入，怎麼查到這筆工作做完？</title>
  <desc id="booking-w-desc">來信時間與預約紀錄不一致。依店家的判準核對，缺資料就記下待補項目，資料補齊後接續同一筆預約。完成時要核對預約已正確存入，客戶也已收到確認。</desc>
  <rect width="100%" height="100%" fill="#FFFDF9"/>
  <text x="24" y="35" font-size="19" font-weight="700" fill="#8A5D00">預約時間衝突　情境示意</text>
  <rect x="24" y="58" width="356" height="63" rx="9" fill="#FAF5EA" stroke="#C6BDAC" stroke-width="1.5"/>
  <text x="40" y="98" font-size="22" font-weight="700" fill="#232020">來信中的時間</text>
  <rect x="420" y="58" width="356" height="63" rx="9" fill="#FAF5EA" stroke="#C6BDAC" stroke-width="1.5"/>
  <text x="436" y="98" font-size="22" font-weight="700" fill="#232020">預約中的時間</text>
  <path d="M202 121 V143 H598 V121" fill="none" stroke="#8E816A" stroke-width="2" stroke-linecap="round"/>
  <path d="M400 143 H142 V163" fill="none" stroke="#8E816A" stroke-width="2" stroke-linecap="round"/>
  <circle cx="142" cy="163" r="6" fill="#8A5D00"/>
  <rect x="24" y="171" width="224" height="117" rx="9" fill="#FFF3D4" stroke="#CAAB54" stroke-width="1.5"/>
  <text x="40" y="210" font-size="21" font-weight="700" fill="#8A5D00">兩邊的時間不同</text>
  <text x="40" y="243" font-size="18" font-weight="400" fill="#232020">依店家判準核對</text>
  <text x="40" y="270" font-size="18" font-weight="400" fill="#232020">哪個時間有效。</text>
  <rect x="287" y="171" width="224" height="117" rx="9" fill="#EBF4F8" stroke="#A6BECC" stroke-width="1.5"/>
  <text x="303" y="210" font-size="21" font-weight="700" fill="#275978">資料仍不足</text>
  <text x="303" y="243" font-size="18" font-weight="400" fill="#232020">記下待補項目，</text>
  <text x="303" y="270" font-size="18" font-weight="400" fill="#232020">補齊後接續原預約。</text>
  <rect x="550" y="171" width="226" height="117" rx="9" fill="#FAF5EA" stroke="#C6BDAC" stroke-width="1.5"/>
  <text x="566" y="210" font-size="21" font-weight="700" fill="#232020">完成前核對兩件事</text>
  <text x="566" y="243" font-size="18" font-weight="400" fill="#232020">預約已正確存入。</text>
  <text x="566" y="270" font-size="18" font-weight="400" fill="#232020">客戶已收到確認。</text>
  <path d="M249 227 h30 m-6 -4 6 4 -6 4" fill="none" stroke="#8E816A" stroke-width="2" stroke-linecap="round"/>
  <path d="M512 227 h30 m-6 -4 6 4 -6 4" fill="none" stroke="#8E816A" stroke-width="2" stroke-linecap="round"/>
</svg>

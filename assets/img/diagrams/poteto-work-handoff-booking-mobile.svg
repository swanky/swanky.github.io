<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 508" width="400" height="508" role="img" aria-labelledby="booking-m-title booking-m-desc" font-family="'Noto Sans TC','Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC',sans-serif">
  <title id="booking-m-title">預約時間有出入，怎麼查到這筆工作做完？</title>
  <desc id="booking-m-desc">來信時間與預約紀錄不一致。依店家的判準核對，缺資料就記下待補項目，資料補齊後接續同一筆預約。完成時要核對預約已正確存入，客戶也已收到確認。</desc>
  <rect width="100%" height="100%" fill="#FFFDF9"/>
  <text x="24" y="35" font-size="19" font-weight="700" fill="#8A5D00">預約時間衝突　情境示意</text>
  <rect x="24" y="58" width="164" height="64" rx="9" fill="#FAF5EA" stroke="#C6BDAC" stroke-width="1.5"/>
  <text x="40" y="98" font-size="19" font-weight="700" fill="#232020">來信中的時間</text>
  <rect x="212" y="58" width="164" height="64" rx="9" fill="#FAF5EA" stroke="#C6BDAC" stroke-width="1.5"/>
  <text x="228" y="98" font-size="19" font-weight="700" fill="#232020">預約中的時間</text>
  <path d="M106 122 V142 H294 V122" fill="none" stroke="#8E816A" stroke-width="2" stroke-linecap="round"/>
  <path d="M200 142 V158" fill="none" stroke="#8E816A" stroke-width="2" stroke-linecap="round"/>
  <circle cx="200" cy="158" r="6" fill="#8A5D00"/>
  <rect x="24" y="166" width="352" height="83" rx="9" fill="#FFF3D4" stroke="#CAAB54" stroke-width="1.5"/>
  <text x="42" y="199" font-size="22" font-weight="700" fill="#8A5D00">兩邊的時間不同</text>
  <text x="42" y="231" font-size="18" font-weight="400" fill="#232020">依店家判準核對哪個時間有效。</text>
  <path d="M200 249 V266" fill="none" stroke="#8E816A" stroke-width="2" stroke-linecap="round"/>
  <rect x="24" y="270" width="352" height="87" rx="9" fill="#EBF4F8" stroke="#A6BECC" stroke-width="1.5"/>
  <text x="42" y="302" font-size="21" font-weight="700" fill="#275978">資料仍不足</text>
  <text x="42" y="334" font-size="17" font-weight="400" fill="#232020">記下待補項目，補齊後接續原預約。</text>
  <path d="M200 357 V377" fill="none" stroke="#8E816A" stroke-width="2" stroke-linecap="round"/>
  <rect x="24" y="381" width="352" height="104" rx="9" fill="#FAF5EA" stroke="#C6BDAC" stroke-width="1.5"/>
  <text x="42" y="412" font-size="21" font-weight="700" fill="#232020">完成前核對兩件事</text>
  <text x="42" y="445" font-size="18" font-weight="400" fill="#232020">預約已正確存入。</text>
  <text x="42" y="472" font-size="18" font-weight="400" fill="#232020">客戶已收到確認。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 826" width="1200" height="826" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">Prompt 三明治：資料在上，任務在最後</title>
  <desc id="d">Prompt 三明治，由上到下疊四層：最上面是〈資料〉，放長文件、信件、會議紀錄這些最大塊的內容，例如會議紀錄.docx 與客戶來信.eml 兩份文件；其次是〈範例〉，放想要的成品長什麼樣子；再來是〈指示〉，放規則與理由、格式、完成條件；最後是任務，寫這次要它做什麼，放在最後。三個要點：一，用標籤把資料框起來，在對話框直接打 &lt;資料&gt; 和 &lt;/資料&gt; 夾住那段文字就行，框起來的句子比較不會被當成命令；二，長資料放上面，這次要做的任務放最後；三，指示自己一塊，改規則時不用翻資料。Anthropic 實測：長文件情境，任務放最後，品質最多提升約 30%（Anthropic 內部測試，只在長文件情境）。</desc>
  <rect width="1200" height="826" fill="#FFFFFF"/>
  <text x="48" y="80" font-size="48" font-weight="700" fill="#1F2937">Prompt 三明治：資料在上，任務在最後</text>
  <text x="48" y="126" font-size="26" fill="#4B5563">長文件、範例、指示、任務，由上往下一層層疊起來</text>
  <rect x="48" y="168" width="580" height="296" rx="20" fill="#EEF1F4" stroke="#64748B" stroke-width="3"/>
  <text x="76" y="220" font-size="32" font-weight="700" fill="#475569" font-family="Consolas, Microsoft JhengHei, monospace">&lt;資料&gt;</text>
  <text x="76" y="260" font-size="26" fill="#1F2937">長文件、信件、會議紀錄：</text>
  <text x="76" y="294" font-size="26" fill="#1F2937">最大塊，放最上面</text>
  <rect x="68" y="314" width="262" height="130" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="84" y="352" font-size="22" font-weight="700" fill="#475569" font-family="Consolas, Microsoft JhengHei, monospace">&lt;文件</text>
  <text x="84" y="380" font-size="22" font-weight="700" fill="#475569" font-family="Consolas, Microsoft JhengHei, monospace">來源="會議紀錄.docx"&gt;</text>
  <rect x="86" y="396" width="226" height="8" rx="4" fill="#CBD5E1"/>
  <rect x="86" y="410" width="185.32" height="8" rx="4" fill="#CBD5E1"/>
  <rect x="86" y="424" width="146.9" height="8" rx="4" fill="#CBD5E1"/>
  <rect x="346" y="314" width="262" height="130" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="362" y="352" font-size="22" font-weight="700" fill="#475569" font-family="Consolas, Microsoft JhengHei, monospace">&lt;文件</text>
  <text x="362" y="380" font-size="22" font-weight="700" fill="#475569" font-family="Consolas, Microsoft JhengHei, monospace">來源="客戶來信.eml"&gt;</text>
  <rect x="364" y="396" width="226" height="8" rx="4" fill="#CBD5E1"/>
  <rect x="364" y="410" width="185.32" height="8" rx="4" fill="#CBD5E1"/>
  <rect x="364" y="424" width="146.9" height="8" rx="4" fill="#CBD5E1"/>
  <rect x="48" y="478" width="580" height="90" rx="20" fill="#FFF5DF" stroke="#A8741A" stroke-width="3"/>
  <text x="76" y="534.0" font-size="32" font-weight="700" fill="#8A5D00" font-family="Consolas, Microsoft JhengHei, monospace">&lt;範例&gt;</text>
  <text x="224" y="532.0" font-size="26" fill="#1F2937">想要的成品長什麼樣子</text>
  <rect x="48" y="582" width="580" height="90" rx="20" fill="#EAF1FA" stroke="#2878D0" stroke-width="3"/>
  <text x="76" y="638.0" font-size="32" font-weight="700" fill="#2878D0" font-family="Consolas, Microsoft JhengHei, monospace">&lt;指示&gt;</text>
  <text x="224" y="636.0" font-size="26" fill="#1F2937">規則與理由、格式、完成條件</text>
  <rect x="48" y="686" width="580" height="100" rx="20" fill="#10253D"/>
  <text x="76" y="748" font-size="32" font-weight="700" fill="#FFFFFF">任務</text>
  <text x="224" y="746" font-size="26" fill="#FFFFFF">這次要它做什麼：放最後</text>
  <line x1="664" y1="178" x2="664" y2="756" stroke="#F26D5B" stroke-width="7" stroke-linecap="round"/>
  <polygon points="664,784 648,756 680,756" fill="#F26D5B"/>
  <text x="716" y="204" font-size="30" font-weight="700" fill="#1F2937">① 用標籤把資料框起來</text>
  <text x="716" y="250" font-size="26" fill="#1F2937">在對話框直接打 &lt;資料&gt; 和</text>
  <text x="716" y="284" font-size="26" fill="#1F2937">&lt;/資料&gt; 夾住那段文字就行；</text>
  <text x="716" y="318" font-size="26" fill="#1F2937">框起來的句子比較不會被當成命令</text>
  <text x="716" y="368" font-size="30" font-weight="700" fill="#1F2937">② 長資料放上面</text>
  <text x="716" y="414" font-size="26" fill="#1F2937">這次要做的任務放最後</text>
  <text x="716" y="484" font-size="30" font-weight="700" fill="#1F2937">③ 指示自己一塊</text>
  <text x="716" y="530" font-size="26" fill="#1F2937">改規則時不用翻資料</text>
  <rect x="716" y="566" width="436" height="204" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="4"/>
  <text x="740" y="610" font-size="26" font-weight="700" fill="#475569">Anthropic 實測：</text>
  <text x="740" y="646" font-size="26" fill="#1F2937">長文件情境，任務放最後</text>
  <text x="740" y="684" font-size="30" font-weight="700" fill="#1F2937">品質<tspan fill="#8A5D00">最多提升約 30%</tspan></text>
  <text x="740" y="724" font-size="22" fill="#64748B">註：Anthropic 內部測試，</text>
  <text x="740" y="752" font-size="22" fill="#64748B">只在長文件情境</text>
</svg>

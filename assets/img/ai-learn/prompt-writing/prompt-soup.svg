  <text x="48" y="80" font-size="48" font-weight="700" fill="#1F2937">Prompt 縮寫字母湯</text>
  <text x="48" y="126" font-size="26" fill="#4B5563">框架名稱多到像一碗湯，其實底下都是同幾塊積木</text>
  <text x="999.2" y="394.6" font-size="57.0" font-weight="700" fill="#F26D5B" opacity="1" font-family="Arial, sans-serif" transform="rotate(0 1057.9 361.8)">RTF</text>

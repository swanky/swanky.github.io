<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">Prompt 縮寫字母湯</title>
  <desc id="d">一大堆 Prompt 框架的縮寫像字母湯一樣擠在一起：最大的是 RTF、CO-STAR、RISEN、CREATE、RACE，其餘還有 TAG、BAB、CARE、RISE、CRISPE、APE、ICIO、BROKE、SCOPE、TRACE、ROSES、ERA、PECRA、COAST、GRADE、CLEAR、RODES、RAPPEL、CRAFT、PTCF、GCES、RTGO、CLEVER、SPARK、STAR。名字很多，底下其實都是同幾塊積木。出處：史旺基整理。</desc>

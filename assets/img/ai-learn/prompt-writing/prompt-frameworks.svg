<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 798" width="1200" height="798" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">四個框架，其實是同樣幾塊積木</title>
  <desc id="d">RTF、CO-STAR、RISEN、CREATE 四個框架，顏色對回六塊積木（角色、任務、背景、限制、格式、範例，其他為文風、語氣、受眾、步驟）。RTF：角色、任務、格式，最短最好記，出處不明。CO-STAR：背景、目標、文風、語氣、受眾、回應格式，新加坡 GovTech 的框架。RISEN：角色、指示、步驟、最終目標、限縮範圍，多了限制與步驟。CREATE：角色、請求、範例、調整、輸出類型、補充，最接近六塊積木。</desc>
  <rect width="1200" height="798" fill="#FFFFFF"/>
  <text x="48" y="80" font-size="48" font-weight="700" fill="#1F2937">四個框架，其實是同樣幾塊積木</text>
  <text x="48" y="126" font-size="26" fill="#4B5563">RTF、CO-STAR、RISEN、CREATE：顏色對回前面講的六塊積木</text>
  <rect x="48" y="160" width="26" height="26" rx="6" fill="#173B5E"/>
  <text x="84" y="182" font-size="22" font-weight="700" fill="#1F2937">角色</text>
  <rect x="148" y="160" width="26" height="26" rx="6" fill="#00AFC7"/>
  <text x="184" y="182" font-size="22" font-weight="700" fill="#1F2937">任務</text>
  <rect x="248" y="160" width="26" height="26" rx="6" fill="#2878D0"/>
  <text x="284" y="182" font-size="22" font-weight="700" fill="#1F2937">背景</text>
  <rect x="348" y="160" width="26" height="26" rx="6" fill="#F26D5B"/>
  <text x="384" y="182" font-size="22" font-weight="700" fill="#1F2937">限制</text>
  <rect x="448" y="160" width="26" height="26" rx="6" fill="#53A88B"/>
  <text x="484" y="182" font-size="22" font-weight="700" fill="#1F2937">格式</text>
  <rect x="548" y="160" width="26" height="26" rx="6" fill="#F2B544"/>
  <text x="584" y="182" font-size="22" font-weight="700" fill="#1F2937">範例</text>
  <rect x="648" y="160" width="26" height="26" rx="6" fill="#657587"/>
  <text x="684" y="182" font-size="22" font-weight="700" fill="#4B5563">其他（文風、語氣、受眾、步驟）</text>
  <rect x="48" y="222" width="1104" height="130" rx="18" fill="#F7F7F3"/>
  <text x="72" y="276" font-size="34" font-weight="700" fill="#1F2937" font-family="Arial, sans-serif">RTF</text>
  <text x="72" y="312" font-size="22" font-weight="700" fill="#4B5563">最短、最好記</text>
  <rect x="314" y="240" width="116" height="94" rx="14" fill="#173B5E"/>
  <text x="372.0" y="284" font-size="40" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif">R</text>
  <text x="372.0" y="320" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">角色</text>
  <rect x="448" y="240" width="116" height="94" rx="14" fill="#00AFC7"/>
  <text x="506.0" y="284" font-size="40" font-weight="700" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif">T</text>
  <text x="506.0" y="320" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">任務</text>
  <rect x="582" y="240" width="116" height="94" rx="14" fill="#53A88B"/>
  <text x="640.0" y="284" font-size="40" font-weight="700" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif">F</text>

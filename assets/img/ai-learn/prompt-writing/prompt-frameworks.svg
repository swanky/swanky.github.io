  <text x="640.0" y="568" font-size="40" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif">S</text>
  <text x="640.0" y="604" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">步驟</text>
  <rect x="716" y="524" width="116" height="94" rx="14" fill="#00AFC7"/>
  <text x="774.0" y="568" font-size="40" font-weight="700" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif">E</text>
  <text x="774.0" y="604" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">最終目標</text>
  <rect x="850" y="524" width="116" height="94" rx="14" fill="#F26D5B"/>
  <text x="908.0" y="568" font-size="40" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif">N</text>
  <text x="908.0" y="604" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">限縮範圍</text>
  <rect x="48" y="648" width="1104" height="130" rx="18" fill="#F7F7F3"/>
  <text x="72" y="702" font-size="34" font-weight="700" fill="#1F2937" font-family="Arial, sans-serif">CREATE</text>

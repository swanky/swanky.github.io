  <text x="72" y="418" font-size="34" font-weight="700" fill="#1F2937" font-family="Arial, sans-serif">CO-STAR</text>
  <text x="72" y="454" font-size="22" font-weight="700" fill="#4B5563">新加坡 GovTech</text>
  <text x="72" y="482" font-size="22" font-weight="700" fill="#4B5563">的框架</text>
  <rect x="314" y="382" width="116" height="94" rx="14" fill="#2878D0"/>

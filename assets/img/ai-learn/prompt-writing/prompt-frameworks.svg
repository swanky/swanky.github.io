  <rect x="756" y="382" width="116" height="94" rx="14" fill="#657587"/>
  <text x="814.0" y="426" font-size="40" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif">T</text>
  <text x="814.0" y="462" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">語氣</text>
  <rect x="890" y="382" width="116" height="94" rx="14" fill="#657587"/>
  <text x="948.0" y="426" font-size="40" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif">A</text>
  <text x="948.0" y="462" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">受眾</text>
  <rect x="1024" y="382" width="116" height="94" rx="14" fill="#53A88B"/>

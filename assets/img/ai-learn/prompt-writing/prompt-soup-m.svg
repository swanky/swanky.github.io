<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1073" width="600" height="1073" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">Prompt 縮寫字母湯</title>
  <desc id="d">一大堆 Prompt 框架的縮寫像字母湯一樣擠在一起：RTF、CO-STAR、RISEN、CREATE、RACE、TAG、BAB、CARE、RISE、CRISPE、APE、ICIO、BROKE、SCOPE、TRACE、ROSES、ERA、PECRA、COAST、GRADE、CLEAR、RODES、RAPPEL、CRAFT、PTCF、GCES、RTGO、CLEVER、SPARK、STAR。名字很多，底下其實都是同幾塊積木。出處：史旺基整理。</desc>
  <rect width="600" height="1073" fill="#FFFFFF"/>
  <text x="40" y="74" font-size="42" font-weight="700" fill="#1F2937">Prompt 縮寫字母湯</text>
  <text x="40" y="116" font-size="24" fill="#4B5563">框架名稱多到像一碗湯，</text>
  <text x="40" y="148" font-size="24" fill="#4B5563">其實底下都是同幾塊積木</text>

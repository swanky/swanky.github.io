<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 920" width="600" height="920" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">用螢光筆塗出 Prompt 的各個要素</title>
  <desc id="d">同一段會議通知的 Prompt，用六種螢光色標出各個要素：你是團隊的專案助理（角色）；請寫一封會議通知 Email（任務）；下週三 14:00 要開 Q4 預算討論會，與會的是各組負責人，大家行程很滿（背景）；全文 150 字內，預算數字等會議上再談，信裡先不寫（限制）；主旨一行，內文條列時間、地點、要先準備的資料（格式）；語氣參考附上的上一封通知信（範例）。示範情境為虛構；標示法仿 Google《Gemini for Workspace Prompting Guide》以螢光色標出 Prompt 要素。</desc>
  <rect width="600" height="920" fill="#FFFFFF"/>
  <text x="40" y="70" font-size="42" font-weight="700" fill="#1F2937">用螢光筆塗出</text>
  <text x="40" y="120" font-size="42" font-weight="700" fill="#1F2937">Prompt 的各個要素</text>
  <text x="40" y="160" font-size="24" fill="#4B5563">同一段話，每一句各是一塊積木</text>
  <rect x="40" y="192" width="26" height="26" rx="6" fill="#173B5E"/>
  <text x="76" y="214" font-size="24" font-weight="700" fill="#1F2937">角色</text>
  <rect x="210" y="192" width="26" height="26" rx="6" fill="#00AFC7"/>
  <text x="246" y="214" font-size="24" font-weight="700" fill="#1F2937">任務</text>
  <rect x="380" y="192" width="26" height="26" rx="6" fill="#2878D0"/>
  <text x="416" y="214" font-size="24" font-weight="700" fill="#1F2937">背景</text>
  <rect x="40" y="232" width="26" height="26" rx="6" fill="#F26D5B"/>
  <text x="76" y="254" font-size="24" font-weight="700" fill="#1F2937">限制</text>
  <rect x="210" y="232" width="26" height="26" rx="6" fill="#53A88B"/>
  <text x="246" y="254" font-size="24" font-weight="700" fill="#1F2937">格式</text>
  <rect x="380" y="232" width="26" height="26" rx="6" fill="#F2B544"/>
  <text x="416" y="254" font-size="24" font-weight="700" fill="#1F2937">範例</text>
  <rect x="40" y="278" width="520" height="514" rx="22" fill="#F7F7F3" stroke="#CFD8DF" stroke-width="2"/>
  <rect x="64.0" y="322" width="260.0" height="44" rx="6" fill="#D7E8F3"/>
  <line x1="64.0" y1="364" x2="324.0" y2="364" stroke="#173B5E" stroke-width="5"/>
  <text x="64.0" y="350" font-size="26" fill="#1F2937" textLength="260.0" lengthAdjust="spacing" xml:space="preserve">你是團隊的專案助理，</text>
  <rect x="324.0" y="322" width="182.0" height="44" rx="6" fill="#E0F4F7"/>
  <line x1="324.0" y1="364" x2="506.0" y2="364" stroke="#00AFC7" stroke-width="5"/>
  <text x="324.0" y="350" font-size="26" fill="#1F2937" textLength="182.0" lengthAdjust="spacing" xml:space="preserve">請寫一封會議通</text>
  <rect x="64.0" y="384" width="132.6" height="44" rx="6" fill="#E0F4F7"/>
  <line x1="64.0" y1="426" x2="196.6" y2="426" stroke="#00AFC7" stroke-width="5"/>
  <text x="64.0" y="412" font-size="26" fill="#1F2937" textLength="132.6" lengthAdjust="spacing" xml:space="preserve">知 Email。</text>
  <rect x="196.6" y="384" width="315.1" height="44" rx="6" fill="#E3EDFA"/>
  <line x1="196.6" y1="426" x2="511.7" y2="426" stroke="#2878D0" stroke-width="5"/>
  <text x="196.6" y="412" font-size="26" fill="#1F2937" textLength="315.1" lengthAdjust="spacing" xml:space="preserve">下週三 14:00 要開 Q4 預算</text>
  <rect x="64.0" y="446" width="442.0" height="44" rx="6" fill="#E3EDFA"/>
  <line x1="64.0" y1="488" x2="506.0" y2="488" stroke="#2878D0" stroke-width="5"/>
  <text x="64.0" y="474" font-size="26" fill="#1F2937" textLength="442.0" lengthAdjust="spacing" xml:space="preserve">討論會，與會的是各組負責人，大家行</text>
  <rect x="64.0" y="508" width="104.0" height="44" rx="6" fill="#E3EDFA"/>
  <line x1="64.0" y1="550" x2="168.0" y2="550" stroke="#2878D0" stroke-width="5"/>
  <text x="64.0" y="536" font-size="26" fill="#1F2937" textLength="104.0" lengthAdjust="spacing" xml:space="preserve">程很滿。</text>
  <rect x="168.0" y="508" width="345.3" height="44" rx="6" fill="#FCE4DF"/>
  <line x1="168.0" y1="550" x2="513.3" y2="550" stroke="#F26D5B" stroke-width="5"/>
  <text x="168.0" y="536" font-size="26" fill="#1F2937" textLength="345.3" lengthAdjust="spacing" xml:space="preserve">全文 150 字內，預算數字等會</text>
  <rect x="64.0" y="570" width="286.0" height="44" rx="6" fill="#FCE4DF"/>
  <line x1="64.0" y1="612" x2="350.0" y2="612" stroke="#F26D5B" stroke-width="5"/>
  <text x="64.0" y="598" font-size="26" fill="#1F2937" textLength="286.0" lengthAdjust="spacing" xml:space="preserve">議上再談，信裡先不寫。</text>
  <rect x="350.0" y="570" width="156.0" height="44" rx="6" fill="#E3F3EC"/>
  <line x1="350.0" y1="612" x2="506.0" y2="612" stroke="#53A88B" stroke-width="5"/>
  <text x="350.0" y="598" font-size="26" fill="#1F2937" textLength="156.0" lengthAdjust="spacing" xml:space="preserve">主旨一行；內</text>
  <rect x="64.0" y="632" width="442.0" height="44" rx="6" fill="#E3F3EC"/>
  <line x1="64.0" y1="674" x2="506.0" y2="674" stroke="#53A88B" stroke-width="5"/>
  <text x="64.0" y="660" font-size="26" fill="#1F2937" textLength="442.0" lengthAdjust="spacing" xml:space="preserve">文條列時間、地點、要先準備的資料。</text>
  <rect x="64.0" y="694" width="364.0" height="44" rx="6" fill="#FFF1D2"/>
  <line x1="64.0" y1="736" x2="428.0" y2="736" stroke="#F2B544" stroke-width="5"/>
  <text x="64.0" y="722" font-size="26" fill="#1F2937" textLength="364.0" lengthAdjust="spacing" xml:space="preserve">語氣參考附上的上一封通知信。</text>
  <text x="40" y="836" font-size="22" fill="#64748B">示範情境為虛構；標示法仿 Google</text>
  <text x="40" y="866" font-size="22" fill="#64748B">《Gemini for Workspace Prompting Guide》</text>
  <text x="40" y="896" font-size="22" fill="#64748B">以螢光色標出 Prompt 要素</text>
</svg>

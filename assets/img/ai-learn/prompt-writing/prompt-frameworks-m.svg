<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1520" width="600" height="1520" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">四個框架，其實是同樣幾塊積木</title>
  <desc id="d">RTF、CO-STAR、RISEN、CREATE 四個框架，顏色對回六塊積木。RTF：角色、任務、格式，最短最好記，出處不明。CO-STAR：背景、目標、文風、語氣、受眾、回應格式，新加坡 GovTech 的框架。RISEN：角色、指示、步驟、最終目標、限縮範圍，多了限制與步驟。CREATE：角色、請求、範例、調整、輸出類型、補充，最接近六塊積木。</desc>
  <rect width="600" height="1520" fill="#FFFFFF"/>
  <text x="40" y="70" font-size="42" font-weight="700" fill="#1F2937">四個框架，</text>
  <text x="40" y="120" font-size="42" font-weight="700" fill="#1F2937">同樣幾塊積木</text>
  <text x="40" y="160" font-size="24" fill="#4B5563">顏色對回前面講的六塊積木</text>
  <rect x="40" y="192" width="26" height="26" rx="6" fill="#173B5E"/>
  <text x="76" y="214" font-size="24" font-weight="700" fill="#1F2937">角色</text>
  <rect x="210" y="192" width="26" height="26" rx="6" fill="#00AFC7"/>
  <text x="246" y="214" font-size="24" font-weight="700" fill="#1F2937">任務</text>
  <rect x="380" y="192" width="26" height="26" rx="6" fill="#2878D0"/>
  <text x="416" y="214" font-size="24" font-weight="700" fill="#1F2937">背景</text>
  <rect x="40" y="232" width="26" height="26" rx="6" fill="#F26D5B"/>
  <text x="76" y="254" font-size="24" font-weight="700" fill="#1F2937">限制</text>
  <rect x="210" y="232" width="26" height="26" rx="6" fill="#53A88B"/>
  <text x="246" y="254" font-size="24" font-weight="700" fill="#1F2937">格式</text>
  <rect x="380" y="232" width="26" height="26" rx="6" fill="#F2B544"/>
  <text x="416" y="254" font-size="24" font-weight="700" fill="#1F2937">範例</text>
  <rect x="40" y="272" width="26" height="26" rx="6" fill="#657587"/>
  <text x="76" y="294" font-size="24" font-weight="700" fill="#4B5563">其他（文風、語氣、受眾、步驟）</text>
  <rect x="40" y="330" width="520" height="204" rx="18" fill="#F7F7F3"/>
  <text x="64" y="380" font-size="34" font-weight="700" fill="#1F2937" font-family="Arial, sans-serif">RTF</text>
  <text x="152.54399999999998" y="380" font-size="24" font-weight="700" fill="#4B5563">最短、最好記</text>
  <rect x="64" y="408" width="144" height="94" rx="14" fill="#173B5E"/>
  <text x="136.0" y="452" font-size="40" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif">R</text>
  <text x="136.0" y="488" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">角色</text>
  <rect x="220" y="408" width="144" height="94" rx="14" fill="#00AFC7"/>
  <text x="292.0" y="452" font-size="40" font-weight="700" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif">T</text>
  <text x="292.0" y="488" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">任務</text>
  <rect x="376" y="408" width="144" height="94" rx="14" fill="#53A88B"/>
  <text x="448.0" y="452" font-size="40" font-weight="700" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif">F</text>
  <text x="448.0" y="488" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">格式</text>
  <rect x="40" y="554" width="520" height="302" rx="18" fill="#F7F7F3"/>
  <text x="64" y="604" font-size="34" font-weight="700" fill="#1F2937" font-family="Arial, sans-serif">CO-STAR</text>
  <text x="243.93600000000004" y="604" font-size="24" font-weight="700" fill="#4B5563">新加坡 GovTech 的框架</text>
  <rect x="64" y="632" width="144" height="94" rx="14" fill="#2878D0"/>
  <text x="136.0" y="676" font-size="40" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif">C</text>
  <text x="136.0" y="712" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">背景</text>
  <rect x="220" y="632" width="144" height="94" rx="14" fill="#00AFC7"/>
  <text x="292.0" y="676" font-size="40" font-weight="700" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif">O</text>
  <text x="292.0" y="712" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">目標</text>
  <rect x="376" y="632" width="144" height="94" rx="14" fill="#657587"/>
  <text x="448.0" y="676" font-size="40" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif">S</text>
  <text x="448.0" y="712" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">文風</text>
  <rect x="64" y="730" width="144" height="94" rx="14" fill="#657587"/>
  <text x="136.0" y="774" font-size="40" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif">T</text>
  <text x="136.0" y="810" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">語氣</text>
  <rect x="220" y="730" width="144" height="94" rx="14" fill="#657587"/>
  <text x="292.0" y="774" font-size="40" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif">A</text>
  <text x="292.0" y="810" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">受眾</text>
  <rect x="376" y="730" width="144" height="94" rx="14" fill="#53A88B"/>
  <text x="448.0" y="774" font-size="40" font-weight="700" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif">R</text>
  <text x="448.0" y="810" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">回應格式</text>
  <rect x="40" y="876" width="520" height="302" rx="18" fill="#F7F7F3"/>
  <text x="64" y="926" font-size="34" font-weight="700" fill="#1F2937" font-family="Arial, sans-serif">RISEN</text>
  <text x="198.24" y="926" font-size="24" font-weight="700" fill="#4B5563">多了限制與步驟</text>
  <rect x="64" y="954" width="144" height="94" rx="14" fill="#173B5E"/>
  <text x="136.0" y="998" font-size="40" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif">R</text>
  <text x="136.0" y="1034" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">角色</text>
  <rect x="220" y="954" width="144" height="94" rx="14" fill="#00AFC7"/>
  <text x="292.0" y="998" font-size="40" font-weight="700" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif">I</text>
  <text x="292.0" y="1034" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">指示</text>
  <rect x="376" y="954" width="144" height="94" rx="14" fill="#657587"/>
  <text x="448.0" y="998" font-size="40" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif">S</text>
  <text x="448.0" y="1034" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">步驟</text>
  <rect x="64" y="1052" width="144" height="94" rx="14" fill="#00AFC7"/>
  <text x="136.0" y="1096" font-size="40" font-weight="700" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif">E</text>
  <text x="136.0" y="1132" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">最終目標</text>
  <rect x="220" y="1052" width="144" height="94" rx="14" fill="#F26D5B"/>
  <text x="292.0" y="1096" font-size="40" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif">N</text>
  <text x="292.0" y="1132" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">限縮範圍</text>
  <rect x="40" y="1198" width="520" height="302" rx="18" fill="#F7F7F3"/>
  <text x="64" y="1248" font-size="34" font-weight="700" fill="#1F2937" font-family="Arial, sans-serif">CREATE</text>
  <text x="221.08800000000002" y="1248" font-size="24" font-weight="700" fill="#4B5563">最接近六塊積木</text>
  <rect x="64" y="1276" width="144" height="94" rx="14" fill="#173B5E"/>
  <text x="136.0" y="1320" font-size="40" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif">C</text>
  <text x="136.0" y="1356" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">角色</text>
  <rect x="220" y="1276" width="144" height="94" rx="14" fill="#00AFC7"/>
  <text x="292.0" y="1320" font-size="40" font-weight="700" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif">R</text>
  <text x="292.0" y="1356" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">請求</text>
  <rect x="376" y="1276" width="144" height="94" rx="14" fill="#F2B544"/>
  <text x="448.0" y="1320" font-size="40" font-weight="700" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif">E</text>
  <text x="448.0" y="1356" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">範例</text>
  <rect x="64" y="1374" width="144" height="94" rx="14" fill="#F26D5B"/>
  <text x="136.0" y="1418" font-size="40" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif">A</text>
  <text x="136.0" y="1454" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">調整</text>
  <rect x="220" y="1374" width="144" height="94" rx="14" fill="#53A88B"/>
  <text x="292.0" y="1418" font-size="40" font-weight="700" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif">T</text>
  <text x="292.0" y="1454" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937">輸出類型</text>
  <rect x="376" y="1374" width="144" height="94" rx="14" fill="#657587"/>
  <text x="448.0" y="1418" font-size="40" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif">E</text>
  <text x="448.0" y="1454" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">補充</text>
  <rect x="400" y="348" width="140" height="44" rx="12" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
  <text x="470" y="379" font-size="24" font-weight="700" text-anchor="middle" fill="#B45309">出處不明</text>
</svg>

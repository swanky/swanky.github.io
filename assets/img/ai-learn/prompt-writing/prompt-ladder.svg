<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">從一次交辦，走到可重複的工作指示</title>
  <desc id="d">從一次交辦到可重複的工作指示，五階階梯：第 1 階對話交辦（六塊積木＋理由）；第 2 階發現重複（這段話我講第三次了）；第 3 階做成模板（固定部分＋【變數】）；第 4 階團隊共用（固定部分整理成工作手冊）；第 5 階測試與改版（用真實任務反覆跑、再修）。這個單元走完前三階；第 4、5 階以紅色標示。</desc>
  <rect width="1200" height="800" fill="#FFFFFF"/>
  <text x="48" y="80" font-size="48" font-weight="700" fill="#1F2937">從一次交辦，走到可重複的工作指示</text>
  <text x="48" y="126" font-size="26" fill="#4B5563">一階一階往上：先把話講清楚，再把重複的部分固定下來</text>
  <rect x="48" y="530" width="207" height="230" rx="20" fill="#E0F4F7" stroke="#00AFC7" stroke-width="3"/>
  <rect x="48" y="530" width="207" height="12" rx="6" fill="#00AFC7"/>
  <circle cx="88" cy="586" r="24" fill="#00AFC7"/>
  <text x="88" y="596" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif">1</text>
  <text x="64" y="654" font-size="34" font-weight="700" fill="#1F2937">對話交辦</text>
  <text x="64" y="698" font-size="26" fill="#1F2937">六塊積木</text>
  <text x="64" y="734" font-size="26" fill="#1F2937">＋理由</text>
  <rect x="273" y="460" width="207" height="300" rx="20" fill="#E0F4F7" stroke="#00AFC7" stroke-width="3"/>
  <rect x="273" y="460" width="207" height="12" rx="6" fill="#00AFC7"/>
  <circle cx="313" cy="516" r="24" fill="#00AFC7"/>
  <text x="313" y="526" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif">2</text>
  <text x="289" y="584" font-size="34" font-weight="700" fill="#1F2937">發現重複</text>
  <text x="289" y="628" font-size="26" fill="#1F2937">這段話我講</text>
  <text x="289" y="664" font-size="26" fill="#1F2937">第三次了</text>
  <rect x="498" y="390" width="207" height="370" rx="20" fill="#E0F4F7" stroke="#00AFC7" stroke-width="3"/>
  <rect x="498" y="390" width="207" height="12" rx="6" fill="#00AFC7"/>
  <circle cx="538" cy="446" r="24" fill="#00AFC7"/>
  <text x="538" y="456" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif">3</text>
  <text x="514" y="514" font-size="34" font-weight="700" fill="#1F2937">做成模板</text>
  <text x="514" y="558" font-size="26" fill="#1F2937">固定部分</text>
  <text x="514" y="594" font-size="26" fill="#1F2937">＋【變數】</text>
  <rect x="723" y="320" width="207" height="440" rx="20" fill="#FCECE8" stroke="#F26D5B" stroke-width="3"/>
  <rect x="723" y="320" width="207" height="12" rx="6" fill="#F26D5B"/>
  <circle cx="763" cy="376" r="24" fill="#F26D5B"/>
  <text x="763" y="386" font-size="28" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif">4</text>
  <text x="739" y="444" font-size="34" font-weight="700" fill="#1F2937">團隊共用</text>
  <text x="739" y="488" font-size="26" fill="#1F2937">固定部分整理</text>
  <text x="739" y="524" font-size="26" fill="#1F2937">成工作手冊</text>
  <rect x="948" y="250" width="207" height="510" rx="20" fill="#FCECE8" stroke="#F26D5B" stroke-width="3"/>
  <rect x="948" y="250" width="207" height="12" rx="6" fill="#F26D5B"/>
  <circle cx="988" cy="306" r="24" fill="#F26D5B"/>
  <text x="988" y="316" font-size="28" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif">5</text>
  <text x="964" y="374" font-size="32" font-weight="700" fill="#1F2937">測試與改版</text>
  <text x="964" y="418" font-size="26" fill="#1F2937">用真實任務</text>
  <text x="964" y="454" font-size="26" fill="#1F2937">反覆跑、再修</text>
  <path d="M48,370 L48,354 L705,354 L705,370" fill="none" stroke="#00AFC7" stroke-width="4"/>
  <text x="376.5" y="338" font-size="28" font-weight="700" text-anchor="middle" fill="#0B7A8C">這個單元走完前三階</text>
</svg>

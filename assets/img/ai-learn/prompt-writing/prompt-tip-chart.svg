<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">同一組數字，Y 軸從 0 畫，差距就沒那麼驚人</title>
  <desc id="d">直條圖：給 AI 小費，回答長度變多少？以什麼都不加為 100%。什麼都不加 100%、說不給小費 98%、給 20 美金 106%、給 200 美金 111%。Y 軸從 0% 畫到 120%，差距其實不大。量的是回答長度，不是答對率；每種只問 5 次。數據：thebes，2023 年 12 月 X 貼文。</desc>
  <rect width="1200" height="740" fill="#FFFFFF"/>
  <text x="48" y="80" font-size="48" font-weight="700" fill="#1F2937">同一組數字，Y 軸從 0 畫，差距就沒那麼驚人</text>
  <text x="48" y="126" font-size="26" fill="#4B5563">給 AI 小費，回答長度變多少？（以什麼都不加為 100%）</text>
  <line x1="150" y1="520.0" x2="1152" y2="520.0" stroke="#374151" stroke-width="3"/>
  <text x="136" y="528.0" font-size="24" font-weight="700" text-anchor="end" fill="#475569">0%</text>
  <line x1="150" y1="382.5" x2="1152" y2="382.5" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="136" y="390.5" font-size="24" font-weight="700" text-anchor="end" fill="#475569">50%</text>
  <line x1="150" y1="245.0" x2="1152" y2="245.0" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="136" y="253.0" font-size="24" font-weight="700" text-anchor="end" fill="#475569">100%</text>
  <line x1="150" y1="190.0" x2="150" y2="520" stroke="#374151" stroke-width="3"/>
  <text x="136" y="198.0" font-size="22" text-anchor="end" fill="#64748B">120%</text>
  <rect x="205.25" y="245.0" width="140" height="275.0" rx="8" fill="#2C5B8F"/>
  <text x="275.25" y="233.0" font-size="32" font-weight="700" text-anchor="middle" fill="#1F2937">100%</text>
  <text x="275.25" y="560" font-size="26" text-anchor="middle" fill="#1F2937">什麼都不加</text>
  <rect x="455.75" y="250.5" width="140" height="269.5" rx="8" fill="#2C5B8F"/>
  <text x="525.75" y="238.5" font-size="32" font-weight="700" text-anchor="middle" fill="#1F2937">98%</text>
  <text x="525.75" y="560" font-size="26" text-anchor="middle" fill="#1F2937">說不給小費</text>
  <rect x="706.25" y="228.5" width="140" height="291.5" rx="8" fill="#2C5B8F"/>
  <text x="776.25" y="216.5" font-size="32" font-weight="700" text-anchor="middle" fill="#1F2937">106%</text>
  <text x="776.25" y="560" font-size="26" text-anchor="middle" fill="#1F2937">給 20 美金</text>
  <rect x="956.75" y="214.75" width="140" height="305.25" rx="8" fill="#E5A300"/>
  <text x="1026.75" y="202.75" font-size="32" font-weight="700" text-anchor="middle" fill="#8A5D00">111%</text>
  <text x="1026.75" y="560" font-size="26" font-weight="700" text-anchor="middle" fill="#8A5D00">給 200 美金</text>
  <rect x="48" y="590" width="1104" height="86" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="600" y="644" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937">量的是<tspan fill="#8A5D00">回答長度</tspan>，不是答對率；每種只問 5 次</text>
  <text x="1152" y="716" font-size="22" text-anchor="end" fill="#64748B">數據：thebes，2023 年 12 月 X 貼文</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000" width="600" height="1000" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">同一組數字，Y 軸從 0 畫，差距就沒那麼驚人</title>
  <desc id="d">直條圖：給 AI 小費，回答長度變多少？以什麼都不加為 100%。什麼都不加 100%、說不給小費 98%、給 20 美金 106%、給 200 美金 111%。Y 軸從 0% 畫到 120%，差距其實不大。量的是回答長度，不是答對率；每種只問 5 次。數據：thebes，2023 年 12 月 X 貼文。</desc>
  <rect width="600" height="1000" fill="#FFFFFF"/>
  <text x="40" y="70" font-size="42" font-weight="700" fill="#1F2937">同一組數字，</text>
  <text x="40" y="120" font-size="42" font-weight="700" fill="#1F2937">Y 軸從 0 畫，</text>
  <text x="40" y="170" font-size="42" font-weight="700" fill="#1F2937">差距就沒那麼驚人</text>
  <text x="40" y="214" font-size="24" fill="#4B5563">給 AI 小費，回答長度變多少？</text>
  <text x="40" y="246" font-size="24" fill="#4B5563">（以什麼都不加為 100%）</text>
  <line x1="40.0" y1="280" x2="40.0" y2="740" stroke="#374151" stroke-width="3"/>
  <text x="40.0" y="772" font-size="24" font-weight="700" text-anchor="middle" fill="#475569">0%</text>
  <line x1="223.35" y1="280" x2="223.35" y2="740" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="223.35" y="772" font-size="24" font-weight="700" text-anchor="middle" fill="#475569">50%</text>
  <line x1="406.7" y1="280" x2="406.7" y2="740" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="406.7" y="772" font-size="24" font-weight="700" text-anchor="middle" fill="#475569">100%</text>
  <text x="480.03999999999996" y="772" font-size="22" text-anchor="middle" fill="#64748B">120%</text>
  <line x1="40" y1="740" x2="480.03999999999996" y2="740" stroke="#374151" stroke-width="3"/>
  <text x="40" y="314" font-size="26" font-weight="700" fill="#1F2937">什麼都不加</text>
  <rect x="40" y="328" width="366.7" height="46" rx="8" fill="#2C5B8F"/>
  <text x="418.7" y="364" font-size="30" font-weight="700" fill="#1F2937">100%</text>
  <text x="40" y="424" font-size="26" font-weight="700" fill="#1F2937">說不給小費</text>
  <rect x="40" y="438" width="359.366" height="46" rx="8" fill="#2C5B8F"/>
  <text x="411.366" y="474" font-size="30" font-weight="700" fill="#1F2937">98%</text>
  <text x="40" y="534" font-size="26" font-weight="700" fill="#1F2937">給 20 美金</text>
  <rect x="40" y="548" width="388.702" height="46" rx="8" fill="#2C5B8F"/>
  <text x="440.702" y="584" font-size="30" font-weight="700" fill="#1F2937">106%</text>
  <text x="40" y="644" font-size="26" font-weight="700" fill="#8A5D00">給 200 美金</text>
  <rect x="40" y="658" width="407.037" height="46" rx="8" fill="#E5A300"/>
  <text x="459.037" y="694" font-size="30" font-weight="700" fill="#8A5D00">111%</text>
  <rect x="40" y="810" width="520" height="120" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="300" y="860" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937">量的是<tspan fill="#8A5D00">回答長度</tspan>，</text>
  <text x="300" y="902" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937">不是答對率；每種只問 5 次</text>
  <text x="560" y="970" font-size="22" text-anchor="end" fill="#64748B">數據：thebes，2023 年 12 月 X 貼文</text>
</svg>

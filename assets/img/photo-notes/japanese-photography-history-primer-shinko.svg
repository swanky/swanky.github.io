  <text x="600" y="514" font-size="26" fill="#5C5248" text-anchor="middle">拍下人們</text>
  <text x="600" y="550" font-size="26" fill="#5C5248" text-anchor="middle">生活的樣子</text>
  <path d="M600,218 C600,252 984,244 984,280" fill="none" stroke="#E5A300" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrg)"/>

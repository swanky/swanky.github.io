  <circle cx="1018" cy="372" r="14" fill="#E5A300"/>
  <text x="984" y="470" font-size="34" font-weight="700" fill="#2B2622" text-anchor="middle">不用相機的實驗</text>
  <text x="984" y="514" font-size="26" fill="#5C5248" text-anchor="middle">相紙直接感光、</text>
  <text x="984" y="550" font-size="26" fill="#5C5248" text-anchor="middle">照片剪貼組合</text>
  <rect x="48" y="598" width="1104" height="90" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="600" y="653.8" font-size="30" font-weight="700" text-anchor="middle"><tspan fill="#2B2622">它不是單一風格，</tspan><tspan fill="#8A5D00">而是一起追問相機的可能</tspan></text>

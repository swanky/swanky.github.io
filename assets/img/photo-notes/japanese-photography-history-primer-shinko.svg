  <path d="M216,340 L249,356.5 L216,373 L183,356.5 Z" fill="#FFFFFF" stroke="#3A332D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M183,356.5 L183,392.5 L216,409 L216,373 Z" fill="#EDE6DC" stroke="#3A332D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M249,356.5 L249,392.5 L216,409 L216,373 Z" fill="#A8998A" stroke="#3A332D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

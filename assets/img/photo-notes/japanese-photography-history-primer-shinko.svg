  <text x="466" y="331.36" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <path d="M530,364 L574,324 L618,364" fill="none" stroke="#3A332D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

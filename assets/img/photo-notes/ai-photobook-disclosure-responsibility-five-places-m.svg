  <circle cx="167.16" cy="864.76" r="3.3" fill="#5C5248"/>
  <line x1="109.08" y1="901.72" x2="190.92" y2="901.72" stroke="#A8998A" stroke-width="4" stroke-linecap="round"/>
  <text x="226" y="846" font-size="32" font-weight="700" fill="#2B2622">電子書封面</text>

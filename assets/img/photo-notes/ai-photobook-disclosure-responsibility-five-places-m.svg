  <text x="300" y="998.8" font-size="30" font-weight="700" text-anchor="middle"><tspan fill="#2B2622">圖說可以讓位給照片，</tspan></text>
  <text x="300" y="1042.8" font-size="30" font-weight="700" text-anchor="middle"><tspan fill="#8A5D00">揭露不行</tspan></text>
</svg>

  <line x1="132" y1="172" x2="222" y2="172" stroke="#A8998A" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 8"/>
  </g>
  <text x="600" y="460" font-size="34" font-weight="700" fill="#2B2622" text-anchor="middle">路過的距離</text>
  <text x="600" y="500" font-size="26" font-weight="700" fill="#8A5D00" text-anchor="middle">佐內正史</text>
  <text x="600" y="542" font-size="26" fill="#5C5248" text-anchor="middle">不刻意靠近或設計</text>
  <rect x="816" y="166" width="336" height="404" rx="24" fill="#F6F2EC" stroke="#A8998A" stroke-width="3"/>
  <circle cx="850" cy="200" r="22" fill="#3A332D"/>
  <text x="850" y="209.36" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <g transform="translate(816,176)">
  <circle cx="270" cy="54" r="18" fill="#E5A300"/>
  <line x1="296" y1="54" x2="308" y2="54" stroke="#E5A300" stroke-width="4" stroke-linecap="round"/>
  <line x1="288.385" y1="72.3848" x2="296.87" y2="80.8701" stroke="#E5A300" stroke-width="4" stroke-linecap="round"/>
  <line x1="270" y1="80" x2="270" y2="92" stroke="#E5A300" stroke-width="4" stroke-linecap="round"/>
  <line x1="251.615" y1="72.3848" x2="243.13" y2="80.8701" stroke="#E5A300" stroke-width="4" stroke-linecap="round"/>
  <line x1="244" y1="54" x2="232" y2="54" stroke="#E5A300" stroke-width="4" stroke-linecap="round"/>
  <line x1="251.615" y1="35.6152" x2="243.13" y2="27.1299" stroke="#E5A300" stroke-width="4" stroke-linecap="round"/>

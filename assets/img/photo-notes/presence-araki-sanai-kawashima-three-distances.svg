  <line x1="288.385" y1="35.6152" x2="296.87" y2="27.1299" stroke="#E5A300" stroke-width="4" stroke-linecap="round"/>
  <g transform="translate(120,186) rotate(0) scale(0.62)"><rect x="-14" y="-38" width="28" height="12" rx="3" fill="#3A332D"/><rect x="-40" y="-28" width="80" height="54" rx="10" fill="#FFFFFF" stroke="#3A332D" stroke-width="4"/><circle cx="0" cy="-1" r="15" fill="#FFFFFF" stroke="#3A332D" stroke-width="4"/><circle cx="0" cy="-1" r="5" fill="#3A332D"/></g>
  <g transform="translate(196,190) scale(0.85)" fill="#8A7F72"><circle cx="0" cy="-36" r="18"/><path d="M-32,40 L-32,6 Q-32,-12 -14,-12 L14,-12 Q32,-12 32,6 L32,40 Z"/></g>
  <path d="M132,150 Q170,90 238,64" fill="none" stroke="#E5A300" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8" marker-end="url(#arrg)"/>
  <path d="M204,140 Q222,96 248,74" fill="none" stroke="#E5A300" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8" marker-end="url(#arrg)"/>
  <line x1="30" y1="230" x2="306" y2="230" stroke="#A8998A" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="984" y="460" font-size="34" font-weight="700" fill="#2B2622" text-anchor="middle">站到對方那邊</text>
  <text x="984" y="500" font-size="26" font-weight="700" fill="#8A5D00" text-anchor="middle">川島小鳥</text>
  <text x="984" y="542" font-size="26" fill="#5C5248" text-anchor="middle">跟著對方的視線看</text>
  <rect x="48" y="598" width="1104" height="90" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="600" y="653.8" font-size="30" font-weight="700" text-anchor="middle"><tspan fill="#2B2622">照片看得出：</tspan><tspan fill="#8A5D00">拍的人站多近、是什麼關係</tspan></text>
</svg>

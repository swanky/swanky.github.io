<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 940" width="600" height="940" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">只換中間一張，故事就變了</title>
  <desc id="d">選片示意，不是任何作品。兩排各三格，頭尾一樣是「出發」和「離開」。第一排中間是一張空椅子，讀起來像一個人在等；第二排只把中間換成兩杯飲料，讀起來像有人來過。在場感有一半，是在選片時決定的。</desc>

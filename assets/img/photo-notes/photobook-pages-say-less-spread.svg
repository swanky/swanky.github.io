<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">字在照片旁邊，眼睛會先讀字</title>
<desc id="d">示意圖，同一組照片的兩種版面。左邊改版前：每張照片下面都有編號、小標題和一句圖說，眼睛先被字拉走，照片還沒看清楚，字已經先替你決定怎麼看。右邊發布版：照片頁只有照片和留白，眼睛先看照片；想多知道一點，再翻到書末的圖目錄。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5A300"/></marker></defs>
<rect width="1200" height="720" fill="#FFFFFF"/>
<text x="48" y="80" font-size="48" font-weight="700" fill="#1F2937">字在照片旁邊，眼睛會先讀字</text><text x="48" y="126" font-size="26" fill="#4B5563">同一組照片，兩種版面</text>
<g transform="translate(1090,100) rotate(-5)"><rect x="-37" y="-22" width="74" height="44" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="3" stroke-dasharray="8 5"/><text x="0" y="8" text-anchor="middle" font-size="22" font-weight="700" fill="#64748B">示意</text></g>
<rect x="48" y="160" width="540" height="424" rx="22" fill="#FDECEC" stroke="#B91C1C" stroke-width="2"/>
<rect x="194" y="174" width="248" height="44" rx="22" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2"/><text x="318" y="205" text-anchor="middle" font-size="24" font-weight="700" fill="#B91C1C">改版前：每頁都有字</text>
<rect x="118" y="270" width="200" height="250" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><rect x="140" y="292" width="156" height="115.0" rx="4" fill="#CBD5E1"/><circle cx="252" cy="326" r="13" fill="#F8FAFC"/><polygon points="140,407.0 195,344 237,382 262,361 296,396 296,407.0" fill="#94A3B8"/><text x="140" y="437.0" font-size="20" font-weight="700" fill="#1F2937">編號｜小標題</text><line x1="140" y1="463.0" x2="296" y2="463.0" stroke="#64748B" stroke-width="6" stroke-linecap="round"/><line x1="140" y1="479.0" x2="234" y2="479.0" stroke="#64748B" stroke-width="6" stroke-linecap="round"/><rect x="318" y="270" width="200" height="250" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><rect x="340" y="292" width="156" height="115.0" rx="4" fill="#CBD5E1"/><circle cx="452" cy="326" r="13" fill="#F8FAFC"/><polygon points="340,407.0 395,344 437,382 462,361 496,396 496,407.0" fill="#94A3B8"/><text x="340" y="437.0" font-size="20" font-weight="700" fill="#1F2937">編號｜小標題</text><line x1="340" y1="463.0" x2="496" y2="463.0" stroke="#64748B" stroke-width="6" stroke-linecap="round"/><line x1="340" y1="479.0" x2="434" y2="479.0" stroke="#64748B" stroke-width="6" stroke-linecap="round"/><line x1="318" y1="270" x2="318" y2="520" stroke="#64748B" stroke-width="3"/>
<g transform="translate(120,262) scale(0.55)"><path d="M-46,0 Q0,-42 46,0 Q0,42 -46,0 Z" fill="#FFFFFF" stroke="#B91C1C" stroke-width="5"/><circle cx="0" cy="0" r="15" fill="#B91C1C"/><circle cx="5" cy="-5" r="5" fill="#FFFFFF"/></g>
<path d="M140,280 Q140,349 140,418" fill="none" stroke="#B91C1C" stroke-width="4" marker-end="url(#arrR)"/>
<text x="318" y="560" font-size="26" font-weight="700" text-anchor="middle" fill="#B91C1C">① 先讀字　② 才看照片</text>
<rect x="612" y="160" width="540" height="424" rx="22" fill="#E6F4F1" stroke="#0E7568" stroke-width="2"/>
<rect x="734" y="174" width="296" height="44" rx="22" fill="#FFFFFF" stroke="#0E7568" stroke-width="2"/><text x="882" y="205" text-anchor="middle" font-size="24" font-weight="700" fill="#0E7568">發布版：只有照片和留白</text>
<rect x="682" y="270" width="200" height="250" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><rect x="717" y="335.0" width="130" height="104.0" rx="4" fill="#CBD5E1"/><circle cx="811" cy="366" r="11" fill="#F8FAFC"/><polygon points="717,439.0 762,382 798,416 818,397 847,429 847,439.0" fill="#94A3B8"/><rect x="882" y="270" width="200" height="250" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><rect x="917" y="335.0" width="130" height="104.0" rx="4" fill="#CBD5E1"/><circle cx="1011" cy="366" r="11" fill="#F8FAFC"/><polygon points="917,439.0 962,382 998,416 1018,397 1047,429 1047,439.0" fill="#94A3B8"/><line x1="882" y1="270" x2="882" y2="520" stroke="#64748B" stroke-width="3"/>
<g transform="translate(684,262) scale(0.55)"><path d="M-46,0 Q0,-42 46,0 Q0,42 -46,0 Z" fill="#FFFFFF" stroke="#0E7568" stroke-width="5"/><circle cx="0" cy="0" r="15" fill="#0E7568"/><circle cx="5" cy="-5" r="5" fill="#FFFFFF"/></g>
<path d="M704,280 Q712,320 720,360" fill="none" stroke="#0E7568" stroke-width="4" marker-end="url(#arr)"/>
<text x="882" y="560" font-size="26" font-weight="700" text-anchor="middle" fill="#0E7568">① 先看照片　② 想知道再翻書末</text>
<rect x="48" y="610" width="1104" height="80" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/><text x="600.0" y="661" font-size="30" font-weight="700" text-anchor="middle"><tspan fill="#1F2937">照片頁不放字：</tspan><tspan fill="#8A5D00">讓照片先開口，想知道再讀字</tspan></text>
</svg>

  <text x="48" y="126" font-size="26" fill="#6B5E52">五個位置，讀者看照片之前就知道這是 AI 創作</text>
  <rect x="48" y="166" width="200" height="392" rx="24" fill="#F6F2EC" stroke="#A8998A" stroke-width="3"/>

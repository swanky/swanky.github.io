  <line x1="990" y1="366" x2="1114" y2="366" stroke="#A8998A" stroke-width="4" stroke-linecap="round"/>
  <text x="1052" y="428" font-size="30" font-weight="700" fill="#2B2622" text-anchor="middle">電子書封面</text>
  <text x="1052" y="478" font-size="26" fill="#5C5248" text-anchor="middle">照片頁沒字，</text>
  <text x="1052" y="516" font-size="26" fill="#5C5248" text-anchor="middle">封面留一行</text>
  <rect x="48" y="590" width="1104" height="92" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="600" y="646.8" font-size="30" font-weight="700" text-anchor="middle"><tspan fill="#2B2622">圖說可以讓位給照片，</tspan><tspan fill="#8A5D00">揭露不行</tspan></text>
</svg>

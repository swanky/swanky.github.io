  <rect x="121" y="254" width="54" height="24" rx="4" fill="#E5A300"/>
  <line x1="132" y1="266" x2="164" y2="266" stroke="#2B2622" stroke-width="3" stroke-linecap="round"/>
  <circle cx="174" cy="310" r="5" fill="#5C5248"/>

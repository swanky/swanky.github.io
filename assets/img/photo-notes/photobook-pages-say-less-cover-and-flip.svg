<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">把字全部遮起來，再翻一次</title>
<desc id="d">示意圖：把書裡所有的字用便利貼遮住，只看照片，從頭再翻一次，問自己三個問題。一、不看章名，還感覺得到章節換了嗎？二、每一張，還說得出它為什麼在這個位置嗎？三、有沒有哪一張，拿掉圖說就說不出它要表達什麼？第三題最有用：答案是有，問題通常在那張照片本身，或它擺錯了位置。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5A300"/></marker></defs>
<rect width="1200" height="750" fill="#FFFFFF"/>
<text x="48" y="80" font-size="48" font-weight="700" fill="#1F2937">把字全部遮起來，再翻一次</text><text x="48" y="126" font-size="26" fill="#4B5563">遮住所有字、只看照片，從頭翻到尾，問自己三個問題</text>
<g transform="translate(1090,100) rotate(-5)"><rect x="-37" y="-22" width="74" height="44" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="3" stroke-dasharray="8 5"/><text x="0" y="8" text-anchor="middle" font-size="22" font-weight="700" fill="#64748B">示意</text></g>
<rect x="70" y="200" width="190" height="280" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><rect x="90" y="220" width="150" height="140.0" rx="4" fill="#CBD5E1"/><circle cx="198" cy="262" r="15" fill="#F8FAFC"/><polygon points="90,360.0 142,283 183,329 207,304 240,346 240,360.0" fill="#94A3B8"/><line x1="90" y1="390.0" x2="240" y2="390.0" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/><line x1="90" y1="406.0" x2="180" y2="406.0" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/><g transform="translate(165.0,399.0) rotate(-4)"><rect x="-81.0" y="-25.0" width="162" height="50" rx="3" fill="#FCD34D" stroke="#E5A300" stroke-width="2"/><rect x="-81.0" y="-25.0" width="162" height="11" fill="#F5C021"/></g><rect x="260" y="200" width="190" height="280" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><rect x="280" y="220" width="150" height="140.0" rx="4" fill="#CBD5E1"/><circle cx="388" cy="262" r="15" fill="#F8FAFC"/><polygon points="280,360.0 332,283 373,329 397,304 430,346 430,360.0" fill="#94A3B8"/><line x1="280" y1="390.0" x2="430" y2="390.0" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/><line x1="280" y1="406.0" x2="370" y2="406.0" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/><g transform="translate(355.0,399.0) rotate(3)"><rect x="-81.0" y="-25.0" width="162" height="50" rx="3" fill="#FCD34D" stroke="#E5A300" stroke-width="2"/><rect x="-81.0" y="-25.0" width="162" height="11" fill="#F5C021"/></g><line x1="260" y1="200" x2="260" y2="480" stroke="#64748B" stroke-width="3"/>
<path d="M110,530 Q260,600 410,530" fill="none" stroke="#64748B" stroke-width="4" marker-end="url(#arr)"/>
<text x="260" y="610" font-size="24" font-weight="700" text-anchor="middle" fill="#4B5563">從頭再翻一次</text>
<rect x="492" y="168" width="660" height="124" rx="20" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="538" cy="230" r="26" fill="#2C5B8F"/><text x="538" y="241" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF">1</text>
<text x="584" y="222" font-size="28" font-weight="700" fill="#1F2937">不看章名，</text>
<text x="584" y="262" font-size="28" font-weight="700" fill="#1F2937">還感覺得到章節換了嗎？</text>
<rect x="492" y="310" width="660" height="124" rx="20" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="538" cy="372" r="26" fill="#2C5B8F"/><text x="538" y="383" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF">2</text>
<text x="584" y="364" font-size="28" font-weight="700" fill="#1F2937">每一張，還說得出</text>
<text x="584" y="404" font-size="28" font-weight="700" fill="#1F2937">它為什麼在這個位置嗎？</text>
<rect x="492" y="452" width="660" height="124" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
<circle cx="538" cy="514" r="26" fill="#E5A300"/><text x="538" y="525" text-anchor="middle" font-size="30" font-weight="700" fill="#1F2937">3</text>
<text x="584" y="506" font-size="28" font-weight="700" fill="#1F2937">有沒有哪一張，拿掉圖說</text>
<text x="584" y="546" font-size="28" font-weight="700" fill="#1F2937">就說不出它要表達什麼？</text>
<rect x="1035" y="467" width="90" height="38" rx="19" fill="#E5A300"/><text x="1080" y="494" text-anchor="middle" font-size="22" font-weight="700" fill="#1F2937">最有用</text>
<rect x="48" y="640" width="1104" height="80" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/><text x="600.0" y="691" font-size="30" font-weight="700" text-anchor="middle"><tspan fill="#1F2937">第三題答「有」：</tspan><tspan fill="#8A5D00">問題通常在照片，或它擺錯了位置</tspan></text>
</svg>

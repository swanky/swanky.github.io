<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1124" width="600" height="1124" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">把字全部遮起來，再翻一次</title>
<desc id="d">示意圖：把書裡所有的字用便利貼遮住，只看照片，從頭再翻一次，問自己三個問題。一、不看章名，還感覺得到章節換了嗎？二、每一張，還說得出它為什麼在這個位置嗎？三、有沒有哪一張，拿掉圖說就說不出它要表達什麼？第三題最有用：答案是有，問題通常在那張照片本身，或它擺錯了位置。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5A300"/></marker></defs>
<rect width="600" height="1124" fill="#FFFFFF"/>
<text x="40" y="72" font-size="42" font-weight="700" fill="#1F2937">遮住字，再翻一次</text>
<text x="40" y="114" font-size="24" fill="#4B5563">只看照片，問自己三個問題</text>
<g transform="translate(510,86) rotate(-5)"><rect x="-35" y="-22" width="70" height="44" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="3" stroke-dasharray="8 5"/><text x="0" y="8" text-anchor="middle" font-size="20" font-weight="700" fill="#64748B">示意</text></g>
<rect x="110" y="150" width="190" height="270" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><rect x="130" y="170" width="150" height="135.0" rx="4" fill="#CBD5E1"/><circle cx="238" cy="210" r="15" fill="#F8FAFC"/><polygon points="130,305.0 182,231 223,275 247,251 280,292 280,305.0" fill="#94A3B8"/><line x1="130" y1="335.0" x2="280" y2="335.0" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/><line x1="130" y1="351.0" x2="220" y2="351.0" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/><g transform="translate(205.0,344.0) rotate(-4)"><rect x="-81.0" y="-25.0" width="162" height="50" rx="3" fill="#FCD34D" stroke="#E5A300" stroke-width="2"/><rect x="-81.0" y="-25.0" width="162" height="11" fill="#F5C021"/></g><rect x="300" y="150" width="190" height="270" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><rect x="320" y="170" width="150" height="135.0" rx="4" fill="#CBD5E1"/><circle cx="428" cy="210" r="15" fill="#F8FAFC"/><polygon points="320,305.0 372,231 413,275 437,251 470,292 470,305.0" fill="#94A3B8"/><line x1="320" y1="335.0" x2="470" y2="335.0" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/><line x1="320" y1="351.0" x2="410" y2="351.0" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/><g transform="translate(395.0,344.0) rotate(3)"><rect x="-81.0" y="-25.0" width="162" height="50" rx="3" fill="#FCD34D" stroke="#E5A300" stroke-width="2"/><rect x="-81.0" y="-25.0" width="162" height="11" fill="#F5C021"/></g><line x1="300" y1="150" x2="300" y2="420" stroke="#64748B" stroke-width="3"/>
<path d="M160,440 Q300,500 440,440" fill="none" stroke="#64748B" stroke-width="4" marker-end="url(#arr)"/>
<text x="300" y="506" font-size="22" font-weight="700" text-anchor="middle" fill="#4B5563">從頭再翻一次</text>
<rect x="40" y="530" width="520" height="128" rx="20" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="82" cy="594" r="24" fill="#2C5B8F"/><text x="82" y="604" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">1</text>
<text x="124" y="586" font-size="26" font-weight="700" fill="#1F2937">不看章名，</text>
<text x="124" y="626" font-size="26" font-weight="700" fill="#1F2937">還感覺得到章節換了嗎？</text>
<rect x="40" y="676" width="520" height="128" rx="20" fill="#EAF1F8" stroke="#2C5B8F" stroke-width="3"/>
<circle cx="82" cy="740" r="24" fill="#2C5B8F"/><text x="82" y="750" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">2</text>
<text x="124" y="732" font-size="26" font-weight="700" fill="#1F2937">每一張，還說得出</text>
<text x="124" y="772" font-size="26" font-weight="700" fill="#1F2937">它為什麼在這個位置嗎？</text>
<rect x="40" y="822" width="520" height="128" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
<circle cx="82" cy="886" r="24" fill="#E5A300"/><text x="82" y="896" text-anchor="middle" font-size="28" font-weight="700" fill="#1F2937">3</text>
<text x="124" y="878" font-size="26" font-weight="700" fill="#1F2937">有沒有哪一張，拿掉圖說</text>
<text x="124" y="918" font-size="26" font-weight="700" fill="#1F2937">就說不出它要表達什麼？</text>
<rect x="460" y="803" width="80" height="34" rx="17" fill="#E5A300"/><text x="500" y="827" text-anchor="middle" font-size="20" font-weight="700" fill="#1F2937">最有用</text>
<rect x="40" y="972" width="520" height="116" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/><text x="300.0" y="1022" font-size="26" font-weight="700" text-anchor="middle"><tspan fill="#1F2937">第三題答「有」：</tspan></text><text x="300.0" y="1057" font-size="26" font-weight="700" text-anchor="middle"><tspan fill="#8A5D00">問題通常在照片，或它擺錯了位置</tspan></text>
</svg>

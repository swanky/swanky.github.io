  <line x1="300" y1="772" x2="300" y2="760" stroke="#E5A300" stroke-width="4" stroke-linecap="round"/>
  <line x1="319.799" y1="780.201" x2="328.284" y2="771.716" stroke="#E5A300" stroke-width="4" stroke-linecap="round"/>
  <g transform="translate(246,922) rotate(-90) scale(1.1)"><rect x="-30" y="-22" width="44" height="44" rx="8" fill="#FFFFFF" stroke="#3A332D" stroke-width="4"/><rect x="14" y="-12" width="22" height="24" rx="4" fill="#3A332D"/></g>
  <g transform="translate(354,922) rotate(-90) scale(1.1)" fill="#8A7F72"><ellipse cx="0" cy="0" rx="18" ry="38"/><circle cx="2" cy="0" r="17" fill="#3A332D"/><path d="M17,-6 L28,0 L17,6 Z" fill="#3A332D"/></g>
  <line x1="246" y1="876" x2="280" y2="846" stroke="#E5A300" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#arrg)"/>
  <line x1="354" y1="876" x2="320" y2="846" stroke="#E5A300" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#arrg)"/>
  <text x="230" y="992" font-size="22" font-weight="700" fill="#5C5248" text-anchor="middle">相機</text>
  <text x="380" y="992" font-size="22" font-weight="700" fill="#5C5248" text-anchor="middle">被拍的人</text>
  <text x="300" y="1052" font-size="26" fill="#5C5248" text-anchor="middle">一起看向同一個方向</text>
  <rect x="40" y="1124" width="520" height="84" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="300" y="1176.08" font-size="28" font-weight="700" text-anchor="middle"><tspan fill="#2B2622">不是面對面，</tspan><tspan fill="#8A5D00">是站到旁邊</tspan></text>

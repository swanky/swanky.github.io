  <line x1="132" y1="172" x2="222" y2="172" stroke="#A8998A" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 8"/>
  </g>
  <circle cx="70" cy="506" r="20" fill="#3A332D"/>
  <text x="70" y="514.64" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="300" y="550" font-size="32" font-weight="700" fill="#2B2622">路過的距離</text>
  <text x="300" y="592" font-size="26" font-weight="700" fill="#8A5D00">佐內正史</text>
  <text x="300" y="636" font-size="26" fill="#5C5248">不刻意靠近或設計</text>
  <rect x="40" y="712" width="520" height="216" rx="24" fill="#F6F2EC" stroke="#A8998A" stroke-width="3"/>
  <g transform="translate(46,730) scale(0.72)">
  <circle cx="270" cy="54" r="18" fill="#E5A300"/>
  <line x1="296" y1="54" x2="308" y2="54" stroke="#E5A300" stroke-width="4" stroke-linecap="round"/>
  <line x1="288.385" y1="72.3848" x2="296.87" y2="80.8701" stroke="#E5A300" stroke-width="4" stroke-linecap="round"/>
  <line x1="270" y1="80" x2="270" y2="92" stroke="#E5A300" stroke-width="4" stroke-linecap="round"/>

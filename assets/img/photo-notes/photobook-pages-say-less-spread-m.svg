<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1198" width="600" height="1198" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<title id="t">字在照片旁邊，眼睛會先讀字</title>
<desc id="d">示意圖，同一組照片的兩種版面。左邊改版前：每張照片下面都有編號、小標題和一句圖說，眼睛先被字拉走，照片還沒看清楚，字已經先替你決定怎麼看。右邊發布版：照片頁只有照片和留白，眼睛先看照片；想多知道一點，再翻到書末的圖目錄。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5A300"/></marker></defs>
<rect width="600" height="1198" fill="#FFFFFF"/>
<text x="40" y="72" font-size="42" font-weight="700" fill="#1F2937">眼睛會先讀字</text>
<text x="40" y="114" font-size="24" fill="#4B5563">同一組照片，兩種版面</text>
<g transform="translate(500,86) rotate(-5)"><rect x="-35" y="-22" width="70" height="44" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="3" stroke-dasharray="8 5"/><text x="0" y="8" text-anchor="middle" font-size="20" font-weight="700" fill="#64748B">示意</text></g>
<rect x="40" y="146" width="520" height="430" rx="22" fill="#FDECEC" stroke="#B91C1C" stroke-width="2"/>
<rect x="176" y="164" width="248" height="44" rx="22" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2"/><text x="300" y="195" text-anchor="middle" font-size="24" font-weight="700" fill="#B91C1C">改版前：每頁都有字</text>
<rect x="104" y="238" width="196" height="250" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><rect x="126" y="260" width="152" height="115.0" rx="4" fill="#CBD5E1"/><circle cx="235" cy="294" r="13" fill="#F8FAFC"/><polygon points="126,375.0 179,312 220,350 245,329 278,364 278,375.0" fill="#94A3B8"/><text x="126" y="405.0" font-size="20" font-weight="700" fill="#1F2937">編號｜小標題</text><line x1="126" y1="431.0" x2="278" y2="431.0" stroke="#64748B" stroke-width="6" stroke-linecap="round"/><line x1="126" y1="447.0" x2="217" y2="447.0" stroke="#64748B" stroke-width="6" stroke-linecap="round"/><rect x="300" y="238" width="196" height="250" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><rect x="322" y="260" width="152" height="115.0" rx="4" fill="#CBD5E1"/><circle cx="431" cy="294" r="13" fill="#F8FAFC"/><polygon points="322,375.0 375,312 416,350 441,329 474,364 474,375.0" fill="#94A3B8"/><text x="322" y="405.0" font-size="20" font-weight="700" fill="#1F2937">編號｜小標題</text><line x1="322" y1="431.0" x2="474" y2="431.0" stroke="#64748B" stroke-width="6" stroke-linecap="round"/><line x1="322" y1="447.0" x2="413" y2="447.0" stroke="#64748B" stroke-width="6" stroke-linecap="round"/><line x1="300" y1="238" x2="300" y2="488" stroke="#64748B" stroke-width="3"/>
<g transform="translate(74,256) scale(0.5)"><path d="M-46,0 Q0,-42 46,0 Q0,42 -46,0 Z" fill="#FFFFFF" stroke="#B91C1C" stroke-width="5"/><circle cx="0" cy="0" r="15" fill="#B91C1C"/><circle cx="5" cy="-5" r="5" fill="#FFFFFF"/></g>
<path d="M80,276 Q91,330 102,384" fill="none" stroke="#B91C1C" stroke-width="4" marker-end="url(#arrR)"/>
<text x="300" y="542" font-size="26" font-weight="700" text-anchor="middle" fill="#B91C1C">① 先讀字　② 才看照片</text>
<rect x="40" y="596" width="520" height="430" rx="22" fill="#E6F4F1" stroke="#0E7568" stroke-width="2"/>
<rect x="152" y="614" width="296" height="44" rx="22" fill="#FFFFFF" stroke="#0E7568" stroke-width="2"/><text x="300" y="645" text-anchor="middle" font-size="24" font-weight="700" fill="#0E7568">發布版：只有照片和留白</text>
<rect x="104" y="688" width="196" height="250" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><rect x="139" y="754.6" width="126" height="100.80000000000001" rx="4" fill="#CBD5E1"/><circle cx="230" cy="785" r="11" fill="#F8FAFC"/><polygon points="139,855.4000000000001 183,800 217,833 237,815 265,845 265,855.4000000000001" fill="#94A3B8"/><rect x="300" y="688" width="196" height="250" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><rect x="335" y="754.6" width="126" height="100.80000000000001" rx="4" fill="#CBD5E1"/><circle cx="426" cy="785" r="11" fill="#F8FAFC"/><polygon points="335,855.4000000000001 379,800 413,833 433,815 461,845 461,855.4000000000001" fill="#94A3B8"/><line x1="300" y1="688" x2="300" y2="938" stroke="#64748B" stroke-width="3"/>
<g transform="translate(74,706) scale(0.5)"><path d="M-46,0 Q0,-42 46,0 Q0,42 -46,0 Z" fill="#FFFFFF" stroke="#0E7568" stroke-width="5"/><circle cx="0" cy="0" r="15" fill="#0E7568"/><circle cx="5" cy="-5" r="5" fill="#FFFFFF"/></g>
<path d="M80,726 Q104,750 128,774" fill="none" stroke="#0E7568" stroke-width="4" marker-end="url(#arr)"/>
<text x="300" y="992" font-size="24" font-weight="700" text-anchor="middle" fill="#0E7568">① 先看照片　② 想知道再翻書末</text>
<rect x="40" y="1046" width="520" height="116" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/><text x="300.0" y="1096" font-size="26" font-weight="700" text-anchor="middle"><tspan fill="#1F2937">照片頁不放字：</tspan></text><text x="300.0" y="1131" font-size="26" font-weight="700" text-anchor="middle"><tspan fill="#8A5D00">讓照片先開口，想知道再讀字</tspan></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <title id="t">角色的臉，只從一個地方來</title>
  <desc id="d">中間是一張作者核准過的全身定裝照，是角色臉和身形的唯一來源；之後生成的每一張都回來對照它。左邊四種來源不拿來蓋臉：真人照片、別的角色、網路上的圖、之前失敗的圖。只要臉有一部分借自真人照片，就可能像某個真人。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C5248"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5A300"/></marker>
    <filter id="blur10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1200" height="720" fill="#FFFFFF"/>
  <text x="48" y="80" font-size="48" font-weight="700" fill="#2B2622">角色的臉，只從一個地方來</text>
  <text x="48" y="126" font-size="26" fill="#6B5E52">每一張圖，都回去對照這張核准過的定裝照</text>
  <text x="48" y="200" font-size="28" font-weight="700" fill="#B91C1C">不拿來蓋臉</text>
  <rect x="48" y="222" width="300" height="64" rx="32" fill="#FFFFFF" stroke="#A8998A" stroke-width="3"/>
  <circle cx="84" cy="254" r="18" fill="#FFFFFF" stroke="#B91C1C" stroke-width="4"/>
  <path d="M76.44,246.44 L91.56,261.56 M91.56,246.44 L76.44,261.56" fill="none" stroke="#B91C1C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="116" y="264" font-size="26" font-weight="700" fill="#5C5248">真人照片</text>
  <rect x="48" y="302" width="300" height="64" rx="32" fill="#FFFFFF" stroke="#A8998A" stroke-width="3"/>
  <circle cx="84" cy="334" r="18" fill="#FFFFFF" stroke="#B91C1C" stroke-width="4"/>
  <path d="M76.44,326.44 L91.56,341.56 M91.56,326.44 L76.44,341.56" fill="none" stroke="#B91C1C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="116" y="344" font-size="26" font-weight="700" fill="#5C5248">別的角色</text>
  <rect x="48" y="382" width="300" height="64" rx="32" fill="#FFFFFF" stroke="#A8998A" stroke-width="3"/>
  <circle cx="84" cy="414" r="18" fill="#FFFFFF" stroke="#B91C1C" stroke-width="4"/>
  <path d="M76.44,406.44 L91.56,421.56 M91.56,406.44 L76.44,421.56" fill="none" stroke="#B91C1C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="116" y="424" font-size="26" font-weight="700" fill="#5C5248">網路上的圖</text>
  <rect x="48" y="462" width="300" height="64" rx="32" fill="#FFFFFF" stroke="#A8998A" stroke-width="3"/>
  <circle cx="84" cy="494" r="18" fill="#FFFFFF" stroke="#B91C1C" stroke-width="4"/>
  <path d="M76.44,486.44 L91.56,501.56 M91.56,486.44 L76.44,501.56" fill="none" stroke="#B91C1C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="116" y="504" font-size="26" font-weight="700" fill="#5C5248">之前失敗的圖</text>
  <line x1="358" y1="368" x2="408" y2="368" stroke="#A8998A" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#arr)"/>
  <circle cx="383" cy="368" r="16" fill="#FFFFFF" stroke="#B91C1C" stroke-width="4"/>
  <path d="M376.28,361.28 L389.72,374.72 M389.72,361.28 L376.28,374.72" fill="none" stroke="#B91C1C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="420" y="176" width="340" height="390" rx="24" fill="#FFF8E7" stroke="#E5A300" stroke-width="5"/>
  <rect x="515" y="200" width="150" height="196" rx="8" fill="#FFFFFF" stroke="#E5A300" stroke-width="4"/>
  <g transform="translate(590,222) scale(1)" fill="#8A7F72"><circle cx="0" cy="16" r="16"/><path d="M-24,40 Q-24,34 -18,34 L18,34 Q24,34 24,40 L28,98 L16,98 L14,62 L12,98 L-12,98 L-14,62 L-16,98 L-28,98 Z"/><rect x="-12" y="96" width="10" height="56" rx="4"/><rect x="2" y="96" width="10" height="56" rx="4"/></g>
  <circle cx="665" cy="200" r="22.0" fill="#E5A300"/>
  <path d="M656.2,200 L662.8,207.7 L674.9,192.3" fill="none" stroke="#2B2622" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="590" y="456" font-size="34" font-weight="700" fill="#8A5D00" text-anchor="middle">核准過的定裝照</text>
  <text x="590" y="502" font-size="26" fill="#5C5248" text-anchor="middle">臉和身形的唯一來源</text>
  <text x="1152" y="200" font-size="28" font-weight="700" fill="#2B2622" text-anchor="end">每一張都回來對照</text>
  <rect x="860" y="222" width="292" height="92" rx="20" fill="#FFFFFF" stroke="#A8998A" stroke-width="3"/>
  <rect x="878" y="233" width="70" height="70" rx="6" fill="#FFFFFF" stroke="#5C5248" stroke-width="3"/>
  <g transform="translate(913,283) scale(0.62)" fill="#8A7F72"><circle cx="0" cy="-36" r="18"/><path d="M-32,40 L-32,6 Q-32,-12 -14,-12 L14,-12 Q32,-12 32,6 L32,40 Z"/></g>
  <text x="970" y="278" font-size="26" font-weight="700" fill="#5C5248">第 1 張</text>
  <line x1="852" y1="268" x2="770" y2="300" stroke="#E5A300" stroke-width="4" stroke-linecap="round" marker-end="url(#arrg)"/>
  <rect x="860" y="334" width="292" height="92" rx="20" fill="#FFFFFF" stroke="#A8998A" stroke-width="3"/>
  <rect x="878" y="345" width="70" height="70" rx="6" fill="#FFFFFF" stroke="#5C5248" stroke-width="3"/>
  <g transform="translate(913,395) scale(0.62)" fill="#8A7F72"><circle cx="0" cy="-36" r="18"/><path d="M-32,40 L-32,6 Q-32,-12 -14,-12 L14,-12 Q32,-12 32,6 L32,40 Z"/></g>
  <text x="970" y="390" font-size="26" font-weight="700" fill="#5C5248">第 2 張</text>
  <line x1="852" y1="380" x2="770" y2="370" stroke="#E5A300" stroke-width="4" stroke-linecap="round" marker-end="url(#arrg)"/>
  <rect x="860" y="446" width="292" height="92" rx="20" fill="#FFFFFF" stroke="#A8998A" stroke-width="3"/>
  <rect x="878" y="457" width="70" height="70" rx="6" fill="#FFFFFF" stroke="#5C5248" stroke-width="3"/>
  <g transform="translate(913,507) scale(0.62)" fill="#8A7F72"><circle cx="0" cy="-36" r="18"/><path d="M-32,40 L-32,6 Q-32,-12 -14,-12 L14,-12 Q32,-12 32,6 L32,40 Z"/></g>
  <text x="970" y="502" font-size="26" font-weight="700" fill="#5C5248">第 3 張…</text>
  <line x1="852" y1="492" x2="770" y2="440" stroke="#E5A300" stroke-width="4" stroke-linecap="round" marker-end="url(#arrg)"/>
  <rect x="48" y="596" width="1104" height="92" rx="20" fill="#FFF8E7" stroke="#E5A300" stroke-width="2"/>
  <text x="600" y="652.8" font-size="30" font-weight="700" text-anchor="middle"><tspan fill="#2B2622">只要臉有一部分借自真人照片，</tspan><tspan fill="#8A5D00">就可能像某個真人</tspan></text>
</svg>

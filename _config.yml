# Site settings
title: Swanky Studio 史旺基工作室
email: swanky.hsiao@gmail.com
description: >-
  史旺基工作室介紹創辦人史旺基結合攝影與軟體專長，展示得獎人像作品、
  敏捷技術顧問服務、專業教育訓練與NFT策展成果。
baseurl: ""
url: "https://swanky.github.io"
github_username: swanky

# Build settings
markdown: kramdown
permalink: /:categories/:title/
future: true

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - CLAUDE.md
  - AGENTS.md
  - changelog.txt
  - node_modules
  - vendor
  - docs
  # Facebook archive: keep photos accessible (referenced from posts), exclude
  # 500+ markdown files that would otherwise inflate the sitemap to 585 URLs
  # (87% archived FB posts). Photos directory stays in _site for image refs.
  - assets/facebook-archive/posts
  - assets/facebook-archive/indexes
  - assets/facebook-archive/metadata
  - assets/facebook-archive/logs
  - assets/facebook-archive/README.md
  - assets/facebook-archive/process_results.py
  # Dev-tool artifacts written into the repo during sessions. Without this,
  # every browse command touches .gstack/ and triggers a watch regenerate,
  # whose static-file mtime skip leaves the implicit primer theme's
  # style.scss output in _site and breaks local styling until a full build.
  - .gstack
  - .playwright-mcp
  # Node test tooling for the human-design calculation engine (no npm install;
  # package.json only marks assets/js/human-design/*.js as ES modules for Node)
  - package.json
  - tests
  - tools
  # Classic-novel platform: staged source text (the provenance baseline that
  # tools/import_book_chapters.mjs reads and npm test hashes against) and the
  # JSON Schemas. Both are build inputs, not pages.
  - content
  - schema
  # Print-resolution tarot originals (uniform/clonex 1024×1536 PNG masters and
  # the public-domain RWS 1080×1920 scans): kept in git for future print use,
  # but excluded from the build so they don't bloat the deployed _site.
  - assets/img/tarot/print
  # Pre-compression image originals (*.original.*): kept in git as off-site
  # backup (2026-07-04), excluded from the deployed site for the same reason.
  - assets/img/*.original.*
  - assets/img/**/*.original.*
  # OurSong NFT 作品原圖（單張 3–11 MB，共約 220 MB）：頁面用 nft/oursong/web/
  # 的壓縮版，原圖留在 git 作為存檔，不進部署。
  - nft/oursong/_freepass
  - nft/oursong/gaga840928
  - nft/oursong/nnszea
  - nft/oursong/ruru419
  - nft/oursong/selena0925
  - nft/oursong/sixian0909
  - nft/oursong/tinaaaaalee
  - nft/oursong/vickychu

# Keep these files even though they start with underscore or dot
include:
  - _headers

# Collections
collections:
  jinpingmei:
    output: true
    sort_by: chapter
  jinpingmei_characters:
    output: true
    sort_by: order
  # Multi-book platform: every non-flagship work's chapters live here, keyed by
  # book_id/edition_id front matter (see _data/books.yml). One collection rather
  # than one per book, so adding a work needs no _config.yml change.
  books:
    output: true
    sort_by: chapter

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: "nft"
    values:
      layout: null
  # Third-party vendor libraries and nft mini-site internal assets render 200
  # but have no search value — keep their html/pdf out of sitemap.xml.
  - scope:
      path: "assets/vendor"
    values:
      sitemap: false
  - scope:
      path: "nft/assets"
    values:
      sitemap: false

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

# Site settings
title: Swanky Studio 史旺基工作室
email: swanky.hsiao@gmail.com
description: >-
  史旺基工作室介紹創辦人蕭宇程結合攝影與軟體專長，展示得獎人像作品、
  敏捷技術顧問服務、專業教育訓練與NFT策展成果。
baseurl: ""
url: "https://swanky.github.io"
github_username: swanky

# Build settings
markdown: kramdown
permalink: /:categories/:title/

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - CLAUDE.md
  - changelog.txt
  - node_modules
  - vendor
  - docs

# Keep these files even though they start with underscore or dot
include:
  - _headers

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: "nft"
    values:
      layout: null

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-feed

{% comment %}
faq-jsonld.html — FAQPage JSON-LD（與 faq-accordion.html 吃同一份 page.faq）。
front matter 字串不跑 Liquid，故本 include 放頁面 body（Google 接受 body 內 JSON-LD）。
參數：faq（[{q, a}, …]）
{% endcomment %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {% for item in include.faq %}{ "@type": "Question", "name": {{ item.q | jsonify }}, "acceptedAnswer": { "@type": "Answer", "text": {{ item.a | jsonify }} } }{% unless forloop.last %},
    {% endunless %}{% endfor %}
  ]
}
</script>

<!-- 媒體報導 NewsArticle 結構化資料：報導主體為史旺基（about），補強知識圖譜實體 -->
{% if page.source_name %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "NewsArticle",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | default: site.description | jsonify }},
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  {% if page.author %}"author": { "@type": "Person", "name": {{ page.author | jsonify }} },{% endif %}
  "publisher": {
    "@type": "Organization",
    "name": {{ page.source_name | jsonify }}{% if page.source_url %},
    "url": {{ page.source_url | jsonify }}{% endif %}
  },
  "about": {
    "@type": "Person",
    "name": "史旺基",
    "alternateName": ["Swanky Hsiao", "蕭宇程"],
    "url": "{{ '/' | absolute_url }}"
  },
  "image": "{% if page.cover_image %}{{ page.cover_image | absolute_url }}{% else %}{{ '/assets/img/About_r.jpg' | absolute_url }}{% endif %}",
  "mainEntityOfPage": { "@type": "WebPage", "@id": "{{ page.url | absolute_url }}" },
  "url": "{{ page.url | absolute_url }}"
}
</script>
{% endif %}

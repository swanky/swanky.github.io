{% capture jsonld_pdf %}{% include photography/download-url.html path=book.pdf %}{% endcapture %}
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"ImageGallery","name":{{ book.title | jsonify }},"description":{{ book.description | append: ' ' | append: book.disclosure | jsonify }},"url":{{ page.url | absolute_url | jsonify }},"image":{{ book.cover | absolute_url | jsonify }},"datePublished":{{ book.date | jsonify }},"inLanguage":"zh-TW","creator":{"@type":"Person","name":"史旺基 Swanky"},"associatedMedia":[{% for p in book.photos %}{% capture public_image %}{% include flickr/url.html id=p.flickr_id image=p.image %}{% endcapture %}{"@type":"ImageObject","name":{{ p.title | jsonify }},"caption":{{ p.caption | jsonify }},"contentUrl":{{ public_image | strip | absolute_url | jsonify }},"width":{{ p.width }},"height":{{ p.height }},"sameAs":{{ p.flickr_url | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}],"hasPart":{"@type":"Book","name":{{ book.title | jsonify }},"numberOfPages":{{ book.pdf_pages }},"url":{{ jsonld_pdf | strip | absolute_url | jsonify }},"inLanguage":"zh-TW"}}
</script>

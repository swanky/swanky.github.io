{% comment %}
  插畫位。src 有值＝顯示定稿圖；沒有＝顯示「插畫製作中」佔位（規格代號只放在 data-code，訪客看不到）。
  參數：src, alt, code（規格代號，如 L1）, desc（內部說明，不顯示）, caption, eager（hero 用：true 時優先載入）, width, height
{% endcomment %}
{% if include.src %}
<figure class="ae-illus">
  <img src="{{ include.src | relative_url }}" alt="{{ include.alt }}"{% if include.width %} width="{{ include.width }}" height="{{ include.height }}"{% endif %}{% if include.eager %} loading="eager" fetchpriority="high"{% else %} loading="lazy"{% endif %} decoding="async">
  {% if include.caption %}<figcaption>{{ include.caption }}</figcaption>{% endif %}
</figure>
{% else %}
<figure class="ae-illus ae-illus--pending" aria-hidden="true" data-code="{{ include.code }}">
  <div><b>插畫製作中</b></div>
</figure>
{% endif %}

{%- comment -%}
古典小說通用層的「點圖看大圖」（放 body 結尾；配對的 CSS link 由呼叫端放 head）。
selector 用 .bk-zoom——與金瓶梅的 .jpm-zoom、全站 main.js 的 .portfolio-lightbox 分開，互不干擾。
與 _includes/jinpingmei/lightbox.html 同源自 glightbox；若兩邊設定開始分歧，依
docs/novel-platform/architecture.md §5 的收斂條件抽成單一共用 include。
{%- endcomment -%}
<script src="{{ '/assets/vendor/glightbox/js/glightbox.min.js' | relative_url }}" defer></script>
<script>
  window.addEventListener('load', function () {
    if (typeof GLightbox === 'undefined') return;
    GLightbox({
      selector: '.bk-zoom',
      loop: true,
      zoomable: true,
      touchNavigation: true,
      keyboardNavigation: true,
      openEffect: 'fade',
      closeEffect: 'fade'
    });
  });
</script>

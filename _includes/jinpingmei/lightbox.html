{%- comment -%}
金瓶梅系列頁面的「點圖看大圖」。
這些頁面是 layout: null 的獨立 HTML，不經 _includes/head.html 與 scripts.html，
所以 glightbox 要在這裡自帶。CSS 另外由 _includes/jinpingmei/lightbox-css.html 放在 head。
selector 用 .jpm-zoom，與全站 main.js 的 .portfolio-lightbox 分開，兩者互不干擾。
{%- endcomment -%}
<script src="{{ '/assets/vendor/glightbox/js/glightbox.min.js' | relative_url }}" defer></script>
<script>
  window.addEventListener('load', function () {
    if (typeof GLightbox === 'undefined') return;
    GLightbox({
      selector: '.jpm-zoom',
      loop: true,           // 同一組的最後一張再按下一張會回到第一張
      zoomable: true,
      touchNavigation: true,    // 手機左右滑
      keyboardNavigation: true, // 鍵盤左右鍵切換、Esc 關閉
      openEffect: 'fade',
      closeEffect: 'fade'
    });
  });
</script>

{%- comment -%}
  編輯式分區標題：英文 eyebrow + 區塊編號 + 中文大標 + 副標。
  借鏡 huasheng.ai 的雜誌式分區，用亮色金 #E5A300 重譯。
  參數：
    en   — 英文 eyebrow（small-caps，必填）
    zh   — 中文大標（必填，可用 <em> 標金色強調）
    lead — 副標說明（選填）
{%- endcomment -%}
<div class="section-eyebrow" data-aos="fade-up">
  <span class="eyebrow">{{ include.en }}</span>
  <h2>{{ include.zh }}</h2>
  {% if include.lead %}<p class="lead">{{ include.lead }}</p>{% endif %}
</div>

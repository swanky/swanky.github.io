{% if page.course_name %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Course",
  "name": {{ page.course_name | jsonify }},
  "description": {{ page.description | jsonify }},
  "provider": {
    "@type": "Person",
    "name": "史旺基",
    "alternateName": ["Swanky Hsiao", "蕭宇程"],
    "url": "https://swanky.github.io"
  },
{%- comment %}付費課程不放 offers／價格（站上一律依需求報價）；course_mode／course_location 讓實體課標出上課地點。{% endcomment %}
{%- if page.course_free %}
  "inLanguage": "zh-TW",
  "isAccessibleForFree": true,
  "offers": {"@type": "Offer", "price": 0, "priceCurrency": "TWD", "category": "Free", "availability": "https://schema.org/InStock"},
  "hasCourseInstance": {"@type": "CourseInstance", "courseMode": "online", "courseWorkload": {{ page.course_workload | default: "PT2H" | jsonify }}},
{%- if page.og_image %}
  "image": {{ page.og_image | absolute_url | jsonify }},
{%- endif %}
{%- if page.course_module %}
{%- assign cm = site.data.ai_learn.modules | where: "slug", page.course_module | first %}
  "hasPart": [
{%- assign cm_parts = cm.chapters | where: "status", "published" %}
{%- for ch in cm_parts %}
    {"@type": "LearningResource", "name": {{ ch.title | jsonify }}, "description": {{ ch.summary | jsonify }}, "url": {{ cm.url | append: ch.slug | append: '/' | absolute_url | jsonify }}, "inLanguage": "zh-TW", "isAccessibleForFree": true}{% unless forloop.last %},{% endunless %}
{%- endfor %}
  ],
{%- endif %}
{%- endif %}
{%- if page.course_mode and page.course_free != true %}
  "inLanguage": "zh-TW",
{%- if page.og_image %}
  "image": {{ page.og_image | absolute_url | jsonify }},
{%- endif %}
{%- if page.course_teaches %}
  "teaches": {{ page.course_teaches | jsonify }},
{%- endif %}
{%- if page.course_audience %}
  "audience": {"@type": "EducationalAudience", "audienceType": {{ page.course_audience | jsonify }}},
{%- endif %}
  "hasCourseInstance": {
    "@type": "CourseInstance",
    "courseMode": {{ page.course_mode | jsonify }},
{%- if page.course_workload %}
    "courseWorkload": {{ page.course_workload | jsonify }},
{%- endif %}
{%- comment %}course_location 可寫單一城市，或用 YAML 清單列多個城市（輸出多個 Place）。{% endcomment %}
{%- if page.course_location %}
{%- assign locs = page.course_location %}{% if locs.first == nil %}{% assign locs = page.course_location | split: "|" %}{% endif %}
    "location": [{% for loc in locs %}{"@type": "Place", "name": {{ loc | jsonify }}, "address": {"@type": "PostalAddress", "addressLocality": {{ loc | jsonify }}, "addressCountry": "TW"}}{% unless forloop.last %}, {% endunless %}{% endfor %}],
{%- endif %}
    "instructor": {"@type": "Person", "name": "史旺基", "url": "https://swanky.github.io"}
  },
{%- endif %}
  "url": "{{ page.url | absolute_url }}"
}
</script>
{% endif %}
